取り付ける)。比喩的に「愛着を持つ」の意味でも使われる(be attached to)。", "relatedInfo": "be attached to ~ で「~に愛着がある」という意味になる。"}, {"id": 28, "type": "correction", "category": "文法パターン・構文", "hint": "人々に必要なものを与える、供給する、という意味の構文です。", "question": "The school [[provided the students for]] new textbooks.", "wrongPart": "provided the students for", "answer": "provided the students with", "fullSentence": "The school provided the students with new textbooks.", "source": "IMG_0749", "explanation": "provide A with B = provide B for A(AにBを供給する)。supply, presentも同じ形をとる。", "relatedInfo": "supply A with B、present A with Bも同じ構造で使える。"}, {"id": 29, "type": "reorder", "category": "文法パターン・構文", "hint": "相手にある情報や事実を知らせる、という意味の構文です。", "tokens": ["The", "manager", "informed", "the", "staff", "of", "the", "schedule", "change."], "fullSentence": "The manager informed the staff of the schedule change.", "source": "IMG_0749", "explanation": "inform A of B(AにBを知らせる)。convey, notifyも似た構造をとる。", "relatedInfo": "notify A of Bも同じ意味・形で使われる。"}, {"id": 30, "type": "correction", "category": "文法パターン・構文", "hint": "はっきりとは断言できないが、そのように見える・思われる、という意味の構文です。", "question": "This problem [[seems be]] more complicated than we thought.", "wrongPart": "seems be", "answer": "seems to be", "fullSentence": "This problem seems to be more complicated than we thought.", "source": "IMG_0750", "explanation": "It seems that S is C = S seems to be C(~のようだ)。2つの言い換え構造は頻出。", "relatedInfo": "It appears that ~ もほぼ同じ意味で使われる。"}, {"id": 31, "type": "reorder", "category": "文法パターン・構文", "hint": "世間で広くそう言われている、という噂や評判を表す構文です。", "tokens": ["This", "restaurant", "is", "said", "to", "be", "the", "oldest", "one", "in", "the", "city."], "fullSentence": "This restaurant is said to be the oldest one in the city.", "source": "IMG_0750", "explanation": "It is said that S is C = S is said to be C(~と言われている)。believe, think, knowも同じ構造をとる。", "relatedInfo": "It is believed that ~ / S is believed to be ~ も同じパターン。"}, {"id": 32, "type": "correction", "category": "文法パターン・構文", "hint": "人ではなく物事そのものが持つ性質を表すときに使う、感情形容詞の形です。", "question": "The lecture was so [[interested]] that nobody wanted to leave.", "wrongPart": "interested", "answer": "interesting", "fullSentence": "The lecture was so interesting that nobody wanted to leave.", "source": "IMG_0753", "explanation": "物・事が主語のときは-ing形(interesting)、人が主語のときは-ed形(interested)を使う。", "relatedInfo": "excited/exciting, surprised/surprisingなど同じパターンの形容詞が多数ある。"}, {"id": 33, "type": "reorder", "category": "文法パターン・構文", "hint": "ある人やものを、実際にそうであると考える、という意味の構文です。", "tokens": ["Everyone", "believed", "him", "to", "be", "the", "most", "honest", "person", "in", "town."], "fullSentence": "Everyone believed him to be the most honest person in town.", "source": "IMG_0762", "explanation": "believe/consider/find/prove O to be C(OをCだと思う/証明する)。that節に書き換え可能。", "relatedInfo": "Everyone believed that he was ~ とthat節でも同じ意味を表せる。"}, {"id": 34, "type": "correction", "category": "文法パターン・構文", "hint": "ある物事のおかげで、人が何かをするのが以前より簡単になる、という意味の構文です。", "question": "The new app [[made it easier of us]] to book a table.", "wrongPart": "made it easier of us", "answer": "made it easier for us", "fullSentence": "The new app made it easier for us to book a table.", "source": "IMG_0771", "explanation": "make it C for 人 to V(人が~するのをCにする)。形式目的語itを使う頻出構文。", "relatedInfo": "形式目的語のitは後ろのto不定詞の内容を指す。"}, {"id": 35, "type": "reorder", "category": "文法パターン・構文", "hint": "一方が変化するにつれて、もう一方も同じように変化していく、という意味の構文です。", "tokens": ["The", "harder", "you", "try,", "the", "more", "you", "improve."], "fullSentence": "The harder you try, the more you improve.", "source": "IMG_0757", "explanation": "The 比較級 SV, the 比較級 SV(~すればするほど…)。2つの比較級を対応させる。", "relatedInfo": "The more, the better.(多ければ多いほど良い)のように短縮した形もよく使われる。"}, {"id": 36, "type": "correction", "category": "文法パターン・構文", "hint": "ある人やものを、頭の中で別の何かであると位置づけて考える、という意味の構文です。", "question": "Most students [[think of him to be]] a strict but fair teacher.", "wrongPart": "think of him to be", "answer": "think of him as", "fullSentence": "Most students think of him as a strict but fair teacher.", "source": "IMG_0758", "explanation": "think of A as B(AをBとみなす)。regard A as B, see A as Bも同じ構造。", "relatedInfo": "regard A as B、see A as Bも同じ意味で使える表現。"}, {"id": 37, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "良い結果になった理由を述べるときに使う、前置詞的な表現です。", "tokens": ["Thanks", "to", "the", "new", "highway,", "the", "trip", "now", "takes", "only", "an", "hour."], "fullSentence": "Thanks to the new highway, the trip now takes only an hour.", "source": "IMG_0748", "explanation": "thanks to = because of = owing to = due to = by virtue of = on account of(~のおかげで)。", "relatedInfo": "thanks toは良い結果に、because ofは中立的に使われることが多い。"}, {"id": 38, "type": "correction", "category": "接続詞・前置詞表現", "hint": "前半の内容と対立するような後半の内容を続けるときに使う接続詞です。", "question": "[[Despite]] the exam was difficult, most students passed it.", "wrongPart": "Despite", "answer": "though", "fullSentence": "Though the exam was difficult, most students passed it.", "source": "IMG_0751", "explanation": "though = although = even though(~だけれども)。文頭にも文中にも置ける。", "relatedInfo": "thoughは文末に置いて「でも」という意味の副詞としても使われる。"}, {"id": 39, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "2つのものを比べて、その違いを対比的に示すときに使う接続詞です。", "tokens": ["City", "life", "is", "fast-paced,", "whereas", "country", "life", "is", "calm", "and", "slow."], "fullSentence": "City life is fast-paced, whereas country life is calm and slow.", "source": "IMG_0751", "explanation": "while = whereas(一方で)。2つの事柄を対比するときに使う。", "relatedInfo": "whileは「~している間」という時間の意味でも使われるので文脈に注意。"}, {"id": 40, "type": "correction", "category": "接続詞・前置詞表現", "hint": "前の内容を否定して、むしろ逆であることを強調するときに使う表現です。", "question": "I didn't dislike the movie; [[on the other hand]], I loved it.", "wrongPart": "on the other hand", "answer": "on the contrary", "fullSentence": "I didn't dislike the movie; on the contrary, I loved it.", "source": "IMG_0751", "explanation": "on the contrary(それどころか)。前の内容を打ち消して逆の内容を続けるときに使う。", "relatedInfo": "on the other hand(一方で)は対比、on the contraryは否定・逆転のニュアンス。"}, {"id": 41, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "一般的な予想や期待とは反対の内容を述べるときに使う前置詞句です。", "tokens": ["Contrary", "to", "popular", "belief,", "the", "plan", "actually", "worked", "well."], "fullSentence": "Contrary to popular belief, the plan actually worked well.", "source": "IMG_0751", "explanation": "contrary to ~ (~とは反対に)。予想や期待に反する事実を導入する。", "relatedInfo": "in contrast to ~ も似た意味だが対比のニュアンスが強い。"}, {"id": 42, "type": "correction", "category": "接続詞・前置詞表現", "hint": "実際にはそうではないが、まるでそうであるかのように、と述べるときに使う接続詞です。", "question": "He talked about the plan [[even if]] it were already decided.", "wrongPart": "even if", "answer": "as if", "fullSentence": "He talked about the plan as if it were already decided.", "source": "IMG_0751", "explanation": "as if = as though(まるで~であるかのように)。仮定法過去を伴うことが多い。", "relatedInfo": "現実と異なる内容にはas if + 仮定法過去(were)が使われる。"}, {"id": 43, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "ある条件に影響されず、それに関係なく物事が起こることを示す表現です。", "tokens": ["Regardless", "of", "the", "weather,", "the", "festival", "will", "be", "held", "as", "planned."], "fullSentence": "Regardless of the weather, the festival will be held as planned.", "source": "IMG_0760", "explanation": "regardless of = irrespective of(~に関わらず)。後ろには名詞または名詞節が続く。", "relatedInfo": "no matter what/how ~ もほぼ同じ意味で使える。"}, {"id": 44, "type": "correction", "category": "接続詞・前置詞表現", "hint": "ある新しい状況になったことを理由として、続く内容を述べるときに使う接続詞です。", "question": "[[Even that]] the exams are over, we can finally relax.", "wrongPart": "Even that", "answer": "now that", "fullSentence": "Now that the exams are over, we can finally relax.", "source": "IMG_0745", "explanation": "now that SV(今や~なので)。becauseに近いが、状況の変化を前提とするニュアンスがある。", "relatedInfo": "seeing that ~ も似た意味で「~であるから」を表す。"}, {"id": 45, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "ある行動を取る目的を表すときに使う接続詞です。", "tokens": ["She", "spoke", "slowly", "so", "that", "everyone", "could", "understand", "her."], "fullSentence": "She spoke slowly so that everyone could understand her.", "source": "IMG_0746", "explanation": "so that SV(~するために)。canやwillなどの助動詞を伴うことが多い。", "relatedInfo": "in order that ~ もほぼ同じ意味だが、やや硬い表現。"}, {"id": 46, "type": "correction", "category": "接続詞・前置詞表現", "hint": "程度がとても激しく、その結果ある事態が起こる、という意味の構文です。", "question": "The noise was [[so that]] nobody could concentrate on work.", "wrongPart": "so that", "answer": "such that", "fullSentence": "The noise was such that nobody could concentrate on work.", "source": "IMG_0776", "explanation": "such that SV(とても~なのでSVする)。so 形容詞 that とほぼ同じ意味。", "relatedInfo": "so 形容詞/副詞 that SVという形とセットで覚えると良い。"}, {"id": 47, "type": "reorder", "category": "接続詞・前置詞表現", "hint": "2つのものを比べたときの違いを示すときに使う前置詞です。", "tokens": ["Unlike", "his", "brother,", "Tom", "has", "never", "been", "interested", "in", "sports."], "fullSentence": "Unlike his brother, Tom has never been interested in sports.", "source": "IMG_0766", "explanation": "unlike ~ (~とは違って)。文頭にも文中にも置ける前置詞。", "relatedInfo": "differently from ~ も似た意味の表現。"}, {"id": 48, "type": "correction", "category": "接続詞・前置詞表現", "hint": "ある提案や意見に対して賛成の立場を取るときに使う表現です。", "question": "Most committee members voted [[in favor for]] the new policy.", "wrongPart": "in favor for", "answer": "in favor of", "fullSentence": "Most committee members voted in favor of the new policy.", "source": "IMG_0780", "explanation": "in favor of ~ (~に賛成して)。反対はagainstまたはopposed to。", "relatedInfo": "be in favor of ~ ing の形でも使われる。"}, {"id": 49, "type": "reorder", "category": "時を表す表現", "hint": "ある時点になるまでに、それより前にある動作が完了していることを表す接続詞です。", "tokens": ["By", "the", "time", "we", "arrived,", "the", "concert", "had", "already", "started."], "fullSentence": "By the time we arrived, the concert had already started.", "source": "IMG_0752", "explanation": "by the time SV(~するまでには)。主節はしばしば過去完了・未来完了になる。", "relatedInfo": "untilは「継続」、by the timeは「期限」のニュアンスの違いに注意。"}, {"id": 50, "type": "correction", "category": "時を表す表現", "hint": "ある時点までずっと同じ状態や動作が続くことを表す接続詞です。", "question": "Please wait here [[by]] I come back.", "wrongPart": "by", "answer": "until", "fullSentence": "Please wait here until I come back.", "source": "IMG_0752", "explanation": "until/till SV(~するまでずっと)。継続を表す動詞と共に使われることが多い。", "relatedInfo": "by the timeは「期限」、untilは「継続」を表す点で異なる。"}, {"id": 51, "type": "reorder", "category": "時を表す表現", "hint": "ある出来事が起こった直後に、別の出来事が続けて起こることを表す接続詞です。", "tokens": ["Call", "me", "as", "soon", "as", "you", "arrive", "at", "the", "station."], "fullSentence": "Call me as soon as you arrive at the station.", "source": "IMG_0752", "explanation": "as soon as = the moment = directly SV(~するとすぐに)。", "relatedInfo": "the moment SV、directly SVも同じ意味で使える。"}, {"id": 52, "type": "correction", "category": "時を表す表現", "hint": "ある行動が起こる度に必ず、という意味を表す接続詞です。", "question": "[[Whatever]] I visit Kyoto, I stop by the same old shrine.", "wrongPart": "Whatever", "answer": "whenever", "fullSentence": "Whenever I visit Kyoto, I stop by the same old shrine.", "source": "IMG_0752", "explanation": "every time = each time = whenever SV(~する度に)。", "relatedInfo": "every time SV / each time SVもほぼ同じ意味で使える。"}, {"id": 53, "type": "reorder", "category": "時を表す表現", "hint": "以前は一度も経験していなかったことを、初めて経験する、という意味の表現です。", "tokens": ["I", "visited", "Okinawa", "for", "the", "first", "time", "last", "summer."], "fullSentence": "I visited Okinawa for the first time last summer.", "source": "IMG_0752", "explanation": "for the first time(初めて)⇔ at first(最初は)の違いに注意。", "relatedInfo": "at firstは「初めのうちは(その後変化する)」というニュアンス。"}, {"id": 54, "type": "correction", "category": "時を表す表現", "hint": "ある出来事がそう遠くない未来に起こるだろう、と述べるときに使う構文です。", "question": "[[It won't be long after]] the cherry blossoms start to fall.", "wrongPart": "It won't be long after", "answer": "It won't be long before", "fullSentence": "It won't be long before the cherry blossoms start to fall.", "source": "IMG_0752", "explanation": "It won't be long before SV(まもなく~するだろう)。", "relatedInfo": "Soon, ~ とほぼ同じ意味を表せる。"}, {"id": 55, "type": "reorder", "category": "時を表す表現", "hint": "ある出来事が起こった直後にすぐ次の出来事が起こる、という意味の倒置構文です。", "tokens": ["No", "sooner", "had", "she", "arrived", "than", "the", "meeting", "began."], "fullSentence": "No sooner had she arrived than the meeting began.", "source": "IMG_0756", "explanation": "No sooner had S Vpp than SV = Hardly had S Vpp when SV(~するとすぐに…した)。否定語が文頭に来ると倒置が起こる。", "relatedInfo": "Hardly had she arrived when the meeting began. も同じ意味。"}, {"id": 56, "type": "correction", "category": "時を表す表現", "hint": "ある行動が起きて初めて、次のことが実現した、という意味を強調する構文です。", "question": "It was [[not until he apologized when]] she forgave him.", "wrongPart": "not until he apologized when", "answer": "not until he apologized that", "fullSentence": "It was not until he apologized that she forgave him.", "source": "IMG_0756", "explanation": "It is not until ~ that SV(~して初めて…)。強調構文の一種。", "relatedInfo": "Not until he apologized did she forgive him. と倒置形でも表せる。"}, {"id": 57, "type": "reorder", "category": "時を表す表現", "hint": "今この瞬間、まさに現在という時を強調する表現です。", "tokens": ["I", "can't", "talk", "right", "now;", "I'm", "in", "a", "meeting."], "fullSentence": "I can't talk right now; I'm in a meeting.", "source": "IMG_0747", "explanation": "right now = just now(たった今)。ただしjust nowは過去形の文でも使われる点に注意。", "relatedInfo": "just nowは過去の出来事「ついさっき」の意味でも使われる。"}, {"id": 58, "type": "correction", "category": "時を表す表現", "hint": "ある状態が実現しさえすれば、その後は自動的に次のことが起こる、という意味の接続詞です。", "question": "[[Ones]] you understand the rule, the game becomes very simple.", "wrongPart": "Ones", "answer": "once", "fullSentence": "Once you understand the rule, the game becomes very simple.", "source": "IMG_0781", "explanation": "once SV(いったん~すると)。条件と時の両方のニュアンスを持つ。", "relatedInfo": "as soon asと似ているが、onceは「一度~したら」という条件的な意味合いが強い。"}, {"id": 59, "type": "reorder", "category": "時を表す表現", "hint": "重要な出来事や変化が、近い将来に起こりそうだ、という意味の表現です。", "tokens": ["A", "major", "change", "in", "the", "industry", "is", "on", "the", "horizon."], "fullSentence": "A major change in the industry is on the horizon.", "source": "IMG_0778", "explanation": "be on the horizon(間近に迫っている)。将来起こりそうな出来事を暗示する表現。", "relatedInfo": "be around the corner も似た意味で使われる。"}, {"id": 60, "type": "correction", "category": "時を表す表現", "hint": "以前はそうだったが、今はもうそうではない、という変化を表す表現です。", "question": "This old factory is [[no more longer]] in use.", "wrongPart": "no more longer", "answer": "no longer", "fullSentence": "This old factory is no longer in use.", "source": "IMG_0780", "explanation": "no longer = not ~ any more(もはや~ない)。", "relatedInfo": "not ~ any longer も同じ意味で使える。"}, {"id": 61, "type": "reorder", "category": "数量・比較表現", "hint": "正確な数はわからないが、とても多くの人や物があることを表す数量表現です。", "tokens": ["Millions", "of", "people", "watched", "the", "final", "match", "on", "TV."], "fullSentence": "Millions of people watched the final match on TV.", "source": "IMG_0747", "explanation": "millions of = thousands of = hundreds of = dozens of(何百万/何千/何百/数十もの)。", "relatedInfo": "複数形のsを忘れないこと(million of Xとは言わない)。"}, {"id": 62, "type": "correction", "category": "数量・比較表現", "hint": "全体のうち、大部分・過半数を占める部分を表す数量表現です。", "question": "[[Most the students]] in this class passed the exam.", "wrongPart": "Most the students", "answer": "most of the students", "fullSentence": "Most of the students in this class passed the exam.", "source": "IMG_0750", "explanation": "most of the + 名詞(~のほとんど)。theをつけるかどうかで意味が変わる点に注意。", "relatedInfo": "most students(一般論)とmost of the students(特定のグループ)の違いに注意。"}, {"id": 63, "type": "reorder", "category": "数量・比較表現", "hint": "グループの中の一人一人に注目して述べるときに使う数量表現です。", "tokens": ["Each", "of", "the", "members", "was", "asked", "to", "give", "a", "short", "speech."], "fullSentence": "Each of the members was asked to give a short speech.", "source": "IMG_0750", "explanation": "all of / each of / every / any of(すべての/それぞれの/いずれかの)。each ofは単数扱い。", "relatedInfo": "each ofの後の動詞は単数形になる点に注意(was, not were)。"}, {"id": 64, "type": "correction", "category": "数量・比較表現", "hint": "数えられる名詞について、数がとても少ないことを強調する表現です。", "question": "[[Only a little]] students knew the answer to the question.", "wrongPart": "Only a little", "answer": "only a few", "fullSentence": "Only a few students knew the answer to the question.", "source": "IMG_0770", "explanation": "only a few = only a little(ほんの少ししか~ない)。fewは数えられる名詞、littleは数えられない名詞に使う。", "relatedInfo": "a few(少しはある)とfew(ほとんどない)のニュアンスの違いにも注意。"}, {"id": 65, "type": "reorder", "category": "数量・比較表現", "hint": "数えられない名詞について、量がとても少ないことを表す形容詞です。", "tokens": ["There", "is", "little", "water", "left", "in", "the", "bottle."], "fullSentence": "There is little water left in the bottle.", "source": "IMG_0770", "explanation": "few ⇔ little(数えられる名詞/数えられない名詞の「少ない」)。", "relatedInfo": "fewは可算名詞、littleは不可算名詞に使う点が最大の違い。"}, {"id": 66, "type": "correction", "category": "数量・比較表現", "hint": "他のどんな人にも劣らないほど優れている、という意味の比較表現です。", "question": "She is [[as smart than any student]] in the school.", "wrongPart": "as smart than any student", "answer": "as smart as any student", "fullSentence": "She is as smart as any student in the school.", "source": "IMG_0772", "explanation": "as ~ as any(どの~にも劣らず)。最上級に近い意味を持つ比較表現。", "relatedInfo": "as ~ as anyone (誰にも劣らず)という形もよく使われる。"}, {"id": 67, "type": "reorder", "category": "数量・比較表現", "hint": "数万にのぼるほどの、非常に大きな数を表す表現です。", "tokens": ["Tens", "of", "thousands", "of", "fans", "gathered", "outside", "the", "stadium."], "fullSentence": "Tens of thousands of fans gathered outside the stadium.", "source": "IMG_0764", "explanation": "tens of thousands of ~ (何万もの~)。hundreds of, millions ofと同じ仲間。", "relatedInfo": "hundreds of thousands of ~ で「数十万もの」という意味になる。"}, {"id": 68, "type": "correction", "category": "数量・比較表現", "hint": "実際にはそれ以上の価値や意味がない、という限定を表す表現です。", "question": "The rumor turned out to be [[nothing less than]] gossip.", "wrongPart": "nothing less than", "answer": "nothing more than", "fullSentence": "The rumor turned out to be nothing more than gossip.", "source": "IMG_0760", "explanation": "nothing more than ~ = only(~にすぎない)。", "relatedInfo": "nothing but ~ も同じく「~にすぎない」という意味で使える。"}, {"id": 69, "type": "reorder", "category": "数量・比較表現", "hint": "現実的にできる限りの最大限の程度で、という意味の比較表現です。", "tokens": ["Please", "finish", "the", "report", "as", "fast", "as", "possible."], "fullSentence": "Please finish the report as fast as possible.", "source": "IMG_0772", "explanation": "as ~ as S can = as ~ as possible(できるだけ~)。", "relatedInfo": "as soon as possible (できるだけ早く)は特によく使われる表現。"}, {"id": 70, "type": "correction", "category": "数量・比較表現", "hint": "程度がグループの中で一番低いことを表す最上級の表現です。", "question": "This was the [[less popular]] dish on the menu.", "wrongPart": "less popular", "answer": "least popular", "fullSentence": "This was the least popular dish on the menu.", "source": "IMG_0781", "explanation": "less ~ than ever = least ~ (最も~でない)。leastはlessの最上級。", "relatedInfo": "most ~ (最も~)の反対の意味になる最上級。"}, {"id": 71, "type": "reorder", "category": "数量・比較表現", "hint": "1と半分という中途半端な数量を、通貨の単位で表す表現です。", "tokens": ["This", "pen", "costs", "one", "dollar", "and", "a", "half."], "fullSentence": "This pen costs one dollar and a half.", "source": "IMG_0773", "explanation": "one dollar and a half = one and a half dollars(1ドル50セント)。語順が2通りある。", "relatedInfo": "one and a half hours = an hour and a half (1時間半)も同じパターン。"}, {"id": 72, "type": "correction", "category": "数量・比較表現", "hint": "1週間のうちに2回、という頻度を表す表現です。", "question": "She goes to the gym [[two times in a week]].", "wrongPart": "two times in a week", "answer": "twice a week", "fullSentence": "She goes to the gym twice a week.", "source": "IMG_0775", "explanation": "twice a week(週に2回)。「~につき」の意味でaを使う。", "relatedInfo": "once a month(月に1回)、three times a year(年に3回)も同じ形。"}, {"id": 73, "type": "reorder", "category": "仮定法・条件表現", "hint": "これから起こるかもしれない出来事を想定して、その対応を尋ねる表現です。", "tokens": ["What", "if", "it", "rains", "during", "the", "outdoor", "concert?"], "fullSentence": "What if it rains during the outdoor concert?", "source": "IMG_0755", "explanation": "What if SV(過去形)(もし~したらどうする?)。未来の可能性についての心配や提案を表す。", "relatedInfo": "What would you do if ~ よりも軽いニュアンスで使われることが多い。"}, {"id": 74, "type": "correction", "category": "仮定法・条件表現", "hint": "現実にはありえない立場を仮定して、相手にどうするか尋ねる表現です。", "question": "[[What will you do if you were]] the president of this company?", "wrongPart": "What will you do if you were", "answer": "what would you do if you were", "fullSentence": "What would you do if you were the president of this company?", "source": "IMG_0755", "explanation": "What would you do if S did(過去形)(もし~だったらどうする?)。仮定法過去。", "relatedInfo": "ifの後は過去形(were)を使うのが原則(仮定法過去)。"}, {"id": 75, "type": "reorder", "category": "仮定法・条件表現", "hint": "過去の出来事について、もし事情が違っていたらどうしていたかを尋ねる表現です。", "tokens": ["What", "would", "you", "have", "done", "if", "you", "had", "known", "the", "truth", "earlier?"], "fullSentence": "What would you have done if you had known the truth earlier?", "source": "IMG_0755", "explanation": "What would you have done if S had done(もし~だったらどうしていた?)。仮定法過去完了。", "relatedInfo": "過去の事実に反する仮定にはhad + 過去分詞(過去完了)を使う。"}, {"id": 76, "type": "correction", "category": "仮定法・条件表現", "hint": "ある目的を達成するために行動する、という意味を表すフォーマルな構文です。", "question": "They left early [[so as save]] time.", "wrongPart": "so as save", "answer": "so as to save", "fullSentence": "They left early so as to save time.", "source": "IMG_0757", "explanation": "so as to V = in order to V(~するために)。", "relatedInfo": "in order to V も同じ意味で使えるが、so as toは主語が同じ場合に特によく使われる。"}, {"id": 77, "type": "reorder", "category": "仮定法・条件表現", "hint": "ある望ましくない結果が起きないようにするために行動する、という意味の構文です。", "tokens": ["She", "closed", "the", "door", "quietly", "so", "as", "not", "to", "wake", "the", "baby."], "fullSentence": "She closed the door quietly so as not to wake the baby.", "source": "IMG_0757", "explanation": "so as not to V = in order not to V(~しないように)。notの位置に注意。", "relatedInfo": "in order not to V も同じ意味で使える。"}, {"id": 78, "type": "correction", "category": "仮定法・条件表現", "hint": "ある条件が満たされない場合に限って、という意味を表す接続詞です。", "question": "You won't pass the exam [[until]] you study harder.", "wrongPart": "until", "answer": "unless", "fullSentence": "You won't pass the exam unless you study harder.", "source": "IMG_0768", "explanation": "unless = if not(~しない限り)。否定の条件を表す。", "relatedInfo": "if ~ not と書き換えられる(if you don't study harder)。"}, {"id": 79, "type": "reorder", "category": "仮定法・条件表現", "hint": "その条件が成立する場合に限ってのみ、ということを強調する表現です。", "tokens": ["You", "can", "enter", "the", "lab", "only", "if", "you", "have", "a", "permit."], "fullSentence": "You can enter the lab only if you have a permit.", "source": "IMG_0781", "explanation": "only if SV(~の場合に限って)。ifの節が満たされない限り成立しないことを強調する。", "relatedInfo": "if only ~ (~でありさえすれば)は全く違う意味になるので注意。"}, {"id": 80, "type": "correction", "category": "仮定法・条件表現", "hint": "ある条件が続く間はずっと、という条件を表す接続詞です。", "question": "You can stay here [[as far as]] you keep quiet.", "wrongPart": "as far as", "answer": "as long as", "fullSentence": "You can stay here as long as you keep quiet.", "source": "IMG_0747", "explanation": "as long as SV(~する限りは)。条件の継続を表す。", "relatedInfo": "as far as (範囲・程度)とas long as(条件・時間)の違いに注意。"}, {"id": 81, "type": "reorder", "category": "仮定法・条件表現", "hint": "ある望ましくない結果を避けるために、注意を払う、という意味の表現です。", "tokens": ["He", "was", "careful", "not", "to", "wake", "his", "roommate", "when", "he", "came", "home", "late."], "fullSentence": "He was careful not to wake his roommate when he came home late.", "source": "IMG_0757", "explanation": "be careful not to V = take care not to V(~しないように気をつける)。", "relatedInfo": "take care not to V も同じ意味で使える。"}, {"id": 82, "type": "correction", "category": "仮定法・条件表現", "hint": "ある行動を実現できるだけの十分な条件を備えている、という意味の構文です。", "question": "He is [[enough rich to buy]] that house without a loan.", "wrongPart": "enough rich to buy", "answer": "rich enough to buy", "fullSentence": "He is rich enough to buy that house without a loan.", "source": "IMG_0757", "explanation": "rich enough to V(~するのに十分裕福だ)。形容詞+enough+to Vの語順に注意(enough richは誤り)。", "relatedInfo": "enough money to V (~するのに十分なお金)のように名詞の前にはenoughを置く。"}, {"id": 83, "type": "reorder", "category": "仮定法・条件表現", "hint": "相手に、ある行動をしないようにと指示する、という意味の構文です。", "tokens": ["The", "staff", "told", "him", "not", "to", "touch", "the", "artwork."], "fullSentence": "The staff told him not to touch the artwork.", "source": "IMG_0757", "explanation": "tell 人 not to V(人に~しないように言う)。notの位置はto の直前。", "relatedInfo": "ask/order 人 not to V も同じ語順パターン。"}, {"id": 84, "type": "correction", "category": "仮定法・条件表現", "hint": "過去にしなかったことを、今になって残念に思う、という意味の仮定法表現です。", "question": "I [[wish he studied]] harder when he was young.", "wrongPart": "wish he studied", "answer": "wish he had studied", "fullSentence": "I wish he had studied harder when he was young.", "source": "IMG_0774", "explanation": "wish S had done(~であればよかったのに)。過去の事実に反する願望を表す仮定法過去完了。", "relatedInfo": "wish S did(仮定法過去)は現在の事実に反する願望を表す。"}, {"id": 85, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "病気や問題が急激ではなく、長期間にわたって続く様子を表す形容詞です。", "tokens": ["Chronic", "stress", "can", "have", "a", "serious", "effect", "on", "your", "health."], "fullSentence": "Chronic stress can have a serious effect on your health.", "source": "IMG_0748", "explanation": "chronic(慢性の)⇔ acute(急性の)。医学的な文脈でよく使われる対比語。", "relatedInfo": "acuteは「急性の、鋭い」という意味で、chronicの反対語。"}, {"id": 86, "type": "correction", "category": "語彙対比・その他語彙", "hint": "意図せず偶然に起こったことを表す形容詞です。", "question": "The fire was later found to be [[deliberate]], not intentional.", "wrongPart": "deliberate", "answer": "accidental", "fullSentence": "The fire was later found to be accidental, not intentional.", "source": "IMG_0780", "explanation": "accidental(偶然の)⇔ intentional(意図的な)。", "relatedInfo": "by accident(偶然に)⇔ on purpose(わざと)という表現も対になる。"}, {"id": 87, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "ヨーロッパから見て東側にある地域、東洋を指す言葉です。", "tokens": ["Many", "Western", "artists", "were", "fascinated", "by", "the", "Orient", "in", "the", "19th", "century."], "fullSentence": "Many Western artists were fascinated by the Orient in the 19th century.", "source": "IMG_0780", "explanation": "Occident(西洋)⇔ Orient(東洋)。やや文学的・歴史的な表現。", "relatedInfo": "Occidentalは「西洋の」、Orientalは「東洋の」という形容詞。"}, {"id": 88, "type": "correction", "category": "語彙対比・その他語彙", "hint": "試合や議論などで、自分と反対の立場に立つ相手を指す言葉です。", "question": "She shook hands with her [[supporter]] after the match.", "wrongPart": "supporter", "answer": "opponent", "fullSentence": "She shook hands with her opponent after the match.", "source": "IMG_0780", "explanation": "opponent(対戦相手、反対者)⇔ supporter/ally(支持者、味方)。", "relatedInfo": "advocate, proponent, supporter, championはいずれも「支持者・擁護者」を表す語。"}, {"id": 89, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "言葉が持つ、辞書的な意味以外の含みやニュアンスを表す名詞です。", "tokens": ["The", "word", "\"cheap\"", "has", "a", "negative", "connotation", "of", "low", "quality."], "fullSentence": "The word \"cheap\" has a negative connotation of low quality.", "source": "IMG_0767", "explanation": "connotation(含意)⇔ denotation(明示的な意味)。", "relatedInfo": "denotationは辞書に載っている文字通りの意味を指す。"}, {"id": 90, "type": "correction", "category": "語彙対比・その他語彙", "hint": "他人の意見や新しい考えを受け入れる、寛容な態度を表す形容詞です。", "question": "A good leader should be [[cold-blooded]] about new ideas.", "wrongPart": "cold-blooded", "answer": "open-minded", "fullSentence": "A good leader should be open-minded about new ideas.", "source": "IMG_0781", "explanation": "open-minded(寛容な)⇔ cold-blooded(冷酷な)。", "relatedInfo": "narrow-minded(心の狭い)も似た対比で使われる語。"}, {"id": 91, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "比喩ではなく、文字通りにそのままの意味で、ということを強調する副詞です。", "tokens": ["He", "literally", "ran", "ten", "kilometers", "without", "stopping."], "fullSentence": "He literally ran ten kilometers without stopping.", "source": "IMG_0746", "explanation": "literature(文学)/literary(文学的な)/literal(文字通りの)/literally(文字通りに)/literacy(識字力)は語源が同じ語族。", "relatedInfo": "literalの名詞形はliteralness、対義語はfigurative(比喩的な)。"}, {"id": 92, "type": "correction", "category": "語彙対比・その他語彙", "hint": "水の中でおぼれかけている、まさにその最中の状態を表す表現です。", "question": "A lifeguard rescued the boy who [[was drowned]] in the river.", "wrongPart": "was drowned", "answer": "was drowning", "fullSentence": "A lifeguard rescued the boy who was drowning in the river.", "source": "IMG_0763", "explanation": "drown(溺れる、自動詞)/be drowning(溺れかけている、進行中)/be drowned(溺死する、結果の状態)。", "relatedInfo": "be dyingとdieの関係も同様(死にかけている/死ぬ)。"}, {"id": 93, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "事故やスポーツなどでけがをした、という意味の表現です。", "tokens": ["She", "got", "hurt", "while", "playing", "basketball", "yesterday."], "fullSentence": "She got hurt while playing basketball yesterday.", "source": "IMG_0765", "explanation": "be hurt = get hurt(けがをする)。hurtは無変化動詞(hurt-hurt-hurt)。", "relatedInfo": "be injured, be woundedも似た意味で使われる受動表現。"}, {"id": 94, "type": "correction", "category": "語彙対比・その他語彙", "hint": "数え切れないほどたくさんの、という意味を表す形容詞的な表現です。", "question": "The museum displays [[a myriad for]] ancient artifacts.", "wrongPart": "a myriad for", "answer": "a myriad of", "fullSentence": "The museum displays a myriad of ancient artifacts.", "source": "IMG_0767", "explanation": "myriad(無数の)。a myriad of ~ または myriad ~ (of なし)の両方の形で使われる。", "relatedInfo": "countlessもほぼ同じ意味で使われる語。"}, {"id": 95, "type": "reorder", "category": "語彙対比・その他語彙", "hint": "表面からは気づきにくい、微妙で繊細な違いや特徴を表す名詞です。", "tokens": ["Only", "a", "native", "speaker", "can", "fully", "grasp", "the", "subtleties", "of", "the", "language."], "fullSentence": "Only a native speaker can fully grasp the subtleties of the language.", "source": "IMG_0767", "explanation": "subtleties(微妙な点、機微)。subtle(形容詞:微妙な)の名詞形。", "relatedInfo": "nuance(ニュアンス)も似た意味で使われる語。"}, {"id": 96, "type": "correction", "category": "語彙対比・その他語彙", "hint": "内容がわかりやすく、誰にでも理解できる様子を表す形容詞です。", "question": "His explanation was clear and [[intelligent]] even to beginners.", "wrongPart": "intelligent", "answer": "intelligible", "fullSentence": "His explanation was clear and intelligible even to beginners.", "source": "IMG_0781", "explanation": "intelligible(わかりやすい、理解できる)。intelligent(賢い)と混同しないよう注意。", "relatedInfo": "unintelligible(理解できない)は否定の接頭辞unがついた反対語。"}];

ip now takes only an hour.", "fullSentence": "Thanks to the new highway, the trip now takes only an hour.", "source": "IMG_0748", "explanation": "thanks to = because of = owing to = due to = by virtue of = on account of(~のおかげで)。", "relatedInfo": "thanks toは良い結果に、because ofは中立的に使われることが多い。"}, {"id": 20, "type": "free", "category": "接続詞・前置詞表現", "hint": "2つのものを比べて、その違いを対比的に示すときに使う接続詞です。", "keyPhrases": ["whereas"], "answer": "City life is fast-paced, whereas country life is calm and slow.", "fullSentence": "City life is fast-paced, whereas country life is calm and slow.", "source": "IMG_0751", "explanation": "while = whereas(一方で)。2つの事柄を対比するときに使う。", "relatedInfo": "whileは「~している間」という時間の意味でも使われるので文脈に注意。"}, {"id": 21, "type": "free", "category": "接続詞・前置詞表現", "hint": "一般的な予想や期待とは反対の内容を述べるときに使う前置詞句です。", "keyPhrases": ["contrary", "to"], "answer": "Contrary to popular belief, the plan actually worked well.", "fullSentence": "Contrary to popular belief, the plan actually worked well.", "source": "IMG_0751", "explanation": "contrary to ~ (~とは反対に)。予想や期待に反する事実を導入する。", "relatedInfo": "in contrast to ~ も似た意味だが対比のニュアンスが強い。"}, {"id": 22, "type": "free", "category": "接続詞・前置詞表現", "hint": "ある条件に影響されず、それに関係なく物事が起こることを示す表現です。", "keyPhrases": ["regardless", "of"], "answer": "Regardless of the weather, the festival will be held as planned.", "fullSentence": "Regardless of the weather, the festival will be held as planned.", "source": "IMG_0760", "explanation": "regardless of = irrespective of(~に関わらず)。後ろには名詞または名詞節が続く。", "relatedInfo": "no matter what/how ~ もほぼ同じ意味で使える。"}, {"id": 23, "type": "free", "category": "接続詞・前置詞表現", "hint": "ある行動を取る目的を表すときに使う接続詞です。", "keyPhrases": ["so", "that"], "answer": "She spoke slowly so that everyone could understand her.", "fullSentence": "She spoke slowly so that everyone could understand her.", "source": "IMG_0746", "explanation": "so that SV(~するために)。canやwillなどの助動詞を伴うことが多い。", "relatedInfo": "in order that ~ もほぼ同じ意味だが、やや硬い表現。"}, {"id": 24, "type": "free", "cat er": "What would you have done if you had known the truth earlier?", "fullSentence": "What would you have done if you had known the truth earlier?", "source": "IMG_0755", "explanation": "What would you have done if S had done(もし~だったらどうしていた?)。仮定法過去完了。", "relatedInfo": "過去の事実に反する仮定にはhad + 過去分詞(過去完了)を使う。"}, {"id": 39, "type": "free", "category": "仮定法・条件表現", "hint": "ある望ましくない結果が起きないようにするために行動する、という意味の構文です。", "keyPhrases": ["so", "as", "not", "to", "wake"], "answer": "She closed the door quietly so as not to wake the baby.", "fullSentence": "She closed the door quietly so as not to wake the baby.", "source": "IMG_0757", "explanation": "so as not to V = in order not to V(~しないように)。notの位置に注意。", "relatedInfo": "in order not to V も同じ意味で使える。"}, {"id": 40, "type": "free", "category": "仮定法・条件表現", "hint": "その条件が成立する場合に限ってのみ、ということを強調する表現です。", "keyPhrases": ["only", "if"], "answer": "You can enter the lab only if you have a permit.", "fullSentence": "You can enter the lab only if you have a permit.", "source": "IMG_0781", "explanation": "only if SV(~の場合に限って)。ifの節が満たされない限り成立しないことを強調する。", "relatedInfo": "if only ~ (~でありさえすれば)は全く違う意味になるので注意。"}, {"id": 41, "type": "free", "category": "仮定法・条件表現", "hint": "ある望ましくない結果を避けるために、注意を払う、という意味の表現です。", "keyPhrases": ["careful", "not", "to", "wake"], "answer": "He was careful not to wake his roommate when he came home late.", "fullSentence": "He was careful not to wake his roommate when he came home late.", "source": "IMG_0757", "explanation": "be careful not to V = take care not to V(~しないように気をつける)。", "relatedInfo": "take care not to V も同じ意味で使える。"}, {"id": 42, "type": "free", "category": "仮定法・条件表現", "hint": "相手に、ある行動をしないようにと指示する、という意味の構文です。", "keyPhrases": ["told", "him", "not", "to", "touch"], "answer": "The staff told him not to touch the artwork.", "fullSentence": "The staff told him not to touch the artwork.", "source": "IMG_0757", "explanation": "tell 人 not to V(人に~しないように言う)。notの位置はto の直前。", "relatedInfo": "ask/order 人 not to V も同じ語順パターン。"}, <script>
const FOLDER_NAME = 'その他英語表現ノート';

const STORAGE_KEY_FILLCHOICE  = 'wt_all_fillchoice_seen_' + FOLDER_NAME;

};
const REVIEW_SYNC_TEST_ID = "sonota_hyogen_all";
const REVIEW_SYNC_KEYS = [BOOKMARK_KEY_FILLCHOICE, BOOKMARK_KEY_ORDER, BOOKMARK_KEY_WRITE];
let _reviewSyncDocRef = null;
function reviewSyncGetId() {
  let id = localStorage.getItem('aien_sync_id');
  if (id === null) {
    const input = prompt('復習リストを他の端末（PC/スマホ）と共有する場合は、合言葉を入力してください。\n全ての端末で同じ言葉を入力すると復習リストが共有されます。\n共有しない場合は空欄のままOKしてください。', '');
    id = (input && input.trim()) ? input.trim() : '__none__';
    localStorage.setItem('aien_sync_id', id);
  }
  return id === '__none__' ? null : id;
}
function changeSyncId() {
  const current = localStorage.getItem('aien_sync_id');
  const input = prompt('復習リストを他の端末と共有するための合言葉を入力してください(全端末で同じ言葉にしてください)。\n共有をやめる場合は空欄のままOKしてください。', (current && current !== '__none__') ? current : '');
  if (input === null) return;
  localStorage.setItem('aien_sync_id', input.trim() ? input.trim() : '__none__');
  location.reload();
}
function reviewSyncStatusLabel() {
  const id = localStorage.getItem('aien_sync_id');
  return (id && id !== '__none__') ? `共有ON（合言葉: ${id}）` : '共有OFF';
}
async function initReviewSync() {
  try {
    const syncId = reviewSyncGetId();
    if (!syncId) return;
    if (!window._reviewSyncApp) window._reviewSyncApp = firebase.initializeApp(REVIEW_SYNC_CONFIG);
    const db = firebase.firestore();
    const docRef = db.collection('reviewLists').doc(syncId + '__' + REVIEW_SYNC_TEST_ID);
    const snap = await Promise.race([
      docRef.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    if (snap && snap.exists) {
      const data = snap.data();
      REVIEW_SYNC_KEYS.forEach(key => {
        if (Array.isArray(data[key])) localStorage.setItem(key, JSON.stringify(data[key]));
      });
    }
    _reviewSyncDocRef = docRef;
  } catch (e) {
    console.warn('復習リストのクラウド同期に失敗しました(オフラインの可能性)。ローカルのデータのみで動作します。', e);
  }
}
function reviewSyncPush(key) {
  if (!_reviewSyncDocRef) return;
  try {
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    _reviewSyncDocRef.set({ [key]: list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
      .catch(e => console.warn('復習リストの送信に失敗しました', e));
  } catch (e) {}
}

let currentFormat = null;
let currentMode = null;
let currentCategory = null;
let currentSelectedIds = [];
let sessionQuestions = [];

const storageOk = (function(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; }
})();

function questionsFor(format){
  if(format === 'fillchoice') return FILLCHOICE_QUESTIONS;
  if(format === 'order') return ORDER_QUESTIONS;
  return WRITE_QUESTIONS;
}
function storageKeyFor(format){
  if(format==='fillchoice') return STORAGE_KEY_FILLCHOICE;
  if(format==='order') return STORAGE_KEY_ORDER;
  return STORAGE_KEY_WRITE;
}
function bookmarkKeyFor(format){
  if(format==='fillchoice') return BOOKMARK_KEY_FILLCHOICE;
  if(format==='order') return BOOKMARK_KEY_ORDER;
  return BOOKMARK_KEY_WRITE;
}
function trashKeyFor(format){
  if(format==='fillchoice') return TRASH_KEY_FILLCHOICE;
  if(format==='order') return TRASH_KEY_ORDER;
  return TRASH_KEY_WRITE;
}
function audioFolderFor(format){
  if(format==='fillchoice') return 'audio_fillchoice';
  if(format==='order') return 'audio_order';
  return 'audio_write';
}
function formatLabel(format){
  if(format==='fillchoice') return '✏️ 穴埋め・選択肢';
  if(format==='order') return '📝 並べ替え・誤り訂正';
  return '✍️ 自由記述・マッチング';
}

function getBookmarks(format){
  if(!storageOk) return [];
  return JSON.parse(localStorage.getItem(bookmarkKeyFor(format)) || '[]');
}
function toggleBookmark(format, id){
  if(!storageOk) return false;
  let list = getBookmarks(format);
  list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  localStorage.setItem(bookmarkKeyFor(format), JSON.stringify(list));
  reviewSyncPush(bookmarkKeyFor(format));
  return list.includes(id);
}
function getTrash(format){
  if(!storageOk) return [];
  return JSON.parse(localStorage.getItem(trashKeyFor(format)) || '[]');
}
function moveToTrash(format, id){
  if(!storageOk) return;
  const list = getTrash(format);
  if(!list.includes(id)){ list.push(id); localStorage.setItem(trashKeyFor(format), JSON.stringify(list)); }
}
function restoreFromTrash(format, id){
  if(!storageOk) return;
  const list = getTrash(format).filter(x => x !== id);
  localStorage.setItem(trashKeyFor(format), JSON.stringify(list));
}
function exportTrash(){
  const formats = ['fillchoice','order','write'];
  const trashedQuestions = [];
  formats.forEach(format => {
    const ids = new Set(getTrash(format));
    questionsFor(format).forEach(q => { if(ids.has(q.id)) trashedQuestions.push(Object.assign({format}, q)); });
  });
  if(trashedQuestions.length === 0){ alert('ゴミ箱は空です'); return; }
  const payload = { folder: FOLDER_NAME, exportedAt: new Date().toISOString(), trashedQuestions };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = FOLDER_NAME + '_trash_export.json'; a.click();
  URL.revokeObjectURL(url);
}
function activeQuestionsFor(format){
  const trashed = new Set(getTrash(format));
  return questionsFor(format).filter(q => !trashed.has(q.id));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getRandomSessionQuestions(format){
  const all = activeQuestionsFor(format);
  const seen = storageOk ? JSON.parse(localStorage.getItem(storageKeyFor(format)) || '[]') : [];
  const seenSet = new Set(seen);
  const seenQuestions = all.filter(q => seenSet.has(q.id));
  const unseenQuestions = all.filter(q => !seenSet.has(q.id));
  if(seenQuestions.length > 0){
    const total = Math.min(10, all.length);
    const fromSeen = Math.round(total * 0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0, fromSeen);
    const pickedUnseen = shuffle(unseenQuestions).slice(0, fromUnseen);
    if(pickedUnseen.length < fromUnseen){
      const extra = shuffle(seenQuestions.filter(q => !pickedSeen.includes(q))).slice(0, fromUnseen - pickedUnseen.length);
      return shuffle([...pickedSeen, ...pickedUnseen, ...extra]);
    }
    return shuffle([...pickedSeen, ...pickedUnseen]);
  }
  return shuffle(all).slice(0, 10);
}
function getAllSessionQuestions(format){ return shuffle(activeQuestionsFor(format)); }
function getCategorySessionQuestions(format, categoryName){
  return shuffle(activeQuestionsFor(format).filter(q => q.category === categoryName));
}
function getBookmarkSelectedSessionQuestions(format, selectedIds){
  const idSet = new Set(selectedIds || []);
  return shuffle(activeQuestionsFor(format).filter(q => idSet.has(q.id)));
}
function getBookmarkRandomSessionQuestions(format){
  const bookmarks = new Set(getBookmarks(format));
  const pool = activeQuestionsFor(format).filter(q => bookmarks.has(q.id));
  return shuffle(pool).slice(0, Math.min(10, pool.length));
}

function saveSeenQuestions(format, questions){
  if(!storageOk) return;
  const key = storageKeyFor(format);
  const prev = JSON.parse(localStorage.getItem(key) || '[]');
  const merged = Array.from(new Set([...prev, ...questions.map(q => q.id)]));
  localStorage.setItem(key, JSON.stringify(merged));
}

function startTest(format, mode, categoryName, selectedIds){
  currentFormat = format;
  currentMode = mode;
  currentCategory = categoryName || null;
  currentSelectedIds = selectedIds || [];
  if(mode==='random') sessionQuestions = getRandomSessionQuestions(format);
  else if(mode==='all') sessionQuestions = getAllSessionQuestions(format);
  else if(mode==='category') sessionQuestions = getCategorySessionQuestions(format, categoryName);
  else if(mode==='bookmarkSelect') sessionQuestions = getBookmarkSelectedSessionQuestions(format, currentSelectedIds);
  else if(mode==='bookmarkRandom') sessionQuestions = getBookmarkRandomSessionQuestions(format);
  sessionQuestions = sessionQuestions.map(q => q.type==='choice' ? Object.assign({}, q, {shuffledChoices: shuffle(q.choices)}) : q);
  currentIndex = 0; score = 0;
  renderQuestion();
}

// ---------------- audio ----------------
let currentAudio = null;
let currentBtn = null;
function resetPlayBtn(btn){ btn.textContent = '🔊 英文を聞く'; btn.classList.remove('playing'); }
function playAudio(btn, src){
  const isSameBtn = (currentBtn === btn);
  if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; }
  if(currentBtn){ resetPlayBtn(currentBtn); currentBtn = null; }
  if(isSameBtn){ currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = '■ 停止'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if(currentBtn===btn){ currentBtn=null; currentAudio=null; } };
  audio.play();
}

// ---------------- image modal ----------------
function openImageModal(src){
  document.getElementById('imgModalImg').src = src;
  document.getElementById('imgModal').classList.remove('hidden');
}
function closeImageModal(){
  document.getElementById('imgModal').classList.add('hidden');
  document.getElementById('imgModalImg').src = '';
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeImageModal(); });

function sourceThumbsHtml(q){
  const sourceList = q.source ? [q.source] : (q.sources || []);
  if(sourceList.length === 0) return '';
  return '<div class="source-thumbs">' + sourceList.map(s =>
    `<img class="source-thumb" src="images/${s}.jpg" alt="${s}" loading="lazy" onclick="openImageModal('images/${s}.jpg')" onerror="this.style.display='none'">`
  ).join('') + `</div><div class="small-muted">📷 出典: ${sourceList.join(', ')}</div>`;
}

  currentFormat=null; currentMode=null; currentCategory=null; currentSelectedIds=[];

    <div class="card format-card" onclick="showModeSelect('fillchoice')">

    </div>

function selectCategory(el, catEncoded){

}
function startCategoryTest(format){
  if(!window.__selectedCategory) return;
  startTest(format, 'category', window.__selectedCategory);
}

// -------- bookmark select screen --------
function showBookmarkSelectScreen(format){
  currentFormat = format;
  const bookmarks = new Set(getBookmarks(format));
  const targets = activeQuestionsFor(format).filter(q => bookmarks.has(q.id));
  bookmarkSelectChecked = new Set();
  window.__bookmarkTargets = targets;
  renderBookmarkSelectScreen();
}
function bookmarkRepresentativeText(q){
  if(q.question) return typeof q.question === 'string' ? q.question : '';
  if(q.hint) return q.hint;
  if(q.pairs && q.pairs.length) return q.pairs[0].japanese + ' / ' + q.pairs[0].english;
  return '(内容なし)';
}
function renderBookmarkSelectScreen(){
  const targets = window.__bookmarkTargets || [];
  if(targets.length === 0){
    app().innerHTML = `
      <a class="link-back" onclick="showModeSelect('${currentFormat}')">← モード選択に戻る</a>
      <div class="title-main">🔖 復習リストから問題を選ぶ（${formatLabel(currentFormat)}）</div>
      <div class="card">復習リストに問題がありません</div>
    `;
    return;
  }
  const rows = targets.map(q => `
    <div class="bookmark-item">
      <div class="row">
        <label class="checkbox-row" style="flex:1;">
          <input type="checkbox" ${bookmarkSelectChecked.has(q.id)?'checked':''} onchange="toggleBookmarkCheck(${q.id})">
          <span>
            <span class="badge badge-type">${typeLabel(q.type)}</span>
            <span class="badge badge-cat">${q.category}</span><br>
            <span class="small-muted">${escapeHtml(bookmarkRepresentativeText(q)).slice(0,80)}</span>
          </span>
        </label>
      </div>
    </div>
  `).join('');
  app().innerHTML = `
    <a class="link-back" onclick="showModeSelect('${currentFormat}')">← モード選択に戻る</a>
    <div class="title-main">🔖 復習リストから問題を選ぶ（${formatLabel(currentFormat)}）</div>
    <div class="card">
      <div style="margin-bottom:10px;">
        <button class="btn btn-sm btn-secondary" onclick="bookmarkSelectAll()">全選択</button>
        <button class="btn btn-sm btn-secondary" onclick="bookmarkDeselectAll()">全解除</button>
        <span class="small-muted" style="margin-left:10px;" id="bmCountLabel">${bookmarkSelectChecked.size} / ${targets.length}問を選択中</span>
      </div>
      ${rows}

    </div>
  `;
}
function toggleBookmarkCheck(id){
  if(bookmarkSelectChecked.has(id)) bookmarkSelectChecked.delete(id); else bookmarkSelectChecked.add(id);
  const targets = window.__bookmarkTargets || [];
  document.getElementById('bmCountLabel').textContent = `${bookmarkSelectChecked.size} / ${targets.length}問を選択中`;
  document.getElementById('bmStartBtn').disabled = bookmarkSelectChecked.size===0;
}
function bookmarkSelectAll(){
  const targets = window.__bookmarkTargets || [];
  bookmarkSelectChecked = new Set(targets.map(q=>q.id));
  renderBookmarkSelectScreen();
}
function bookmarkDeselectAll(){
  bookmarkSelectChecked = new Set();
  renderBookmarkSelectScreen();
}
function startBookmarkSelectedTest(){
  startTest(currentFormat, 'bookmarkSelect', null, Array.from(bookmarkSelectChecked));
}

// -------- trash screen --------
function showTrashScreen(format){
  currentFormat = format;
  renderTrashScreen();
}
function renderTrashScreen(){
  const trashIds = getTrash(currentFormat);
  const all = questionsFor(currentFormat);

    const q = all.find(x => x.id === id);

      </div>
    `);
  });
  app().innerHTML = `
    <a class="link-back" onclick="showModeSelect('${currentFormat}')">← モード選択に戻る</a>
    <div class="title-main">🗑 ゴミ箱（${formatLabel(currentFormat)}）</div>
    <div class="card">
      <button class="btn btn-secondary" style="margin-bottom:14px;" onclick="exportTrash()">📤 ゴミ箱をエクスポート</button>
      ${rows.length ? rows.join('') : '<p class="small-muted">ゴミ箱は空です</p>'}
    </div>
  `;
}
function restoreTrashItem(id){
  restoreFromTrash(currentFormat, id);
  renderTrashScreen();
}

// -------- question screen --------
function typeLabel(type){
  return { fill:'穴埋め', choice:'選択肢', reorder:'並べ替え', correction:'誤り訂正', free:'自由記述', match:'マッチング' }[type] || type;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentQuestion(){ return sessionQuestions[currentIndex]; }

function renderQuestion(){
  answered = false;
  const q = currentQuestion();
  const total = sessionQuestions.length;
  const pct = Math.round((currentIndex/total)*100);
  const bookmarks = new Set(getBookmarks(currentFormat));
  const isBookmarked = bookmarks.has(q.id);

  let bodyHtml = '';
  if(q.type === 'fill') bodyHtml = renderFillBody(q);
  else if(q.type === 'choice') bodyHtml = renderChoiceBody(q);
  else if(q.type === 'reorder') bodyHtml = renderReorderBody(q);
  else if(q.type === 'correction') bodyHtml = renderCorrectionBody(q);
  else if(q.type === 'free') bodyHtml = renderFreeBody(q);
  else if(q.type === 'match') bodyHtml = renderMatchBody(q);

  app().innerHTML = `
    <a class="link-back" onclick="confirmBackToModeSelect()">← スタート画面に戻る</a>
    <div class="q-meta">
      <span>${formatLabel(currentFormat)}</span>
      <span>Q ${currentIndex+1} / ${total}</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card" id="questionCard">
      <div class="q-topline">
        <div>
          <span class="badge badge-type">${typeLabel(q.type)}</span>
          <span class="badge badge-cat">${q.category}</span>
          ${q.isNew ? '<span class="badge badge-new">🆕 NEW!</span>' : ''}
        </div>
        <span class="trash-link" id="trashLinkTop" onclick="trashCurrentQuestion()">この問題は表示しない</span>
      </div>
      <div class="bookmark-row">
        <label class="checkbox-row">
          <input type="checkbox" ${isBookmarked?'checked':''} onchange="onBookmarkToggle(${q.id})">
          この問題を復習リストに入れる
        </label>
      </div>
      <div id="qBody">${bodyHtml}</div>
      <div id="feedbackArea"></div>
    </div>
  `;
  if(q.type === 'reorder') initReorder(q);
  if(q.type === 'match') initMatch(q);
}

function confirmBackToModeSelect(){
  showModeSelect(currentFormat);
}

function onBookmarkToggle(id){
  toggleBookmark(currentFormat, id);
}

function trashCurrentQuestion(){
  const q = currentQuestion();
  if(!confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) return;
  moveToTrash(currentFormat, q.id);
  const el = document.getElementById('trashLinkTop');
  if(el){ el.textContent = '🗑 ゴミ箱に移動しました'; el.style.pointerEvents='none'; el.style.color='var(--sub)'; el.style.textDecoration='none'; }
}

// ---------- fill ----------
function renderFillBody(q){
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <div class="q-sentence">${escapeHtml(q.question)}</div>
    <input type="text" id="fillInput" placeholder="英語で入力してください" onkeydown="if(event.key==='Enter')submitFill()">
    <button class="btn" onclick="submitFill()">回答する</button>
  `;
}
function submitFill(){
  if(answered) return;
  const q = currentQuestion();
  const val = (document.getElementById('fillInput').value || '').trim().toLowerCase();
  const correct = val === q.answer.trim().toLowerCase();
  finishAnswer(correct, feedbackFillChoiceHtml(q, correct));
}

// ---------- choice ----------
function renderChoiceBody(q){
  const choices = q.shuffledChoices || q.choices;
  const opts = choices.map((c,i) => `
    <label><input type="radio" name="choiceOpt" value="${escapeHtml(c)}"> ${escapeHtml(c)}</label>
  `).join('');
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <div class="q-sentence">${escapeHtml(q.question)}</div>
    <div class="choice-list">${opts}</div>
    <button class="btn" onclick="submitChoice()">回答する</button>
  `;
}
function submitChoice(){
  if(answered) return;
  const q = currentQuestion();
  const sel = document.querySelector('input[name="choiceOpt"]:checked');
  if(!sel){ alert('選択肢を選んでください'); return; }
  const correct = sel.value.trim().toLowerCase() === q.answer.trim().toLowerCase();
  finishAnswer(correct, feedbackFillChoiceHtml(q, correct));
}
function feedbackFillChoiceHtml(q, correct){
  return `
    <div class="answer-line">正解: ${escapeHtml(q.answer)}</div>
    <button class="play-btn" onclick="playAudio(this, audioFolderFor('fillchoice') + '/' + ${q.id} + '.mp3')">🔊 英文を聞く</button>
    <div class="q-sentence" style="font-size:1rem;">${escapeHtml(q.fullSentence)}</div>
  `;
}

// ---------- reorder ----------
function initReorder(q){
  reorderAssembled = [];
  reorderPool = shuffle(q.tokens.map((t,i)=>({text:t, key:i})));
  renderReorderTiles();
}
function renderReorderBody(q){
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <div id="reorderAssembled" class="tile-area">タップして単語を選んでください</div>
    <div id="reorderPool" class="tile-pool"></div>
    <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="resetReorder()">リセット</button>
    <button class="btn" id="reorderSubmitBtn" disabled onclick="submitReorder()">回答する</button>
  `;
}
function renderReorderTiles(){
  const q = currentQuestion();
  const assembledEl = document.getElementById('reorderAssembled');
  const poolEl = document.getElementById('reorderPool');
  if(reorderAssembled.length === 0){
    assembledEl.innerHTML = 'タップして単語を選んでください';
  } else {
    assembledEl.innerHTML = reorderAssembled.map((t,idx) => `<span class="tile" onclick="removeAssembled(${idx})">${escapeHtml(t.text)}</span>`).join('');
  }
  poolEl.innerHTML = reorderPool.map((t,idx) => `<span class="tile" onclick="addAssembled(${idx})">${escapeHtml(t.text)}</span>`).join('');
  document.getElementById('reorderSubmitBtn').disabled = !(reorderPool.length === 0 && reorderAssembled.length === q.tokens.length);
}
function addAssembled(poolIdx){
  const t = reorderPool.splice(poolIdx,1)[0];
  reorderAssembled.push(t);
  renderReorderTiles();
}
function removeAssembled(assembledIdx){
  const t = reorderAssembled.splice(assembledIdx,1)[0];
  reorderPool.push(t);
  renderReorderTiles();
}
function resetReorder(){
  const q = currentQuestion();
  reorderPool = shuffle([...reorderPool, ...reorderAssembled]);
  reorderAssembled = [];
  renderReorderTiles();
}
function submitReorder(){
  if(answered) return;
  const q = currentQuestion();
  const userSentence = reorderAssembled.map(t=>t.text).join(' ');
  const correct = userSentence === q.tokens.join(' ');
  finishAnswer(correct, feedbackOrderHtml(q, correct));
}

// ---------- correction ----------
function renderCorrectionBody(q){
  const marked = escapeHtml(q.question).replace(/\[\[(.+?)\]\]/, (m,p1) => `<u style="background:#fff3cd; color:#7a5b00; padding:1px 4px; border-radius:4px;">${p1}</u>`);
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <div class="q-sentence">${marked}</div>
    <div class="small-muted" style="margin-bottom:8px;">下線部を正しい形に直してください</div>
    <input type="text" id="correctionInput" placeholder="正しい形を入力してください" onkeydown="if(event.key==='Enter')submitCorrection()">
    <button class="btn" onclick="submitCorrection()">回答する</button>
  `;
}
function submitCorrection(){
  if(answered) return;
  const q = currentQuestion();
  const val = (document.getElementById('correctionInput').value || '').trim().toLowerCase();
  const correct = val === q.answer.trim().toLowerCase();
  finishAnswer(correct, feedbackOrderHtml(q, correct));
}
function feedbackOrderHtml(q, correct){
  return `
    <div class="answer-line">正解の英文: ${escapeHtml(q.fullSentence)}</div>
    <button class="play-btn" onclick="playAudio(this, audioFolderFor('order') + '/' + ${q.id} + '.mp3')">🔊 英文を聞く</button>
  `;
}

// ---------- free ----------
function renderFreeBody(q){
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <textarea id="freeInput" placeholder="英文を入力してください"></textarea>
    <button class="btn" onclick="submitFree()">回答する</button>
  `;
}
function submitFree(){
  if(answered) return;
  const q = currentQuestion();
  const raw = (document.getElementById('freeInput').value || '').trim().toLowerCase();
  const missing = q.keyPhrases.filter(kp => !raw.includes(kp.toLowerCase()));
  const correct = missing.length === 0;
  let html = '';
  if(!correct){
    html += `<div class="small-muted">不足している語句: ${missing.map(escapeHtml).join(', ')}</div>`;
  }
  html += `
    <div class="answer-line">模範解答: ${escapeHtml(q.answer)}</div>
    <button class="play-btn" onclick="playAudio(this, audioFolderFor('write') + '/' + ${q.id} + '.mp3')">🔊 英文を聞く</button>
  `;
  finishAnswer(correct, html);
}

// ---------- match ----------
function initMatch(q){
  matchLeft = shuffle(q.pairs.map((p,i)=>({text:p.japanese, orig:i})));
  matchRight = shuffle(q.pairs.map((p,i)=>({text:p.english, orig:i})));
  matchSelectedLeft = null;
  matchUserPairs = [];
  renderMatchColumns();
}
function renderMatchBody(q){
  return `
    <div class="q-hint">💡 ${escapeHtml(q.hint)}</div>
    <div class="match-cols">
      <div class="match-col" id="matchLeftCol"></div>
      <div class="match-col" id="matchRightCol"></div>
    </div>
    <button class="btn" id="matchSubmitBtn" disabled onclick="submitMatch()">回答する</button>
  `;
}
function renderMatchColumns(){
  const q = currentQuestion();
  const leftCol = document.getElementById('matchLeftCol');
  const rightCol = document.getElementById('matchRightCol');
  leftCol.innerHTML = matchLeft.map(item => {
    const paired = matchUserPairs.find(p=>p.leftOrig===item.orig);
    let cls = 'match-btn';
    if(matchSelectedLeft === item.orig) cls += ' selected';
    if(paired) cls += ' paired';
    return `<button class="${cls}" onclick="onMatchLeftClick(${item.orig})">${escapeHtml(item.text)}</button>`;
  }).join('');
  rightCol.innerHTML = matchRight.map(item => {
    const paired = matchUserPairs.find(p=>p.rightOrig===item.orig);
    let cls = 'match-btn';
    if(paired) cls += ' paired';
    return `<button class="${cls}" onclick="onMatchRightClick(${item.orig})">${escapeHtml(item.text)}</button>`;
  }).join('');
  document.getElementById('matchSubmitBtn').disabled = matchUserPairs.length !== q.pairs.length;
}
function onMatchLeftClick(orig){
  matchUserPairs = matchUserPairs.filter(p => p.leftOrig !== orig);
  matchSelectedLeft = orig;
  renderMatchColumns();
}
function onMatchRightClick(orig){
  if(matchSelectedLeft === null) return;
  matchUserPairs = matchUserPairs.filter(p => p.rightOrig !== orig && p.leftOrig !== matchSelectedLeft);
  matchUserPairs.push({leftOrig: matchSelectedLeft, rightOrig: orig});
  matchSelectedLeft = null;
  renderMatchColumns();
}
function submitMatch(){
  if(answered) return;
  const q = currentQuestion();
  let correctCount = 0;
  matchUserPairs.forEach(p => { if(p.leftOrig === p.rightOrig) correctCount++; });
  const allCorrect = correctCount === q.pairs.length;
  let html = '';
  if(allCorrect){
    html += `<div class="answer-line">✅ 全問正解！</div>`;
  } else {
    html += `<div class="answer-line">⚠️ ${correctCount} / ${q.pairs.length} 正解</div>`;
  }
  html += q.pairs.map((p, idx) => {
    const userPair = matchUserPairs.find(x=>x.leftOrig===idx);
    const wasCorrect = userPair && userPair.rightOrig === idx;
    return `<div style="margin:6px 0;">${wasCorrect?'✅':'❌'} ${escapeHtml(p.japanese)} → ${escapeHtml(p.english)}
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('write') + '/' + ${q.id} + '_p' + ${idx} + '.mp3')">🔊</button>
    </div>`;
  }).join('');
  finishAnswer(allCorrect, html, true);
}

// ---------- shared finish/feedback ----------
function finishAnswer(correct, extraHtml, skipMainLine){
  answered = true;
  const q = currentQuestion();
  if(correct) score++;
  const isLast = currentIndex === sessionQuestions.length - 1;
  const mainLine = skipMainLine ? '' : `<h3>${correct ? '✅ 正解！' : '❌ 不正解'}</h3>`;
  const html = `
    <div class="feedback ${correct?'correct':'incorrect'}">
      ${mainLine}
      ${extraHtml}
      ${sourceThumbsHtml(q)}
      ${q.relatedInfo ? `<div class="info-block">💡 関連知識: ${escapeHtml(q.relatedInfo)}</div>` : ''}
      ${q.explanation ? `<div class="info-block">📝 解説: ${escapeHtml(q.explanation)}</div>` : ''}
      <div class="trash-link" id="trashLinkBottom" onclick="trashCurrentQuestionBottom()">🗑 この問題は表記ミスなどがあり変です</div>
      <div class="next-btn-wrap">
        <button class="btn" onclick="nextQuestion()">${isLast ? '結果を見る' : '次の問題 →'}</button>
      </div>
    </div>
  `;
  const feedbackEl = document.getElementById('feedbackArea');
  feedbackEl.innerHTML = html;
  if (feedbackEl.scrollIntoView) feedbackEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function trashCurrentQuestionBottom(){
  const q = currentQuestion();
  if(!confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) return;
  moveToTrash(currentFormat, q.id);
  const el = document.getElementById('trashLinkBottom');
  if(el){ el.textContent = '🗑 ゴミ箱に移動しました'; el.style.pointerEvents='none'; el.style.color='var(--sub)'; el.style.textDecoration='none'; }
  const topEl = document.getElementById('trashLinkTop');
  if(topEl){ topEl.textContent = '🗑 ゴミ箱に移動しました'; topEl.style.pointerEvents='none'; topEl.style.color='var(--sub)'; }
}

function nextQuestion(){
  if(currentIndex < sessionQuestions.length - 1){
    currentIndex++;
    renderQuestion();
  } else {
    if(currentMode === 'random') saveSeenQuestions(currentFormat, sessionQuestions);
    showResults();
  }
}

// ---------- results ----------
function showResults(){
  const total = sessionQuestions.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  let stars = '', msg = '';
  if(pct >= 90){ stars = '★★★'; msg = 'Excellent! TOEFL満点レベルの実力です'; }
  else if(pct >= 70){ stars = '★★'; msg = 'Good! あと少しで完璧です'; }
  else if(pct >= 50){ stars = '★'; msg = 'Keep going! 復習して再挑戦しましょう'; }
  else { stars = '—'; msg = 'ノートを見直して再チャレンジ！'; }

  app().innerHTML = `
    <div class="card">
      <div class="title-main">${formatLabel(currentFormat)}</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="small-muted" style="text-align:center;">正解率 ${pct}%</div>
      <div class="result-stars">${stars}</div>
      <div class="result-msg">${msg}</div>
      <button class="btn" style="margin-bottom:10px;" onclick="retrySame()">もう一度同じ形式・モードで挑戦する</button>
      <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="showFormatSelect()">別の形式に挑戦する</button>
      <button class="btn btn-outline" onclick="showFormatSelect()">🏠 最初から</button>
    </div>
  `;
}
function retrySame(){
  startTest(currentFormat, currentMode, currentCategory, currentSelectedIds);
}

// ---------- init ----------
initReviewSync().then(showFormatSelect);

</script>
</body>
</html>
