<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>その他英語表現ノート 総合テスト</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#22262f; --sub:#5b6472; --border:#e2e6ee;
  --accent:#4a6cf7; --accent2:#7b5cf0; --good:#1fa971; --bad:#e5484d; --warn:#f0a63a;
  --new:#ff7a1a;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Hiragino Sans,"Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
}
#app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
h1,h2,h3{line-height:1.4;}
.hidden{display:none !important;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(20,30,60,0.04);
}
.title-main{font-size:1.5rem; font-weight:800; text-align:center; margin:10px 0 4px;}
.subtitle{text-align:center; color:var(--sub); margin-bottom:24px; font-size:0.92rem;}
.format-card{
  display:flex; flex-direction:column; gap:6px; cursor:pointer;
  border:2px solid var(--border); transition:.15s; position:relative;
}
.format-card:hover{border-color:var(--accent); transform:translateY(-2px);}
.format-emoji{font-size:1.8rem;}
.format-name{font-size:1.15rem; font-weight:700;}
.format-desc{color:var(--sub); font-size:0.9rem;}
.format-count{font-size:0.85rem; color:var(--accent); font-weight:600;}
.btn{
  display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:12px 20px; font-size:1rem; font-weight:700; cursor:pointer; text-align:center;
  transition:.15s; width:100%;
}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{background:#c3c9d6; cursor:not-allowed;}
.btn-secondary{background:var(--card); color:var(--accent); border:2px solid var(--accent);}
.btn-outline{background:transparent; color:var(--accent); border:2px solid var(--accent);}
.btn-sm{width:auto; padding:8px 14px; font-size:0.85rem; border-radius:8px;}
.link-back{display:inline-block; margin-bottom:14px; color:var(--accent); cursor:pointer; font-size:0.9rem; text-decoration:none;}
.mode-card{border:1px solid var(--border); cursor:default;}
.mode-card h3{margin:0 0 4px; font-size:1.05rem;}
.mode-card p{margin:0 0 12px; color:var(--sub); font-size:0.88rem;}
.category-btn{
  display:inline-block; margin:4px 6px 4px 0; padding:8px 14px; border-radius:20px;
  border:1.5px solid var(--border); background:#f8f9fc; cursor:pointer; font-size:0.85rem;
}
.category-btn.selected{border-color:var(--accent); background:#eef1ff; color:var(--accent); font-weight:700;}
.footer-links{text-align:center; margin-top:10px; font-size:0.88rem;}
.footer-links span{color:var(--accent); cursor:pointer; margin:0 8px;}
.badge{
  display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.75rem; font-weight:700; margin-right:6px;
}
.badge-type{background:#eef1ff; color:var(--accent);}
.badge-cat{background:#eefaf3; color:var(--good);}
.badge-new{background:linear-gradient(90deg,#ff7a1a,#ff3b3b); color:#fff; font-weight:800;}
.progress-wrap{background:var(--border); border-radius:8px; height:8px; margin:10px 0 4px; overflow:hidden;}
.progress-bar{background:var(--accent); height:100%; transition:width .2s;}
.q-meta{display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; color:var(--sub); margin-bottom:6px;}
.q-topline{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.q-hint{background:#f8f9fc; border-left:4px solid var(--accent); padding:10px 14px; border-radius:8px; margin:12px 0; font-size:0.95rem;}
.q-sentence{font-size:1.15rem; font-weight:600; margin:14px 0; line-height:1.6;}
input[type="text"], textarea{
  width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px; font-size:1rem;
  font-family:inherit; margin-bottom:12px;
}
textarea{min-height:90px; resize:vertical;}
.choice-list label{
  display:block; border:1.5px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px; cursor:pointer;
}
.choice-list input{margin-right:8px;}
.choice-list label:hover{border-color:var(--accent);}
.tile-area{
  min-height:56px; border:2px dashed var(--border); border-radius:10px; padding:10px; margin-bottom:10px;
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--sub);
}
.tile{
  background:var(--accent); color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:0.95rem;
  user-select:none;
}
.tile-pool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.tile-pool .tile{background:#eef1ff; color:var(--accent);}
.match-cols{display:flex; gap:12px; margin:14px 0;}
.match-col{flex:1; display:flex; flex-direction:column; gap:8px;}
.match-btn{
  border:1.5px solid var(--border); background:#fff; border-radius:10px; padding:10px 12px; cursor:pointer;
  font-size:0.88rem; text-align:left;
}
.match-btn.selected{border-color:var(--accent); background:#eef1ff;}
.match-btn.paired{border-color:var(--good); background:#eefaf3;}
.match-btn.wrong-pair{border-color:var(--bad); background:#fdeceb;}
.bookmark-row{display:flex; align-items:center; gap:8px; font-size:0.88rem; color:var(--sub); margin:10px 0;}
.trash-link{font-size:0.8rem; color:var(--bad); cursor:pointer; text-decoration:underline;}
.feedback{border-radius:12px; padding:16px; margin-top:16px;}
.feedback.correct{background:#eefaf3; border:1.5px solid var(--good);}
.feedback.incorrect{background:#fdeceb; border:1.5px solid var(--bad);}
.feedback h3{margin:0 0 8px;}
.feedback .answer-line{font-weight:700; margin:8px 0;}
.play-btn{
  background:#fff; border:1.5px solid var(--accent); color:var(--accent); border-radius:20px;
  padding:6px 14px; font-size:0.85rem; cursor:pointer; margin:6px 6px 6px 0;
}
.play-btn.playing{background:var(--accent); color:#fff;}
.source-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.source-thumb{width:110px; height:110px; object-fit:cover; border-radius:8px; cursor:zoom-in; border:1px solid var(--border);}
.info-block{margin-top:10px; font-size:0.9rem; color:var(--sub);}
.info-block b{color:var(--text);}
.next-btn-wrap{margin-top:18px;}
.result-score{font-size:2.4rem; font-weight:800; text-align:center; margin:10px 0;}
.result-stars{text-align:center; font-size:1.6rem; margin-bottom:8px;}
.result-msg{text-align:center; color:var(--sub); margin-bottom:20px;}
.trash-item, .bookmark-item{border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.trash-item .row, .bookmark-item .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.small-muted{color:var(--sub); font-size:0.85rem;}
.checkbox-row{display:flex; align-items:center; gap:8px;}
.img-modal{
  position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center;
  z-index:999; cursor:zoom-out;
}
.img-modal img{max-width:92%; max-height:92%; border-radius:8px;}
.img-modal-close{position:absolute; top:18px; right:26px; color:#fff; font-size:2rem; cursor:pointer;}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141c; --card:#1b1e29; --text:#e7eaf1; --sub:#9aa2b1; --border:#2b2f3c;
    --accent:#7d97ff; --accent2:#a58bff; --good:#3ddc9a; --bad:#ff6b6f; --warn:#ffb75e;
  }
  .choice-list label:hover{border-color:var(--accent);}
  .badge-type{background:#22263a;}
  .badge-cat{background:#16302a;}
  .q-hint{background:#20232f;}
  .tile-pool .tile{background:#22263a;}
  .feedback.correct{background:#123024;}
  .feedback.incorrect{background:#331e1f;}
}
:root[data-theme="dark"]{
  --bg:#12141c; --card:#1b1e29; --text:#e7eaf1; --sub:#9aa2b1; --border:#2b2f3c;
  --accent:#7d97ff; --accent2:#a58bff; --good:#3ddc9a; --bad:#ff6b6f; --warn:#ffb75e;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --card:#ffffff; --text:#22262f; --sub:#5b6472; --border:#e2e6ee;
  --accent:#4a6cf7; --accent2:#7b5cf0; --good:#1fa971; --bad:#e5484d; --warn:#f0a63a;
}
</style>
</head>

</div>

<script>
const FILLCHOICE_QUESTIONS = [{"id": 1, "type": "fill", "category": "動詞・語彙の言い換え", "question": "Social media can greatly _____ how teenagers see themselves.", "hint": "あるものが人の考え方や行動を変えるような力を持つ、という意味の動詞を考えましょう。", "fullSentence": "Social media can greatly influence how teenagers see themselves.", "answer": "influence", "source": "IMG_0744", "explanation": "influence = affect = have an impact on(~に影響を与える)。名詞影響力の意味でも使う。", "relatedInfo": "affect, have an impact on も同じ意味で使える。impact onは前置詞onを忘れやすいので注意。"}, {"id": 2, "type": "choice", "category": "動詞・語彙の言い換え", "question": "ある物事の本当の良さや価値がわかるようになる、という意味を表す動詞です。感謝するという意味でも使えます。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "It took her years to truly appreciate the value of her teacher's advice.", "answer": "appreciate", "choices": ["appreciate", "ignore", "dismiss", "suspect"], "source": "IMG_0744", "explanation": "appreciateは「感謝する」「真価を理解する」「正しく評価する」の3つの意味を持つ多義語。", "relatedInfo": "同じ語で「値上がりする」という意味もある(資産などが)。"}, {"id": 3, "type": "fill", "category": "動詞・語彙の言い換え", "question": "The manager _____ every complaint within a day.", "hint": "相手からの質問や意見に対して答えを返す、という動作を表す表現です。", "fullSentence": "The manager responded to every complaint within a day.", "answer": "responded to", "source": "IMG_0744", "explanation": "respond to = reply to = answer(~に返答する)。いずれも「~に」の部分は前置詞toを伴う(answerのみ他動詞で前置詞不要)。", "relatedInfo": "answerは他動詞なのでtoは不要(answer the question)、respond/replyは自動詞でtoが必要。"}, {"id": 4, "type": "choice", "category": "動詞・語彙の言い換え", "question": "自分の意見を強く主張して譲らない様子を表す動詞です。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "She insisted that the plan be changed immediately.", "answer": "insisted that", "choices": ["insisted that", "denied that", "doubted that", "forgot that"], "source": "IMG_0745", "explanation": "argue = claim = insist = maintain = contend that ~ で「~だと主張する」という意味になる動詞グループ。", "relatedInfo": "suggestも「提案する」だけでなく「~だと示唆する」の意味を持つ。"}, {"id": 5, "type": "fill", "category": "動詞・語彙の言い換え", "question": "Experts _____ that the economy would slow down next year.", "hint": "将来起こることを、根拠に基づいてあらかじめ言い当てる、という意味の動詞です。", "fullSentence": "Experts predicted that the economy would slow down next year.", "answer": "predicted", "source": "IMG_0748", "explanation": "predict = estimate(予測する、見積もる)。未来のことについて推測を述べる際に使う。", "relatedInfo": "estimateは数量的な見積もりのニュアンスが強く、predictは出来事の予測に使われやすい。"}, {"id": 6, "type": "choice", "category": "動詞・語彙の言い換え", "question": "努力や手段によって何かを自分のものにする、という意味の動詞です。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The company acquired a large amount of data through the survey.", "answer": "acquired", "choices": ["acquired", "rejected", "abandoned", "ignored"], "source": "IMG_0747", "explanation": "get = acquire = obtain(手に入れる)。acquireとobtainはやや硬い語で、書き言葉でよく使われる。", "relatedInfo": "obtainも同義語。getは口語的で最も広く使われる。"}, {"id": 7, "type": "fill", "category": "動詞・語彙の言い換え", "question": "New employees must learn how to _____ customer complaints calmly.", "hint": "困難な問題や状況にうまく対応する、という意味の動詞です。", "fullSentence": "New employees must learn how to handle customer complaints calmly.", "answer": "handle", "source": "IMG_0747", "explanation": "handle = cope with(対処する)。人や問題への対応の仕方を述べるときに使う。", "relatedInfo": "cope withは自動詞的にwithを伴う点に注意(cope with a problem)。"}, {"id": 8, "type": "choice", "category": "動詞・語彙の言い換え", "question": "過去の記憶やできごとを頭の中によみがえらせる、という意味の動詞です。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Looking at the photo, she suddenly recalled her childhood in Kyoto.", "answer": "recalled", "choices": ["recalled", "forgot", "ignored", "predicted"], "source": "IMG_0747", "explanation": "recall = recollect = be reminded of(思い出す)。remindは他動詞でremind 人 of ~ の形をとる点に注意。", "relatedInfo": "be reminded of ~ は受け身の形で「~を思い出させられる」というニュアンス。"}, {"id": 9, "type": "fill", "category": "動詞・語彙の言い換え", "question": "He _____ the job offer because the salary was too low.", "hint": "申し出や依頼などをきっぱりと受け入れない、という意味を表す表現です。", "fullSentence": "He turned down the job offer because the salary was too low.", "answer": "turned down", "source": "IMG_0749", "explanation": "refuse = reject = turn down(拒否する)。turn downは口語的な句動詞。", "relatedInfo": "rejectはやや硬い語で、正式な申請や提案を却下する場面でよく使われる。"}, {"id": 10, "type": "choice", "category": "動詞・語彙の言い換え", "question": "見えなくなったものや欲しいものを見つけようと動き回る、という意味の表現です。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Volunteers spent the whole day searching for the missing hiker.", "answer": "searching for", "choices": ["searching for", "waiting for", "asking for", "caring for"], "source": "IMG_0766", "explanation": "search for = look for(~を探す)。searchは他動詞としても使えるが、search for + 目的語の形もよく使われる。", "relatedInfo": "search 場所 for 物(場所を物を求めて捜索する)という形もある。"}, {"id": 11, "type": "fill", "category": "動詞・語彙の言い換え", "question": "A small mistake in the report _____ a serious misunderstanding.", "hint": "ある出来事が原因となって別の結果を引き起こす、という意味の表現です。", "fullSentence": "A small mistake in the report led to a serious misunderstanding.", "answer": "led to", "source": "IMG_0771", "explanation": "lead to = cause(~を引き起こす)。原因→結果の流れを表すときによく使われる。", "relatedInfo": "causeは他動詞でそのまま目的語を取るが、lead toは前置詞toが必要。"}, {"id": 12, "type": "choice", "category": "動詞・語彙の言い換え", "question": "すでにあるものをさらに強く、しっかりしたものにする、という意味の動詞です。", "hint": "「動詞・語彙の言い換え」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Regular practice will reinforce what you learned in class.", "answer": "reinforce", "choices": ["reinforce", "weaken", "ignore", "replace"], "source": "IMG_0781", "explanation": "reinforce = enhance(強化する)。知識・構造・印象などを強めるときに使う。", "relatedInfo": "enhanceはやや価値・質を高めるニュアンスが強い。"}, {"id": 13, "type": "fill", "category": "熟語・句動詞", "question": "The team will _____ the plan next week.", "hint": "計画や指示などを実際に行動に移して行う、という意味の句動詞です。", "fullSentence": "The team will carry out the plan next week.", "answer": "carry out", "source": "IMG_0754", "explanation": "carry out ~ (~を実行する)。目的語が代名詞の場合はcarry it outのように間に挟む。", "relatedInfo": "他動詞+副詞の句動詞は、目的語が代名詞なら必ず間に入れる(carry it out, not carry out it)。"}, {"id": 14, "type": "choice", "category": "熟語・句動詞", "question": "知らない単語や情報を辞書などで調べる、という意味の句動詞です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "If you don't know the word, look up its meaning in a dictionary.", "answer": "look up", "choices": ["look up", "look up to", "look into", "look after"], "source": "IMG_0754", "explanation": "look up ~ (単語などを調べる)。代名詞の場合はlook it upの語順になる。", "relatedInfo": "look up toは全く別の意味で「~を尊敬する」になる点に注意。"}, {"id": 15, "type": "fill", "category": "熟語・句動詞", "question": "Please don't _____; he just fell asleep.", "hint": "眠っている人の目を覚めさせる、という意味の表現です。", "fullSentence": "Please don't wake him up; he just fell asleep.", "answer": "wake him up", "source": "IMG_0754", "explanation": "wake 人 up (人を起こす)。代名詞は必ず動詞と副詞の間に置く。", "relatedInfo": "pick up も同じ語順ルールに従う句動詞(pick him up)。"}, {"id": 16, "type": "choice", "category": "熟語・句動詞", "question": "申し出や誘いなどをはっきりと断る、という意味の句動詞です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "It's rude to turn down an invitation without a good reason.", "answer": "turn down", "choices": ["turn down", "turn up", "turn into", "turn out"], "source": "IMG_0754", "explanation": "turn down ~ (~を断る)。carry out, hand in, bring backなどと同じ他動詞+副詞グループ。", "relatedInfo": "turn down にはボリュームを下げるという意味もある。"}, {"id": 17, "type": "fill", "category": "熟語・句動詞", "question": "It took him months to _____ the loss of his dog.", "hint": "つらい経験や病気などを乗り越えて元通りになる、という意味の表現です。", "fullSentence": "It took him months to get over the loss of his dog.", "answer": "get over", "source": "IMG_0754", "explanation": "get over ~ = overcome(~を克服する)。自動詞+前置詞なので、代名詞が来ても分離しない(get over it)。", "relatedInfo": "overcomeは他動詞1語で言い換えられる(overcome the loss)。"}, {"id": 18, "type": "choice", "category": "熟語・句動詞", "question": "相手を自分より劣っていると考えて軽く扱う、という意味の表現です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "He looks down on people who have never traveled abroad.", "answer": "looks down on", "choices": ["looks down on", "looks up to", "looks after", "looks into"], "source": "IMG_0746", "explanation": "look down on ~ = despise(~を軽蔑する)。反対はlook up to。", "relatedInfo": "despiseは1語で「軽蔑する」という意味の他動詞。"}, {"id": 19, "type": "fill", "category": "熟語・句動詞", "question": "Many young players _____ that veteran coach.", "hint": "ある人を立派だと思い、尊敬のまなざしで見る、という意味の表現です。", "fullSentence": "Many young players look up to that veteran coach.", "answer": "look up to", "source": "IMG_0746", "explanation": "look up to ~ = respect(~を尊敬する)。反対はlook down on。", "relatedInfo": "respectは1語で「尊敬する」という意味の他動詞。"}, {"id": 20, "type": "choice", "category": "熟語・句動詞", "question": "感情が抑えられなくなって、突然泣き出してしまう、という意味の表現です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "When she heard the news, she suddenly burst into tears.", "answer": "burst into tears", "choices": ["burst into tears", "burst out tears", "broke into tears", "fell into tears"], "source": "IMG_0756", "explanation": "burst into tears = burst out crying(突然泣き出す)。burst into laughterで「突然笑い出す」にもなる。", "relatedInfo": "burst outの後にはVing(crying)が続く形もある。"}, {"id": 21, "type": "fill", "category": "熟語・句動詞", "question": "The teacher kindly _____ the mistake in my essay.", "hint": "相手が気づいていない間違いや事実をはっきり示して伝える、という意味の表現です。", "fullSentence": "The teacher kindly pointed out the mistake in my essay.", "answer": "pointed out", "source": "IMG_0765", "explanation": "point out ~ (~を指摘する)。誤りや事実を明確に示す時に使う。", "relatedInfo": "be pointed out (his mistake was pointed out)のように受け身でもよく使われる。"}, {"id": 22, "type": "choice", "category": "熟語・句動詞", "question": "ある出来事や行事が実際に起こる、開催される、という意味の表現です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The ceremony took place in the old town hall.", "answer": "took place", "choices": ["took place", "took part", "took over", "took on"], "source": "IMG_0764", "explanation": "take place (行われる、起こる)。happenとほぼ同義だが、計画された行事に使われやすい。", "relatedInfo": "happenは偶然の出来事にも使えるが、take placeは予定された行事によく使う。"}, {"id": 23, "type": "fill", "category": "熟語・句動詞", "question": "The committee decided to _____ a new proposal.", "hint": "意見や案などを人々の前に示して提案する、という意味の表現です。", "fullSentence": "The committee decided to put forward a new proposal.", "answer": "put forward", "source": "IMG_0762", "explanation": "put O forward = put forward O(~を提案する)。目的語の位置は前後どちらでもよい。", "relatedInfo": "proposeも同じ意味の1語動詞。"}, {"id": 24, "type": "choice", "category": "熟語・句動詞", "question": "今まで正しいと思われていたことに疑いを投げかける、という意味の表現です。", "hint": "「熟語・句動詞」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The new evidence called into question his account of the accident.", "answer": "called into question", "choices": ["called into question", "called into account", "called for question", "called out question"], "source": "IMG_0772", "explanation": "call O into question(~を疑問視する)。信頼性や正確さを疑う場面で使われる。", "relatedInfo": "question自体を動詞として使い、question his accountとも言い換えられる。"}, {"id": 25, "type": "fill", "category": "文法パターン・構文", "question": "Critics _____ a masterpiece.", "hint": "あるものを別のものであるとみなして表現する、という意味の文型です。", "fullSentence": "Critics described it as a masterpiece.", "answer": "described it as", "source": "IMG_0744", "explanation": "describe A as B(AをBと表現する/みなす)。call A B, define A as Bと似た構造。", "relatedInfo": "call A B (asなし)との違いに注意。describeは必ずasを伴う。"}, {"id": 26, "type": "choice", "category": "文法パターン・構文", "question": "自分の時間や力のすべてをある目的のために使う、という意味の表現です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "He devoted his life to helping poor children.", "answer": "devoted his life to", "choices": ["devoted his life to", "devoted his life for", "devoted his life on", "devoted his life at"], "source": "IMG_0746", "explanation": "devote A to B(AをBに捧げる)。toの後には名詞または動名詞がくる。", "relatedInfo": "be devoted to ~ing の受動態の形もよく使われる。"}, {"id": 27, "type": "fill", "category": "文法パターン・構文", "question": "Please _____ your email before sending it.", "hint": "あるものを別のものにくっつけて取り付ける、という意味の構文です。", "fullSentence": "Please attach the file to your email before sending it.", "answer": "attach the file to", "source": "IMG_0746", "explanation": "attach A to B(AをBに取り付ける)。比喩的に「愛着を持つ」の意味でも使われる(be attached to)。", "relatedInfo": "be attached to ~ で「~に愛着がある」という意味になる。"}, {"id": 28, "type": "choice", "category": "文法パターン・構文", "question": "人々に必要なものを与える、供給する、という意味の構文です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The school provided the students with new textbooks.", "answer": "provided the students with", "choices": ["provided the students with", "provided the students for", "provided the students to", "provided the students of"], "source": "IMG_0749", "explanation": "provide A with B = provide B for A(AにBを供給する)。supply, presentも同じ形をとる。", "relatedInfo": "supply A with B、present A with Bも同じ構造で使える。"}, {"id": 29, "type": "fill", "category": "文法パターン・構文", "question": "The manager _____ the schedule change.", "hint": "相手にある情報や事実を知らせる、という意味の構文です。", "fullSentence": "The manager informed the staff of the schedule change.", "answer": "informed the staff of", "source": "IMG_0749", "explanation": "inform A of B(AにBを知らせる)。convey, notifyも似た構造をとる。", "relatedInfo": "notify A of Bも同じ意味・形で使われる。"}, {"id": 30, "type": "choice", "category": "文法パターン・構文", "question": "はっきりとは断言できないが、そのように見える・思われる、という意味の構文です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "This problem seems to be more complicated than we thought.", "answer": "seems to be", "choices": ["seems to be", "seems be", "seems being", "seems as"], "source": "IMG_0750", "explanation": "It seems that S is C = S seems to be C(~のようだ)。2つの言い換え構造は頻出。", "relatedInfo": "It appears that ~ もほぼ同じ意味で使われる。"}, {"id": 31, "type": "fill", "category": "文法パターン・構文", "question": "This restaurant _____ the oldest one in the city.", "hint": "世間で広くそう言われている、という噂や評判を表す構文です。", "fullSentence": "This restaurant is said to be the oldest one in the city.", "answer": "is said to be", "source": "IMG_0750", "explanation": "It is said that S is C = S is said to be C(~と言われている)。believe, think, knowも同じ構造をとる。", "relatedInfo": "It is believed that ~ / S is believed to be ~ も同じパターン。"}, {"id": 32, "type": "choice", "category": "文法パターン・構文", "question": "人ではなく物事そのものが持つ性質を表すときに使う、感情形容詞の形です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The lecture was so interesting that nobody wanted to leave.", "answer": "interesting", "choices": ["interesting", "interested", "interest", "interestingly"], "source": "IMG_0753", "explanation": "物・事が主語のときは-ing形(interesting)、人が主語のときは-ed形(interested)を使う。", "relatedInfo": "excited/exciting, surprised/surprisingなど同じパターンの形容詞が多数ある。"}, {"id": 33, "type": "fill", "category": "文法パターン・構文", "question": "Everyone _____ the most honest person in town.", "hint": "ある人やものを、実際にそうであると考える、という意味の構文です。", "fullSentence": "Everyone believed him to be the most honest person in town.", "answer": "believed him to be", "source": "IMG_0762", "explanation": "believe/consider/find/prove O to be C(OをCだと思う/証明する)。that節に書き換え可能。", "relatedInfo": "Everyone believed that he was ~ とthat節でも同じ意味を表せる。"}, {"id": 34, "type": "choice", "category": "文法パターン・構文", "question": "ある物事のおかげで、人が何かをするのが以前より簡単になる、という意味の構文です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The new app made it easier for us to book a table.", "answer": "made it easier for us", "choices": ["made it easier for us", "made it easier of us", "made it easy for us to", "made it easier to us"], "source": "IMG_0771", "explanation": "make it C for 人 to V(人が~するのをCにする)。形式目的語itを使う頻出構文。", "relatedInfo": "形式目的語のitは後ろのto不定詞の内容を指す。"}, {"id": 35, "type": "fill", "category": "文法パターン・構文", "question": "_____ you improve.", "hint": "一方が変化するにつれて、もう一方も同じように変化していく、という意味の構文です。", "fullSentence": "The harder you try, the more you improve.", "answer": "the harder you try, the more", "source": "IMG_0757", "explanation": "The 比較級 SV, the 比較級 SV(~すればするほど…)。2つの比較級を対応させる。", "relatedInfo": "The more, the better.(多ければ多いほど良い)のように短縮した形もよく使われる。"}, {"id": 36, "type": "choice", "category": "文法パターン・構文", "question": "ある人やものを、頭の中で別の何かであると位置づけて考える、という意味の構文です。", "hint": "「文法パターン・構文」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Most students think of him as a strict but fair teacher.", "answer": "think of him as", "choices": ["think of him as", "think of him to be", "think of him for", "think of him being"], "source": "IMG_0758", "explanation": "think of A as B(AをBとみなす)。regard A as B, see A as Bも同じ構造。", "relatedInfo": "regard A as B、see A as Bも同じ意味で使える表現。"}, {"id": 37, "type": "fill", "category": "接続詞・前置詞表現", "question": "_____ the new highway, the trip now takes only an hour.", "hint": "良い結果になった理由を述べるときに使う、前置詞的な表現です。", "fullSentence": "Thanks to the new highway, the trip now takes only an hour.", "answer": "thanks to", "source": "IMG_0748", "explanation": "thanks to = because of = owing to = due to = by virtue of = on account of(~のおかげで)。", "relatedInfo": "thanks toは良い結果に、because ofは中立的に使われることが多い。"}, {"id": 38, "type": "choice", "category": "接続詞・前置詞表現", "question": "前半の内容と対立するような後半の内容を続けるときに使う接続詞です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Though the exam was difficult, most students passed it.", "answer": "though", "choices": ["though", "despite", "because", "unless"], "source": "IMG_0751", "explanation": "though = although = even though(~だけれども)。文頭にも文中にも置ける。", "relatedInfo": "thoughは文末に置いて「でも」という意味の副詞としても使われる。"}, {"id": 39, "type": "fill", "category": "接続詞・前置詞表現", "question": "City life is fast-paced, _____ country life is calm and slow.", "hint": "2つのものを比べて、その違いを対比的に示すときに使う接続詞です。", "fullSentence": "City life is fast-paced, whereas country life is calm and slow.", "answer": "whereas", "source": "IMG_0751", "explanation": "while = whereas(一方で)。2つの事柄を対比するときに使う。", "relatedInfo": "whileは「~している間」という時間の意味でも使われるので文脈に注意。"}, {"id": 40, "type": "choice", "category": "接続詞・前置詞表現", "question": "前の内容を否定して、むしろ逆であることを強調するときに使う表現です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "I didn't dislike the movie; on the contrary, I loved it.", "answer": "on the contrary", "choices": ["on the contrary", "on the other hand", "in contrast to", "by contrast with"], "source": "IMG_0751", "explanation": "on the contrary(それどころか)。前の内容を打ち消して逆の内容を続けるときに使う。", "relatedInfo": "on the other hand(一方で)は対比、on the contraryは否定・逆転のニュアンス。"}, {"id": 41, "type": "fill", "category": "接続詞・前置詞表現", "question": "_____ popular belief, the plan actually worked well.", "hint": "一般的な予想や期待とは反対の内容を述べるときに使う前置詞句です。", "fullSentence": "Contrary to popular belief, the plan actually worked well.", "answer": "contrary to", "source": "IMG_0751", "explanation": "contrary to ~ (~とは反対に)。予想や期待に反する事実を導入する。", "relatedInfo": "in contrast to ~ も似た意味だが対比のニュアンスが強い。"}, {"id": 42, "type": "choice", "category": "接続詞・前置詞表現", "question": "実際にはそうではないが、まるでそうであるかのように、と述べるときに使う接続詞です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "He talked about the plan as if it were already decided.", "answer": "as if", "choices": ["as if", "even if", "as though it", "so that"], "source": "IMG_0751", "explanation": "as if = as though(まるで~であるかのように)。仮定法過去を伴うことが多い。", "relatedInfo": "現実と異なる内容にはas if + 仮定法過去(were)が使われる。"}, {"id": 43, "type": "fill", "category": "接続詞・前置詞表現", "question": "_____ the weather, the festival will be held as planned.", "hint": "ある条件に影響されず、それに関係なく物事が起こることを示す表現です。", "fullSentence": "Regardless of the weather, the festival will be held as planned.", "answer": "regardless of", "source": "IMG_0760", "explanation": "regardless of = irrespective of(~に関わらず)。後ろには名詞または名詞節が続く。", "relatedInfo": "no matter what/how ~ もほぼ同じ意味で使える。"}, {"id": 44, "type": "choice", "category": "接続詞・前置詞表現", "question": "ある新しい状況になったことを理由として、続く内容を述べるときに使う接続詞です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Now that the exams are over, we can finally relax.", "answer": "now that", "choices": ["now that", "even that", "given of", "seeing for"], "source": "IMG_0745", "explanation": "now that SV(今や~なので)。becauseに近いが、状況の変化を前提とするニュアンスがある。", "relatedInfo": "seeing that ~ も似た意味で「~であるから」を表す。"}, {"id": 45, "type": "fill", "category": "接続詞・前置詞表現", "question": "She spoke slowly _____ everyone could understand her.", "hint": "ある行動を取る目的を表すときに使う接続詞です。", "fullSentence": "She spoke slowly so that everyone could understand her.", "answer": "so that", "source": "IMG_0746", "explanation": "so that SV(~するために)。canやwillなどの助動詞を伴うことが多い。", "relatedInfo": "in order that ~ もほぼ同じ意味だが、やや硬い表現。"}, {"id": 46, "type": "choice", "category": "接続詞・前置詞表現", "question": "程度がとても激しく、その結果ある事態が起こる、という意味の構文です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The noise was such that nobody could concentrate on work.", "answer": "such that", "choices": ["such that", "so that", "as that", "too that"], "source": "IMG_0776", "explanation": "such that SV(とても~なのでSVする)。so 形容詞 that とほぼ同じ意味。", "relatedInfo": "so 形容詞/副詞 that SVという形とセットで覚えると良い。"}, {"id": 47, "type": "fill", "category": "接続詞・前置詞表現", "question": "_____ his brother, Tom has never been interested in sports.", "hint": "2つのものを比べたときの違いを示すときに使う前置詞です。", "fullSentence": "Unlike his brother, Tom has never been interested in sports.", "answer": "unlike", "source": "IMG_0766", "explanation": "unlike ~ (~とは違って)。文頭にも文中にも置ける前置詞。", "relatedInfo": "differently from ~ も似た意味の表現。"}, {"id": 48, "type": "choice", "category": "接続詞・前置詞表現", "question": "ある提案や意見に対して賛成の立場を取るときに使う表現です。", "hint": "「接続詞・前置詞表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Most committee members voted in favor of the new policy.", "answer": "in favor of", "choices": ["in favor of", "in favor for", "in favor to", "for favor of"], "source": "IMG_0780", "explanation": "in favor of ~ (~に賛成して)。反対はagainstまたはopposed to。", "relatedInfo": "be in favor of ~ ing の形でも使われる。"}, {"id": 49, "type": "fill", "category": "時を表す表現", "question": "_____ we arrived, the concert had already started.", "hint": "ある時点になるまでに、それより前にある動作が完了していることを表す接続詞です。", "fullSentence": "By the time we arrived, the concert had already started.", "answer": "by the time", "source": "IMG_0752", "explanation": "by the time SV(~するまでには)。主節はしばしば過去完了・未来完了になる。", "relatedInfo": "untilは「継続」、by the timeは「期限」のニュアンスの違いに注意。"}, {"id": 50, "type": "choice", "category": "時を表す表現", "question": "ある時点までずっと同じ状態や動作が続くことを表す接続詞です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Please wait here until I come back.", "answer": "until", "choices": ["until", "by", "since", "after"], "source": "IMG_0752", "explanation": "until/till SV(~するまでずっと)。継続を表す動詞と共に使われることが多い。", "relatedInfo": "by the timeは「期限」、untilは「継続」を表す点で異なる。"}, {"id": 51, "type": "fill", "category": "時を表す表現", "question": "Call me _____ you arrive at the station.", "hint": "ある出来事が起こった直後に、別の出来事が続けて起こることを表す接続詞です。", "fullSentence": "Call me as soon as you arrive at the station.", "answer": "as soon as", "source": "IMG_0752", "explanation": "as soon as = the moment = directly SV(~するとすぐに)。", "relatedInfo": "the moment SV、directly SVも同じ意味で使える。"}, {"id": 52, "type": "choice", "category": "時を表す表現", "question": "ある行動が起こる度に必ず、という意味を表す接続詞です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Whenever I visit Kyoto, I stop by the same old shrine.", "answer": "whenever", "choices": ["whenever", "whatever", "wherever", "however"], "source": "IMG_0752", "explanation": "every time = each time = whenever SV(~する度に)。", "relatedInfo": "every time SV / each time SVもほぼ同じ意味で使える。"}, {"id": 53, "type": "fill", "category": "時を表す表現", "question": "I visited Okinawa _____ last summer.", "hint": "以前は一度も経験していなかったことを、初めて経験する、という意味の表現です。", "fullSentence": "I visited Okinawa for the first time last summer.", "answer": "for the first time", "source": "IMG_0752", "explanation": "for the first time(初めて)⇔ at first(最初は)の違いに注意。", "relatedInfo": "at firstは「初めのうちは(その後変化する)」というニュアンス。"}, {"id": 54, "type": "choice", "category": "時を表す表現", "question": "ある出来事がそう遠くない未来に起こるだろう、と述べるときに使う構文です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "It won't be long before the cherry blossoms start to fall.", "answer": "It won't be long before", "choices": ["It won't be long before", "It will be long before", "It is long before", "It won't be long until"], "source": "IMG_0752", "explanation": "It won't be long before SV(まもなく~するだろう)。", "relatedInfo": "Soon, ~ とほぼ同じ意味を表せる。"}, {"id": 55, "type": "fill", "category": "時を表す表現", "question": "_____ the meeting began.", "hint": "ある出来事が起こった直後にすぐ次の出来事が起こる、という意味の倒置構文です。", "fullSentence": "No sooner had she arrived than the meeting began.", "answer": "no sooner had she arrived than", "source": "IMG_0756", "explanation": "No sooner had S Vpp than SV = Hardly had S Vpp when SV(~するとすぐに…した)。否定語が文頭に来ると倒置が起こる。", "relatedInfo": "Hardly had she arrived when the meeting began. も同じ意味。"}, {"id": 56, "type": "choice", "category": "時を表す表現", "question": "ある行動が起きて初めて、次のことが実現した、という意味を強調する構文です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "It was not until he apologized that she forgave him.", "answer": "not until he apologized that", "choices": ["not until he apologized that", "not until he apologized when", "not by he apologized that", "not since he apologized that"], "source": "IMG_0756", "explanation": "It is not until ~ that SV(~して初めて…)。強調構文の一種。", "relatedInfo": "Not until he apologized did she forgive him. と倒置形でも表せる。"}, {"id": 57, "type": "fill", "category": "時を表す表現", "question": "I can't talk _____; I'm in a meeting.", "hint": "今この瞬間、まさに現在という時を強調する表現です。", "fullSentence": "I can't talk right now; I'm in a meeting.", "answer": "right now", "source": "IMG_0747", "explanation": "right now = just now(たった今)。ただしjust nowは過去形の文でも使われる点に注意。", "relatedInfo": "just nowは過去の出来事「ついさっき」の意味でも使われる。"}, {"id": 58, "type": "choice", "category": "時を表す表現", "question": "ある状態が実現しさえすれば、その後は自動的に次のことが起こる、という意味の接続詞です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Once you understand the rule, the game becomes very simple.", "answer": "once", "choices": ["once", "ones", "one", "only"], "source": "IMG_0781", "explanation": "once SV(いったん~すると)。条件と時の両方のニュアンスを持つ。", "relatedInfo": "as soon asと似ているが、onceは「一度~したら」という条件的な意味合いが強い。"}, {"id": 59, "type": "fill", "category": "時を表す表現", "question": "A major change in the industry _____.", "hint": "重要な出来事や変化が、近い将来に起こりそうだ、という意味の表現です。", "fullSentence": "A major change in the industry is on the horizon.", "answer": "is on the horizon", "source": "IMG_0778", "explanation": "be on the horizon(間近に迫っている)。将来起こりそうな出来事を暗示する表現。", "relatedInfo": "be around the corner も似た意味で使われる。"}, {"id": 60, "type": "choice", "category": "時を表す表現", "question": "以前はそうだったが、今はもうそうではない、という変化を表す表現です。", "hint": "「時を表す表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "This old factory is no longer in use.", "answer": "no longer", "choices": ["no longer", "no more longer", "not longer", "no long"], "source": "IMG_0780", "explanation": "no longer = not ~ any more(もはや~ない)。", "relatedInfo": "not ~ any longer も同じ意味で使える。"}, {"id": 61, "type": "fill", "category": "数量・比較表現", "question": "_____ people watched the final match on TV.", "hint": "正確な数はわからないが、とても多くの人や物があることを表す数量表現です。", "fullSentence": "Millions of people watched the final match on TV.", "answer": "millions of", "source": "IMG_0747", "explanation": "millions of = thousands of = hundreds of = dozens of(何百万/何千/何百/数十もの)。", "relatedInfo": "複数形のsを忘れないこと(million of Xとは言わない)。"}, {"id": 62, "type": "choice", "category": "数量・比較表現", "question": "全体のうち、大部分・過半数を占める部分を表す数量表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Most of the students in this class passed the exam.", "answer": "most of the students", "choices": ["most of the students", "most the students", "almost of the students", "most of students"], "source": "IMG_0750", "explanation": "most of the + 名詞(~のほとんど)。theをつけるかどうかで意味が変わる点に注意。", "relatedInfo": "most students(一般論)とmost of the students(特定のグループ)の違いに注意。"}, {"id": 63, "type": "fill", "category": "数量・比較表現", "question": "_____ was asked to give a short speech.", "hint": "グループの中の一人一人に注目して述べるときに使う数量表現です。", "fullSentence": "Each of the members was asked to give a short speech.", "answer": "each of the members", "source": "IMG_0750", "explanation": "all of / each of / every / any of(すべての/それぞれの/いずれかの)。each ofは単数扱い。", "relatedInfo": "each ofの後の動詞は単数形になる点に注意(was, not were)。"}, {"id": 64, "type": "choice", "category": "数量・比較表現", "question": "数えられる名詞について、数がとても少ないことを強調する表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "Only a few students knew the answer to the question.", "answer": "only a few", "choices": ["only a few", "only a little", "only few", "only a fewer"], "source": "IMG_0770", "explanation": "only a few = only a little(ほんの少ししか~ない)。fewは数えられる名詞、littleは数えられない名詞に使う。", "relatedInfo": "a few(少しはある)とfew(ほとんどない)のニュアンスの違いにも注意。"}, {"id": 65, "type": "fill", "category": "数量・比較表現", "question": "There is _____ left in the bottle.", "hint": "数えられない名詞について、量がとても少ないことを表す形容詞です。", "fullSentence": "There is little water left in the bottle.", "answer": "little water", "source": "IMG_0770", "explanation": "few ⇔ little(数えられる名詞/数えられない名詞の「少ない」)。", "relatedInfo": "fewは可算名詞、littleは不可算名詞に使う点が最大の違い。"}, {"id": 66, "type": "choice", "category": "数量・比較表現", "question": "他のどんな人にも劣らないほど優れている、という意味の比較表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "She is as smart as any student in the school.", "answer": "as smart as any student", "choices": ["as smart as any student", "as smart than any student", "so smart as any student", "as smart as every student"], "source": "IMG_0772", "explanation": "as ~ as any(どの~にも劣らず)。最上級に近い意味を持つ比較表現。", "relatedInfo": "as ~ as anyone (誰にも劣らず)という形もよく使われる。"}, {"id": 67, "type": "fill", "category": "数量・比較表現", "question": "_____ fans gathered outside the stadium.", "hint": "数万にのぼるほどの、非常に大きな数を表す表現です。", "fullSentence": "Tens of thousands of fans gathered outside the stadium.", "answer": "tens of thousands of", "source": "IMG_0764", "explanation": "tens of thousands of ~ (何万もの~)。hundreds of, millions ofと同じ仲間。", "relatedInfo": "hundreds of thousands of ~ で「数十万もの」という意味になる。"}, {"id": 68, "type": "choice", "category": "数量・比較表現", "question": "実際にはそれ以上の価値や意味がない、という限定を表す表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The rumor turned out to be nothing more than gossip.", "answer": "nothing more than", "choices": ["nothing more than", "nothing less than", "nothing other than", "no more than that"], "source": "IMG_0760", "explanation": "nothing more than ~ = only(~にすぎない)。", "relatedInfo": "nothing but ~ も同じく「~にすぎない」という意味で使える。"}, {"id": 69, "type": "fill", "category": "数量・比較表現", "question": "Please finish the report _____.", "hint": "現実的にできる限りの最大限の程度で、という意味の比較表現です。", "fullSentence": "Please finish the report as fast as possible.", "answer": "as fast as possible", "source": "IMG_0772", "explanation": "as ~ as S can = as ~ as possible(できるだけ~)。", "relatedInfo": "as soon as possible (できるだけ早く)は特によく使われる表現。"}, {"id": 70, "type": "choice", "category": "数量・比較表現", "question": "程度がグループの中で一番低いことを表す最上級の表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "This was the least popular dish on the menu.", "answer": "least popular", "choices": ["least popular", "less popular", "most less popular", "lesser popular"], "source": "IMG_0781", "explanation": "less ~ than ever = least ~ (最も~でない)。leastはlessの最上級。", "relatedInfo": "most ~ (最も~)の反対の意味になる最上級。"}, {"id": 71, "type": "fill", "category": "数量・比較表現", "question": "This pen costs _____.", "hint": "1と半分という中途半端な数量を、通貨の単位で表す表現です。", "fullSentence": "This pen costs one dollar and a half.", "answer": "one dollar and a half", "source": "IMG_0773", "explanation": "one dollar and a half = one and a half dollars(1ドル50セント)。語順が2通りある。", "relatedInfo": "one and a half hours = an hour and a half (1時間半)も同じパターン。"}, {"id": 72, "type": "choice", "category": "数量・比較表現", "question": "1週間のうちに2回、という頻度を表す表現です。", "hint": "「数量・比較表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "She goes to the gym twice a week.", "answer": "twice a week", "choices": ["twice a week", "two times in a week", "twice in the week", "twice per the week"], "source": "IMG_0775", "explanation": "twice a week(週に2回)。「~につき」の意味でaを使う。", "relatedInfo": "once a month(月に1回)、three times a year(年に3回)も同じ形。"}, {"id": 73, "type": "fill", "category": "仮定法・条件表現", "question": "_____ during the outdoor concert?", "hint": "これから起こるかもしれない出来事を想定して、その対応を尋ねる表現です。", "fullSentence": "What if it rains during the outdoor concert?", "answer": "What if it rains", "source": "IMG_0755", "explanation": "What if SV(過去形)(もし~したらどうする?)。未来の可能性についての心配や提案を表す。", "relatedInfo": "What would you do if ~ よりも軽いニュアンスで使われることが多い。"}, {"id": 74, "type": "choice", "category": "仮定法・条件表現", "question": "現実にはありえない立場を仮定して、相手にどうするか尋ねる表現です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "What would you do if you were the president of this company?", "answer": "what would you do if you were", "choices": ["what would you do if you were", "what will you do if you were", "what would you do if you are", "what did you do if you were"], "source": "IMG_0755", "explanation": "What would you do if S did(過去形)(もし~だったらどうする?)。仮定法過去。", "relatedInfo": "ifの後は過去形(were)を使うのが原則(仮定法過去)。"}, {"id": 75, "type": "fill", "category": "仮定法・条件表現", "question": "_____ the truth earlier?", "hint": "過去の出来事について、もし事情が違っていたらどうしていたかを尋ねる表現です。", "fullSentence": "What would you have done if you had known the truth earlier?", "answer": "what would you have done if you had known", "source": "IMG_0755", "explanation": "What would you have done if S had done(もし~だったらどうしていた?)。仮定法過去完了。", "relatedInfo": "過去の事実に反する仮定にはhad + 過去分詞(過去完了)を使う。"}, {"id": 76, "type": "choice", "category": "仮定法・条件表現", "question": "ある目的を達成するために行動する、という意味を表すフォーマルな構文です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "They left early so as to save time.", "answer": "so as to save", "choices": ["so as to save", "so as save", "so to save", "as so to save"], "source": "IMG_0757", "explanation": "so as to V = in order to V(~するために)。", "relatedInfo": "in order to V も同じ意味で使えるが、so as toは主語が同じ場合に特によく使われる。"}, {"id": 77, "type": "fill", "category": "仮定法・条件表現", "question": "She closed the door quietly _____ the baby.", "hint": "ある望ましくない結果が起きないようにするために行動する、という意味の構文です。", "fullSentence": "She closed the door quietly so as not to wake the baby.", "answer": "so as not to wake", "source": "IMG_0757", "explanation": "so as not to V = in order not to V(~しないように)。notの位置に注意。", "relatedInfo": "in order not to V も同じ意味で使える。"}, {"id": 78, "type": "choice", "category": "仮定法・条件表現", "question": "ある条件が満たされない場合に限って、という意味を表す接続詞です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "You won't pass the exam unless you study harder.", "answer": "unless", "choices": ["unless", "until", "although", "whether"], "source": "IMG_0768", "explanation": "unless = if not(~しない限り)。否定の条件を表す。", "relatedInfo": "if ~ not と書き換えられる(if you don't study harder)。"}, {"id": 79, "type": "fill", "category": "仮定法・条件表現", "question": "You can enter the lab _____ you have a permit.", "hint": "その条件が成立する場合に限ってのみ、ということを強調する表現です。", "fullSentence": "You can enter the lab only if you have a permit.", "answer": "only if", "source": "IMG_0781", "explanation": "only if SV(~の場合に限って)。ifの節が満たされない限り成立しないことを強調する。", "relatedInfo": "if only ~ (~でありさえすれば)は全く違う意味になるので注意。"}, {"id": 80, "type": "choice", "category": "仮定法・条件表現", "question": "ある条件が続く間はずっと、という条件を表す接続詞です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "You can stay here as long as you keep quiet.", "answer": "as long as", "choices": ["as long as", "as far as", "so long that", "as soon as"], "source": "IMG_0747", "explanation": "as long as SV(~する限りは)。条件の継続を表す。", "relatedInfo": "as far as (範囲・程度)とas long as(条件・時間)の違いに注意。"}, {"id": 81, "type": "fill", "category": "仮定法・条件表現", "question": "He _____ his roommate when he came home late.", "hint": "ある望ましくない結果を避けるために、注意を払う、という意味の表現です。", "fullSentence": "He was careful not to wake his roommate when he came home late.", "answer": "was careful not to wake", "source": "IMG_0757", "explanation": "be careful not to V = take care not to V(~しないように気をつける)。", "relatedInfo": "take care not to V も同じ意味で使える。"}, {"id": 82, "type": "choice", "category": "仮定法・条件表現", "question": "ある行動を実現できるだけの十分な条件を備えている、という意味の構文です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "He is rich enough to buy that house without a loan.", "answer": "rich enough to buy", "choices": ["rich enough to buy", "enough rich to buy", "rich enough for buy", "so rich enough to buy"], "source": "IMG_0757", "explanation": "rich enough to V(~するのに十分裕福だ)。形容詞+enough+to Vの語順に注意(enough richは誤り)。", "relatedInfo": "enough money to V (~するのに十分なお金)のように名詞の前にはenoughを置く。"}, {"id": 83, "type": "fill", "category": "仮定法・条件表現", "question": "The staff _____ the artwork.", "hint": "相手に、ある行動をしないようにと指示する、という意味の構文です。", "fullSentence": "The staff told him not to touch the artwork.", "answer": "told him not to touch", "source": "IMG_0757", "explanation": "tell 人 not to V(人に~しないように言う)。notの位置はto の直前。", "relatedInfo": "ask/order 人 not to V も同じ語順パターン。"}, {"id": 84, "type": "choice", "category": "仮定法・条件表現", "question": "過去にしなかったことを、今になって残念に思う、という意味の仮定法表現です。", "hint": "「仮定法・条件表現」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "I wish he had studied harder when he was young.", "answer": "wish he had studied", "choices": ["wish he had studied", "wish he studied", "wish he has studied", "wish he would study"], "source": "IMG_0774", "explanation": "wish S had done(~であればよかったのに)。過去の事実に反する願望を表す仮定法過去完了。", "relatedInfo": "wish S did(仮定法過去)は現在の事実に反する願望を表す。"}, {"id": 85, "type": "fill", "category": "語彙対比・その他語彙", "question": "_____ stress can have a serious effect on your health.", "hint": "病気や問題が急激ではなく、長期間にわたって続く様子を表す形容詞です。", "fullSentence": "Chronic stress can have a serious effect on your health.", "answer": "chronic", "source": "IMG_0748", "explanation": "chronic(慢性の)⇔ acute(急性の)。医学的な文脈でよく使われる対比語。", "relatedInfo": "acuteは「急性の、鋭い」という意味で、chronicの反対語。"}, {"id": 86, "type": "choice", "category": "語彙対比・その他語彙", "question": "意図せず偶然に起こったことを表す形容詞です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The fire was later found to be accidental, not intentional.", "answer": "accidental", "choices": ["accidental", "intentional", "occasional", "essential"], "source": "IMG_0780", "explanation": "accidental(偶然の)⇔ intentional(意図的な)。", "relatedInfo": "by accident(偶然に)⇔ on purpose(わざと)という表現も対になる。"}, {"id": 87, "type": "fill", "category": "語彙対比・その他語彙", "question": "Many Western artists were fascinated by _____ in the 19th century.", "hint": "ヨーロッパから見て東側にある地域、東洋を指す言葉です。", "fullSentence": "Many Western artists were fascinated by the Orient in the 19th century.", "answer": "the Orient", "source": "IMG_0780", "explanation": "Occident(西洋)⇔ Orient(東洋)。やや文学的・歴史的な表現。", "relatedInfo": "Occidentalは「西洋の」、Orientalは「東洋の」という形容詞。"}, {"id": 88, "type": "choice", "category": "語彙対比・その他語彙", "question": "試合や議論などで、自分と反対の立場に立つ相手を指す言葉です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "She shook hands with her opponent after the match.", "answer": "opponent", "choices": ["opponent", "supporter", "ally", "advocate"], "source": "IMG_0780", "explanation": "opponent(対戦相手、反対者)⇔ supporter/ally(支持者、味方)。", "relatedInfo": "advocate, proponent, supporter, championはいずれも「支持者・擁護者」を表す語。"}, {"id": 89, "type": "fill", "category": "語彙対比・その他語彙", "question": "The word \"cheap\" has a negative _____ of low quality.", "hint": "言葉が持つ、辞書的な意味以外の含みやニュアンスを表す名詞です。", "fullSentence": "The word \"cheap\" has a negative connotation of low quality.", "answer": "connotation", "source": "IMG_0767", "explanation": "connotation(含意)⇔ denotation(明示的な意味)。", "relatedInfo": "denotationは辞書に載っている文字通りの意味を指す。"}, {"id": 90, "type": "choice", "category": "語彙対比・その他語彙", "question": "他人の意見や新しい考えを受け入れる、寛容な態度を表す形容詞です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "A good leader should be open-minded about new ideas.", "answer": "open-minded", "choices": ["open-minded", "cold-blooded", "narrow-minded", "absent-minded"], "source": "IMG_0781", "explanation": "open-minded(寛容な)⇔ cold-blooded(冷酷な)。", "relatedInfo": "narrow-minded(心の狭い)も似た対比で使われる語。"}, {"id": 91, "type": "fill", "category": "語彙対比・その他語彙", "question": "He _____ ran ten kilometers without stopping.", "hint": "比喩ではなく、文字通りにそのままの意味で、ということを強調する副詞です。", "fullSentence": "He literally ran ten kilometers without stopping.", "answer": "literally", "source": "IMG_0746", "explanation": "literature(文学)/literary(文学的な)/literal(文字通りの)/literally(文字通りに)/literacy(識字力)は語源が同じ語族。", "relatedInfo": "literalの名詞形はliteralness、対義語はfigurative(比喩的な)。"}, {"id": 92, "type": "choice", "category": "語彙対比・その他語彙", "question": "水の中でおぼれかけている、まさにその最中の状態を表す表現です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "A lifeguard rescued the boy who was drowning in the river.", "answer": "was drowning", "choices": ["was drowning", "was drowned", "drowned", "had drowned"], "source": "IMG_0763", "explanation": "drown(溺れる、自動詞)/be drowning(溺れかけている、進行中)/be drowned(溺死する、結果の状態)。", "relatedInfo": "be dyingとdieの関係も同様(死にかけている/死ぬ)。"}, {"id": 93, "type": "fill", "category": "語彙対比・その他語彙", "question": "She _____ while playing basketball yesterday.", "hint": "事故やスポーツなどでけがをした、という意味の表現です。", "fullSentence": "She got hurt while playing basketball yesterday.", "answer": "got hurt", "source": "IMG_0765", "explanation": "be hurt = get hurt(けがをする)。hurtは無変化動詞(hurt-hurt-hurt)。", "relatedInfo": "be injured, be woundedも似た意味で使われる受動表現。"}, {"id": 94, "type": "choice", "category": "語彙対比・その他語彙", "question": "数え切れないほどたくさんの、という意味を表す形容詞的な表現です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "The museum displays a myriad of ancient artifacts.", "answer": "a myriad of", "choices": ["a myriad of", "a myriad for", "a myriad with", "myriads for"], "source": "IMG_0767", "explanation": "myriad(無数の)。a myriad of ~ または myriad ~ (of なし)の両方の形で使われる。", "relatedInfo": "countlessもほぼ同じ意味で使われる語。"}, {"id": 95, "type": "fill", "category": "語彙対比・その他語彙", "question": "Only a native speaker can fully grasp the _____ of the language.", "hint": "表面からは気づきにくい、微妙で繊細な違いや特徴を表す名詞です。", "fullSentence": "Only a native speaker can fully grasp the subtleties of the language.", "answer": "subtleties", "source": "IMG_0767", "explanation": "subtleties(微妙な点、機微)。subtle(形容詞:微妙な)の名詞形。", "relatedInfo": "nuance(ニュアンス)も似た意味で使われる語。"}, {"id": 96, "type": "choice", "category": "語彙対比・その他語彙", "question": "内容がわかりやすく、誰にでも理解できる様子を表す形容詞です。", "hint": "「語彙対比・その他語彙」に関する表現です。文脈に最も合う語句を4択から選びましょう。", "fullSentence": "His explanation was clear and intelligible even to beginners.", "answer": "intelligible", "choices": ["intelligible", "intelligent", "invisible", "incredible"], "source": "IMG_0781", "explanation": "intelligible(わかりやすい、理解できる)。intelligent(賢い)と混同しないよう注意。", "relatedInfo": "unintelligible(理解できない)は否定の接頭辞unがついた反対語。"}];
const ORDER_QUESTIONS = [{"id": 1, "type": "reorder", "category": "動詞・語彙の言い換え", "hint": "あるものが人の考え方や行動を変えるような力を持つ、という意味の動詞を考えましょう。", "tokens": ["Social", "media", "can", "greatly", "influence", "how", "teenagers", "see", "themselves."], "fullSentence": "Social media can greatly influence how teenagers see themselves.", "source": "IMG_0744", "explanation": "influence = affect = have an impact on(~に影響を与える)。名詞影響力の意味でも使う。", "relatedInfo": "affect, have an impact on も同じ意味で使える。impact onは前置詞onを忘れやすいので注意。"}, {"id": 2, "type": "correction", "category": "動詞・語彙の言い換え", "hint": "ある物事の本当の良さや価値がわかるようになる、という意味を表す動詞です。感謝するという意味でも使えます。", "question": "It took her years to truly [[appreciates]] the value of her teacher's advice.", "wrongPart": "appreciates", "answer": "appreciate", "fullSentence": "It took her years to truly appreciate the value of her teacher's advice.", "source": "IMG_0744", "explanation": "appreciateは「感謝する」「真価を理解する」「正しく評価する」の3つの意味を持つ多義語。", "relatedInfo": "同じ語で「値上がりする」という意味もある(資産などが)。"}, {"id": 3, "type": "reorder", "category": "動詞・語彙の言い換え", "hint": "相手からの質問や意見に対して答えを返す、という動作を表す表現です。", "tokens": ["The", "manager", "responded", "to", "every", "complaint", "within", "a", "day."], "fullSentence": "The manager responded to every complaint within a day.", "source": "IMG_0744", "explanation": "respond to = reply to = answer(~に返答する)。いずれも「~に」の部分は前置詞toを伴う(answerのみ他動詞で前置詞不要)。", "relatedInfo": "answerは他動詞なのでtoは不要(answer the question)、respond/replyは自動詞でtoが必要。"}, {"id": 4, "type": "correction", "category": "動詞・語彙の言い換え", "hint": "自分の意見を強く主張して譲らない様子を表す動詞です。", "question": "She [[insisted for]] the plan be changed immediately.", "wrongPart": "insisted for", "answer": "insisted that", "fullSentence": "She insisted that the plan be changed immediately.", "source": "IMG_0745", "explanation": "argue = claim = insist = maintain = contend that ~ で「~だと主張する」という意味になる動詞グループ。", "relatedInfo": "suggestも「提案する」だけでなく「~だと示唆する」の意味を持つ。"}, {"id": 5, "type": "reorder", "category": "動詞・語彙の言い換え", "hint":
