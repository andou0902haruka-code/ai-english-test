<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DETテンプレ">
<meta name="theme-color" content="#1f3a5f">
<title>DET テンプレ暗記</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1d2430; --sub:#5d6675; --line:#e2e5ea;
  --blank:#d23c3c; --fill:#1e8a4c; --accent:#1f5fa8; --accent-weak:#e6eef8;
  --ok:#1e8a4c; --mid:#c98a12; --ng:#d23c3c; --hide:#d9dde3; --shadow:0 1px 3px rgba(0,0,0,.08);
  --key:#ffe08a; --star:#e0a100;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13161b; --card:#1d2128; --ink:#e7eaf0; --sub:#9aa3b2; --line:#2e343e;
    --blank:#ff7676; --fill:#5fd394; --accent:#6aa8f0; --accent-weak:#22324a;
    --ok:#5fd394; --mid:#f0b94a; --ng:#ff7676; --hide:#3a414d; --shadow:none;
    --key:rgba(240,185,74,.38); --star:#f0b94a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.back{padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
h2{font-size:18px;margin:20px 0 6px}
h3{font-size:15px;margin:14px 0 6px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.bl{color:var(--blank);font-weight:700;white-space:nowrap}
.fill{color:var(--fill);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.role{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 7px;margin-right:6px;white-space:nowrap}
.tpl{font-size:17px;line-height:1.75}
.ex{font-size:14.5px;color:var(--sub);margin-top:4px}
.alt{font-size:13.5px;color:var(--sub);margin-top:2px}
.skel{font-size:14px}
.skel b{color:var(--accent)}
/* home */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.tcard{display:block;text-align:left;width:100%;padding:12px 14px;border-radius:14px}
.tcard .nm{font-weight:700;font-size:15.5px}
.tcard .meta{font-size:12.5px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin:18px 0 4px}
.hero{display:flex;gap:10px;flex-wrap:wrap}
.hero button{flex:1;min-width:150px;padding:14px;font-size:15.5px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.stats b{color:var(--ink);font-size:16px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:2px}
.tabs button{flex:1;white-space:nowrap;padding:8px 10px;font-size:14px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.ln{padding:10px 0;border-top:1px dashed var(--line)}
.ln:first-child{border-top:none}
.spk{border:none;background:transparent;padding:0 4px;font-size:16px}
/* hidden words */
.hw{display:inline-block;min-width:1.4em;border-radius:5px;background:var(--hide);color:transparent;cursor:pointer;line-height:1.35;padding:0 2px;user-select:none}
.hw.hint{color:var(--sub)}
.hw.open{background:transparent;color:var(--ink);cursor:default;text-decoration:underline dotted var(--sub)}
.blur .fx{filter:blur(5px);cursor:pointer;transition:filter .2s}
.blur .fx.open{filter:none}
.rate{display:flex;gap:8px;margin-top:12px}
.rate button{flex:1;padding:12px 6px;font-weight:600}
.rate .r1{border-color:var(--ok);color:var(--ok)}
.rate .r2{border-color:var(--mid);color:var(--mid)}
.rate .r3{border-color:var(--ng);color:var(--ng)}
.prog{font-size:13px;color:var(--sub)}
.big{font-size:19px}
/* order */
.pool .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;line-height:1.6}
.opt.bad{animation:shake .35s;border-color:var(--ng)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.done .ln{animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
/* practice */
.prompt{font-size:16.5px;line-height:1.7}
.prompt ul{margin:6px 0 0 0;padding-left:20px}
.photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--hide);display:block}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;text-align:center;letter-spacing:.02em}
.phase{text-align:center;font-size:13px;color:var(--sub);font-weight:600}
.timer.warn{color:var(--ng)}
textarea{width:100%;min-height:180px;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.wc{font-size:13px;color:var(--sub);text-align:right}
.wc.ok{color:var(--ok);font-weight:600}
details{margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.chk input{margin-top:5px;width:18px;height:18px;flex:none}
.tip{font-size:13.5px;color:var(--sub);margin:4px 0;padding-left:1em;text-indent:-1em}
.tip::before{content:"・"}
table.sw{width:100%;border-collapse:collapse;font-size:13.5px}
table.sw td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.sw td:first-child{white-space:nowrap;color:var(--sub);width:5.5em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:.92}
.qa{font-size:14px;padding:8px 0;border-top:1px dashed var(--line)}
.dlg{font-size:14.5px;margin:4px 0}
.dlg b{color:var(--accent)}
.sel{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
/* 模範解答・重要表現・お気に入り */
.key{background:linear-gradient(transparent 55%,var(--key) 55%);font-weight:700;border-radius:2px}
.keys{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.keys .kh{font-weight:700;font-size:14.5px;margin-bottom:2px}
.kl{list-style:none;margin:0;padding:0}
.kl li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.kl li:first-child{border-top:none}
.kl .kb{flex:1;min-width:0}
.ken{font-weight:700;font-size:15.5px;line-height:1.5}
.kja{font-size:13.5px;color:var(--sub)}
.star{border:none;background:transparent;padding:0 2px;font-size:22px;line-height:1.15;color:var(--star);flex:none}
.mq{font-size:14.5px;font-weight:700;margin:16px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.mh{font-size:15px;font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:6px}
/* 単語を完成 */
.rcp,.fibs{font-size:17px;line-height:2.15}
.cw{white-space:nowrap}
.ci{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.3;padding:1px 3px;margin:0 1px 0 0;border:none;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--accent-weak);color:var(--ink);vertical-align:baseline}
.ci:focus{outline:2px solid var(--accent);outline-offset:1px}
.ci::placeholder{color:var(--sub);opacity:.7}
.stick{position:sticky;top:54px;z-index:4;background:var(--bg);padding:2px 0}
.stick .timer{font-size:24px}
.okw{color:var(--ok);font-weight:700}
.ngw{color:var(--ng);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}
.ml li{padding:6px 0}
.lvsel{display:flex;flex-wrap:wrap;gap:6px}
.lvsel button{padding:6px 10px;font-size:13.5px}
.lvsel button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lvsel small{opacity:.75}
.lvc{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.5;border-radius:6px;padding:0 6px;margin:0 4px;vertical-align:1px;white-space:nowrap}
.lv-low{background:#e3f4ea;color:#1e7a45}.lv-mid{background:#fff0d1;color:#8a5d00}.lv-high{background:#fde2e2;color:#b42f2f}
@media (prefers-color-scheme: dark){.lv-low{background:rgba(95,211,148,.18);color:#7fe0ab}.lv-mid{background:rgba(240,185,74,.2);color:#f3c46a}.lv-high{background:rgba(255,118,118,.2);color:#ff9a9a}}
/* RV:CSS:BEGIN */
/* ============================================================
   復習のきまり（5アプリ共通） — 見た目
   正本: .claude/skills_assets/review-core/rv.css（inject.py が各アプリへ配る）
   ・色はアプリの変数に頼らず、この中で完結させる。クラス名は全て rv- 始まり
   ============================================================ */
.rv-bar,.rv-panel,.rv-grade,.rv-note,.rv-modal{
  --rv-ink:#1d2433; --rv-sub:#5f6879; --rv-mute:#8a93a3; --rv-line:#e3e7ee; --rv-card:#fff; --rv-soft:#f5f7fb;
  --rv-acc:#2f6fd6; --rv-g1:#1f8a5b; --rv-g2:#c98a12; --rv-g3:#c4473d;
  color:var(--rv-ink); line-height:1.65; text-align:left;
}
@media (prefers-color-scheme: dark){
  .rv-bar,.rv-panel,.rv-grade,.rv-note,.rv-modal{
    --rv-ink:#e8ecf3; --rv-sub:#aab3c2; --rv-mute:#8590a2; --rv-line:#353d4c; --rv-card:#1d222c; --rv-soft:#252b37;
    --rv-acc:#7aa8ff; --rv-g1:#4cc38a; --rv-g2:#e0aa3e; --rv-g3:#f07a6f;
  }
}
.rv-bar *,.rv-panel *,.rv-grade *,.rv-modal *{box-sizing:border-box;}
.rv-bar{border:1px solid var(--rv-line);background:var(--rv-card);border-radius:12px;padding:12px 14px;margin:10px 0;}
.rv-bar-top{font-size:.95rem;font-weight:700;}
.rv-bar-top b{font-size:1.25rem;}
.rv-bar-tnote{font-size:.72rem;font-weight:400;color:var(--rv-mute);margin-left:4px;}
.rv-meter{height:8px;border-radius:999px;background:var(--rv-soft);overflow:hidden;margin:7px 0 6px;}
.rv-meter i{display:block;height:100%;background:var(--rv-acc);border-radius:999px;}
.rv-full .rv-meter i{background:var(--rv-g1);}
.rv-bar-sub{font-size:.8rem;color:var(--rv-sub);}

.rv-grade{margin-top:12px;}
.rv-grade-q{font-size:.85rem;color:var(--rv-sub);margin-bottom:6px;}
.rv-grade-ref{font-size:.76rem;color:var(--rv-mute);margin:4px 0 6px;}
.rv-g{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;cursor:pointer;
  border:1.5px solid var(--rv-line);background:var(--rv-card);color:var(--rv-ink);font:inherit;}
.rv-g b{display:block;font-size:.95rem;}
.rv-g small{display:block;font-size:.74rem;color:var(--rv-sub);font-weight:400;}
.rv-g1{border-color:color-mix(in srgb, var(--rv-g1) 45%, var(--rv-line));}
.rv-g2{border-color:color-mix(in srgb, var(--rv-g2) 45%, var(--rv-line));}
.rv-g3{border-color:color-mix(in srgb, var(--rv-g3) 45%, var(--rv-line));}
.rv-g1 b{color:var(--rv-g1);} .rv-g2 b{color:var(--rv-g2);} .rv-g3 b{color:var(--rv-g3);}
.rv-g.rv-on{background:var(--rv-soft);box-shadow:inset 0 0 0 2px var(--rv-acc);}
.rv-g[disabled]{opacity:.4;cursor:not-allowed;}

.rv-note{font-size:.78rem;color:var(--rv-sub);background:var(--rv-soft);border-radius:8px;padding:7px 10px;margin-top:8px;}

.rv-panel{border:1px solid var(--rv-line);background:var(--rv-card);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.85rem;}
.rv-panel summary{cursor:pointer;font-weight:700;color:var(--rv-sub);}
.rv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;}
.rv-grid div{background:var(--rv-soft);border-radius:8px;padding:6px 4px;text-align:center;}
.rv-grid b{display:block;font-size:1.05rem;color:var(--rv-ink);}
.rv-grid span{font-size:.68rem;color:var(--rv-sub);}
.rv-h{font-weight:700;margin:12px 0 4px;}
.rv-p{margin:6px 0;color:var(--rv-sub);}
.rv-warn{color:var(--rv-ink);background:var(--rv-soft);border-radius:8px;padding:6px 9px;}
.rv-mute{color:var(--rv-mute);font-size:.75rem;}
.rv-row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--rv-line);padding:6px 0;}
.rv-row-l{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rv-row-b{flex:0 0 auto;display:flex;gap:6px;align-items:center;}
.rv-btn{border:1px solid var(--rv-line);background:var(--rv-card);color:var(--rv-ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:.78rem;cursor:pointer;}
.rv-btn.rv-on{background:var(--rv-acc);border-color:var(--rv-acc);color:#fff;}
.rv-chk{display:block;margin:6px 0;color:var(--rv-sub);}
.rv-chk .rv-btn{margin-left:4px;}

.rv-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;}
.rv-modal-in{background:var(--rv-card);color:var(--rv-ink);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px;}
.rv-modal-b{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
/* RV:CSS:END */
</style>
</head>
<body>
<header><div class="in">
  <button class="back ghost" id="backBtn" style="display:none" aria-label="戻る">←</button>
  <h1 id="title">DET テンプレ暗記</h1>
  <button class="ghost" id="rateBtn" title="読み上げの速さ" style="font-size:13px;padding:5px 9px">🔊 1.0</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   データ：DET_110点_テンプレート集_第2版 のテンプレ早見表と例文
   【…】=空欄（赤） / {{…}}=例文で埋めた部分（緑の下線）
   seq:false = 並べ替えに入れない行
   ========================================================= */
const TASKS = [
{ id:'summ', sec:'Listening', icon:'🎧', name:'Summarize the Conversation', jp:'会話の要約', time:'75秒', words:[40,60], skel:'状況 → 提案 → 結末',
  lines:[
    {r:'① 状況', t:'I talked with 【人】 about 【名】 because 【SV】.', e:'I talked with {{my professor}} about {{my history paper}} because {{I was sick last week and couldn\'t finish my research}}.'},
    {r:'② 提案', t:'【He/She】 suggested that I 【動原】, and also explained that 【SV】.', e:'{{She}} suggested that I {{send her an outline by Friday}}, and also explained that {{she could then give me three extra days}}.'},
    {r:'③ 結末', t:'Although 【SV】, I decided to 【動原】.', e:'Although {{I was worried about my other classes}}, I decided to {{accept her offer}}.'},
  ],
  extra:{h:'型B（三人称で書くとき）', lines:[
    'In this conversation, a student asks 【人】 about 【名】.',
    'The student is worried because 【SV】.',
    '【人】 recommends 【~ing】, since 【SV】.',
    'In the end, they agree to 【動原】.']},
  swap:[['提案','suggested that I 【動原】 ／ advised me to 【動原】 ／ recommended 【~ing】'],['説明','explained that 【SV】 ／ pointed out that 【SV】 ／ mentioned that 【SV】'],['結末','In the end, I decided to 【動原】 ／ We agreed to 【動原】']],
  tips:['箇条書きにせず完全な文で。状況・主な内容・最後どうなったかの3つを入れる。','一人称（I talked with…）でも三人称でもよい（公式）。','✗ suggested me to send → ✓ suggested that I send（that節＋原形）。'],
  practice:{kind:'summ', prep:0, ans:75}
},
{ id:'wphoto', sec:'Writing', icon:'✍️', name:'Write About the Photo', jp:'写真を書く', time:'1分×3', words:[40,60], skel:'全体 → 主役 → 周り → 推測 → 雰囲気',
  lines:[
    {r:'① 全体', t:'The photo shows 【a 形＋名】.', a:'I can see 【名】 in this picture. ／ This image depicts 【名】.', e:'The photo shows {{a beautiful view of the coast}}.'},
    {r:'② 主役', t:'There are 【形, 形＋名】 【~ing / that SV】.', e:'There are {{big, rocky cliffs}} {{that go down to the bright blue sea}}.'},
    {r:'③ 周り', t:'In the distance, 【SV】.', a:'Behind 【名】, 【SV】. ／ On both sides, 【SV】.', e:'In the distance, {{you can see mountains and a clear sky}}.'},
    {r:'④ 推測', t:'I also notice 【名】.', a:'【SV】, like 【SV：推測】. ／ Perhaps 【SV】.', e:'I also notice {{some buildings near the water}}.'},
    {r:'⑤ 雰囲気', t:'The whole scene looks 【形 and 形】.', a:'The whole scene feels 【形】.', e:'The whole scene looks {{peaceful and calm}}.'},
  ],
  swap:[['位置','in the distance ／ in the background ／ closer up ／ on the left ／ in the middle of ／ on both sides ／ behind ／ next to'],['色・形','bright blue ／ sparkling ／ rocky ／ grassy ／ cobbled ／ wooden ／ narrow ／ colorful ／ crowded'],['後ろに足す','lit up by ／ covered in ／ filled with ／ surrounded by ／ coming from ／ walking along ／ whose 名 is'],['推測','Perhaps ／ Presumably ／ like they are ~ing ／ It looks like 【SV】'],['雰囲気','peaceful ／ calm ／ lively ／ busy ／ relaxed ／ cozy ／ the contrast between A and B']],
  tips:['公式の模範解答は50〜65語・3〜5文。1分で4〜5文を目標に。','色・形を2つ重ねる（big, rocky cliffs）＋後ろから説明（lit up by…）で語彙と文法の幅を見せる。','3問で書き出しを変える。時間がないときは①②⑤だけでも成立する。'],
  practice:{kind:'photo', prep:0, ans:60}
},
{ id:'iw1', sec:'Writing', icon:'✍️', name:'Interactive Writing Step 1', jp:'意見を書く（1回目）', time:'5分', words:[100,130], skel:'結論 → 理由＋例 → 理由2 → 譲歩 → まとめ',
  lines:[
    {r:'① 立場', t:'In my opinion, 【SV】.', e:'In my opinion, {{taking a class is a better way to learn a difficult skill than studying alone}}.'},
    {r:'② 理由1＋例', t:'The main reason is that 【SV】. For example, when I 【過去形】, 【SV】.', e:'The main reason is that {{a teacher can point out mistakes that beginners cannot notice}}. For example, when I {{started learning 3D animation with free online videos}}, {{I practiced the same wrong movement for weeks}}.'},
    {r:'③ 理由2', t:'In addition, 【SV】, which 【SV】.', e:'In addition, {{a class gives students a clear schedule}}, which {{helps them keep going even when they feel tired}}.'},
    {r:'④ 譲歩', t:'Although some people argue that 【SV】, I believe 【SV】.', e:'Although some people argue that {{self-study is cheaper and more flexible}}, I believe {{the time a class saves is worth the cost}}.'},

/*MODELS_START*/const MODELS={"iw":[{"s1":["In my opinion, {{all students should be required to take art classes, at least for a few years}}.","The main reason is that {{art teaches students to think creatively and solve problems in their own way}}. For example, when I {{designed a poster for our school festival}}, {{I had to try many different ideas before I found one that worked}}.","In addition, {{art classes give students a break from tests and memorization}}, which {{can reduce stress and make school more enjoyable}}.","Although some people argue that {{art is less useful than math or science}}, I believe {{creative skills are becoming more important in almost every job}}.","For these reasons, {{I think art should be a required subject for everyone}}."],"s2":["Regarding {{students who are not interested in art}}, I think {{schools should connect art to subjects and hobbies they already like}}.","This connects to my earlier point about {{creative problem solving}}, because {{design is used in science, business, and technology}}.","For instance, if {{a student loves video games}}, {{the teacher would let him or her design a game character or a simple level}}.","Therefore, {{art classes would feel more practical}}, although {{some traditional drawing practice would still be necessary}}."],"au1":"m_iw_0_1","au2":"m_iw_0_2","keys":[{"id":"iw:0:think creatively","m":"think creatively","ja":"創造的に考える","g":"","s":"The main reason is that art teaches students to think creatively and solve problems in their own way.","au":"s_7afdd6b6f4","src":"Interactive Writing・お題1"},{"id":"iw:0:solve problems in their own way","m":"solve problems in their own way","ja":"自分なりのやり方で問題を解く","g":"solve problems in 【one's】 own way","s":"The main reason is that art teaches students to think creatively and solve problems in their own way.","au":"s_7afdd6b6f4","src":"Interactive Writing・お題1"},{"id":"iw:0:give students a break from tests","m":"give students a break from tests","ja":"生徒にテストからの息抜きを re, {{small towns could grow again}}, although {{it would take many years}}."],"au1":"m_iw_1_1","au2":"m_iw_1_2","keys":[{"id":"iw:1:offer far more opportunities for","m":"offer far more opportunities for","ja":"〜の機会をはるかに多く与える","g":"offer far more opportunities for 【名】","s":"The main reason is that big cities offer far more opportunities for work and study.","au":"s_b148be0b43","src":"Interactive Writing・お題2"},{"id":"iw:1:especially when you are young","m":"especially when you are young","ja":"特に若いうちは","g":"","s":"In my opinion, it is better to live in a big city, especially when you are young.","au":"s_4c9348d2cd","src":"Interactive Writing・お題2"},{"id":"iw:1:worth the extra cost","m":"worth the extra cost","ja":"余分な費用をかける価値がある","g":"be worth 【名】","s":"Although some people argue that cities are noisy and expensive, I believe the benefits are worth the extra cost for young people who want to grow.","au":"s_b5c90997b9","src":"Interactive Writing・お題2"},{"id":"iw:1:at least until I build my career","m":"at least until I build my career","ja":"少なくともキャリアを築くまでは","g":"at least until 【SV】","s":"For these reasons, I would choose a big city, at least until I build my career.","au":"s_5cb4f67149","src":"Interactive Writing・お題2"},{"id":"iw:1:can be done remotely","m":"can be done remotely","ja":"リモートでできる","g":"","s":"Regarding how small towns can attract young people, I think they should create more jobs that can be done remotely.","au":"s_33b329a46b","src":"Interactive Writing・お題2"}]},{"s1":["In my opinion, {{social media does more good than harm if people use it wisely}}.","The main reason is that {{it allows people to learn from experts all over the world}}. For example, when I {{started studying 3D animation}}, {{I found many professional animators who shared useful tips for free}}.","In addition, {{social media helps people stay in touch with friends who live far away}}, which {{is especially important for students who study abroad}}.","Although some people argue that {{it ildren's use of social media, I think parents should set clear rules instead of banning it completely.","au":"s_a9dfac82d7","src":"Interactive Writing・お題3"},{"id":"iw:2:be more likely to follow it","m":"be more likely to follow it","ja":"それに従う可能性が高くなる","g":"be more likely to 【動原】","s":"For instance, if parents and children decided on a daily time limit together, children would be more likely to follow it.","au":"s_414bf8c593","src":"Interactive Writing・お題3"}]},{"s1":["In my opinion, {{university students should work part-time, but only for a few hours a week}}.","The main reason is that {{a part-time job teaches skills that classes cannot teach}}. For example, when I {{worked at a convenience store}}, {{I learned how to talk politely with all kinds of customers}}.","In addition, {{earning their own money helps students understand its real value}}, which {{makes them more careful about spending}}.","Although some people argue that {{working takes time away from studying}}, I believe {{a few hours a week will not hurt students' grades}}.","For these reasons, {{I think a small part-time job is a valuable experience for university students}}."],"s2":["Regarding {{the most valuable part-time jobs}}, I think {{jobs related to students' future careers are the best}}.","This connects to my earlier point about {{skills}}, because {{students can build practical skills for their field}}.","For instance, if {{a design student worked at a print shop}}, {{he or she would learn how real projects are made}}.","Therefore, {{students should choose their jobs carefully}}, although {{any job can teach responsibility}}."],"au1":"m_iw_3_1","au2":"m_iw_3_2","keys":[{"id":"iw:3:all kinds of customers","m":"all kinds of customers","ja":"あらゆる種類の客","g":"all kinds of 【名】","s":"For example, when I worked at a convenience store, I learned how to talk politely with all kinds of customers.","au":"s_533d63adf8","src":"Interactive Writing・お題4"},{"id":"iw:3:understand its real value","m":"understand its real value","ja":"その本当の価値を理解する","g":"","s":"In addition, earning their own money helps students understand its real value, which makes them more careful about spending.","au":"s_d060c300c7","src":"Interactive Writing・お題4"},{"id":"iw:3:more careful about spending","m":"more careful about spending","ja":"お金を使うことにより慎重な","g":"be careful about 【名/~ing】","s":"In addition, earning their own money helps students understand its real value, which makes them more careful about spending.","au":"s_d060c300c7","src":"Interactive Writing・お題4"},{"id":"iw:3:takes time away from studying","m":"takes time away from studying","ja":"勉強から時間を奪う","g":"take time away from 【名/~ing】","s":"Although some people argue that working takes time away from studying, I believe a few hours a week will not hurt students' grades.","au":"s_cba04bb47c","src":"Interactive Writing・お題4"},{"id":"iw:3:related to students' future careers","m":"related to students' future careers","ja":"学生の将来のキャリアに関係する","g":"【名】 related to 【名】","s":"Regarding the most valuable part-time jobs, I think jobs related to students' future careers are the best.","au":"s_a9486ded22","src":"Interactive Writing・お題4"}]},{"s1":["In my opinion, {{it is better to travel with friends than to travel alone}}.","The main reason is that {{sharing an experience makes it more memorable}}. For example, when I {{went to Kyoto with two classmates}}, {{we got lost on the way to a temple, and we still laugh about it today}}.","In addition, {{traveling with friends is safer and often cheaper}}, which {{is important for students on a tight budget}}.","Although some people argue that {{traveling alone gives you more freedom}}, I believe {{good friends can easily agree on a plan together}}.","For these reasons, {{I prefer to travel with friends whenever I can}}."],"s2":["Regarding {{how the internet has changed trip planning}}, I think {{it has made planning much faster and easier}}.","This connects to my earlier point about {{traveling with friends}}, because {{we can now share maps and plans in a group chat}}.","For instance, if {{we wanted to find a cheap hotel}}, {{we would compare prices and reviews online in a few minutes}}.","Therefore, {{travel has become more accessible}}, although {{too much information can sometimes be confusing}}."],"au1":"m_iw_4_1","au2":"m_iw_4_2","keys":[{"id":"iw:4:makes it more memorable","m":"makes it more memorable","ja":"より思い出深いものにする","g":"make 【名】 more memorable","s":"The main reason is that sharing an experience makes it more memorable.","au":"s_eaa4b0055c","src":"Interactive Writing・お題5"},{"id":"iw:4:got lost on the way to","m":"got lost on the way to","ja":"〜へ行く途中で道に迷った","g":"get lost on the way to 【場所】","s":"For example, when I went to Kyoto with two classmates, we got lost on the way to a temple, and we still laugh about it today.","au":"s_3f247f2290","src":"Interactive Writing・お題5"},{"id":"iw:4:on a tight budget","m":"on a tight budget","ja":"予算が限られた","g":"","s":"In addition, traveling with friends is safer and often cheaper, which is important for students on a tight budget.","au":"s_ac79a45da3","src":"Interactive Writing・お題5"},{"id":"iw:4:whenever I can","m":"whenever I can","ja":"できるときはいつでも","g":"","s":"For these reasons, I prefer to travel with friends whenever I can.","au":"s_92c07307cc","src":"Interactive Writing・お題5"},{"id":"iw:4:has become more accessible","m":"has become more accessible","ja":"より手軽になった","g":"","s":"Therefore, travel has become more accessible, although too much information can sometimes be confusing.","au":"s_9aec5737ae","src":"Interactive Writing・お題5"}]},{"s1":["In my opinion, {{working from home is better than working in an office for many people}}.","The main reason is that {{it saves a lot of time and energy}}. For example, when I {{took online classes during my second year}}, {{I used the two hours I saved every day to practice animation}}.","In addition, {{people can create a work environment that suits them}}, which {{often helps them concentrate better}}.","Although some people argue that {{it is hard to communicate with coworkers from home}}, I believe {{online tools have solved most of these problems}}.","For these reasons, {{I think working from home is a better option, at least a few days a week}}."],"s2":["Regarding {{the skills needed to work from home}}, I think {{time management is the most important one}}.","This connects to my earlier point about {{saving time}}, because {{that extra time is only useful if people plan their day well}}.","For instance, if {{a worker had no schedule}}, {{he or she would easily get distracted by the TV or a phone}}.","Therefore, {{people need strong self-discipline}}, although {{clear communication skills are also important}}."],"au1":"m_iw_5_1","au2":"m_iw_5_2","keys":[{"id":"iw:5:saves a lot of time and energy","m":"saves a lot of time and energy","ja":"時間と労力を大きく節約する","g":"","s":"The main reason is that it saves a lot of time and energy.","au":"s_2c8d3ae40e","src":"Interactive Writing・お題6"},{"id":"iw:5:a work environment that suits them","m":"a work environment that suits them","ja":"自分に合った仕事環境","g":"suit 【人】","s":"In addition, people can create a work environment that suits them, which often helps them concentrate better.","au":"s_7f9f9e5563","src":"Interactive Writing・お題6"},{"id":"iw:5:concentrate better","m":"concentrate better","ja":"よりよく集中する","g":"","s":"In addition, people can create a work environment that suits them, which often helps them concentrate better.","au":"s_7f9f9e5563","src":"Interactive Writing・お題6"},{"id":"iw:5:at least a few days a week","m":"at least a few days a week","ja":"少なくとも週に数日は","g":"","s":"For these reasons, I think working from home is a better option, at least a few days a week.","au":"s_760d98e910","src":"Interactive Writing・お題6"},{"id":"iw:5:get distracted by","m":"get distracted by","ja":"〜に気が散る","g":"get distracted by 【名】","s":"For instance, if a worker had no schedule, he or she would easily get distracted by the TV or a phone.","au":"s_12d8d0efe7","src":"Interactive Writing・お題6"}]},{"s1":["In my opinion, {{governments should spend more money on public transportation}}.","The main reason is that {{good trains and buses reduce traffic and air pollution}}. For example, when I {{visited a city with a new tram system}}, {{the streets were much quieter and cleaner than in my hometown}}.","In addition, {{public transportation helps people who cannot drive}}, which {{includes students, elderly people, and people with disabilities}}.","Although some people argue that {{it is too expensive to build new lines}}, I believe {{the long-term benefits are much greater than the cost}}.","For these reasons, {{I think investing in public transportation is a smart choice}}."],"s2":["Regarding {{the future of public transportation}}, I think {{self-driving buses will become common in the next twenty years}}.","This connects to my earlier point about {{people who cannot drive}}, because {{driverless buses could reach small towns at a low cost}}.","For instance, if {{an elderly woman needed to see a doctor}}, {{she would simply call a bus with an app}}.","Therefore, {{transportation will become more flexible}}, although {{safety rules will need to be very strict}}."],"au1":"m_iw_6_1","au2":"m_iw_6_2","keys":[{"id":"iw:6:reduce traffic and air pollution","m":"reduce traffic and air pollution","ja":"渋滞と大気汚染を減らす","g":"","s":"The main reason is that good trains and buses reduce traffic and air pollution.","au":"s_81867c8adb","src":"Interactive Writing・お題7"},{"id":"iw:6:people with disabilities","m":"people with disabilities","ja":"障がいのある人","g":"","s":"In addition, public transportation helps people who cannot drive, which includes students, elderly people, and people with disabilities.","au":"s_08b53aace5","src":"Interactive Writing・お題7"},{"id":"iw:6:the long-term benefits are much greater than the cost","m":"the long-term benefits are much greater than the cost","ja":"長期的な利益は費用よりはるかに大きい","g":"The long-term benefits are greater than 【名】","s":"Although some people argue that it is too expensive to build new lines, I believe the long-term benefits are much greater than the cost.","au":"s_3d2a2de2b4","src":"Interactive Writing・お題7"},{"id":"iw:6:investing in","m":"investing in","ja":"〜に投資すること","g":"invest in 【名】","s":"For these reasons, I think investing in public transportation is a smart choice.","au":"s_655335717b","src":"Interactive Writing・お題7"},{"id":"iw:6:at a low cost","m":"at a low cost","ja":"低コストで","g":"","s":"This connects to my earlier point about people who cannot drive, because driverless buses could reach small towns at a low cost.","au":"s_b110a8514d","src":"Interactive Writing・お題7"}]},{"s1":["In my opinion, {{it is very important for young people to learn about history}}.","The main reason is that {{history helps us understand why the world is the way it is today}}. For example, when I {{studied World War II in high school}}, {{I finally understood why my grandparents valued peace so much}}.","In addition, {{history shows us the mistakes people made in the past}}, which {{can help us avoid repeating them}}.","Although some people argue that {{history is just memorizing dates and names}}, I believe {{good history classes teach students how to think critically}}.","For these reasons, {{I think every young person should learn history}}."],"s2":["Regarding {{teaching history to teenagers}}, I think {{using stories and videos is the most effective way}}.","This connects to my earlier point about {{understanding the past}}, because {{stories help students imagine how people really lived}}.","For instance, if {{a class watched a short documentary and then discussed it}}, {{students would remember the event much longer}}.","Therefore, {{history can become exciting}}, although {{teachers still need to check the facts carefully}}."],"au1":"m_iw_7_1","au2":"m_iw_7_2","keys":[{"id":"iw:7:why the world is the way it is today","m":"why the world is the way it is today","ja":"なぜ世界が今のようになっているのか","g":"why 【名】 is the way it is","s":"The main reason is that history helps us understand why the world is the way it is today.","au":"s_4328f76f87","src":"Interactive Writing・お題8"},{"id":"iw:7:avoid repeating them","m":"avoid repeating them","ja":"それらを繰り返すのを避ける","g":"avoid 【~ing】","s":"In addition, history shows us the mistakes people made in the past, which can help us avoid repeating them.","au":"s_543aa94316","src":"Interactive Writing・お題8"},{"id":"iw:7:think critically","m":"think critically","ja":"批判的に考える","g":"","s":"Although some people argue that history is just memorizing dates and names, I believe good history classes teach students how to think critically.","au":"s_f35e04a18e","src":"Interactive Writing・お題8"},{"id":"iw:7:imagine how people really lived","m":"imagine how people really lived","ja":"人々が実際どう暮らしていたかを想像する","g":"imagine how 【SV】","s":"This connects to my earlier point about understanding the past, because stories help students imagine how people really lived.","au":"s_90c670c88b","src":"Interactive Writing・お題8"},{"id":"iw:7:the most effective way","m":"the most effective way","ja":"最も効果的な方法","g":"","s":"Regarding teaching history to teenagers, I think using stories and videos is the most effective way.","au":"s_8ab0eaf8d6","src":"Interactive Writing・お題8"}]}],"wsamp":[{"a":["One experience I will never forget is when I {{prepared for the university entrance exam in my last year of high school}}.","At that time, {{my English score was much lower than the level my target university required}}, so I felt {{anxious and frustrated}}. {{I even thought about giving up on that school.}}","To solve this, I decided to {{change the way I studied}}. First, I {{wrote down every word I did not know and reviewed the list every morning}}. Then, I {{solved one old exam every weekend and checked my mistakes carefully}}.","As a result, {{my score went up by almost thirty points in six months, and I passed the exam}}.","What I learned from this experience is that {{small daily habits can lead to big changes}}. Since then, I have {{used the same method whenever I face a difficult goal, including my preparation for studying abroad}}."],"tpl":"","au":"m_ws_0","keys":[{"id":"wsamp:0:thought about giving up on","m":"thought about giving up on","ja":"〜を諦めようかと考えた","g":"think about giving up on 【名】","s":"I even thought about giving up on that school.","au":"s_bc4a96d805","src":"Writing Sample・お題1"},{"id":"wsamp:0:change the way I studied","m":"change the way I studied","ja":"勉強のやり方を変える","g":"change the way I 【過去形】","s":"To solve this, I decided to change the way I studied.","au":"s_185ba80785","src":"Writing Sample・お題1"},{"id":"wsamp:0:went up by almost thirty points","m":"went up by almost thirty points","ja":"30点近く上がった","g":"go up by 【数】","s":"As a result, my score went up by almost thirty points in six months, and I passed the exam.","au":"s_e7a3649d7a","src":"Writing Sample・お題1"},{"id":"wsamp:0:lead to big changes","m":"lead to big changes","ja":"大きな変化につながる","g":"lead to 【名】","s":"What I learned from this experience is that small daily habits can lead to big changes.","au":"s_db8cdb5279","src":"Writing Sample・お題1"},{"id":"wsamp:0:whenever I face a difficult goal","m":"whenever I face a difficult goal","ja":"難しい目標に直面するときはいつも","g":"whenever I face 【名】","s":"Since then, I have used the same method whenever I face a difficult goal, including my preparation for studying abroad.","au":"s_4c5b1eb310","src":"Writing Sample・お題1"}]},{"a":["One experience I will never forget is when I {{met my art teacher in my second year of high school}}.","At that time, {{I liked drawing, but I did not believe I was good enough to make it my career}}, so I felt {{unsure about my future}}.","To solve this, I decided to {{ask her for honest advice}}. First, I {{showed her a notebook full of my character sketches}}. Then, I {{followed her suggestion to draw from real life for ten minutes every day}}. {{She checked my drawings every Friday and always pointed out one thing to improve.}}","As a result, {{my drawings became much more natural, and I gained the confidence to apply to an animation program}}.","What I learned from this experience is that {{one person's encouragement can change the direction of your life}}. Since then, I have {{tried to give honest and kind feedback to my friends, just as she did for me}}."],"tpl":"","au":"m_ws_1","keys":[{"id":"wsamp:1:good enough to make it my career","m":"good enough to make it my career","ja":"それを仕事にできるほど上手い","g":"good enough to 【動原】","s":"At that time, I liked drawing, but I did not believe I was good enough to make it my career, so I felt unsure about my future.","au":"s_d3532ae8ba","src":"Writing Sample・お題2"},{"id":"wsamp:1:unsure about my future","m":"unsure about my future","ja":"将来に自信が持てない","g":"unsure about 【名】","s":"At that time, I liked drawing, but I did not believe I was good enough to make it my career, so I felt unsure about my future.","au":"s_d3532ae8ba","src":"Writing Sample・お題2"},{"id":"wsamp:1:pointed out one thing to improve","m":"pointed out one thing to improve","ja":"直すべき点を1つ指摘した","g":"point out 【名】","s":"She checked my drawings every Friday and always pointed out one thing to improve.","au":"s_d5b8281d02","src":"Writing Sample・お題2"},{"id":"wsamp:1:gained the confidence to","m":"gained the confidence to","ja":"〜する自信がついた","g":"gain the confidence to 【動原】","s":"As a result, my drawings became much more natural, and I gained the confidence to apply to an animation program.","au":"s_b0c658694f","src":"Writing Sample・お題2"},{"id":"wsamp:1:change the direction of your life","m":"change the direction of your life","ja":"人生の方向を変える","g":"","s":"What I learned from this experience is that one person's encouragement can change the direction of your life.","au":"s_e8f485ec77","src":"Writing Sample・お題2"}]},{"a":["One experience I will never forget is when I {{had to choose between a stable job offer and studying animation abroad}}.","At that time, {{my parents wanted me to accept the job, and most of my friends were starting their careers}}, so I felt {{a lot of pressure}}.","To solve this, I decided to {{collect as much information as possible before deciding}}. First, I {{talked with an advisor who knows the animation industry well}}. Then, I {{made a list of the risks and benefits of each choice}}. {{Finally, I explained my plan to my parents in detail.}}","As a result, {{they understood how serious I was, and I chose to study abroad}}. {{I still believe it was the right choice for me.}}","What I learned from this experience is that {{a difficult decision becomes easier when you look at it calmly}}. Since then, I have {{written down the pros and cons whenever I need to make an important choice}}."],"tpl":"","au":"m_ws_2","keys":[{"id":"wsamp:2:choose between","m":"choose between","ja":"AとBのどちらかを選ぶ","g":"choose between 【A】 and 【B】","s":"One experience I will never forget is when I had to choose between a stable job offer and studying animation abroad.","au":"s_5d02e0e9a7","src":"Writing Sample・お題3"},{"id":"wsamp:2:as much information as possible","m":"as much information as possible","ja":"できるだけ多くの情報","g":"","s":"To solve this, I decided to collect as much information as possible before deciding.","au":"s_5830576695","src":"Writing Sample・お題3"},{"id":"wsamp:2:in detail","m":"in detail","ja":"詳しく","g":"","s":"Finally, I explained my plan to my parents in detail.","au":"s_2df75cd8b5","src":"Writing Sample・お題3"},{"id":"wsamp:2:how serious I was","m":"how serious I was","ja":"私がどれほど本気か","g":"how 【形】 【SV】","s":"As a result, they understood how serious I was, and I chose to study abroad.","au":"s_3da6c238e4","src":"Writing Sample・お題3"},{"id":"wsamp:2:the pros and cons","m":"the pros and cons","ja":"良い点と悪い点","g":"","s":"Since then, I have written down the pros and cons whenever I need to make an important choice.","au":"s_cc4825e0e5","src":"Writing Sample・お題3"}]},{"a":["One experience I will never forget is when I {{forgot to save my work before an important deadline}}.","At that time, {{I was finishing a group video project, and my computer suddenly shut down}}, so I felt {{completely shocked}}. {{I had lost about five hours of editing.}}","To solve this, I decided to {{tell my team the truth right away}}. First, I {{apologized and explained what had happened}}. Then, I {{stayed up late and rebuilt the video with help from one teammate}}.","As a result, {{we submitted the project on time, although it was not as polished as we had hoped}}.","What I learned from this experience is that {{being honest about a mistake quickly makes it much easier to fix}}. Since then, I have {{set my software to save automatically and kept backups of all my files}}."],"tpl":"","au":"m_ws_3","keys":[{"id":"wsamp:3:suddenly shut down","m":"suddenly shut down","ja":"突然（電源が）落ちた","g":"shut down","s":"At that time, I was finishing a group video project, and my computer suddenly shut down, so I felt completely shocked.","au":"s_4afba6dee4","src":"Writing Sample・お題4"},{"id":"wsamp:3:tell my team the truth right away","m":"tell my team the truth right away","ja":"すぐにチームに本当のことを言う","g":"tell 【人】 the truth right away","s":"To solve this, I decided to tell my team the truth right away.","au":"s_fd618fee6f","src":"Writing Sample・お題4"},{"id":"wsamp:3:stayed up late","m":"stayed up late","ja":"夜遅くまで起きていた","g":"stay up late","s":"Then, I stayed up late and rebuilt the video with help from one teammate.","au":"s_e67ada4523","src":"Writing Sample・お題4"},{"id":"wsamp:3:on time","m":"on time","ja":"期限どおりに","g":"","s":"As a result, we submitted the project on time, although it was not as polished as we had hoped.","au":"s_d2227daac9","src":"Writing Sample・お題4"},{"id":"wsamp:3:not as polished as we had hoped","m":"not as polished as we had hoped","ja":"期待したほど完成度は高くない","g":"not as 【形】 as I had hoped","s":"As a result, we submitted the project on time, although it was not as polished as we had hoped.","au":"s_d2227daac9","src":"Writing Sample・お題4"}]},{"a":["One experience I will never forget is when I {{helped an exchange student from Brazil during her first month in Japan}}.","At that time, {{she could not read Japanese and was having trouble with daily tasks like shopping and taking the train}}, so I felt {{worried about her}}.","To solve this, I decided to {{spend some time with her after class each week}}. First, I {{showed her how to use a train app and buy a commuter pass}}. Then, I {{took her to a supermarket and explained the labels on common foods}}.","As a result, {{she became much more independent, and we became close friends}}. {{She even taught me some Portuguese in return.}}","What I learned from this experience is that {{a little help can make a big difference to someone in a new place}}. Since then, I have {{tried to talk to new students first, because I know how lonely it can feel}}."],"tpl":"","au":"m_ws_4","keys":[{"id":"wsamp:4:having trouble with","m":"having trouble with","ja":"〜に苦労していた","g":"have trouble with 【名】","s":"At that time, she could not read Japanese and was having trouble with daily tasks like shopping and taking the train, so I felt worried about her.","au":"s_cc34cd824e","src":"Writing Sample・お題5"},{"id":"wsamp:4:showed her how to","m":"showed her how to","ja":"彼女に〜のやり方を見せた","g":"show 【人】 how to 【動原】","s":"First, I showed her how to use a train app and buy a commuter pass.","au":"s_0ace15e76a","src":"Writing Sample・お題5"},{"id":"wsamp:4:in return","m":"in return","ja":"お返しに","g":"","s":"She even taught me some Portuguese in return.","au":"s_773147e680","src":"Writing Sample・お題5"},{"id":"wsamp:4:make a big difference to","m":"make a big difference to","ja":"〜にとって大きな違いを生む","g":"make a big difference to 【人】","s":"What I learned from this experience is that a little help can make a big difference to someone in a new place.","au":"s_7880fa6e2a","src":"Writing Sample・お題5"},{"id":"wsamp:4:how lonely it can feel","m":"how lonely it can feel","ja":"どれほど心細く感じるか","g":"","s":"Since then, I have tried to talk to new students first, because I know how lonely it can feel.","au":"s_f83d688ddc","src":"Writing Sample・お題5"}]},{"a":["One experience I will never forget is when I {{taught myself 3D modeling with free online tutorials}}.","At that time, {{I had no teacher, and the software had hundreds of buttons I did not understand}}, so I felt {{overwhelmed}}.","To solve this, I decided to {{focus on one small project at a time}}. First, I {{copied a simple cup model by following a beginner video step by step}}. Then, I {{joined an online community and asked other learners to comment on my work}}. {{Every week, I set a new goal, like making a chair or a small room.}}","As a result, {{after six months I was able to build a complete room with furniture and lighting}}.","What I learned from this experience is that {{you can learn almost anything if you break it into small, clear goals}}. Since then, I have {{used this approach to study both animation and English}}."],"tpl":"","au":"m_ws_5","keys":[{"id":"wsamp:5:taught myself","m":"taught myself","ja":"独学した","g":"teach myself 【名】","s":"One experience I will never forget is when I taught myself 3D modeling with free online tutorials.","au":"s_a3098e33fd","src":"Writing Sample・お題6"},{"id":"wsamp:5:overwhelmed","m":"overwhelmed","ja":"（多すぎて）圧倒された","g":"","s":"At that time, I had no teacher, and the software had hundreds of buttons I did not understand, so I felt overwhelmed.","au":"s_8552ab9821","src":"Writing Sample・お題6"},{"id":"wsamp:5:one small project at a time","m":"one small project at a time","ja":"一度に小さな課題を1つずつ","g":"one 【名】 at a time","s":"To solve this, I decided to focus on one small project at a time.","au":"s_baef094479","src":"Writing Sample・お題6"},{"id":"wsamp:5:step by step","m":"step by step","ja":"一歩ずつ","g":"","s":"First, I copied a simple cup model by following a beginner video step by step.","au":"s_445bde8f4d","src":"Writing Sample・お題6"},{"id":"wsamp:5:break it into small, clear goals","m":"break it into small, clear goals","ja":"小さくはっきりした目標に分ける","g":"break 【名】 into small goals","s":"What I learned from this experience is that you can learn almost anything if you break it into small, clear goals.","au":"s_62684c930d","src":"Writing Sample・お題6"}]},{"a":["In my opinion, {{it is better to choose a job you love than a job that pays well}}.","The main reason is that {{people spend most of their adult lives at work, so enjoying it is essential}}. For example, when I {{worked at a part-time job I did not like}}, {{I felt tired and unmotivated even though the pay was good}}. {{In contrast, I can spend hours on animation without noticing the time.}}","In addition, {{people who love their work usually improve faster}}, which {{can eventually lead to a higher salary as well}}.","Although some people argue that {{money is necessary for a stable life}}, I believe {{a job you love can also become a stable career if you keep developing your skills}}.","For these reasons, {{I think passion should come first when choosing a job, and money will follow}}."],"tpl":"iw1","au":"m_ws_6","keys":[{"id":"wsamp:6:unmotivated","m":"unmotivated","ja":"やる気が出ない","g":"","s":"For example, when I worked at a part-time job I did not like, I felt tired and unmotivated even though the pay was good.","au":"s_9b31aca807","src":"Writing Sample・お題7"},{"id":"wsamp:6:even though the pay was good","m":"even though the pay was good","ja":"給料はよかったのに","g":"even though 【SV】","s":"For example, when I worked at a part-time job I did not like, I felt tired and unmotivated even though the pay was good.","au":"s_9b31aca807","src":"Writing Sample・お題7"},{"id":"wsamp:6:without noticing the time","m":"without noticing the time","ja":"時間を忘れて","g":"","s":"In contrast, I can spend hours on animation without noticing the time.","au":"s_9d3fa33bc7","src":"Writing Sample・お題7"},{"id":"wsamp:6:as well","m":"as well","ja":"〜も（同様に）","g":"","s":"In addition, people who love their work usually improve faster, which can eventually lead to a higher salary as well.","au":"s_80d24d2378","src":"Writing Sample・お題7"},{"id":"wsamp:6:should come first","m":"should come first","ja":"最優先されるべき","g":"come first","s":"For these reasons, I think passion should come first when choosing a job, and money will follow.","au":"s_9d518c628b","src":"Writing Sample・お題7"}]},{"a":["In my opinion, {{studying abroad is one of the most valuable experiences a young person can have}}.","The main reason is that {{living in another country forces you to step out of your comfort zone}}. For example, when I {{joined a two-week program in Canada}}, {{I had to ask strangers for directions and order food in English every day}}. {{It was scary at first, but I quickly became more confident.}}","In addition, {{studying abroad lets students meet people with different values}}, which {{helps them see their own culture more objectively}}.","Although some people argue that {{studying abroad is too expensive}}, I believe {{scholarships and part-time work can make it possible for many students}}.","For these reasons, {{I strongly recommend studying abroad, especially for students who want an international career in the future}}."],"tpl":"iw1","au":"m_ws_7","keys":[{"id":"wsamp:7:step out of your comfort zone","m":"step out of your comfort zone","ja":"居心地のよい場所から一歩出る","g":"","s":"The main reason is that living in another country forces you to step out of your comfort zone.","au":"s_5b1b36c651","src":"Writing Sample・お題8"},{"id":"wsamp:7:ask strangers for directions","m":"ask strangers for directions","ja":"知らない人に道をたずねる","g":"ask 【人】 for directions","s":"For example, when I joined a two-week program in Canada, I had to ask strangers for directions and order food in English every day.","au":"s_0f06cecdf5","src":"Writing Sample・お題8"},{"id":"wsamp:7:at first","m":"at first","ja":"最初は","g":"","s":"It was scary at first, but I quickly became more confident.","au":"s_373dac6b28","src":"Writing Sample・お題8"},{"id":"wsamp:7:more objectively","m":"more objectively","ja":"より客観的に","g":"","s":"In addition, studying abroad lets students meet people with different values, which helps them see their own culture more objectively.","au":"s_d6e65c0d7e","src":"Writing Sample・お題8"},{"id":"wsamp:7:make it possible for many students","m":"make it possible for many students","ja":"多くの学生にとって可能にする","g":"make it possible for 【人】","s":"Although some people argue that studying abroad is too expensive, I believe scholarships and part-time work can make it possible for many students.","au":"s_b7c3cb2284","src":"Writing Sample・お題8"}]}],"rts":[{"a":["I'd like to talk about {{an animated movie called Spirited Away}}.","To begin with, {{it is about a ten-year-old girl who gets lost in a world of spirits and has to work in a bathhouse to save her parents}}. {{Her parents have been turned into pigs, so she has to be brave on her own.}}","As for {{why I liked it}}, {{the animation is incredibly detailed and full of imagination}}. For example, {{every character, even a tiny soot creature, moves in a unique and believable way}}. {{As someone who wants to be an animator, I learned a lot just by watching how the characters walk and eat.}}","Finally, {{I would definitely recommend it to others}}, because {{the story works for both children and adults}}. {{Kids enjoy the adventure, while adults can think about its deeper messages about growing up.}}","So, overall, {{this movie is not only entertaining but also inspiring, and I watch it again almost every year}}."],"au":"m_rts_0","keys":[{"id":"rts:0:full of imagination","m":"full of imagination","ja":"想像力にあふれた","g":"","s":"As for why I liked it, the animation is incredibly detailed and full of imagination.","au":"s_45b4ce201b","src":"Read, Then Speak・お題1"},{"id":"rts:0:in a unique and believable way","m":"in a unique and believable way","ja":"独特で本物らしいやり方で","g":"in a 【形】 way","s":"For example, every character, even a tiny soot creature, moves in a unique and believable way.","au":"s_28e616d56f","src":"Read, Then Speak・お題1"},{"id":"rts:0:As someone who wants to be an animator","m":"As someone who wants to be an animator","ja":"アニメーター志望の者として","g":"As someone who 【V】, 〜","s":"As someone who wants to be an animator, I learned a lot just by watching how the characters walk and eat.","au":"s_f4d2806174","src":"Read, Then Speak・お題1"},{"id":"rts:0:works for both children and adults","m":"works for both children and adults","ja":"子どもにも大人にも合う","g":"work for both A and B","s":"Finally, I would definitely recommend it to others, because the story works for both children and adults.","au":"s_60bd17f0c8","src":"Read, Then Speak・お題1"},{"id":"rts:0:not only entertaining but also inspiring","m":"not only entertaining but also inspiring","ja":"楽しいだけでなく刺激にもなる","g":"not only A but also B","s":"So, overall, this movie is not only entertaining but also inspiring, and I watch it again almost every year.","au":"s_3269060a0c","src":"Read, Then Speak・お題1"}]},{"a":["I'd like to talk about {{my grandmother, who ran a small bakery for over forty years}}.","To begin with, {{she is a hardworking and cheerful person who is now eighty years old}}. {{She still wakes up at five every morning.}}","As for {{what she has done}}, {{she started the bakery by herself after my grandfather became sick}}. For example, {{she learned to bake bread from books and kept the shop open six days a week while raising three children}}. {{Many people in our town still remember her melon bread.}}","Finally, {{I admire her}}, because {{she never complained, even when things were really difficult}}. {{She always said that hard work is the best answer to any problem.}}","So, overall, {{she is a role model for me, and I hope to work with the same passion when I become an animator}}."],"au":"m_rts_1","keys":[{"id":"rts:1:ran a small bakery","m":"ran a small bakery","ja":"小さなパン屋を経営していた","g":"run a 【店・会社】","s":"I'd like to talk about my grandmother, who ran a small bakery for over forty years.","au":"s_7af639d32f","src":"Read, Then Speak・お題2"},{"id":"rts:1:by herself","m":"by herself","ja":"ひとりで","g":"by 【oneself】","s":"As for what she has done, she started the bakery by herself after my grandfather became sick.","au":"s_be44af1891","src":"Read, Then Speak・お題2"},{"id":"rts:1:while raising three children","m":"while raising three children","ja":"3人の子どもを育てながら","g":"while 【~ing】","s":"For example, she learned to bake bread from books and kept the shop open six days a week while raising three children.","au":"s_9e3323ce5f","src":"Read, Then Speak・お題2"},{"id":"rts:1:even when things were really difficult","m":"even when things were really difficult","ja":"本当に大変なときでも","g":"","s":"Finally, I admire her, because she never complained, even when things were really difficult.","au":"s_03e6dd9a69","src":"Read, Then Speak・お題2"},{"id":"rts:1:a role model","m":"a role model","ja":"お手本（となる人）","g":"","s":"So, overall, she is a role model for me, and I hope to work with the same passion when I become an animator.","au":"s_ae5c2b6d33","src":"Read, Then Speak・お題2"}]},{"a":["I'd like to talk about {{a skill I learned recently, which is cooking simple Japanese meals}}.","To begin with, {{the skill is making healthy dishes like miso soup, rice bowls, and stir-fried vegetables}}. {{Before this year, I could only make instant noodles.}}","As for {{how I learned it}}, {{I mainly watched short cooking videos online}}. For example, {{every Sunday I picked one recipe, bought the ingredients, and cooked it while pausing the video after each step}}. {{My first attempts were not very good, but I improved little by little.}}","Finally, {{this skill has helped me a lot}}, because {{I now spend less money on food and feel healthier}}. {{It will also be very useful when I live alone abroad.}}","So, overall, {{learning to cook was a small change, but it has made my daily life much better}}."],"au":"m_rts_2","keys":[{"id":"rts:2:My first attempts were not very good","m":"My first attempts were not very good","ja":"最初のうちはあまりうまくいかなかった","g":"","s":"My first attempts were not very good, but I improved little by little.","au":"s_9d02cb9d54","src":"Read, Then Speak・お題3"},{"id":"rts:2:little by little","m":"little by little","ja":"少しずつ","g":"","s":"My first attempts were not very good, but I improved little by little.","au":"s_9d02cb9d54","src":"Read, Then Speak・お題3"},{"id":"rts:2:has helped me a lot","m":"has helped me a lot","ja":"とても役に立っている","g":"","s":"Finally, this skill has helped me a lot, because I now spend less money on food and feel healthier.","au":"s_e444b71582","src":"Read, Then Speak・お題3"},{"id":"rts:2:spend less money on food","m":"spend less money on food","ja":"食費を減らす","g":"spend less money on 【名】","s":"Finally, this skill has helped me a lot, because I now spend less money on food and feel healthier.","au":"s_e444b71582","src":"Read, Then Speak・お題3"},{"id":"rts:2:made my daily life much better","m":"made my daily life much better","ja":"毎日の生活をずっとよくした","g":"make 【名】 better","s":"So, overall, learning to cook was a small change, but it has made my daily life much better.","au":"s_eade955be2","src":"Read, Then Speak・お題3"}]},{"a":["I'd like to talk about {{a trip I took to Hokkaido with my family two years ago}}.","To begin with, {{we went to Sapporo and a small town called Biei in the middle of summer}}.","As for {{what we did there}}, {{we rented a car and drove through huge flower fields}}. For example, {{we saw hills covered in purple lavender and ate fresh ice cream made from local milk}}. {{In the evening, we tried a famous soup curry in Sapporo.}}","Finally, {{this trip was memorable}}, because {{it was the first time in many years that my whole family traveled together}}. {{My brother and I were busy with school, so it felt really special to spend a whole week together.}}","So, overall, {{it was a relaxing and meaningful trip, and I would love to go back someday}}."],"au":"m_rts_3","keys":[{"id":"rts:3:in the middle of summer","m":"in the middle of summer","ja":"真夏に","g":"","s":"To begin with, we went to Sapporo and a small town called Biei in the middle of summer.","au":"s_1d39eca2e4","src":"Read, Then Speak・お題4"},{"id":"rts:3:covered in purple lavender","m":"covered in purple lavender","ja":"紫のラベンダーに覆われた","g":"covered in 【名】","s":"For example, we saw hills covered in purple lavender and ate fresh ice cream made from local milk.","au":"s_f3b1311ca4","src":"Read, Then Speak・お題4"},{"id":"rts:3:made from local milk","m":"made from local milk","ja":"地元の牛乳から作られた","g":"made from 【名】","s":"For example, we saw hills covered in purple lavender and ate fresh ice cream made from local milk.","au":"s_f3b1311ca4","src":"Read, Then Speak・お題4"},{"id":"rts:3:the first time in many years","m":"the first time in many years","ja":"何年かぶりに","g":"It was the first time in many years that 【SV】","s":"Finally, this trip was memorable, because it was the first time in many years that my whole family traveled together.","au":"s_547cc2ecc1","src":"Read, Then Speak・お題4"},{"id":"rts:3:would love to go back someday","m":"would love to go back someday","ja":"いつかまた行きたい","g":"","s":"So, overall, it was a relaxing and meaningful trip, and I would love to go back someday.","au":"s_0dd5b380ab","src":"Read, Then Speak・お題4"}]},{"a":["I'd like to talk about {{a Japanese tradition called hatsumode, which is the first shrine visit of the new year}}.","To begin with, {{it is a custom where people visit a shrine or a temple to pray for a good year}}. {{Many people also buy a fortune paper called omikuji.}}","As for {{when people do it}}, {{most people go during the first three days of January}}. For example, {{famous shrines in Tokyo can have more than a million visitors on New Year's Day}}. {{My family usually goes to a small local shrine on January first.}}","Finally, {{I really like this tradition}}, because {{it gives me a chance to think about my goals for the year}}. {{Standing in the cold air with my family makes me feel calm and refreshed.}}","So, overall, {{hatsumode is a simple but meaningful custom that helps me start the year in a positive way}}."],"au":"m_rts_4","keys":[{"id":"rts:4:a custom where people","m":"a custom where people","ja":"人々が〜する習慣","g":"a custom where 【SV】","s":"To begin with, it is a custom where people visit a shrine or a temple to pray for a good year.","au":"s_aaa2ccc9e1","src":"Read, Then Speak・お題5"},{"id":"rts:4:pray for a good year","m":"pray for a good year","ja":"よい一年を祈る","g":"pray for 【名】","s":"To begin with, it is a custom where people visit a shrine or a temple to pray for a good year.","au":"s_aaa2ccc9e1","src":"Read, Then Speak・お題5"},{"id":"rts:4:gives me a chance to","m":"gives me a chance to","ja":"私に〜する機会をくれる","g":"give 【人】 a chance to 【動原】","s":"Finally, I really like this tradition, because it gives me a chance to think about my goals for the year.","au":"s_ab3b54e68c","src":"Read, Then Speak・お題5"},{"id":"rts:4:calm and refreshed","m":"calm and refreshed","ja":"落ち着いてすっきりした","g":"","s":"Standing in the cold air with my family makes me feel calm and refreshed.","au":"s_189962ee28","src":"Read, Then Speak・お題5"},{"id":"rts:4:in a positive way","m":"in a positive way","ja":"前向きに","g":"","s":"So, overall, hatsumode is a simple but meaningful custom that helps me start the year in a positive way.","au":"s_50d1747fe8","src":"Read, Then Speak・お題5"}]},{"a":["I'd like to talk about {{my smartphone, which I use every day}}.","To begin with, {{it is a small device, but it works like a computer, a camera, and a wallet at the same time}}.","As for {{how I use it}}, {{I mainly use it for studying and communication}}. For example, {{I review English vocabulary with an app on the train and send messages to my classmates about group projects}}. {{I also use it to record reference videos for my animation practice.}}","Finally, {{my life would be much less convenient without it}}, because {{I would need several different tools to do the same things}}. {{I would also feel a little disconnected from my friends.}}","So, overall, {{my smartphone is an essential tool for both my studies and my daily life}}."],"au":"m_rts_5","keys":[{"id":"rts:5:works like a computer","m":"works like a computer","ja":"コンピューターのように機能する","g":"work like 【名】","s":"To begin with, it is a small device, but it works like a computer, a camera, and a wallet at the same time.","au":"s_6c55977a30","src":"Read, Then Speak・お題6"},{"id":"rts:5:at the same time","m":"at the same time","ja":"同時に","g":"","s":"To begin with, it is a small device, but it works like a computer, a camera, and a wallet at the same time.","au":"s_6c55977a30","src":"Read, Then Speak・お題6"},{"id":"rts:5:much less convenient without it","m":"much less convenient without it","ja":"それがないとずっと不便","g":"would be much less convenient without 【名】","s":"Finally, my life would be much less convenient without it, because I would need several different tools to do the same things.","au":"s_cdaf74089c","src":"Read, Then Speak・お題6"},{"id":"rts:5:disconnected from","m":"disconnected from","ja":"〜から切り離された","g":"feel disconnected from 【名】","s":"I would also feel a little disconnected from my friends.","au":"s_d2b44b4543","src":"Read, Then Speak・お題6"},{"id":"rts:5:an essential tool for","m":"an essential tool for","ja":"〜に欠かせない道具","g":"an essential tool for 【名】","s":"So, overall, my smartphone is an essential tool for both my studies and my daily life.","au":"s_7244e02823","src":"Read, Then Speak・お題6"}]},{"a":["I'd like to talk about {{my goal for the next five years, which is to work as a 3D animator at an international studio}}.","To begin with, {{I want to create character animations for films or games that people all over the world can enjoy}}.","As for {{what I am doing to achieve it}}, {{I am preparing to study at an animation school in Canada}}. For example, {{I practice animation in Maya every day and study English to meet the school's requirements}}. {{I also share my work online to get feedback from professionals.}}","Finally, {{I might face some challenges}}, because {{the industry is very competitive and I will be living in a foreign country}}. {{However, I believe steady practice will help me overcome these difficulties.}}","So, overall, {{this goal is challenging, but I am taking clear steps toward it every day}}."],"au":"m_rts_6","keys":[{"id":"rts:6:meet the school's requirements","m":"meet the school's requirements","ja":"学校の要件を満たす","g":"meet the requirements","s":"For example, I practice animation in Maya every day and study English to meet the school's requirements.","au":"s_fa1cbb9326","src":"Read, Then Speak・お題7"},{"id":"rts:6:get feedback from professionals","m":"get feedback from professionals","ja":"プロから意見をもらう","g":"get feedback from 【人】","s":"I also share my work online to get feedback from professionals.","au":"s_0c88ce9b1c","src":"Read, Then Speak・お題7"},{"id":"rts:6:very competitive","m":"very competitive","ja":"競争が激しい","g":"","s":"Finally, I might face some challenges, because the industry is very competitive and I will be living in a foreign country.","au":"s_a5174f6c63","src":"Read, Then Speak・お題7"},{"id":"rts:6:overcome these difficulties","m":"overcome these difficulties","ja":"これらの困難を乗り越える","g":"overcome 【名】","s":"However, I believe steady practice will help me overcome these difficulties.","au":"s_216a73f1b6","src":"Read, Then Speak・お題7"},{"id":"rts:6:taking clear steps toward it","m":"taking clear steps toward it","ja":"それに向けて着実に進んでいる","g":"take steps toward 【目標】","s":"So, overall, this goal is challenging, but I am taking clear steps toward it every day.","au":"s_e906e44f6e","src":"Read, Then Speak・お題7"}]},{"a":["I'd like to talk about {{my favorite way to relax, which is taking a long walk by the river near my house}}.","To begin with, {{I simply walk for about an hour while listening to music or a podcast}}. {{Sometimes I stop at a small café on the way.}}","As for {{how often I do it}}, {{I usually go two or three times a week}}. For example, {{after a long day of studying, I go out in the evening when the air is cool and the sky is changing color}}.","Finally, {{walking helps me relax}}, because {{it clears my head and gives me time away from screens}}. {{I often come up with new ideas for my animations while I walk.}}","So, overall, {{walking by the river is a simple habit that keeps both my body and mind healthy}}."],"au":"m_rts_7","keys":[{"id":"rts:7:on the way","m":"on the way","ja":"途中で","g":"","s":"Sometimes I stop at a small café on the way.","au":"s_555835b529","src":"Read, Then Speak・お題8"},{"id":"rts:7:after a long day of studying","m":"after a long day of studying","ja":"一日じゅう勉強したあとで","g":"after a long day of 【~ing】","s":"For example, after a long day of studying, I go out in the evening when the air is cool and the sky is changing color.","au":"s_039e1b9fc2","src":"Read, Then Speak・お題8"},{"id":"rts:7:clears my head","m":"clears my head","ja":"頭をすっきりさせる","g":"clear 【one's】 head","s":"Finally, walking helps me relax, because it clears my head and gives me time away from screens.","au":"s_6b52c93c0e","src":"Read, Then Speak・お題8"},{"id":"rts:7:time away from screens","m":"time away from screens","ja":"画面から離れる時間","g":"","s":"Finally, walking helps me relax, because it clears my head and gives me time away from screens.","au":"s_6b52c93c0e","src":"Read, Then Speak・お題8"},{"id":"rts:7:come up with new ideas","m":"come up with new ideas","ja":"新しいアイデアを思いつく","g":"come up with 【名】","s":"I often come up with new ideas for my animations while I walk.","au":"s_58f2fd75dd","src":"Read, Then Speak・お題8"}]}],"ispk":[{"a":[["I usually {{bring a homemade lunch, like a rice bowl with chicken and vegetables}}.","That's mainly because {{it is cheaper and healthier than buying food at a convenience store}}.","For example, {{last Sunday I made a big pot of curry and ate it for lunch for three days}}.","So, {{cooking at home saves me both money and time during the week}}."],["Personally, I prefer {{cooking at home, although I enjoy eating out sometimes}}.","That's mainly because {{I can choose fresh ingredients and control how much oil and salt I use}}.","For example, {{last month I made ramen from scratch, and it tasted almost as good as a restaurant's}}.","So, {{cooking at home is both healthier and more fun for me}}."],["Yes, I think so. {{It should be more strictly regulated, especially when it is advertised to children}}.","That's mainly because {{many fast food meals contain too much sugar, salt, and fat}}.","For example, {{I read that one large burger set can have more than half the salt an adult needs in a day}}.","So, {{clear warning labels and limits on advertising would help people make healthier choices}}."]],"au":["m_is_0_0","m_is_0_1","m_is_0_2"],"keys":[{"id":"ispk:0:saves me both money and time","m":"saves me both money and time","ja":"お金と時間の両方を節約してくれる","g":"save 【人】 money and time","s":"So, cooking at home saves me both money and time during the week.","au":"s_5b6c3cf348","src":"Interactive Speaking・Food"},{"id":"ispk:0:control how much oil and salt I use","m":"control how much oil and salt I use","ja":"油や塩をどれだけ使うか調整する","g":"control how much 【名】 I use","s":"That's mainly because I can choose fresh ingredients and control how much oil and salt I use.","au":"s_69690decab","src":"Interactive Speaking・Food"},{"id":"ispk:0:from scratch","m":"from scratch","ja":"一から（手作りで）","g":"","s":"For example, last month I made ramen from scratch, and it tasted almost as good as a restaurant's.","au":"s_113baacc2d","src":"Interactive Speaking・Food"},{"id":"ispk:0:almost as good as","m":"almost as good as","ja":"〜とほとんど同じくらいおいしい","g":"almost as 【形】 as 【名】","s":"For example, last month I made ramen from scratch, and it tasted almost as good as a restaurant's.","au":"s_113baacc2d","src":"Interactive Speaking・Food"},{"id":"ispk:0:make healthier choices","m":"make healthier choices","ja":"より健康的な選択をする","g":"","s":"So, clear warning labels and limits on advertising would help people make healthier choices.","au":"s_a6d7ec2d1c","src":"Interactive Speaking・Food"}]},{"a":[["I usually {{listen to movie soundtracks and some Japanese pop music}}.","That's mainly because {{soundtracks help me concentrate while I am drawing or studying}}.","For example, {{yesterday I listened to a fantasy film soundtrack for two hours while I worked on an animation}}.","So, {{music is an important part of my work routine}}."],["I usually {{listen to music on my way to school and while I am working}}.","That's mainly because {{it makes long train rides feel shorter and keeps me in a good mood}}.","For example, {{this morning the train was very crowded, but my favorite playlist helped me stay relaxed}}.","So, {{music is like a small break that I can take anywhere}}."],["That's an interesting question. Personally, I think {{technology has made it much easier to discover new music}}.","That's mainly because {{streaming services let people listen to millions of songs for a small monthly fee}}.","For example, {{last month an app recommended a Korean indie band to me, and now they are one of my favorites}}.","So, {{people today can enjoy a much wider variety of music than in the past}}."]],"au":["m_is_1_0","m_is_1_1","m_is_1_2"],"keys":[{"id":"ispk:1:help me concentrate","m":"help me concentrate","ja":"集中するのを助けてくれる","g":"help 【人】 【動原】","s":"That's mainly because soundtracks help me concentrate while I am drawing or studying.","au":"s_f71c3f37e2","src":"Interactive Speaking・Music"},{"id":"ispk:1:on my way to school","m":"on my way to school","ja":"通学途中に","g":"on my way to 【場所】","s":"I usually listen to music on my way to school and while I am working.","au":"s_6622212586","src":"Interactive Speaking・Music"},{"id":"ispk:1:keeps me in a good mood","m":"keeps me in a good mood","ja":"いい気分でいさせてくれる","g":"keep 【人】 in a good mood","s":"That's mainly because it makes long train rides feel shorter and keeps me in a good mood.","au":"s_e1f0444943","src":"Interactive Speaking・Music"},{"id":"ispk:1:for a small monthly fee","m":"for a small monthly fee","ja":"少しの月額料金で","g":"","s":"That's mainly because streaming services let people listen to millions of songs for a small monthly fee.","au":"s_8cd4ff5f57","src":"Interactive Speaking・Music"},{"id":"ispk:1:a much wider variety of","m":"a much wider variety of","ja":"はるかに幅広い種類の","g":"a wide variety of 【名】","s":"So, people today can enjoy a much wider variety of music than in the past.","au":"s_b217c31742","src":"Interactive Speaking・Music"}]},{"a":[["I usually {{go jogging about three times a week}}.","That's mainly because {{I sit at my computer for many hours, so I need to move my body}}.","For example, {{last Saturday I ran five kilometers along the river, and I felt refreshed for the rest of the day}}.","So, {{jogging is a simple way for me to stay healthy}}."],["Yes, I think so. {{Team sports are very important for children}}.","That's mainly because {{they teach children how to cooperate and communicate with others}}.","For example, {{when I was in elementary school, I played on a soccer team, and I learned how to encourage my teammates after we lost}}.","So, {{team sports help children develop social skills as well as physical strength}}."],["That's an interesting question. Yes, I think so. {{Their high salaries are fair in most cases}}.","That's mainly because {{their careers are very short and they bring in a lot of money for their teams}}.","For example, {{I read that many soccer players retire in their early thirties after years of hard training}}.","So, {{I think their pay reflects both their talent and the risks they take}}."]],"au":["m_is_2_0","m_is_2_1","m_is_2_2"],"keys":[{"id":"ispk:2:for the rest of the day","m":"for the rest of the day","ja":"その日はずっと","g":"","s":"For example, last Saturday I ran five kilometers along the river, and I felt refreshed for the rest of the day.","au":"s_d1b3e6e7bc","src":"Interactive Speaking・Sports"},{"id":"ispk:2:stay healthy","m":"stay healthy","ja":"健康を保つ","g":"","s":"So, jogging is a simple way for me to stay healthy.","au":"s_86ef9f18ee","src":"Interactive Speaking・Sports"},{"id":"ispk:2:cooperate and communicate with others","m":"cooperate and communicate with others","ja":"他人と協力し意思疎通する","g":"","s":"That's mainly because they teach children how to cooperate and communicate with others.","au":"s_2cff2fb1f9","src":"Interactive Speaking・Sports"},{"id":"ispk:2:as well as physical strength","m":"as well as physical strength","ja":"体力だけでなく","g":"A as well as B","s":"So, team sports help children develop social skills as well as physical strength.","au":"s_873b2667a0","src":"Interactive Speaking・Sports"},{"id":"ispk:2:in most cases","m":"in most cases","ja":"たいていの場合","g":"","s":"Their high salaries are fair in most cases.","au":"s_039d9e6a57","src":"Interactive Speaking・Sports"},{"id":"ispk:2:reflects both their talent and the risks","m":"reflects both their talent and the risks","ja":"才能とリスクの両方を反映している","g":"reflect 【名】","s":"So, I think their pay reflects both their talent and the risks they take.","au":"s_a90b2ec5aa","src":"Interactive Speaking・Sports"}]},{"a":[["Personally, I {{enjoyed art class the most}}.","That's mainly because {{it was the only class where I could express my own ideas freely}}.","For example, {{in my third year of high school I made a short flip-book animation, and my classmates loved it}}.","So, {{that class was actually the starting point of my dream to become an animator}}."],["Personally, I prefer {{studying alone for most subjects}}.","That's mainly because {{I can focus better and study at my own pace}}.","For example, {{when I prepared for my last English test, I studied by myself in the library and finished twice as many practice questions as usual}}.","So, {{I study alone most of the time, but I join study groups before big exams}}."],["That's an interesting question. Personally, I {{don't think online learning will completely replace classrooms}}.","That's mainly b
