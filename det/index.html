  if(tab==='list'){
    const c=[0,0,0];L.forEach(k=>{const b=fbox(k.id);c[b>=3?0:b>=1?1:2]++;});
    el.innerHTML='<div class="card"><div class="stats"><span>覚えた <b>'+c[0]+'</b></span><span>もう少し <b>'+c[1]+'</b></span><span>まだ <b>'+c[2]+'</b></span></div></div><div class="card"><ul class="kl">'+L.map(k=>{const b=fbox(k.id);
      return '<li><button class="star" data-del="'+esc(k.id)+'" aria-label="お気に入りから外す">★</button><div class="kb"><div class="ken">'+tplHTML(k.g||k.m)+'</div><div class="kja">'+esc(k.ja)+'</div><div class="ex" style="margin-top:3px">'+keyHTML(k.s,[k])+'</div><div class="muted" style="font-size:12px;margin-top:2px">'+esc(k.src)+'　<span style="color:'+(b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)')+'">'+fboxLabel(b)+'</span></div></div><button class="spk" data-au="'+esc(k.au)+'" data-tx="'+esc(k.s)+'" aria-label="文を聞く">🔊</button></li>';}).join('')+'</ul></div>';
    el.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>play(b.dataset.au,b.dataset.tx));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('この表現をお気に入りから外しますか？'))return;delete S.fav[b.dataset.del];save();renderFav();});
    return;
  }
  favReview(el);
}
function favReview(el){
  const pickSet=()=>shuffle(favList()).sort((a,b)=>fbox(a.id)-fbox(b.id)||(S.last['f:'+a.id]||'').localeCompare(S.last['f:'+b.id]||'')).slice(0,10);
  let q=pickSet(), items=q.slice(), total=q.length, n=0, again=[];
  function next(){
    if(!q.length&&again.length){q=again;again=[];}
    if(!q.length){done();return;}
    const k=q.shift();n++;let shown=false;
    const draw=()=>{
      let h='<div class="row"><span class="prog">'+(n>total?'やり直し（×をもう一度）':n+' / '+total)+'</span></div><div class="card"><div class="muted">'+esc(k.src)+'</div>';
      h+='<div class="big" style="font-weight:700;margin:6px 0 10px">'+esc(k.ja)+'</div>';
      h+='<div style="font-size:16.5px;line-height:1.8">'+(shown?keyHTML(k.s,[k]):maskHTML(k.s,k.m))+'</div>';
      if(!shown) h+='<div class="muted" style="margin-top:8px">グレーの部分を声に出して言ってから「答え」。</div><div class="row" style="margin-top:12px"><button class="pri" id="ans" style="flex:1;padding:12px">答え</button></div>';
      else h+='<div class="row" style="margin-top:10px"><span class="ken">'+tplHTML(k.g||k.m)+'</span><button class="spk right" id="sp" aria-label="文を聞く">🔊</button></div><div class="rate"><button class="r1" data-r="1">◎ 言えた</button><button class="r2" data-r="2">△ あいまい</button><button class="r3" data-r="3">× まだ</button></div>';
      h+='</div>';el.innerHTML=h;
      if(!shown){$('#ans').onclick=()=>{shown=true;draw();play(k.au,k.s);};}
      else{$('#sp').onclick=()=>play(k.au,k.s);
        el.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,b0=fbox(k.id);
          S.fbox[k.id]=r===1?Math.min(b0+1,5):r===2?b0:0;S.last['f:'+k.id]=today();markDay();
          if(r===3)again.push(k);next();});}
    };
    draw();
  }
  function done(){
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おわり</div><div class="muted">'+total+' 個を復習しました</div></div>';
    h+='<div class="card"><ul class="kl">'+items.map(k=>{const b=fbox(k.id);return '<li><span class="role" style="color:'+(b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)')+'">'+fboxLabel(b)+'</span><div class="kb"><div class="ken">'+tplHTML(k.g||k.m)+'</div><div class="kja">'+esc(k.ja)+'</div></div></li>';}).join('')+'</ul></div>';
    h+='<div class="hero"><button class="pri" id="again">もう一回</button><button id="toList">一覧へ</button></div>';
    el.innerHTML=h;$('#again').onclick=()=>favReview(el);$('#toList').onclick=()=>{V.ftab='list';renderFav();};
  }
  next();
}

/* ---------- 単語を完成（Fill in the Blanks / Read and Complete） ---------- */
const LITS={fib:{icon:'🔤',name:'Fill in the Blanks',jp:'文の中の1語を完成',time:'20秒×1語'},rc:{icon:'📄',name:'Read and Complete',jp:'文章の単語を完成',time:'3分'}};
const INATTR='autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"';
function Lit(){S.lit=S.lit||{};['fib','rc','miss'].forEach(k=>{S.lit[k]=S.lit[k]||{};});return S.lit;}
const fibKeep=n=>Math.max(1,Math.floor(n/2));   /* 公式: 単語の後半が消える */
const ciW=m=>'calc('+m+'ch + 8px)';
const ciHTML=(m,i)=>'<input class="ci"'+(i!=null?' data-i="'+i+'"':' id="ci"')+' maxlength="'+m+'" style="width:'+ciW(m)+'" placeholder="'+'_'.repeat(m)+'" '+INATTR+'>';
function litStats(id){const L=Lit();
  if(id==='fib'){const v=Object.values(L.fib);const n=v.reduce((s,x)=>s+x.n,0),ok=v.reduce((s,x)=>s+x.ok,0);return {done:v.length,total:LIT.fib.length,pct:n?Math.round(ok/n*100):null};}
  const v=Object.values(L.rc);return {done:v.length,total:LIT.rc.length,pct:v.length?Math.round(v.reduce((s,x)=>s+x.last,0)/v.length):null};}
function missList(){return Object.keys(Lit().miss).map(k=>Object.assign({key:k},Lit().miss[k]));}
function addMiss(key,o){const L=Lit();L.miss[key]=Object.assign({t:Date.now(),b:0},L.miss[key]||{},o,{b:0});}

function renderLit(){
  const app=$('#app');app.classList.remove('blur');app.onclick=null;
  const id=V.lid,t=LITS[id],tab=V.ltab||'run',nm=missList().length;
  $('#title').textContent=t.icon+' '+t.name;
  const tabs=id==='fib'?[['run','本番形式 9問'],['miss','まちがえた単語 '+nm]]:[['run','本番形式'],['list','文章を選ぶ'],['miss','まちがえた単語 '+nm]];
  app.innerHTML='<div class="tabs">'+tabs.map(([k,n])=>'<button data-t="'+k+'" class="'+(tab===k?'on':'')+'">'+n+'</button>').join('')+'</div><div id="tb"></div>';
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cleanup();V.ltab=b.dataset.t;renderLit();});
  const el=$('#tb');
  if(tab==='miss') return missIntro(el);
  if(id==='fib') return fibIntro(el);
  if(tab==='list') return rcList(el);
  rcIntro(el);
}
const tipsHTML=a=>'<div class="card"><div style="font-weight:700;margin-bottom:4px">解き方のコツ</div>'+a.map(x=>'<div class="tip">'+x+'</div>').join('')+'</div>';

/* レベル（CEFR）。単語の判定は build_models.js（Oxford 5000＞CEFR-J＞Octanove C1/C2） */
const TIERS=[['low','B1以下'],['mid','B2'],['high','C1以上']],TN=['low','mid','high'];
const tierOf=lv=>!lv?'high':/^(A1|A2|B1)$/.test(lv)?'low':lv==='B2'?'mid':'high';
const lvChip=lv=>'<span class="lvc lv-'+tierOf(lv)+'" title="CEFRレベル">'+(lv||'リスト外')+'</span>';
function lvSelHTML(cur,cnt){return '<div class="lvsel">'+[['auto','本番のように変わる']].concat(TIERS).map(([k,n])=>'<button data-lv="'+k+'" class="'+(cur===k?'on':'')+'">'+n+' <small>'+cnt[k]+'</small></button>').join('')+'</div>';}
const stepTier=(t,d)=>Math.max(0,Math.min(2,t+d));

/* Fill in the Blanks */
function fibIntro(el){
  const L=Lit(),st=litStats('fib'),sel=L.lvF||'auto',ti=L.tierF==null?1:L.tierF;
  const cnt={auto:LIT.fib.length};TIERS.forEach(([k])=>cnt[k]=LIT.fib.filter(x=>tierOf(x[5])===k).length);
  el.innerHTML='<div class="card"><div class="muted">本番と同じく1語20秒・9問。文の中の1語は<b>前半だけ</b>書いてあるので、残りの文字を打ちます（DET公式ガイド2026と同じ形）。</div><div class="stats" style="margin-top:6px"><span>解いた <b>'+st.done+'</b> / '+st.total+'</span>'+(st.pct!=null?'<span>正答率 <b>'+st.pct+'%</b></span>':'')+'</div></div>'
    +'<div class="card"><div style="font-weight:700;margin-bottom:6px">レベル（CEFR）</div>'+lvSelHTML(sel,cnt)
    +'<div class="note">'+(sel==='auto'?'正解すると1段難しく、まちがえると1段易しくなります（本番のDETと同じ考え方）。今回のスタート：<b>'+TIERS[ti][1]+'</b>':'答えの単語のレベルで絞ります。')+'</div></div>'
    +'<div class="hero"><button class="pri" id="go">スタート（9問）</button></div>'
    +tipsHTML(['出てくるのは<b>名詞・動詞・形容詞・副詞</b>だけ（公式ガイド）。まず品詞を決める：a / the のあと→名詞、be動詞のあと→形容詞か過去分詞、動詞のあと→副詞（-ly）。',
      '<b>形</b>を落とさない：主語が he / she / it で現在→<b>-s</b>、yesterday・last year など過去→<b>-ed</b>、数が2つ以上→複数形 <b>-s</b>。',
      '「あと◯文字」が大きなヒント。同じ意味・反対の意味の語や、よくある言い回し（be based on など）からしぼる。',
      '採点は○か×だけ。<b>つづりが1文字でも違うと不正解</b>（公式ガイド）。それでも空欄よりは打つ。']);
  el.querySelectorAll('.lvsel button').forEach(b=>b.onclick=()=>{L.lvF=b.dataset.lv;save();fibIntro(el);});
  $('#go').onclick=()=>{
    const used=new Set();let tier=ti;
    const weak=(a,b)=>{const A=L.fib[a],B=L.fib[b];return (A?A.b:-1)-(B?B.b:-1)||String(A?A.d:'').localeCompare(String(B?B.d:''));};
    const pool=t=>shuffle(LIT.fib.map((x,i)=>i).filter(i=>!used.has(i)&&(t==null||tierOf(LIT.fib[i][5])===TN[t]))).sort(weak);
    const mk=i=>{used.add(i);const x=LIT.fib[i];return {fi:i,key:'f'+i,before:x[0],w:x[1],after:x[2],ja:x[3],au:x[4],lv:x[5],src:'Fill in the Blanks'};};
    if(sel!=='auto'){const t=TN.indexOf(sel);wordSession(el,pool(t).slice(0,9).map(mk),'fib');return;}
    wordSession(el,new Array(9).fill(null),'fib',{
      pick:()=>{let i;for(const d of [0,1,-1,2,-2]){const t=tier+d;if(t<0||t>2)continue;i=pool(t)[0];if(i!=null)break;}if(i==null)i=pool(null)[0];return mk(i);},
      onResult:ok=>{tier=stepTier(tier,ok?1:-1);},
      done:()=>{L.tierF=tier;save();}});
  };
}
/* 1語ずつ解く（Fill in the Blanks・まちがえた単語の復習で共用） */
function wordSession(el,items,mode,opt){
  opt=opt||{};let k=0;const res=[];
  const prog=()=>'<div class="row"><span class="prog">'+(k+1)+' / '+items.length+(mode==='miss'?'　（2回続けて正解でリストから外れます）':'')+'</span></div>';
  function show(){
    if(k>=items.length) return end();
    if(items[k]==null&&opt.pick)items[k]=opt.pick();
    const it=items[k],kp=fibKeep(it.w.length),ms=it.w.slice(kp);
    el.innerHTML=prog()+'<div id="tm"></div><div class="card"><div class="muted">Complete the sentence with the correct word</div><div class="fibs">'+esc(it.before)+'<span class="cw">'+esc(it.w.slice(0,kp))+ciHTML(ms.length)+'</span>'+esc(it.after)+'</div><div class="muted">あと '+ms.length+' 文字</div></div><div class="hero"><button class="pri" id="chk">答え合わせ</button></div>';
    const inp=$('#ci');setTimeout(()=>{try{inp.focus();}catch(e){}},60);
    let fin=false;
    const check=()=>{if(fin)return;fin=true;clearInterval(timerH);timerH=null;
      const typed=inp.value.trim().toLowerCase(),ok=typed===ms.toLowerCase();res.push({it,ok});record(it,ok,mode);if(opt.onResult)opt.onResult(ok);fb(it,ok,typed,kp);};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
    $('#chk').onclick=check;
    runTimer($('#tm'),[{name:'残り時間',sec:20}],null,check);
  }
  function fb(it,ok,typed,kp){
    el.innerHTML=prog()+'<div class="card"><div class="big" style="font-weight:700;color:'+(ok?'var(--ok)':'var(--ng)')+'">'+(ok?'✓ 正解':'✗ 正解は '+esc(it.w))+'</div>'
      +'<div class="fibs" style="margin-top:4px">'+esc(it.before)+'<span class="key">'+esc(it.w)+'</span>'+esc(it.after)+'</div>'
      +(ok?'':'<div class="muted">あなたの答え：'+esc(it.w.slice(0,kp))+'<s>'+esc(typed||'（空欄）')+'</s></div>')
      +'<div class="row" style="margin-top:8px"><span class="ken">'+esc(it.w)+'</span>'+(it.lv!==undefined?lvChip(it.lv):'')+'<span class="kja">'+esc(it.ja||'')+'</span><button class="spk right" id="sp" aria-label="文を聞く">🔊</button></div></div>'
      +'<div class="hero"><button class="pri" id="nx">'+(k+1<items.length?'次へ':'結果を見る')+'</button></div>';
    $('#sp').onclick=()=>play(it.au||'_',it.before+it.w+it.after);
    const nx=$('#nx');nx.onclick=()=>{k++;show();};setTimeout(()=>{try{nx.focus();}catch(e){}},60);
  }
  function end(){
    if(opt.done)opt.done();
    const okN=res.filter(r=>r.ok).length;
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">'+okN+' / '+res.length+' 問正解</div><div class="muted">まちがえた単語は「まちがえた単語」に入りました</div></div>';
    h+='<div class="card"><ul class="kl ml">'+res.map(r=>'<li><span class="role" style="color:'+(r.ok?'var(--ok)':'var(--ng)')+'">'+(r.ok?'✓':'✗')+'</span><div class="kb"><div class="ken">'+esc(r.it.w)+(r.it.lv!==undefined?' '+lvChip(r.it.lv):'')+'</div><div class="kja">'+esc(r.it.ja||'')+'</div><div class="ex">'+esc(r.it.before)+'<span class="key">'+esc(r.it.w)+'</span>'+esc(r.it.after)+'</div></div></li>').join('')+'</ul></div>';
    h+='<div class="hero"><button class="pri" id="again">もう一回</button><button id="toMiss">まちがえた単語 '+missList().length+'</button></div>';
    el.innerHTML=h;
    const mt=document.querySelector('.tabs button[data-t="miss"]');if(mt)mt.textContent='まちがえた単語 '+missList().length;
    $('#again').onclick=()=>{V.ltab=mode==='miss'?'miss':'run';renderLit();};
    $('#toMiss').onclick=()=>{V.ltab='miss';renderLit();};
  }
  show();
}
function record(it,ok,mode){
  const L=Lit();
  if(it.fi!=null){const r=L.fib[it.fi]||{b:0,n:0,ok:0};r.b=ok?Math.min(r.b+1,5):0;r.n++;if(ok)r.ok++;r.d=today();L.fib[it.fi]=r;}
  if(mode==='miss'){const m=L.miss[it.key];if(m){if(ok){m.b=(m.b||0)+1;if(m.b>=2)delete L.miss[it.key];}else m.b=0;}}
  else{detFirst('W:'+it.key,ok?100:0,'type');   /* 本番形式で答えた文は正解・不正解とも復習リストへ */
    if(!ok)addMiss(it.key,{w:it.w,before:it.before,after:it.after,ja:it.ja,au:it.au||'',src:it.src});}
  markDay();
}

/* まちがえた単語（Fill in the Blanks と Read and Complete の両方から集まる） */
function missIntro(el){
  const M=missList();
  if(!M.length){el.innerHTML='<div class="card"><div style="font-weight:700">まちがえた単語はありません</div><div class="muted" style="margin-top:4px">Fill in the Blanks・Read and Complete でまちがえた単語がここにたまります。2回続けて正解すると外れます。</div></div>';return;}
  el.innerHTML='<div class="card"><div class="muted">まちがえた単語を、その単語が出てきた文で解き直します（1語20秒）。2回続けて正解するとリストから外れます。</div></div><div class="hero"><button class="pri" id="go">復習する（'+Math.min(10,M.length)+'問）</button></div>'
    +'<div class="card"><ul class="kl ml">'+M.sort((a,b)=>b.t-a.t).map(m=>'<li><span class="role">'+(m.b?'あと1回':'まだ')+'</span><div class="kb"><div class="ken">'+esc(m.w)+'</div><div class="kja">'+esc(m.ja||'')+'</div><div class="muted">'+esc(m.src||'')+'</div></div></li>').join('')+'</ul></div>';
  $('#go').onclick=()=>wordSession(el,shuffle(missList()).sort((a,b)=>(a.b||0)-(b.b||0)).slice(0,10).map(m=>({key:m.key,fi:/^f\d+$/.test(m.key)?+m.key.slice(1):null,lv:/^f\d+$/.test(m.key)&&LIT.fib[+m.key.slice(1)]?LIT.fib[+m.key.slice(1)][5]:undefined,before:m.before,w:m.w,after:m.after,ja:m.ja,au:m.au,src:m.src})),'miss');
}

/* Read and Complete */
function rcIntro(el){
  const L=Lit(),st=litStats('rc'),sel=L.lvR||'auto',ti=L.tierR==null?1:L.tierR;
  const cnt={auto:LIT.rc.length};TIERS.forEach(([k])=>cnt[k]=LIT.rc.filter(x=>tierOf(x.lv)===k).length);
  el.innerHTML='<div class="card"><div class="muted">本番と同じく3分で1本。タイトル・最初と最後の文はそのまま、間の文は1語おきに単語の<b>後半</b>が消えています（固有名詞・略語は消えない。DET公式ガイド2026と同じ形）。まだ解いていない文章・点の低い文章から出ます。</div><div class="stats" style="margin-top:6px"><span>解いた <b>'+st.done+'</b> / '+st.total+' 本</span>'+(st.pct!=null?'<span>正答率 <b>'+st.pct+'%</b></span>':'')+'</div></div>'
    +'<div class="card"><div style="font-weight:700;margin-bottom:6px">レベル（CEFR）</div>'+lvSelHTML(sel,cnt)
    +'<div class="note">'+(sel==='auto'?'80%以上で1段難しく、50%未満で1段易しくなります。次の文章：<b>'+TIERS[ti][1]+'</b>':'文章のレベルは、B2・C1以上の単語の数で決めています。')+'</div></div>'
    +'<div class="hero"><button class="pri" id="go">スタート（3分）</button></div>'
    +tipsHTML(['まず全体を読む。最初の1文で<b>話題</b>をつかみ、最後の1文もヒントにする。',
      '<b>やさしい語から</b>埋める：th__ → the / that、o_ → of / on。文法で決まる語は速く確実に。難しい語は最後（公式ガイドのコツ）。',
      '名詞は<b>単数か複数か</b>、動詞は<b>時制と -s</b> を確認。<b>-ing / -ed / -ly</b> の語尾も落としやすい。',
      '1語ずつ採点され、<b>つづりが正しくないと不正解</b>。分からない空欄は飛ばして、最後に戻る。']);
  el.querySelectorAll('.lvsel button').forEach(b=>b.onclick=()=>{L.lvR=b.dataset.lv;save();rcIntro(el);});
  $('#go').onclick=()=>{
    const t=sel==='auto'?ti:TN.indexOf(sel);
    const ord=a=>shuffle(a).sort((a,b)=>{const A=L.rc[a],B=L.rc[b];return (A?1:0)-(B?1:0)||(A?A.last:0)-(B?B.last:0);});
    let cand=[];for(const d of (sel==='auto'?[0,1,-1,2,-2]:[0])){const u=t+d;if(u<0||u>2)continue;cand=LIT.rc.map((x,i)=>i).filter(i=>tierOf(LIT.rc[i].lv)===TN[u]);if(cand.length)break;}
    if(!cand.length)cand=LIT.rc.map((x,i)=>i);
    rcRun(el,ord(cand)[0]);};
}
function rcList(el){
  const L=Lit();
  el.innerHTML='<div class="card"><ul class="kl ml">'+LIT.rc.map((p,i)=>{const r=L.rc[i];return '<li><span class="role" style="color:'+(!r?'var(--sub)':r.last>=80?'var(--ok)':r.last>=60?'var(--mid)':'var(--ng)')+'">'+(r?r.last+'%':'未')+'</span><div class="kb"><div class="ken">'+(i+1)+'. '+esc(p.t)+' '+lvChip(p.lv)+'</div>'+(r?'<div class="muted">'+r.n+'回・最高 '+r.best+'%・'+esc(r.d)+'</div>':'')+'</div><button data-i="'+i+'">解く</button></li>';}).join('')+'</ul></div>';
  el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{rcRun(el,+b.dataset.i);window.scrollTo(0,0);});
}
function rcRun(el,i,opt){opt=opt||{};
  const P=LIT.rc[i];let n=0;
  let h='<div class="stick" id="tm"></div><div class="card"><div class="muted">'+(i+1)+'. '+lvChip(P.lv)+'　Complete the text with the correct words</div><div style="font-weight:700;text-align:center;margin-top:6px">'+esc(P.t)+'</div><div class="rcp">';
  P.segs.forEach(g=>{if(typeof g==='string')h+=esc(g);else h+=ciHTML(g[0].length,n++);});
  h+='</div></div><div class="hero"><button class="pri" id="chk">答え合わせ</button></div>';
  el.innerHTML=h;
  // 「最初の文字＋入力欄」がまとまって折り返すように、直前の文字列の最後の語と入力欄を .cw でくるむ
  el.querySelectorAll('.ci').forEach(inp=>{const pv=inp.previousSibling;if(pv&&pv.nodeType===3){const t=pv.textContent,m=t.match(/[A-Za-z]+$/);if(m){pv.textContent=t.slice(0,-m[0].length);const w=document.createElement('span');w.className='cw';inp.before(w);w.append(m[0],inp);}}});
  const ins=[...el.querySelectorAll('.ci')];
  ins.forEach((inp,k)=>{
    inp.oninput=()=>{if(inp.value.length>=+inp.maxLength&&ins[k+1])ins[k+1].focus();};
    inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&ins[k-1]){e.preventDefault();ins[k-1].focus();}else if(e.key==='Enter'){e.preventDefault();(ins[k+1]||$('#chk')).focus();}};
  });
  let fin=false;
  const check=()=>{if(fin)return;fin=true;clearInterval(timerH);timerH=null;
    const blanks=P.segs.filter(g=>typeof g!=='string');
    const res=blanks.map((g,k)=>({g,typed:ins[k].value.trim().toLowerCase(),ok:ins[k].value.trim().toLowerCase()===g[0].toLowerCase()}));
    const okN=res.filter(r=>r.ok).length,pct=Math.round(okN/res.length*100);
    const L=Lit(),r0=L.rc[i]||{n:0,best:0};L.rc[i]={n:r0.n+1,best:Math.max(r0.best,pct),last:pct,d:today()};
    // まちがえた単語を「まちがえた単語」へ（その単語が出てきた文ごと）
    let bi=0,prev='';const out=[];
    P.segs.forEach(g=>{if(typeof g==='string'){out.push(esc(g));prev=g;return;}
      const r=res[bi++],kept=(prev.match(/[A-Za-z]+$/)||[''])[0],w=kept+g[0];
      if(r.ok)out[out.length-1]=esc(prev.slice(0,prev.length-kept.length))+'<span class="okw">'+esc(w)+'</span>';
      else{out[out.length-1]=esc(prev.slice(0,prev.length-kept.length))+'<span class="ngw">'+esc(w)+'</span>';
        const s=P.sents[g[1]],j=s.search(new RegExp('\\b'+w+'\\b'));
        r.w=w;r.kept=kept;
        if(j>=0)addMiss('r'+i+':'+w.toLowerCase(),{w,before:s.slice(0,j),after:s.slice(j+w.length),ja:g[2]||'',au:'',src:'Read and Complete・'+P.t});}
    });
    markDay();
    let rr=null;
    if(opt.review)rr=opt.review(pct);else{detFirst('P:r'+i,pct,'rc');   /* 本番形式で解いた文章は復習リストへ */
      const L2=Lit();if((L2.lvR||'auto')==='auto'){L2.tierR=stepTier(tierOf(P.lv)==='low'?0:tierOf(P.lv)==='mid'?1:2,pct>=80?1:pct<50?-1:0);save();}}
    const miss=res.filter(r=>!r.ok);
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">'+okN+' / '+res.length+' 語（'+pct+'%）</div><div class="muted">'+(pct>=80?'よくできました。':pct>=60?'あと少し。赤い語を見直そう。':'赤い語を「まちがえた単語」で復習しよう。')+'</div></div>';
    h+='<div class="card"><div class="row"><span class="mh">'+esc(P.t)+'</span><button class="right" id="sp">🔊 聞く</button></div><div class="rcp" style="line-height:1.9;margin-top:6px">'+out.join('')+'</div><div class="note"><span class="okw">緑</span>＝正解　<span class="ngw">赤</span>＝まちがい</div></div>';
    if(miss.length) h+='<div class="card"><div class="kh" style="font-weight:700">まちがえた単語（Fill in the Blanks の「まちがえた単語」で練習できます）</div><ul class="kl ml">'+miss.map(r=>'<li><div class="kb"><div class="ken">'+esc(r.w)+'</div><div class="muted">あなたの答え：'+esc(r.kept)+'<s>'+esc(r.typed||'（空欄）')+'</s>'+(r.g[2]?'　｜　'+esc(r.g[2]):'')+'</div></div></li>').join('')+'</ul></div>';

/* ============================================================
   復習のきまり（5アプリ共通） — 中身
   正本: .claude/skills_assets/review-core/rv.js
   英単語ノート / 表現メモ / Nextstage問題集 / AIEnglish（日替わり＋7テスト）/ Gimmy英作文 へ
   inject.py が同じ中身を配る。直すときは必ずこのファイルを直して inject.py を回すこと
   （生成HTMLを直接いじっても build.py / inject.py で消える）。

   ------------------------------------------------------------
   ねらい: 復習待ちを毎日ゼロにするのではなく、1つのアプリにつき1日最大30問の負担で、
   長く覚えて使えるようにする。

   決まり（数値はすべて RV_DEFAULTS。設定画面から変えたものは RV.cfg に入って同期される）
   ・1日の上限はアプリごとに30問。入口（今日の復習・苦手・お気に入り・新規学習…）を問わず
     「復習対象の問題に答えた回数」を共通で数える。日付の区切りは日本時間の0時
   ・数えるのは答え合わせ・自己採点が確定した瞬間だけ。同じ回答は eid で1回にまとめる
     （再読み込み・二重送信・2台の同期で増えない）。採点の付け直しは同じ eid の修正
   ・採点は3段階。①思い出せた(80〜100%) ②惜しい(40〜60%) ③思い出せなかった(0〜20%)
     ① 1段進めて移動先の段の間隔 ／ ② 段はそのまま、その段の間隔の半分（切り上げ・1〜7日）
     ③ 2段下げて翌日。不正解でも当日中には戻さない。同じ問題の箱が動くのは1日1回まで
   ・30問の選び方は 20（直近でまちがえた・定着が弱い）＋10（長く待っている）。片方が余れば他方へ
   ・新規登録は1日5件まで。期限の来た未消化が30件を超える日は0件。超えたぶんは「登録待ち」
   ・③が3回続いた問題は「学び直し候補」。本人が選んだときだけ7日休める（習得済みとは別）

   アプリ側がこのブロックより前に用意するもの:
     var RV_ENV = {
       app: 'vocab',                    // 保存キー rv_<app> と同期ドキュメント <合言葉>__rv_<app>
       name: '英単語ノート',            // 画面に出すアプリ名

       put(id, st){ ... },              // 箱と期限をアプリ自身の保存先へ映す（既存画面のため）
       ids(){ return [...] },           // 任意。いま出題できる問題のid（削除済みを除く）

       label(id){ return '短い見出し' }, // 任意

       detail(id){ return 'HTML' },     // 任意。学び直し用（例文・まぎらわしい語・文の構造など）
       onChange(){ ... }                // 任意。設定や休止を変えたあと画面を描き直す
     }
   呼びかた（主なもの）:
     rvInit()                 … 起動時に1回（移行・取り込み・同期の開始）
     rvAnswer(id, pct, opt)   … 答え合わせ・自己採点が確定した瞬間に1回。opt={fmt, retry}
     rvRegrade(eid, pct)      … 採点の付け直し（回数は増やさず、回答前から計算し直す）
     rvPick(ids, n)           … 今日の復習の出題（20＋10の配分・残り枠まで）

     rvServeOk(id, retry)     … 出題の直前に、まだ出してよいか
     rvLeft() / rvDone()      … 今日の残り枠 / 今日数えた回数
     rvBarHtml() / rvPanelHtml() / rvGradeHtml(fn, opt)   … 画面の部品
   ============================================================ */

var RV_DEFAULTS = {
  cap: 30,           /* 1日の復習の上限（問）。アプリごとに独立 */
  weak: 20,          /* 30問のうち「直近でまちがえた・定着が弱い」問題の枠（残りが「長く待っている」問題の枠） */
  newPerDay: 5,      /* 復習対象への新規登録（1日あたり） */
  backlogStop: 30,   /* 期限の来た未消化がこれを超える日は新規登録の推奨数を0件にする */
  retry: false,      /* 当日の解き直し（標準オフ） */
  retryMax: 3,       /* 解き直しは1アプリ1日この問数まで（30問の内数・各問題1回まで） */
  capAll: false,     /* true＝新規学習も含めて、このアプリの全出題を1日30問以内にする */
  relearnN: 3,       /* 通常復習で③がこの回数続いたら「学び直し候補」 */
  pauseDays: 7,      /* 本人が選んだときの休止の日数 */
  recogMax: 3,       /* 選択式の正解だけで上がれる段（0始まり）。英単語ノートの4択などに効く */
  nearMin: 1,        /* ②惜しい の再確認間隔の下限（日） */
  nearMax: 7,        /* 同 上限（日） */
  keepDays: 45       /* 回答の記録をそのまま持つ日数（それより古いものは箱の状態にまとめて軽くする） */
};
var RV_DAY = 86400000, RV_TZ = 9 * 3600000;   /* 日本時間 = UTC+9（夏時間なし） */
var RV_SHIFT = 0;                              /* テスト用: 時計をずらす（ミリ秒） */
var RV = null, RV_ITEMS = null;
var RV_PCT = { 1: 100, 2: 60, 3: 0 };          /* 3段階で付けたときに残す点 */

/* ---------------- 日付（日本時間の0時で区切る） ---------------- */
function rvNow() { return Date.now() + RV_SHIFT; }
function rvDayOf(ms) { return Math.floor((Number(ms) + RV_TZ) / RV_DAY); }
function rvToday() { return rvDayOf(rvNow()); }
function rvDayMs(d) { return d * RV_DAY - RV_TZ; }            /* その日の0時（日本時間）のミリ秒 */
function rvP2(n) { return (n < 10 ? '0' : '') + n; }
function rvYmd(d) { var x = new Date(d * RV_DAY); return x.getUTCFullYear() + '-' + rvP2(x.getUTCMonth() + 1) + '-' + rvP2(x.getUTCDate()); }
function rvMd(d) { var x = new Date(d * RV_DAY); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate(); }
/* ミリ秒・日番号・'YYYY-MM-DD'・ISO文字列のどれでも日番号にする */
function rvToDay(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v > 1e9 ? rvDayOf(v) : Math.floor(v);
  var s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { var p = s.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / RV_DAY); }
  var t = new Date(s).getTime();
  return isFinite(t) ? rvDayOf(t) : null;
}
function rvToMs(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v > 1e9 ? v : rvDayMs(v) + 12 * 3600000;
  var s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return rvDayMs(rvToDay(s)) + 12 * 3600000;   /* 日付だけなら正午 */
  var t = new Date(s).getTime();
  return isFinite(t) ? t : 0;
}

/* ---------------- 設定 ---------------- */
function rvEnv() { return (typeof RV_ENV !== 'undefined' && RV_ENV) ? RV_ENV : {}; }
function rvUnit() { return rvEnv().unit || '問'; }
function rvCfg() {
  var c = {}, k, own = (RV && RV.cfg && RV.cfg.v) || {};
  for (k in RV_DEFAULTS) c[k] = RV_DEFAULTS[k];
  for (k in own) if (k in RV_DEFAULTS) c[k] = own[k];
  return c;
}
function rvSetCfg(k, v) {
  rvLoad();
  var cur = (RV.cfg && RV.cfg.v) || {}, o = {};

/* ---------------- 採点の意味 ---------------- */

/* ---------------- 回答の記録から、問題ごとの状態を組み立てる ----------------

/* ---------------- 今日の回数 ---------------- */

function rvFree() { var v = null; try { v = localStorage.getItem(rvFreeKey()); } catch (e) {} return Number(v) === rvToday(); }

/* ---------------- 答え合わせ・付け直し ---------------- */

   アプリ自身の保存先に、こちらが知らない新しい記録があれば（古い版の画面で解いた・アプリ側の同期で届いた）、

function rvUi(act, v) {

function tabOrder(t,el){
  const seq=t.lines.map((l,i)=>({l,i})).filter(x=>x.l.seq!==false);
  let pool=shuffle(seq), done=[], miss=0;
  if(seq.length>2) while(pool.every((x,k)=>x.i===seq[k].i)) pool=shuffle(seq);
  const draw=()=>{
    let h='<div class="card"><div class="muted">テンプレの行を、答えの順番どおりにタップ。（'+esc(t.skel)+'）</div></div>';
    h+='<div class="card done">'+(done.length?done.map(x=>'<div class="ln"><span class="role">'+esc(x.l.r)+'</span><span class="tpl" style="font-size:15.5px">'+tplHTML(x.l.t)+'</span></div>').join(''):'<div class="muted">ここに並びます</div>')+'</div>';
    if(pool.length) h+='<div class="pool">'+pool.map((x,k)=>'<button class="opt" data-k="'+k+'">'+tplHTML(x.l.t)+'</button>').join('')+'</div>';
    else h+='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">'+(miss?'ミス '+miss+' 回':'全部正解！')+'</div></div><div class="hero"><button class="pri" id="re">もう一回</button><button id="toCloze">穴埋めへ</button></div>';
    el.innerHTML=h;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const x=pool[+b.dataset.k];const need=seq[done.length];if(x.i===need.i){done.push(x);pool.splice(+b.dataset.k,1);draw();if(!pool.length)markDay();}else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}});
    if(!pool.length){$('#re').onclick=()=>tabOrder(t,el);$('#toCloze').onclick=()=>{V.tab='cloze';renderTask(t);};}
  };
  draw();
}

function runTimer(el,phases,onPhase,onDone){

  const tick=()=>{const left=(end-Date.now())/1000;const p=phases[k];el.innerHTML='<div class="phase">'+esc(p.name)+'</div><div class="timer'+(left<=10?' warn':'')+'">'+fmt(left)+'</div>';if(left<=0){k++;if(k<phases.length)start();else{clearInterval(timerH);timerH=null;onDone&&onDone();}}};
  clearInterval(timerH);timerH=setInterval(tick,250);start();

}

    if(k==='wsamp'){pI=rnd(PROMPTS.wsamp);prompt=PROMPTS.wsamp[pI];}
    if(k==='ssamp'){pI=rnd(PROMPTS.ssamp);prompt=PROMPTS.ssamp[pI];}
    if(k==='rts'){pI=rnd(PROMPTS.rts);const r=PROMPTS.rts[pI];prompt=r[0];promptHTML='<div class="prompt">'+esc(r[0])+'<ul>'+r[1].map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>';}
    if(k==='ispk'){isI=Math.floor(Math.random()*PROMPTS.ispk.length);isSet=PROMPTS.ispk[isI];}
    if(k==='summ'){dlgI=Math.floor(Math.random()*PROMPTS.summ.length);dlg=PROMPTS.summ[dlgI];}
  };
  newPrompt();
  const useRec=()=>P.speak?'<label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="recOn"> 録音して聞き返す</label>':'';
  function intro(){
    let h='<div class="card"><div class="muted">本番と同じ時間で練習します。'+(P.prep?'準備 '+P.prep+'秒 → ':'')+'解答 '+fmt(P.ans)+(P.ans2?' → Step 2 '+fmt(P.ans2):'')+'　｜　目安 '+t.words[0]+'〜'+t.words[1]+'語</div></div>';
    h+='<div class="card">';
    if(k==='photo') h+='<img class="photo" id="ph" alt="練習用の写真" src="'+photoURL(photoId)+'">';
    if(k==='iw') h+='<div class="muted">Step 1</div><div class="prompt">'+esc(iwPair[0])+'</div>';
    if(k==='wsamp'||k==='ssamp') h+='<div class="prompt">'+esc(prompt)+'</div>';
    if(k==='rts') h+=promptHTML;
    if(k==='ispk') h+='<div class="prompt">話題：<b>'+esc(isSet[0])+'</b>（3問）</div><div class="muted">質問は音声で1回だけ流れます。読み終わると35秒スタート。</div><label class="row" style="gap:6px;font-size:14px;margin-top:6px"><input type="checkbox" id="showQ"> 質問の文字も出す（慣れるまで）</label>';
    if(k==='summ') h+='<div class="prompt">会話を聞いて、75秒で要約を書きます。</div><div class="muted">'+esc(dlg.who.join(' と '))+' の会話。本番と同じく、まず1回だけ聞いてください。</div>';
    h+='</div>';
    h+='<div class="card row">'+useRec()+'<button class="right" id="newP">別のお題</button></div>';
    h+='<div class="hero"><button class="pri" id="go">'+(k==='summ'?'▶ 会話を聞く':'スタート')+'</button></div>';
    h+='<div class="card">'+tplHint(t)+'</div>';
    el.innerHTML=h;
    $('#newP').onclick=()=>{newPrompt();intro();};
    $('#go').onclick=()=>{const ro=$('#recOn');run(ro&&ro.checked);};
    const ph=$('#ph'); if(ph) ph.onerror=()=>{ph.replaceWith(Object.assign(document.createElement('div'),{className:'muted',textContent:'写真を読み込めませんでした（オフライン？）。「別のお題」で再読み込み。'}));};
  }
  async function run(recOn){
    const writing=!P.speak;
    let area='', h='<div class="card" id="pr"></div><div class="card"><div id="tm"></div><div class="row" style="justify-content:center;margin-top:6px"><button id="skip">次へ ▶</button></div></div>';
    if(writing) h+='<div class="card"><textarea id="ta" placeholder="ここに英語で書く" autocapitalize="sentences" spellcheck="false"></textarea><div class="wc" id="wc">0 語</div></div>';
    h+='<div class="card">'+tplHint(t)+'</div>';
    el.innerHTML=h;
    const pr=$('#pr');
    if(k==='photo') pr.innerHTML='<img class="photo" alt="練習用の写真" src="'+photoURL(photoId)+'">';
    if(k==='iw') pr.innerHTML='<div class="muted">Step 1</div><div class="prompt">'+esc(iwPair[0])+'</div>';
    if(k==='wsamp'||k==='ssamp') pr.innerHTML='<div class="prompt">'+esc(prompt)+'</div>';
    if(k==='rts') pr.innerHTML=promptHTML;
    const ta=$('#ta'), wcEl=$('#wc');
    if(ta) ta.oninput=()=>{const n=wc(ta.value);wcEl.textContent=n+' 語（目安 '+t.words[0]+'〜'+t.words[1]+'）';wcEl.classList.toggle('ok',n>=t.words[0]);};
    let step1Text='';
    if(k==='summ'){
      pr.innerHTML='<div class="muted">会話を再生中…</div>';$('#tm').innerHTML='';$('#skip').style.display='none';
      for(let i=0;i<dlg.lines.length;i++){const [w,s]=dlg.lines[i];pr.innerHTML='<div class="muted">会話を再生中… '+(i+1)+' / '+dlg.lines.length+'</div><div class="dlg"><b>'+esc(dlg.who[w])+'</b></div>';await play('dlg_'+dlgI+'_'+i,s);if(V.view!=='task'||V.tab!=='prac')return;await new Promise(r=>setTimeout(r,400));}
      pr.innerHTML='<div class="prompt">今の会話を要約してください（75秒）。</div>';$('#skip').style.display='';
    }
    if(k==='ispk'){ await runIS(recOn); return; }
    let phases=[];
    if(P.prep) phases.push({name:'準備',sec:P.prep});
    phases.push({name:k==='iw'?'Step 1 解答':'解答',sec:P.ans});
    if(k==='iw') phases.push({name:'Step 2 解答',sec:P.ans2});
    let r=null;
    const T=runTimer($('#tm'),phases,async(i,p)=>{
      if(/解答/.test(p.name)&&ta){ta.disabled=false;ta.focus();}
      if(p.name==='準備'&&ta) ta.disabled=true;
      if(p.name==='Step 2 解答'){step1Text=ta.value;ta.value='';ta.oninput();pr.innerHTML='<div class="muted">Step 2（1回目の内容につなげる）</div><div class="prompt">'+esc(iwPair[1])+'</div><details><summary>Step 1 の自分の答え</summary><div class="ex">'+esc(step1Text)+'</div></details>';}
      if(p.name==='解答'&&recOn&&P.speak){r=await startRec();rec=r;}
    },()=>finish(r,step1Text));
    $('#skip').onclick=()=>T.skip();
  }
  async function runIS(recOn){
    const pr=$('#pr'); let r=null; if(recOn){r=await startRec();rec=r;}
    for(let qi=0;qi<isSet[1].length;qi++){
      const q=isSet[1][qi], showQ=$('#showQ')?$('#showQ').checked:false;
      pr.innerHTML='<div class="muted">質問 '+(qi+1)+' / '+isSet[1].length+'（話題：'+esc(isSet[0])+'）</div><div class="prompt" style="'+(showQ?'':'filter:blur(6px)')+'" id="qtx">'+esc(q)+'</div><div class="muted">質問の文字は答えのあとで見られます。</div>';
      $('#tm').innerHTML='<div class="phase">質問を再生中…</div><div class="timer">0:35</div>';
      await play('is_'+isI+'_'+qi,q);
      if(V.view!=='task'||V.tab!=='prac')return;
      await new Promise(res=>{const T=runTimer($('#tm'),[{name:'解答',sec:P.ans}],null,res);$('#skip').onclick=()=>T.skip();});
      if(V.view!=='task'||V.tab!=='prac')return;
    }
    finish(r,'');
  }
  const qIdx=()=>k==='photo'?PHOTOS.indexOf(photoId):k==='ispk'?isI:k==='summ'?dlgI:pI;
  function answerCard(){return answerCardFor(qKeyOf(t),qIdx());}
  async function finish(r,step1Text){
    clearInterval(timerH);timerH=null;
    const ta=$('#ta'); const txt=ta?ta.value:'';
    const n=wc(txt)+wc(step1Text||'');
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おつかれさま</div>';
    if(!P.speak){const n1=k==='iw'?wc(step1Text):wc(txt);h+='<div class="muted">'+(k==='iw'?'Step 1：'+wc(step1Text)+' 語 ／ Step 2：'+wc(txt)+' 語':'書いた語数：'+n1+' 語（目安 '+t.words[0]+'〜'+t.words[1]+'）')+'</div>';}
    h+='</div>';
    if(r){const url=await r._done;h+='<div class="card"><div class="muted">録音</div><audio controls src="'+url+'" style="width:100%"></audio></div>';}
    if(k==='iw'&&step1Text) h+='<div class="card"><div class="muted">Step 1 の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(step1Text)+'</div><div class="muted" style="margin-top:8px">Step 2 の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(txt)+'</div></div>';
    else if(txt) h+='<div class="card"><div class="muted">自分の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(txt)+'</div></div>';
    h+=answerCard();
    /* 本番練習で答えたお題を復習リストへ（初回だけ。2回目からは練習扱い） */
    const qid='Q:'+qKeyOf(t)+':'+qIdx();let qr=null;
    try{rvLoad();if(!rvEnrolled(qid)&&!rvWaiting(qid))qr=rvAnswer(qid,60,{fmt:'prac'});}catch(e){}
    const qg=sel=>'<div style="font-weight:700">📅 復習リスト（本番練習のお題）</div>'+rvNoteHtml(qr)+rvGradeHtml('pracFix',{sel,fix:true,q:'模範解答とくらべて自己採点してください（押さなければ ② 惜しい で記録・次の復習は明日）。'});
    if(qr)h+='<div class="card" id="qg">'+qg(null)+'</div>';
    else{try{const st=rvSt(qid);h+='<div class="card note">'+(st.en?'このお題は復習リストに入っています（次の復習 '+rvMd(st.due)+'）。本番練習は何回やっても復習の回数には数えません。':'このお題は復習の登録待ちです（今日の新規登録の枠を使い切りました）。')+'</div>';}catch(e){}}
    h+='<div class="card">'+checkList(t)+'</div>';
    h+='<div class="hero"><button class="pri" id="again2">別のお題で</button><button id="toSee">テンプレを見直す</button></div>';
    el.innerHTML=h;
    logPractice(t,n);
    bindModel(el);
    window.pracFix=p=>{if(!qr)return;rvRegrade(qr.eid,p);$('#qg').innerHTML=qg(p);};
    $('#again2').onclick=()=>{newPrompt();intro();};
    $('#toSee').onclick=()=>{V.tab='see';renderTask(t);};
  }
  intro();
}

try{rvInit();}catch(e){}
render();
</script>
</body>
</html>
