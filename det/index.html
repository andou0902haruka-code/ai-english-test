ecause {{students need face-to-face interaction to stay motivated}}.","For example, {{during the pandemic, I took online classes for a year, and I found it really hard to stay focused at home}}.","So, {{I think the future will be a mix of online and in-person learning}}."]],"au":["m_is_3_0","m_is_3_1","m_is_3_2"],"keys":[{"id":"ispk:3:express my own ideas freely","m":"express my own ideas freely","ja":"自分の考えを自由に表現する","g":"","s":"That's mainly because it was the only class where I could express my own ideas freely.","au":"s_40b5cd825a","src":"Interactive Speaking・Learning"},{"id":"ispk:3:the starting point of","m":"the starting point of","ja":"〜の出発点","g":"the starting point of 【名】","s":"So, that class was actually the starting point of my dream to become an animator.","au":"s_6de37e74ea","src":"Interactive Speaking・Learning"},{"id":"ispk:3:at my own pace","m":"at my own pace","ja":"自分のペースで","g":"","s":"That's mainly because I can focus better and study at my own pace.","au":"s_3c18668384","src":"Interactive Speaking・Learning"},{"id":"ispk:3:twice as many practice questions as usual","m":"twice as many practice questions as usual","ja":"いつもの2倍の練習問題","g":"twice as many 【名】 as usual","s":"For example, when I prepared for my last English test, I studied by myself in the library and finished twice as many practice questions as usual.","au":"s_9807cd7d45","src":"Interactive Speaking・Learning"},{"id":"ispk:3:face-to-face interaction","m":"face-to-face interaction","ja":"対面のやりとり","g":"","s":"That's mainly because students need face-to-face interaction to stay motivated.","au":"s_a075a2e412","src":"Interactive Speaking・Learning"},{"id":"ispk:3:a mix of online and in-person learning","m":"a mix of online and in-person learning","ja":"オンラインと対面を組み合わせた学び","g":"a mix of A and B","s":"So, I think the future will be a mix of online and in-person learning.","au":"s_b14aa92752","src":"Interactive Speaking・Learning"}]},{"a":[["Personally, I {{really like my neighborhood, which is a quiet residential area thirty minutes from the city center}}.","That's mainly because {{it has a big park, a river, and many small, friendly shops}}.","For example, {{last Sunday I had lunch at a local bakery and then took a walk along the river}}.","So, {{it is a comfortable place to live, especially for people who like nature}}."],["Personally, I {{would add more places for young people, like a library or a study café}}.","That's mainly because {{most of the shops close early, so there is nowhere to study at night}}.","For example, {{last week I wanted to study after dinner, but I had to take a train to the city to find an open café}}.","So, {{a late-night study space would make my neighborhood even better}}."],["That's an interesting question. Personally, I {{think the main reason is jobs}}.","That's mainly because {{most large companies and universities are located in big cities}}.","For example, {{three of my high school friends moved to Tokyo after graduation because they could not find the jobs they wanted at home}}.","So, {{unless small towns create more opportunities, young people will keep moving away}}."]],"au":["m_is_4_0","m_is_4_1","m_is_4_2"],"keys":[{"id":"ispk:4:a quiet residential area","m":"a quiet residential area","ja":"静かな住宅街","g":"","s":"Personally, I really like my neighborhood, which is a quiet residential area thirty minutes from the city center.","au":"s_5da3d92838","src":"Interactive Speaking・Your area"},{"id":"ispk:4:thirty minutes from the city center","m":"thirty minutes from the city center","ja":"都心から30分","g":"【時間】 from the city center","s":"Personally, I really like my neighborhood, which is a quiet residential area thirty minutes from the city center.","au":"s_5da3d92838","src":"Interactive Speaking・Your area"},{"id":"ispk:4:there is nowhere to study","m":"there is nowhere to study","ja":"勉強する場所がない","g":"there is nowhere to 【動原】","s":"That's mainly because most of the shops close early, so there is nowhere to study at night.","au":"s_92e899e3fb","src":"Interactive Speaking・Your area"},{"id":"ispk:4:even better","m":"even better","ja":"さらによく","g":"","s":"So, a late-night study space would make my neighborhood even better.","au":"s_c14dfa4bf1","src":"Interactive Speaking・Your area"},{"id":"ispk:4:unless small towns create more opportunities","m":"unless small towns create more opportunities","ja":"小さな町が機会を増やさない限り","g":"unless 【SV】","s":"So, unless small towns create more opportunities, young people will keep moving away.","au":"s_0d9df0c001","src":"Interactive Speaking・Your area"},{"id":"ispk:4:keep moving away","m":"keep moving away","ja":"出ていき続ける","g":"keep 【~ing】","s":"So, unless small towns create more opportunities, young people will keep moving away.","au":"s_0d9df0c001","src":"Interactive Speaking・Your area"}]},{"a":[["I usually {{spend my weekends working on my own animation projects and meeting friends}}.","That's mainly because {{I don't have enough time for my own projects on weekdays}}.","For example, {{last Saturday I spent the whole morning animating a short jump scene, and in the evening I had dinner with two friends}}.","So, {{my weekends are a good balance of work and fun}}."],["Yes, I think so. {{Many people seem busier than before}}.","That's mainly because {{smartphones make it easy to keep working even after we leave the office}}.","For example, {{when I was in high school, my father often answered work emails during dinner}}.","So, {{even when people are not at work, their minds are often still busy}}."],["That's an interesting question. Yes, I think so. {{Companies should give employees more vacation days}}.","That's mainly because {{well-rested workers are more creative and make fewer mistakes}}.","For example, {{my cousin's company introduced a four-day work week last year, and its sales actually increased}}.","So, {{more vacation could benefit both workers and companies}}."]],"au":["m_is_5_0","m_is_5_1","m_is_5_2"],"keys":[{"id":"ispk:5:working on my own animation projects","m":"working on my own animation projects","ja":"自分のアニメ制作に取り組む","g":"work on 【名】","s":"I usually spend my weekends working on my own animation projects and meeting friends.","au":"s_a8366e4351","src":"Interactive Speaking・Free time"},{"id":"ispk:5:a good balance of work and fun","m":"a good balance of work and fun","ja":"仕事と遊びのいいバランス","g":"a good balance of A and B","s":"So, my weekends are a good balance of work and fun.","au":"s_cbd2c39949","src":"Interactive Speaking・Free time"},{"id":"ispk:5:make it easy to keep working","m":"make it easy to keep working","ja":"働き続けやすくする","g":"make it easy to 【動原】","s":"That's mainly because smartphones make it easy to keep working even after we leave the office.","au":"s_d853855a0a","src":"Interactive Speaking・Free time"},{"id":"ispk:5:well-rested","m":"well-rested","ja":"十分に休んだ","g":"","s":"That's mainly because well-rested workers are more creative and make fewer mistakes.","au":"s_c9e50b5d69","src":"Interactive Speaking・Free time"},{"id":"ispk:5:make fewer mistakes","m":"make fewer mistakes","ja":"ミスが少ない","g":"","s":"That's mainly because well-rested workers are more creative and make fewer mistakes.","au":"s_c9e50b5d69","src":"Interactive Speaking・Free time"},{"id":"ispk:5:benefit both workers and companies","m":"benefit both workers and companies","ja":"働く人と会社の両方のためになる","g":"benefit both A and B","s":"So, more vacation could benefit both workers and companies.","au":"s_ca7fb47ddb","src":"Interactive Speaking・Free time"}]},{"a":[["Personally, I prefer {{animated movies and fantasy films}}.","That's mainly because {{they show worlds that cannot exist in real life}}.","For example, {{last month I watched a new animated film in a theater, and the way the characters moved was amazing}}.","So, {{watching these movies is both entertainment and study for me}}."],["Personally, I prefer {{watching movies in a theater}}.","That's mainly because {{the big screen and the sound system make the experience much more powerful}}.","For example, {{when I saw an action movie in an IMAX theater, I felt like I was inside the story}}.","So, {{I go to the theater for big movies and watch smaller ones at home}}."],["That's an interesting question. Personally, I think {{adults enjoy animated films as much as children do}}.","That's mainly because {{many animated films deal with serious themes like family, loss, and growing up}}.","For example, {{when I watched an animated movie about a family with my parents, my father cried at the end}}.","So, {{animation is not just for children, but a powerful way to tell any kind of story}}."]],"au":["m_is_6_0","m_is_6_1","m_is_6_2"],"keys":[{"id":"ispk:6:cannot exist in real life","m":"cannot exist in real life","ja":"現実にはありえない","g":"","s":"That's mainly because they show worlds that cannot exist in real life.","au":"s_0c1af195e2","src":"Interactive Speaking・Movies"},{"id":"ispk:6:the way the characters moved","m":"the way the characters moved","ja":"キャラクターの動き方","g":"the way 【SV】","s":"For example, last month I watched a new animated film in a theater, and the way the characters moved was amazing.","au":"s_c643979978","src":"Interactive Speaking・Movies"},{"id":"ispk:6:I felt like I was inside the story","m":"I felt like I was inside the story","ja":"物語の中にいるように感じた","g":"feel like 【SV】","s":"For example, when I saw an action movie in an IMAX theater, I felt like I was inside the story.","au":"s_35690bcaf7","src":"Interactive Speaking・Movies"},{"id":"ispk:6:as much as children do","m":"as much as children do","ja":"子どもと同じくらい","g":"as much as 【人】 do","s":"Personally, I think adults enjoy animated films as much as children do.","au":"s_28760dd52d","src":"Interactive Speaking・Movies"},{"id":"ispk:6:deal with serious themes","m":"deal with serious themes","ja":"重いテーマを扱う","g":"deal with 【名】","s":"That's mainly because many animated films deal with serious themes like family, loss, and growing up.","au":"s_842bdd3fb4","src":"Interactive Speaking・Movies"},{"id":"ispk:6:not just for children","m":"not just for children","ja":"子どもだけのものではない","g":"not just for 【人】","s":"So, animation is not just for children, but a powerful way to tell any kind of story.","au":"s_2b5512f940","src":"Interactive Speaking・Movies"}]},{"a":[["I usually {{try to reduce waste in small ways}}.","That's mainly because {{small actions add up when many people do them}}.","For example, {{last year I started carrying my own water bottle and shopping bag, so I almost never buy plastic bottles now}}.","So, {{I try to make eco-friendly choices in my daily life}}."],["Yes, I think so. {{Plastic bags should be banned in most stores}}.","That's mainly because {{they are often used only once and then end up in the ocean}}.","For example, {{when Japan started charging for plastic bags in 2020, many people quickly got used to bringing their own bags}}.","So, {{a ban would be a simple but effective way to reduce plastic waste}}."],["That's an interesting question. Personally, I {{think governments are more responsible}}.","That's mainly because {{they can make rules that change the behavior of millions of people at once}}.","For example, {{after my city introduced strict recycling rules, the amount of garbage dropped a lot}}.","So, {{individuals should do their part, but governments have the biggest impact}}."]],"au":["m_is_7_0","m_is_7_1","m_is_7_2"],"keys":[{"id":"ispk:7:in small ways","m":"in small ways","ja":"ささやかなやり方で","g":"","s":"I usually try to reduce waste in small ways.","au":"s_237baa5825","src":"Interactive Speaking・Environment"},{"id":"ispk:7:add up","m":"add up","ja":"積み重なる","g":"","s":"That's mainly because small actions add up when many people do them.","au":"s_d26d564dff","src":"Interactive Speaking・Environment"},{"id":"ispk:7:end up in the ocean","m":"end up in the ocean","ja":"結局海に行き着く","g":"end up in 【場所】","s":"That's mainly because they are often used only once and then end up in the ocean.","au":"s_9af73550c9","src":"Interactive Speaking・Environment"},{"id":"ispk:7:got used to bringing their own bags","m":"got used to bringing their own bags","ja":"マイバッグを持参するのに慣れた","g":"get used to 【~ing】","s":"For example, when Japan started charging for plastic bags in 2020, many people quickly got used to bringing their own bags.","au":"s_b1dac0d1ed","src":"Interactive Speaking・Environment"},{"id":"ispk:7:at once","m":"at once","ja":"一度に","g":"","s":"That's mainly because they can make rules that change the behavior of millions of people at once.","au":"s_24e326de44","src":"Interactive Speaking・Environment"},{"id":"ispk:7:do their part","m":"do their part","ja":"自分の役割を果たす","g":"do 【one's】 part","s":"So, individuals should do their part, but governments have the biggest impact.","au":"s_d0ad22d8c0","src":"Interactive Speaking・Environment"}]}],"ssamp":[{"a":["That's a question I've thought about before. In my opinion, {{it is better to have a few close friends than many casual friends}}. {{Of course, it is nice to know a lot of people, but deep friendships are more valuable to me.}}","The first reason is that {{close friends support you when things get difficult}}. Let me give you an example from my own life. {{When I was preparing for my university entrance exam, I failed a practice test and felt like giving up. Two of my closest friends noticed that I was upset, and they stayed with me in the library every evening for a week. They quizzed me on vocabulary and made me laugh when I was stressed. Thanks to them, I kept going, and I passed the exam.}} {{I don't think casual friends would have done that for me.}}","Another reason is that {{it takes time and energy to keep a friendship strong}}. For instance, if {{I had thirty friends}}, {{I could not meet each of them often or really listen to their problems}}. {{With a few close friends, I can give each person the attention they deserve.}} {{For example, I can remember their birthdays and notice when something is wrong.}}","Of course, some people might say that {{having many friends gives you more opportunities and more fun}}. That's a fair point, but {{I believe quality is more important than quantity when it comes to relationships}}. {{I can still be friendly with many people without calling all of them close friends.}}","So, to sum up, {{I prefer to have a small number of friends I can truly trust}}. That's why {{I try to spend my free time with the people who matter most to me}}. {{In the end, a few true friends make me much happier than a long list of contacts.}}"],"au":"m_ss_0","keys":[{"id":"ssamp:0:felt like giving up","m":"felt like giving up","ja":"諦めたい気分になった","g":"feel like 【~ing】","s":"When I was preparing for my university entrance exam, I failed a practice test and felt like giving up.","au":"s_5147994e0c","src":"Speaking Sample・お題1"},{"id":"ssamp:0:Thanks to them","m":"Thanks to them","ja":"彼らのおかげで","g":"Thanks to 【名】, 〜","s":"Thanks to them, I kept going, and I passed the exam.","au":"s_d352d8c260","src":"Speaking Sample・お題1"},{"id":"ssamp:0:I kept going","m":"I kept going","ja":"頑張り続けた","g":"keep going","s":"Thanks to them, I kept going, and I passed the exam.","au":"s_d352d8c260","src":"Speaking Sample・お題1"},{"id":"ssamp:0:the attention they deserve","m":"the attention they deserve","ja":"その人にふさわしい関心","g":"","s":"With a few close friends, I can give each person the attention they deserve.","au":"s_f015cd979c","src":"Speaking Sample・お題1"},{"id":"ssamp:0:quality is more important than quantity","m":"quality is more important than quantity","ja":"量より質が大切","g":"","s":"That's a fair point, but I believe quality is more important than quantity when it comes to relationships.","au":"s_a63f6eb706","src":"Speaking Sample・お題1"},{"id":"ssamp:0:when it comes to relationships","m":"when it comes to relationships","ja":"人間関係のこととなると","g":"when it comes to 【名】","s":"That's a fair point, but I believe quality is more important than quantity when it comes to relationships.","au":"s_a63f6eb706","src":"Speaking Sample・お題1"},{"id":"ssamp:0:the people who matter most to me","m":"the people who matter most to me","ja":"自分にとっていちばん大切な人たち","g":"","s":"That's why I try to spend my free time with the people who matter most to me.","au":"s_ffb3afba1d","src":"Speaking Sample・お題1"},{"id":"ssamp:0:a long list of contacts","m":"a long list of contacts","ja":"連絡先の長いリスト","g":"","s":"In the end, a few true friends make me much happier than a long list of contacts.","au":"s_cfba334f30","src":"Speaking Sample・お題1"}]},{"a":["That's a question I've thought about before. In my opinion, {{young people should travel before they start their careers, if they have the chance}}. {{Traveling when you are young can shape the way you see the world.}}","The first reason is that {{traveling teaches you things that you cannot learn in a classroom}}. Let me give you an example from my own life. {{After my second year of university, I traveled around Taiwan by myself for ten days. At first, I was nervous because I could not speak Chinese at all. However, I learned to communicate with gestures, simple English, and a translation app. By the end of the trip, I felt much more confident about solving problems on my own.}} {{I even made friends with a group of students from Korea in a hostel.}}","Another reason is that {{it is much harder to take a long trip after you start working}}. For instance, if {{you join a company}}, {{you might only get one week of vacation a year}}. {{Young people usually have more free time and fewer responsibilities, so it is the perfect time to explore.}} {{Once people have full-time jobs and families, it becomes much harder to leave for several weeks.}}","Of course, some people might say that {{traveling delays your career and costs a lot of money}}. That's a fair point, but {{you can travel cheaply by staying in hostels and planning carefully}}. {{Also, many employers value the independence and flexibility that travel develops.}}","So, to sum up, {{traveling before starting a career is a valuable investment in yourself}}. That's why {{I am planning to visit a few more countries before I begin working as an animator}}. {{I want to bring those experiences into my work and my stories.}}"],"au":"m_ss_1","keys":[{"id":"ssamp:1:could not speak Chinese at all","m":"could not speak Chinese at all","ja":"中国語がまったく話せなかった","g":"not 【V】 at all","s":"At first, I was nervous because I could not speak Chinese at all.","au":"s_669d062558","src":"Speaking Sample・お題2"},{"id":"ssamp:1:By the end of the trip","m":"By the end of the trip","ja":"旅の終わりには","g":"By the end of 【名】, 〜","s":"By the end of the trip, I felt much more confident about solving problems on my own.","au":"s_4c08bc9231","src":"Speaking Sample・お題2"},{"id":"ssamp:1:on my own","m":"on my own","ja":"自力で","g":"","s":"By the end of the trip, I felt much more confident about solving problems on my own.","au":"s_4c08bc9231","src":"Speaking Sample・お題2"},{"id":"ssamp:1:fewer responsibilities","m":"fewer responsibilities","ja":"背負うものが少ない","g":"","s":"Young people usually have more free time and fewer responsibilities, so it is the perfect time to explore.","au":"s_c681017322","src":"Speaking Sample・お題2"},{"id":"ssamp:1:the perfect time to explore","m":"the perfect time to explore","ja":"いろいろ見て回るのに絶好の時期","g":"the perfect time to 【動原】","s":"Young people usually have more free time and fewer responsibilities, so it is the perfect time to explore.","au":"s_c681017322","src":"Speaking Sample・お題2"},{"id":"ssamp:1:investment in yourself","m":"investment in yourself","ja":"自己投資","g":"","s":"So, to sum up, traveling before starting a career is a valuable investment in yourself.","au":"s_44480bed28","src":"Speaking Sample・お題2"}]},{"a":["That's a question I've thought about before. In my opinion, {{the most important invention of the last hundred years is the internet}}. {{Many inventions have changed our lives, but none of them has changed as many areas as the internet.}}","The first reason is that {{the internet has completely changed the way people learn}}. Let me give you an example from my own life. {{When I decided to become a 3D animator, there were no animation schools in my hometown. So I started learning from online tutorials made by professionals in America and Europe. I also joined online communities where artists from different countries gave me feedback on my work. Without the internet, I would never have discovered my dream.}} {{I even found my target school in Canada through an online search.}}","Another reason is that {{the internet connects people across long distances instantly}}. For instance, if {{a student studies abroad}}, {{she can still video-call her family every day for free}}. {{Fifty years ago, international phone calls were very expensive.}} {{Now, people can work with teams in other countries, share files in seconds, and stay close to the people they love.}}","Of course, some people might say that {{the internet also causes problems like fake news and addiction}}. That's a fair point, but {{these problems can be reduced through education and good rules}}. {{The benefits are still much greater than the risks.}} {{For example, many schools now teach students how to check whether a news story is true.}}","So, to sum up, {{the internet has transformed education, communication, and work}}. That's why {{I believe no other modern invention has had a bigger impact on our lives}}. {{It is hard to imagine my daily life or my future career without it.}}"],"au":"m_ss_2","keys":[{"id":"ssamp:2:changed the way people learn","m":"changed the way people learn","ja":"人の学び方を変えた","g":"change the way 【SV】","s":"The first reason is that the internet has completely changed the way people learn.","au":"s_23f6c4c07c","src":"Speaking Sample・お題3"},{"id":"ssamp:2:gave me feedback on my work","m":"gave me feedback on my work","ja":"作品に意見をくれた","g":"give 【人】 feedback on 【名】","s":"I also joined online communities where artists from different countries gave me feedback on my work.","au":"s_914c6ab9a5","src":"Speaking Sample・お題3"},{"id":"ssamp:2:Without the internet, I would never have","m":"Without the internet, I would never have","ja":"インターネットがなければ決して〜しなかっただろう","g":"Without 【名】, I would never have 【過去分詞】","s":"Without the internet, I would never have discovered my dream.","au":"s_4972b989a3","src":"Speaking Sample・お題3"},{"id":"ssamp:2:across long distances","m":"across long distances","ja":"遠く離れていても","g":"","s":"Another reason is that the internet connects people across long distances instantly.","au":"s_6c624a07be","src":"Speaking Sample・お題3"},{"id":"ssamp:2:can be reduced through","m":"can be reduced through","ja":"〜によって減らせる","g":"can be reduced through 【名】","s":"That's a fair point, but these problems can be reduced through education and good rules.","au":"s_1e80b59efd","src":"Speaking Sample・お題3"},{"id":"ssamp:2:had a bigger impact on","m":"had a bigger impact on","ja":"〜により大きな影響を与えた","g":"have an impact on 【名】","s":"That's why I believe no other modern invention has had a bigger impact on our lives.","au":"s_9ecc586641","src":"Speaking Sample・お題3"}]},{"a":["That's a question I've thought about before. In my opinion, {{people should follow their passion, but they also need a realistic plan}}. {{Passion alone is not enough, but without it, it is very hard to stay in a difficult field.}}","The first reason is that {{passion gives you the energy to keep improving for many years}}. Let me give you an example from my own life. {{In high school, I spent almost every weekend drawing characters and making short animations, even though nobody asked me to. My parents worried that I was wasting time, but I never got tired of it. Over time, my skills improved so much that my art teacher suggested I apply to an animation program.}} {{That passion is the reason I am now preparing to study abroad.}}","Another reason is that {{people who enjoy their work are usually happier and healthier}}. For instance, if {{someone works in a job they hate for forty years}}, {{they will probably feel stressed and unmotivated most of the time}}. {{In my opinion, that is a very high price to pay for a stable salary. On the other hand, people who love what they do often work harder without feeling forced.}}","Of course, some people might say that {{passion does not pay the bills}}. That's a fair point, but {{you can reduce that risk by learning practical skills and building a strong portfolio}}. {{For example, I am also learning English and software skills that companies need.}}","So, to sum up, {{passion is important, but it works best when it is combined with careful planning}}. That's why {{I am following my dream step by step instead of just hoping for the best}}. {{I believe this balance will help me build a career that I can enjoy for a long time.}}"],"au":"m_ss_3","keys":[{"id":"ssamp:3:even though nobody asked me to","m":"even though nobody asked me to","ja":"誰に頼まれたわけでもないのに","g":"","s":"In high school, I spent almost every weekend drawing characters and making short animations, even though nobody asked me to.","au":"s_241818186c","src":"Speaking Sample・お題4"},{"id":"ssamp:3:never got tired of it","m":"never got tired of it","ja":"まったく飽きなかった","g":"get tired of 【名】","s":"My parents worried that I was wasting time, but I never got tired of it.","au":"s_581293b1f5","src":"Speaking Sample・お題4"},{"id":"ssamp:3:Over time","m":"Over time","ja":"時間が経つにつれて","g":"","s":"Over time, my skills improved so much that my art teacher suggested I apply to an animation program.","au":"s_4e9ea6d1ba","src":"Speaking Sample・お題4"},{"id":"ssamp:3:pay the bills","m":"pay the bills","ja":"生活費を稼ぐ","g":"","s":"Of course, some people might say that passion does not pay the bills.","au":"s_5e1cb41394","src":"Speaking Sample・お題4"},{"id":"ssamp:3:combined with careful planning","m":"combined with careful planning","ja":"慎重な計画と組み合わさった","g":"combined with 【名】","s":"So, to sum up, passion is important, but it works best when it is combined with careful planning.","au":"s_a07ea7393e","src":"Speaking Sample・お題4"},{"id":"ssamp:3:hoping for the best","m":"hoping for the best","ja":"うまくいくことを願う","g":"","s":"That's why I am following my dream step by step instead of just hoping for the best.","au":"s_a59ee5a97e","src":"Speaking Sample・お題4"},{"id":"ssamp:3:a very high price to pay","m":"a very high price to pay","ja":"払うにはあまりに大きな代償","g":"","s":"In my opinion, that is a very high price to pay for a stable salary.","au":"s_08d4e3e909","src":"Speaking Sample・お題4"}]},{"a":["That's a question I've thought about before. In my opinion, {{learning from your own mistakes is more effective in the long run}}. {{Advice from others is helpful, but personal experience leaves a stronger memory.}}","The first reason is that {{you remember lessons much better when you experience them yourself}}. Let me give you an example from my own life. {{My teacher once told me to make a schedule before starting my animation project, but I ignored her advice. I started animating right away, and two weeks before the deadline, I realized I had finished only half of the scenes. I had to work until midnight every day to finish it. Since then, I have always made a detailed schedule first.}} {{Her advice was correct, but I only truly understood it after I failed.}}","Another reason is that {{making mistakes helps you build problem-solving skills}}. For instance, if {{a beginner fixes a bug in his or her own code}}, {{he or she learns how the program actually works}}. {{The next time a similar problem appears, they can solve it much faster. When I fixed a broken scene in Maya by myself, I understood the software much better than when I just followed a tutorial.}}","Of course, some people might say that {{some mistakes are too expensive or dangerous to make}}. That's a fair point, but {{for everyday learning, small mistakes are a natural part of growing}}. {{For serious things like health or money, I would definitely listen to experts first.}}","So, to sum up, {{advice is useful, but personal experience teaches deeper lessons}}. That's why {{I am not afraid of making mistakes when I try something new}}. {{Each mistake gives me a chance to grow, as long as I reflect on it.}}"],"au":"m_ss_4","keys":[{"id":"ssamp:4:in the long run","m":"in the long run","ja":"長い目で見れば","g":"","s":"In my opinion, learning from your own mistakes is more effective in the long run.","au":"s_7d1328dda6","src":"Speaking Sample・お題5"},{"id":"ssamp:4:ignored her advice","m":"ignored her advice","ja":"彼女の助言を無視した","g":"ignore 【人's】 advice","s":"My teacher once told me to make a schedule before starting my animation project, but I ignored her advice.","au":"s_8b948896e3","src":"Speaking Sample・お題5"},{"id":"ssamp:4:right away","m":"right away","ja":"すぐに","g":"","s":"I started animating right away, and two weeks before the deadline, I realized I had finished only half of the scenes.","au":"s_2c11ddd648","src":"Speaking Sample・お題5"},{"id":"ssamp:4:too expensive or dangerous to make","m":"too expensive or dangerous to make","ja":"犯すには代償が大きすぎる・危険すぎる","g":"too 【形】 to 【動原】","s":"Of course, some people might say that some mistakes are too expensive or dangerous to make.","au":"s_dbe9b1aff1","src":"Speaking Sample・お題5"},{"id":"ssamp:4:a natural part of growing","m":"a natural part of growing","ja":"成長につきもの","g":"a natural part of 【名】","s":"That's a fair point, but for everyday learning, small mistakes are a natural part of growing.","au":"s_fd80256ec3","src":"Speaking Sample・お題5"},{"id":"ssamp:4:not afraid of making mistakes","m":"not afraid of making mistakes","ja":"失敗を恐れない","g":"be not afraid of 【~ing】","s":"That's why I am not afraid of making mistakes when I try something new.","au":"s_830e7bb84b","src":"Speaking Sample・お題5"},{"id":"ssamp:4:as long as I reflect on it","m":"as long as I reflect on it","ja":"それを振り返りさえすれば","g":"as long as 【SV】","s":"Each mistake gives me a chance to grow, as long as I reflect on it.","au":"s_b5d8a09c9b","src":"Speaking Sample・お題5"}]},{"a":["That's a question I've thought about before. In my opinion, {{technology makes people more creative overall}}. {{Some people worry that technology makes us lazy, but I think it opens many new doors for creative people.}}","The first reason is that {{technology gives people powerful tools that used to be very expensive}}. Let me give you an example from my own life. {{When I was in high school, I wanted to make a short animated film, but I did not have any special equipment. I downloaded free 3D software and watched tutorials online. After three months, I finished a one-minute film and shared it on social media, where hundreds of people watched it.}} {{Twenty years ago, this would have been almost impossible for a student.}} {{Some viewers even sent me advice on how to improve my next film.}}","Another reason is that {{the internet lets people find inspiration from all over the world}}. For instance, if {{I feel stuck on a character design}}, {{I can look at work by artists from many different cultures in just a few minutes}}. {{Then I can mix those ideas with my own style to create something original.}}","Of course, some people might say that {{technology makes people copy others instead of thinking for themselves}}. That's a fair point, but {{creativity has always started with learning from others}}. {{What matters is how we combine those ideas to make something new.}}","So, to sum up, {{technology removes many barriers to creative work}}. That's why {{I believe more people than ever can express their ideas today}}. {{For example, a teenager with a laptop can now make music, games, or films and share them with the world. I am excited to be part of this new generation of creators.}}"],"au":"m_ss_5","keys":[{"id":"ssamp:5:used to be very expensive","m":"used to be very expensive","ja":"以前はとても高価だった","g":"used to 【動原】","s":"The first reason is that technology gives people powerful tools that used to be very expensive.","au":"s_8a5bbd4ed5","src":"Speaking Sample・お題6"},{"id":"ssamp:5:would have been almost impossible","m":"would have been almost impossible","ja":"ほとんど不可能だっただろう","g":"","s":"Twenty years ago, this would have been almost impossible for a student.","au":"s_2a9d996e7e","src":"Speaking Sample・お題6"},{"id":"ssamp:5:feel stuck on","m":"feel stuck on","ja":"〜で行き詰まる","g":"feel stuck on 【名】","s":"For instance, if I feel stuck on a character design, I can look at work by artists from many different cultures in just a few minutes.","au":"s_c539f65cc3","src":"Speaking Sample・お題6"},{"id":"ssamp:5:thinking for themselves","m":"thinking for themselves","ja":"自分の頭で考える","g":"think for 【oneself】","s":"Of course, some people might say that technology makes people copy others instead of thinking for themselves.","au":"s_85794f67e9","src":"Speaking Sample・お題6"},{"id":"ssamp:5:What matters is","m":"What matters is","ja":"大切なのは〜だ","g":"What matters is 【名/how SV】","s":"What matters is how we combine those ideas to make something new.","au":"s_3da7c97d2c","src":"Speaking Sample・お題6"},{"id":"ssamp:5:removes many barriers to","m":"removes many barriers to","ja":"〜への多くの壁を取り除く","g":"remove barriers to 【名】","s":"So, to sum up, technology removes many barriers to creative work.","au":"s_8a0788e271","src":"Speaking Sample・お題6"},{"id":"ssamp:5:more people than ever","m":"more people than ever","ja":"かつてないほど多くの人","g":"","s":"That's why I believe more people than ever can express their ideas today.","au":"s_b5de20bb37","src":"Speaking Sample・お題6"}]},{"a":["That's a question I've thought about before. In my opinion, {{planning is better in most situations, although a little spontaneity can be fun}}. {{However, I think planning is much more useful for students like me who have busy schedules.}}","The first reason is that {{planning helps me use my limited time efficiently}}. Let me give you an example from my own life. {{Last spring, I had a big animation assignment, a part-time job, and English lessons at the same time. I made a weekly plan that showed exactly when I would work on each task. Because of this plan, I finished the assignment three days early and still had time to sleep well.}} {{Without the plan, I think I would have panicked.}} {{I also felt much calmer during the week because I always knew what to do next.}}","Another reason is that {{planning reduces stress, especially for big events like trips}}. For instance, if {{I book hotels and check train times in advance}}, {{I can relax and enjoy the trip instead of worrying}}. {{Last year, a friend and I went to Osaka without booking anything, and we spent two hours searching for a place to stay.}}","Of course, some people might say that {{being spontaneous makes life more exciting}}. That's a fair point, but {{a good plan can still include free time for unexpected fun}}. {{When I travel, I always leave one afternoon with no plans at all.}} {{That free afternoon is often the most memorable part of the trip.}}","So, to sum up, {{I prefer to plan things carefully}}. That's why {{I usually make a schedule first and then leave a little space for surprises}}. {{This way, I can enjoy both the safety of a plan and the excitement of a surprise.}}"],"au":"m_ss_6","keys":[{"id":"ssamp:6:use my limited time efficiently","m":"use my limited time efficiently","ja":"限られた時間を効率よく使う","g":"","s":"The first reason is that planning helps me use my limited time efficiently.","au":"s_aa20b93bf4","src":"Speaking Sample・お題7"},{"id":"ssamp:6:finished the assignment three days early","m":"finished the assignment three days early","ja":"課題を3日早く終えた","g":"【V】 【期間】 early","s":"Because of this plan, I finished the assignment three days early and still had time to sleep well.","au":"s_1e8f671b89","src":"Speaking Sample・お題7"},{"id":"ssamp:6:I would have panicked","m":"I would have panicked","ja":"パニックになっていただろう","g":"would have 【過去分詞】","s":"Without the plan, I think I would have panicked.","au":"s_22ff5311e4","src":"Speaking Sample・お題7"},{"id":"ssamp:6:in advance","m":"in advance","ja":"前もって","g":"","s":"For instance, if I book hotels and check train times in advance, I can relax and enjoy the trip instead of worrying.","au":"s_07af3b0557","src":"Speaking Sample・お題7"},{"id":"ssamp:6:instead of worrying","m":"instead of worrying","ja":"心配する代わりに","g":"instead of 【~ing】","s":"For instance, if I book hotels and check train times in advance, I can relax and enjoy the trip instead of worrying.","au":"s_07af3b0557","src":"Speaking Sample・お題7"},{"id":"ssamp:6:leave a little space for surprises","m":"leave a little space for surprises","ja":"思いがけないことのために少し余白を残す","g":"leave space for 【名】","s":"That's why I usually make a schedule first and then leave a little space for surprises.","au":"s_0ade273a57","src":"Speaking Sample・お題7"},{"id":"ssamp:6:searching for a place to stay","m":"searching for a place to stay","ja":"泊まる場所を探す","g":"search for 【名】","s":"Last year, a friend and I went to Osaka without booking anything, and we spent two hours searching for a place to stay.","au":"s_eae93b409f","src":"Speaking Sample・お題7"}]},{"a":["That's a question I've thought about before. In my opinion, {{students should be allowed to use AI tools, but only in certain ways}}. {{AI is already part of our daily lives, so banning it completely does not seem realistic.}}","The first reason is that {{AI can be an excellent personal tutor}}. Let me give you an example from my own life. {{When I was studying for an English writing test, I wrote short essays and asked an AI tool to point out my grammar mistakes. It explained why each sentence was wrong and showed me better expressions. After a month of practice, my writing score improved noticeably.}} {{I still wrote every essay myself, so I actually learned from the feedback.}} {{The tool did not do the work for me; it helped me see my own weak points.}}","Another reason is that {{students will need to use AI in their future jobs anyway}}. For instance, if {{a designer knows how to use AI tools well}}, {{she can create ideas much faster than someone who doesn't}}. {{Learning to use these tools responsibly in school will prepare students for that future.}}","Of course, some people might say that {{students will just copy answers from AI and stop thinking}}. That's a fair point, but {{teachers can prevent this by asking students to explain their work or show their drafts}}. {{Clear rules are better than a complete ban.}} {{For example, a teacher could allow AI for checking grammar but not for writing the whole essay.}}","So, to sum up, {{AI should be used as a learning partner, not as a machine that does homework for students}}. That's why {{I support allowing AI with clear guidelines}}. {{If we use it wisely, AI can make learning faster and more personal.}}"],"au":"m_ss_7","keys":[{"id":"ssamp:7:only in certain ways","m":"only in certain ways","ja":"特定のやり方に限って","g":"","s":"In my opinion, students should be allowed to use AI tools, but only in certain ways.","au":"s_a1dee61272","src":"Speaking Sample・お題8"},{"id":"ssamp:7:point out my grammar mistakes","m":"point out my grammar mistakes","ja":"文法の間違いを指摘する","g":"point out 【名】","s":"When I was studying for an English writing test, I wrote short essays and asked an AI tool to point out my grammar mistakes.","au":"s_5b4fbed881","src":"Speaking Sample・お題8"},{"id":"ssamp:7:improved noticeably","m":"improved noticeably","ja":"目に見えて上がった","g":"","s":"After a month of practice, my writing score improved noticeably.","au":"s_7f04b162d6","src":"Speaking Sample・お題8"},{"id":"ssamp:7:anyway","m":"anyway","ja":"どのみち","g":"","s":"Another reason is that students will need to use AI in their future jobs anyway.","au":"s_6ff56192ce","src":"Speaking Sample・お題8"},{"id":"ssamp:7:prevent this by asking","m":"prevent this by asking","ja":"〜を求めることでこれを防ぐ","g":"prevent 【名】 by 【~ing】","s":"That's a fair point, but teachers can prevent this by asking students to explain their work or show their drafts.","au":"s_6e4669b5b4","src":"Speaking Sample・お題8"},{"id":"ssamp:7:a complete ban","m":"a complete ban","ja":"全面禁止","g":"","s":"Clear rules are better than a complete ban.","au":"s_ac76ac935d","src":"Speaking Sample・お題8"},{"id":"ssamp:7:as a learning partner, not as a machine","m":"as a learning partner, not as a machine","ja":"機械としてではなく学びの相棒として","g":"as A, not as B","s":"So, to sum up, AI should be used as a learning partner, not as a machine that does homework for students.","au":"s_009fc45477","src":"Speaking Sample・お題8"}]}],"summ":[{"a":["I talked with {{my professor}} about {{my term paper}} because {{I couldn't find enough sources for my topic}}.","{{She}} suggested that I {{focus on solar power}}, and also explained that {{the library has a database of energy reports}}.","Although {{I had already written two pages about wind farms}}, I decided to {{change my outline and visit the library tomorrow}}."],"au":"m_summ_0","keys":[{"id":"summ:0:couldn't find enough sources","m":"couldn't find enough sources","ja":"十分な資料が見つからなかった","g":"","s":"I talked with my professor about my term paper because I couldn't find enough sources for my topic.","au":"s_e896135984","src":"Summarize・会話1"},{"id":"summ:0:focus on solar power","m":"focus on solar power","ja":"太陽光発電に絞る","g":"focus on 【名】","s":"She suggested that I focus on solar power, and also explained that the library has a database of energy reports.","au":"s_a577977d08","src":"Summarize・会話1"},{"id":"summ:0:had already written","m":"had already written","ja":"すでに書いていた（過去完了）","g":"had already 【過去分詞】","s":"Although I had already written two pages about wind farms, I decided to change my outline and visit the library tomorrow.","au":"s_fa0f6e2be8","src":"Summarize・会話1"}]},{"a":["I talked with {{my classmate}} about {{our study group}} because {{two members couldn't come on Thursday}}.","{{She}} suggested that {{we book a meeting room in the student lounge}}, and also explained that {{the rooms are quiet and free}}.","Although {{the library is closed on Sundays}}, I decided to {{book a room for Sunday and tell the group}}."],"au d with {{my friend}} about {{an unpaid internship}} because {{I can't do it and keep my café job}}.","{{He}} suggested that I {{ask my manager for weekend shifts}}, and also explained that {{the experience would look great on my résumé}}.","Although {{I need money for rent}}, I decided to {{talk to my manager before accepting the offer}}."],"au":"m_summ_3","keys":[{"id":"summ:3:ask my manager for weekend shifts","m":"ask my manager for weekend shifts","ja":"店長に週末のシフトを頼む","g":"ask 【人】 for 【名】","s":"He suggested that I ask my manager for weekend shifts, and also explained that the experience would look great on my résumé.","au":"s_f9f0e66a91","src":"Summarize・会話4"},{"id":"summ:3:look great on my résumé","m":"look great on my résumé","ja":"履歴書で見栄えがする","g":"look great on 【one's】 résumé","s":"He suggested that I ask my manager for weekend shifts, and also explained that the experience would look great on my résumé.","au":"s_f9f0e66a91","src":"Summarize・会話4"},{"id":"summ:3:before accepting the offer","m":"before accepting the offer","ja":"申し出を受ける前に","g":"before 【~ing】","s":"Although I need money for rent, I decided to talk to my manager before accepting the offer.","au":"s_c264d9aff1","src":"Summarize・会話4"}]}],"sphoto":[{"a":["In this picture, I can see {{a quiet river flowing through a valley early in the morning}}.","The first thing I notice is {{the shallow river in the front}}. {{It}} is {{running over many smooth, gray stones}}, and {{the water is reflecting the soft pink light of the sky}}.","On the left side, {{there is a patch of long green grass}}, and on the right side, {{tall pine trees stand along the riverbank}}. In the background, {{two huge rocky cliffs rise on both sides of the valley}}. {{Between them, the sky is glowing pink and orange.}}","Judging from {{the misty air and the gentle colors}}, it seems that {{the sun has just come up}}. {{Some campers}} might be {{still sleeping in their tents nearby}}.","The whole scene looks {{calm and a little mysterious}}. This picture reminds me of {{a camping trip I took with my family}}, because {{we also woke up early to see the mist over a river}}."],"au":"m_sp_0","keys":[{"id":"sphoto:0:flowing through a valley","m":"flowing through a valley","ja":"谷を流れている","g":"flow through 【名】","s":"In this picture, I can see a quiet river flowing through a valley early in the morning.","au":"s_72b620c68c","src":"Speak About the Photo・写真1"},{"id":"sphoto:0:reflecting the soft pink light","m":"reflecting the soft pink light","ja":"柔らかなピンクの光を映している","g":"reflect 【名】","s":"It is running over many smooth, gray stones, and the water is reflecting the soft pink light of the sky.","au":"s_377d364855","src":"Speak About the Photo・写真1"},{"id":"sphoto:0:along the riverbank","m":"along the riverbank","ja":"川岸に沿って","g":"","s":"On the left side, there is a patch of long green grass, and on the right side, tall pine trees stand along the riverbank.","au":"s_32c0906664","src":"Speak About the Photo・写真1"},{"id":"sphoto:0:the sun has just come up","m":"the sun has just come up","ja":"日がちょうど昇ったところ","g":"","s":"Judging from the misty air and the gentle colors, it seems that the sun has just come up.","au":"s_debcb091b6","src":"Speak About the Photo・写真1"}]},{"a":["In this picture, I can see {{a bright turquoise lake surrounded by tall mountains}}.","The first thing I notice is {{a small wooden boat in the front}}. {{One person}} is {{rowing}}, and {{another person is sitting at the back and enjoying the view}}. {{The water is so clear that you can see the bottom of the lake.}}","On the left side, {{a huge rocky cliff rises above a green forest}}, and on the right side, {{a thick forest goes down to a small beach}}. In the background, {{gray mountains stand under a bright blue sky}}.","Judging from {{the strong sunlight}}, it seems that {{it is a warm summer day}}. {{The people in the other boats}} might be {{enjoying their summer vacation}}.","The whole scene looks {{peaceful and refreshing}}. This picture reminds me of {{a lake I visited in Hokkaido}}, because {{I also rented a boat there with my friends}}."],"au":"m_sp_1","keys":[{"id":"sphoto:1:surrounded by tall mountains","m":"surrounded by tall mountains","ja":"高い山に囲まれた","g":"surrounded by 【名】","s":"In this picture, I can see a bright turquoise lake surrounded by tall mountains.","au":"s_43139726d7","src":"Speak About the Photo・写真2"},{"id":"sphoto:1:so clear that you can see the bottom","m":"so clear that you can see the bottom","ja":"底が見えるほど澄んでいる","g":"so 【形】 that 【SV】","s":"The water is so clear that you can see the bottom of the lake.","au":"s_1912ba0606","src":"Speak About the Photo・写真2"},{"id":"sphoto:1:goes down to a small beach","m":"goes down to a small beach","ja":"小さな浜辺まで下っている","g":"go down to 【名】","s":"On the left side, a huge rocky cliff rises above a green forest, and on the right side, a thick forest goes down to a small beach.","au":"s_913cb6c6e5","src":"Speak About the Photo・写真2"},{"id":"sphoto:1:enjoying the view","m":"enjoying the view","ja":"景色を楽しんでいる","g":"","s":"One person is rowing, and another person is sitting at the back and enjoying the view.","au":"s_00de6b8b75","src":"Speak About the Photo・写真2"}]},{"a":["In this picture, I can see {{a wide green valley filled with soft golden light}}.","The first thing I notice is {{a tiny person standing on top of a large rock}}. {{He}} is {{looking out over the valley}}, and {{he seems very small compared to the hills}}.","On the left side, {{there are tall, pointed rocks covered in moss}}, and on the right side, {{another round rock sticks out of the grass}}. In the background, {{layers of mountains fade into the mist}}. {{The light is coming from the top of the picture, like the sun is breaking through the clouds.}}","Judging from {{the mist and the warm light}}, it seems that {{it is early in the morning}}. {{The person}} might be {{taking a break during a long hike}}.","The whole scene looks {{quiet and a little magical}}. This picture reminds me of {{a fantasy movie}}, because {{the hills look like a world from an old story}}."],"au":"m_sp_2","keys":[{"id":"sphoto:2:looking out over the valley","m":"looking out over the valley","ja":"谷を見渡している","g":"look out over 【名】","s":"He is looking out over the valley, and he seems very small compared to the hills.","au":"s_6067f91c0f","src":"Speak About the Photo・写真3"},{"id":"sphoto:2:compared to the hills","m":"compared to the hills","ja":"丘に比べて","g":"compared to 【名】","s":"He is looking out over the valley, and he seems very small compared to the hills.","au":"s_6067f91c0f","src":"Speak About the Photo・写真3"},{"id":"sphoto:2:fade into the mist","m":"fade into the mist","ja":"霧の中に溶けていく","g":"fade into 【名】","s":"In the background, layers of mountains fade into the mist.","au":"s_7abc837f32","src":"Speak About the Photo・写真3"},{"id":"sphoto:2:breaking through the clouds","m":"breaking through the clouds","ja":"雲間から差し込む","g":"","s":"The light is coming from the top of the picture, like the sun is breaking through the clouds.","au":"s_1f0f3d1c75","src":"Speak About the Photo・写真3"}]},{"a":["In this picture, I can see {{a long, empty road running through a desert}}.","The first thing I notice is {{the road in the middle}}. {{It}} is {{going straight toward the mountains}}, and {{it has two yellow lines down the center}}. {{There is only one car far away on the road.}}","On the left side, {{huge red rocks rise up next to the road}}, and on the right side, {{more red rocks and dry bushes cover the ground}}. In the background, {{a dark, pointed mountain stands under a gray sky}}.","Judging from {{the dry plants and the red rocks}}, it seems that {{this area gets very little rain}}. {{The people in the car}} might be {{driving across the country on a road trip}}.","The whole scene looks {{wild and adventurous}}. This picture reminds me of {{an American road movie}}, because {{the empty road seems to go on forever}}."],"au":"m_sp_3","keys":[{"id":"sphoto:3:running through a desert","m":"running through a desert","ja":"砂漠を通っている","g":"run through 【名】","s":"In this picture, I can see a long, empty road running through a desert.","au":"s_a5215db01d","src":"Speak About the Photo・写真4"},{"id":"sphoto:3:down the center","m":"down the center","ja":"中央に沿って","g":"","s":"It is going straight toward the mountains, and it has two yellow lines down the center.","au":"s_3de22c9fbd","src":"Speak About the Photo・写真4"},{"id":"sphoto:3:gets very little rain","m":"gets very little rain","ja":"雨がほとんど降らない","g":"","s":"Judging from the dry plants and the red rocks, it seems that this area gets very little rain.","au":"s_5427d21a1b","src":"Speak About the Photo・写真4"},{"id":"sphoto:3:seems to go on forever","m":"seems to go on forever","ja":"どこまでも続いているように見える","g":"","s":"This picture reminds me of an American road movie, because the empty road seems to go on forever.","au":"s_73af022663","src":"Speak About the Photo・写真4"}]},{"a":["In this picture, I can see {{a narrow dirt path in a thick forest}}.","The first thing I notice is {{the path in the front}}. {{It}} is {{curving slowly into the trees}}, and {{it is covered with brown leaves and soil}}.","On the left side, {{tall, dark tree trunks stand close together}}, and on the right side, {{the ground slopes up and is covered with green plants}}. In the background, {{warm sunlight is shining through the leaves}}. {{The light makes the whole forest glow gold and green.}}","Judging from {{the low, golden light}}, it seems that {{it is either early morning or late afternoon}}. {{Hikers}} might be {{walking along this path to reach a lake or a mountain}}.","The whole scene looks {{fresh and relaxing}}. This picture reminds me of {{a hiking trail near my grandparents' house}}, because {{it also has tall trees and soft sunlight}}."],"au":"m_sp_4","keys":[{"id":"sphoto:4:curving slowly into the trees","m":"curving slowly into the trees","ja":"木々の中へゆるやかに曲がっていく","g":"curve into 【名】","s":"It is curving slowly into the trees, and it is covered with brown leaves and soil.","au":"s_7f74951793","src":"Speak About the Photo・写真5"},{"id":"sphoto:4:the ground slopes up","m":"the ground slopes up","ja":"地面が上り坂になっている","g":"","s":"On the left side, tall, dark tree trunks stand close together, and on the right side, the ground slopes up and is covered with green plants.","au":"s_05dff8055a","src":"Speak About the Photo・写真5"},{"id":"sphoto:4:shining through the leaves","m":"shining through the leaves","ja":"葉の間から差し込んでいる","g":"shine through 【名】","s":"In the background, warm sunlight is shining through the leaves.","au":"s_d9681b85f1","src":"Speak About the Photo・写真5"},{"id":"sphoto:4:either early morning or late afternoon","m":"either early morning or late afternoon","ja":"早朝か夕方のどちらか","g":"either A or B","s":"Judging from the low, golden light, it seems that it is either early morning or late afternoon.","au":"s_e61a0d8b82","src":"Speak About the Photo・写真5"}]},{"a":["In this picture, I can see {{the inside of a modern restaurant with no customers}}.","The first thing I notice is {{a long row of dark tables in the middle}}. {{Each table}} is {{set with glasses and plates}}, and {{black chairs with wooden legs are placed around them}}.","On the left side, {{there are long gray sofas along the wall}}, and on the right side, {{black booth seats and a tall bar table stand by the window}}. In the background, {{wooden panels and large windows let in natural light}}. {{Round black lamps hang from the ceiling.}}","Judging from {{the empty seats and the neat tables}}, it seems that {{the restaurant has not opened yet}}. {{The staff}} might be {{getting ready for lunch in the kitchen}}.","The whole scene looks {{stylish and quiet}}. This picture reminds me of {{a hotel restaurant where my family celebrated my graduation}}, because {{it had the same dark, elegant design}}."],"au":"m_sp_5","keys":[{"id":"sphoto:5:set with glasses and plates","m":"set with glasses and plates","ja":"グラスと皿が用意された","g":"be set with 【名】 es of grilled beef and fresh lettuce, and thin red onions and chili peppers are on top.","au":"s_a2d3f9e6e8","src":"Speak About the Photo・写真7"},{"id":"sphoto:6:scattered across the table","m":"scattered across the table","ja":"テーブルに散らばっている","g":"scattered across 【名】","s":"In the background, fresh herbs, red chili peppers, and cashew nuts are scattered across the table.","au":"s_a41718b553","src":"Speak About the Photo・写真7"},{"id":"sphoto:6:getting ready to share","m":"getting ready to share","ja":"分け合おうとしている","g":"get ready to 【動原】","s":"The people might be getting ready to share these dishes at a party.","au":"s_bc193a78bf","src":"Speak About the Photo・写真7"},{"id":"sphoto:6:just like this","m":"just like this","ja":"ちょうどこんな","g":"","s":"This picture reminds me of a Thai restaurant near my university, because they serve a spicy beef salad just like this.","au":"s_1755e0489f","src":"Speak About the Photo・写真7"}]},{"a":["In this picture, I can see {{three young people laughing together at a wooden table}}.","The first thing I notice is {{a woman with long brown hair in the middle}}. {{She}} is {{smiling widely}}, and {{she looks like she is listening to a funny story}}.","On the left side, {{a woman in a white sweater is typing on a laptop}}, and on the right side, {{a person with glasses and a denim jacket is laughing behind a silver laptop}}. In the background, {{I can see a gray concrete wall and some tall plants}}. {{There is also a brown notebook and a glass of water on the table.}}","Judging from {{their laptops and the notebook}}, it seems that {{they are working on something together}}. They might be {{taking a short break from a group project}}.","The whole scene looks {{friendly and cheerful}}. This picture reminds me of {{studying with my classmates at a café}}, because {{we always end up talking and laughing more than studying}}."],"au":"m_sp_7","keys":[{"id":"sphoto:7:smiling widely","m":"smiling widely","ja":"にっこり笑っている","g":"","s":"She is smiling widely, ft side, a man with headphones and a woman with glasses are looking at their screens, and on the right side, a man with a beard and a brown hoodie is focused on his work.","au":"s_52a8661d71","src":"Speak About the Photo・写真9"},{"id":"sphoto:8:fill the room with soft light","m":"fill the room with soft light","ja":"部屋を柔らかな光で満たす","g":"fill 【名】 with 【名】","s":"In the background, large windows and wooden walls fill the room with soft light.","au":"s_ca65dc090e","src":"Speak About the Photo・写真9"},{"id":"sphoto:8:casual clothes","m":"casual clothes","ja":"カジュアルな服装","g":"","s":"Judging from their casual clothes and laptops, it seems that they work at a small start-up company.","au":"s_2b664629e2","src":"Speak About the Photo・写真9"},{"id":"sphoto:8:side by side","m":"side by side","ja":"並んで","g":"","s":"This picture reminds me of my university's computer lab, because everyone there also works quietly side by side.","au":"s_6eff423961","src":"Speak About the Photo・写真9"}]},{"a":["In this picture, I can see {{a large city with a river, viewed from high above}}.","The first thing I notice is {{a famous bridge with two stone towers at the front}}. {{It}} is {{crossing the wide river}}, and {{a few boats are moving near it}}.","On the left side, {{there are rows of old brown buildings}}, and on the right side, {{many apartments and offices stand along the riverbank}}. In the background, {{a group of tall office buildings stands under a hazy sky}}. {{The river winds through the middle of the city like a long blue ribbon.}}","Judging from {{the soft pink light}}, it seems that {{the photo was taken in the evening}}. {{Many people}} might be {{heading home after work right now}}.","The whole scene looks {{busy but beautiful}}. This picture reminds me of {{the view from Tokyo Skytree}}, because {{I could also see a river running through a huge city from there}}."],"au":"m_sp_9","keys":[{"id":"sphoto:9:viewed from high above","m":"viewed from high above","ja":"高いところから見た","g":"","s":"In this picture, I can see a large city with a river, viewed from high above.","au":"s_2252ebbfde","src":"Speak About the Photo・写真10"},{"id":"sphoto:9:winds through the middle of the city","m":"winds through the middle of the city","ja":"街の真ん中を曲がりくねって流れる","g":"wind through 【名】","s":"The river winds through the middle of the city like a long blue ribbon.","au":"s_fa7e2b74e6","src":"Speak About the Photo・写真10"},{"id":"sphoto:9:like a long blue ribbon","m":"like a long blue ribbon","ja":"長い青いリボンのように","g":"","s":"The river winds through the middle of the city like a long blue ribbon.","au":"s_fa7e2b74e6","src":"Speak About the Photo・写真10"},{"id":"sphoto:9:heading home after work","m":"heading home after work","ja":"仕事を終えて家に向かう","g":"head home","s":"Many people might be heading home after work right now.","au":"s_96348acaf8","src":"Speak About the Photo・写真10"}]},{"a":["In this picture, I can see {{a huge city next to a wide lake, seen from the top of a tall building}}.","The first thing I notice is {{the countless skyscrapers in the front}}. {{They}} are {{packed closely together}}, and {{some of their walls are shining in the evening light}}.","On the left side, {{the city goes all the way to the edge of the water}}, and on the right side, {{there are tall towers with flat roofs}}. In the background, {{the dark blue lake stretches to the horizon}}. {{Above it, the sky is pink and purple with small clouds.}}","Judging from {{the pink sky}}, it seems that {{the sun is setting}}. {{People in these offices}} might be {{finishing their work for the day}}.","The whole scene looks {{impressive and modern}}. This picture reminds me of {{a city I want to visit someday}}, because {{I love looking at skylines from observation decks}}."],"au":"m_sp_10","keys":[{"id":"sphoto:10:packed closely together","m":"packed closely together","ja":"ぎっしり詰まって","g":"","s":"They are packed closely together, and some of their walls are shining in the evening light.","au":"s_feeda77536","src":"Speak About the Photo・写真11"},{"id":"sphoto:10:all the way to the edge of the water","m":"all the way to the edge of the water","ja":"水辺の端までずっと","g":"all the way to 【名】","s":"On the left side, the city goes all the way to the edge of the water, and on the right side, there are tall towers with flat roofs.","au":"s_40afd93458","src":"Speak About the Photo・写真11"},{"id":"sphoto:10:stretches to the horizon","m":"stretches to the horizon","ja":"水平線まで広がる","g":"stretch to 【名】","s":"In the background, the dark blue lake stretches to the horizon.","au":"s_8da9e00d89","src":"Speak About the Photo・写真11"},{"id":"sphoto:10:finishing their work for the day","m":"finishing their work for the day","ja":"その日の仕事を終えようとしている","g":"","s":"People in these offices might be finishing their work for the day.","au":"s_e76e3737c3","src":"Speak About the Photo・写真11"}]},{"a":["In this picture, I can see {{a wide street in the middle of a big city}}.","The first thing I notice is {{the empty road in the front}}. {{It}} is {{going straight between tall buildings}}, and {{traffic lights are hanging over it}}.","On the left side, {{many people are walking along the sidewalk}}, and on the right side, {{black cars are parked next to a large building}}. In the background, {{yellow taxis are waiting at the traffic lights}}. {{The glass skyscrapers are so tall that they almost hide the sky.}}","Judging from {{the yellow taxis and the tall buildings}}, it seems that {{this is New York City}}. {{The people on the sidewalk}} might be {{going to work or shopping}}.","The whole scene looks {{busy and energetic}}. This picture reminds me of {{the business district in Tokyo}}, because {{it also has wide streets and huge office towers}}."],"au":"m_sp_11","keys":[{"id":"sphoto:11:in the middle of a big city","m":"in the middle of a big city","ja":"大都市の真ん中で","g":"in the middle of 【名】","s":"In this picture, I can see a wide street in the middle of a big city.","au":"s_a96b930283","src":"Speak About the Photo・写真12"},{"id":"s he left side, there are piles of wooden boxes and a table with a red cloth, and on the right side, a tall green pole holds up the roof.","au":"s_0934c83e72","src":"Speak About the Photo・写真13"},{"id":"sphoto:12:the morning rush","m":"the morning rush","ja":"朝の混雑","g":"","s":"The sellers might be preparing for the morning rush.","au":"s_efcffe8d59","src":"Speak About the Photo・写真13"},{"id":"sphoto:12:in a friendly way","m":"in a friendly way","ja":"親しげに","g":"","s":"This picture reminds me of the morning market in Takayama, because the sellers there also chat with customers in a friendly way.","au":"s_3b1483934c","src":"Speak About the Photo・写真13"}]},{"a":["In this picture, I can see {{a fruit and vegetable stand at a busy market}}.","The first thing I notice is {{the colorful fruit in the front}}. {{It}} is {{piled up in neat rows}}, and {{each type has a small white price tag}}.","On the left side, {{there are pineapples and red apples}}, and on the right side, {{I can see eggplants, green melons, and dark purple fruit}}. In the background, {{pumpkins, peppers, and green onions are stacked high}}. {{A metal scale hangs above the vegetables.}}","Judging from {{tropical fruit like dragon fruit and lychees}}, it seems that {{this market is in a warm country}}. {{Shoppers}} might be {{buying fresh food for the day}}.","The whole scene looks {{fresh and lively}}. This picture reminds me of {{a big market I saw on a travel show}}, because {{the stalls there were also full of bright colors}}."],"au":"m_sp_13","keys":[{"id":"sphoto:13:piled up in neat rows","m":"piled up in neat rows","ja":"きちんと列に積まれている","g":"be piled up 【場所】","s":"It is piled up in neat rows, and each type has a small white price tag.","au":"s_6ae2002904","src":"Speak About the Photo・写真14"},{"id":"sphoto:13:stacked high","m":"stacked high","ja":"高く積み上げられて","g":"","s":"In the background, pumpkins, peppers, and green onions are stacked high.","au":"s_6403f8b6d9","src":"Speak About the Photo・写真14"},{"id":"sph
