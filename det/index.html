rc":"Speak About the Photo・写真15"},{"id":"sphoto:14:on a trip together","m":"on a trip together","ja":"一緒に旅行中","g":"","s":"Judging from the camera and the bags, it seems that they are on a trip together.","au":"s_3d1e18b114","src":"Speak About the Photo・写真15"},{"id":"sphoto:14:took a group photo","m":"took a group photo","ja":"集合写真を撮った","g":"","s":"This picture reminds me of my graduation trip with my high school friends, because we also took a group photo by the sea.","au":"s_ba783e4986","src":"Speak About the Photo・写真15"}]},{"a":["In this picture, I can see {{four friends standing on a hill at sunset}}.","The first thing I notice is {{the bright sun between them}}. {{It}} is {{shining through the gap between two people}}, and {{the light makes their shapes look dark}}.","On the left side, {{a woman with long hair is wearing jeans}}, and on the right side, {{a tall man has a shirt tied around his shoulders}}. In the background, {{misty hills fade into the orange sky}}. {{Some bags are lying on the dry grass behind them.}}","Judging from {{the bags on the ground}}, it seems that {{they climbed the hill together}}. They might be {{celebrating the end of a long hike}}.","The whole scene looks {{warm and emotional}}. This picture reminds me of {{the last day of a school trip}}, because {{we watched the sunset together and felt a little sad that it was ending}}."],"au":"m_sp_15","keys":[{"id":"sphoto:15:shining through the gap between","m":"shining through the gap between","ja":"〜の間のすき間から差し込んでいる","g":"","s":"It is shining through the gap between two people, and the light makes their shapes look dark.","au":"s_1f094370db","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:makes their shapes look dark","m":"makes their shapes look dark","ja":"彼らの姿を黒く見せる","g":"make 【名】 look 【形】","s":"It is shining through the gap between two people, and the light makes their shapes look dark.","au":"s_1f094370db","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:tied around his shoulders","m":"tied around his shoulders","ja":"肩に巻いて","g":"","s":"On the left side, a woman with long hair is wearing jeans, and on the right side, a tall man has a shirt tied around his shoulders.","au":"s_6fa16e6330","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:celebrating the end of","m":"celebrating the end of","ja":"〜の終わりを祝っている","g":"celebrate the end of 【名】","s":"They might be celebrating the end of a long hike.","au":"s_1da65e57a8","src":"Speak About the Photo・写真16"}]},{"a":["In this picture, I can see {{a wooden desk with some school supplies on it}}.","The first thing I notice is {{a shiny red apple}}. {{It}} is {{sitting on top of a stack of books}}, and {{it looks fresh and bright}}.","On the left side, {{there are four books piled on top of each other}}, and on the right side, {{three toy blocks show the letters A, B, and C}}. In the background, {{there is a plain white wall with a colorful painting at the top}}. {{In the middle of the desk, a few colored pencils are lying in a small pile.}}","Judging from {{the alphabet blocks and the colored pencils}}, it seems that {{this is a classroom for young children}}. {{The children}} might be {{playing outside during a break}}.","The whole scene looks {{neat and cheerful}}. This picture reminds me of {{my elementary school classroom}}, because {{we also used colored pencils and alphabet cards every day}}."],"au":"m_sp_16","keys":[{"id":"sphoto:16:sitting on top of a stack of books","m":"sitting on top of a stack of books","ja":"積んだ本のてっぺんに置かれている","g":"sit on top of 【名】","s":"It is sitting on top of a stack of books, and it looks fresh and bright.","au":"s_d7c92e5124","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:piled on top of each other","m":"piled on top of each other","ja":"積み重なって","g":"","s":"On the left side, there are four books piled on top of each other, and on the right side, three toy blocks show the letters A, B, and C.","au":"s_026eba73a0","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:a plain white wall","m":"a plain white wall","ja":"何もない白い壁","g":"","s":"In the background, there is a plain white wall with a colorful painting at the top.","au":"s_325de9420e","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:lying in a small pile","m":"lying in a small pile","ja":"小さな山になって置かれている","g":"","s":"In the middle of the desk, a few colored pencils are lying in a small pile.","au":"s_9ebc0ebf6f","src":"Speak About the Photo・写真17"}]},{"a":["In this picture, I can see {{a large, empty office space with a modern design}}.","The first thing I notice is {{a long hallway in the middle}}. {{It}} is {{going straight back}}, and {{it has glass walls on both sides}}.","On the left side, {{there is a light green sofa and some low wooden shelves}}, and on the right side, {{black kitchen cabinets and a large fridge stand against the wall}}. In the background, {{small lights hang from the ceiling all the way down the hallway}}. {{The floor is smooth and light gray.}}","Judging from {{the empty space and the clean floor}}, it seems that {{the office is brand new}}. {{Workers}} might be {{moving in next week}}.","The whole scene looks {{modern and calm}}. This picture reminds me of {{the kind of studio I want to work in}}, because {{it looks clean and comfortable for creative work}}."],"au":"m_sp_17","keys":[{"id":"sphoto:17:going straight back","m":"going straight back","ja":"まっすぐ奥へ続いている","g":"","s":"It is going straight back, and it has glass walls on both sides.","au":"s_99ec27b75f","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:stand against the wall","m":"stand against the wall","ja":"壁に沿って置かれている","g":"stand against 【名】","s":"On the left side, there is a light green sofa and some low wooden shelves, and on the right side, black kitchen cabinets and a large fridge stand against the wall.","au":"s_abfefa5dcb","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:brand new","m":"brand new","ja":"新品の","g":"","s":"Judging from the empty space and the clean floor, it seems that the office is brand new.","au":"s_01961b738d","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:moving in","m":"moving in","ja":"入居する","g":"move in","s":"Workers might be moving in next week.","au":"s_1395fa51ed","src":"Speak About the Photo・写真18"}]},{"a":["In this picture, I can see {{three people holding drinks together over a table}}.","The first thing I notice is {{two white cups of coffee in the middle}}. {{They}} are {{touching each other}}, and {{each one has a leaf design in the milk foam}}.","On the left side, {{a hand is holding a glass of iced coffee}}, and on the right side, {{another person is holding a cup from the side}}. In the background, {{there is a wooden table with black plates and spoons}}. {{Only their hands can be seen in the photo.}}","Judging from {{the way the cups are touching}}, it seems that {{they are making a toast}}. They might be {{celebrating something good, like a new job}}.","The whole scene looks {{friendly and relaxed}}. This picture reminds me of {{the café where my friends and I meet after exams}}, because {{we always order lattes with designs like these}}."],"au":"m_sp_18","keys":[{"id":"sphoto:18:making a toast","m":"making a toast","ja":"乾杯している","g":"make a toast","s":"Judging from the way the cups are touching, it seems that they are making a toast.","au":"s_1af661da5f","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:from the side","m":"from the side","ja":"横から","g":"","s":"On the left side, a hand is holding a glass of iced coffee, and on the right side, another person is holding a cup from the side.","au":"s_b3ed31d1ac","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:can be seen","m":"can be seen","ja":"見える（受け身）","g":"【名】 can be seen","s":"Only their hands can be seen in the photo.","au":"s_7ff71f6be7","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:designs like these","m":"designs like these","ja":"こういうデザイン","g":"【名】 like these","s":"This picture reminds me of the café where my friends and I meet after exams, because we always order lattes with designs like these.","au":"s_7c78080b37","src":"Speak About the Photo・写真19"}]},{"a":["In this picture, I can see {{a large group of cyclists in a road race}}.","The first thing I notice is {{a rider in a dark blue uniform at the front}}. {{He}} is {{leaning forward and pedaling hard}}, and {{he is wearing a blue helmet and sunglasses}}.","On the left side, {{more riders are following closely behind him}}, and on the right side, {{a long line of cyclists in colorful uniforms fills the road}}. In the background, {{green trees line the road}}. {{Next to the leader, another rider in black is also racing hard.}}","Judging from {{their serious faces}}, it seems that {{this is an important race}}. They might be {{getting close to the finish line}}.","The whole scene looks {{intense and exciting}}. This picture reminds me of {{watching a bicycle race on TV with my father}}, because {{the riders also moved together in a big group}}."],"au":"m_sp_19","keys":[{"id":"sphoto:19:leaning forward","m":"leaning forward","ja":"前かがみになって","g":"","s":"He is leaning forward and pedaling hard, and he is wearing a blue helmet and sunglasses.","au":"s_7000af59b8","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:following closely behind him","m":"following closely behind him","ja":"彼のすぐ後ろについている","g":"follow closely behind 【名】","s":"On the left side, more riders are following closely behind him, and on the right side, a long line of cyclists in colorful uniforms fills the road.","au":"s_4604fba70a","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:green trees line the road","m":"green trees line the road","ja":"緑の木々が道に沿って並ぶ","g":"【名】 line the road","s":"In the background, green trees line the road.","au":"s_b1eb878ebe","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:getting close to the finish line","m":"getting close to the finish line","ja":"ゴールに近づいている","g":"get close to 【名】","s":"They might be getting close to the finish line.","au":"s_a2a8844eeb","src":"Speak About the Photo・写真20"}]},{"a":["In this picture, I can see {{a runner getting ready at the start of a race}}.","The first thing I notice is {{his hand on the red track}}. {{He}} is {{holding a black baton}}, and {{his fingers are placed just behind the white line}}.","On the left side, {{his foot is pressed against a starting block}}, and on the right side, {{the white lines of the track stretch into the distance}}. In the background, {{the track is a little blurry}}. {{He is wearing black shorts and green shoes.}}","Judging from {{the baton in his hand}}, it seems that {{he is running the first part of a relay race}}. {{The other runners}} might be {{waiting for the starting signal}}.","The whole scene looks {{tense and powerful}}. This picture reminds me of {{my school sports day}}, because {{I was nervous before the relay race, too}}."],"au":"m_sp_20","keys":[{"id":"sphoto:20:pressed against a starting block","m":"pressed against a starting block","ja":"スターティングブロックに押し当てられている","g":"be pressed against 【名】","s":"On the left side, his foot is pressed against a starting block, and on the right side, the white lines of the track stretch into the distance.","au":"s_c5c37c18ba","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:just behind the white line","m":"just behind the white line","ja":"白線のすぐ後ろに","g":"","s":"He is holding a black baton, and his fingers are placed just behind the white line.","au":"s_1be2be8298","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:stretch into the distance","m":"stretch into the distance","ja":"遠くまで伸びている","g":"","s":"On the left side, his foot is pressed against a starting block, and on the right side, the white lines of the track stretch into the distance.","au":"s_c5c37c18ba","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:waiting for the starting signal","m":"waiting for the starting signal","ja":"スタートの合図を待っている","g":"wait for 【名】","s":"The other runners might be waiting for the starting signal.","au":"s_133247c2ef","src":"Speak About the Photo・写真21"}]},{"a":["In this picture, I can see {{an old clock tower next to a wide river}}.","The first thing I notice is {{the tall clock tower in the middle}}. {{It}} is {{standing above the other buildings}}, and {{it has a large clock face near the top}}.","On the left side, {{there is a huge stone building with many pointed towers}}, and on the right side, {{a long bridge with green railings crosses the water}}. In the background, {{white clouds are moving across the sky}}. {{A small red boat is moving on the river.}}","Judging from {{the famous tower}}, it seems that {{this is London}}. {{The people on the bridge}} might be {{taking photos of the view}}.","The whole scene looks {{historic and elegant}}. This picture reminds me of {{a history documentary I watched}}, because {{it showed this same tower and bridge}}."],"au":"m_sp_21","keys":[{"id":"sphoto:21:standing above the other buildings","m":"standing above the other buildings","ja":"ほかの建物の上にそびえている","g":"stand above 【名】","s":"It is standing above the other buildings, and it has a large clock face near the top.","au":"s_79268e9e81","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:clock face","m":"clock face","ja":"時計の文字盤","g":"","s":"It is standing above the other buildings, and it has a large clock face near the top.","au":"s_79268e9e81","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:crosses the water","m":"crosses the water","ja":"川を渡っている","g":"cross 【名】","s":"On the left side, there is a huge stone building with many pointed towers, and on the right side, a long bridge with green railings crosses the water.","au":"s_89a245b1f9","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:moving across the sky","m":"moving across the sky","ja":"空を流れていく","g":"move across 【名】","s":"In the background, white clouds are moving across the sky.","au":"s_b48c6f3dea","src":"Speak About the Photo・写真22"}]},{"a":["In this picture, I can see {{a long row of bookshelves in an old library}}.","The first thing I notice is {{the round light bulbs hanging from the ceiling}}. {{They}} are {{glowing softly}}, and {{they go all the way down the hallway}}.","On the left side, {{the shelves are full of old books with faded covers}}, and on the right side, {{the room gets darker}}. In the background, {{the shelves continue into a dim hallway}}. {{There is a little blue light at the very end.}}","Judging from {{the old books and the quiet atmosphere}}, it seems that {{this library has been there for a long time}}. {{Students}} might be {{reading quietly in another room}}.","The whole scene looks {{quiet and cozy}}. This picture reminds me of {{the old library at my university}}, because {{I often study there when I need to focus}}."],"au":"m_sp_22","keys":[{"id":"sphoto:22:glowing softly","m":"glowing softly","ja":"柔らかく光っている","g":"","s":"They are glowing softly, and they go all the way down the hallway.","au":"s_692ab4c2a3","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:full of old books with faded covers","m":"full of old books with faded covers","ja":"表紙の色あせた古い本でいっぱい","g":"","s":"On the left side, the shelves are full of old books with faded covers, and on the right side, the room gets darker.","au":"s_ac9ab291ea","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:continue into a dim hallway","m":"continue into a dim hallway","ja":"薄暗い廊下へと続く","g":"continue into 【名】","s":"In the background, the shelves continue into a dim hallway.","au":"s_3f992b96c2","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:at the very end","m":"at the very end","ja":"いちばん奥に","g":"","s":"There is a little blue light at the very end.","au":"s_51e7aed65f","src":"Speak About the Photo・写真23"}]},{"a":["In this picture, I can see {{a night sky full of stars above snowy mountains}}.","The first thing I notice is {{the Milky Way in the middle of the sky}}. {{It}} is {{glowing in pink and purple}}, and {{thousands of stars are shining around it}}.","On the left side, {{the sky is a deep purple}}, and on the right side, {{a shooting star is falling toward the mountains}}. In the background, {{white, snowy mountains rise above a dark forest}}. {{The forest at the bottom is almost completely black.}}","Judging from {{how clear the stars are}}, it seems that {{this place is far away from any city}}. {{Campers}} might be {{watching the sky from their tents}}.","The whole scene looks {{beautiful and peaceful}}. This picture reminds me of {{a night I spent in the mountains}}, because {{I saw more stars than ever before}}."],"au":"m_sp_23","keys":[{"id":"sphoto:23:full of stars","m":"full of stars","ja":"星でいっぱいの","g":"full of 【名】","s":"In this picture, I can see a night sky full of stars above snowy mountains.","au":"s_0bc6cb0677","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:a shooting star","m":"a shooting star","ja":"流れ星","g":"","s":"On the left side, the sky is a deep purple, and on the right side, a shooting star is falling toward the mountains.","au":"s_d9eb3f0deb","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:far away from any city","m":"far away from any city","ja":"どの街からも遠く離れた","g":"","s":"Judging from how clear the stars are, it seems that this place is far away from any city.","au":"s_9498b23cf4","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:more stars than ever before","m":"more stars than ever before","ja":"今までにないほどたくさんの星","g":"","s":"This picture reminds me of a night I spent in the mountains, because I saw more stars than ever before.","au":"s_1e8df3ae26","src":"Speak About the Photo・写真24"}]},{"a":["In this picture, I can see {{a huge city skyline in the evening}}.","The first thing I notice is {{a tall tower with a pointed top in the middle}}. {{It}} is {{standing above all the other buildings}}, and {{it looks very famous}}.","On the left side, {{there are countless brown and gray buildings}}, and on the right side, {{a tall glass skyscraper is reflecting the sky}}. In the background, {{a river and the ocean can be seen far away}}. {{The sky is light orange near the horizon.}}","Judging from {{the soft light}}, it seems that {{the sun is about to set}}. {{Tourists}} might be {{watching this view from an observation deck}}.","The whole scene looks {{grand and impressive}}. This picture reminds me of {{a movie set in New York}}, because {{it showed a skyline just like this}}."],"au":"m_sp_24","keys":[{"id":"sphoto:24:the sun is about to set","m":"the sun is about to set","ja":"日が今にも沈みそう","g":"be about to 【動原】","s":"Judging from the soft light, it seems that the sun is about to set.","au":"s_5dbb1330ac","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:reflecting the sky","m":"reflecting the sky","ja":"空を映している","g":"","s":"On the left side, there are countless brown and gray buildings, and on the right side, a tall glass skyscraper is reflecting the sky.","au":"s_ca01318673","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:observation deck","m":"observation deck","ja":"展望台","g":"","s":"Tourists might be watching this view from an observation deck.","au":"s_8d44112dbd","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:near the horizon","m":"near the horizon","ja":"地平線の近くで","g":"","s":"The sky is light orange near the horizon.","au":"s_91a1970ae1","src":"Speak About the Photo・写真25"}]},{"a":["In this picture, I can see {{a crowded city seen from a high building}}.","The first thing I notice is {{a long, straight street in the middle}}. {{It}} is {{shining in the golden sunlight}}, and {{it goes far into the distance}}.","On the left side, {{there are tall buildings with dark windows}}, and on the right side, {{a big, pale building stands close to the camera}}. In the background, {{skyscrapers with pointed tops block most of the sky}}. {{The sunlight is coming through a gap between the towers.}}","Judging from {{the low, orange sun}}, it seems that {{the photo was taken just before sunset}}. {{People on the street}} might be {{going home after work}}.","The whole scene looks {{busy and dramatic}}. This picture reminds me of {{a city scene in an animated film}}, because {{the light makes everything look like a painting}}."],"au":"m_sp_25","keys":[{"id":"sphoto:25:goes far into the distance","m":"goes far into the distance","ja":"遠くまで続いている","g":"","s":"It is shining in the golden sunlight, and it goes far into the distance.","au":"s_63888af7d9","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:stands close to the camera","m":"stands close to the camera","ja":"カメラのすぐ近くに立っている","g":"","s":"On the left side, there are tall buildings with dark windows, and on the right side, a big, pale building stands close to the camera.","au":"s_c1e4dee421","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:block most of the sky","m":"block most of the sky","ja":"空の大部分をさえぎる","g":"block 【名】","s":"In the background, skyscrapers with pointed tops block most of the sky.","au":"s_8b5d92f99e","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:look like a painting","m":"look like a painting","ja":"絵のように見える","g":"look like 【名】","s":"This picture reminds me of a city scene in an animated film, because the light makes everything look like a painting.","au":"s_f633b9f106","src":"Speak About the Photo・写真26"}]},{"a":["In this picture, I can see {{a city skyline across the water in the evening}}.","The first thing I notice is {{the tallest glass tower on the left}}. {{It}} is {{reaching high into the sky}}, and {{it has a thin, pointed top}}.","On the left side, {{there are several tall buildings close together}}, and on the right side, {{a small full moon is shining in the sky}}. In the background, {{the sky changes from blue to pink}}. {{In the front, the calm water is dark blue.}}","Judging from {{the moon and the pink sky}}, it seems that {{the sun has just set}}. {{People in the offices}} might be {{getting ready to go home}}.","The whole scene looks {{calm and beautiful}}. This picture reminds me of {{the view of Tokyo from Odaiba}}, because {{you can see tall buildings across the bay there}}."],"au":"m_sp_26","keys":[{"id":"sphoto:26:reaching high into the sky","m":"reaching high into the sky","ja":"空高くそびえている","g":"reach into 【名】","s":"It is reaching high into the sky, and it has a thin, pointed top.","au":"s_2d58fa1f7c","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:changes from blue to pink","m":"changes from blue to pink","ja":"青からピンクへ変わる","g":"change from A to B","s":"In the background, the sky changes from blue to pink.","au":"s_500cde9d13","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:the sun has just set","m":"the sun has just set","ja":"日が沈んだばかり","g":"","s":"Judging from the moon and the pink sky, it seems that the sun has just set.","au":"s_b6e327acb5","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:across the bay","m":"across the bay","ja":"湾の向こうに","g":"across 【名】","s":"This picture reminds me of the view of Tokyo from Odaiba, because you can see tall buildings across the bay there.","au":"s_e835645913","src":"Speak About the Photo・写真27"}]},{"a":["In this picture, I can see {{a group of people eating together at a long table outside}}.","The first thing I notice is {{a woman with blond hair and a black jacket on the right}}. {{She}} is {{eating and smiling}}, and {{she seems to be enjoying the conversation}}.","On the left side, {{a woman with light hair is sitting with her back to the camera}}, and on the right side, {{a man in a dark sweater is leaning toward the table}}. In the background, {{strings of lights hang from a wooden roof}}. {{The table is covered with plates of food and glasses of beer.}}","Judging from {{the drinks and their relaxed faces}}, it seems that {{it is a weekend evening}}. They might be {{celebrating a friend's birthday}}.","The whole scene looks {{lively and fun}}. This picture reminds me of {{a barbecue party at my friend's house}}, because {{everyone was talking and eating at the same time}}."],"au":"m_sp_27","keys":[{"id":"sphoto:27:seems to be enjoying the conversation","m":"seems to be enjoying the conversation","ja":"会話を楽しんでいるようだ","g":"seem to be 【~ing】","s":"She is eating and smiling, and she seems to be enjoying the conversation.","au":"s_0424b91bc2","src":"Speak About the Photo・写真28"},{"id":"sphoto:27:with her back to the camera","m":"with her back to the camera","ja":"カメラに背を向けて","g":"","s":"On the left side, a woman with light hair is sitting with her back to the camera, and on the right side, a man in a dark sweater is leaning toward the table.","au":"s_9ce9e183b5","src":"Speak About the Photo・写真28"},{"id":"sphoto:27:leaning toward the table","m":"leaning toward the table","ja":"テーブルの方へ身を乗り出して","g":"lean toward 【名】","s":"On the left side, a woman with light hair is sitting with her back to the camera, and on the right side, a man in a dark sweater is leaning toward the table.","au":"s_9ce9e183b5","src":"Speak About the Photo・写真28"},{"id":"sphoto:27:strings of lights","m":"strings of lights","ja":"ひも状の電飾","g":"","s":"In the background, strings of lights hang from a wooden roof.","au":"s_9a4bc88496","src":"Speak About the Photo・写真28"}]},{"a":["In this picture, I can see {{a man giving a presentation in a modern office}}.","The first thing I notice is {{the man standing on the left}}. {{He}} is {{holding a small remote and talking}}, and {{he is wearing a blue shirt and light shorts}}.","On the left side, {{a large screen is showing his slides}}, and on the right side, {{several coworkers are listening on a brown leather sofa and office chairs}}. In the background, {{there are brick walls, tall windows, and a whiteboard with drawings}}. {{The ceiling has long lights and wooden beams.}}","Judging from {{the words \"All Hands\" on the screen}}, it seems that {{this is a meeting for the whole company}}. They might be {{discussing their goals for the next month}}.","The whole scene looks {{casual but professional}}. This picture reminds me of {{a presentation I gave in my seminar}}, because {{I was also nervous but tried to look relaxed}}."],"au":"m_sp_28","keys":[{"id":"sphoto:28:giving a presentation","m":"giving a presentation","ja":"プレゼンをしている","g":"give a presentation","s":"In this picture, I can see a man giving a presentation in a modern office.","au":"s_65c12397ff","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:showing his slides","m":"showing his slides","ja":"彼のスライドを映している","g":"","s":"On the left side, a large screen is showing his slides, and on the right side, several coworkers are listening on a brown leather sofa and office chairs.","au":"s_270a9f49e5","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:casual but professional","m":"casual but professional","ja":"くだけているがきちんとしている","g":"","s":"The whole scene looks casual but professional.","au":"s_8003ea4f73","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:tried to look relaxed","m":"tried to look relaxed","ja":"落ち着いて見えるようにした","g":"try to look 【形】","s":"This picture reminds me of a presentation I gave in my seminar, because I was also nervous but tried to look relaxed.","au":"s_9152040eba","src":"Speak About the Photo・写真29"}]},{"a":["In this picture, I can see {{four young people sitting around a wooden table}}.","The first thing I notice is {{a young man with his hair tied up on the left}}. {{He}} is {{writing on a tablet}}, and {{he looks very focused}}.","On the left side, {{a woman in a light blue shirt is smiling at him}}, and on the right side, {{two women are laughing, and one is holding a paper cup}}. In the background, {{there is a white brick wall}}. {{A laptop is open on the table between them.}}","Judging from {{the tablet and the laptop}}, it seems that {{they are university students}}. They might be {{working on a group project}}.","The whole scene looks {{relaxed and friendly}}. This picture reminds me of {{my seminar group}}, because {{we also meet at a café to discuss our research}}."],"au":"m_sp_29","keys":[{"id":"sphoto:29:with his hair tied up","m":"with his hair tied up","ja":"髪を結んだ","g":"","s":"The first thing I notice is a young man with his hair tied up on the left.","au":"s_7abb511a59","src":"Speak About the Photo・写真30"},{"id":"sphoto:29:looks very focused","m":"looks very focused","ja":"とても集中しているように見える","g":"","s":"He is writing on a tablet, and he looks very focused.","au":"s_479d8932eb","src":"Speak About the Photo・写真30"},{"id":"sphoto:29:working on a group project","m":"working on a group project","ja":"グループ課題に取り組んでいる","g":"","s":"They might be working on a group project.","au":"s_ebbe8b20e7","src":"Speak About the Photo・写真30"},{"id":"sphoto:29:discuss our research","m":"discuss our research","ja":"研究について話し合う","g":"","s":"This picture reminds me of my seminar group, because we also meet at a café to discuss our research.","au":"s_616e67b655","src":"Speak About the Photo・写真30"}]},{"a":["In this picture, I can see {{a close-up of two people using a laptop}}.","The first thing I notice is {{a hand pointing at the screen}}. {{The person}} is {{wearing a black smartwatch}}, and {{they seem to be explaining something}}.","On the left side, {{the silver laptop is open on a dark table}}, and on the right side, {{another person's hand is resting on the keyboard}}. In the background, {{everything is blurry and gray}}. {{We cannot see their faces at all.}}","Judging from {{the pointing finger}}, it seems that {{one person is teaching the other}}. They might be {{checking a document together}}.","The whole scene looks {{simple and focused}}. This picture reminds me of {{the time my friend taught me how to use animation software}}, because {{he also pointed at the screen to show me each step}}."],"au":"m_sp_30","keys":[{"id":"sphoto:30:a close-up of","m":"a close-up of","ja":"〜のクローズアップ","g":"a close-up of 【名】","s":"In this picture, I can see a close-up of two people using a laptop.","au":"s_2d07c2d06c","src":"Speak About the Photo・写真31"},{"id":"sphoto:30:resting on the keyboard","m":"resting on the keyboard","j  the Photo・写真32"},{"id":"sphoto:31:on purpose","m":"on purpose","ja":"わざと・意図的に","g":"","s":"Judging from the careful shape of the spiral, it seems that people made it on purpose.","au":"s_70c5ee3ff8","src":"Speak About the Photo・写真32"},{"id":"sphoto:31:for fun","m":"for fun","ja":"楽しみで","g":"","s":"Visitors might be walking along the spiral for fun.","au":"s_4eb55c1105","src":"Speak About the Photo・写真32"}]},{"a":["In this picture, I can see {{a close-up of a small black dog}}.","The first thing I notice is {{its big, round eyes}}. {{It}} is {{looking to the side}}, and {{its face is covered with deep wrinkles}}.","On the left side, {{one of its soft ears is sticking out}}, and on the right side, {{its other ear is hanging down}}. In the background, {{there is a bright yellow wall}}. {{The dog is also wearing a gray knitted sweater.}}","Judging from {{its worried face}}, it seems that {{it is not sure about something}}. {{Its owner}} might be {{holding a treat just outside the photo}}.","The whole scene looks {{funny and cute}}. This picture reminds me of {{my neighbor's pug}}, because {{it always makes the same worried face when it wants a snack}}."],"au":"m_sp_32","keys":[{"id":"sphoto:32:looking to the side","m":"looking to the side","ja":"横を見ている","g":"","s":"It is looking to the side, and its face is covered with deep wrinkles.","au":"s_ee55553391","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:covered with deep wrinkles","m":"covered with deep wrinkles","ja":"深いしわに覆われた","g":"","s":"It is looking to the side, and its face is covered with deep wrinkles.","au":"s_ee55553391","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:sticking out","m":"sticking out","ja":"突き出ている","g":"stick out","s":"On the left side, one of its soft ears is sticking out, and on the right side, its other ear is hanging down.","au":"s_cf7727b117","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:just outside the photo","m":"just outside the photo","ja":"写真のすぐ外で","g":"","s":"Its owner might be holding a treat just outside the photo.","au":"s_36202d8ee9","src":"Speak About the Photo・写真33"}]},{"a":["In this picture, I can see {{a black and white cat looking over a bamboo railing}}.","The first thing I notice is {{its green eyes}}. {{It}} is {{looking straight at the camera}}, and {{it has a small pink nose}}.","On the left side, {{one white paw is resting on the railing}}, and on the right side, {{its other paw is hanging over the edge}}. In the background, {{there is a plain green wall}}. {{The top of its head is black, but its face and chest are white.}}","Judging from {{its relaxed paws}}, it seems that {{it feels safe and comfortable}}. {{The cat}} might be {{waiting for someone to play with it}}.","The whole scene looks {{calm and adorable}}. This picture reminds me of {{my grandparents' cat}}, because {{it also likes to watch people from high places}}."],"au":"m_sp_33","keys":[{"id":"sphoto:33:looking straight at the camera","m":"looking straight at the camera","ja":"カメラをまっすぐ見ている","g":"","s":"It is looking straight at the camera, and it has a small pink nose.","au":"s_51ef512c23","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:hanging over the edge","m":"hanging over the edge","ja":"縁から垂れている","g":"","s":"On the left side, one white paw is resting on the railing, and on the right side, its other paw is hanging over the edge.","au":"s_1eadba0086","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:feels safe and comfortable","m":"feels safe and comfortable","ja":"安心してくつろいでいる","g":"","s":"Judging from its relaxed paws, it seems that it feels safe and comfortable.","au":"s_bd5df2a3e1","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:from high places","m":"from high places","ja":"高いところから","g":"","s":"This picture reminds me of my grandparents' cat, because it also likes to watch people from high places.","au":"s_072dadf17b","src":"Speak About the Photo・写真34"}]},{"a":["In this picture, I can see {{the inside of a large, bright café}}. re placed around it}}.","On the left side, {{white curtains are hanging from the roof}}, and on the right side, {{more tables stand under a large awning}}. In the background, {{green mountains rise from the calm water}}. {{The sun is lighting up the edge of the roof.}}","Judging from {{the empty seats and the neatly set tables}}, it seems that {{the restaurant is getting ready for dinner}}. {{Guests}} might be {{arriving soon to enjoy the sunset}}.","The whole scene looks {{elegant and peaceful}}. This picture reminds me of {{a lakeside restaurant I want to visit someday}}, because {{eating with a view like this must be wonderful}}."],"au":"m_sp_35","keys":[{"id":"sphoto:35:placed around it","m":"placed around it","ja":"その周りに置かれて","g":"","s":"It is set with plates and glasses, and light blue chairs are placed around it.","au":"s_1bc0206e36","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:under a large awning","m":"under a large awning","ja":"大きな日よけの下に","g":"","s":"On the left side, white curtains are hanging from the roof, and on the right side, more tables stand under a large awning.","au":"s_130a180e17","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:rise from the calm water","m":"rise from the calm water","ja":"静かな水面からそびえる","g":"","s":"In the background, green mountains rise from the calm water.","au":"s_2c350e265f","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:must be wonderful","m":"must be wonderful","ja":"きっとすばらしいだろう","g":"must be 【形】","s":"This picture reminds me of a lakeside restaurant I want to visit someday, because eating with a view like this must be wonderful.","au":"s_93bafb0fff","src":"Speak About the Photo・写真36"}]},{"a":["In this picture, I can see {{a huge room full of people using computers}}.","The first thing I notice is {{a man in a white chair in the front}}. {{He}} is {{stretching his arms behind his head}}, and {{he looks a little tired}}.","On the left side, {{rows of people are sitting at long white desks}}, and on the right side, {{black desks with laptops stand in a line}}. In the background, {{many more people are working under bright ceiling lights}}. {{There are backpacks on the floor next to the chairs.}}","Judging from {{the backpacks and the laptops}}, it seems that {{this is a large event for programmers or students}}. They might be {{competing in a coding contest}}.","The whole scene looks {{busy and serious}}. This picture reminds me of {{the exam hall at my university}}, because {{everyone there was silent and concentrating hard}}."],"au":"m_sp_36","keys":[{"id":"sphoto:36:stretching his arms behind his head","m":"stretching his arms behind his head","ja":"頭の後ろで腕を伸ばしている","g":"","s":"He is stretching his arms behind his head, and he looks a little tired.","au":"s_6eb44ce088","src":"Speak About the Photo・写真37"},{"id":"sphoto:36:stand in a line","m":"stand in a line","ja":"一列に並んでいる","g":"","s":"On the left side, rows of people are sitting at long white desks, and on the right side, black desks with laptops stand in a line.","au":"s_2a5b7519e3","src":"Speak About the Photo・写真37"},{"id":"sphoto:36:competing in a coding contest","m":"competing in a coding contest","ja":"プログラミング大会に参加している","g":"compete in 【名】","s":"They might be competing in a coding contest.","au":"s_aa1f4b2fc9","src":"Speak About the Photo・写真37"},{"id":"sphoto:36:concentrating hard","m":"concentrating hard","ja":"必死に集中している","g":"","s":"This picture reminds me of the exam hall at my university, because everyone there was silent and concentrating hard.","au":"s_8e95affc1a","src":"Speak About the Photo・写真37"}]},{"a":["In this picture, I can see {{a business meeting at a wooden table}}.","The first thing I notice is {{a man in a red plaid shirt on the left}}. {{He}} is {{moving his hands as he speaks}}, and {{he seems to be explaining an idea}}.","On the left side, {{a woman with long dark hair is listening carefully}}, and on the right side, {{an open laptop is showing some colorful charts}}. In the background, {  seat}}. {{The passenger}} might be {{traveling to another country for vacation}}.","The whole scene looks {{bright and exciting}}. This picture reminds me of {{my first flight abroad}}, because {{I took a photo of the wing just like this}}."],"au":"m_sp_38","keys":[{"id":"sphoto:38:above the clouds","m":"above the clouds","ja":"雲の上を","g":"","s":"In this picture, I can see the wing of an airplane flying above the clouds.","au":"s_36e83be544","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:stretching across the bottom of the picture","m":"stretching across the bottom of the picture","ja":"写真の下を横切って伸びている","g":"stretch across 【名】","s":"It is stretching across the bottom of the picture, and its tip is pointing up toward the sky.","au":"s_977e98ab87","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:pointing up toward the sky","m":"pointing up toward the sky","ja":"空に向かって上を向いている","g":"","s":"It is stretching across the bottom of the picture, and its tip is pointing up toward the sky.","au":"s_977e98ab87","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:from a window seat","m":"from a window seat","ja":"窓側の席から","g":"","s":"Judging from the angle of the photo, it seems that it was taken from a window seat.","au":"s_68e4197f09","src":"Speak About the Photo・写真39"}]},{"a":["In this picture, I can see {{a large bus parked in an open field in the evening}}.","The first thing I notice is {{the bus in the middle}}. {{It}} is {{shining its headlights}}, and {{small orange lights are glowing along the bottom}}.","On the left side, {{there is a wide, dark field with no buildings}}, and on the right side, {{snowy mountains stand far away}}. In the background, {{the sky is cloudy and gray-blue}}. {{There are some patches of snow on the ground in the front.}}","Judging from {{the snow and the dark sky}}, it seems that {{it is a cold winter evening}}. {{The passengers}} might be {{waiting inside before a night tour}}.","The whole scene looks {{cold and quiet}}. This picture reminds me of {{a ski trip I took by bus}}, because {{we also left very early when it was still dark}}."],"au":"m_sp_39","keys":[{"id":"sphoto:39:parked in an open field","m":"parked in an open field","ja":"広い野原に停まっている","g":"","s":"In this picture, I can see a large bus parked in an open field in the evening.","au":"s_58e652b476","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:glowing along the bottom","m":"glowing along the bottom","ja":"下の方に沿って光っている","g":"","s":"It is shining its headlights, and small orange lights are glowing along the bottom.","au":"s_1b4e8d534d","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:patches of snow","m":"patches of snow","ja":"まだらに残った雪","g":"","s":"There are some patches of snow on the ground in the front.","au":"s_77f3ccab56","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:when it was still dark","m":"when it was still dark","ja":"まだ暗いうちに","g":"","s":"This picture reminds me of a ski trip I took by bus, because we also left very early when it was still dark.","au":"s_51a138a2dd","src":"Speak About the Photo・写真40"}]},{"a":["In this picture, I can see {{the front of a wooden boat on a calm lake}}.","The first thing I notice is {{the old wooden boat at the bottom of the picture}}. {{It}} is {{pointing toward the mountains}}, and {{its wooden boards look smooth and shiny}}.","On the left side, {{rocky cliffs are covered with green trees}}, and on the right side, {{a thick, dark forest comes down to the water}}. In the background, {{huge gray mountains rise under a white sky}}. {{The green water reflects the trees.}}","Judging from {{the angle of the photo}}, it seems that {{the photographer is sitting in the boat}}. {{He or she}} might be {{rowing slowly across the lake}}.","The whole scene looks {{fresh and calm}}. This picture reminds me of {{a travel video about the Alps}}, because {{it showed the same kind of green lake and gray mountains}}."],"au":"m_sp_40","keys":[{"id":"sphoto:40:pointing toward the mountains","m":"pointing toward the mountains","ja":"山の方を向いている","g":"point toward 【名】","s":"It is pointing toward the mountains, and its wooden boards look smooth and shiny.","au":"s_af923a669c","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:comes down to the water","m":"comes down to the water","ja":"水辺まで下りてくる","g":"","s":"On the left side, rocky cliffs are covered with green trees, and on the right side, a thick, dark forest comes down to the water.","au":"s_8410d93302","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:reflects the trees","m":"reflects the trees","ja":"木々を映す","g":"","s":"The green water reflects the trees.","au":"s_be3a6562d9","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:rowing slowly across the lake","m":"rowing slowly across the lake","ja":"ゆっくりこいで湖を渡っている","g":"","s":"He or she might be rowing slowly across the lake.","au":"s_b1a1bc5ee2","src":"Speak About the Photo・写真41"}]},{"a":["In this picture, I can see {{a field of bright yellow and orange flowers}}.","The first thing I notice is {{the large flowers in the front}}. {{They}} are {{facing the sun}}, and {{their petals look soft and thin}}.","On the left side, {{the clear blue sky fills most of the space}}, and on the right side, {{the flowers are growing thickly together}}. In the background, {{some small white flowers and thin green stems are out of focus}}. {{The sunlight makes the petals almost glow.}}","Judging from {{the strong sunlight and the blue sky}}, it seems that {{it is a warm spring day}}. {{Bees}} might be {{flying around the flowers}}.","The whole scene looks {{bright and cheerful}}. This picture reminds me of {{a flower park I visited with my mother}}, because {{the whole hill was covered with yellow flowers}}."],"au":"m_sp_41","keys":[{"id":"sphoto:41:facing the sun","m":"facing the sun","ja":"太陽の方を向いている","g":"face 【名】","s":"They are facing the sun, and their petals look soft and thin.","au":"s_7ccc68154f","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:growing thickly together","m":"growing thickly together","ja":"びっしりと生えている","g":"","s":"On the left side, the clear blue sky fills most of the space, and on the right side, the flowers are growing thickly together.","au":"s_f4c09d5bbd","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:out of focus","m":"out of focus","ja":"ピントが合っていない","g":"","s":"In the background, some small white flowers and thin green stems are out of focus.","au":"s_932e9e0d3d","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:makes the petals almost glow","m":"makes the petals almost glow","ja":"花びらをまるで光っているように見せる","g":"make 【名】 glow","s":"The sunlight makes the petals almost glow.","au":"s_89e05241e8","src":"Speak About the Photo・写真42"}]},{"a":["In this picture, I can see {{a sandy beach at sunset}}.","The first thing I notice is {{the small white waves in the front}}. {{They}} are {{washing onto the shore}}, and {{the wet sand is shining in the light}}.","On the left side, {{there are some palm trees on a small piece of land}}, and on the right side, {{the turquoise ocean stretches far away}}. In the background, {{the sun is going down near the horizon}}. {{Pink and orange clouds are floating in the sky.}}","Judging from {{the empty beach}}, it seems that {{most people have already gone home}}. {{A couple}} might be {{walking along the beach somewhere nearby}}.","The whole scene looks {{peaceful and romantic}}. This picture reminds me of {{a beach in Okinawa}}, because {{the water there is also turquoise and very clear}}."],"au":"m_sp_42","keys":[{"id":"sphoto:42:washing onto the shore","m":"washing onto the shore","ja":"岸に打ち寄せている","g":"wash onto 【名】","s":"They are washing onto the shore, and the wet sand is shining in the light.","au":"s_3cec4d7c0c","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:going down near the horizon","m":"going down near the horizon","ja":"水平線近くに沈んでいく","g":"","s":"In the background, the sun is going down near the horizon.","au":"s_9394c040bb","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:have already gone home","m":"have already gone home","ja":"もう帰ってしまった","g":"","s":"Judging from the empty beach, it seems that most people have already gone home.","au":"s_70a8389799","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:somewhere nearby","m":"somewhere nearby","ja":"近くのどこかで","g":"","s":"A couple might be walking along the beach somewhere nearby.","au":"s_32e3ba25e1","src":"Speak About the Photo・写真43"}]},{"a":["In this picture, I can see {{a narrow stone street in an old Japanese town}}.","The first thing I notice is {{two people in kimonos in the middle}}. {{They}} are {{walking slowly along the street}}, and {{they are standing close together}}.","On the left side, {{there are traditional wooden houses with dark roofs}}, and on the right side, {{more old buildings have wooden walls and windows}}. In the background, {{a tall pagoda rises against the evening sky}}. {{Behind the houses, there is a bare tree with no leaves.}}","Judging from {{the pagoda and the kimonos}}, it seems that {{this is Kyoto}}. They might be {{enjoying a walk in rented kimonos}}.","The whole scene looks {{traditional and calm}}. This picture reminds me of {{my school trip to Kyoto}}, because {{we walked along a street just like this one}}."],"au":"m_sp_43","keys":[{"id":"sphoto:43:rises against the evening sky","m":"rises against the evening sky","ja":"夕空を背にそびえる","g":"rise against 【名】","s":"In the background, a tall pagoda rises against the evening sky.","au":"s_2233e2ca36","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:a bare tree with no leaves","m":"a bare tree with no leaves","ja":"葉のない裸の木","g":"","s":"Behind the houses, there is a bare tree with no leaves.","au":"s_9875f15222","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:in rented kimonos","m":"in rented kimonos","ja":"レンタル着物で","g":"","s":"They might be enjoying a walk in rented kimonos.","au":"s_5ed27cf77f","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:just like this one","m"  stone building at dusk}}.","The first thing I notice is {{the round arches on the left}}. {{They}} are {{lit up with warm orange light}}, and {{they are arranged in several levels}}.","On the left side, {{the tallest part of the wall is still standing}}, and on the right side, {{part of the building is broken and lower}}. In the background, {{the sky is turning dark blue with soft clouds}}. {{In the front, there is a wide, empty path.}}","Judging from {{the empty path and the lights}}, it seems that {{the site has closed for the day}}. {{Tourists}} might be {{having dinner at restaurants nearby}}.","The whole scene looks {{historic and impressive}}. This picture reminds me of {{my world history textbook}}, because {{it had a photo of this building in the chapter about ancient Rome}}."],"au":"m_sp_46","keys":[{"id":"sphoto:46:lit up with warm orange light","m":"lit up with warm orange light","ja":"暖かいオレンジの光で照らされた","g":"be lit up with 【名】","s":"They are lit up with warm orange light, and they are arranged in several levels.","au":"s_ec16afcfbf","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:arranged in several levels","m":"arranged in several levels","ja":"何層にも並んでいる","g":"","s":"They are lit up with warm orange light, and they are arranged in several levels.","au":"s_ec16afcfbf","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:has closed for the day","m":"has closed for the day","ja":"その日の営業を終えた","g":"","s":"Judging from the empty path and the lights, it seems that the site has closed for the day.","au":"s_50f471e148","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:in the chapter about","m":"in the chapter about","ja":"〜の章で","g":"","s":"This picture reminds me of my world history textbook, because it had a photo of this building in the chapter about ancient Rome.","au":"s_f790d41a2c","src":"Speak About the Photo・写真47"}]},{"a":["In this picture, I can see {{a tall iron tower next to a river at sunset}}.","The first thing I notice is {{the tower on the right}}. {{It}} is {{rising high above the trees}}, and {{its shape gets thinner toward the top}}.","On the left side, {{the cloudy sky is dark gray and purple}}, and on the right side, {{long white boats are parked along the riverbank}}. In the background, {{a bridge crosses the river}}. {{The water in the front is calm and reflects the pink sky.}}","Judging from {{the famous tower}}, it seems that {{this is Paris}}. {{People on the boats}} might be {{enjoying a dinner cruise}}.","The whole scene looks {{romantic and calm}}. This picture reminds me of {{a French movie I watched in English class}}, because {{it started with this same view of the river}}."],"au":"m_sp_47","keys":[{"id":"sphoto:47:rising high above the trees","m":"rising high above the trees","ja":"木々の上に高くそびえる","g":"","s":"It is rising high above the trees, and its shape gets thinner toward the top.","au":"s_b296961413","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:gets thinner toward the top","m":"gets thinner toward the top","ja":"上に行くほど細くなる","g":"","s":"It is rising high above the trees, and its shape gets thinner toward the top.","au":"s_b296961413","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:parked along the riverbank","m":"parked along the riverbank","ja":"川岸に沿って停まっている","g":"","s":"On the left side, the cloudy sky is dark gray and purple, and on the right side, long white boats are parked along the riverbank.","au":"s_5042d0ab58","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:a dinner cruise","m":"a dinner cruise","ja":"ディナークルーズ","g":"","s":"People on the boats might be enjoying a dinner cruise.","au":"s_f243858bfc","src":"Speak About the Photo・写真48"}]},{"a":["In this picture, I can see {{an old stone bridge over a canal}}.","The first thing I notice is {{the white bridge in the middle}}. {{It}} is {{crowded with tourists}}, and {{it has a big arch in the center}}.","On the left side, {{there are old buildings with small windows}}, and on the right side, {{a water bus is stopping at the dock}}. In the background, {{colorful buildings are lit by the evening sun}}. {{The sky is light blue with a few clouds.}}","Judging from {{the canal and the boats}}, it seems that {{this is Venice}}. {{The tourists}} might be {{taking pictures of the canal}}.","The whole scene looks {{historic and lively}}. This picture reminds me of {{an animated film set in a city on the water}}, because {{its buildings and bridges looked just like these}}."],"au":"m_sp_48","keys":[{"id":"sphoto:48:crowded with tourists","m":"crowded with tourists","ja":"観光客で混み合った","g":"be crowded with 【名】","s":"It is crowded with tourists, and it has a big arch in the center.","au":"s_d8624213a1","src":"Speak About the Photo・写真49"},{"id":"sphoto:48:stopping at the dock","m":"stopping at the dock","ja":"船着き場に止まっている","g":"","s":"On the left side, there are old buildings with small windows, and on the right side, a water bus is stopping at the dock.","au":"s_ff0db898ac","src":"Speak About the Photo・写真49"},{"id":"sphoto:48:lit by the evening sun","m":"lit by the evening sun","ja":"夕日に照らされた","g":"","s":"In the background, colorful buildings are lit by the evening sun.","au":"s_7b37bba0ca","src":"Speak About the Photo・写真49"},{"id":"sphoto:48:set in a city on the water","m":"set in a city on the water","ja":"水の都を舞台にした","g":"set in 【場所】","s":"This picture reminds me of an animated film set in a city on the water, because its buildings and bridges looked just like these.","au":"s_9ec684366c","src":"Speak About the Photo・写真49"}]},{"a":["In this picture, I can see {{a beautiful bridge over a river at night}}.","The first thing I notice is {{the golden lamps on the left}}. {{They}} are {{shining brightly}}, and {{they line both sides of the bridge}}.","On the left side, {{there is a dark statue under the biggest lamp}}, and on the right side, {{a tall column with a gold statue stands at the end of the bridge}}. In the background, {{the sky is purple and pink}}. {{The lights are reflecting on the water.}}","Judging from {{the old-fashioned design}}, it seems that {{the bridge is more than a hundred years old}}. {{Couples}} might be {{walking across it after dinner}}.","The whole scene looks {{elegant and romantic}}. This picture reminds me of {{a night walk I took in Yokohama}}, because {{the lights there also reflected on the water}}."],"au":"m_sp_49","keys":[{"id":"sphoto:49:line both sides of the bridge","m":"line both sides of the bridge","ja":"橋の両側に並ぶ","g":"line both sides of 【名】","s":"They are shining brightly, and they line both sides of the bridge.","au":"s_bdad92168a","src":"Speak About the Photo・写真50"},{"id":"sphoto:49:at the end of the bridge","m":"at the end of the bridge","ja":"橋のたもとに","g":"","s":"On the left side, there is a dark statue under the biggest lamp, and on the right side, a tall column with a gold statue stands at the end of the bridge.","au":"s_f20786bea4","src":"Speak About the Photo・写真50"},{"id":"sphoto:49:reflecting on the water","m":"reflecting on the water","ja":"水面に映っている","g":"reflect on 【名】","s":"The lights are reflecting on the water.","au":"s_eb2280cb44","src":"Speak About the Photo・写真50"},{"id":"sphoto:49:more than a hundred years old","m":"more than a hundred years old","ja":"100年以上前のもの","g":"","s":"Judging from the old-fashioned design, it seems that the bridge is more than a hundred years old.","au":"s_8ff81c2012","src":"Speak About the Photo・写真50"}]},{"a":["In this picture, I can see {{a calm bay with many small islands}}.","The first thing I notice is {{a small rocky island on the left}}. {{It}} is {{covered with green plants}}, and {{its sides are very steep}}.","On the left side, {{more green islands rise out of the water}}, and on the right side, {{some leaves from a tree are in the front}}. In the background, {{tall, steep rocks stand in a long line}}. {{Many white boats are sailing between the islands.}}","Judging from {{the number of boats}}, it seems that {{this is a popular tourist spot}}. {{Tourists}} might be {{taking a cruise around the bay}}.","The whole scene looks {{peaceful and breathtaking}}. This picture reminds me of {{Matsushima in Miyagi}}, because {{it also has many small islands in a calm bay}}."],"au":"m_sp_50","keys":[{"id":"sphoto:50:rise out of the water","m":"rise out of the water","ja":"水面から突き出る","g":"rise out of 【名】","s":"On the left side, more green islands rise out of the water, and on the right side, some leaves from a tree are in the front.","au":"s_2ff312bc28","src":"Speak About the Photo・写真51"},{"id":"sphoto:50:stand in a long line","m":"stand in a long line","ja":"長く連なっている","g":"","s":"In the background, tall, steep rocks stand in a long line.","au":"s_0fa2fd8160","src":"Speak About the Photo・写真51"},{"id":"sphoto:50:a popular tourist spot","m":"a popular tourist spot","ja":"人気の観光地","g":"","s":"Judging from the number of boats, it seems that this is a popular tourist spot.","au":"s_9d4cfd78af","src":"Speak About the Photo・写真51"},{"id":"sphoto:50:breathtaking","m":"breathtaking","ja":"息をのむほど美しい","g":"","s":"The whole scene looks peaceful and breathtaking.","au":"s_f7534e53d7","src":"Speak About the Photo・写真51"}]},{"a":["In this picture, I can see {{a busy city intersection at night}}.","The first thing I notice is {{a tall, round building in the middle}}. {{It}} is {{covered with lights}}, and {{it has a big sign at the top}}.","On the left side, {{huge billboards with photos of people cover the buildings}}, and on the right side, {{a crowd of people is waiting at the crosswalk}}. In the background, {{the night sky is very dark}}. {{In the front, cars are driving through the intersection.}}","Judging from {{the Japanese signs}}, it seems that {{this is Shibuya in Tokyo}}. {{The people}} might be {{meeting friends for dinner}}.","The whole scene looks {{exciting and crowded}}. This picture reminds me of {{the first time I went to Shibuya}}, because {{I was surprised by how many people crossed the street at once}}."],"au":"m_sp_51","keys":[{"id" rban Gardens","ja":"多くの大都市で、人々は空き地をコミュニティ菜園に変えている。こうした菜園があれば、小さなアパートに住んでいても住民が自分の野菜を育てられる。近所の人が集まって一緒に作業する場にもなる。植物と過ごす時間はストレスを下げ、心の健康をよくすることが研究で分かっている。さらに、都市の菜園は暑い夏に周りの地域を涼しくする助けにもなる。その結果、こうした取り組みを支援する市役所が増えている。","g":[["residents","住民","B2"],["neighbors","近所の人","A1"],["mental health","心の健康","B1"],["surrounding","周りの","B2"],["supporting","支援している","A2"]],"au":"lit_r_10","sents":["In many large cities, people are turning empty spaces into community gardens.","These gardens allow residents to grow their own vegetables, even if they live in small apartments.","They also provide a place where neighbors can meet and work together.","Research shows that spending time with plants can lower stress and improve mental health.","In addition, urban gardens help cool the surrounding area during hot summers.","As a result, more city governments are supporting these projects."],"segs":["In many large cities, people are turning empty spaces into community gardens. These gar",["dens",1,""]," allow resi",["dents",1,"住民"]," to gr",["ow",1,""]," their o",["wn",1,""]," vegetables, ev",["en",1,""]," if th",["ey",1,""]," live i",["n",1,""]," small apart",["ments",1,""],". They al",["so",2,""]," provide a place wh",["ere",2,""]," neighbors c",["an",2,""]," meet a",["nd",2,""]," work toge",["ther",2,""],". Research sh",["ows",3,""]," that spen",["ding",3,""]," time wi",["th",3,""]," plants c",["an",3,""]," lower str",["ess",3,""]," and imp",["rove",3,""]," mental hea",["lth",3,"心の健康"],". In addi",["tion",4,""],", urban gar",["dens",4,""]," help co",["ol",4,""]," the surro",["unding",4,"周りの"]," area dur",["ing",4,""]," hot sum",["mers",4,""],". As a result, more city governments are supporting these projects."],"lv":"B1","cnt":{"B2":4,"C1":0,"C2":0,"X":0},"hw":[["residents","B2"],["lower","B2"],["urban","B2"],["surrounding","B2"]]},{"t":"The Invention of Paper","ja":"紙は約2000年前に中国で発明された。それ以前、人々は竹・絹・動物の皮などに文字を書いていたが、それらは重いか高価だった。新しい素材は軽くて安く、植物の繊維から簡単につくれた。その後の数世紀で、その技術は交易路に沿って中東やヨーロッパに広まった。紙のおかげ ety.","Because of this, new drugs must be compared with a placebo in carefully controlled trials.","Only if the drug performs significantly better can researchers conclude that it is effective.","The placebo effect reminds us that the mind and body are more closely connected than we often assume."],"segs":["In medical research, a placebo is a treatment that contains no active ingredients, such as a sugar pill. Surprisingly, pati",["ents",1,""]," who rec",["eive",1,""]," a pla",["cebo",1,""]," often rep",["ort",1,""]," genuine improv",["ements",1,""]," in th",["eir",1,""]," symptoms. Th",["is",2,""]," placebo eff",["ect",2,""]," appears t",["o",2,""]," depend lar",["gely",2,""]," on expec",["tation",2,""],": when peo",["ple",2,""]," believe a treatment wi",["ll",2,""]," work, t",["he",2,""]," brain m",["ay",2,""]," release chem",["icals",2,""]," that red",["uce",2,""]," pain o",["r",2,""]," anxiety. Bec",["ause",3,""]," of th",["is",3,""],", new dr",["ugs",3,""]," must b",["e",3,""]," compared wi",["th",3,""]," a pla",["cebo",3,""]," in care",["fully",3,""]," controlled tri",["als",3,""],". Only i",["f",4,""]," the dr",["ug",4,""]," performs signif",["icantly",4,"有意に・大きく"]," better c",["an",4,""]," researchers conc",["lude",4,""]," that i",["t",4,""]," is effe",["ctive",4,""],". The placebo effect reminds us that the mind and body are more closely connected than we often assume."],"lv":"B2","cnt":{"B2":9,"C1":0,"C2":0,"X":1},"hw":[["placebo",""],["pill","B2"],["genuine","B2"],["largely","B2"],["expectation","B2"],["anxiety","B2"],["trials","B2"],["significantly","B2"],["closely","B2"],["assume","B2"]]},{"t":"Coral Bleaching","ja":"サンゴ礁は海底の1%未満しか占めていないが、海の生物種の約4分の1を支えている。サンゴの鮮やかな色は、組織の中に住んで栄養を与える小さな藻類から来ている。水温が上がりすぎると、サンゴはこの藻類を追い出して白くなる。これを白化という。白化したサンゴは死んではいないが、ひどく弱っていて、高温が続けば飢えて死ぬこともある。海水温の上昇とともに、白化はより頻繁に、より広い範囲で起きるようになった。排出量を急いで減らさなければ、世界のサンゴ礁の多くが今世紀中に消えるかもしれないと科学者は警告している。","g":[["marine","海の","C1"],["tissues","組織","B2"],["expel","追い出す",""],["persist","続く","C1"],[" tarve","B2"],["frequent","B2"],["widespread","B2"],["rapid","B2"],["emissions","B2"]]},{"t":"Confirmation Bias","ja":"確証バイアスとは、自分がすでに信じていることを支える情報に気づき、覚えやすい傾向のことだ。例えば、ある食事法が効くと思っている人は、成功談はすべて思い出すが、失敗はすぐに忘れてしまう。このバイアスは普通の人だけでなく、科学者や裁判官などの専門家にも影響する。ネット上では、以前「いいね」したものに似た内容を見せるアルゴリズムによって強まることがある。時間がたつと、人は反対の意見を理解しなくなる一方で、自分の考えにより自信を持つようになりうる。実用的な対策の1つは、最終的な意見を決める前に、自分の思い込みに異を唱える情報源をわざと探すことだ。","g":[["tendency","傾向","B2"],["reinforced","強化される","B2"],["algorithms","アルゴリズム",""],["remedy","対策・解決策","C1"],["deliberately","わざと・意図的に","B2"]],"au":"lit_r_28","sents":["Confirmation bias is the tendency to notice and remember information that supports what we already believe.","For example, a person who thinks a certain diet works will recall every success story but quickly forget the failures.","This bias affects not only ordinary people but also experts, including scientists and judges.","Online, it can be reinforced by algorithms that show users content similar to what they have liked before.","Over time, people may become more confident in their views while understanding opposing arguments less.","One practical remedy is to deliberately seek out sources that challenge our assumptions before forming a final opinion."],"segs":["Confirmation bias is the tendency to notice and remember information that supports what we already believe. For exa",["mple",1,""],", a per",["son",1,""]," who thi",["nks",1,""]," a cer",["tain",1,""]," diet wo",["rks",1,""]," will rec",["all",1,""]," every suc",["cess",1,""]," story b",["ut",1,""]," quickly for",["get",1,""]," the fail",["ures",1,""],". This bi",["as",2,""]," affects n",["ot",2,""]," only ordi",["nary",2,""]," people b",["ut",2,""]," also exp",["erts",2,""],", including scien",["tists",2,""]," and jud",["ges",2,""],". Online, i",["t",3,""]," can b",["e",3,""]," reinforced b",["y",3,""]," algorithms th",["at",3,""]," show us",["ers",3,""]," content sim",["ilar",3,""]," to wh",["at",3,""]," they ha",["ve",3,""]," liked bef",["ore",3,""],". O ls in the details.","This approach saves enormous amounts of time and allows each player to explore a unique world.","However, purely random content can feel repetitive or meaningless.","The most successful games therefore combine procedural systems with carefully crafted landmarks and stories created by human artists."],"segs":["Many modern video games contain worlds far too large to be designed entirely by hand. Instead, devel",["opers",1,""]," rely o",["n",1,""]," procedural gener",["ation",1,""],", in wh",["ich",1,""]," algorithms cre",["ate",1,""]," terrain, pla",["nts",1,""],", buildings, o",["r",1,""]," even ent",["ire",1,""]," planets acco",["rding",1,""]," to a set o",["f",1,""]," rules. A designer mi",["ght",2,""]," specify h",["ow",2,""]," steep moun",["tains",2,""]," can b",["e",2,""]," or h",["ow",2,""]," often riv",["ers",2,""]," appear, a",["nd",2,""]," the comp",["uter",2,""]," fills i",["n",2,""]," the det",["ails",2,""],". This appr",["oach",3,""]," saves enor",["mous",3,"膨大な"]," amounts o",["f",3,""]," time a",["nd",3,""]," allows ea",["ch",3,""]," player t",["o",3,""]," explore a unique wo",["rld",3,""],". However, pur",["ely",4,""]," random con",["tent",4,""]," can fe",["el",4,""]," repetitive o",["r",4,""]," meaningless. The most successful games therefore combine procedural systems with carefully crafted landmarks and stories created by human artists."],"lv":"C1","cnt":{"B2":10,"C1":3,"C2":1,"X":4},"hw":[["developers",""],["algorithms",""],["according",""],["repetitive",""],["procedural","C2"],["terrain","C1"],["meaningless","C1"],["landmarks","C1"],["entirely","B2"],["rely","B2"],["entire","B2"],["specify","B2"],["steep","B2"],["approach","B2"],["unique","B2"],["purely","B2"],["random","B2"],["crafted","B2"]]},{"t":"Language Extinction","ja":"現在話されている約7000の言語のうち、ほぼ半数が消滅の危機にあると言語学者は推定している。言語はたいてい少しずつ消えていく。親が、経済的な機会の多いより優勢な言語を選び、子どもに受け継がなくなるからだ。最後の流ちょうな話し手が亡くなると、世界を表す独自の方法が失われる。危機にある言語の多くは、地域の植物・動物・生態系についての、ほかでは記録されていない詳しい知識を含んでいる。この喪失を防ぐため、地域社 razing have managed to reverse desertification in several regions of Africa and Asia."],"lv":"C1","cnt":{"B2":9,"C1":8,"C2":0,"X":5},"hw":[["desertification",""],["fertile",""],["unproductive",""],["overgrazing",""],["grazing",""],["intensive","C1"],["protective","C1"],["vegetation","C1"],["occasional","C1"],["strip","C1"],["migration","C1"],["encouragingly","C1"],["reverse","C1"],["gradually","B2"],["contributes","B2"],["livestock","B2"],["roots","B2"],["exhausts","B2"],["remaining","B2"],["shortages","B2"],["restore","B2"],["sustainable","B2"]]},{"t":"Nudge Theory","ja":"ナッジ理論によれば、選択肢の見せ方を少し変えるだけで、自由を制限することなく人の選択に影響を与えられる。典型的な例は、学校の食堂で果物を目の高さに置き、デザートを目立たない棚に移すことだ。生徒は好きなものを選べるが、健康的な選択肢がより多く選ばれる。政府は似た考えを、例えば従業員を自動的に年金制度に加入させ、抜けることもできるようにして老後の貯蓄を促すのに使ってきた。批判派は、人が気づかないならナッジは人を操ることになりうると主張する。賛成派は、どんな選択肢も何らかの形で示されるのだから、責任を持って設計したほうがよいと答える。","g":[["restricting","制限する","B2"],["visible","目に見える・目立つ","B2"],["retirement","引退・老後","B2"],["opt out","（制度から）抜ける","C1"],["manipulative","人を操るような",""]],"au":"lit_r_35","sents":["Nudge theory suggests that people's choices can be influenced by small changes in how options are presented, without restricting their freedom.","A classic example is placing fruit at eye level in a school cafeteria while moving desserts to a less visible shelf.","Students can still choose whatever they like, yet healthier options are selected more often.","Governments have applied similar ideas to encourage saving for retirement, for instance by enrolling employees in pension plans automatically while allowing them to opt out.","Critics argue that nudges can be manipulative if people are unaware of them.","Supporters respond that every choice is presented in some way, so it might as well be designed responsibly."],"segs":["Nudge theory suggests that people's choices can be influenced by small changes in how options are presented, without restricting their freedom. A cla",["ssic",1,""]," example i",["s",1,""]," placing fr",["uit",1,""]," at e",["ye",1,""]," lev function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 模範解答：{{…}}=緑の下線、重要表現＝黄色マーカー */
function keyHTML(raw,keys){
  const ch=[];let f=false;
  for(let i=0;i<raw.length;){if(raw.startsWith('{{',i)){f=true;i+=2;continue;}if(raw.startsWith('}}',i)){f=false;i+=2;continue;}ch.push({c:raw[i],f,k:false});i++;}
  const pl=ch.map(x=>x.c).join('');
  (keys||[]).forEach(k=>{const j=pl.indexOf(k.m);if(j>=0)for(let x=j;x<j+k.m.length;x++)ch[x].k=true;});
  let h='',cur=null,buf='';
  const flush=()=>{if(!buf)return;const c=(cur.f?'fill ':'')+(cur.k?'key':'');h+=c.trim()?'<span class="'+c.trim()+'">'+esc(buf)+'</span>':esc(buf);buf='';};
  ch.forEach(x=>{if(!cur||cur.f!==x.f||cur.k!==x.k){flush();cur=x;}buf+=x.c;});flush();return h;
}

}

/* 音声：edge-tts で事前に作った mp3（例文=Andrew・質問=Ava・会話=話者ごと）を1つの <audio> で鳴らす */
const AUD=new Audio(); AUD.preload='auto';
let audDone=null, audOK=false;
function unlockAud(){if(audOK)return;audOK=true;try{const p=AUD.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
document.addEventListener('touchend',unlockAud,{capture:true,once:true});
document.addEventListener('click',unlockAud,{capture:true,once:true});
function ttsFallback(text,res){if(!text||!window.speechSynthesis){res();return;}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=RATE;u.onend=res;u.onerror=res;speechSynthesis.speak(u);}
function play(key,text){stopSpeak();return new Promise(res=>{let fin=false;const done=()=>{if(fin)return;fin=true;audDone=null;res();};audDone=done;
  AUD.onended=done;AUD.onerror=()=>{if(fin)return;ttsFallback(text,done);};
  AUD.src='audio/'+key+'.mp3';AUD.playbackRate=RATE;try{AUD.defaultPlaybackRate=RATE;}catch(e){}
  const p=AUD.play();if(p&&p.catch)p.catch(()=>{if(!fin)ttsFallback(text,done);});});}
function stopSpeak(){try{AUD.pause();}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();if(audDone){const d=audDone;audDone=null;d();}}

/* 穴あけ：テンプレの黒字（空欄以外）の単語を隠す */
function tokens(t){const out=[];t.split(/(【[^】]*】)/).forEach(seg=>{if(!seg)return;if(/^【/.test(seg)){out.push({b:seg});return;}seg.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){out.push({s:w});return;}const m=w.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'’-]*)([^A-Za-z]*)$/);if(m)out.push({pre:m[1],w:m[2],post:m[3]});else out.push({s:w});});});return out;}
function makeHidden(toks,level){const idx=toks.map((x,i)=>x.w?i:-1).filter(i=>i>=0);const k=level>=3?idx.length:Math.max(1,Math.ceil(idx.length*(level===1?0.35:0.7)));const sorted=idx.slice().sort((a,b)=>(toks[b].w.length+Math.random()*3)-(toks[a].w.length+Math.random()*3));return new Set(sorted.slice(0,k));}
function clozeHTML(toks,hidden,opened,level){return toks.map((x,i)=>{if(x.b)return '<span class="bl">'+esc(x.b)+'</span>';if(x.s!==undefined)return esc(x.s);if(!hidden.has(i)||opened.has(i))return esc(x.pre)+'<span'+(hidden.has(i)?' class="hw open"':'')+'>'+esc(x.w)+'</span>'+esc(x.post);const hint=level===1?x.w[0]+'·'.repeat(Math.max(0,x.w.length-1)):' '.repeat(Math.max(2,Math.round(x.w.length*1.1)));return esc(x.pre)+'<span class="hw'+(level===1?' hint':'')+'" data-i="'+i+'">'+esc(hint)+'</span>'+esc(x.post);}).join('');}
const autoLevel=b=>b<=0?1:b<=2?2:3;
const LVNAME={1:'Lv1 頭文字あり',2:'Lv2 半分以上かくす',3:'Lv3 全部かくす（役割だけ）'};

/* 穴埋め（1行ずつ・自己採点） */
function clozeSession(el,items,opts){
  // items: [{t,l,i,id}]
  let q=items.slice(), n=0, total=items.length, again=[];
  let lvSel=opts.level||0; // 0=おまかせ
  function next(){
    if(!q.length && again.length){q=again;again=[];}
    if(!q.length){finish();return;}
    const it=q.shift();n++;
    const level=lvSel||autoLevel(boxOf(it.id));
    const toks=tokens(it.l.t), hidden=makeHidden(toks,level), opened=new Set();
    let shown=false;
    const draw=()=>{
      let h='<div class="row"><span class="prog">'+(n>total?'やり直し（×の行をもう一度）':n+' / '+total)+'</span>'+(opts.showLevelSel?'<select class="sel right" id="lv"><option value="0">おまかせ</option><option value="1">Lv1</option><option value="2">Lv2</option><option value="3">Lv3</option></select>':'')+'</div>';
      h+='<div class="card"><div class="muted">'+esc(it.t.icon+' '+it.t.name)+'　'+LVNAME[level]+'</div><div style="margin:6px 0"><span class="role">'+esc(it.l.r)+'</span></div>';
      h+='<div class="tpl big" id="cz">'+clozeHTML(toks,hidden,opened,level)+'</div>';
      h+='<div class="muted" style="margin-top:8px">声に出して全文を言ってから、グレーをタップ（1語ずつ）か「答え」。</div>';
      if(shown){h+='<div class="ex" style="margin-top:10px"><button class="spk" id="spk1">🔊</button>'+exHTML(it.l.e)+'</div><div class="rate"><button class="r1" data-r="1">◎ 言えた</button><button class="r2" data-r="2">△ あいまい</button><button class="r3" data-r="3">× まだ</button></div>';}
      else h+='<div class="row" style="margin-top:12px"><button class="pri" id="ans" style="flex:1;padding:12px">答え</button></div>';
      h+='</div>';
      el.innerHTML=h;
      if(opts.showLevelSel){$('#lv').value=String(lvSel);$('#lv').onchange=e=>{lvSel=+e.target.value;q.unshift(it);n--;next();};}
      $('#cz').onclick=e=>{const w=e.target.closest('.hw[data-i]');if(!w)return;opened.add(+w.dataset.i);if(opened.size>=hidden.size)shown=true;draw();};
      if(!shown){$('#ans').onclick=()=>{hidden.forEach(i=>opened.add(i));shown=true;draw();};}
      else{
        $('#spk1').onclick=()=>play('ex_'+it.t.id+'_'+it.i,plain(it.l.e));
        el.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{
          const r=+b.dataset.r, b0=boxOf(it.id);
          S.box[it.id]= r===1?Math.min(b0+1,5): r===2?Math.max(b0,0): 0;
          S.last[it.id]=today(); markDay();
          detFirst('L:'+it.id,r===1?100:r===2?60:0,'cloze');
          if(r===3) again.push(it);
          next();
        });
      }
    };
    draw();
  }
  function finish(){
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おわり</div><div class="muted">'+total+' 行を確認しました</div></div>';
    h+='<div class="card">'+items.map(it=>{const b=boxOf(it.id);const c=b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)';return '<div class="ln"><span class="role" style="color:'+c+'">'+(b>=3?'覚えた':b>=1?'もう少し':'まだ')+'</span><span class="tpl" style="font-size:15px">'+tplHTML(it.l.t)+'</span></div>';}).join('')+'</div>';
    h+='<div class="hero"><button class="pri" id="again">もう一回</button><button id="home">ホームへ</button></div>';
    el.innerHTML=h;
    $('#again').onclick=opts.restart;$('#home').onclick=()=>go({view:'home'});
  }
  next();
}
function tabCloze(t,el){
  const items=t.lines.map((l,i)=>({t,l,i,id:lid(t,i)}));
  const run=()=>clozeSession(el,items,{showLevelSel:true,restart:run});
  run();
}
function renderDaily(){
  const app=$('#app');app.classList.remove('blur');app.onclick=null;
  const al=allLines();
  const scored=shuffle(al).sort((a,b)=>boxOf(a.id)-boxOf(b.id)||String(S.last[a.id]||'').localeCompare(String(S.last[b.id]||'')));
  const items=scored.slice(0,10);
  app.innerHTML='<div id="tb"></div>';
  const run=()=>{const al2=allLines();const s2=shuffle(al2).sort((a,b)=>boxOf(a.id)-boxOf(b.id)||String(S.last[a.id]||'').localeCompare(String(S.last[b.id]||'')));clozeSession($('#tb'),s2.slice(0,10),{showLevelSel:true,restart:run});};
  clozeSession($('#tb'),items,{showLevelSel:true,restart:run});
}

/* ---------- お気に入り表現（一覧・復習） ---------- */
const fbox=id=>S.fbox[id]||0;
const fboxLabel=b=>b>=3?'覚えた':b>=1?'もう少し':'まだ';
function favList(){return Object.keys(S.fav).map(id=>Object.assign({id},S.fav[id])).sort((a,b)=>b.t-a.t);}
function maskHTML(s,m){const j=s.indexOf(m);if(j<0)return esc(s);
  const box=m.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:(/[A-Za-z]/.test(w)?'<span class="hw hint">'+esc(w[0]+'·'.repeat(Math.max(0,w.replace(/[^A-Za-z'’-]/g,'').length-1)))+'</span>':esc(w))).join('');
  return esc(s.slice(0,j))+box+esc(s.slice(j+m.length));}
function renderFav(){
  const app=$('#app');app.classList.remove('blur');app.onclick=null;
  const L=favList(), tab=V.ftab||'list';
  app.innerHTML='<div class="tabs"><button data-t="list" class="'+(tab==='list'?'on':'')+'">一覧（'+L.length+'）</button><button data-t="rev" class="'+(tab==='rev'?'on':'')+'">復習 10問</button></div><div id="tb"></div>';
