photo:11:hanging over it","m":"hanging over it","ja":"その上にぶら下がっている","g":"hang over 【名】","s":"It is going straight between tall buildings, and traffic lights are hanging over it.","au":"s_13f59a2ac6","src":"Speak About the Photo・写真12"},{"id":"sphoto:11:so tall that they almost hide the sky","m":"so tall that they almost hide the sky","ja":"空がほとんど隠れるほど高い","g":"so 【形】 that 【SV】","s":"The glass skyscrapers are so tall that they almost hide the sky.","au":"s_cf102db8dd","src":"Speak About the Photo・写真12"},{"id":"sphoto:11:business district","m":"business district","ja":"ビジネス街","g":"","s":"This picture reminds me of the business district in Tokyo, because it also has wide streets and huge office towers.","au":"s_8569cd1542","src":"Speak About the Photo・写真12"}]},{"a":["In this picture, I can see {{an outdoor market under a large orange roof}}.","The first thing I notice is {{an older man with white hair behind a stall}}. {{He}} is {{arranging the vegetables}}, and {{he looks like he is waiting for customers}}.","On the left side, {{there are piles of wooden boxes and a table with a red cloth}}, and on the right side, {{a tall green pole holds up the roof}}. In the background, {{a woman is working at another stall}}. {{Most of the boxes are filled with fruit and vegetables.}}","Judging from {{the empty aisles}}, it seems that {{the market has just opened}}. {{The sellers}} might be {{preparing for the morning rush}}.","The whole scene looks {{traditional and relaxed}}. This picture reminds me of {{the morning market in Takayama}}, because {{the sellers there also chat with customers in a friendly way}}."],"au":"m_sp_12","keys":[{"id":"sphoto:12:arranging the vegetables","m":"arranging the vegetables","ja":"野菜を並べている","g":"arrange 【名】","s":"He is arranging the vegetables, and he looks like he is waiting for customers.","au":"s_ca3bd3bfeb","src":"Speak About the Photo・写真13"},{"id":"sphoto:12:holds up the roof","m":"holds up the roof","ja":"屋根を支えている","g":"hold up 【名】","s":"On the left side, there are piles of wooden boxes and a table with a red cloth, and on the right side, a tall green pole holds up the roof.","au":"s_0934c83e72","src":"Speak About the Photo・写真13"},{"id":"sphoto:12:the morning rush","m":"the morning rush","ja":"朝の混雑","g":"","s":"The sellers might be preparing for the morning rush.","au":"s_efcffe8d59","src":"Speak About the Photo・写真13"},{"id":"sphoto:12:in a friendly way","m":"in a friendly way","ja":"親しげに","g":"","s":"This picture reminds me of the morning market in Takayama, because the sellers there also chat with customers in a friendly way.","au":"s_3b1483934c","src":"Speak About the Photo・写真13"}]},{"a":["In this picture, I can see {{a fruit and vegetable stand at a busy market}}.","The first thing I notice is {{the colorful fruit in the front}}. {{It}} is {{piled up in neat rows}}, and {{each type has a small white price tag}}.","On the left side, {{there are pineapples and red apples}}, and on the right side, {{I can see eggplants, green melons, and dark purple fruit}}. In the background, {{pumpkins, peppers, and green onions are stacked high}}. {{A metal scale hangs above the vegetables.}}","Judging from {{tropical fruit like dragon fruit and lychees}}, it seems that {{this market is in a warm country}}. {{Shoppers}} might be {{buying fresh food for the day}}.","The whole scene looks {{fresh and lively}}. This picture reminds me of {{a big market I saw on a travel show}}, because {{the stalls there were also full of bright colors}}."],"au":"m_sp_13","keys":[{"id":"sphoto:13:piled up in neat rows","m":"piled up in neat rows","ja":"きちんと列に積まれている","g":"be piled up 【場所】","s":"It is piled up in neat rows, and each type has a small white price tag.","au":"s_6ae2002904","src":"Speak About the Photo・写真14"},{"id":"sphoto:13:stacked high","m":"stacked high","ja":"高く積み上げられて","g":"","s":"In the background, pumpkins, peppers, and green onions are stacked high.","au":"s_6403f8b6d9","src":"Speak About the Photo・写真14"},{"id":"sphoto:13:hangs above the vegetables","m":"hangs above the vegetables","ja":"野菜の上につるされている","g":"hang above 【名】","s":"A metal scale hangs above the vegetables.","au":"s_3e6b699e8f","src":"Speak About the Photo・写真14"},{"id":"sphoto:13:full of bright colors","m":"full of bright colors","ja":"鮮やかな色でいっぱい","g":"","s":"This picture reminds me of a big market I saw on a travel show, because the stalls there were also full of bright colors.","au":"s_4ab46276ba","src":"Speak About the Photo・写真14"}]},{"a":["In this picture, I can see {{a group of friends sitting side by side by the sea}}.","The first thing I notice is {{the way they are sitting}}. {{They}} are {{putting their arms around each other's shoulders}}, and {{they are all looking out at the water}}.","On the left side, {{a man in a cap and a man in a blue and white T-shirt are sitting close together}}, and on the right side, {{a man has a camera hanging on his back}}. In the background, {{cable cars are moving over the sea toward the mountains}}. {{In the middle, one woman is wearing a yellow T-shirt and another is wearing a white hat.}}","Judging from {{the camera and the bags}}, it seems that {{they are on a trip together}}. They might be {{waiting to ride the cable car}}.","The whole scene looks {{warm and friendly}}. This picture reminds me of {{my graduation trip with my high school friends}}, because {{we also took a group photo by the sea}}."],"au":"m_sp_14","keys":[{"id":"sphoto:14:putting their arms around each other's shoulders","m":"putting their arms around each other's shoulders","ja":"お互いの肩に腕を回している","g":"","s":"They are putting their arms around each other's shoulders, and they are all looking out at the water.","au":"s_d02e965462","src":"Speak About the Photo・写真15"},{"id":"sphoto:14:looking out at the water","m":"looking out at the water","ja":"水面を見つめている","g":"look out at 【名】","s":"They are putting their arms around each other's shoulders, and they are all looking out at the water.","au":"s_d02e965462","src":"Speak About the Photo・写真15"},{"id":"sphoto:14:on a trip together","m":"on a trip together","ja":"一緒に旅行中","g":"","s":"Judging from the camera and the bags, it seems that they are on a trip together.","au":"s_3d1e18b114","src":"Speak About the Photo・写真15"},{"id":"sphoto:14:took a group photo","m":"took a group photo","ja":"集合写真を撮った","g":"","s":"This picture reminds me of my graduation trip with my high school friends, because we also took a group photo by the sea.","au":"s_ba783e4986","src":"Speak About the Photo・写真15"}]},{"a":["In this picture, I can see {{four friends standing on a hill at sunset}}.","The first thing I notice is {{the bright sun between them}}. {{It}} is {{shining through the gap between two people}}, and {{the light makes their shapes look dark}}.","On the left side, {{a woman with long hair is wearing jeans}}, and on the right side, {{a tall man has a shirt tied around his shoulders}}. In the background, {{misty hills fade into the orange sky}}. {{Some bags are lying on the dry grass behind them.}}","Judging from {{the bags on the ground}}, it seems that {{they climbed the hill together}}. They might be {{celebrating the end of a long hike}}.","The whole scene looks {{warm and emotional}}. This picture reminds me of {{the last day of a school trip}}, because {{we watched the sunset together and felt a little sad that it was ending}}."],"au":"m_sp_15","keys":[{"id":"sphoto:15:shining through the gap between","m":"shining through the gap between","ja":"〜の間のすき間から差し込んでいる","g":"","s":"It is shining through the gap between two people, and the light makes their shapes look dark.","au":"s_1f094370db","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:makes their shapes look dark","m":"makes their shapes look dark","ja":"彼らの姿を黒く見せる","g":"make 【名】 look 【形】","s":"It is shining through the gap between two people, and the light makes their shapes look dark.","au":"s_1f094370db","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:tied around his shoulders","m":"tied around his shoulders","ja":"肩に巻いて","g":"","s":"On the left side, a woman with long hair is wearing jeans, and on the right side, a tall man has a shirt tied around his shoulders.","au":"s_6fa16e6330","src":"Speak About the Photo・写真16"},{"id":"sphoto:15:celebrating the end of","m":"celebrating the end of","ja":"〜の終わりを祝っている","g":"celebrate the end of 【名】","s":"They might be celebrating the end of a long hike.","au":"s_1da65e57a8","src":"Speak About the Photo・写真16"}]},{"a":["In this picture, I can see {{a wooden desk with some school supplies on it}}.","The first thing I notice is {{a shiny red apple}}. {{It}} is {{sitting on top of a stack of books}}, and {{it looks fresh and bright}}.","On the left side, {{there are four books piled on top of each other}}, and on the right side, {{three toy blocks show the letters A, B, and C}}. In the background, {{there is a plain white wall with a colorful painting at the top}}. {{In the middle of the desk, a few colored pencils are lying in a small pile.}}","Judging from {{the alphabet blocks and the colored pencils}}, it seems that {{this is a classroom for young children}}. {{The children}} might be {{playing outside during a break}}.","The whole scene looks {{neat and cheerful}}. This picture reminds me of {{my elementary school classroom}}, because {{we also used colored pencils and alphabet cards every day}}."],"au":"m_sp_16","keys":[{"id":"sphoto:16:sitting on top of a stack of books","m":"sitting on top of a stack of books","ja":"積んだ本のてっぺんに置かれている","g":"sit on top of 【名】","s":"It is sitting on top of a stack of books, and it looks fresh and bright.","au":"s_d7c92e5124","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:piled on top of each other","m":"piled on top of each other","ja":"積み重なって","g":"","s":"On the left side, there are four books piled on top of each other, and on the right side, three toy blocks show the letters A, B, and C.","au":"s_026eba73a0","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:a plain white wall","m":"a plain white wall","ja":"何もない白い壁","g":"","s":"In the background, there is a plain white wall with a colorful painting at the top.","au":"s_325de9420e","src":"Speak About the Photo・写真17"},{"id":"sphoto:16:lying in a small pile","m":"lying in a small pile","ja":"小さな山になって置かれている","g":"","s":"In the middle of the desk, a few colored pencils are lying in a small pile.","au":"s_9ebc0ebf6f","src":"Speak About the Photo・写真17"}]},{"a":["In this picture, I can see {{a large, empty office space with a modern design}}.","The first thing I notice is {{a long hallway in the middle}}. {{It}} is {{going straight back}}, and {{it has glass walls on both sides}}.","On the left side, {{there is a light green sofa and some low wooden shelves}}, and on the right side, {{black kitchen cabinets and a large fridge stand against the wall}}. In the background, {{small lights hang from the ceiling all the way down the hallway}}. {{The floor is smooth and light gray.}}","Judging from {{the empty space and the clean floor}}, it seems that {{the office is brand new}}. {{Workers}} might be {{moving in next week}}.","The whole scene looks {{modern and calm}}. This picture reminds me of {{the kind of studio I want to work in}}, because {{it looks clean and comfortable for creative work}}."],"au":"m_sp_17","keys":[{"id":"sphoto:17:going straight back","m":"going straight back","ja":"まっすぐ奥へ続いている","g":"","s":"It is going straight back, and it has glass walls on both sides.","au":"s_99ec27b75f","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:stand against the wall","m":"stand against the wall","ja":"壁に沿って置かれている","g":"stand against 【名】","s":"On the left side, there is a light green sofa and some low wooden shelves, and on the right side, black kitchen cabinets and a large fridge stand against the wall.","au":"s_abfefa5dcb","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:brand new","m":"brand new","ja":"新品の","g":"","s":"Judging from the empty space and the clean floor, it seems that the office is brand new.","au":"s_01961b738d","src":"Speak About the Photo・写真18"},{"id":"sphoto:17:moving in","m":"moving in","ja":"入居する","g":"move in","s":"Workers might be moving in next week.","au":"s_1395fa51ed","src":"Speak About the Photo・写真18"}]},{"a":["In this picture, I can see {{three people holding drinks together over a table}}.","The first thing I notice is {{two white cups of coffee in the middle}}. {{They}} are {{touching each other}}, and {{each one has a leaf design in the milk foam}}.","On the left side, {{a hand is holding a glass of iced coffee}}, and on the right side, {{another person is holding a cup from the side}}. In the background, {{there is a wooden table with black plates and spoons}}. {{Only their hands can be seen in the photo.}}","Judging from {{the way the cups are touching}}, it seems that {{they are making a toast}}. They might be {{celebrating something good, like a new job}}.","The whole scene looks {{friendly and relaxed}}. This picture reminds me of {{the café where my friends and I meet after exams}}, because {{we always order lattes with designs like these}}."],"au":"m_sp_18","keys":[{"id":"sphoto:18:making a toast","m":"making a toast","ja":"乾杯している","g":"make a toast","s":"Judging from the way the cups are touching, it seems that they are making a toast.","au":"s_1af661da5f","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:from the side","m":"from the side","ja":"横から","g":"","s":"On the left side, a hand is holding a glass of iced coffee, and on the right side, another person is holding a cup from the side.","au":"s_b3ed31d1ac","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:can be seen","m":"can be seen","ja":"見える（受け身）","g":"【名】 can be seen","s":"Only their hands can be seen in the photo.","au":"s_7ff71f6be7","src":"Speak About the Photo・写真19"},{"id":"sphoto:18:designs like these","m":"designs like these","ja":"こういうデザイン","g":"【名】 like these","s":"This picture reminds me of the café where my friends and I meet after exams, because we always order lattes with designs like these.","au":"s_7c78080b37","src":"Speak About the Photo・写真19"}]},{"a":["In this picture, I can see {{a large group of cyclists in a road race}}.","The first thing I notice is {{a rider in a dark blue uniform at the front}}. {{He}} is {{leaning forward and pedaling hard}}, and {{he is wearing a blue helmet and sunglasses}}.","On the left side, {{more riders are following closely behind him}}, and on the right side, {{a long line of cyclists in colorful uniforms fills the road}}. In the background, {{green trees line the road}}. {{Next to the leader, another rider in black is also racing hard.}}","Judging from {{their serious faces}}, it seems that {{this is an important race}}. They might be {{getting close to the finish line}}.","The whole scene looks {{intense and exciting}}. This picture reminds me of {{watching a bicycle race on TV with my father}}, because {{the riders also moved together in a big group}}."],"au":"m_sp_19","keys":[{"id":"sphoto:19:leaning forward","m":"leaning forward","ja":"前かがみになって","g":"","s":"He is leaning forward and pedaling hard, and he is wearing a blue helmet and sunglasses.","au":"s_7000af59b8","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:following closely behind him","m":"following closely behind him","ja":"彼のすぐ後ろについている","g":"follow closely behind 【名】","s":"On the left side, more riders are following closely behind him, and on the right side, a long line of cyclists in colorful uniforms fills the road.","au":"s_4604fba70a","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:green trees line the road","m":"green trees line the road","ja":"緑の木々が道に沿って並ぶ","g":"【名】 line the road","s":"In the background, green trees line the road.","au":"s_b1eb878ebe","src":"Speak About the Photo・写真20"},{"id":"sphoto:19:getting close to the finish line","m":"getting close to the finish line","ja":"ゴールに近づいている","g":"get close to 【名】","s":"They might be getting close to the finish line.","au":"s_a2a8844eeb","src":"Speak About the Photo・写真20"}]},{"a":["In this picture, I can see {{a runner getting ready at the start of a race}}.","The first thing I notice is {{his hand on the red track}}. {{He}} is {{holding a black baton}}, and {{his fingers are placed just behind the white line}}.","On the left side, {{his foot is pressed against a starting block}}, and on the right side, {{the white lines of the track stretch into the distance}}. In the background, {{the track is a little blurry}}. {{He is wearing black shorts and green shoes.}}","Judging from {{the baton in his hand}}, it seems that {{he is running the first part of a relay race}}. {{The other runners}} might be {{waiting for the starting signal}}.","The whole scene looks {{tense and powerful}}. This picture reminds me of {{my school sports day}}, because {{I was nervous before the relay race, too}}."],"au":"m_sp_20","keys":[{"id":"sphoto:20:pressed against a starting block","m":"pressed against a starting block","ja":"スターティングブロックに押し当てられている","g":"be pressed against 【名】","s":"On the left side, his foot is pressed against a starting block, and on the right side, the white lines of the track stretch into the distance.","au":"s_c5c37c18ba","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:just behind the white line","m":"just behind the white line","ja":"白線のすぐ後ろに","g":"","s":"He is holding a black baton, and his fingers are placed just behind the white line.","au":"s_1be2be8298","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:stretch into the distance","m":"stretch into the distance","ja":"遠くまで伸びている","g":"","s":"On the left side, his foot is pressed against a starting block, and on the right side, the white lines of the track stretch into the distance.","au":"s_c5c37c18ba","src":"Speak About the Photo・写真21"},{"id":"sphoto:20:waiting for the starting signal","m":"waiting for the starting signal","ja":"スタートの合図を待っている","g":"wait for 【名】","s":"The other runners might be waiting for the starting signal.","au":"s_133247c2ef","src":"Speak About the Photo・写真21"}]},{"a":["In this picture, I can see {{an old clock tower next to a wide river}}.","The first thing I notice is {{the tall clock tower in the middle}}. {{It}} is {{standing above the other buildings}}, and {{it has a large clock face near the top}}.","On the left side, {{there is a huge stone building with many pointed towers}}, and on the right side, {{a long bridge with green railings crosses the water}}. In the background, {{white clouds are moving across the sky}}. {{A small red boat is moving on the river.}}","Judging from {{the famous tower}}, it seems that {{this is London}}. {{The people on the bridge}} might be {{taking photos of the view}}.","The whole scene looks {{historic and elegant}}. This picture reminds me of {{a history documentary I watched}}, because {{it showed this same tower and bridge}}."],"au":"m_sp_21","keys":[{"id":"sphoto:21:standing above the other buildings","m":"standing above the other buildings","ja":"ほかの建物の上にそびえている","g":"stand above 【名】","s":"It is standing above the other buildings, and it has a large clock face near the top.","au":"s_79268e9e81","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:clock face","m":"clock face","ja":"時計の文字盤","g":"","s":"It is standing above the other buildings, and it has a large clock face near the top.","au":"s_79268e9e81","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:crosses the water","m":"crosses the water","ja":"川を渡っている","g":"cross 【名】","s":"On the left side, there is a huge stone building with many pointed towers, and on the right side, a long bridge with green railings crosses the water.","au":"s_89a245b1f9","src":"Speak About the Photo・写真22"},{"id":"sphoto:21:moving across the sky","m":"moving across the sky","ja":"空を流れていく","g":"move across 【名】","s":"In the background, white clouds are moving across the sky.","au":"s_b48c6f3dea","src":"Speak About the Photo・写真22"}]},{"a":["In this picture, I can see {{a long row of bookshelves in an old library}}.","The first thing I notice is {{the round light bulbs hanging from the ceiling}}. {{They}} are {{glowing softly}}, and {{they go all the way down the hallway}}.","On the left side, {{the shelves are full of old books with faded covers}}, and on the right side, {{the room gets darker}}. In the background, {{the shelves continue into a dim hallway}}. {{There is a little blue light at the very end.}}","Judging from {{the old books and the quiet atmosphere}}, it seems that {{this library has been there for a long time}}. {{Students}} might be {{reading quietly in another room}}.","The whole scene looks {{quiet and cozy}}. This picture reminds me of {{the old library at my university}}, because {{I often study there when I need to focus}}."],"au":"m_sp_22","keys":[{"id":"sphoto:22:glowing softly","m":"glowing softly","ja":"柔らかく光っている","g":"","s":"They are glowing softly, and they go all the way down the hallway.","au":"s_692ab4c2a3","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:full of old books with faded covers","m":"full of old books with faded covers","ja":"表紙の色あせた古い本でいっぱい","g":"","s":"On the left side, the shelves are full of old books with faded covers, and on the right side, the room gets darker.","au":"s_ac9ab291ea","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:continue into a dim hallway","m":"continue into a dim hallway","ja":"薄暗い廊下へと続く","g":"continue into 【名】","s":"In the background, the shelves continue into a dim hallway.","au":"s_3f992b96c2","src":"Speak About the Photo・写真23"},{"id":"sphoto:22:at the very end","m":"at the very end","ja":"いちばん奥に","g":"","s":"There is a little blue light at the very end.","au":"s_51e7aed65f","src":"Speak About the Photo・写真23"}]},{"a":["In this picture, I can see {{a night sky full of stars above snowy mountains}}.","The first thing I notice is {{the Milky Way in the middle of the sky}}. {{It}} is {{glowing in pink and purple}}, and {{thousands of stars are shining around it}}.","On the left side, {{the sky is a deep purple}}, and on the right side, {{a shooting star is falling toward the mountains}}. In the background, {{white, snowy mountains rise above a dark forest}}. {{The forest at the bottom is almost completely black.}}","Judging from {{how clear the stars are}}, it seems that {{this place is far away from any city}}. {{Campers}} might be {{watching the sky from their tents}}.","The whole scene looks {{beautiful and peaceful}}. This picture reminds me of {{a night I spent in the mountains}}, because {{I saw more stars than ever before}}."],"au":"m_sp_23","keys":[{"id":"sphoto:23:full of stars","m":"full of stars","ja":"星でいっぱいの","g":"full of 【名】","s":"In this picture, I can see a night sky full of stars above snowy mountains.","au":"s_0bc6cb0677","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:a shooting star","m":"a shooting star","ja":"流れ星","g":"","s":"On the left side, the sky is a deep purple, and on the right side, a shooting star is falling toward the mountains.","au":"s_d9eb3f0deb","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:far away from any city","m":"far away from any city","ja":"どの街からも遠く離れた","g":"","s":"Judging from how clear the stars are, it seems that this place is far away from any city.","au":"s_9498b23cf4","src":"Speak About the Photo・写真24"},{"id":"sphoto:23:more stars than ever before","m":"more stars than ever before","ja":"今までにないほどたくさんの星","g":"","s":"This picture reminds me of a night I spent in the mountains, because I saw more stars than ever before.","au":"s_1e8df3ae26","src":"Speak About the Photo・写真24"}]},{"a":["In this picture, I can see {{a huge city skyline in the evening}}.","The first thing I notice is {{a tall tower with a pointed top in the middle}}. {{It}} is {{standing above all the other buildings}}, and {{it looks very famous}}.","On the left side, {{there are countless brown and gray buildings}}, and on the right side, {{a tall glass skyscraper is reflecting the sky}}. In the background, {{a river and the ocean can be seen far away}}. {{The sky is light orange near the horizon.}}","Judging from {{the soft light}}, it seems that {{the sun is about to set}}. {{Tourists}} might be {{watching this view from an observation deck}}.","The whole scene looks {{grand and impressive}}. This picture reminds me of {{a movie set in New York}}, because {{it showed a skyline just like this}}."],"au":"m_sp_24","keys":[{"id":"sphoto:24:the sun is about to set","m":"the sun is about to set","ja":"日が今にも沈みそう","g":"be about to 【動原】","s":"Judging from the soft light, it seems that the sun is about to set.","au":"s_5dbb1330ac","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:reflecting the sky","m":"reflecting the sky","ja":"空を映している","g":"","s":"On the left side, there are countless brown and gray buildings, and on the right side, a tall glass skyscraper is reflecting the sky.","au":"s_ca01318673","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:observation deck","m":"observation deck","ja":"展望台","g":"","s":"Tourists might be watching this view from an observation deck.","au":"s_8d44112dbd","src":"Speak About the Photo・写真25"},{"id":"sphoto:24:near the horizon","m":"near the horizon","ja":"地平線の近くで","g":"","s":"The sky is light orange near the horizon.","au":"s_91a1970ae1","src":"Speak About the Photo・写真25"}]},{"a":["In this picture, I can see {{a crowded city seen from a high building}}.","The first thing I notice is {{a long, straight street in the middle}}. {{It}} is {{shining in the golden sunlight}}, and {{it goes far into the distance}}.","On the left side, {{there are tall buildings with dark windows}}, and on the right side, {{a big, pale building stands close to the camera}}. In the background, {{skyscrapers with pointed tops block most of the sky}}. {{The sunlight is coming through a gap between the towers.}}","Judging from {{the low, orange sun}}, it seems that {{the photo was taken just before sunset}}. {{People on the street}} might be {{going home after work}}.","The whole scene looks {{busy and dramatic}}. This picture reminds me of {{a city scene in an animated film}}, because {{the light makes everything look like a painting}}."],"au":"m_sp_25","keys":[{"id":"sphoto:25:goes far into the distance","m":"goes far into the distance","ja":"遠くまで続いている","g":"","s":"It is shining in the golden sunlight, and it goes far into the distance.","au":"s_63888af7d9","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:stands close to the camera","m":"stands close to the camera","ja":"カメラのすぐ近くに立っている","g":"","s":"On the left side, there are tall buildings with dark windows, and on the right side, a big, pale building stands close to the camera.","au":"s_c1e4dee421","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:block most of the sky","m":"block most of the sky","ja":"空の大部分をさえぎる","g":"block 【名】","s":"In the background, skyscrapers with pointed tops block most of the sky.","au":"s_8b5d92f99e","src":"Speak About the Photo・写真26"},{"id":"sphoto:25:look like a painting","m":"look like a painting","ja":"絵のように見える","g":"look like 【名】","s":"This picture reminds me of a city scene in an animated film, because the light makes everything look like a painting.","au":"s_f633b9f106","src":"Speak About the Photo・写真26"}]},{"a":["In this picture, I can see {{a city skyline across the water in the evening}}.","The first thing I notice is {{the tallest glass tower on the left}}. {{It}} is {{reaching high into the sky}}, and {{it has a thin, pointed top}}.","On the left side, {{there are several tall buildings close together}}, and on the right side, {{a small full moon is shining in the sky}}. In the background, {{the sky changes from blue to pink}}. {{In the front, the calm water is dark blue.}}","Judging from {{the moon and the pink sky}}, it seems that {{the sun has just set}}. {{People in the offices}} might be {{getting ready to go home}}.","The whole scene looks {{calm and beautiful}}. This picture reminds me of {{the view of Tokyo from Odaiba}}, because {{you can see tall buildings across the bay there}}."],"au":"m_sp_26","keys":[{"id":"sphoto:26:reaching high into the sky","m":"reaching high into the sky","ja":"空高くそびえている","g":"reach into 【名】","s":"It is reaching high into the sky, and it has a thin, pointed top.","au":"s_2d58fa1f7c","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:changes from blue to pink","m":"changes from blue to pink","ja":"青からピンクへ変わる","g":"change from A to B","s":"In the background, the sky changes from blue to pink.","au":"s_500cde9d13","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:the sun has just set","m":"the sun has just set","ja":"日が沈んだばかり","g":"","s":"Judging from the moon and the pink sky, it seems that the sun has just set.","au":"s_b6e327acb5","src":"Speak About the Photo・写真27"},{"id":"sphoto:26:across the bay","m":"across the bay","ja":"湾の向こうに","g":"across 【名】","s":"This picture reminds me of the view of Tokyo from Odaiba, because you can see tall buildings across the bay there.","au":"s_e835645913","src":"Speak About the Photo・写真27"}]},{"a":["In this picture, I can see {{a group of people eating together at a long table outside}}.","The first thing I notice is {{a woman with blond hair and a black jacket on the right}}. {{She}} is {{eating and smiling}}, and {{she seems to be enjoying the conversation}}.","On the left side, {{a woman with light hair is sitting with her back to the camera}}, and on the right side, {{a man in a dark sweater is leaning toward the table}}. In the background, {{strings of lights hang from a wooden roof}}. {{The table is covered with plates of food and glasses of beer.}}","Judging from {{the drinks and their relaxed faces}}, it seems that {{it is a weekend evening}}. They might be {{celebrating a friend's birthday}}.","The whole scene looks {{lively and fun}}. This picture reminds me of {{a barbecue party at my friend's house}}, because {{everyone was talking and eating at the same time}}."],"au":"m_sp_27","keys":[{" r}}, because {{I was also nervous but tried to look relaxed}}."],"au":"m_sp_28","keys":[{"id":"sphoto:28:giving a presentation","m":"giving a presentation","ja":"プレゼンをしている","g":"give a presentation","s":"In this picture, I can see a man giving a presentation in a modern office.","au":"s_65c12397ff","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:showing his slides","m":"showing his slides","ja":"彼のスライドを映している","g":"","s":"On the left side, a large screen is showing his slides, and on the right side, several coworkers are listening on a brown leather sofa and office chairs.","au":"s_270a9f49e5","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:casual but professional","m":"casual but professional","ja":"くだけているがきちんとしている","g":"","s":"The whole scene looks casual but professional.","au":"s_8003ea4f73","src":"Speak About the Photo・写真29"},{"id":"sphoto:28:tried to look relaxed","m":"tried to look relaxed","ja":"落ち着いて見えるようにした","g":"try to look 【形】","s":"This picture reminds me of a presentation I gave in my seminar, because I was also nervous but tried to look relaxed.","au":"s_9152040eba","src":"Speak About the Photo・写真29"}]},{"a":["In this picture, I can see {{four young people sitting around a wooden table}}.","The first thing I notice is {{a young man with his hair tied up on the left}}. {{He}} is {{writing on a tablet}}, and {{he looks very focused}}.","On the left side, {{a woman in a light blue shirt is smiling at him}}, and on the right side, {{two women are laughing, and one is holding a paper cup}}. In the background, {{there is a white brick wall}}. {{A laptop is open on the table between them.}}","Judging from {{the tablet and the laptop}}, it seems that {{they are university students}}. They might be {{working on a group project}}.","The whole scene looks {{relaxed and friendly}}. This picture reminds me of {{my seminar group}}, because {{we also meet at a café to discuss our research}}."],"au":"m_sp_29","keys":[{"id":"sphoto:29:with his hair tied up","  the Photo・写真32"},{"id":"sphoto:31:on purpose","m":"on purpose","ja":"わざと・意図的に","g":"","s":"Judging from the careful shape of the spiral, it seems that people made it on purpose.","au":"s_70c5ee3ff8","src":"Speak About the Photo・写真32"},{"id":"sphoto:31:for fun","m":"for fun","ja":"楽しみで","g":"","s":"Visitors might be walking along the spiral for fun.","au":"s_4eb55c1105","src":"Speak About the Photo・写真32"}]},{"a":["In this picture, I can see {{a close-up of a small black dog}}.","The first thing I notice is {{its big, round eyes}}. {{It}} is {{looking to the side}}, and {{its face is covered with deep wrinkles}}.","On the left side, {{one of its soft ears is sticking out}}, and on the right side, {{its other ear is hanging down}}. In the background, {{there is a bright yellow wall}}. {{The dog is also wearing a gray knitted sweater.}}","Judging from {{its worried face}}, it seems that {{it is not sure about something}}. {{Its owner}} might be {{holding a treat just outside the photo}}.","The whole scene looks {{funny and cute}}. This picture reminds me of {{my neighbor's pug}}, because {{it always makes the same worried face when it wants a snack}}."],"au":"m_sp_32","keys":[{"id":"sphoto:32:looking to the side","m":"looking to the side","ja":"横を見ている","g":"","s":"It is looking to the side, and its face is covered with deep wrinkles.","au":"s_ee55553391","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:covered with deep wrinkles","m":"covered with deep wrinkles","ja":"深いしわに覆われた","g":"","s":"It is looking to the side, and its face is covered with deep wrinkles.","au":"s_ee55553391","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:sticking out","m":"sticking out","ja":"突き出ている","g":"stick out","s":"On the left side, one of its soft ears is sticking out, and on the right side, its other ear is hanging down.","au":"s_cf7727b117","src":"Speak About the Photo・写真33"},{"id":"sphoto:32:just outside the photo","m":"just outside the photo","ja":"写真のすぐ外で","g":"","s":"Its owner might be holding a treat just outside the photo.","au":"s_36202d8ee9","src":"Speak About the Photo・写真33"}]},{"a":["In this picture, I can see {{a black and white cat looking over a bamboo railing}}.","The first thing I notice is {{its green eyes}}. {{It}} is {{looking straight at the camera}}, and {{it has a small pink nose}}.","On the left side, {{one white paw is resting on the railing}}, and on the right side, {{its other paw is hanging over the edge}}. In the background, {{there is a plain green wall}}. {{The top of its head is black, but its face and chest are white.}}","Judging from {{its relaxed paws}}, it seems that {{it feels safe and comfortable}}. {{The cat}} might be {{waiting for someone to play with it}}.","The whole scene looks {{calm and adorable}}. This picture reminds me of {{my grandparents' cat}}, because {{it also likes to watch people from high places}}."],"au":"m_sp_33","keys":[{"id":"sphoto:33:looking straight at the camera","m":"looking straight at the camera","ja":"カメラをまっすぐ見ている","g":"","s":"It is looking straight at the camera, and it has a small pink nose.","au":"s_51ef512c23","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:hanging over the edge","m":"hanging over the edge","ja":"縁から垂れている","g":"","s":"On the left side, one white paw is resting on the railing, and on the right side, its other paw is hanging over the edge.","au":"s_1eadba0086","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:feels safe and comfortable","m":"feels safe and comfortable","ja":"安心してくつろいでいる","g":"","s":"Judging from its relaxed paws, it seems that it feels safe and comfortable.","au":"s_bd5df2a3e1","src":"Speak About the Photo・写真34"},{"id":"sphoto:33:from high places","m":"from high places","ja":"高いところから","g":"","s":"This picture reminds me of my grandparents' cat, because it also likes to watch people from high places.","au":"s_072dadf17b","src":"Speak About the Photo・写真34"}]},{"a":["In this picture, I can see {{the inside of a large, bright café}}. re placed around it}}.","On the left side, {{white curtains are hanging from the roof}}, and on the right side, {{more tables stand under a large awning}}. In the background, {{green mountains rise from the calm water}}. {{The sun is lighting up the edge of the roof.}}","Judging from {{the empty seats and the neatly set tables}}, it seems that {{the restaurant is getting ready for dinner}}. {{Guests}} might be {{arriving soon to enjoy the sunset}}.","The whole scene looks {{elegant and peaceful}}. This picture reminds me of {{a lakeside restaurant I want to visit someday}}, because {{eating with a view like this must be wonderful}}."],"au":"m_sp_35","keys":[{"id":"sphoto:35:placed around it","m":"placed around it","ja":"その周りに置かれて","g":"","s":"It is set with plates and glasses, and light blue chairs are placed around it.","au":"s_1bc0206e36","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:under a large awning","m":"under a large awning","ja":"大きな日よけの下に","g":"","s":"On the left side, white curtains are hanging from the roof, and on the right side, more tables stand under a large awning.","au":"s_130a180e17","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:rise from the calm water","m":"rise from the calm water","ja":"静かな水面からそびえる","g":"","s":"In the background, green mountains rise from the calm water.","au":"s_2c350e265f","src":"Speak About the Photo・写真36"},{"id":"sphoto:35:must be wonderful","m":"must be wonderful","ja":"きっとすばらしいだろう","g":"must be 【形】","s":"This picture reminds me of a lakeside restaurant I want to visit someday, because eating with a view like this must be wonderful.","au":"s_93bafb0fff","src":"Speak About the Photo・写真36"}]},{"a":["In this picture, I can see {{a huge room full of people using computers}}.","The first thing I notice is {{a man in a white chair in the front}}. {{He}} is {{stretching his arms behind his head}}, and {{he looks a little tired}}.","On the left side, {{rows of people are sitting at long white desks}}, and on the ri  seat}}. {{The passenger}} might be {{traveling to another country for vacation}}.","The whole scene looks {{bright and exciting}}. This picture reminds me of {{my first flight abroad}}, because {{I took a photo of the wing just like this}}."],"au":"m_sp_38","keys":[{"id":"sphoto:38:above the clouds","m":"above the clouds","ja":"雲の上を","g":"","s":"In this picture, I can see the wing of an airplane flying above the clouds.","au":"s_36e83be544","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:stretching across the bottom of the picture","m":"stretching across the bottom of the picture","ja":"写真の下を横切って伸びている","g":"stretch across 【名】","s":"It is stretching across the bottom of the picture, and its tip is pointing up toward the sky.","au":"s_977e98ab87","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:pointing up toward the sky","m":"pointing up toward the sky","ja":"空に向かって上を向いている","g":"","s":"It is stretching across the bottom of the picture, and its tip is pointing up toward the sky.","au":"s_977e98ab87","src":"Speak About the Photo・写真39"},{"id":"sphoto:38:from a window seat","m":"from a window seat","ja":"窓側の席から","g":"","s":"Judging from the angle of the photo, it seems that it was taken from a window seat.","au":"s_68e4197f09","src":"Speak About the Photo・写真39"}]},{"a":["In this picture, I can see {{a large bus parked in an open field in the evening}}.","The first thing I notice is {{the bus in the middle}}. {{It}} is {{shining its headlights}}, and {{small orange lights are glowing along the bottom}}.","On the left side, {{there is a wide, dark field with no buildings}}, and on the right side, {{snowy mountains stand far away}}. In the background, {{the sky is cloudy and gray-blue}}. {{There are some patches of snow on the ground in the front.}}","Judging from {{the snow and the dark sky}}, it seems that {{it is a cold winter evening}}. {{The passengers}} might be {{waiting inside before a night tour}}.","The whole scene looks {{cold and quiet}}. This picture reminds me of {{a ski trip I took by bus}}, because {{we also left very early when it was still dark}}."],"au":"m_sp_39","keys":[{"id":"sphoto:39:parked in an open field","m":"parked in an open field","ja":"広い野原に停まっている","g":"","s":"In this picture, I can see a large bus parked in an open field in the evening.","au":"s_58e652b476","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:glowing along the bottom","m":"glowing along the bottom","ja":"下の方に沿って光っている","g":"","s":"It is shining its headlights, and small orange lights are glowing along the bottom.","au":"s_1b4e8d534d","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:patches of snow","m":"patches of snow","ja":"まだらに残った雪","g":"","s":"There are some patches of snow on the ground in the front.","au":"s_77f3ccab56","src":"Speak About the Photo・写真40"},{"id":"sphoto:39:when it was still dark","m":"when it was still dark","ja":"まだ暗いうちに","g":"","s":"This picture reminds me of a ski trip I took by bus, because we also left very early when it was still dark.","au":"s_51a138a2dd","src":"Speak About the Photo・写真40"}]},{"a":["In this picture, I can see {{the front of a wooden boat on a calm lake}}.","The first thing I notice is {{the old wooden boat at the bottom of the picture}}. {{It}} is {{pointing toward the mountains}}, and {{its wooden boards look smooth and shiny}}.","On the left side, {{rocky cliffs are covered with green trees}}, and on the right side, {{a thick, dark forest comes down to the water}}. In the background, {{huge gray mountains rise under a white sky}}. {{The green water reflects the trees.}}","Judging from {{the angle of the photo}}, it seems that {{the photographer is sitting in the boat}}. {{He or she}} might be {{rowing slowly across the lake}}.","The whole scene looks {{fresh and calm}}. This picture reminds me of {{a travel video about the Alps}}, because {{it showed the same kind of green lake and gray mountains}}."],"au":"m_sp_40","keys":[{"id":"sphoto:40:pointing toward the mountains","m":"pointing toward the mountains","ja":"山の方を向いている","g":"point toward 【名】","s":"It is pointing toward the mountains, and its wooden boards look smooth and shiny.","au":"s_af923a669c","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:comes down to the water","m":"comes down to the water","ja":"水辺まで下りてくる","g":"","s":"On the left side, rocky cliffs are covered with green trees, and on the right side, a thick, dark forest comes down to the water.","au":"s_8410d93302","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:reflects the trees","m":"reflects the trees","ja":"木々を映す","g":"","s":"The green water reflects the trees.","au":"s_be3a6562d9","src":"Speak About the Photo・写真41"},{"id":"sphoto:40:rowing slowly across the lake","m":"rowing slowly across the lake","ja":"ゆっくりこいで湖を渡っている","g":"","s":"He or she might be rowing slowly across the lake.","au":"s_b1a1bc5ee2","src":"Speak About the Photo・写真41"}]},{"a":["In this picture, I can see {{a field of bright yellow and orange flowers}}.","The first thing I notice is {{the large flowers in the front}}. {{They}} are {{facing the sun}}, and {{their petals look soft and thin}}.","On the left side, {{the clear blue sky fills most of the space}}, and on the right side, {{the flowers are growing thickly together}}. In the background, {{some small white flowers and thin green stems are out of focus}}. {{The sunlight makes the petals almost glow.}}","Judging from {{the strong sunlight and the blue sky}}, it seems that {{it is a warm spring day}}. {{Bees}} might be {{flying around the flowers}}.","The whole scene looks {{bright and cheerful}}. This picture reminds me of {{a flower park I visited with my mother}}, because {{the whole hill was covered with yellow flowers}}."],"au":"m_sp_41","keys":[{"id":"sphoto:41:facing the sun","m":"facing the sun","ja":"太陽の方を向いている","g":"face 【名】","s":"They are facing the sun, and their petals look soft and thin.","au":"s_7ccc68154f","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:growing thickly together","m":"growing thickly together","ja":"びっしりと生えている","g":"","s":"On the left side, the clear blue sky fills most of the space, and on the right side, the flowers are growing thickly together.","au":"s_f4c09d5bbd","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:out of focus","m":"out of focus","ja":"ピントが合っていない","g":"","s":"In the background, some small white flowers and thin green stems are out of focus.","au":"s_932e9e0d3d","src":"Speak About the Photo・写真42"},{"id":"sphoto:41:makes the petals almost glow","m":"makes the petals almost glow","ja":"花びらをまるで光っているように見せる","g":"make 【名】 glow","s":"The sunlight makes the petals almost glow.","au":"s_89e05241e8","src":"Speak About the Photo・写真42"}]},{"a":["In this picture, I can see {{a sandy beach at sunset}}.","The first thing I notice is {{the small white waves in the front}}. {{They}} are {{washing onto the shore}}, and {{the wet sand is shining in the light}}.","On the left side, {{there are some palm trees on a small piece of land}}, and on the right side, {{the turquoise ocean stretches far away}}. In the background, {{the sun is going down near the horizon}}. {{Pink and orange clouds are floating in the sky.}}","Judging from {{the empty beach}}, it seems that {{most people have already gone home}}. {{A couple}} might be {{walking along the beach somewhere nearby}}.","The whole scene looks {{peaceful and romantic}}. This picture reminds me of {{a beach in Okinawa}}, because {{the water there is also turquoise and very clear}}."],"au":"m_sp_42","keys":[{"id":"sphoto:42:washing onto the shore","m":"washing onto the shore","ja":"岸に打ち寄せている","g":"wash onto 【名】","s":"They are washing onto the shore, and the wet sand is shining in the light.","au":"s_3cec4d7c0c","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:going down near the horizon","m":"going down near the horizon","ja":"水平線近くに沈んでいく","g":"","s":"In the background, the sun is going down near the horizon.","au":"s_9394c040bb","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:have already gone home","m":"have already gone home","ja":"もう帰ってしまった","g":"","s":"Judging from the empty beach, it seems that most people have already gone home.","au":"s_70a8389799","src":"Speak About the Photo・写真43"},{"id":"sphoto:42:somewhere nearby","m":"somewhere nearby","ja":"近くのどこかで","g":"","s":"A couple might be walking along the beach somewhere nearby.","au":"s_32e3ba25e1","src":"Speak About the Photo・写真43"}]},{"a":["In this picture, I can see {{a narrow stone street in an old Japanese town}}.","The first thing I notice is {{two people in kimonos in the middle}}. {{They}} are {{walking slowly along the street}}, and {{they are standing close together}}.","On the left side, {{there are traditional wooden houses with dark roofs}}, and on the right side, {{more old buildings have wooden walls and windows}}. In the background, {{a tall pagoda rises against the evening sky}}. {{Behind the houses, there is a bare tree with no leaves.}}","Judging from {{the pagoda and the kimonos}}, it seems that {{this is Kyoto}}. They might be {{enjoying a walk in rented kimonos}}.","The whole scene looks {{traditional and calm}}. This picture reminds me of {{my school trip to Kyoto}}, because {{we walked along a street just like this one}}."],"au":"m_sp_43","keys":[{"id":"sphoto:43:rises against the evening sky","m":"rises against the evening sky","ja":"夕空を背にそびえる","g":"rise against 【名】","s":"In the background, a tall pagoda rises against the evening sky.","au":"s_2233e2ca36","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:a bare tree with no leaves","m":"a bare tree with no leaves","ja":"葉のない裸の木","g":"","s":"Behind the houses, there is a bare tree with no leaves.","au":"s_9875f15222","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:in rented kimonos","m":"in rented kimonos","ja":"レンタル着物で","g":"","s":"They might be enjoying a walk in rented kimonos.","au":"s_5ed27cf77f","src":"Speak About the Photo・写真44"},{"id":"sphoto:43:just like this one","m":"just like this one","ja":"まさにこんな","g":"","s":"This picture reminds me of my school trip to Kyoto, because we walked along a street just like this one.","au":"s_52942a8859","src":"Speak About the Photo・写真44"}]},{"a":["In this picture, I can see {{a red pagoda on a green hill with a view of a snowy mountain}}.","The first thing I notice is {{the five-story pagoda on the right}}. {{It}} is {{standing among tall green trees}}, and {{it has red walls and dark green roofs}}.","On the left side, {{dark pine branches hang over the top of the picture}}, and on the right side, {{the tip of the pagoda points up into the sky}}. In the background, {{a snowy mountain stands above a large town}}. {{The mountain looks like Mount Fuji.}}","Judging from {{the snow on the mountain and the fresh green leaves}}, it seems that {{it is spring}}. {{Visitors}} might be {{taking photos from the top of the hill}}.","The whole scene looks {{peaceful and beautiful}}. This picture reminds me of {{the postcards sold at tourist shops in Japan}}, because {{they often show this exact view}}."],"au":"m_sp_44","keys":[{"id":"sphoto:44:with a view of","m":"with a view of","ja":"〜が見える","g":"with a view of 【名】","s":"In this picture, I can see a red pagoda on a green hill with a view of a snowy mountain.","au":"s_a007283041","src":"Speak About the Photo・写真45"},{"id":"sphoto:44:five-story pagoda","m":"five-story pagoda","ja":"五重塔","g":"","s":"The first thing I notice is the five-story pagoda on the right.","au":"s_4c8b85c8bb","src":"Speak About the Photo・写真45"},{"id":"sphoto:44:points up into the sky","m":"points up into the sky","ja":"空を指している","g":"","s":"On the left side, dark pine branches hang over the top of the picture, and on the right side, the tip of the pagoda points up into the sky.","au":"s_78f5036baa","src":"Speak About the Photo・写真45"},{"id":"sphoto:44:this exact view","m":"this exact view","ja":"まさにこの景色","g":"","s":"This picture reminds me of the postcards sold at tourist shops in Japan, b  stone building at dusk}}.","The first thing I notice is {{the round arches on the left}}. {{They}} are {{lit up with warm orange light}}, and {{they are arranged in several levels}}.","On the left side, {{the tallest part of the wall is still standing}}, and on the right side, {{part of the building is broken and lower}}. In the background, {{the sky is turning dark blue with soft clouds}}. {{In the front, there is a wide, empty path.}}","Judging from {{the empty path and the lights}}, it seems that {{the site has closed for the day}}. {{Tourists}} might be {{having dinner at restaurants nearby}}.","The whole scene looks {{historic and impressive}}. This picture reminds me of {{my world history textbook}}, because {{it had a photo of this building in the chapter about ancient Rome}}."],"au":"m_sp_46","keys":[{"id":"sphoto:46:lit up with warm orange light","m":"lit up with warm orange light","ja":"暖かいオレンジの光で照らされた","g":"be lit up with 【名】","s":"They are lit up with warm orange light, and they are arranged in several levels.","au":"s_ec16afcfbf","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:arranged in several levels","m":"arranged in several levels","ja":"何層にも並んでいる","g":"","s":"They are lit up with warm orange light, and they are arranged in several levels.","au":"s_ec16afcfbf","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:has closed for the day","m":"has closed for the day","ja":"その日の営業を終えた","g":"","s":"Judging from the empty path and the lights, it seems that the site has closed for the day.","au":"s_50f471e148","src":"Speak About the Photo・写真47"},{"id":"sphoto:46:in the chapter about","m":"in the chapter about","ja":"〜の章で","g":"","s":"This picture reminds me of my world history textbook, because it had a photo of this building in the chapter about ancient Rome.","au":"s_f790d41a2c","src":"Speak About the Photo・写真47"}]},{"a":["In this picture, I can see {{a tall iron tower next to a river at sunset}}.","The first thing I notice is {{the tower on the right}}. {{It}} is {{rising high above the trees}}, and {{its shape gets thinner toward the top}}.","On the left side, {{the cloudy sky is dark gray and purple}}, and on the right side, {{long white boats are parked along the riverbank}}. In the background, {{a bridge crosses the river}}. {{The water in the front is calm and reflects the pink sky.}}","Judging from {{the famous tower}}, it seems that {{this is Paris}}. {{People on the boats}} might be {{enjoying a dinner cruise}}.","The whole scene looks {{romantic and calm}}. This picture reminds me of {{a French movie I watched in English class}}, because {{it started with this same view of the river}}."],"au":"m_sp_47","keys":[{"id":"sphoto:47:rising high above the trees","m":"rising high above the trees","ja":"木々の上に高くそびえる","g":"","s":"It is rising high above the trees, and its shape gets thinner toward the top.","au":"s_b296961413","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:gets thinner toward the top","m":"gets thinner toward the top","ja":"上に行くほど細くなる","g":"","s":"It is rising high above the trees, and its shape gets thinner toward the top.","au":"s_b296961413","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:parked along the riverbank","m":"parked along the riverbank","ja":"川岸に沿って停まっている","g":"","s":"On the left side, the cloudy sky is dark gray and purple, and on the right side, long white boats are parked along the riverbank.","au":"s_5042d0ab58","src":"Speak About the Photo・写真48"},{"id":"sphoto:47:a dinner cruise","m":"a dinner cruise","ja":"ディナークルーズ","g":"","s":"People on the boats might be enjoying a dinner cruise.","au":"s_f243858bfc","src":"Speak About the Photo・写真48"}]},{"a":["In this picture, I can see {{an old stone bridge over a canal}}.","The first thing I notice is {{the white bridge in the middle}}. {{It}} is {{crowded with tourists}}, and {{it has a big arch in the center}}.","On the left side, {{there are old buildings with small windows}}, and on the right side, {{a water bus is sto const KEY='det_tpl_v1';
let S={box:{},last:{},log:[],days:[],fav:{},fbox:{}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j) S=Object.assign(S,j);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function markDay(){const t=today(); if(!S.days.includes(t)){S.days.push(t); if(S.days.length>400)S.days=S.days.slice(-400);} save();}
function streak(){const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const d=new Date();if(!S.days.includes(key(d)))d.setDate(d.getDate()-1);let n=0;while(S.days.includes(key(d))){n++;d.setDate(d.getDate()-1);}return n;}
const lid=(t,i)=>t.id+':'+i;
const boxOf=id=>S.box[id]||0;
function taskPct(t){const n=t.lines.length;let s=0;t.lines.forEach((l,i)=>s+=Math.min(boxOf(lid(t,i)),3)/3);return Math.round(s/n*100);}
function allLines(){const a=[];TASKS.forEach(t=>t.lines.forEach((l,i)=>a.push({t,l,i,id:lid(t,i)})));return a;}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tplHTML(t){return esc(t).replace(/【([^】]*)】/g,'<span class="bl">【$1】</span>');}
function exHTML(e){return esc(e).replace(/\{\{(.*?)\}\}/g,'<span class="fill">$1</span>').replace(/【([^】]*)】/g,'<span class="bl">【$1】</span>');}
const plain=e=>e.replace(/\{\{|\}\}/g,'').replace(/【[^】]*】/g,'');
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1600);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wc=s=>(s.trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;

/* 模範解答：{{…}}=緑の下線、重要表現＝黄色マーカー */
function keyHTML(raw,keys){
  const ch=[];let f=false;
  for(let i=0;i<raw.length;){if(raw.startsWith('{{',i)){f=true;i+=2;continue;}if(raw.startsWith('}}',i)){f=false;i+=2;continue;}ch.push({c:raw[i],f,k:false});i++;}
  const pl=ch.map(x=>x.c).join('');
  (keys||[]).forEach(k=>{const j=pl.indexOf(k.m);if(j>=0)for(let x=j;x<j+k.m.length;x++)ch[x].k=true;});
  let h='',cur=null,buf='';
  const flush=()=>{if(!buf)return;const c=(cur.f?'fill ':'')+(cur.k?'key':'');h+=c.trim()?'<span class="'+c.trim()+'">'+esc(buf)+'</span>':esc(buf);buf='';};
  ch.forEach(x=>{if(!cur||cur.f!==x.f||cur.k!==x.k){flush();cur=x;}buf+=x.c;});flush();return h;
}
const rolesOf=id=>TASKS.find(x=>x.id===id).lines.filter(l=>l.seq!==false).map(l=>l.r);

}

/* 音声：edge-tts で事前に作った mp3（例文=Andrew・質問=Ava・会話=話者ごと）を1つの <audio> で鳴らす */
const AUD=new Audio(); AUD.preload='auto';
let audDone=null, audOK=false;
function unlockAud(){if(audOK)return;audOK=true;try{const p=AUD.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
document.addEventListener('touchend',unlockAud,{capture:true,once:true});
document.addEventListener('click',unlockAud,{capture:true,once:true});
function ttsFallback(text,res){if(!text||!window.speechSynthesis){res();return;}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=RATE;u.onend=res;u.onerror=res;speechSynthesis.speak(u);}
function play(key,text){stopSpeak();return new Promise(res=>{let fin=false;const done=()=>{if(fin)return;fin=true;audDone=null;res();};audDone=done;
  AUD.onended=done;AUD.onerror=()=>{if(fin)return;ttsFallback(text,done);};
  AUD.src='audio/'+key+'.mp3';AUD.playbackRate=RATE;try{AUD.defaultPlaybackRate=RATE;}catch(e){}
  const p=AUD.play();if(p&&p.catch)p.catch(()=>{if(!fin)ttsFallback(text,done);});});}
function stopSpeak(){try{AUD.pause();}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();if(audDone){const d=audDone;audDone=null;d();}}

/* 穴あけ：テンプレの黒字（空欄以外）の単語を隠す */
function tokens(t){const out=[];t.split(/(【[^】]*】)/).forEach(seg=>{if(!seg)return;if(/^【/.test(seg)){out.push({b:seg});return;}seg.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){out.push({s:w});return;}const m=w.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'’-]*)([^A-Za-z]*)$/);if(m)out.push({pre:m[1],w:m[2],post:m[3]});else out.push({s:w});});});return out;}
function makeHidden(toks,level){const idx=toks.map((x,i)=>x.w?i:-1).filter(i=>i>=0);const k=level>=3?idx.length:Math.max(1,Math.ceil(idx.length*(level===1?0.35:0.7)));const sorted=idx.slice().sort((a,b)=>(toks[b].w.length+Math.random()*3)-(toks[a].w.length+Math.random()*3));return new Set(sorted.slice(0,k));}
function clozeHTML(toks,hidden,opened,level){return toks.map((x,i)=>{if(x.b)return '<span class="bl">'+esc(x.b)+'</span>';if(x.s!==undefined)return esc(x.s);if(!hidden.has(i)||opened.has(i))return esc(x.pre)+'<span'+(hidden.has(i)?' class="hw open"':'')+'>'+esc(x.w)+'</span>'+esc(x.post);const hint=level===1?x.w[0]+'·'.repeat(Math.max(0,x.w.length-1)):' '.repeat(Math.max(2,Math.round(x.w.length*1.1)));return esc(x.pre)+'<span class="hw'+(level===1?' hint':'')+'" data-i="'+i+'">'+esc(hint)+'</span>'+esc(x.post);}).join('');}
const autoLevel=b=>b<=0?1:b<=2?2:3;
const LVNAME={1:'Lv1 頭文字あり',2:'Lv2 半分以上かくす',3:'Lv3 全部かくす（役割だけ）'};

/* 穴埋め（1行ずつ・自己採点） */
function clozeSession(el,items,opts){
  // items: [{t,l,i,id}]
  let q=items.slice(), n=0, total=items.length, again=[];
  let lvSel=opts.level||0; // 0=おまかせ
  function next(){
    if(!q.length && again.length){q=again;again=[];}
    if(!q.length){finish();return;}
    const it=q.shift();n++;
    const level=lvSel||autoLevel(boxOf(it.id));
    const toks=tokens(it.l.t), hidden=makeHidden(toks,level), opened=new Set();
    let shown=false;
    const draw=()=>{
      let h='<div class="row"><span class="prog">'+(n>total?'やり直し（×の行をもう一度）':n+' / '+total)+'</span>'+(opts.showLevelSel?'<select class="sel right" id="lv"><option value="0">おまかせ</option><option value="1">Lv1</option><option value="2">Lv2</option><option value="3">Lv3</option></select>':'')+'</div>';
      h+='<div class="card"><div class="muted">'+esc(it.t.icon+' '+it.t.name)+'　'+LVNAME[level]+'</div><div style="margin:6px 0"><span class="role">'+esc(it.l.r)+'</span></div>';
      h+='<div class="tpl big" id="cz">'+clozeHTML(toks,hidden,opened,level)+'</div>';
      h+='<div class="muted" style="margin-top:8px">声に出して全文を言ってから、グレーをタップ（1語ずつ）か「答え」。</div>';
      if(shown){h+='<div class="ex" style="margin-top:10px"><button class="spk" id="spk1">🔊</button>'+exHTML(it.l.e)+'</div><div class="rate"><button class="r1" data-r="1">◎ 言えた</button><button class="r2" data-r="2">△ あいまい</button><button class="r3" data-r="3">× まだ</button></div>';}
      else h+='<div class="row" style="margin-top:12px"><button class="pri" id="ans" style="flex:1;padding:12px">答え</button></div>';
      h+='</div>';
      el.innerHTML=h;
      if(opts.showLevelSel){$('#lv').value=String(lvSel);$('#lv').onchange=e=>{lvSel=+e.target.value;q.unshift(it);n--;next();};}
      $('#cz').onclick=e=>{const w=e.target.closest('.hw[data-i]');if(!w)return;opened.add(+w.dataset.i);if(opened.size>=hidden.size)shown=true;draw();};
      if(!shown){$('#ans').onclick=()=>{hidden.forEach(i=>opened.add(i));shown=true;draw();};}
      else{
        $('#spk1').onclick=()=>play('ex_'+it.t.id+'_'+it.i,plain(it.l.e));
        el.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{
          const r=+b.dataset.r, b0=boxOf(it.id);
          S.box[it.id]= r===1?Math.min(b0+1,5): r===2?Math.max(b0,0): 0;
          S.last[it.id]=today(); markDay();
          if(r===3) again.push(it);
          next();
        });
      }
    };
    draw();
  }
  function finish(){
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おわり</div><div class="muted">'+total+' 行を確認しました</div></div>';
    h+='<div class="card">'+items.map(it=>{const b=boxOf(it.id);const c=b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)';return '<div class="ln"><span class="role" style="color:'+c+'">'+(b>=3?'覚えた':b>=1?'もう少し':'まだ')+'</span><span class="tpl" style="font-size:15px">'+tplHTML(it.l.t)+'</span></div>';}).join('')+'</div>';
    h+='<div class="hero"><button class="pri" id="again">もう一回</button><button id="home">ホームへ</button></div>';
    el.innerHTML=h;
    $('#again').onclick=opts.restart;$('#home').onclick=()=>go({view:'home'});
  }
  next();
}

    const c=[0,0,0];L.forEach(k=>{const b=fbox(k.id);c[b>=3?0:b>=1?1:2]++;});
    el.innerHTML='<div class="card"><div class="stats"><span>覚えた <b>'+c[0]+'</b></span><span>もう少し <b>'+c[1]+'</b></span><span>まだ <b>'+c[2]+'</b></span></div></div><div class="card"><ul class="kl">'+L.map(k=>{const b=fbox(k.id);
      return '<li><button class="star" data-del="'+esc(k.id)+'" aria-label="お気に入りから外す">★</button><div class="kb"><div class="ken">'+tplHTML(k.g||k.m)+'</div><div class="kja">'+esc(k.ja)+'</div><div class="ex" style="margin-top:3px">'+keyHTML(k.s,[k])+'</div><div class="muted" style="font-size:12px;margin-top:2px">'+esc(k.src)+'　<span style="color:'+(b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)')+'">'+fboxLabel(b)+'</span></div></div><button class="spk" data-au="'+esc(k.au)+'" data-tx="'+esc(k.s)+'" aria-label="文を聞く">🔊</button></li>';}).join('')+'</ul></div>';
    el.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>play(b.dataset.au,b.dataset.tx));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('この表現をお気に入りから外しますか？'))return;delete S.fav[b.dataset.del];save();renderFav();});
    return;
  }
  favReview(el);
}
function favReview(el){
  const pickSet=()=>shuffle(favList()).sort((a,b)=>fbox(a.id)-fbox(b.id)||(S.last['f:'+a.id]||'').localeCompare(S.last['f:'+b.id]||'')).slice(0,10);
  let q=pickSet(), items=q.slice(), total=q.length, n=0, again=[];
  function next(){
    if(!q.length&&again.length){q=again;again=[];}
    if(!q.length){done();return;}
    const k=q.shift();n++;let shown=false;
    const draw=()=>{
      let h='<div class="row"><span class="prog">'+(n>total?'やり直し（×をもう一度）':n+' / '+total)+'</span></div><div class="card"><div class="muted">'+esc(k.src)+'</div>';
      h+='<div class="big" style="font-weight:700;margin:6px 0 10px">'+esc(k.ja)+'</div>';
      h+='<div style="font-size:16.5px;line-height:1.8">'+(shown?keyHTML(k.s,[k]):maskHTML(k.s,k.m))+'</div>';
      if(!shown) h+='<div class="muted" style="margin-top:8px">グレーの部分を声に出して言ってから「答え」。</div><div class="row" style="margin-top:12px"><button class="pri" id="ans" style="flex:1;padding:12px">答え</button></div>';
      else h+='<div class="row" style="margin-top:10px"><span class="ken">'+tplHTML(k.g||k.m)+'</span><button class="spk right" id="sp" aria-label="文を聞く">🔊</button></div><div class="rate"><button class="r1" data-r="1">◎ 言えた</button><button class="r2" data-r="2">△ あいまい</button><button class="r3" data-r="3">× まだ</button></div>';
      h+='</div>';el.innerHTML=h;
      if(!shown){$('#ans').onclick=()=>{shown=true;draw();play(k.au,k.s);};}
      else{$('#sp').onclick=()=>play(k.au,k.s);
        el.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,b0=fbox(k.id);
          S.fbox[k.id]=r===1?Math.min(b0+1,5):r===2?b0:0;S.last['f:'+k.id]=today();markDay();
          if(r===3)again.push(k);next();});}
    };
    draw();
  }
  function done(){
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おわり</div><div class="muted">'+total+' 個を復習しました</div></div>';
    h+='<div class="card"><ul class="kl">'+items.map(k=>{const b=fbox(k.id);return '<li><span class="role" style="color:'+(b>=3?'var(--ok)':b>=1?'var(--mid)':'var(--ng)')+'">'+fboxLabel(b)+'</span><div class="kb"><div class="ken">'+tplHTML(k.g||k.m)+'</div><div class="kja">'+esc(k.ja)+'</div></div></li>';}).join('')+'</ul></div>';
    h+='<div class="hero"><button class="pri" id="again">もう一回</button><button id="toList">一覧へ</button></div>';
    el.innerHTML=h;$('#again').onclick=()=>favReview(el);$('#toList').onclick=()=>{V.ftab='list';renderFav();};
  }
  next();
}

/* 並べ替え */
function tabOrder(t,el){
  const seq=t.lines.map((l,i)=>({l,i})).filter(x=>x.l.seq!==false);
  let pool=shuffle(seq), done=[], miss=0;
  if(seq.length>2) while(pool.every((x,k)=>x.i===seq[k].i)) pool=shuffle(seq);
  const draw=()=>{
    let h='<div class="card"><div class="muted">テンプレの行を、答えの順番どおりにタップ。（'+esc(t.skel)+'）</div></div>';
    h+='<div class="card done">'+(done.length?done.map(x=>'<div class="ln"><span class="role">'+esc(x.l.r)+'</span><span class="tpl" style="font-size:15.5px">'+tplHTML(x.l.t)+'</span></div>').join(''):'<div class="muted">ここに並びます</div>')+'</div>';
    if(pool.length) h+='<div class="pool">'+pool.map((x,k)=>'<button class="opt" data-k="'+k+'">'+tplHTML(x.l.t)+'</button>').join('')+'</div>';
    else h+='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">'+(miss?'ミス '+miss+' 回':'全部正解！')+'</div></div><div class="hero"><button class="pri" id="re">もう一回</button><button id="toCloze">穴埋めへ</button></div>';
    el.innerHTML=h;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const x=pool[+b.dataset.k];const need=seq[done.length];if(x.i===need.i){done.push(x);pool.splice(+b.dataset.k,1);draw();if(!pool.length)markDay();}else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}});
    if(!pool.length){$('#re').onclick=()=>tabOrder(t,el);$('#toCloze').onclick=()=>{V.tab='cloze';renderTask(t);};}
  };
  draw();
}

/* ---------- 本番練習 ---------- */
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function runTimer(el,phases,onPhase,onDone){
  // phases: [{name,sec}]
  let k=0, end=0;
  const start=()=>{const p=phases[k];end=Date.now()+p.sec*1000;onPhase&&onPhase(k,p);tick();};
  const tick=()=>{const left=(end-Date.now())/1000;const p=phases[k];el.innerHTML='<div class="phase">'+esc(p.name)+'</div><div class="timer'+(left<=10?' warn':'')+'">'+fmt(left)+'</div>';if(left<=0){k++;if(k<phases.length)start();else{clearInterval(timerH);timerH=null;onDone&&onDone();}}};
  clearInterval(timerH);timerH=setInterval(tick,250);start();
  return {skip:()=>{end=Date.now();tick();}};
}
function tplHint(t){return '<details><summary>テンプレを見る（ヒント）</summary>'+t.lines.map(l=>'<div class="ln"><span class="role">'+esc(l.r)+'</span><span style="font-size:14.5px">'+tplHTML(l.t)+'</span></div>').join('')+'</details>';}
function checkList(t){return '<div class="chk"><div class="muted">使えた型にチェック</div>'+t.lines.filter(l=>l.seq!==false).map(l=>'<label><input type="checkbox"><span><span class="role">'+esc(l.r)+'</span>'+tplHTML(l.t)+'</span></label>').join('')+'</div>';}
function modelText(t){return t.lines.filter(l=>l.seq!==false).map(l=>exHTML(l.e)).join(' ');}
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('この端末では録音できません');return null;}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const r=new MediaRecorder(st);r.ondataavailable=e=>chunks.push(e.data);r._done=new Promise(res=>r.onstop=()=>{st.getTracks().forEach(x=>x.stop());res(URL.createObjectURL(new Blob(chunks,{type:r.mimeType||'audio/mp4'})));});r.start();return r;}catch(e){toast('マイクが使えませんでした');return null;}
}
function logPractice(t,words){S.log.push({d:today(),t:t.id,w:words});if(S.log.length>500)S.log=S.log.slice(-500);markDay();}

function tabPrac(t,el){
  const P=t.practice, k=P.kind;
  let prompt='', promptHTML='', photoId=pick(PHOTOS), dlg=null, dlgI=0, iwPair=null, isSet=null, isI=0, pI=0;
  const rnd=a=>Math.floor(Math.random()*a.length);
  const newPrompt=()=>{
    {let x;do{x=pick(PHOTOS);}while(x===photoId&&PHOTOS.length>1);photoId=x;}
    if(k==='iw'){pI=rnd(PROMPTS.iw);iwPair=PROMPTS.iw[pI];}
    if(k==='wsamp'){pI=rnd(PROMPTS.wsamp);prompt=PROMPTS.wsamp[pI];}
    if(k==='ssamp'){pI=rnd(PROMPTS.ssamp);prompt=PROMPTS.ssamp[pI];}
    if(k==='rts'){pI=rnd(PROMPTS.rts);const r=PROMPTS.rts[pI];prompt=r[0];promptHTML='<div class="prompt">'+esc(r[0])+'<ul>'+r[1].map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>';}
    if(k==='ispk'){isI=Math.floor(Math.random()*PROMPTS.ispk.length);isSet=PROMPTS.ispk[isI];}
    if(k==='summ'){dlgI=Math.floor(Math.random()*PROMPTS.summ.length);dlg=PROMPTS.summ[dlgI];}
  };
  newPrompt();
  const useRec=()=>P.speak?'<label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="recOn"> 録音して聞き返す</label>':'';
  function intro(){
    let h='<div class="card"><div class="muted">本番と同じ時間で練習します。'+(P.prep?'準備 '+P.prep+'秒 → ':'')+'解答 '+fmt(P.ans)+(P.ans2?' → Step 2 '+fmt(P.ans2):'')+'　｜　目安 '+t.words[0]+'〜'+t.words[1]+'語</div></div>';
    h+='<div class="card">';
    if(k==='photo') h+='<img class="photo" id="ph" alt="練習用の写真" src="'+photoURL(photoId)+'">';
    if(k==='iw') h+='<div class="muted">Step 1</div><div class="prompt">'+esc(iwPair[0])+'</div>';
    if(k==='wsamp'||k==='ssamp') h+='<div class="prompt">'+esc(prompt)+'</div>';
    if(k==='rts') h+=promptHTML;
    if(k==='ispk') h+='<div class="prompt">話題：<b>'+esc(isSet[0])+'</b>（3問）</div><div class="muted">質問は音声で1回だけ流れます。読み終わると35秒スタート。</div><label class="row" style="gap:6px;font-size:14px;margin-top:6px"><input type="checkbox" id="showQ"> 質問の文字も出す（慣れるまで）</label>';
    if(k==='summ') h+='<div class="prompt">会話を聞いて、75秒で要約を書きます。</div><div class="muted">'+esc(dlg.who.join(' と '))+' の会話。本番と同じく、まず1回だけ聞いてください。</div>';
    h+='</div>';
    h+='<div class="card row">'+useRec()+'<button class="right" id="newP">別のお題</button></div>';
    h+='<div class="hero"><button class="pri" id="go">'+(k==='summ'?'▶ 会話を聞く':'スタート')+'</button></div>';
    h+='<div class="card">'+tplHint(t)+'</div>';
    el.innerHTML=h;
    $('#newP').onclick=()=>{newPrompt();intro();};
    $('#go').onclick=()=>{const ro=$('#recOn');run(ro&&ro.checked);};
    const ph=$('#ph'); if(ph) ph.onerror=()=>{ph.replaceWith(Object.assign(document.createElement('div'),{className:'muted',textContent:'写真を読み込めませんでした（オフライン？）。「別のお題」で再読み込み。'}));};
  }
  async function run(recOn){
    const writing=!P.speak;
    let area='', h='<div class="card" id="pr"></div><div class="card"><div id="tm"></div><div class="row" style="justify-content:center;margin-top:6px"><button id="skip">次へ ▶</button></div></div>';
    if(writing) h+='<div class="card"><textarea id="ta" placeholder="ここに英語で書く" autocapitalize="sentences" spellcheck="false"></textarea><div class="wc" id="wc">0 語</div></div>';
    h+='<div class="card">'+tplHint(t)+'</div>';
    el.innerHTML=h;
    const pr=$('#pr');
    if(k==='photo') pr.innerHTML='<img class="photo" alt="練習用の写真" src="'+photoURL(photoId)+'">';
    if(k==='iw') pr.innerHTML='<div class="muted">Step 1</div><div class="prompt">'+esc(iwPair[0])+'</div>';
    if(k==='wsamp'||k==='ssamp') pr.innerHTML='<div class="prompt">'+esc(prompt)+'</div>';
    if(k==='rts') pr.innerHTML=promptHTML;
    const ta=$('#ta'), wcEl=$('#wc');
    if(ta) ta.oninput=()=>{const n=wc(ta.value);wcEl.textContent=n+' 語（目安 '+t.words[0]+'〜'+t.words[1]+'）';wcEl.classList.toggle('ok',n>=t.words[0]);};
    let step1Text='';
    if(k==='summ'){
      pr.innerHTML='<div class="muted">会話を再生中…</div>';$('#tm').innerHTML='';$('#skip').style.display='none';
      for(let i=0;i<dlg.lines.length;i++){const [w,s]=dlg.lines[i];pr.innerHTML='<div class="muted">会話を再生中… '+(i+1)+' / '+dlg.lines.length+'</div><div class="dlg"><b>'+esc(dlg.who[w])+'</b></div>';await play('dlg_'+dlgI+'_'+i,s);if(V.view!=='task'||V.tab!=='prac')return;await new Promise(r=>setTimeout(r,400));}
      pr.innerHTML='<div class="prompt">今の会話を要約してください（75秒）。</div>';$('#skip').style.display='';
    }
    if(k==='ispk'){ await runIS(recOn); return; }
    let phases=[];
    if(P.prep) phases.push({name:'準備',sec:P.prep});
    phases.push({name:k==='iw'?'Step 1 解答':'解答',sec:P.ans});
    if(k==='iw') phases.push({name:'Step 2 解答',sec:P.ans2});
    let r=null;
    const T=runTimer($('#tm'),phases,async(i,p)=>{
      if(/解答/.test(p.name)&&ta){ta.disabled=false;ta.focus();}
      if(p.name==='準備'&&ta) ta.disabled=true;
      if(p.name==='Step 2 解答'){step1Text=ta.value;ta.value='';ta.oninput();pr.innerHTML='<div class="muted">Step 2（1回目の内容につなげる）</div><div class="prompt">'+esc(iwPair[1])+'</div><details><summary>Step 1 の自分の答え</summary><div class="ex">'+esc(step1Text)+'</div></details>';}
      if(p.name==='解答'&&recOn&&P.speak){r=await startRec();rec=r;}
    },()=>finish(r,step1Text));
    $('#skip').onclick=()=>T.skip();
  }
  async function runIS(recOn){
    const pr=$('#pr'); let r=null; if(recOn){r=await startRec();rec=r;}
    for(let qi=0;qi<isSet[1].length;qi++){
      const q=isSet[1][qi], showQ=$('#showQ')?$('#showQ').checked:false;
      pr.innerHTML='<div class="muted">質問 '+(qi+1)+' / '+isSet[1].length+'（話題：'+esc(isSet[0])+'）</div><div class="prompt" style="'+(showQ?'':'filter:blur(6px)')+'" id="qtx">'+esc(q)+'</div><div class="muted">質問の文字は答えのあとで見られます。</div>';
      $('#tm').innerHTML='<div class="phase">質問を再生中…</div><div class="timer">0:35</div>';
      await play('is_'+isI+'_'+qi,q);
      if(V.view!=='task'||V.tab!=='prac')return;
      await new Promise(res=>{const T=runTimer($('#tm'),[{name:'解答',sec:P.ans}],null,res);$('#skip').onclick=()=>T.skip();});
      if(V.view!=='task'||V.tab!=='prac')return;
    }
    finish(r,'');
  }
  /* 答え合わせ：模範解答（テンプレの役割つき）＋重要表現 */
  function answerCard(){
    const note='<div class="note">緑の下線＝お題ごとに入れかえる部分、黒字＝テンプレのまま、<span class="key">黄色</span>＝使い回せる重要表現。</div>';
    const card=x=>'<div class="card">'+x+'</div>';
    if(k==='photo'){
      const pi=PHOTOS.indexOf(photoId), img='<img class="photo" alt="今回の写真" src="'+photoURL(photoId)+'" style="margin-bottom:10px">';
      if(P.speak){const m=(MODELS.sphoto||[])[pi];if(!m)return '';
        const A=PHOTO_ANS[pi], wk=(MODELS.wphoto||[])[pi]||[];
        return card(img+modelHTML('模範解答（話す・テンプレどおり）',m.a,rolesOf('sphoto'),m.keys,m.au)+note+keysHTML(m.keys)
          +(A?'<details style="margin-top:12px"><summary>書くとき（Write About the Photo）の短い版</summary>'+modelHTML('5文・書く版',A,rolesOf('wphoto'),wk,'ans_'+pi)+keysHTML(wk)+'</details>':''));}
      const A=PHOTO_ANS[pi];if(!A)return '';const wk=(MODELS.wphoto||[])[pi]||[];
      return card(img+modelHTML('模範解答（テンプレどおり）',A,rolesOf('wphoto'),wk,'ans_'+pi)+note+keysHTML(wk));
    }
    if(k==='iw'){const m=(MODELS.iw||[])[pI];if(!m)return '';
      return card('<div class="mq">Step 1：'+esc(iwPair[0])+'</div>'+modelHTML('模範解答 Step 1',m.s1,rolesOf('iw1'),m.keys,m.au1)
        +'<div class="mq">Step 2：'+esc(iwPair[1])+'</div>'+modelHTML('模範解答 Step 2',m.s2,rolesOf('iw2'),m.keys,m.au2)+note+keysHTML(m.keys));}
    if(k==='wsamp'||k==='rts'||k==='ssamp'){const m=(MODELS[k]||[])[pI];if(!m)return '';
      const tid=m.tpl||t.id;
      return card('<div class="mq">'+esc(prompt)+'</div>'+modelHTML('模範解答（テンプレどおり）',m.a,rolesOf(tid),m.keys,m.au)+note
        +(m.tpl?'<div class="note">意見型のお題なので、Interactive Writing Step 1 の型を1文ずつ長くして書いています。</div>':'')+keysHTML(m.keys));}
    if(k==='ispk'){const m=(MODELS.ispk||[])[isI];if(!m)return '';
      return card(isSet[1].map((q,qi)=>'<div class="mq">Q'+(qi+1)+'. '+esc(q)+' <button class="spk" data-au="is_'+isI+'_'+qi+'" data-tx="'+esc(q)+'" aria-label="質問を聞く">🔊</button></div>'
        +(m.a[qi]?modelHTML('模範解答',m.a[qi],rolesOf('ispk'),m.keys,m.au[qi]):'')).join('')+note+keysHTML(m.keys));}
    if(k==='summ'){const m=(MODELS.summ||[])[dlgI];
      const scr='<details><summary>会話のスクリプト</summary>'+dlg.lines.map(([w,s])=>'<div class="dlg"><b>'+esc(dlg.who[w])+'：</b>'+esc(s)+'</div>').join('')+'</details>';
      if(!m)return card(scr+'<details><summary>要約の例</summary><div class="ex">'+esc(dlg.model)+'</div></details>');
      return card(modelHTML('要約の模範解答（テンプレどおり）',m.a,rolesOf('summ'),m.keys,m.au)+note+keysHTML(m.keys)+'<div style="margin-top:10px">'+scr+'</div>');}
    return '';
  }
  async function finish(r,step1Text){
    clearInterval(timerH);timerH=null;
    const ta=$('#ta'); const txt=ta?ta.value:'';
    const n=wc(txt)+wc(step1Text||'');
    let h='<div class="card" style="text-align:center"><div class="big" style="font-weight:700">おつかれさま</div>';
    if(!P.speak){const n1=k==='iw'?wc(step1Text):wc(txt);h+='<div class="muted">'+(k==='iw'?'Step 1：'+wc(step1Text)+' 語 ／ Step 2：'+wc(txt)+' 語':'書いた語数：'+n1+' 語（目安 '+t.words[0]+'〜'+t.words[1]+'）')+'</div>';}
    h+='</div>';
    if(r){const url=await r._done;h+='<div class="card"><div class="muted">録音</div><audio controls src="'+url+'" style="width:100%"></audio></div>';}
    if(k==='iw'&&step1Text) h+='<div class="card"><div class="muted">Step 1 の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(step1Text)+'</div><div class="muted" style="margin-top:8px">Step 2 の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(txt)+'</div></div>';
    else if(txt) h+='<div class="card"><div class="muted">自分の答え</div><div style="white-space:pre-wrap;font-size:15px">'+esc(txt)+'</div></div>';
    h+=answerCard();
    h+='<div class="card">'+checkList(t)+'</div>';
    h+='<div class="hero"><button class="pri" id="again2">別のお題で</button><button id="toSee">テンプレを見直す</button></div>';
    el.innerHTML=h;
    logPractice(t,n);
    bindModel(el);
    $('#again2').onclick=()=>{newPrompt();intro();};
    $('#toSee').onclick=()=>{V.tab='see';renderTask(t);};
  }
  intro();
}

render();
