<!DOCTYPE html>
<html lang="ja">
<head>

<title>Santa 総合テスト（穴埋め・選択肢／並べ替え・誤り訂正／自由記述・マッチング）</title>
<style>
  :root {
    --bg: #f4f6fb; --card-bg: #ffffff; --text: #1f2430; --muted: #6b7280;
    --primary: #4f6df5; --primary-dark: #3b52c4; --border: #e2e6f0;
    --correct: #1f9d55; --incorrect: #e3453a; --chip-bg: #eef1fb;
    --new-bg: linear-gradient(135deg,#ff8a3d,#ff4d6d); --shadow: 0 2px 10px rgba(30,40,80,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141c; --card-bg:#1b1e29; --text:#e7e9f2; --muted:#9aa0b4;
      --primary:#7b93ff; --primary-dark:#5b74e6; --border:#2b2f3d; --chip-bg:#232838;
      --shadow: 0 2px 14px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 4px 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: .92rem; margin-bottom: 20px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .format-grid, .mode-grid { display:grid; gap:14px; }
  .format-card, .mode-card { background: var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:18px; box-shadow: var(--shadow); }
  .format-card .emoji, .mode-card .emoji { font-size:1.6rem; margin-right:6px; }
  .format-card h3, .mode-card h3 { margin: 0 0 6px; font-size:1.05rem; }
  .format-card p, .mode-card p { margin: 0 0 10px; color: var(--muted); font-size:.9rem; }
  button { font-family: inherit; cursor: pointer; }
  .btn { display:inline-block; background: var(--primary); color:#fff; border:none; border-radius:10px;
    padding: 10px 18px; font-size: .95rem; font-weight:600; transition: background .15s; }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background:#a9afc2; cursor:not-allowed; }
  .btn.secondary { background: var(--chip-bg); color: var(--text); }
  .btn.secondary:hover { background: var(--border); }
  .btn.block { width:100%; }
  .link-btn { background:none; border:none; color: var(--primary); font-size:.9rem; padding:0; text-decoration:underline; }
  .badge { display:inline-block; background: var(--chip-bg); color: var(--text); border-radius:999px;
    padding: 3px 10px; font-size: .75rem; font-weight:600; margin-right:6px; }
  .badge-new { background: var(--new-bg); color:#fff; font-weight:700; }
  .top-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; font-size:.85rem;}
  .progress-bar { height:6px; background: var(--chip-bg); border-radius:4px; overflow:hidden; margin: 8px 0 18px;}
  .progress-fill { height:100%; background: var(--primary); transition: width .2s; }
  .qtext { font-size: 1.08rem; margin: 14px 0; }
  .hint { color: var(--muted); font-size: .92rem; background: var(--chip-bg); border-radius: 10px; padding: 10px 12px; margin-bottom:14px;}
  input[type=text], textarea { width:100%; padding: 10px 12px; border-radius: 10px; border:1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 1rem; margin-bottom: 12px; }
  textarea { min-height: 90px; resize: vertical; }
  .choice-list label { display:block; background: var(--chip-bg); border-radius:10px; padding:10px 14px;
    margin-bottom:8px; cursor:pointer; }
  .choice-list input { margin-right: 8px; }
  .tile-area { display:flex; flex-wrap:wrap; gap:8px; min-height: 46px; border:1px dashed var(--border);
    border-radius:10px; padding:10px; margin-bottom:10px; }
  .tile-pool { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 12px; }
  .tile { background: var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:.95rem; }
  .tile.placed { background: var(--chip-bg); color: var(--text); border:1px solid var(--border); }
  .placeholder-text { color: var(--muted); font-size:.88rem; }
  .match-cols { display:flex; gap:14px; }
  .match-col { flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-btn { display:block; width:100%; text-align:left; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background: var(--chip-bg); color: var(--text); font-size:.92rem; }
  .match-btn.selected { border-color: var(--primary); background: rgba(79,109,245,.15); }
  .match-btn.paired { opacity:.55; }
  .match-btn.correct-pair { border-color: var(--correct); }
  .match-btn.wrong-pair { border-color: var(--incorrect); }
  .feedback { border-radius: 12px; padding: 16px; margin-top: 16px; }
  .feedback.correct { background: rgba(31,157,85,.12); border:1px solid rgba(31,157,85,.4); }
  .feedback.incorrect { background: rgba(227,69,58,.1); border:1px solid rgba(227,69,58,.4); }
  .feedback .res-line { font-weight:700; margin-bottom:6px; }
  .play-btn { background: var(--chip-bg); border:1px solid var(--border); color: var(--text); border-radius: 999px;
    padding: 6px 14px; font-size:.85rem; margin: 6px 0; }
  .play-btn.playing { background: var(--primary); color:#fff; }
  .source-thumb { width:96px; height:96px; object-fit:cover; border-radius:8px; margin:6px 6px 0 0; cursor:zoom-in;
    border:1px solid var(--border); }
  .img-modal { position:fixed; inset:0; background: rgba(0,0,0,.82); display:flex; align-items:center;
    justify-content:center; z-index:999; }
  .img-modal.hidden { display:none; }
  .img-modal img { max-width:92%; max-height:92%; border-radius:8px; }
  .img-modal-close { position:absolute; top:18px; right:26px; color:#fff; font-size:2rem; cursor:pointer; }
  .rowline { display:flex; justify-content: space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .trash-link { color: var(--incorrect); font-size: .82rem; }
  .footer-links { text-align:center; margin-top: 20px; font-size:.9rem; }
  ul.check-list { list-style:none; padding:0; margin:0; }
  ul.check-list li { background: var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; }
  .star { color: #f0a500; }
  .stars-row { font-size:1.6rem; margin: 8px 0 16px; }
  .small-muted { color: var(--muted); font-size:.82rem; }
  .cat-btn { background: var(--chip-bg); border:1px solid var(--border); color: var(--text); border-radius:10px;
    padding:8px 14px; margin: 4px 4px 0 0; font-size:.9rem; }
  .cat-btn.selected { border-color: var(--primary); background: rgba(79,109,245,.15); }
</style>
</head>

let _reviewSyncDocRef = null;
function reviewSyncGetId() {
  let id = localStorage.getItem('aien_sync_id');
  if (id === null) {
    const input = prompt('復習リストを他の端末（PC/スマホ）と共有する場合は、合言葉を入力してください。\n全ての端末で同じ言葉を入力すると復習リストが共有されます。\n共有しない場合は空欄のままOKしてください。', '');
    id = (input && input.trim()) ? input.trim() : '__none__';
    localStorage.setItem('aien_sync_id', id);
  }
  return id === '__none__' ? null : id;
}
function changeSyncId() {
  const current = localStorage.getItem('aien_sync_id');
  const input = prompt('復習リストを他の端末と共有するための合言葉を入力してください(全端末で同じ言葉にしてください)。\n共有をやめる場合は空欄のままOKしてください。', (current && current !== '__none__') ? current : '');
  if (input === null) return;
  localStorage.setItem('aien_sync_id', input.trim() ? input.trim() : '__none__');
  location.reload();
}
function reviewSyncStatusLabel() {
  const id = localStorage.getItem('aien_sync_id');
  return (id && id !== '__none__') ? `共有ON（合言葉: ${id}）` : '共有OFF';
}
async function initReviewSync() {
  try {
    const syncId = reviewSyncGetId();
    if (!syncId) return;
    if (!window._reviewSyncApp) window._reviewSyncApp = firebase.initializeApp(REVIEW_SYNC_CONFIG);
    const db = firebase.firestore();
    const docRef = db.collection('reviewLists').doc(syncId + '__' + REVIEW_SYNC_TEST_ID);
    const snap = await Promise.race([
      docRef.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    if (snap && snap.exists) {
      const data = snap.data();
      REVIEW_SYNC_KEYS.forEach(key => {
        if (Array.isArray(data[key])) localStorage.setItem(key, JSON.stringify(data[key]));
      });
    }
    _reviewSyncDocRef = docRef;
  } catch (e) {
    console.warn('復習リストのクラウド同期に失敗しました(オフラインの可能性)。ローカルのデータのみで動作します。', e);
  }
}
function reviewSyncPush(key) {
  if (!_reviewSyncDocRef) return;
  try {
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    _reviewSyncDocRef.set({ [key]: list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
      .catch(e => console.warn('復習リストの送信に失敗しました', e));
  } catch (e) {}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  return TRASH_KEY_WRITE;
}
function audioFolderFor(format) {
  if (format === 'fillchoice') return 'audio_fillchoice';
  if (format === 'order') return 'audio_order';
  return 'audio_write';
}
function formatLabel(format) {
  if (format === 'fillchoice') return '✏️ 穴埋め・選択肢';
  if (format === 'order') return '📝 並べ替え・誤り訂正';
  return '✍️ 自由記述・マッチング';
}
function formatEmoji(format) {
  if (format === 'fillchoice') return '✏️';
  if (format === 'order') return '📝';
  return '✍️';
}

function getBookmarks(format) {
  if (!hasStorage) return [];
  return JSON.parse(localStorage.getItem(bookmarkKeyFor(format)) || '[]');
}
function toggleBookmark(format, id) {
  if (!hasStorage) return false;
  let list = getBookmarks(format);
  list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  localStorage.setItem(bookmarkKeyFor(format), JSON.stringify(list));
  reviewSyncPush(bookmarkKeyFor(format));
  return list.includes(id);
}
function getTrash(format) {
  if (!hasStorage) return [];
  return JSON.parse(localStorage.getItem(trashKeyFor(format)) || '[]');
}
function moveToTrash(format, id) {
  if (!hasStorage) return;
  const list = getTrash(format);
  if (!list.includes(id)) {
    list.push(id);
    localStorage.setItem(trashKeyFor(format), JSON.stringify(list));
  }
}
function restoreFromTrash(format, id) {
  if (!hasStorage) return;
  const list = getTrash(format).filter(x => x !== id);
  localStorage.setItem(trashKeyFor(format), JSON.stringify(list));
}
function exportTrash() {
  const formats = ['fillchoice', 'order', 'write'];
  const trashedQuestions = [];
  formats.forEach(format => {
    const ids = new Set(getTrash(format));
    questionsFor(format).forEach(q => {
      if (ids.has(q.id)) trashedQuestions.push(Object.assign({ format }, q));
    });
  });
  if (trashedQuestions.length === 0) { alert('ゴミ箱は空です'); return; }
  const payload = { folder: FOLDER_NAME, exportedAt: new Date().toISOString(), trashedQuestions };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${FOLDER_NAME}_trash_export.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function activeQuestionsFor(format) {
  const trashed = new Set(getTrash(format));
  return questionsFor(format).filter(q => !trashed.has(q.id));
}

function getRandomSessionQuestions(format) {
  const all = activeQuestionsFor(format);
  const seen = hasStorage ? JSON.parse(localStorage.getItem(storageKeyFor(format)) || '[]') : [];
  const seenSet = new Set(seen);
  const seenQuestions = all.filter(q => seenSet.has(q.id));
  const unseenQuestions = all.filter(q => !seenSet.has(q.id));
  if (seenQuestions.length > 0 && hasStorage) {
    const total = Math.min(10, all.length);
    const fromSeen = Math.round(total * 0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0, fromSeen);
    const pickedUnseen = shuffle(unseenQuestions).slice(0, fromUnseen);
    if (pickedUnseen.length < fromUnseen) {
      const extra = shuffle(seenQuestions.filter(q => !pickedSeen.includes(q))).slice(0, fromUnseen - pickedUnseen.length);
      return shuffle([...pickedSeen, ...pickedUnseen, ...extra]);
    }
    return shuffle([...pickedSeen, ...pickedUnseen]);
  }
  return shuffle(all).slice(0, 10);
}
function getAllSessionQuestions(format) { return shuffle(activeQuestionsFor(format)); }
function getCategorySessionQuestions(format, categoryName) {
  return shuffle(activeQuestionsFor(format).filter(q => q.category === categoryName));
}
function getBookmarkSelectedSessionQuestions(format, selectedIds) {
  const idSet = new Set(selectedIds || []);
  return shuffle(activeQuestionsFor(format).filter(q => idSet.has(q.id)));
}
function getBookmarkRandomSessionQuestions(format) {
  const bookmarks = new Set(getBookmarks(format));
  const pool = activeQuestionsFor(format).filter(q => bookmarks.has(q.id));
  return shuffle(pool).slice(0, Math.min(10, pool.length));
}

function saveSeenQuestions(format, questions) {
  if (!hasStorage) return;
  const key = storageKeyFor(format);
  const prev = JSON.parse(localStorage.getItem(key) || '[]');
  const merged = Array.from(new Set([...prev, ...questions.map(q => q.id)]));
  localStorage.setItem(key, JSON.stringify(merged));
}

function startTest(format, mode, categoryName, selectedIds) {
  currentFormat = format;
  currentMode = mode;
  currentCategory = categoryName || null;
  currentSelectedIds = selectedIds || [];
  if (mode === 'random') sessionQuestions = getRandomSessionQuestions(format);
  else if (mode === 'all') sessionQuestions = getAllSessionQuestions(format);
  else if (mode === 'category') sessionQuestions = getCategorySessionQuestions(format, categoryName);
  else if (mode === 'bookmarkSelect') sessionQuestions = getBookmarkSelectedSessionQuestions(format, currentSelectedIds);
  else if (mode === 'bookmarkRandom') sessionQuestions = getBookmarkRandomSessionQuestions(format);
  sessionQuestions = sessionQuestions.map(q => q.type === 'choice' ? Object.assign({}, q, { shuffledChoices: shuffle(q.choices) }) : q);
  currentIndex = 0;
  score = 0;
  renderQuestion();
}

function resetPlayBtn(btn) { btn.textContent = '🔊 英文を聞く'; btn.classList.remove('playing'); }
function playAudio(btn, src) {
  const isSameBtn = (currentBtn === btn);
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  if (currentBtn) { resetPlayBtn(currentBtn); currentBtn = null; }
  if (isSameBtn) { currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = '■ 停止'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if (currentBtn === btn) { currentBtn = null; currentAudio = null; } };
  audio.play();
}

function esc(str) {

  const q = currentQuestion();

  const bookmarked = getBookmarks(currentFormat).includes(q.id);
  const typeLabel = {

  }[q.type];

  let body = '';
  if (q.type === 'fill') body = renderFill(q);
  else if (q.type === 'choice') body = renderChoice(q);
  else if (q.type === 'reorder') body = renderReorder(q);
  else if (q.type === 'correction') body = renderCorrection(q);

  else if (q.type === 'match') body = renderMatch(q);

  render(`

  reorderState = { placed: [], pool: shuffle(q.tokens.map((t,i) => ({ t, i }))) };
  return `
    <div class="hint">${esc(q.hint)}</div>
    <div class="tile-area" id="tileArea"><span class="placeholder-text">タップして単語を選んでください</span></div>
    <div class="tile-pool" id="tilePool"></div>
    <button class="btn secondary" onclick="resetReorder()">リセット</button>
    <button class="btn" id="reorderSubmitBtn" disabled onclick="submitReorder()">回答する</button>
  `;
}
function renderReorderTiles() {
  const area = document.getElementById('tileArea');
  const pool = document.getElementById('tilePool');
  if (reorderState.placed.length === 0) {
    area.innerHTML = '<span class="placeholder-text">タップして単語を選んでください</span>';
  } else {
    area.innerHTML = reorderState.placed.map((tok, idx) =>
      `<button type="button" class="tile placed" onclick="unplaceTile(${idx})">${esc(tok.t)}</button>`).join('');
  }
  pool.innerHTML = reorderState.pool.map((tok, idx) =>
    `<button type="button" class="tile" onclick="placeTile(${idx})">${esc(tok.t)}</button>`).join('');
  const q = currentQuestion();
  document.getElementById('reorderSubmitBtn').disabled = reorderState.placed.length !== q.tokens.length;
}
function placeTile(idx) {
  const tok = reorderState.pool.splice(idx, 1)[0];
  reorderState.placed.push(tok);
  renderReorderTiles();
}
function unplaceTile(idx) {
  const tok = reorderState.placed.splice(idx, 1)[0];
  reorderState.pool.push(tok);
  renderReorderTiles();
}
function resetReorder() {
  const q = currentQuestion();
  reorderState = { placed: [], pool: shuffle(q.tokens.map((t,i) => ({ t, i }))) };
  renderReorderTiles();
}
function submitReorder() {
  const q = currentQuestion();
  const userOrder = reorderState.placed.map(t => t.t);
  const correct = JSON.stringify(userOrder) === JSON.stringify(q.tokens);
  if (correct) score++; rvbAnswer(correct);
  const html = `
    <div class="feedback ${correct?'correct':'incorrect'}">
      <div class="res-line">${correct ? '✅ 正解！' : '❌ 不正解'}</div>
      <div>正解の英文: <strong>${esc(q.tokens.join(' '))}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('order') + '/' + ${q.id} + '.mp3')">🔊 英文を聞く</button>
      ${sourceThumbsHtml(q)}
      ${q.relatedInfo ? `<div style="margin-top:10px;">💡 関連知識: ${esc(q.relatedInfo)}</div>` : ''}
      ${q.explanation ? `<div style="margin-top:6px;white-space:pre-line;">📝 解説: ${esc(q.explanation)}</div>` : ''}
    </div>
    ${nextBtnHtml()}
  `;
  showFeedbackArea(html);
}
// re-render tiles right after initial mount
const _origRenderQuestion = renderQuestion;
renderQuestion = function() {
  _origRenderQuestion();
  const q = currentQuestion();
  if (q.type === 'reorder') renderReorderTiles();
  if (q.type === 'match') renderMatchColumns();
};

/* ---- correction ---- */
function renderCorrection(q) {
  const html = q.question.replace(/\[\[(.+?)\]\]/, (m, w) => `<span style="text-decoration:underline;background:rgba(227,69,58,.18);border-radius:4px;padding:0 3px;">${esc(w)}</span>`);
  return `
    <div class="hint">${esc(q.hint)}</div>
    <p class="qtext">${html}</p>
    <input type="text" id="correctionInput" placeholder="正しい形に直してください" autocomplete="off">
    <button class="btn" onclick="submitCorrection()">回答する</button>
  `;
}
function submitCorrection() {
  const q = currentQuestion();
  const val = document.getElementById('correctionInput').value.trim().toLowerCase();
  const correct = val === q.answer.trim().toLowerCase();
  if (correct) score++; rvbAnswer(correct);
  showFeedbackSimple(q, correct, q.fullSentence, 'order');
}

/* ---- free ---- */
function renderFree(q) {
  return `
    <div class="hint">${esc(q.hint)}</div>
    <textarea id="freeInput" placeholder="英語で文章を書いてください"></textarea>
    <button class="btn" onclick="submitFree()">回答する</button>
  `;
}
function submitFree() {
  const q = currentQuestion();
  const val = document.getElementById('freeInput').value.trim().toLowerCase();
  const missing = q.keyPhrases.filter(k => !val.includes(k.toLowerCase()));
  const correct = missing.length === 0 && val.length > 0;
  if (correct) score++; rvbAnswer(correct);
  const html = `
    <div class="feedback ${correct?'correct':'incorrect'}">
      <div class="res-line">${correct ? '✅ 正解！（必須語句をすべて含んでいます）' : '❌ 不正解（不足している語句: ' + (missing.length ? esc(missing.join(', ')) : '入力なし') + '）'}</div>
      <div>模範解答: <strong>${esc(q.answer)}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('write') + '/' + ${q.id} + '.mp3')">🔊 英文を聞く</button>
      ${sourceThumbsHtml(q)}
      ${q.relatedInfo ? `<div style="margin-top:10px;">💡 関連知識: ${esc(q.relatedInfo)}</div>` : ''}
      ${q.explanation ? `<div style="margin-top:6px;white-space:pre-line;">📝 解説: ${esc(q.explanation)}</div>` : ''}
      <div class="small-muted" style="margin-top:8px;">※採点は必須語句が含まれているかの簡易判定です。文法的な正しさは模範解答と見比べて自己判定してください。</div>
    </div>
    ${nextBtnHtml()}
  `;
  showFeedbackArea(html);
}

/* ---- match ---- */
function renderMatch(q) {
  matchState = {
    left: shuffle(q.pairs.map((p,i) => ({ text: p.japanese, i }))),
    right: shuffle(q.pairs.map((p,i) => ({ text: p.english, i }))),
    selectedLeft: null, selectedRight: null,
    pairs: [], // {leftIdx, rightIdx}
  };
  return `
    <p class="qtext">${esc(q.hint)}</p>
    <div class="match-cols">
      <div class="match-col" id="matchLeft"></div>
      <div class="match-col" id="matchRight"></div>
    </div>
    <button class="btn" id="matchSubmitBtn" disabled onclick="submitMatch()" style="margin-top:12px;">回答する</button>
  `;
}
function renderMatchColumns() {
  const left = document.getElementById('matchLeft');
  const right = document.getElementById('matchRight');
  if (!left || !right) return;
  const pairedLeftIdx = new Set(matchState.pairs.map(p => p.leftIdx));
  const pairedRightIdx = new Set(matchState.pairs.map(p => p.rightIdx));
  left.innerHTML = matchState.left.map((item, idx) => {
    const paired = pairedLeftIdx.has(idx);
    const sel = matchState.selectedLeft === idx;
    return `<button type="button" class="match-btn ${paired?'paired':''} ${sel?'selected':''}" ${paired?'disabled':''} onclick="selectMatchLeft(${idx})">${esc(item.text)}</button>`;
  }).join('');
  right.innerHTML = matchState.right.map((item, idx) => {
    const paired = pairedRightIdx.has(idx);
    const sel = matchState.selectedRight === idx;
    return `<button type="button" class="match-btn ${paired?'paired':''} ${sel?'selected':''}" ${paired?'disabled':''} onclick="selectMatchRight(${idx})">${esc(item.text)}</button>`;
  }).join('');
  const q = currentQuestion();
  document.getElementById('matchSubmitBtn').disabled = matchState.pairs.length !== q.pairs.length;
}
function selectMatchLeft(idx) {
  matchState.selectedLeft = idx;
  tryFormPair();
  renderMatchColumns();
}
function selectMatchRight(idx) {
  matchState.selectedRight = idx;
  tryFormPair();
  renderMatchColumns();
}
function tryFormPair() {
  if (matchState.selectedLeft !== null && matchState.selectedRight !== null) {
    matchState.pairs = matchState.pairs.filter(p => p.leftIdx !== matchState.selectedLeft && p.rightIdx !== matchState.selectedRight);
    matchState.pairs.push({ leftIdx: matchState.selectedLeft, rightIdx: matchState.selectedRight });
    matchState.selectedLeft = null;
    matchState.selectedRight = null;
  }
}
function submitMatch() {
  const q = currentQuestion();
  let correctCount = 0;
  const rows = matchState.pairs.map(p => {
    const leftItem = matchState.left[p.leftIdx];
    const rightItem = matchState.right[p.rightIdx];
    const isCorrect = leftItem.i === rightItem.i;
    if (isCorrect) correctCount++;
    return { japanese: leftItem.text, english: rightItem.text, isCorrect };
  });
  const allCorrect = correctCount === q.pairs.length;
  if (allCorrect) score++; rvbAnswer(allCorrect);
  const correctListHtml = q.pairs.map(p => {
    const idx = q.pairs.indexOf(p);
    return `<div>・${esc(p.japanese)} → <strong>${esc(p.english)}</strong> <button class="play-btn" style="padding:2px 10px;font-size:.78rem;" onclick="playAudio(this, audioFolderFor('write') + '/' + ${q.id} + '_p' + ${idx} + '.mp3')">🔊</button></div>`;
  }).join('');
  const wrongRowsHtml = rows.filter(r => !r.isCorrect).map(r => `<div>❌ ${esc(r.japanese)} → ${esc(r.english)}</div>`).join('');
  const html = `
    <div class="feedback ${allCorrect?'correct':'incorrect'}">
      <div class="res-line">${allCorrect ? '✅ 全問正解！' : `⚠️ ${correctCount} / ${q.pairs.length} 正解（部分正解）`}</div>
      <div style="margin-top:8px;"><strong>正しい組み合わせ:</strong>${correctListHtml}</div>
      ${wrongRowsHtml ? `<div style="margin-top:8px;"><strong>あなたの誤答:</strong>${wrongRowsHtml}</div>` : ''}
      ${q.sources && q.sources.length ? sourceThumbsHtml(q) : ''}
      ${q.relatedInfo ? `<div style="margin-top:10px;">💡 関連知識: ${esc(q.relatedInfo)}</div>` : ''}
      ${q.explanation ? `<div style="margin-top:6px;white-space:pre-line;">📝 解説: ${esc(q.explanation)}</div>` : ''}
    </div>
    ${nextBtnHtml()}
  `;
  showFeedbackArea(html);
}

/* ---------------- results ---------------- */
function nextQuestion() {
  currentIndex++;
  renderQuestion();
}
function showResults() {
  if (currentMode === 'random') saveSeenQuestions(currentFormat, sessionQuestions);
  const total = sessionQuestions.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  let stars, msg;
  if (pct >= 90) { stars = '★★★'; msg = 'Excellent! TOEFL満点レベルの実力です'; }
  else if (pct >= 70) { stars = '★★'; msg = 'Good! あと少しで完璧です'; }
  else if (pct >= 50) { stars = '★'; msg = 'Keep going! 復習して再挑戦しましょう'; }
  else { stars = ''; msg = 'ノートを見直して再チャレンジ！'; }
  render(`
    <h1>結果発表</h1>
    <p class="sub">${formatLabel(currentFormat)}</p>
    <div class="card">
      <p style="font-size:1.3rem;font-weight:700;">スコア: ${score} / ${total}（正解率 ${pct}%）</p>
      <div class="stars-row star">${stars || '—'}</div>
      <p>${msg}</p>
    </div>
    <button class="btn block" style="margin-bottom:10px;" onclick="startTest(currentFormat, currentMode, currentCategory, currentSelectedIds)">もう一度同じ形式・モードで挑戦する</button>
    <button class="btn secondary block" style="margin-bottom:10px;" onclick="showFormatSelect()">別の形式に挑戦する</button>
    <button class="btn secondary block" onclick="showFormatSelect()">🏠 最初から</button>
  `);
}

/* ---------------- init ---------------- */
initReviewSync().then(showFormatSelect);
</script>

<script>
/* 復習のきまり（AIEnglish＝日替わり学習ページ＋7テストで共通・2026-10-26）。
   中身は .claude/skills_assets/review-core/ が正本で、inject.py が下の目印の間へ配る */
/* RV:JS:BEGIN */
/* ============================================================
   復習のきまり（5アプリ共通） — 中身
   正本: .claude/skills_assets/review-core/rv.js
   英単語ノート / 表現メモ / Nextstage問題集 / AIEnglish（日替わり＋7テスト）/ Gimmy英作文 へ
   inject.py が同じ中身を配る。直すときは必ずこのファイルを直して inject.py を回すこと
   （生成HTMLを直接いじっても build.py / inject.py で消える）。

   ------------------------------------------------------------
   ねらい: 復習待ちを毎日ゼロにするのではなく、1つのアプリにつき1日最大30問の負担で、
   長く覚えて使えるようにする。

   決まり（数値はすべて RV_DEFAULTS。設定画面から変えたものは RV.cfg に入って同期される）
   ・1日の上限はアプリごとに30問。入口（今日の復習・苦手・お気に入り・新規学習…）を問わず
     「復習対象の問題に答えた回数」を共通で数える。日付の区切りは日本時間の0時
   ・数えるのは答え合わせ・自己採点が確定した瞬間だけ。同じ回答は eid で1回にまとめる
     （再読み込み・二重送信・2台の同期で増えない）。採点の付け直しは同じ eid の修正
   ・採点は3段階。①思い出せた(80〜100%) ②惜しい(40〜60%) ③思い出せなかった(0〜20%)
     ① 1段進めて移動先の段の間隔 ／ ② 段はそのまま、その段の間隔の半分（切り上げ・1〜7日）
     ③ 2段下げて翌日。不正解でも当日中には戻さない。同じ問題の箱が動くのは1日1回まで
   ・30問の選び方は 20（直近でまちがえた・定着が弱い）＋10（長く待っている）。片方が余れば他方へ
   ・新規登録は1日5件まで。期限の来た未消化が30件を超える日は0件。超えたぶんは「登録待ち」
   ・③が3回続いた問題は「学び直し候補」。本人が選んだときだけ7日休める（習得済みとは別）

   アプリ側がこのブロックより前に用意するもの:
     var RV_ENV = {
       app: 'vocab',                    // 保存キー rv_<app> と同期ドキュメント <合言葉>__rv_<app>
       name: '英単語ノート',            // 画面に出すアプリ名
       unit: '問',                      // 件数の単位
       intervals: [1,2,4,7,14,30,60,120],   // 段ごとの間隔（日）。段は0始まり
       legacy(){ return [{id, box, due, last}] },  // 移行用。box=0始まり、due/last=ミリ秒・日数・'YYYY-MM-DD'のどれでも
       put(id, st){ ... },              // 箱と期限をアプリ自身の保存先へ映す（既存画面のため）
       ids(){ return [...] },           // 任意。いま出題できる問題のid（削除済みを除く）
       timeCap(){ return 件数 },        // 任意。「今日つかう時間」から換算した件数
       recog(fmt){ return bool },       // 任意。選択式など「見て選べた」形式なら true
       label(id){ return '短い見出し' }, // 任意
       viewed(id){ return bool },       // 任意。アプリ自身の「出題済み・閲覧した」記録
       detail(id){ return 'HTML' },     // 任意。学び直し用（例文・まぎらわしい語・文の構造など）
       onChange(){ ... }                // 任意。設定や休止を変えたあと画面を描き直す
     }
   呼びかた（主なもの）:
     rvInit()                 … 起動時に1回（移行・取り込み・同期の開始）
     rvAnswer(id, pct, opt)   … 答え合わせ・自己採点が確定した瞬間に1回。opt={fmt, retry}
     rvRegrade(eid, pct)      … 採点の付け直し（回数は増やさず、回答前から計算し直す）
     rvPick(ids, n)           … 今日の復習の出題（20＋10の配分・残り枠まで）
     rvGate(ids)              … どの入口でも出題前に通す（復習対象は残り枠まで・今日答えた問題は外す）
     rvServeOk(id, retry)     … 出題の直前に、まだ出してよいか
     rvLeft() / rvDone()      … 今日の残り枠 / 今日数えた回数
     rvBarHtml() / rvPanelHtml() / rvGradeHtml(fn, opt)   … 画面の部品
   ============================================================ */

var RV_DEFAULTS = {
  cap: 30,           /* 1日の復習の上限（問）。アプリごとに独立 */
  weak: 20,          /* 30問のうち「直近でまちがえた・定着が弱い」問題の枠（残りが「長く待っている」問題の枠） */
  newPerDay: 5,      /* 復習対象への新規登録（1日あたり） */
  backlogStop: 30,   /* 期限の来た未消化がこれを超える日は新規登録の推奨数を0件にする */
  retry: false,      /* 当日の解き直し（標準オフ） */
  retryMax: 3,       /* 解き直しは1アプリ1日この問数まで（30問の内数・各問題1回まで） */
  capAll: false,     /* true＝新規学習も含めて、このアプリの全出題を1日30問以内にする */
  relearnN: 3,       /* 通常復習で③がこの回数続いたら「学び直し候補」 */
  pauseDays: 7,      /* 本人が選んだときの休止の日数 */
  recogMax: 3,       /* 選択式の正解だけで上がれる段（0始まり）。英単語ノートの4択などに効く */

/* ============================================================

   問題のidは日替わりページと同じ uid（<テスト>:<形式>:<問題番号>）。
   ページ側で用意してよいもの（無ければ使わない）:
     RVE_IDS()      … 出題できる uid の一覧（日替わりページだけ。ゴミ箱を除く）
     RVE_LABEL(uid) … 短い見出し
     RVE_DETAIL(uid)… 学び直し用のHTML
     RVE_PUSH()     … dq_srs を書いたあとの同期（日替わりページだけ）

  unit: '問',
  intervals: [1, 3, 7, 14, 35, 90],   /* 6段。箱番号は dq_srs が1始まり（1〜6）、ここでは0始まり */
  legacy: function () {
    var o = rvAienSrs(), out = [];
    for (var k in o) { var e = o[k]; if (e && e.box) out.push({ id: k, box: (e.box | 0) - 1, due: e.due, last: e.last }); }

  },
  put: function (id, st) {

  recog: function (f) { return f === 'c' || f === 'm'; },
  label: function (id) { return typeof RVE_LABEL === 'function' ? RVE_LABEL(id) : id; },

function rvAienCount(uid, ok) {
  var o = rvAienSrs(), e = o[uid];
  if (!e) return;
  if (ok) e.correct = (e.correct | 0) + 1; else e.wrong = (e.wrong | 0) + 1;

/* ============================================================
   AIEnglish 7テスト本体 → 復習のきまり へのつなぎ
   正本: .claude/skills_assets/review-core/aien_bridge.js（inject.py が RVB:JS の目印へ配る）

   ・自動判定は語句の一致しか見ないので、答えのあとに「採点を直す」（①②③）を出す。

var RVB_TESTS = { santa_all: 'santa', nextstage_all: 'next', sonota_hyogen_all: 'sonota', writing_hyogen_all: 'writing',
  appspeak_all: 'speak', shundai_tango: 'sundai', toefl_writing_backtranslate: 'toefl' };
var RVB_FMT = { fillchoice: 'fc', order: 'or', write: 'wr', sentence: 'se', paragraph: 'pa' };
var RVB_GETTERS = ['getRandomSessionQuestions', 'getAllSessionQuestions', 'getCategorySessionQuestions',
  'getBookmarkSelectedSessionQuestions', 'getBookmarkRandomSessionQuestions'];
var RVB_LAST = { key: null, eid: null, pct: null }, RVB_RUN = 0;
function rvbTest() { return RVB_TESTS[typeof REVIEW_SYNC_TEST_ID !== 'undefined' ? REVIEW_SYNC_TEST_ID : ''] || null; }
function rvbFmt() {
  if (rvbTest() === 'sundai') return 'fc';
  if (rvbTest() === 'toefl') return RVB_FMT[typeof currentUnit !== 'undefined' ? currentUnit : ''] || 'se';
  return RVB_FMT[typeof currentFormat !== 'undefined' ? currentFormat : ''] || 'fc';
}
function rvbUid(q) { return rvbTest() + ':' + rvbFmt() + ':' + q.id; }
function rvbCur() {
  try { return sessionQuestions[currentIndex] || null; } catch (e) { return null; }
}
/* 出題の組み立てをくるむ。絞った結果が0問になるときは、その場で知らせて始めない */
function rvbWrap() {
  RVB_GETTERS.forEach(function (n) {
    var f = window[n];
    if (typeof f !== 'function' || f._rvb) return;
    var g = function () {
      RVB_RUN++;                                  /* 新しい回が始まった（同じ問題の二重記録よけの区切り） */
      RVB_PRAC = false; RVB_WRONG = [];           /* ふつうの回にもどる。まちがえた問題はこの回から数え直す */
      rvbRetryBtn();
      var list = f.apply(this, arguments) || [];
      if (!rvbTest() || !list.length) return list;
      var keep = {}, r = rvGate(list.map(rvbUid));
      if (!r.ids.length && rvAskFree(list.map(rvbUid))) r = rvGate(list.map(rvbUid));   /* ノルマ達成後の自由復習 */
      r.ids.forEach(function (u) { keep[u] = 1; });
      var out = list.filter(function (q) { return keep[rvbUid(q)]; });
      rvbChip();
      if (!out.length) {
        alert(rvLeft() <= 0
          ? 'AIEnglishテスト集の今日の復習はここまでです（日替わり学習ページとあわせて1日' + rvCfg().cap + '問まで）。\n解説や復習リストはこのまま見られます。'
          : 'この範囲は、今日すでに答えた問題（または休止中の問題）だけなので出題できません。');
        throw new Error('RVB_EMPTY');
      }
      if (out.length < list.length && (r.cutCap || r.cutDone)) rvbToast('復習の問題は ' + (r.cutCap ? '今日の残り枠のぶんだけ' : '今日まだ答えていないものだけ') + '出します（' + out.length + '問）');

}
/* 答え合わせの瞬間に呼ぶ（各テストの採点行の直後）。pct を渡さなければ正誤から 100/0 */
function rvbAnswer(correct, pct) {
  var q = rvbCur();
  if (!q || !rvbTest()) return;
  var key = RVB_RUN + '#' + rvbUid(q) + '#' + currentIndex;
  if (RVB_LAST.key === key) return;             /* 同じ問題を二重に記録しない（ボタンの連打など） */
  var p = pct == null ? (correct ? 100 : 0) : pct;
  rvbMarkWrong(q, p);
  if (RVB_PRAC) {                               /* 再挑戦＝練習。記録しない */
    RVB_LAST = { key: key, eid: null, pct: p, res: null, q: q };
    rvbRetryBtn();
    return;
  }
  var r = rvAnswer(rvbUid(q), p, { fmt: q.type === 'choice' ? 'c' : q.type === 'match' ? 'm' : rvbFmt() });
  if (r.enrolled && !r.dup) rvAienCount(rvbUid(q), p >= 80);
  RVB_LAST = { key: key, eid: r.eid, pct: p, res: r, q: q };
  rvbChip();
  if (rvbTest() !== 'toefl') setTimeout(rvbPanel, 0);   /* TOEFL和文英訳は自前の自己採点を付け直しに使う */
}
/* 採点の付け直し（同じ回答の修正。回数は増やさない） */
function rvbFix(pct) {
  if (RVB_LAST.q) rvbMarkWrong(RVB_LAST.q, pct);
  if (!RVB_LAST.eid) return;
  rvRegrade(RVB_LAST.eid, pct);
  RVB_LAST.pct = pct;
  rvbPanel();
  rvbChip();
}
function rvbPanel() {
  var host = document.getElementById('feedbackArea') || document.getElementById('feedback-box') || document.getElementById('app');
  if (!host) return;
  var el = document.getElementById('rvbFix');
  if (!el) { el = document.createElement('div'); el.id = 'rvbFix'; host.appendChild(el); }
  el.innerHTML = rvNoteHtml(RVB_LAST.res)
    + '<details class="rv-panel"><summary>採点を直す（自動判定と自分の感覚がちがうとき）</summary>'
    + rvGradeHtml('rvbFix', { sel: RVB_LAST.pct, fix: true, q: '言い換えでも意味と文法が合っていれば①、一部ちがえば②にできます。' })
    + '</details>';
}
/* TOEFL和文英訳: 自己採点（20〜100%）を押したら同じ回答の付け直しにする。取り消し（null）は自動判定に戻す */
function rvbSelf(v) {
  if (!RVB_LAST.eid && !RVB_PRAC) return;
  var e = (typeof answerLog !== 'undefined') ? answerLog[currentIndex] : null;

/* ---- まちがえた問題に再挑戦（2026-10-27） ----

   練習なので記録しない（箱・1日30問の回数は1回目のまま＝明日の復習にはふつうに出る）。

/* 画面のすみに「AIEnglish 今日の復習 12/30」。押すとくわしい状況 */
function rvbChip() {
