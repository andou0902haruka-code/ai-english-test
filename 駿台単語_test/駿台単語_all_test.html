<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駿台単語 穴埋め・選択肢テスト</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #4f6df5;
    --accent-dark: #3a52d1;
    --green: #16a34a;
    --red: #dc2626;
    --border: #e5e7eb;
    --badge-fill: #e0e7ff;
    --badge-fill-text: #3730a3;
    --badge-choice: #fce7f3;
    --badge-choice-text: #9d174d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 40px;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  .sub { color: var(--sub); font-size: 0.9rem; margin-bottom: 16px; }
  .center { text-align: center; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { background: #c7cbd6; cursor: not-allowed; }
  .btn-block { display: block; width: 100%; margin: 8px 0; }
  .btn-secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-secondary:hover { background: #eef1ff; }
  .mode-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .mode-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(79,109,245,0.12); }
  .mode-card .mtitle { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .mode-card .mdesc { color: var(--sub); font-size: 0.88rem; }
  .genre-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .genre-btn {
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .genre-btn.selected { border-color: var(--accent); background: var(--badge-fill); color: var(--badge-fill-text); font-weight: 600; }
  .progress-wrap { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; margin: 8px 0 4px; }
  .progress-bar { background: var(--accent); height: 100%; transition: width 0.2s; }
  .qmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 700; }
  .badge-fill { background: var(--badge-fill); color: var(--badge-fill-text); }
  .badge-choice { background: var(--badge-choice); color: var(--badge-choice-text); }
  .badge-genre { background: #f1f5f9; color: #475569; font-weight: 500; }
  .qnum { color: var(--sub); font-size: 0.85rem; }
  .hint { background: #f8fafc; border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 14px; }
  .qtext { font-size: 1.15rem; margin-bottom: 16px; line-height: 1.7; }
  .qtext .blank { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1.05rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choice-item {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .choice-item:hover { border-color: var(--accent); }
  .choice-item.selected { border-color: var(--accent); background: var(--badge-fill); }
  .choice-item input { margin: 0; }
  .bookmark-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--sub); margin-bottom: 10px; }
  .trash-link { font-size: 0.82rem; color: var(--sub); text-decoration: underline; cursor: pointer; float: right; }
  .feedback-box { border-radius: 12px; padding: 16px; margin: 14px 0; }
  .feedback-correct { background: #ecfdf5; border: 1.5px solid #6ee7b7; }
  .feedback-wrong { background: #fef2f2; border: 1.5px solid #fca5a5; }
  .feedback-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
  .feedback-title.ok { color: var(--green); }
  .feedback-title.ng { color: var(--red); }
  .answer-line { margin: 6px 0; }
  .play-btn {
    background: #fff;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    margin: 6px 0;
  }
  .play-btn.playing { background: var(--accent); color: #fff; }
  .source-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .source-thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--border); }
  .info-line { font-size: 0.9rem; margin: 6px 0; }
  .trash-report-link { font-size: 0.82rem; color: var(--sub); text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 8px; }
  .footer-links { text-align: center; margin-top: 12px; }
  .footer-links a { color: var(--sub); font-size: 0.88rem; text-decoration: underline; cursor: pointer; }
  .result-score { font-size: 2.2rem; font-weight: 800; text-align: center; margin: 8px 0; }
  .result-stars { text-align: center; font-size: 1.6rem; color: #f59e0b; margin-bottom: 8px; }
  .result-msg { text-align: center; color: var(--sub); margin-bottom: 20px; }
  .trash-item { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .trash-item .ttext { font-size: 0.92rem; margin: 6px 0; color: #374151; }
  .img-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .img-modal.hidden { display: none; }
  .img-modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .img-modal-close {
    position: absolute; top: 16px; right: 24px; color: #fff;
    font-size: 2rem; cursor: pointer; line-height: 1;
  }
  .hidden { display: none !important; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161f;
      --card-bg: #1e2130;
      --text: #e5e7eb;
      --sub: #9aa0ac;
      --border: #333a4d;
      --badge-fill: #2a3163;
      --badge-fill-text: #c7d2fe;
      --badge-choice: #4a1942;
      --badge-choice-text: #fbcfe8;
    }
    .hint { background: #262b3d; }
    .feedback-correct { background: #0f2e22; border-color: #16a34a; }
    .feedback-wrong { background: #3a1414; border-color: #dc2626; }
    input[type="text"] { background: #262b3d; color: var(--text); }
    .genre-btn { background: #1e2130; color: var(--text); }
    .choice-item { background: #1e2130; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="img-modal hidden" id="imgModal" onclick="closeImageModal()">
  <span class="img-modal-close" onclick="closeImageModal()">&times;</span>
  <img id="imgModalImg" src="" alt="出典画像">
</div>

const STORAGE_KEY = 'wt_all_fillchoice_seen_shundai_tango';
const BOOKMARK_KEY = 'wt_all_fillchoice_bookmark_shundai_tango';
const TRASH_KEY = 'wt_all_fillchoice_trash_shundai_tango';
const AUDIO_FOLDER = 'audio_fillchoice';

let currentCategory = null;

const hasStorage = (function() {
  try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
})();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getBookmarks() {
  if (!hasStorage) return [];
  return JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]');
}
function toggleBookmark(id) {
  if (!hasStorage) return false;
  let list = getBookmarks();
  list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  localStorage.setItem(BOOKMARK_KEY, JSON.stringify(list));
  return list.includes(id);
}
function getTrash() {
  if (!hasStorage) return [];
  return JSON.parse(localStorage.getItem(TRASH_KEY) || '[]');
}
function moveToTrash(id) {
  if (!hasStorage) return;
  const list = getTrash();
  if (!list.includes(id)) { list.push(id); localStorage.setItem(TRASH_KEY, JSON.stringify(list)); }
}
function restoreFromTrash(id) {
  if (!hasStorage) return;
  const list = getTrash().filter(x => x !== id);
  localStorage.setItem(TRASH_KEY, JSON.stringify(list));
}
function activeQuestions() {
  const trashed = new Set(getTrash());
  return FILLCHOICE_QUESTIONS.filter(q => !trashed.has(q.id));
}
function getSeen() {
  if (!hasStorage) return [];
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}
function saveSeenQuestions(questions) {
  if (!hasStorage) return;
  const prev = getSeen();
  const merged = Array.from(new Set([...prev, ...questions.map(q => q.id)]));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
}

function getRandomSessionQuestions() {
  const all = activeQuestions();
  const seenSet = new Set(getSeen());
  const seenQuestions = all.filter(q => seenSet.has(q.id));
  const unseenQuestions = all.filter(q => !seenSet.has(q.id));
  if (seenQuestions.length > 0) {
    const total = Math.min(20, all.length);
    const fromSeen = Math.round(total * 0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0, fromSeen);
    const pickedUnseen = shuffle(unseenQuestions).slice(0, fromUnseen);
    if (pickedUnseen.length < fromUnseen) {
      const extra = shuffle(seenQuestions.filter(q => !pickedSeen.includes(q))).slice(0, fromUnseen - pickedUnseen.length);
      return shuffle([...pickedSeen, ...pickedUnseen, ...extra]);
    }
    return shuffle([...pickedSeen, ...pickedUnseen]);
  }
  return shuffle(all).slice(0, 20);
}
function getAllSessionQuestions() { return shuffle(activeQuestions()); }
function getCategorySessionQuestions(categoryName) { return shuffle(activeQuestions().filter(q => q.category === categoryName)); }
function getBookmarkSessionQuestions() {
  const bookmarks = new Set(getBookmarks());
  return shuffle(activeQuestions().filter(q => bookmarks.has(q.id)));
}

function startTest(mode, categoryName) {
  currentMode = mode;
  currentCategory = categoryName || null;
  if (mode === 'random') sessionQuestions = getRandomSessionQuestions();
  else if (mode === 'all') sessionQuestions = getAllSessionQuestions();
  else if (mode === 'category') sessionQuestions = getCategorySessionQuestions(categoryName);
  else if (mode === 'bookmark') sessionQuestions = getBookmarkSessionQuestions();
  sessionQuestions = sessionQuestions.map(q => q.type === 'choice' ? Object.assign({}, q, { shuffledChoices: shuffle(q.choices) }) : q);
  currentIndex = 0;
  score = 0;
  renderQuestionScreen();
}

function playAudio(btn, src) {
  const isSameBtn = (window.__currentBtn === btn);
  if (window.__currentAudio) { window.__currentAudio.pause(); window.__currentAudio.currentTime = 0; }
  if (window.__currentBtn) { window.__currentBtn.textContent = '🔊 英文を聞く'; window.__currentBtn.classList.remove('playing'); window.__currentBtn = null; }
  if (isSameBtn) { window.__currentAudio = null; return; }
  const audio = new Audio(src);
  window.__currentAudio = audio; window.__currentBtn = btn;
  btn.textContent = '■ 停止'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => {
    btn.textContent = '🔊 英文を聞く'; btn.classList.remove('playing');
    if (window.__currentBtn === btn) { window.__currentBtn = null; window.__currentAudio = null; }
  };
  audio.play().catch(() => {});
}

function closeImageModal() {

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function selectCategory(cat) {

  renderModeSelect();

function renderQuestionScreen() {
  answered = false;
  selectedChoiceValue = null;
  const q = sessionQuestions[currentIndex];
  const total = sessionQuestions.length;
  const pct = Math.round((currentIndex) / total * 100);
  const isBookmarked = getBookmarks().includes(q.id);

  let bodyHtml = '';
  if (q.type === 'fill') {
    const displayQ = esc(q.question).replace(/_____/, '<span class="blank">_____</span>');
    bodyHtml = `
      <div class="hint">💡 ${esc(q.hint)}</div>
      <div class="qtext">${displayQ}</div>
      <input type="text" id="fillInput" placeholder="英単語を入力" autocomplete="off" onkeydown="if(event.key==='Enter')submitAnswer()">
      <button class="btn btn-block" onclick="submitAnswer()">回答する</button>
    `;
  } else if (q.type === 'choice') {
    let choicesHtml = '';
    q.shuffledChoices.forEach((c, i) => {
      choicesHtml += `
        <label class="choice-item" id="choiceItem${i}" onclick="selectChoice(${i}, this)">
          <input type="radio" name="choiceRadio" value="${esc(c)}">
          <span>${esc(c)}</span>
        </label>`;
    });
    bodyHtml = `
      <div class="hint">💡 ${esc(q.hint)}</div>
      <div class="qtext">${esc(q.question)}</div>
      <div class="choice-list">${choicesHtml}</div>
      <button class="btn btn-block" id="choiceSubmitBtn" onclick="submitAnswer()" disabled>回答する</button>
    `;
  }

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="badge ${q.type === 'fill' ? 'badge-fill' : 'badge-choice'}">${q.type === 'fill' ? '穴埋め' : '選択肢'}</span>
        <span class="badge badge-genre">${esc(q.category)}</span>
        <span class="qnum" style="margin-left:auto;">Q ${currentIndex + 1} / ${total}</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="bookmark-row">
        <label><input type="checkbox" id="bookmarkCheck" ${isBookmarked ? 'checked' : ''} onchange="toggleBookmark(${q.id})"> この問題を復習リストに入れる</label>
        <span class="trash-link" onclick="reportTrash(${q.id})">🗑 この問題は表示しない</span>
      </div>
      ${bodyHtml}
      <div id="feedbackArea"></div>
      <div class="footer-links"><a onclick="renderModeSelect()">← スタート画面に戻る</a></div>
    </div>
  `;
}

function selectChoice(i, el) {
  document.querySelectorAll('.choice-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input').checked = true;
  selectedChoiceValue = el.querySelector('input').value;
  document.getElementById('choiceSubmitBtn').disabled = false;
}

function submitAnswer() {
  if (answered) return;
  const q = sessionQuestions[currentIndex];
  let isCorrect = false;
  let userAnswerDisplay = '';

  if (q.type === 'fill') {
    const input = document.getElementById('fillInput');
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    isCorrect = val === q.answer.trim().toLowerCase();
    userAnswerDisplay = input.value.trim();
    input.disabled = true;
  } else if (q.type === 'choice') {
    if (!selectedChoiceValue) return;
    isCorrect = selectedChoiceValue === q.answer;
    userAnswerDisplay = selectedChoiceValue;
    document.querySelectorAll('.choice-item input').forEach(r => r.disabled = true);
    document.getElementById('choiceSubmitBtn').disabled = true;
  }

  answered = true;
  if (isCorrect) score++;

  const sourceList = q.source ? [q.source] : (q.sources || []);
  const thumbsHtml = sourceList.map(s =>
    `<img class="source-thumb" src="images/${s}.jpg" alt="${s}" loading="lazy" onclick="openImageModal('images/${s}.jpg')" onerror="this.style.display='none'">`
  ).join('');

  const feedbackHtml = `
    <div class="feedback-box ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}">
      <div class="feedback-title ${isCorrect ? 'ok' : 'ng'}">${isCorrect ? '✅ 正解！' : '❌ 不正解'}</div>
      ${!isCorrect ? `<div class="answer-line">あなたの回答: ${esc(userAnswerDisplay)}</div>` : ''}
      <div class="answer-line">正解: <strong>${esc(q.answer)}</strong></div>
      <button class="play-btn" onclick="playAudio(this, '${AUDIO_FOLDER}/${q.id}.mp3')">🔊 英文を聞く</button>
      <div class="info-line" style="margin-top:8px;">${esc(q.fullSentence)}</div>
      ${sourceList.length ? `<div class="info-line">📷 出典:</div><div class="source-thumbs">${thumbsHtml}</div>` : ''}
      ${q.relatedInfo ? `<div class="info-line">💡 関連知識: ${esc(q.relatedInfo)}</div>` : ''}
      ${q.explanation ? `<div class="info-line">📝 解説: ${esc(q.explanation)}</div>` : ''}
      <div id="trashReportArea"><span class="trash-report-link" onclick="reportTrashFinal(${q.id})">🗑 この問題は表記ミスなどがあり変です</span></div>
    </div>
    <button class="btn btn-block" onclick="nextQuestion()">${currentIndex === sessionQuestions.length - 1 ? '結果を見る' : '次の問題 →'}</button>
  `;
  document.getElementById('feedbackArea').innerHTML = feedbackHtml;
  document.getElementById('feedbackArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function reportTrash(id) {
  if (!confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) return;
  moveToTrash(id);
  alert('🗑 ゴミ箱に移動しました。次の問題からセッションを続けてください。');
}
function reportTrashFinal(id) {
  if (!confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) return;
  moveToTrash(id);
  const area = document.getElementById('trashReportArea');
  if (area) area.innerHTML = '<span class="trash-report-link" style="text-decoration:none;">🗑 ゴミ箱に移動しました</span>';
}

function nextQuestion() {
  if (currentIndex < sessionQuestions.length - 1) {
    currentIndex++;
    renderQuestionScreen();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResults();
  }
}

function showResults() {
  if (currentMode === 'random') saveSeenQuestions(sessionQuestions);
  const total = sessionQuestions.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  let stars = '';
  let msg = '';
  if (pct >= 90) { stars = '★★★'; msg = 'Excellent! TOEFL満点レベルの実力です'; }
  else if (pct >= 70) { stars = '★★'; msg = 'Good! あと少しで完璧です'; }
  else if (pct >= 50) { stars = '★'; msg = 'Keep going! 復習して再挑戦しましょう'; }
  else { stars = ''; msg = 'ノートを見直して再チャレンジ！'; }

  document.getElementById('app').innerHTML = `
    <div class="card center">
      <h1>結果発表</h1>
      <div class="result-score">${score} / ${total} 問正解</div>
      <div class="sub">正解率 ${pct}%</div>
      <div class="result-stars">${stars}</div>
      <div class="result-msg">${msg}</div>
      <button class="btn btn-block" onclick="startTest(currentMode, currentCategory)">もう一度同じモードで挑戦する</button>
      <button class="btn btn-block btn-secondary" onclick="renderModeSelect()">🏠 モード選択に戻る</button>
    </div>
  `;
}

function renderTrashScreen() {
  const trashIds = getTrash();
  const trashedQuestions = FILLCHOICE_QUESTIONS.filter(q => trashIds.includes(q.id));
  let itemsHtml = '';
  if (trashedQuestions.length === 0) {
    itemsHtml = '<div class="sub">ゴミ箱は空です</div>';
  } else {
    trashedQuestions.forEach(q => {
      const text = q.question || q.hint || '';
      const sourceList = q.source ? [q.source] : (q.sources || []);
      itemsHtml += `
        <div class="trash-item">
          <span class="badge ${q.type === 'fill' ? 'badge-fill' : 'badge-choice'}">${q.type === 'fill' ? '穴埋め' : '選択肢'}</span>
          <span class="badge badge-genre">${esc(q.category)}</span>
          <div class="ttext">${esc(text)}</div>
          ${sourceList.length ? `<div class="info-line">📷 出典: ${sourceList.map(esc).join(', ')}</div>` : ''}
          <button class="btn btn-secondary" onclick="restoreFromTrash(${q.id}); renderTrashScreen();">↩️ 元に戻す</button>
        </div>
      `;
    });
  }
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="footer-links" style="text-align:left;margin-bottom:8px;"><a onclick="renderModeSelect()">← モード選択に戻る</a></div>
      <h2>🗑 ゴミ箱</h2>
      ${itemsHtml}
    </div>
  `;
}

renderModeSelect();
</script>
</body>
</html>
