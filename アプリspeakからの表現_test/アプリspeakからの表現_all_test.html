<title>アプリspeakからの表現 総合テスト</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --sub:#5b6473; --border:#e1e4ea;
  --accent:#4c6ef5; --accent2:#3b5bdb; --good:#2f9e44; --bad:#e03131; --warn:#f08c00;
  --badge-bg:#eef1ff; --badge-text:#3b5bdb; --new-bg:#ff8c42; --shadow:0 2px 10px rgba(0,0,0,0.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161d; --card:#1e2029; --text:#eef0f4; --sub:#a2a8b6; --border:#33363f;
    --accent:#7c93ff; --accent2:#6a82f5; --good:#5fd97a; --bad:#ff6b6b; --warn:#ffb84d;
    --badge-bg:#2a2d55; --badge-text:#a9b6ff; --shadow:0 2px 10px rgba(0,0,0,0.4); }
}
:root[data-theme="dark"]{ --bg:#14161d; --card:#1e2029; --text:#eef0f4; --sub:#a2a8b6; --border:#33363f;
  --accent:#7c93ff; --accent2:#6a82f5; --good:#5fd97a; --bad:#ff6b6b; --warn:#ffb84d;
  --badge-bg:#2a2d55; --badge-text:#a9b6ff; --shadow:0 2px 10px rgba(0,0,0,0.4); }
:root[data-theme="light"]{ --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --sub:#5b6473; --border:#e1e4ea;
  --accent:#4c6ef5; --accent2:#3b5bdb; --good:#2f9e44; --bad:#e03131; --warn:#f08c00;
  --badge-bg:#eef1ff; --badge-text:#3b5bdb; --shadow:0 2px 10px rgba(0,0,0,0.06); }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;line-height:1.6;}
#app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:1.3rem;margin:0 0 6px;}
h2{font-size:1.1rem;margin:0 0 10px;}
a.link,.link-btn{color:var(--accent);cursor:pointer;text-decoration:none;font-size:0.92rem;}
a.link:hover,.link-btn:hover{text-decoration:underline;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.format-card,.mode-card{cursor:pointer;transition:transform .15s, box-shadow .15s;}
.format-card:hover,.mode-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.format-emoji{font-size:1.8rem;margin-right:8px;}
.muted{color:var(--sub);font-size:0.88rem;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:0.95rem;cursor:pointer;font-weight:600;}
.btn:hover{background:var(--accent2);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-block{display:block;width:100%;text-align:center;margin-top:10px;}
.badge{display:inline-block;background:var(--badge-bg);color:var(--badge-text);border-radius:6px;padding:2px 9px;font-size:0.78rem;font-weight:600;margin-right:6px;}
.badge-new{background:var(--new-bg);color:#fff;font-weight:700;}
.progress-wrap{background:var(--border);border-radius:8px;height:8px;overflow:hidden;margin:10px 0 18px;}
.progress-bar{background:var(--accent);height:100%;transition:width .25s;}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px;}
.qbox{font-size:1.15rem;margin:14px 0;font-weight:600;line-height:1.5;}
.hint{background:var(--badge-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--text);font-size:0.95rem;}
input[type=text],textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:1rem;background:var(--bg);color:var(--text);margin-bottom:12px;font-family:inherit;}
textarea{min-height:90px;resize:vertical;}
.choice-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.choice-row:hover{border-color:var(--accent);}
.choice-row.selected{border-color:var(--accent);background:var(--badge-bg);}
.tile-area{min-height:52px;border:2px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;}
.tile{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.95rem;}
.tile.pool{background:var(--card);color:var(--text);border:1px solid var(--border);}
.tile-pool-area{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.placeholder-text{color:var(--sub);font-size:0.9rem;}
.match-cols{display:flex;gap:14px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.match-btn{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;text-align:left;font-size:0.9rem;}
.match-btn.sel{border-color:var(--accent);background:var(--badge-bg);}
.match-btn.paired{opacity:0.45;}
.match-btn.wrongpair{border-color:var(--bad);}
.feedback{border-radius:12px;padding:14px 16px;margin:16px 0;}
.feedback.correct{background:rgba(47,158,68,0.12);border:1px solid var(--good);}
.feedback.incorrect{background:rgba(224,49,49,0.12);border:1px solid var(--bad);}
.feedback-title{font-weight:700;margin-bottom:6px;}
.play-btn{background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:6px 14px;font-size:0.85rem;cursor:pointer;margin-top:6px;}
.play-btn.playing{background:var(--accent);color:#fff;}
.source-thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.source-thumb{width:110px;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--border);}
.trash-link{font-size:0.82rem;color:var(--bad);cursor:pointer;float:right;}
.small-note{font-size:0.85rem;color:var(--sub);margin-top:8px;}
.bookmark-row{display:flex;align-items:center;gap:8px;font-size:0.9rem;margin:8px 0;}
.underline-error{text-decoration:underline wavy var(--bad);text-decoration-thickness:2px;background:rgba(224,49,49,0.15);padding:0 2px;border-radius:3px;font-weight:700;}
.checklist-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.checklist-row input{margin-top:3px;}
.stars{font-size:1.6rem;color:var(--warn);margin:10px 0;}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.img-modal.hidden{display:none;}
.img-modal img{max-width:100%;max-height:100%;border-radius:8px;}
.img-modal-close{position:absolute;top:16px;right:24px;color:#fff;font-size:2rem;cursor:pointer;line-height:1;}
.center{text-align:center;}
.row-between{display:flex;justify-content:space-between;align-items:center;}
</style>

<div class="img-modal hidden" id="imgModal" onclick="closeImageModal()">
  <span class="img-modal-close" onclick="closeImageModal()">&times;</span>
  <img id="imgModalImg" src="" alt="出典画像">
</div>

<script>

const FOLDER_NAME = "アプリspeakからの表現";
const FILLCHOICE_QUESTIONS = [{"id": 1, "type": "fill", "category": "レストラン・カフェ表現", "question": "It's _____!", "hint": "楽しい時間になりそうだと期待を伝える場面です。", "fullSentence": "It's gonna be a blast!", "answer": "gonna be a blast", "source": "IMG_0627", "explanation": "'blast'は口語で「とても楽しいこと」。be going toの口語形gonnaと組み合わせてよく使われます。", "relatedInfo": ""}, {"id": 2, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\n話題になっているものが実際にそれだけの価値があると認める場面です。", "hint": "話題になっているものが実際にそれだけの価値があると認める場面です。", "fullSentence": "That's worth the hype.", "answer": "worth the hype", "choices": ["worth the hype", "need a minute", "iced, to go", "an extra person joining"], "source": "IMG_0627", "explanation": "'hype'は「話題・誇大宣伝」。'worth the hype'は評判に見合う価値があるという口語表現です。", "relatedInfo": ""}, {"id": 3, "type": "fill", "category": "レストラン・カフェ表現", "question": "Do you _____?", "hint": "レストランに入る前に、事前予約を受け付けているか店員に尋ねる場面です。", "fullSentence": "Do you take reservations?", "answer": "take reservations", "source": "IMG_0627", "explanation": "'take reservations'で「予約を受け付ける」。takeは「受け入れる」の意味で使われます。", "relatedInfo": ""}, {"id": 4, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\n予約なしでそのまま来店した客を受け入れているか尋ねる場面です。", "hint": "予約なしでそのまま来店した客を受け入れているか尋ねる場面です。", "fullSentence": "Do you take walk-ins?", "answer": "take walk-ins", "choices": ["take walk-ins", "take reservations", "sit by the wall", "an extra person joining"], "source": "IMG_0627", "explanation": "'walk-in'は「予約なしの来店客」を指す名詞です。", "relatedInfo": ""}, {"id": 5, "type": "fill", "category": "レストラン・カフェ表現", "question": "I'd like to make a reservation for _____.", "hint": "6人グループで予約を取りたいと申し込む場面です。", "fullSentence": "I'd like to make a reservation for a party of six.", "answer": "a party of six", "source": "IMG_0627", "explanation": "'a party of six'で「6人組」。人数を伝える際の定型表現です。", "relatedInfo": ""}, {"id": 6, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\n来週の日曜午後に2人用の席を予約したいと頼む場面です。", "hint": "来週の日曜午後に2人用の席を予約したいと頼む場面です。", "fullSentence": "Can we get a table for two for next Sunday afternoon?", "answer": "a table for two", "choices": ["a table for two", "an extra person joining", "need a minute", "take walk-ins"], "source": "IMG_0627", "explanation": "'a table for + 人数'でテーブルの人数指定ができます。", "relatedInfo": ""}, {"id": 7, "type": "fill", "category": "レストラン・カフェ表現", "question": "Could we _____?", "hint": "壁際の席に座りたいと希望を伝える場面です。", "fullSentence": "Could we sit by the wall?", "answer": "sit by the wall", "source": "IMG_0627", "explanation": "'by the wall'は「壁のそば」。席の位置を指定するときに使います。", "relatedInfo": ""}, {"id": 8, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\n仕切りのあるボックス席を希望する場面です。", "hint": "仕切りのあるボックス席を希望する場面です。", "fullSentence": "Could we get a booth?", "answer": "get a booth", "choices": ["get a booth", "sit by the wall", "inside or outside", "take reservations"], "source": "IMG_0627", "explanation": "'booth'はレストランなどの仕切り付き座席のことです。", "relatedInfo": ""}, {"id": 9, "type": "fill", "category": "レストラン・カフェ表現", "question": "Is _____ you?", "hint": "店員が、同席者がもう一人増えるかどうかを確認する場面です。", "fullSentence": "Is an extra person joining you?", "answer": "an extra person joining", "source": "IMG_0627", "explanation": "'join'は「加わる」。人数確認の定番フレーズです。", "relatedInfo": ""}, {"id": 10, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\nメニューを決めるのにもう少し時間が欲しいと店員に伝える場面です。", "hint": "メニューを決めるのにもう少し時間が欲しいと店員に伝える場面です。", "fullSentence": "We need a minute.", "answer": "need a minute", "choices": ["need a minute", "a party of six", "an extra person joining", "sit by the wall"], "source": "IMG_0627", "explanation": "'need a minute'は「少し時間が欲しい」という口語表現です。", "relatedInfo": ""}, {"id": 11, "type": "fill", "category": "レストラン・カフェ表現", "question": "_____ do you have?", "hint": "メイン料理に添える付け合わせの種類を尋ねる場面です。", "fullSentence": "What sides do you have?", "answer": "What sides", "source": "IMG_0627", "explanation": "'side(s)'は「付け合わせ料理」を意味します。", "relatedInfo": ""}, {"id": 12, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\nノートパソコンを充電できるコンセントの場所を尋ねる場面です。", "hint": "ノートパソコンを充電できるコンセントの場所を尋ねる場面です。", "fullSentence": "Where can I plug in my laptop?", "answer": "plug in my laptop", "choices": ["plug in my laptop", "What sides", "gonna be a blast", "take walk-ins"], "source": "IMG_0627", "explanation": "'plug in'は「電源に差し込む・充電する」という意味です。", "relatedInfo": ""}, {"id": 13, "type": "fill", "category": "レストラン・カフェ表現", "question": "What time do you _____?", "hint": "その店の翌日の開店時刻を尋ねる場面です。", "fullSentence": "What time do you open tomorrow?", "answer": "open tomorrow", "source": "IMG_0627", "explanation": "'open'は自動詞として「開店する」の意味で使われます。", "relatedInfo": ""}, {"id": 14, "type": "choice", "category": "レストラン・カフェ表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\nサイズと温度、持ち帰りを指定して飲み物を注文する場面です。", "hint": "サイズと温度、持ち帰りを指定して飲み物を注文する場面です。", "fullSentence": "Can I get a twelve-ounce americano, iced, to go?", "answer": "iced, to go", "choices": ["iced, to go", "gonna be a blast", "sit by the wall", "a table for two"], "source": "IMG_0627", "explanation": "'to go'は「持ち帰りで」という意味の定番表現です。", "relatedInfo": ""}, {"id": 15, "type": "fill", "category": "レストラン・カフェ表現", "question": "Would you like to sip it _____?", "hint": "店内・店外どちらで飲むか店員に聞かれる場面です。", "fullSentence": "Would you like to sip it inside or outside?", "answer": "inside or outside", "source": "IMG_0627", "explanation": "'sip'は「(飲み物を)少しずつ飲む」という動詞です。", "relatedInfo": ""}, {"id": 16, "type": "choice", "category": "ショッピング・外食表現", "question": "次の状況を表す英語として最も適切なものを選んでください。\n特定の食品にアレルギーがあることを伝える場面です。", "hint": "特定の食品にアレルギーがあることを伝える場面です。", "fullSentence": "I'm allergic to nuts.", "answer": "allergic to nuts", "choices": ["allergic to nuts", "fitting rooms", "out of my price range", "is on me"], "source": "IMG_0628", "explanation": "'be allergic to ~'で「~にアレルギーがある」という意味です。", "relatedInfo": ""}, {"id": 17, "type": "fill", "category": "ショッピング・外食表現" const REVIEW_SYNC_TEST_ID = "appspeak_all";
const REVIEW_SYNC_KEYS = [BOOKMARK_KEY_FILLCHOICE, BOOKMARK_KEY_ORDER, BOOKMARK_KEY_WRITE];
let _reviewSyncDocRef = null;
function reviewSyncGetId() {
  let id = localStorage.getItem('aien_sync_id');
  if (id === null) {
    const input = prompt('復習リストを他の端末（PC/スマホ）と共有する場合は、合言葉を入力してください。\n全ての端末で同じ言葉を入力すると復習リストが共有されます。\n共有しない場合は空欄のままOKしてください。', '');
    id = (input && input.trim()) ? input.trim() : '__none__';
    localStorage.setItem('aien_sync_id', id);
  }
  return id === '__none__' ? null : id;
}
function changeSyncId() {
  const current = localStorage.getItem('aien_sync_id');
  const input = prompt('復習リストを他の端末と共有するための合言葉を入力してください(全端末で同じ言葉にしてください)。\n共有をやめる場合は空欄のままOKしてください。', (current && current !== '__none__') ? current : '');
  if (input === null) return;
  localStorage.setItem('aien_sync_id', input.trim() ? input.trim() : '__none__');
  location.reload();
}
function reviewSyncStatusLabel() {
  const id = localStorage.getItem('aien_sync_id');
  return (id && id !== '__none__') ? `共有ON（合言葉: ${id}）` : '共有OFF';
}
async function initReviewSync() {
  try {
    const syncId = reviewSyncGetId();
    if (!syncId) return;
    if (!window._reviewSyncApp) window._reviewSyncApp = firebase.initializeApp(REVIEW_SYNC_CONFIG);
    const db = firebase.firestore();
    const docRef = db.collection('reviewLists').doc(syncId + '__' + REVIEW_SYNC_TEST_ID);
    const snap = await Promise.race([
      docRef.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    if (snap && snap.exists) {
      const data = snap.data();
      REVIEW_SYNC_KEYS.forEach(key => {
        if (Array.isArray(data[key])) localStorage.setItem(key, JSON.stringify(data[key]));
      });
    }
    _reviewSyncDocRef = docRef;
  } catch (e) {
    console.warn('復習リストのクラウド同期に失敗しました(オフラインの可能性)。ローカルのデータのみで動作します。', e);
  }
}
function reviewSyncPush(key) {
  if (!_reviewSyncDocRef) return;
  try {
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    _reviewSyncDocRef.set({ [key]: list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
      .catch(e => console.warn('復習リストの送信に失敗しました', e));
  } catch (e) {}
}

  let list = getBookmarks(format);
  list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  localStorage.setItem(bookmarkKeyFor(format), JSON.stringify(list));
  reviewSyncPush(bookmarkKeyFor(format));
  return list.includes(id);
}
function getTrash(format){
  if(!HAS_STORAGE) return [];
  return JSON.parse(localStorage.getItem(trashKeyFor(format)) || '[]');
}
function moveToTrash(format, id){
  if(!HAS_STORAGE) return;
  const list = getTrash(format);
  if(!list.includes(id)){ list.push(id); localStorage.setItem(trashKeyFor(format), JSON.stringify(list)); }
}
function restoreFromTrash(format, id){
  if(!HAS_STORAGE) return;
  const list = getTrash(format).filter(x => x !== id);
  localStorage.setItem(trashKeyFor(format), JSON.stringify(list));
}
function exportTrash(){
  const formats = ['fillchoice','order','write'];
  const trashedQuestions = [];
  formats.forEach(format => {
    const ids = new Set(getTrash(format));
    questionsFor(format).forEach(q => { if(ids.has(q.id)) trashedQuestions.push(Object.assign({format}, q)); });
  });
  if (trashedQuestions.length === 0){ alert('ゴミ箱は空です'); return; }
  const payload = { folder: FOLDER_NAME, exportedAt: new Date().toISOString(), trashedQuestions };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = FOLDER_NAME + '_trash_export.json'; a.click();
  URL.revokeObjectURL(url);
}
function activeQuestionsFor(format){
  const trashed = new Set(getTrash(format));
  return questionsFor(format).filter(q => !trashed.has(q.id));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function getRandomSessionQuestions(format){
  const all = activeQuestionsFor(format);
  const seen = HAS_STORAGE ? JSON.parse(localStorage.getItem(storageKeyFor(format)) || '[]') : [];
  const seenSet = new Set(seen);
  const seenQuestions = all.filter(q => seenSet.has(q.id));
  const unseenQuestions = all.filter(q => !seenSet.has(q.id));
  if (seenQuestions.length > 0){
    const total = Math.min(10, all.length);
    const fromSeen = Math.round(total * 0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0, fromSeen);
    const pickedUnseen = shuffle(unseenQuestions).slice(0, fromUnseen);
    if (pickedUnseen.length < fromUnseen){
      const extra = shuffle(seenQuestions.filter(q => !pickedSeen.includes(q))).slice(0, fromUnseen - pickedUnseen.length);
      return shuffle([...pickedSeen, ...pickedUnseen, ...extra]);
    }
    return shuffle([...pickedSeen, ...pickedUnseen]);
  }
  return shuffle(all).slice(0, 10);
}
function getAllSessionQuestions(format){ return shuffle(activeQuestionsFor(format)); }
function getCategorySessionQuestions(format, categoryName){ return shuffle(activeQuestionsFor(format).filter(q => q.category === categoryName)); }
function getBookmarkSelectedSessionQuestions(format, selectedIds){
  const idSet = new Set(selectedIds || []);
  return shuffle(activeQuestionsFor(format).filter(q => idSet.has(q.id)));
}
function getBookmarkRandomSessionQuestions(format){
  const bookmarks = new Set(getBookmarks(format));
  const pool = activeQuestionsFor(format).filter(q => bookmarks.has(q.id));
  return shuffle(pool).slice(0, Math.min(10, pool.length));
}
function saveSeenQuestions(format, questions){
  if(!HAS_STORAGE) return;
  const key = storageKeyFor(format);
  const prev = JSON.parse(localStorage.getItem(key) || '[]');
  const merged = Array.from(new Set([...prev, ...questions.map(q => q.id)]));
  localStorage.setItem(key, JSON.stringify(merged));
}

function startTest(format, mode, categoryName, selectedIds){
  currentFormat = format;
  currentMode = mode;
  currentCategory = categoryName || null;
  currentSelectedIds = selectedIds || [];
  if (mode === 'random') sessionQuestions = getRandomSessionQuestions(format);
  else if (mode === 'all') sessionQuestions = getAllSessionQuestions(format);
  else if (mode === 'category') sessionQuestions = getCategorySessionQuestions(format, categoryName);
  else if (mode === 'bookmarkSelect') sessionQuestions = getBookmarkSelectedSessionQuestions(format, currentSelectedIds);
  else if (mode === 'bookmarkRandom') sessionQuestions = getBookmarkRandomSessionQuestions(format);
  sessionQuestions = sessionQuestions.map(q => {
    if (q.type === 'choice') return Object.assign({}, q, {shuffledChoices: shuffle(q.choices)});
    if (q.type === 'reorder') return Object.assign({}, q, {shuffledTokens: shuffle(q.tokens)});
    if (q.type === 'match') return Object.assign({}, q, {
      shuffledJa: shuffle(q.pairs.map((p,i)=>({text:p.japanese, idx:i}))),
      shuffledEn: shuffle(q.pairs.map((p,i)=>({text:p.english, idx:i})))
    });
    return q;
  });
  currentIndex = 0;
  score = 0;
  screen = 'question';
  qState = {};
  render();
}

let currentAudio = null;
let currentBtn = null;
function resetPlayBtn(btn){ btn.textContent = '🔊 英文を聞く'; btn.classList.remove('playing'); }
function playAudio(btn, src){
  const isSameBtn = (currentBtn === btn);
  if (currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; }
  if (currentBtn){ resetPlayBtn(currentBtn); currentBtn = null; }
  if (isSameBtn){ currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = '■ 停止'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if(currentBtn===btn){currentBtn=null;currentAudio=null;} };
  audio.play();
}

   <button class="btn btn-secondary" onclick="bmSelectNone()">全解除</button></div>`;

function questionExcerpt(q){
  if (q.question) return q.question.replace(/\n/g,' ').slice(0,80);
  if (q.hint) return q.hint.slice(0,80);
  if (q.pairs && q.pairs[0]) return q.pairs[0].japanese;

}
function typeBadge(t){
  return {fill:'穴埋め',choice:'選択肢',reorder:'並べ替え',correction:'誤り訂正',free:'自由記述',match:'マッチング'}[t] || t;

function bmToggle(id, total){

/* =============== SCREEN: QUESTION =============== */
function currentQ(){ return sessionQuestions[currentIndex]; }

function initQState(q){
  answered = false; lastResult = null;
  if (q.type === 'reorder') qState = { built: [] };
  else if (q.type === 'match') qState = { leftSel:null, pairs:[] };
  else qState = {};
}

function renderQuestionScreen(){
  if (currentIndex >= sessionQuestions.length){ screen='results'; return renderResults(); }
  const q = currentQ();
  if (qState.__qid !== q.id){ initQState(q); qState.__qid = q.id; }
  const total = sessionQuestions.length;
  const pct = Math.round((currentIndex)/total*100);
  const bookmarks = new Set(getBookmarks(currentFormat));
  const isBookmarked = bookmarks.has(q.id);

  let html = `<div class="header-row">
    <div><span class="badge">${formatLabel(currentFormat)}</span> Q ${currentIndex+1}/${total}</div>
    <a class="link" onclick="showModeSelect(currentFormat)">スタート画面に戻る</a>
  </div>
  <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;

  html += `<div class="card">`;
  html += `<div class="row-between">
    <div><span class="badge">${typeBadge(q.type)}</span><span class="badge">${esc(q.category)}</span>${q.isNew?'<span class="badge badge-new">🆕 NEW!</span>':''}</div>
    <a class="trash-link" onclick="askTrashCurrent()">この問題は表示しない</a>
  </div>`;
  html += `<div class="bookmark-row"><label><input type="checkbox" ${isBookmarked?'checked':''} onchange="onBookmarkToggle(${q.id})"> この問題を復習リストに入れる</label></div>`;

  html += renderQuestionBody(q);

  if (answered) html += renderFeedback(q);

  html += `</div>`; // end card

  if (!answered){
    html += `<button class="btn btn-block" id="submitBtn" onclick="submitAnswer()" ${submitDisabled(q)?'disabled':''}>回答する</button>`;
  } else {
    html += `<button class="btn btn-block" onclick="nextQuestion()">${currentIndex+1>=total ? '結果を見る' : '次の問題 →'}</button>`;
  }
  return html;
}

function submitDisabled(q){
  if (q.type === 'reorder') return qState.built.length !== q.shuffledTokens.length;
  if (q.type === 'match') return qState.pairs.length !== q.pairs.length;
  if (q.type === 'choice') return qState.selected === undefined || qState.selected === null;
  return false;
}

function onBookmarkToggle(id){ toggleBookmark(currentFormat, id); }

function askTrashCurrent(){
  if (confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')){
    moveToTrash(currentFormat, currentQ().id);
    render();
  }
}

function renderQuestionBody(q){
  if (q.type === 'fill'){
    return `<div class="hint">${esc(q.hint)}</div>
      <div class="qbox">${esc(q.question)}</div>
      <input type="text" id="answerInput" placeholder="英語で入力" ${answered?'disabled':''} value="${answered && qState.userInput ? esc(qState.userInput):''}">`;
  }
  if (q.type === 'choice'){
    const opts = q.shuffledChoices || q.choices;
    return `<div class="hint">${esc(q.hint)}</div>
      <div class="qbox">${esc(q.question)}</div>
      ${opts.map((c,i) => `<div class="choice-row ${qState.selected===c?'selected':''}" onclick="${answered?'':'selectChoice(\''+esc(c).replace(/'/g,"\\'")+'\')'}">
        <input type="radio" name="choiceOpt" ${qState.selected===c?'checked':''} ${answered?'disabled':''}>${esc(c)}
      </div>`).join('')}`;
  }
  if (q.type === 'reorder'){
    const used = new Set(qState.builtIdx || []);
    return `<div class="hint">${esc(q.hint)}</div>
      <div class="tile-area" id="tileArea">
        ${qState.built.length ? qState.built.map((t,i)=>`<span class="tile" onclick="${answered?'':'removeTile('+i+')'}">${esc(t)}</span>`).join('') : '<span class="placeholder-text">タップして単語を選んでください</span>'}
      </div>
      <div class="tile-pool-area">
        ${q.shuffledTokens.map((t,i)=> used.has(i) ? '' : `<span class="tile pool" onclick="${answered?'':'addTile('+i+')'}">${esc(t)}</span>`).join('')}
      </div>
      <button class="btn btn-secondary" onclick="resetTiles()" ${answered?'disabled':''}>リセット</button>`;
  }
  if (q.type === 'correction'){
    const displayQ = q.question.replace(/\[\[(.+?)\]\]/g, '<span class="underline-error">$1</span>');
    return `<div class="hint">${esc(q.hint)}</div>
      <div class="qbox">${displayQ}</div>
      <p class="muted">下線部を正しい形に直してください</p>
      <input type="text" id="answerInput" placeholder="正しい形を入力" ${answered?'disabled':''} value="${answered && qState.userInput ? esc(qState.userInput):''}">`;
  }
  if (q.type === 'free'){
    return `<div class="hint">${esc(q.hint)}</div>
      <textarea id="answerInput" placeholder="英文を自由入力してください" ${answered?'disabled':''}>${answered && qState.userInput ? esc(qState.userInput):''}</textarea>`;
  }
  if (q.type === 'match'){
    return `<div class="hint">日本語と英語を正しく組み合わせてください</div>
      <div class="match-cols">
        <div class="match-col">${q.shuffledJa.map(item => matchBtnHtml('ja', item)).join('')}</div>
        <div class="match-col">${q.shuffledEn.map(item => matchBtnHtml('en', item)).join('')}</div>
      </div>`;
  }
  return '';
}

function matchBtnHtml(side, item){
  const pairedEntry = qState.pairs.find(p => side==='ja' ? p.jaIdx===item.idx : p.enIdx===item.idx);
  let cls = 'match-btn';
  if (pairedEntry) cls += ' paired';
  if (side==='ja' && qState.leftSel===item.idx && !pairedEntry) cls += ' sel';
  if (answered && pairedEntry && pairedEntry.jaIdx !== pairedEntry.enIdx) cls += ' wrongpair';
  if (answered){
    return `<button class="${cls}" disabled>${esc(item.text)}</button>`;
  }
  if (pairedEntry){
    // clicking a paired item un-pairs it, allowing rematching
    return `<button class="${cls}" onclick="matchUnpair('${side}',${item.idx})">${esc(item.text)}</button>`;
  }
  return `<button class="${cls}" onclick="matchClick('${side}',${item.idx})">${esc(item.text)}</button>`;
}
function matchUnpair(side, idx){
  qState.pairs = qState.pairs.filter(p => side==='ja' ? p.jaIdx!==idx : p.enIdx!==idx);
  render();
}

function selectChoice(val){ qState.selected = val; render(); }

function addTile(idx){
  qState.built = qState.built || [];
  qState.builtIdx = qState.builtIdx || [];
  qState.built.push(currentQ().shuffledTokens[idx]);
  qState.builtIdx.push(idx);
  render();
}
function removeTile(pos){
  qState.built.splice(pos,1);
  qState.builtIdx.splice(pos,1);
  render();
}
function resetTiles(){ qState.built = []; qState.builtIdx = []; render(); }

function matchClick(side, idx){
  if (side === 'ja'){
    qState.leftSel = (qState.leftSel === idx) ? null : idx;
  } else {
    if (qState.leftSel === null || qState.leftSel === undefined) return;
    qState.pairs.push({jaIdx: qState.leftSel, enIdx: idx});
    qState.leftSel = null;
  }
  render();
}

/* =============== SUBMIT / FEEDBACK =============== */
function submitAnswer(){
  const q = currentQ();
  answered = true;
  if (q.type === 'fill' || q.type === 'correction'){
    const val = document.getElementById('answerInput').value;
    qState.userInput = val;
    const norm = val.trim().toLowerCase();
    const correct = norm === q.answer.trim().toLowerCase();
    lastResult = {correct};
    if (correct) score++;
  } else if (q.type === 'choice'){
    const correct = qState.selected === q.answer;
    lastResult = {correct};
    if (correct) score++;
  } else if (q.type === 'reorder'){
    const correct = JSON.stringify(qState.built) === JSON.stringify(q.tokens);
    lastResult = {correct};
    if (correct) score++;
  } else if (q.type === 'free'){
    const val = document.getElementById('answerInput').value;
    qState.userInput = val;
    const norm = val.trim().toLowerCase();
    const missing = q.keyPhrases.filter(k => !norm.includes(k));
    const correct = missing.length === 0;
    lastResult = {correct, missing};
    if (correct) score++;
  } else if (q.type === 'match'){
    let correctCount = 0;
    q.pairs.forEach((p,i) => {
      const found = qState.pairs.find(pp => pp.jaIdx===i);
      if (found && found.enIdx === i) correctCount++;
    });
    const correct = correctCount === q.pairs.length;
    lastResult = {correct, correctCount, total:q.pairs.length};
    if (correct) score++;
  }
  render();
}

function renderFeedback(q){
  const r = lastResult;
  let html = '';
  if (q.type === 'fill' || q.type === 'choice'){
    html += `<div class="feedback ${r.correct?'correct':'incorrect'}">
      <div class="feedback-title">${r.correct?'✅ 正解！':'❌ 不正解'}</div>
      <div>正解: <strong>${esc(q.answer)}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('fillchoice')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>
    </div>`;
  } else if (q.type === 'reorder'){
    html += `<div class="feedback ${r.correct?'correct':'incorrect'}">
      <div class="feedback-title">${r.correct?'✅ 正解！':'❌ 不正解'}</div>
      <div>正解の英文: <strong>${esc(q.tokens.join(' '))}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('order')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>
    </div>`;
  } else if (q.type === 'correction'){
    html += `<div class="feedback ${r.correct?'correct':'incorrect'}">
      <div class="feedback-title">${r.correct?'✅ 正解！':'❌ 不正解'}</div>
      <div>正解の英文: <strong>${esc(q.fullSentence)}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('order')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>
    </div>`;
  } else if (q.type === 'free'){
    html += `<div class="feedback ${r.correct?'correct':'incorrect'}">
      <div class="feedback-title">${r.correct? '✅ 正解！（必須語句をすべて含んでいます）' : '❌ 不正解（不足している語句があります）'}</div>
      ${!r.correct ? `<div>不足している語句: <strong>${r.missing.map(esc).join(', ')}</strong></div>` : ''}
      <div>模範解答: <strong>${esc(q.answer)}</strong></div>
      <button class="play-btn" onclick="playAudio(this, audioFolderFor('write')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>
      <p class="small-note">※自由記述の採点は必須語句を含むかの簡易判定です。文法的な正しさは模範解答と自分で見比べて確認してください。</p>
    </div>`;
  } else if (q.type === 'match'){
    html += `<div class="feedback ${r.correct?'correct':'incorrect'}">
      <div class="feedback-title">${r.correct? '✅ 全問正解！' : ('⚠️ ' + r.correctCount + ' / ' + r.total + ' 正解')}</div>
      <div style="margin-top:8px;">`;
    q.pairs.forEach((p,i) => {
      const found = qState.pairs.find(pp => pp.jaIdx===i);
      const wasWrong = !(found && found.enIdx===i);
      html += `<div style="margin-bottom:6px;">${wasWrong?'❌ ':'✅ '}${esc(p.japanese)} → <strong>${esc(p.english)}</strong>
        <button class="play-btn" onclick="playAudio(this, audioFolderFor('write')+'/'+${q.id}+'_p'+${i}+'.mp3')">🔊</button></div>`;
    });
    html += `</div></div>`;
  }
  html += sourceThumbsHtml(q);
  if (q.relatedInfo) html += `<div class="small-note">💡 関連知識: ${esc(q.relatedInfo)}</div>`;
  if (q.explanation) html += `<div class="small-note">📝 解説: ${esc(q.explanation)}</div>`;
  return html;
}

function nextQuestion(){
  currentIndex++;
  if (currentIndex >= sessionQuestions.length){
    if (currentMode === 'random') saveSeenQuestions(currentFormat, sessionQuestions);
    screen = 'results';
  }
  render();
}

/* =============== RESULTS =============== */
function renderResults(){
  const total = sessionQuestions.length;
  const pct = total ? Math.round(score/total*100) : 0;
  let stars = '—', msg = 'ノートを見直して再チャレンジ！';
  if (pct >= 90){ stars='★★★'; msg='Excellent! TOEFL満点レベルの実力です'; }
  else if (pct >= 70){ stars='★★'; msg='Good! あと少しで完璧です'; }
  else if (pct >= 50){ stars='★'; msg='Keep going! 復習して再挑戦しましょう'; }

  return `<h1>結果</h1>
    <div class="card center">
      <p>${formatLabel(currentFormat)}</p>
      <h2>${score} / ${total} 問正解（${pct}%）</h2>
      <div class="stars">${stars}</div>
      <p>${msg}</p>
    </div>
    <button class="btn btn-block" onclick="startTest(currentFormat,currentMode,currentCategory,currentSelectedIds)">もう一度同じ形式・モードで挑戦する</button>
    <button class="btn btn-block btn-secondary" onclick="showFormatSelect()">別の形式に挑戦する</button>
    <button class="btn btn-block btn-secondary" onclick="showFormatSelect()">🏠 最初から</button>`;
}

/* init */
initReviewSync().then(render);
</script>
