<meta charset="UTF-8">
<title>アプリSpeak表現テスト（穴埋め・並べ替え・自由記述）</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#38bdf8; --accent2:#818cf8; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e2338); color:var(--text); min-height:100vh;
    padding:20px 14px 60px;
  }
  #app{max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; text-align:center; margin:10px 0 4px;}
  .sub{text-align:center; color:var(--muted); font-size:.9rem; margin-bottom:20px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px; margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .format-card{cursor:pointer; transition:.15s; border:1px solid var(--border);}
  .format-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .format-emoji{font-size:1.8rem; margin-bottom:6px;}
  .format-title{font-size:1.1rem; font-weight:700; margin-bottom:4px;}
  .format-desc{color:var(--muted); font-size:.85rem; margin-bottom:10px; line-height:1.5;}
  .format-count{color:var(--accent); font-size:.8rem; margin-bottom:10px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:12px 18px; font-size:.95rem; font-weight:600;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0f172a; width:100%;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
  .btn-small{padding:8px 12px; font-size:.85rem;}
  .link-btn{background:none; color:var(--accent); text-decoration:underline; padding:4px 0; font-weight:500;}
  a.linklike{color:var(--accent); text-decoration:underline; cursor:pointer; font-size:.9rem;}
  .mode-card{margin-bottom:14px;}
  .mode-title{font-weight:700; margin-bottom:4px;}
  .mode-desc{color:var(--muted); font-size:.85rem; margin-bottom:10px;}
  .cat-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .cat-btn{
    background:var(--card2); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:20px; font-size:.82rem; cursor:pointer;
  }
  .cat-btn.selected{background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700;}
  header.qheader{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .qheader-top{display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--muted);}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700;
    background:var(--card2); border:1px solid var(--border); margin-right:6px;
  }
  .badge-type{background:rgba(56,189,248,.15); color:var(--accent); border-color:rgba(56,189,248,.4);}
  .badge-cat{background:rgba(129,140,248,.15); color:var(--accent2); border-color:rgba(129,140,248,.4);}
  .progress-bar{height:6px; background:var(--card2); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:.3s;}
  .qtop-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .bookmark-label{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); cursor:pointer;}
  .trash-link{font-size:.78rem; color:var(--muted);}
  .hint{color:var(--accent2); font-size:.95rem; background:rgba(129,140,248,.1); padding:10px 12px; border-radius:10px; margin-bottom:14px; line-height:1.6;}
  .qtext{font-size:1.15rem; line-height:1.7; margin-bottom:16px;}
  .blank{color:var(--warn); font-weight:700; letter-spacing:1px;}
  .wrongpart{color:var(--bad); text-decoration:underline; text-decoration-style:wavy; font-weight:700;}
  input[type=text], textarea{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:1rem; margin-bottom:14px; font-family:inherit;
  }
  textarea{min-height:80px; resize:vertical;}
  .choice-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .choice-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--card2); cursor:pointer;
  }
  .choice-item.picked{border-color:var(--accent); background:rgba(56,189,248,.12);}
  .tile-area{
    min-height:60px; border:1px dashed var(--border); border-radius:10px; padding:10px;
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center;
  }
  .tile-area .placeholder{color:var(--muted); font-size:.85rem;}
  .tile{
    background:var(--accent); color:#0f172a; padding:8px 12px; border-radius:8px;
    font-weight:600; cursor:pointer; font-size:.95rem; user-select:none;
  }
  .tile-pool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .tile-pool .tile{background:var(--card2); color:var(--text); border:1px solid var(--border);}
  .row-btns{display:flex; gap:10px; margin-bottom:6px;}
  .match-cols{display:flex; gap:12px; margin-bottom:14px;}
  .match-col{flex:1; display:flex; flex-direction:column; gap:8px;}
  .match-opt{
    padding:10px 10px; border-radius:10px; border:1px solid var(--border); background:var(--card2);
    cursor:pointer; font-size:.85rem; line-height:1.4;
  }
  .match-opt.selected{border-color:var(--accent); background:rgba(56,189,248,.15);}
  .match-opt.paired{opacity:.5;}
  .match-opt.pair-a{border-color:#f472b6;}
  .match-opt.pair-b{border-color:#facc15;}
  .match-opt.pair-c{border-color:#4ade80;}
  .match-opt.pair-d{border-color:#38bdf8;}
  .feedback{margin-top:16px; padding-top:16px; border-top:1px solid var(--border);}
  .result-line{font-size:1.15rem; font-weight:700; margin-bottom:10px;}
  .result-line.ok{color:var(--good);}
  .result-line.ng{color:var(--bad);}
  .answer-box{background:var(--card2); border-radius:10px; padding:12px; margin-bottom:12px; font-size:.95rem; line-height:1.6;}
  .play-btn{background:var(--card2); border:1px solid var(--accent); color:var(--accent); margin-bottom:12px;}
  .play-btn.playing{background:var(--accent); color:#0f172a;}
  .source-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
  .source-thumb{width:100px; height:100px; object-fit:cover; border-radius:8px; cursor:zoom-in; border:1px solid var(--border);}
  .info-box{font-size:.88rem; color:var(--muted); line-height:1.6; margin-bottom:8px;}
  .info-box b{color:var(--text);}
  .trash-link-feedback{font-size:.8rem; color:var(--bad); text-decoration:underline; cursor:pointer;}
  .match-pair-row{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:8px; background:var(--card2); margin-bottom:6px; font-size:.85rem; gap:10px;}
  .match-pair-row.wrong{border:1px solid var(--bad);}
  .center{text-align:center;}
  .stars{font-size:2rem; margin:10px 0;}
  .trash-row{background:var(--card2); border-radius:10px; padding:12px; margin-bottom:10px;}
  .muted{color:var(--muted); font-size:.85rem;}
  .img-modal{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:999; cursor:zoom-out;}
  .img-modal.hidden{display:none;}
  .img-modal img{max-width:92%; max-height:88%; border-radius:8px;}
  .img-modal-close{position:absolute; top:16px; right:24px; font-size:2rem; color:#fff; cursor:pointer;}
  .footer-links{display:flex; justify-content:center; margin-top:6px;}
  .disabled-note{color:var(--muted); font-size:.78rem; margin-top:4px;}
</style>

<div id="app"></div>
<div class="img-modal hidden" id="imgModal" onclick="closeImageModal()">
  <span class="img-modal-close" onclick="closeImageModal()">&times;</span>
  <img id="imgModalImg" src="" alt="出典画像">
</div>

/* ========================= データ ========================= */
const FILLCHOICE_QUESTIONS = [{"id": 1, "type": "fill", "category": "カフェ・レストラン", "question": "Can I get it _____?", "hint": "アイスにしてもらえますか（冷たい飲み物にしたい時）", "fullSentence": "Can I get it iced?", "answer": "iced", "source": "IMG_0627", "explanation": "icedは「氷入りの、冷たい」という意味の形容詞で、飲み物の温度を指定する時に使う。", "relatedInfo": "反対に温かい場合はhotを使う。"}, {"id": 2, "type": "fill", "category": "カフェ・レストラン", "question": "I'd like to make a _____ for a party of six.", "hint": "6人で予約したい", "fullSentence": "I'd like to make a reservation for a party of six.", "answer": "reservation", "source": "IMG_0627", "explanation": "make a reservationで「予約をする」という定番表現。", "relatedInfo": "party of sixは「6人組」という意味。"}, {"id": 4, "type": "fill", "category": "カフェ・レストラン", "question": "This steak is _____.", "hint": "このステーキは焼きすぎです", "fullSentence": "This steak is overcooked.", "answer": "overcooked", "source": "IMG_0628", "explanation": "overcookedは「火を通しすぎた」という意味の形容詞。", "relatedInfo": "反対語はundercooked（生焼け）。"}, {"id": 5, "type": "fill", "category": "ショッピング", "question": "Could you point me to the _____ section?", "hint": "セール品コーナーはどちらですか", "fullSentence": "Could you point me to the clearance section?", "answer": "clearance", "source": "IMG_0628", "explanation": "clearance sectionは「在庫処分セール品コーナー」を指す。", "relatedInfo": "clearance saleは在庫一掃セールのこと。"}, {"id": 6, "type": "fill", "category": "ショッピング", "question": "What's your return _____?", "hint": "返品ポリシーを教えてください", "fullSentence": "What's your return policy?", "answer": "policy", "source": "IMG_0628", "explanation": "return policyで「返品規定」という意味。", "relatedInfo": "refund（返金）と合わせて覚えると便利。"}, {"id": 7, "type": "fill", "category": "ショッピング", "question": "Do you have any _____ going on?", "hint": "今セールをしていますか", "fullSentence": "Do you have any sales going on?", "answer": "sales", "source": "IMG_0628", "explanation": "salesは「セール、安売り」の意味で複数形で使うことが多い。", "relatedInfo": "on saleは「セール中の」という形容詞的表現。"}, {"id": 8, "type": "fill", "category": "空港・ホテル", "question": "I missed my _____ flight.", "hint": "乗り継ぎ便に乗り遅れました", "fullSentence": "I missed my connecting flight.", "answer": "connecting", "source": "IMG_0632", "explanation": "connecting flightは「乗り継ぎ便」のこと。", "relatedInfo": "layoverも「乗り継ぎ（待ち時間）」を表す。"}, {"id": 9, "type": "fill", "category": "空港・ホテル", "question": "I have a _____.", "hint": "乗り継ぎがあります", "fullSentence": "I have a layover.", "answer": "layover", "source": "IMG_0632", "explanation": "layoverは空港での「乗り継ぎ待ち時間」を指す名詞。", "relatedInfo": "a long layoverで「長い乗り継ぎ時間」。"}, {"id": 10, "type": "fill", "category": "空港・ホテル", "question": "I'd like to exchange some _____.", "hint": "両替をお願いしたいです", "fullSentence": "I'd like to exchange some currency.", "answer": "currency", "source": "IMG_0632", "explanation": "currencyは「通貨」。exchange currencyで「両替する」。", "relatedInfo": "exchange rateは「為替レート」。"}, {"id": 11, "type": "fill", "category": "空港・ホテル", "question": "Do you offer _____ breakfast?", "hint": "朝食は無料で付いていますか", "fullSentence": "Do you offer complimentary breakfast?", "answer": "complimentary", "source": "IMG_0632", "explanation": "complimentaryは「無料の、サービスの」という丁寧な言い方。", "relatedInfo": "freeよりホテルなどで丁寧に聞こえる。"}, {"id": 12, "type": "fill", "category": "旅行・観光", "question": "Can I _____ my bags here for an hour?", "hint": "荷物を1時間ここに置いていってもいいですか", "fullSentence": "Can I leave my bags here for an hour?", "answer": "leave", "source": "IMG_0634", "explanation": "leaveには「置いておく、預ける」という意味がある。", "relatedInfo": "leave a message（伝言を残す）も同じ用法。"}, {"id": 13, "type": "fill", "category": "旅行・観光", "question": "Where's the lost and _____?", "hint": "忘れ物センターはどこですか", "fullSentence": "Where's the lost and found?", "answer": "found", "source": "IMG_0634", "explanation": "lost and foundは「遺失物取扱所」を指す決まり文句。", "relatedInfo": "lost property officeとも言う。"}, {"id": 14, "type": "fill", "category": "旅行・観光", "question": "Let's take a _____!", "hint": "自撮りしよう", "fullSentence": "Let's take a selfie!", "answer": "selfie", "source": "IMG_0634", "explanation": "selfieは「自撮り写真」を意味する口語表現。", "relatedInfo": "take a selfieで「自撮りする」。"}, {"id": 15, "type": "fill", "category": "キャンパスライフ", "question": "Where's the _____ center?", "hint": "レクリエーションセンターはどこですか", "fullSentence": "Where's the rec center?", "answer": "rec", "source": "IMG_0635", "explanation": "recはrecreationの略で、大学キャンパスでよく使われる。", "relatedInfo": "rec centerは「学生用スポーツ施設」を指すことが多い。"}, {"id": 16, "type": "fill", "category": "キャンパスライフ", "question": "I'm _____ English 202.", "hint": "English202を履修しています", "fullSentence": "I'm taking English 202.", "answer": "taking", "source": "IMG_0635", "explanation": "take a classで「授業を履修する」という意味。", "relatedInfo": "enroll inもほぼ同じ意味で使える。"}, {"id": 17, "type": "fill", "category": "キャンパスライフ", "question": "Let's _____ some food later.", "hint": "後で何か食べに行こう", "fullSentence": "Let's grab some food later.", "answer": "grab", "source": "IMG_0635", "explanation": "grab foodはカジュアルに「軽く何か食べる」という意味。", "relatedInfo": "grab a coffeeなど飲食全般に使える。"}, {"id": 18, "type": "fill", "category": "大学事務・授業", "question": "When is the _____?", "hint": "中間試験はいつですか", "fullSentence": "When is the midterm?", "answer": "midterm", "source": "IMG_0631", "explanation": "midtermは「中間試験」を指す名詞。", "relatedInfo": "final（期末試験）とセットで覚える。"}, {"id": 19, "type": "fill", "category": "大学事務・授業", "question": "May I be _____?", "hint": "欠席を認めていただけますか", "fullSentence": "May I be excused?", "answer": "excused", "source": "IMG_0631", "explanation": "be excusedで「（欠席などを）大目に見てもらう」という意味。", "relatedInfo": "excuse an absenceも同様の文脈で使う。"}, {"id": 20, "type": "fill", "category": "大学事務・授業", "question": "I'd like to ask for an _____.", "hint": "延長をお願いしたいです", "fullSentence": "I'd like to ask for an extension.", "answer": "extension", "source": "IMG_0631", "explanation": "extensionは「（締め切りの）延長」を意味する名詞。", "relatedInfo": "deadlineとセットでよく使われる。"}, {"id": 21, "type": "fill", "category": "ビジネス・社会", "question": "We are facing a labor _____.", "hint": "労働力不足に直面しています", "fullSentence": "We are facing a labor shortage.", "answer": "shortage", "source": "IMG_0633", "explanation": "shorta /* ========================= 状態管理 ========================= */
const FOLDER_KEY = "アプリspeakからの表現";
const STORAGE_KEY_FILLCHOICE  = "wt_all_fillchoice_seen_" + FOLDER_KEY;
const BOOKMARK_KEY_FILLCHOICE = "wt_all_fillchoice_bookmark_" + FOLDER_KEY;
const TRASH_KEY_FILLCHOICE    = "wt_all_fillchoice_trash_" + FOLDER_KEY;
const STORAGE_KEY_ORDER       = "wt_all_order_seen_" + FOLDER_KEY;
const BOOKMARK_KEY_ORDER      = "wt_all_order_bookmark_" + FOLDER_KEY;
const TRASH_KEY_ORDER         = "wt_all_order_trash_" + FOLDER_KEY;
const STORAGE_KEY_WRITE       = "wt_all_write_seen_" + FOLDER_KEY;
const BOOKMARK_KEY_WRITE      = "wt_all_write_bookmark_" + FOLDER_KEY;
const TRASH_KEY_WRITE         = "wt_all_write_trash_" + FOLDER_KEY;

let currentFormat = null;
let currentMode = null;
let currentCategory = null;
let currentSelectedIds = [];
let bookmarkSelectChecked = new Set();
let sessionQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let hasStorage = true;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ hasStorage = false; }

const FORMAT_META = {
  fillchoice:{emoji:"✏️",title:"穴埋め・選択肢"},
  order:{emoji:"📝",title:"並べ替え・誤り訂正"},
  write:{emoji:"✍️",title:"自由記述・マッチング"}
};
const CATEGORIES = ["カフェ・レストラン","ショッピング","空港・ホテル","旅行・観光","キャンパスライフ","大学事務・授業","ビジネス・社会","意見・感情・予定"];

function questionsFor(format){
  if(format==="fillchoice") return FILLCHOICE_QUESTIONS;
  if(format==="order") return ORDER_QUESTIONS;
  return WRITE_QUESTIONS;
}
function storageKeyFor(format){
  if(format==="fillchoice") return STORAGE_KEY_FILLCHOICE;
  if(format==="order") return STORAGE_KEY_ORDER;
  return STORAGE_KEY_WRITE;
}
function bookmarkKeyFor(format){
  if(format==="fillchoice") return BOOKMARK_KEY_FILLCHOICE;
  if(format==="order") return BOOKMARK_KEY_ORDER;
  return BOOKMARK_KEY_WRITE;
}
function trashKeyFor(format){
  if(format==="fillchoice") return TRASH_KEY_FILLCHOICE;
  if(format==="order") return TRASH_KEY_ORDER;
  return TRASH_KEY_WRITE;
}
function audioFolderFor(format){
  if(format==="fillchoice") return "audio_fillchoice";
  if(format==="order") return "audio_order";
  return "audio_write";
}
function lsGet(key){ if(!hasStorage) return []; try{ return JSON.parse(localStorage.getItem(key) || "[]"); }catch(e){ return []; } }
function lsSet(key,val){ if(!hasStorage) return; try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function getBookmarks(format){ return lsGet(bookmarkKeyFor(format)); }
function toggleBookmark(format,id){
  let list = getBookmarks(format);
  list = list.includes(id) ? list.filter(x=>x!==id) : [...list,id];
  lsSet(bookmarkKeyFor(format), list);
  return list.includes(id);
}
function getTrash(format){ return lsGet(trashKeyFor(format)); }
function moveToTrash(format,id){
  const list = getTrash(format);
  if(!list.includes(id)){ list.push(id); lsSet(trashKeyFor(format), list); }
}
function restoreFromTrash(format,id){
  lsSet(trashKeyFor(format), getTrash(format).filter(x=>x!==id));
}
function activeQuestionsFor(format){
  const trashed = new Set(getTrash(format));
  return questionsFor(format).filter(q=>!trashed.has(q.id));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function getRandomSessionQuestions(format){
  const all = activeQuestionsFor(format);
  const seenSet = new Set(lsGet(storageKeyFor(format)));
  const seenQuestions = all.filter(q=>seenSet.has(q.id));
  const unseenQuestions = all.filter(q=>!seenSet.has(q.id));
  if(seenQuestions.length>0){
    const total = Math.min(10, all.length);
    const fromSeen = Math.round(total*0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0,fromSeen);
    const pickedUnseen = shuffle(unseenQuestions).slice(0,fromUnseen);
    if(pickedUnseen.length < fromUnseen){
      const extra = shuffle(seenQuestions.filter(q=>!pickedSeen.includes(q))).slice(0, fromUnseen-pickedUnseen.length);
      return shuffle([...pickedSeen,...pickedUnseen,...extra]);
    }
    return shuffle([...pickedSeen,...pickedUnseen]);
  }
  return shuffle(all).slice(0,10);
}
function getAllSessionQuestions(format){ return shuffle(activeQuestionsFor(format)); }
function getCategorySessionQuestions(format,categoryName){ return shuffle(activeQuestionsFor(format).filter(q=>q.category===categoryName)); }
function getBookmarkSelectedSessionQuestions(format,selectedIds){
  const idSet = new Set(selectedIds || []);
  return shuffle(activeQuestionsFor(format).filter(q=>idSet.has(q.id)));
}
function getBookmarkRandomSessionQuestions(format){
  const bm = new Set(getBookmarks(format));
  const pool = activeQuestionsFor(format).filter(q=>bm.has(q.id));
  return shuffle(pool).slice(0, Math.min(10, pool.length));
}
function saveSeenQuestions(format,questions){
  const key = storageKeyFor(format);
  const prev = lsGet(key);
  const merged = Array.from(new Set([...prev, ...questions.map(q=>q.id)]));
  lsSet(key, merged);
}

function startTest(format,mode,categoryName,selectedIds){
  currentFormat = format;
  currentMode = mode;
  currentCategory = categoryName || null;
  currentSelectedIds = selectedIds || [];
  if(!hasStorage){ mode = "random"; currentMode = "random"; }
  if(mode==="random") sessionQuestions = getRandomSessionQuestions(format);
  else if(mode==="all") sessionQuestions = getAllSessionQuestions(format);
  else if(mode==="category") sessionQuestions = getCategorySessionQuestions(format,categoryName);
  else if(mode==="bookmarkSelect") sessionQuestions = getBookmarkSelectedSessionQuestions(format,currentSelectedIds);
  else if(mode==="bookmarkRandom") sessionQuestions = getBookmarkRandomSessionQuestions(format);
  sessionQuestions = sessionQuestions.map(q => q.type==="choice" ? Object.assign({},q,{shuffledChoices:shuffle(q.choices)}) : q);
  sessionQuestions = sessionQuestions.map(q => q.type==="reorder" ? Object.assign({},q,{shuffledTokens:shuffle(q.tokens)}) : q);
  sessionQuestions = sessionQuestions.map(q => q.type==="match" ? Object.assign({},q,{
    shuffledJa: shuffle(q.pairs.map((p,i)=>({idx:i,text:p.japanese}))),
    shuffledEn: shuffle(q.pairs.map((p,i)=>({idx:i,text:p.english})))
  }) : q);
  currentIndex = 0;
  score = 0;
  renderQuestionScreen();
}

/* ========================= 音声再生 ========================= */
let currentAudio = null;
let currentBtn = null;
function resetPlayBtn(btn){ btn.textContent = "🔊 英文を聞く"; btn.classList.remove("playing"); }
function playAudio(btn, src){
  const isSameBtn = (currentBtn === btn);
  if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; }
  if(currentBtn){ resetPlayBtn(currentBtn); currentBtn = null; }
  if(isSameBtn){ currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = "■ 停止"; btn.classList.add("playing");
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if(currentBtn===btn){ currentBtn=null; currentAudio=null; } };
  audio.play();
}

      <div class="mode-title">🔖 復習リストから選んで挑戦</div>
      <div class="mode-desc">ブックマーク数: ${bookmarks.length}問</div>
      <button class="btn-primary" ${bookmarks.length===0?"disabled":""} onclick="renderBookmarkSelectScreen('${format}')">問題を選ぶ</button>
      ${bookmarks.length===0 ? '<div class="disabled-note">まだブックマークがありません。問題画面の🔖から追加できます。</div>' : ""}
    </div>

    <div class="card mode-card">
      <div class="mode-title">🔀 復習リストからランダム10問</div>
      <div class="mode-desc">ブックマーク${bookmarks.length}問から最大10問をランダム出題</div>
      <button class="btn-primary" ${bookmarks.length===0?"disabled":""} onclick="startTest('${format}','bookmarkRandom',null)">このモードで始める</button>
    </div>

    <div class="footer-links">
      <a class="linklike" onclick="renderTrashScreen('${format}')">🗑 ゴミ箱 (${trash.length}問)</a>
    </div>
    ${hasStorage ? "" : '<div class="disabled-note center">localStorage未対応環境のため、ジャンル別・復習リストモードは利用できません。常にランダム10問になります。</div>'}
  `;
}

function renderBookmarkSelectScreen(format){
  currentFormat = format;
  bookmarkSelectChecked = new Set();
  const meta = FORMAT_META[format];
  const items = activeQuestionsFor(format).filter(q => getBookmarks(format).includes(q.id));
  const app = document.getElementById("app");
  const listHtml = items.length === 0
    ? '<div class="card center muted">復習リストに問題がありません</div>'
    : items.map(q => {
        const repText = q.question || q.hint || (q.pairs ? q.pairs[0].japanese : "");
        return `
          <div class="trash-row" data-id="${q.id}">
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
              <input type="checkbox" onchange="toggleBookmarkSelectItem(${q.id})">
              <span>
                <span class="badge badge-type">${typeBadgeLabel(q.type)}</span><span class="badge badge-cat">${q.category}</span>
                <div style="margin:8px 0;">${repText}</div>
              </span>
            </label>
          </div>
        `;
      }).join("");
  app.innerHTML = `
    <a class="linklike" onclick="renderModeSelect('${format}')">← モード選択に戻る</a>
    <h1>🔖 復習リストから問題を選ぶ（${meta.title}）</h1>
    ${items.length > 0 ? `
      <div style="margin-bottom:10px;">
        <button class="btn-secondary btn-small" onclick="bookmarkSelectAll(true)">全選択</button>
        <button class="btn-secondary btn-small" onclick="bookmarkSelectAll(false)">全解除</button>
      </div>
      <p class="sub" id="bookmarkSelectCount">0 / ${items.length}問を選択中</p>
    ` : ""}
    <div id="bookmarkSelectList">${listHtml}</div>
    ${items.length > 0 ? `<button class="btn-primary" id="bookmarkSelectStartBtn" disabled onclick="startBookmarkSelectedTest('${format}')">選んだ問題で挑戦する</button>` : ""}
  `;
}
function toggleBookmarkSelectItem(id){
  if(bookmarkSelectChecked.has(id)) bookmarkSelectChecked.delete(id); else bookmarkSelectChecked.add(id);
  const total = document.querySelectorAll("#bookmarkSelectList [data-id]").length;
  document.getElementById("bookmarkSelectCount").textContent = `${bookmarkSelectChecked.size} / ${total}問を選択中`;
  document.getElementById("bookmarkSelectStartBtn").disabled = bookmarkSelectChecked.size === 0;
}
function bookmarkSelectAll(checked){
  const rows = document.querySelectorAll("#bookmarkSelectList [data-id]");
  bookmarkSelectChecked = new Set();
  rows.forEach(row=>{
    const cb = row.querySelector("input[type=checkbox]");
    cb.checked = checked;
    if(checked) bookmarkSelectChecked.add(Number(row.getAttribute("data-id")));
  });
  document.getElementById("bookmarkSelectCount").textContent = `${bookmarkSelectChecked.size} / ${rows.length}問を選択中`;
  document.getElementById("bookmarkSelectStartBtn").disabled = bookmarkSelectChecked.size === 0;
}
function startBookmarkSelectedTest(format){
  startTest(format, "bookmarkSelect", null, Array.from(bookmarkSelectChecked));
}
function selectCategory(name){
  currentCategory = name;
  document.querySelectorAll("#catList .cat-btn").forEach(el=>{
    el.classList.toggle("selected", el.dataset.cat===name);
  });
  document.getElementById("catStartBtn").disabled = false;
}

/* ========================= 画面: 問題 ========================= */
function renderQuestionScreen(){
  answered = false;
  const app = document.getElementById("app");
  const meta = FORMAT_META[currentFormat];
  const total = sessionQuestions.length;
  app.innerHTML = `
    <header class="qheader">
      <div class="qheader-top">
        <span>${meta.emoji} ${meta.title}</span>
        <span>Q ${currentIndex+1} / ${total}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(currentIndex/total)*100}%"></div></div>
      <a class="linklike" onclick="renderModeSelect(currentFormat)">← スタート画面に戻る</a>
    </header>
    <div class="card" id="qcard"></div>
  `;
  renderQuestionCard();
}

function typeBadgeLabel(type){
  return {fill:"穴埋め",choice:"選択肢",reorder:"並べ替え",correction:"誤り訂正",free:"自由記述",match:"マッチング"}[type] || type;
}

function renderQuestionCard(){
  const q = sessionQuestions[currentIndex];
  const bookmarks = getBookmarks(currentFormat);
  const isBookmarked = bookmarks.includes(q.id);
  const qcard = document.getElementById("qcard");

  let bodyHtml = "";
  if(q.type==="fill"){
    bodyHtml = `
      <div class="hint">💡 ${q.hint}</div>
      <div class="qtext">${q.question.replace("_____", '<span class="blank">_____</span>')}</div>
      <input type="text" id="ansInput" placeholder="英語で入力" autocomplete="off">
      <button class="btn-primary" onclick="submitAnswer()">回答する</button>
    `;
  } else if(q.type==="choice"){
    bodyHtml = `
      <div class="hint">💡 ${q.hint}</div>
      <div class="qtext">${q.question}</div>
      <div class="choice-list" id="choiceList">
        ${q.shuffledChoices.map((c,i)=>`<div class="choice-item" data-val="${i}" onclick="pickChoice(${i})">${c}</div>`).join("")}
      </div>
      <button class="btn-primary" id="submitBtn" disabled onclick="submitAnswer()">回答する</button>
    `;
  } else if(q.type==="reorder"){
    bodyHtml = `
      <div class="hint">💡 ${q.hint}</div>
      <div class="tile-area" id="tileArea"><span class="placeholder">タップして単語を選んでください</span></div>
      <div class="tile-pool" id="tilePool">
        ${q.shuffledTokens.map((t,i)=>`<div class="tile" data-idx="${i}" onclick="pickTile(${i})">${t}</div>`).join("")}
      </div>
      <div class="row-btns">
        <button class="btn-secondary btn-small" onclick="resetTiles()">リセット</button>
      </div>
      <button class="btn-primary" id="submitBtn" disabled onclick="submitAnswer()">回答する</button>
    `;
  } else if(q.type==="correction"){
    const displayQ = q.question.replace(/\[\[(.+?)\]\]/, '<span class="wrongpart">$1</span>');
    bodyHtml = `
      <div class="hint">💡 ${q.hint}</div>
      <div class="qtext">${displayQ}</div>
      <input type="text" id="ansInput" placeholder="正しい形に直してください" autocomplete="off">
      <button class="btn-primary" onclick="submitAnswer()">回答する</button>
    `;
  } else if(q.type==="free"){
    bodyHtml = `
      <div class="hint">💡 ${q.hint}</div>
      <textarea id="ansInput" placeholder="英文を入力してください"></textarea>
      <button class="btn-primary" onclick="submitAnswer()">回答する</button>
    `;
  } else if(q.type==="match"){
    bodyHtml = `
      <div class="hint">💡 日本語と英語を正しく組み合わせてください</div>
      <div class="match-cols">
        <div class="match-col" id="matchJa">
          ${q.shuffledJa.map(item=>`<div class="match-opt" data-idx="${item.idx}" onclick="pickMatchJa(${item.idx})">${item.text}</div>`).join("")}
        </div>
        <div class="match-col" id="matchEn">
          ${q.shuffledEn.map(item=>`<div class="match-opt" data-idx="${item.idx}" onclick="pickMatchEn(${item.idx})">${item.text}</div>`).join("")}
        </div>
      </div>
      <button class="btn-primary" id="submitBtn" disabled onclick="submitAnswer()">回答する</button>
    `;
  }

  qcard.innerHTML = `
    <div class="qtop-row">
      <div>
        <span class="badge badge-type">${typeBadgeLabel(q.type)}</span>
        <span class="badge badge-cat">${q.category}</span>
      </div>
      <a class="trash-link" onclick="trashCurrentQuestion()">🗑 この問題は表示しない</a>
    </div>
    <label class="bookmark-label">
      <input type="checkbox" id="bookmarkChk" ${isBookmarked?"checked":""} onchange="toggleBookmark(currentFormat, sessionQuestions[currentIndex].id)">
      この問題を復習リストに入れる
    </label>
    <div id="qbody">${bodyHtml}</div>
    <div id="feedbackArea"></div>
  `;

  // 状態変数初期化
  window.__pickedChoice = null;
  window.__tileOrder = [];
  window.__matchJaSel = null;
  window.__matchEnSel = null;
  window.__matchPairs = {}; // jaIdx -> enIdx
}

function pickChoice(i){
  if(answered) return;
  window.__pickedChoice = i;
  document.querySelectorAll("#choiceList .choice-item").forEach(el=>{
    el.classList.toggle("picked", Number(el.dataset.val)===i);
  });
  document.getElementById("submitBtn").disabled = false;
}

function pickTile(poolIdx){
  if(answered) return;
  const q = sessionQuestions[currentIndex];
  window.__tileOrder.push(poolIdx);
  renderTileState();
}
function removeTileFromArea(pos){
  if(answered) return;
  window.__tileOrder.splice(pos,1);
  renderTileState();
}
function renderTileState(){
  const q = sessionQuestions[currentIndex];
  const area = document.getElementById("tileArea");
  const pool = document.getElementById("tilePool");
  if(window.__tileOrder.length===0){
    area.innerHTML = '<span class="placeholder">タップして単語を選んでください</span>';
  } else {
    area.innerHTML = window.__tileOrder.map((poolIdx,pos)=>`<div class="tile" onclick="removeTileFromArea(${pos})">${q.shuffledTokens[poolIdx]}</div>`).join("");
  }
  const usedSet = new Set(window.__tileOrder);
  pool.innerHTML = q.shuffledTokens.map((t,i)=> usedSet.has(i) ? "" : `<div class="tile" data-idx="${i}" onclick="pickTile(${i})">${t}</div>`).join("");
  document.getElementById("submitBtn").disabled = window.__tileOrder.length !== q.shuffledTokens.length;
}
function resetTiles(){
  if(answered) return;
  window.__tileOrder = [];
  renderTileState();
}

function pickMatchJa(idx){
  if(answered) return;
  window.__matchJaSel = idx;
  document.querySelectorAll("#matchJa .match-opt").forEach(el=>{
    el.classList.toggle("selected", Number(el.dataset.idx)===idx && !(idx in window.__matchPairs));
  });
  tryFormPair();
}
function pickMatchEn(idx){
  if(answered) return;
  window.__matchEnSel = idx;
  tryFormPair();
}
function tryFormPair(){
  if(window.__matchJaSel===null || window.__matchEnSel===null) return;
  window.__matchPairs[window.__matchJaSel] = window.__matchEnSel;
  window.__matchJaSel = null;
  window.__matchEnSel = null;
  renderMatchState();
}
function renderMatchState(){
  const q = sessionQuestions[currentIndex];
  const colors = ["pair-a","pair-b","pair-c","pair-d"];
  const jaToColor = {};
  Object.keys(window.__matchPairs).forEach((jaIdx,i)=>{ jaToColor[jaIdx] = colors[i % colors.length]; });
  document.querySelectorAll("#matchJa .match-opt").forEach(el=>{
    const idx = el.dataset.idx;
    el.classList.remove("pair-a","pair-b","pair-c","pair-d","paired","selected");
    if(idx in window.__matchPairs){ el.classList.add("paired", jaToColor[idx]); }
  });
  document.querySelectorAll("#matchEn .match-opt").forEach(el=>{
    const idx = Number(el.dataset.idx);
    el.classList.remove("pair-a","pair-b","pair-c","pair-d","paired","selected");
    const jaKey = Object.keys(window.__matchPairs).find(k=>window.__matchPairs[k]===idx);
    if(jaKey!==undefined){ el.classList.add("paired", jaToColor[jaKey]); }
  });
  const done = Object.keys(window.__matchPairs).length === q.pairs.length;
  document.getElementById("submitBtn").disabled = !done;
}

function trashCurrentQuestion(){
  const q = sessionQuestions[currentIndex];
  if(!confirm("この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）")) return;
  moveToTrash(currentFormat, q.id);
  const link = document.querySelector(".trash-link");
  if(link){ link.outerHTML = '<span class="trash-link">🗑 ゴミ箱に移動しました</span>'; }
}

/* ========================= 採点・フィードバック ========================= */
function submitAnswer(){
  if(answered) return;
  const q = sessionQuestions[currentIndex];
  let isCorrect = false;
  let feedbackHtml = "";

  if(q.type==="fill" || q.type==="correction"){
    const val = document.getElementById("ansInput").value.trim().toLowerCase();
    isCorrect = val === q.answer.trim().toLowerCase();
    feedbackHtml = renderSimpleFeedback(q, isCorrect, q.answer, audioFolderFor("fillchoice"));
    if(q.type==="correction") feedbackHtml = renderSimpleFeedback(q, isCorrect, q.answer, audioFolderFor("order"));
  } else if(q.type==="choice"){
    const picked = window.__pickedChoice;
    const pickedVal = q.shuffledChoices[picked];
    isCorrect = pickedVal === q.answer;
    feedbackHtml = renderSimpleFeedback(q, isCorrect, q.answer, audioFolderFor("fillchoice"));
  } else if(q.type==="reorder"){
    const userTokens = window.__tileOrder.map(i=>q.shuffledTokens[i]);
    isCorrect = JSON.stringify(userTokens) === JSON.stringify(q.tokens);
    feedbackHtml = renderSimpleFeedback(q, isCorrect, q.tokens.join(" "), audioFolderFor("order"));
  } else if(q.type==="free"){
    const val = document.getElementById("ansInput").value.trim().toLowerCase();
    const missing = q.keyPhrases.filter(kp => !val.includes(kp.toLowerCase()));
    isCorrect = missing.length===0;
    feedbackHtml = renderFreeFeedback(q, isCorrect, missing);
  } else if(q.type==="match"){
    feedbackHtml = renderMatchFeedback(q);
    isCorrect = Object.keys(window.__matchPairs).length===q.pairs.length &&
      q.pairs.every((p,i)=> window.__matchPairs[i]===i);
  }

  if(isCorrect) score++;
  answered = true;
  document.getElementById("feedbackArea").innerHTML = feedbackHtml;

  // 入力・選択を無効化
  document.querySelectorAll("#qbody input, #qbody textarea").forEach(el=>el.disabled=true);
  document.querySelectorAll("#qbody button").forEach(el=>el.disabled=true);
  document.querySelectorAll(".choice-item, .tile, .match-opt").forEach(el=>el.style.pointerEvents="none");
}

function sourceThumbsHtml(sourceList){
  if(!sourceList || sourceList.length===0) return "";
  return `<div class="source-thumbs">${sourceList.map(s=>
    `<img class="source-thumb" src="images/${s}.jpg" alt="${s}" loading="lazy" onclick="openImageModal('images/${s}.jpg')" onerror="this.style.display='none'">`
  ).join("")}</div>`;
}

function renderSimpleFeedback(q, isCorrect, correctText, audioFolder){
  const sourceList = q.source ? [q.source] : (q.sources || []);
  return `
    <div class="feedback">
      <div class="result-line ${isCorrect?"ok":"ng"}">${isCorrect ? "✅ 正解！" : "❌ 不正解"}</div>
      <div class="answer-box">正解: <b>${correctText}</b></div>
      <button class="play-btn" onclick="playAudio(this, '${audioFolder}/${q.id}.mp3')">🔊 英文を聞く</button>
      <div class="info-box"><b>📷 出典:</b> ${sourceList.join(", ")}</div>
      ${sourceThumbsHtml(sourceList)}
      <div class="info-box"><b>💡 関連知識:</b> ${q.relatedInfo}</div>
      <div class="info-box"><b>📝 解説:</b> ${q.explanation}</div>
      <a class="trash-link-feedback" onclick="trashFromFeedback()">🗑 この問題は表記ミスなどがあり変です</a>
      <div style="margin-top:14px;"><button class="btn-primary" onclick="nextQuestion()">${currentIndex===sessionQuestions.length-1 ? "結果を見る" : "次の問題 →"}</button></div>
    </div>
  `;
}

function renderFreeFeedback(q, isCorrect, missing){
  const sourceList = q.source ? [q.source] : (q.sources || []);
  return `
    <div class="feedback">
      <div class="result-line ${isCorrect?"ok":"ng"}">${isCorrect ? "✅ 正解！（必須語句をすべて含んでいます）" : "❌ 不正解（不足している語句: " + missing.join(", ") + "）"}</div>
      <div class="answer-box">模範解答: <b>${q.answer}</b></div>
      <button class="play-btn" onclick="playAudio(this, '${audioFolderFor("write")}/${q.id}.mp3')">🔊 英文を聞く</button>
      <div class="info-box"><b>📷 出典:</b> ${sourceList.join(", ")}</div>
      ${sourceThumbsHtml(sourceList)}
      <div class="info-box"><b>💡 関連知識:</b> ${q.relatedInfo}</div>
      <div class="info-box"><b>📝 解説:</b> ${q.explanation}</div>
      <div class="disabled-note">※自由記述の採点は必須語句を含むかの簡易判定です。文法の正しさは模範解答と見比べて自己採点してください。</div>
      <a class="trash-link-feedback" onclick="trashFromFeedback()">🗑 この問題は表記ミスなどがあり変です</a>
      <div style="margin-top:14px;"><button class="btn-primary" onclick="nextQuestion()">${currentIndex===sessionQuestions.length-1 ? "結果を見る" : "次の問題 →"}</button></div>
    </div>
  `;
}

function renderMatchFeedback(q){
  const sourceList = q.sources || [];
  let correctCount = 0;
  const rows = q.pairs.map((p,i)=>{
    const userEnIdx = window.__matchPairs[i];
    const ok = userEnIdx === i;
    if(ok) correctCount++;
    return `<div class="match-pair-row ${ok?"":"wrong"}">
      <span>${ok?"✅":"❌"} ${p.japanese} → ${p.english}</span>
      <button class="play-btn btn-small" onclick="playAudio(this, '${audioFolderFor("write")}/${q.id}_p${i}.mp3')">🔊</button>
    </div>`;
  }).join("");
  const allOk = correctCount === q.pairs.length;
  return `
    <div class="feedback">
      <div class="result-line ${allOk?"ok":"ng"}">${allOk ? "✅ 全問正解！" : "⚠️ " + correctCount + " / " + q.pairs.length + " 正解（部分正解）"}</div>
      ${rows}
      <div class="info-box"><b>📷 出典:</b> ${sourceList.join(", ")}</div>
      ${sourceThumbsHtml(sourceList)}
      <div class="info-box"><b>💡 関連知識:</b> ${q.relatedInfo}</div>
      <div class="info-box"><b>📝 解説:</b> ${q.explanation}</div>
      <a class="trash-link-feedback" onclick="trashFromFeedback()">🗑 この問題は表記ミスなどがあり変です</a>
      <div style="margin-top:14px;"><button class="btn-primary" onclick="nextQuestion()">${currentIndex===sessionQuestions.length-1 ? "結果を見る" : "次の問題 →"}</button></div>
    </div>
  `;
}

function trashFromFeedback(){
  const q = sessionQuestions[currentIndex];
  if(!confirm("この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）")) return;
  moveToTrash(currentFormat, q.id);
  const link = document.querySelector(".trash-link-feedback");
  if(link){ link.outerHTML = '<span class="trash-link-feedback" style="text-decoration:none;">🗑 ゴミ箱に移動しました</span>'; }
}

function nextQuestion(){
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  if(currentBtn){ currentBtn=null; }
  if(currentIndex < sessionQuestions.length - 1){
    currentIndex++;
    renderQuestionScreen();
  } else {
    if(currentMode==="random") saveSeenQuestions(currentFormat, sessionQuestions);
    renderResults();
  }
}

/* ========================= 結果画面 ========================= */
function renderResults(){
  const total = sessionQuestions.length;
  const rate = total>0 ? Math.round((score/total)*100) : 0;
  let stars = "—"; let msg = "ノートを見直して再チャレンジ！";
  if(rate>=90){ stars="★★★"; msg="Excellent! TOEFL満点レベルの実力です"; }
  else if(rate>=70){ stars="★★"; msg="Good! あと少しで完璧です"; }
  else if(rate>=50){ stars="★"; msg="Keep going! 復習して再挑戦しましょう"; }
  const meta = FORMAT_META[currentFormat];

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card center">
      <h1>結果発表</h1>
      <div class="sub">${meta.emoji} ${meta.title}</div>
      <div class="stars">${stars}</div>
      <div style="font-size:1.3rem; font-weight:700; margin-bottom:6px;">${score} / ${total} 問正解（正解率 ${rate}%）</div>
      <div class="muted" style="margin-bottom:20px;">${msg}</div>
      <button class="btn-primary" onclick="startTest(currentFormat,currentMode,currentCategory,currentSelectedIds)">もう一度同じ形式・モードで挑戦する</button>
      <div style="height:10px;"></div>
      <button class="btn-secondary" style="width:100%;" onclick="renderFormatSelect()">別の形式に挑戦する</button>
      <div style="height:10px;"></div>
      <button class="btn-secondary" style="width:100%;" onclick="renderFormatSelect()">🏠 最初から</button>
    </div>
  `;
}

/* ========================= ゴミ箱画面 ========================= */
function renderTrashScreen(format){
  const trashIds = new Set(getTrash(format));
  const all = questionsFor(format);
  const trashedQs = all.filter(q=>trashIds.has(q.id));
  const app = document.getElementById("app");
  const meta = FORMAT_META[format];

  let listHtml = "";
  if(trashedQs.length===0){
    listHtml = '<div class="card center muted">ゴミ箱は空です</div>';
  } else {
    listHtml = trashedQs.map(q=>{
      let repText = q.question || q.hint || (q.pairs ? q.pairs[0].japanese : "");
      const src = q.source || (q.sources ? q.sources[0] : "");
      return `
        <div class="trash-row">
          <div><span class="badge badge-type">${typeBadgeLabel(q.type)}</span><span class="badge badge-cat">${q.category}</span></div>
          <div style="margin:8px 0;">${repText}</div>
          <div class="muted">📷 出典: ${src}</div>
          <button class="btn-secondary btn-small" style="margin-top:8px;" onclick="restoreFromTrashUI('${format}', ${q.id})">↩️ 元に戻す</button>
        </div>
      `;
    }).join("");
  }

  app.innerHTML = `
    <a class="linklike" onclick="renderModeSelect('${format}')">← モード選択に戻る</a>
    <h1>🗑 ゴミ箱（${meta.title}）</h1>
    <div id="trashList">${listHtml}</div>
  `;
}
function restoreFromTrashUI(format,id){
  restoreFromTrash(format,id);
  renderTrashScreen(format);
}

/* ========================= 初期化 ========================= */
renderFormatSelect();
</script>
