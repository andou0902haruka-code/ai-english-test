<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next_stageノート 総合テスト</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273549; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#38bdf8; --accent2:#818cf8; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --border:#334155;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(160deg,#0f172a,#111827);color:var(--text);min-height:100vh;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:1.4rem;margin:0 0 6px;}
h2{font-size:1.15rem;margin:0 0 10px;}
p.sub{color:var(--muted);margin:0 0 20px;font-size:0.92rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.25);}
.format-card{cursor:pointer;transition:transform .15s, border-color .15s;}
.format-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.format-emoji{font-size:2rem;}
.format-title{font-size:1.15rem;font-weight:700;margin:6px 0 4px;}
.format-desc{color:var(--muted);font-size:0.88rem;margin-bottom:10px;line-height:1.5;}
.count-badge{display:inline-block;background:var(--card2);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:0.8rem;margin-bottom:10px;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:12px 18px;font-size:0.95rem;font-weight:600;transition:opacity .15s, transform .1s;}
button:active{transform:scale(0.98);}
button:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;width:100%;}
.btn-secondary{background:var(--card2);color:var(--text);width:100%;}
.btn-small{padding:6px 12px;font-size:0.82rem;background:var(--card2);color:var(--text);}
.link{color:var(--accent);text-decoration:none;cursor:pointer;font-size:0.88rem;}
.link:hover{text-decoration:underline;}
.mode-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card2);}
.mode-card h3{margin:0 0 6px;font-size:1rem;}
.mode-card p{color:var(--muted);font-size:0.85rem;margin:0 0 10px;}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.cat-btn{background:#1c2536;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:0.82rem;font-weight:500;}
.cat-btn.selected{background:var(--accent);color:#0b1220;border-color:var(--accent);}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:0.78rem;font-weight:700;background:var(--card2);color:var(--accent);}
.progress-track{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.type-badge{background:#312e81;color:#c7d2fe;padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;margin-right:6px;}
.cat-badge{background:#164e3f;color:#6ee7b7;padding:3px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.hint{color:#fde68a;background:#3a2f10;border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.92rem;line-height:1.5;}
.qtext{font-size:1.1rem;line-height:1.7;margin-bottom:16px;}
.qtext .blank{border-bottom:2px solid var(--accent);padding:0 8px;color:var(--accent);font-weight:700;}
.qtext mark{background:#5b1a1a;color:#fca5a5;text-decoration:underline;border-radius:4px;padding:0 3px;}
input[type=text], textarea{width:100%;background:#0f1622;border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:1rem;margin-bottom:14px;font-family:inherit;}
textarea{min-height:90px;resize:vertical;}
.choice-list label{display:block;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:0.95rem;}
.choice-list input{margin-right:10px;}
.choice-list label:hover{border-color:var(--accent);}
.tile-area{min-height:56px;border:1.5px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tile-area .placeholder{color:var(--muted);font-size:0.85rem;}
.tile{background:var(--accent);color:#0b1220;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.92rem;}
.tile.used{opacity:0.35;background:var(--card2);color:var(--muted);}
.tile-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.match-cols{display:flex;gap:14px;margin-bottom:14px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.match-btn{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:0.85rem;text-align:left;color:var(--text);}
.match-btn.selected{border-color:var(--accent);background:#0f2733;}
.match-btn.paired{border-color:var(--good);background:#0f2b1c;}
.match-btn.paired-1{border-color:#38bdf8;} .match-btn.paired-2{border-color:#f472b6;} .match-btn.paired-3{border-color:#fbbf24;} .match-btn.paired-4{border-color:#a78bfa;}
.actions{display:flex;gap:10px;margin-bottom:6px;}
.feedback{border-radius:12px;padding:16px;margin:14px 0;}
.feedback.correct{background:#0f2b1c;border:1px solid #16a34a;}
.feedback.wrong{background:#3a1414;border:1px solid #dc2626;}
.feedback .result-line{font-weight:700;font-size:1.05rem;margin-bottom:6px;}
.feedback .answer-line{font-size:0.95rem;margin-bottom:10px;color:var(--text);}
.play-btn{background:#1c2536;color:var(--accent);border:1px solid var(--border);padding:8px 14px;border-radius:999px;font-size:0.85rem;}
.play-btn.playing{background:var(--accent);color:#0b1220;}
.info-block{font-size:0.85rem;color:var(--muted);margin-top:10px;line-height:1.6;border-top:1px solid var(--border);padding-top:10px;}
.info-block b{color:var(--text);}
.bookmark-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.bookmark-row label{font-size:0.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;}
.trash-link{font-size:0.78rem;color:var(--muted);}
.trash-link:hover{color:var(--bad);}
.match-pair-list{font-size:0.85rem;margin-bottom:6px;padding:8px;border-radius:8px;background:var(--card2);}
.match-pair-list.bad{background:#3a1414;}
.result-score{font-size:2.4rem;font-weight:800;text-align:center;margin:10px 0;}
.result-stars{text-align:center;font-size:1.6rem;margin-bottom:10px;}
.result-msg{text-align:center;color:var(--muted);margin-bottom:20px;}
.trash-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card2);}
.hidden{display:none !important;}
.foot-links{display:flex;justify-content:center;margin-top:14px;}
.source-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.source-thumb{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;background:#0b1220;}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
.img-modal img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.img-modal.hidden{display:none;}
.img-modal-close{position:fixed;top:16px;right:20px;color:#fff;font-size:1.6rem;cursor:pointer;z-index:1001;}
@media (max-width:480px){ .match-cols{gap:8px;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="img-modal hidden" id="imgModal" onclick="closeImageModal()">
  <span class="img-modal-close" onclick="closeImageModal()">&times;</span>
  <img id="imgModalImg" src="" alt="出典画像">
</div>

<script>
const FILLCHOICE_QUESTIONS = [{"id": 1, "type": "fill", "question": "It has been _____ since my mother died.", "hint": "母が死んでから10年になる", "fullSentence": "It has been ten years since my mother died.", "answer": "ten years", "source": "IMG_0698", "explanation": "『It is[has been]+期間+since S 過去形』で「〜してから…になる」。My mother has been dead for ten years.とも言い換え可能。", "relatedInfo": "= My mother has been dead for ten years. = Ten years have passed since my mother died.", "category": "時制・完了形"}, {"id": 2, "type": "fill", "question": "She seems to _____ ill.", "hint": "彼女は病気だったらしい(現在から見た過去の推量)", "fullSentence": "She seems to have been ill.", "answer": "have been", "source": "IMG_0698", "explanation": "述語動詞より前の時を表すときはto不定詞を完了形(to have pp)にする。", "relatedInfo": "She seemed to be ill.(同時)/ She seemed to have been ill.(過去のさらに過去)", "category": "時制・完了形"}, {"id": 3, "type": "choice", "question": "By next year, I _____ a thousand English words.", "hint": "来年までに英単語を千語覚えたことになるだろう", "fullSentence": "By next year, I will have learned a thousand English words.", "answer": "will have learned", "choices": ["will learn", "will have learned", "have learned", "learned"], "source": "IMG_0698", "explanation": "未来のある時点までの完了・経験は未来完了形(will have pp)で表す。", "relatedInfo": "by the time, by next month などと相性が良い。", "category": "時制・完了形"}, {"id": 4, "type": "fill", "question": "I will not have _____ before it is too late.", "hint": "手遅れになる前に彼はそこに着いているだろう(未来完了)", "fullSentence": "He will have arrived there before it is too late.", "answer": "arrived there", "source": "IMG_0698", "explanation": "未来のある時点で完了している動作は未来完了で表す。", "relatedInfo": "will have pp = 未来完了", "category": "時制・完了形"}, {"id": 5, "type": "choice", "question": "What a beautiful house! Who _____ it?", "hint": "何て美しい家だ!誰が持ち主なんだろう(受身の完了)", "fullSentence": "What a beautiful house! Who was it named for?", "answer": "was it named for", "choices": ["was it named for", "named it for", "is naming it for", "names it for"], "source": "IMG_0698", "explanation": "受動態の完了・過去形。SVOCの受身でCがそのまま残る形。", "relatedInfo": "The baby was named Tom by his parents. のような受動態パターン。", "category": "時制・完了形"}, {"id": 6, "type": "fill", "question": "It is said _____ a thousand years old.", "hint": "その寺は千年の歴史があると言われている", "fullSentence": "It is said that the temple is a thousand years old.", "answer": "that the temple is", "source": "IMG_0698", "explanation": "It is said that S V「SはVだと言われている」= S is said to V。", "relatedInfo": "= The temple is said to be a thousand years old.", "category": "時制・完了形"}, {"id": 7, "type": "choice", "question": "He is said _____ a great scholar in his day.", "hint": "彼は若い頃偉大な学者だったと言われている", "fullSentence": "He is said to have been a great scholar in his day.", "answer": "to have been", "choices": ["to have been", "to be", "to having been", "being"], "source": "IMG_0698", "explanation": "is said to have pp で「〜だったと言われている」。主節より前の時制を表す。", "relatedInfo": "= It is said that he was a great scholar in his day.", "category": "時制・完了形"}, {"id": 8, "type": "fill", "question": "He lay in the sofa with his arms _____ .", "hint": "彼は腕を組んでソファに横たわっていた", "fullSentence": "He lay in the sofa with his arms folded.", "answer": "folded", "source": "IMG_0708", "explanation": "『with+O+分詞』の付帯状況構文。腕は「組まれる」ものなので過去分詞。", "relatedInfo": "with his legs crossed(脚を組んで)/ with his eyes closed(目を閉じて)", "category": "分詞構文"}, {"id": 9, "type": "choice", "question": "He was standing with his back _____ the wall.", "hint": "彼は壁に背をもたれさせて立っていた", "fullSentence": "He was standing with his back against the wall.", "answer": "against", "choices": ["against", "folded", "crossed", "closed"], "source": "IMG_0708", "explanation": "with+名詞+前置詞句 の付帯状況もある。", "relatedInfo": "with a book under his arm(本を脇に抱えて)", "category": "分詞構文"}, {"id": 10, "type": "fill", "question": "_____ , I cannot answer such a difficult question.", "hint": "いくら賢くても、そんな難しい質問には答えられない", "fullSentence": "Clever as I am, I cannot answer such a difficult question.", "answer": "Clever as I am", "source": "IMG_0708", "explanation": "『形容詞+as+S+V』で譲歩「〜だけれども」。", "relatedInfo": "= Though I am clever, ...", "category": "分詞構文"}, {"id": 11, "type": "choice", "question": "_____ , Tom is not a bad person.", "hint": "それはさておき、トムは悪い人ではない", "fullSentence": "Having said that, Tom is not a bad person.", "answer": "Having said that", "choices": ["Having said that", "Saying that", "To say that", "Said that"], "source": "IMG_0708", "explanation": "分詞構文の慣用表現。Having pp は主節より前の時を表す。", "relatedInfo": "Having finished his homework, he went out to play.", "category": "分詞構文"}, {"id": 12, "type": "fill", "question": "I couldn't _____ but laugh at the joke.", "hint": "その冗談に笑わずにはいられなかった", "fullSentence": "I couldn't help laughing at the joke.", "answer": "help", "source": "IMG_0705", "explanation": "cannot help doing「〜せずにはいられない」。", "relatedInfo": "= cannot help but do = cannot but do", "category": "使役・知覚動詞・SVOC"}, {"id": 13, "type": "fill", "question": "She had her bag _____ on the train.", "hint": "彼女は電車の中でバッグを盗まれた", "fullSentence": "She had her bag stolen on the train.", "answer": "stolen", "source": "IMG_0705", "explanation": "have+O+過去分詞「〜される(被害)」。", "relatedInfo": "have O done は被害・使役(依頼)・完了の3用法。", "category": "使役・知覚動詞・SVOC"}, {"id": 14, "type": "choice", "question": "I heard my name _____ while I was sleeping.", "hint": "眠っている間に自分の名前が呼ばれるのが聞こえた", "fullSentence": "I heard my name called while I was sleeping.", "answer": "called", "choices": ["called", "calling", "call", "to call"], "source": "IMG_0705", "explanation": "知覚動詞+O+過去分詞「〜されるのを知覚する」(受動関係)。", "relatedInfo": "I heard him singing.(能動・進行) / I heard him sing.(能動・原形)", "category": "使役・知覚動詞・SVOC"}, {"id": 15, "type": "fill", "question": "She had her hair _____ by a famous hairdresser.", "hint": "彼女は有名な美容師に髪を切ってもらった", "fullSentence": "She had her hair cut by a famous hairdresser.", "answer": "cut", "source": "IMG_0705", "explanation": "have+O+pp「(人に)〜してもらう」(使役)。", "relatedInfo": "make oneself understood「自分の意思を理解させる」も同系統表現。", "category": "使役・知覚動詞・SVOC"}, {"id": 16, "type": "choice", "question": "I could not make myself _____ in English.", "hint": "英語で自分の言うことを理解してもらえなかった", "fullSentence": "I could not make myself understood in English.", "answer": "understood", "choices": ["understood", "understand", "understanding", "to understand"], "source": "IMG_0705", "explanation": "make oneself understood「自分の考えを人に理解させる」。", "relatedInfo": "make oneself heard「自分の声を届かせる」", "category": "使役・知覚動詞・SVOC"}, {"id": 17, "type": "fill", "question": "There _____ a knock at the door.", "hint": "ドアをノックする音がした", "fullSentence": "There was a knock at the door.", "answer": "was", "source": "IMG_0706", "explanation": "There be構文。knock,glass,soundなど自動詞的名詞と共に使われる。", "relatedInfo": "There was a loud noise.(大きな音がした)", "category": "使役・知覚動詞・SVOC"}, {"id": 18, "type": "choice", "question": "The wall is _____ in red.", "hint": "壁は赤く塗られている", "fullSentence": "The wall is painted in red.", "answer": "painted", "choices": ["painted", "painting", "paint", "to paint"], "source": "IMG_0706", "explanation": "SVCの受動態。paint,cover,coverなど状態を表す動詞。", "relatedInfo": "The door is closed.(ドアは閉まっている=状態)", "category": "使役・知覚動詞・SVOC"}, {"id": 19, "type": "fill", "question": "Keep the door _____ .", "hint": "ドアを閉めておいて", "fullSentence": "Keep the door closed.", "answer": "closed", "source": "IMG_0706", "explanation": "keep+O+C(過去分詞)「Oを〜のままにしておく」。", "relatedInfo": "leave O C「Oを〜のままにしておく(放置)」", "category": "使役・知覚動詞・SVOC"}, {"id": 20, "type": "choice", "question": "He came running to us, _____ pictures.", "hint": "彼は写真を撮りながら私たちの方に走ってきた", "fullSentence": "He came running to us, taking pictures.", "answer": "taking", "choices": ["taking", "took", "to take", "taken"], "source": "IMG_0722", "explanation": "分詞構文で「〜しながら」の付帯状況を表す。", "relatedInfo": "He walked through the town waving his arms.", "category": "前置詞"}, {"id": 21, "type": "fill", "question": "He _____ (=cannot) do difficult work without trouble.", "hint": "彼は難しい仕事を苦もなくやってのける", "fullSentence": "He has no difficulty in doing difficult work.", "answer": "has no difficulty in doing", "source": "IMG_0707", "explanation": "have trouble[difficulty] in doing「〜するのに苦労する」の否定形。", "relatedInfo": "have trouble doing でも可(inは省略可能)。", "category": "比較(倍数・not so much A as B)"}, {"id": 22, "type": "choice", "question": "She is _____ nursing.", "hint": "彼女は看護師であるのを誇りに思っている", "fullSentence": "She is proud of being a nurse.", "answer": "proud of being", "choices": ["proud of being", "proud to being", "proud for being", "proud on being"], "source": "IMG_0707", "explanation": "be proud of doing「〜であることを誇りに思う」。", "relatedInfo": "She was proud of having been a nurse.(過去のことなら完了動名詞)", "category": "比較(倍数・not so much A as B)"}, {"id": 23, "type": "fill", "question": "There is no _____ in doing that.", "hint": "そんなことをしても無駄だ", "fullSentence": "There is no use in doing that.", "answer": "use", "source": "IMG_0709", "explanation": "There is no use (in) doing「〜しても無駄だ」。", "relatedInfo": "= It is no use doing = It is no good doing", "category": "熟語・慣用表現"}, {"id": 24, "type": "choice", "question": "_____ money, he could not buy the car.", "hint": "お金がなかったので、その車を買えなかった", "fullSentence": "There being no money, he could not buy the car.", "answer": "There being no", "choices": ["There being no", "There is no", "There was no", "There has no"], "source": "IMG_0707", "explanation": "There is/are構文の分詞構文。thereを主語として扱う。", "relatedInfo": "独立分詞構文の一種。", "category": "比較(倍数・not so much A as B)"}, {"id": 25, "type": "fill", "question": "He is _____ to A/doing his job.", "hint": "彼は自分の仕事にすっかり慣れている", "fullSentence": "He is accustomed to doing his job.", "answer": "accustomed", "source": "IMG_0705", "explanation": "be accustomed to doing「〜に慣れている」。toは前置詞なので動名詞が続く。", "relatedInfo": "= be used to doing", "category": "使役・知覚動詞・SVOC"}, {"id": 26, "type": "choice", "question": "I am looking forward _____ you again.", "hint": "また会えるのを楽しみにしている", "fullSentence": "I am looking forward to seeing you again.", "answer": "to seeing", "choices": ["to seeing", "to see", "for seeing", "seeing"], "source": "IMG_0705", "explanation": "look forward to doing「〜するのを楽しみにする」。toは前置詞。", "relatedInfo": "object to doing「〜に反対する」も同型。", "category": "使役・知覚動詞・SVOC"}, {"id": 27, "type": "fill", "question": "What do you say _____ a walk?", "hint": "散歩でもしませんか", "fullSentence": "What do you say to taking a walk?", "answer": "to taking", "source": "IMG_0705", "explanation": "What do you say to doing?「〜するのはどうですか」。", "relatedInfo": "= How about doing? = What about doing?", "category": "使役・知覚動詞・SVOC"}, {"id": 28, "type": "choice", "question": "She is busy _____ dinner.", "hint": "彼女は夕食を作るのに忙しい", "fullSentence": "She is busy cooking dinner.", "answer": "cooking", "choices": ["cooking", "to cook", "cook", "cooked"], "source": "IMG_0707", "explanation": "be busy doing「〜するのに忙しい」。", "relatedInfo": "notがつくことはない点に注意。", "category": "比較(倍数・not so much A as B)"}, {"id": 29, "type": "fill", "question": "It goes without _____ that health is important.", "hint": "健康が大切なのは言うまでもない", "fullSentence": "It goes without saying that health is important.", "answer": "saying", "source": "IMG_0709", "explanation": "It goes without saying that S V「〜は言うまでもない」。", "relatedInfo": "= needless to say", "category": "熟語・慣用表現"}, {"id": 30, "type": "choice", "question": "There is no _____ without saying that.", "hint": "それを言わずには済まされない", "fullSentence": "There is no doing without saying that.", "answer": "doing", "choices": ["doing", "done", "do", "to do"], "source": "IMG_0709", "explanation": "There is no doing「〜できない」構文。", "relatedInfo": "There is no telling what will happen.(何が起こるか分からない)", "category": "熟語・慣用表現"}, {"id": 31, "type": "fill", "question": "I could not _____ but agree with him.", "hint": "彼に賛成せざるを得なかった", "fullSentence": "I could not choose but agree with him.", "answer": "choose", "source": "IMG_0709", "explanation": "cannot choose but do「〜せざるを得ない」。", "relatedInfo": "= cannot help doing = cannot but do", "category": "熟語・慣用表現"}, {"id": 32, "type": "choice", "question": "All he _____ is complain.", "hint": "彼がすることといえば文句を言うことだけだ", "fullSentence": "All he does is complain.", "answer": "does is complain", "choices": ["does is complain", "does is to complaining", "do is complain", "does complain"], "source": "IMG_0718", "explanation": "All S does is (to) do 原形不定詞「Sがすることは〜だけだ」。", "relatedInfo": "All you have to do is (to) study hard.", "category": "疑問詞・what節"}, {"id": 33, "type": "fill", "question": "There is something _____ with A.", "hint": "Aはどこかおかしい", "fullSentence": "There is something wrong with A.", "answer": "wrong", "source": "IMG_0716", "explanation": "There is something wrong with A「Aはどこか調子が悪い」。", "relatedInfo": "What is the matter with A? も同義の表現。", "category": "再帰代名詞"}, {"id": 34, "type": "choice", "question": "He is a musician, so to _____ .", "hint": "彼はいわばミュージシャンだ", "fullSentence": "He is a musician, so to speak.", "answer": "speak", "choices": ["speak", "say", "tell", "talk"], "source": "IMG_0716", "explanation": "so to speak「いわば」は慣用句。", "relatedInfo": "He is a something of a musician.(ちょっとしたミュージシャンだ)", "category": "再帰代名詞"}, {"id": 35, "type": "fill", "question": "I did the work _____ myself, without any help.", "hint": "私は誰の助けも借りずに独力でその仕事をした", "fullSentence": "I did the work by myself, without any help.", "answer": "by", "source": "IMG_0716", "explanation": "by oneself「独力で、ひとりで」。", "relatedInfo": "for oneself「自分のために/自分で」、in itself「それ自体」", "category": "再帰代名詞"}, {"id": 36, "type": "choice", "question": "He was beside _____ with rage.", "hint": "彼は怒りで我を忘れていた", "fullSentence": "He was beside himself with rage.", "answer": "himself", "choices": ["himself", "him", "his own", "itself"], "source": "IMG_0716", "explanation": "be beside oneself with 感情「〜で我を忘れる」。", "relatedInfo": "He kept his patience.「彼は忍耐を保った」も対照的表現。", "category": "再帰代名詞"}, {"id": 37, "type": "fill", "question": "He _____ (=Jack sent) it to the town.", "hint": "それはジャックによってその町に送られた(=強調構文的言い換え)", "fullSentence": "It was Jack that sent it to the town.", "answer": "was Jack that sent", "source": "IMG_0728", "explanation": "It is A that ~の強調構文。Aを強調する。", "relatedInfo": "who/whichも用いられる(人ならwhoも可)。", "category": "否定表現①"}, {"id": 38, "type": "choice", "question": "It was not _____ Monday that I phoned the office.", "hint": "私が事務所に電話したのは月曜になってからだった", "fullSentence": "It was not until Monday that I phoned the office.", "answer": "until", "choices": ["until", "before", "after", "since"], "source": "IMG_0728", "explanation": "It is not until A that S V「Aになって初めて〜する」。", "relatedInfo": "= I did not phone the office until Monday.", "category": "否定表現①"}, {"id": 39, "type": "fill", "question": "It is only when we are ill _____ we feel how important health is.", "hint": "病気になって初めて健康の大切さを感じる", "fullSentence": "It is only when we are ill that we feel how important health is.", "answer": "that", "source": "IMG_0728", "explanation": "It is only when〜that…「〜して初めて…」強調構文。", "relatedInfo": "It is not until〜that…とほぼ同義。", "category": "否定表現①"}, {"id": 40, "type": "choice", "question": "_____ on earth did you take me for?", "hint": "一体全体私を何だと思っていたんだ", "fullSentence": "What on earth did you take me for?", "answer": "What", "choices": ["What", "How", "Why", "Who"], "source": "IMG_0728", "explanation": "疑問詞+on earth[in the world]で強い驚き・非難を表す。", "relatedInfo": "= What ever did you take me for?", "category": "否定表現①"}, {"id": 41, "type": "fill", "question": "I _____ pass the exam.", "hint": "私はその試験に合格できた(実際に合格した)", "fullSentence": "I was able to pass the exam.", "answer": "was able to", "source": "IMG_0699", "explanation": "could は「実際に〜できた」という単発の成功にはwas able toを使う。canの過去形couldは能力全般。", "relatedInfo": "could not = was unable to(否定は両方可)。", "category": "助動詞"}, {"id": 42, "type": "choice", "question": "I _____ see Mt. Fuji when we were on the train.", "hint": "電車に乗っていたとき富士山が見えた", "fullSentence": "I could see Mt. Fuji when we were on the train.", "answer": "could", "choices": ["could", "was able to", "can", "managed to"], "source": "IMG_0699", "explanation": "知覚動詞(see, hear)は継続的な能力なのでcouldを使うのが自然。", "relatedInfo": "could see/hear = 見える/聞こえる(状態)", "category": "助動詞"}, {"id": 43, "type": "fill", "question": "You _____ have passed the exam; you didn't study at all.", "hint": "君が試験に合格したはずがない(全然勉強しなかったのだから)", "fullSentence": "You cannot have passed the exam; you didn't study at all.", "answer": "cannot", "source": "IMG_0699", "explanation": "cannot have pp「〜したはずがない」過去の事柄に対する強い否定的推量。", "relatedInfo": "must have pp「〜したに違いない」/ may have pp「〜したかもしれない」", "category": "助動詞"}, {"id": 44, "type": "choice", "question": "He _____ have won the race; he was practicing so hard.", "hint": "彼はそのレースに勝ったに違いない(あんなに練習していたのだから)", "fullSentence": "He must have won the race; he was practicing so hard.", "answer": "must", "choices": ["must", "may", "can", "should"], "source": "IMG_0699", "explanation": "must have pp「〜したに違いない」。過去の事柄への強い確信。", "relatedInfo": "He should have won.は「勝つべきだったのに(勝たなかった)」の意になり別の意味。", "category": "助動詞"}, {"id": 45, "type": "fill", "question": "You _____ have locked the door before you left.", "hint": "出かける前にドアに鍵をかけておくべきだったのに", "fullSentence": "You should have locked the door before you left.", "answer": "should", "source": "IMG_0699", "explanation": "should have pp「〜すべきだったのに(実際はしなかった)」非難・後悔を表す。", "relatedInfo": "ought to have pp も同義。", "category": "助動詞"}, {"id": 46, "type": "choice", "question": "He _____ have failed the exam; he studied very hard.", "hint": "彼が試験に落ちたはずがない(あんなに一生懸命勉強したのだから)", "fullSentence": "He cannot have failed the exam; he studied very hard.", "answer": "cannot", "choices": ["cannot", "should not", "may not", "need not"], "source": "IMG_0699", "explanation": "cannot have pp「〜したはずがない」。", "relatedInfo": "He need not have studied so hard.「そんなに勉強する必要はなかったのに(実際はした)」", "category": "助動詞"}, {"id": 47, "type": "fill", "question": "You _____ have worried so much; everything turned out fine.", "hint": "そんなに心配する必要はなかったのに(実際は心配した)", "fullSentence": "You need not have worried so much; everything turned out fine.", "answer": "need not", "source": "IMG_0699", "explanation": "need not have pp「〜する必要はなかったのに(実際はした)」。didn't need toとの違いに注意。", "relatedInfo": "didn't need to do「する必要がなかった(しなかった)」", "category": "助動詞"}, {"id": 48, "type": "choice", "question": "He is smart enough to solve the puzzle, but he _____ enough not to.", "hint": "彼はパズルを解けるほど賢いが、あえてそうしないだけの分別も持っている", "fullSentence": "He is smart enough to solve the puzzle, but he is careful enough not to.", "answer": "is careful", "choices": ["is careful", "is not careful", "was careless", "careful"], "source": "IMG_0699", "explanation": "形容詞+enough to do「〜できるほど…」の否定形。not toで「あえて〜しない」。", "relatedInfo": "He was not smart enough to solve the puzzle.(逆に賢くなくて解けなかった)", "category": "助動詞"}, {"id": 49, "type": "fill", "question": "You _____ do that again!", "hint": "二度とそんなことをするな(強い禁止)", "fullSentence": "You must not do that again!", "answer": "must not", "source": "IMG_0701", "explanation": "must not「〜してはいけない」強い禁止。don't have toとの違いに注意。", "relatedInfo": "don't have to do「〜する必要はない」(禁止ではない)", "category": "助動詞"}, {"id": 50, "type": "choice", "question": "He is not so smart _____ to solve the puzzle.", "hint": "彼はそのパズルを解けるほど賢くはなかった", "fullSentence": "He was not smart enough to solve the puzzle.", "answer": "as", "choices": ["as", "that", "for", "so"], "source": "IMG_0699", "explanation": "not so 形容詞 as to do の代わりにnot 形容詞 enough to doもよく使う。実際はenoughの形で出題。", "relatedInfo": "= not smart enough to do", "category": "助動詞"}, {"id": 51, "type": "fill", "question": "He _____ (=want to) know the truth.", "hint": "彼はどうしても真実を知りたがっている", "fullSentence": "He will know the truth.", "answer": "will", "source": "IMG_0699", "explanation": "willには「(強い)意志・固執」の意味もある。", "relatedInfo": "He will have his own way.「彼はどうしても自分のやり方を通したがる」", "category": "助動詞"}, {"id": 52, "type": "choice", "question": "_____ you help me with this?", "hint": "これを手伝ってもらえますか(丁寧な依頼)", "fullSentence": "Could you help me with this?", "answer": "Could", "choices": ["Could", "Must", "Shall", "Need"], "source": "IMG_0699", "explanation": "Could you〜?は丁寧な依頼表現。Can you〜?よりも丁寧。", "relatedInfo": "Would you〜? も同様の丁寧表現。", "category": "助動詞"}, {"id": 53, "type": "fill", "question": "He cannot help doing but do it; he is _____ to complain.", "hint": "彼は不平を言わずにはいられない性分だ", "fullSentence": "He cannot help but complain.", "answer": "cannot help but", "source": "IMG_0709", "explanation": "cannot help but do「〜せずにはいられない」。", "relatedInfo": "= cannot help doing", "category": "熟語・慣用表現"}, {"id": 54, "type": "choice", "question": "I _____ rather stay home than go out tonight.", "hint": "今夜は出かけるよりむしろ家にいたい", "fullSentence": "I would rather stay home than go out tonight.", "answer": "would", "choices": ["would", "should", "must", "will"], "source": "IMG_0699", "explanation": "would rather do than do「むしろ〜したい」。", "relatedInfo": "I would rather you stayed home.(would rather+S+過去形で「〜してほしい」)", "category": "助動詞"}, {"id": 55, "type": "fill", "question": "How _____ you say such a thing to her?", "hint": "よくもまああんなことを彼女に言えたものだ", "fullSentence": "How dare you say such a thing to her?", "answer": "dare", "source": "IMG_0699", "explanation": "How dare you〜?「よくも〜できるな」非難の慣用表現。", "relatedInfo": "dare not do「あえて〜しない」", "category": "助動詞"}, {"id": 56, "type": "choice", "question": "He _____ to get up early when he was a child.", "hint": "彼は子供の頃早起きしたものだった(今はしない)", "fullSentence": "He used to get up early when he was a child.", "answer": "used", "choices": ["used", "would", "is used", "gets used"], "source": "IMG_0699", "explanation": "used to do「以前は〜したものだった(今は違う)」過去の習慣・状態。", "relatedInfo": "would often do も過去の習慣を表すが、状態動詞には使えない。", "category": "助動詞"}, {"id": 57, "type": "fill", "question": "He _____ to get used to city life.", "hint": "彼は都会の生活に慣れるだろう", "fullSentence": "He will get used to city life.", "answer": "will get used", "source": "IMG_0699", "explanation": "get used to doing「〜に慣れる」(変化)。be used to doingは「慣れている」状態。", "relatedInfo": "be used to do「〜するために使われる」との混同に注意。", "category": "助動詞"}, {"id": 58, "type": "choice", "question": "I _____ like to join us for dinner tonight?", "hint": "今夜私たちの夕食に加わりたいですか(丁寧)", "fullSentence": "Would you like to join us for dinner tonight?", "answer": "Would you", "choices": ["Would you", "Will you", "Do you", "Are you"], "source": "IMG_0699", "explanation": "Would you like to do?「〜したいですか」丁寧な勧誘表現。", "relatedInfo": "I would like 人 to do「人に〜してほしい」", "category": "助動詞"}, {"id": 59, "type": "fill", "question": "You _____ better see a doctor right away.", "hint": "すぐに医者に診てもらった方がいい", "fullSentence": "You had better see a doctor right away.", "answer": "had", "source": "IMG_0699", "explanation": "had better do「〜した方がいい」。忠告・警告のニュアンスが強い。", "relatedInfo": "had better not do「〜しない方がいい」(notの位置に注意)", "category": "助動詞"}, {"id": 60, "type": "choice", "question": "It's only natural that he _____ angry.", "hint": "彼が怒るのも当然だ", "fullSentence": "It's only natural that he should be angry.", "answer": "should be", "choices": ["should be", "would be", "is", "was"], "source": "IMG_0699", "explanation": "It is natural that S should V「〜するのは当然だ」。", "relatedInfo": "should は省略されることもある(仮定法現在的にVの原形も可)。", "category": "助動詞"}, {"id": 61, "type": "fill", "question": "If I _____ you, I would apologize immediately.", "hint": "もし私があなたなら、すぐに謝るだろう", "fullSentence": "If I were you, I would apologize immediately.", "answer": "were", "source": "IMG_0702", "explanation": "仮定法過去。ifの中はwere(be動詞は人称に関わらずwereが好まれる)。", "relatedInfo": "If I were in your place, ... とも言い換え可能。", "category": "仮定法"}, {"id": 62, "type": "choice", "question": "If it had not been for your help, I _____ the project.", "hint": "あなたの助けがなかったら、私はそのプロジェクトを完成できなかっただろう", "fullSentence": "If it had not been for your help, I could not have finished the project.", "answer": "could not have finished", "choices": ["could not have finished", "cannot finish", "could not finish", "will not finish"], "source": "IMG_0702", "explanation": "仮定法過去完了。If it had not been for〜「〜がなかったら」。", "relatedInfo": "= But for your help / Without your help", "category": "仮定法"}, {"id": 63, "type": "fill", "question": "_____ for your advice, I would have failed.", "hint": "あなたの助言がなかったら、私は失敗していただろう", "fullSentence": "But for your advice, I would have failed.", "answer": "But", "source": "IMG_0702", "explanation": "But for〜「〜がなければ」仮定法の副詞句。", "relatedInfo": "= Without your advice / Had it not been for your advice", "category": "仮定法"}, {"id": 64, "type": "choice", "question": "I wish I _____ speak French fluently.", "hint": "フランス語を流暢に話せたらいいのに(現在の事実に反する願望)", "fullSentence": "I wish I could speak French fluently.", "answer": "could", "choices": ["could", "can", "will", "would"], "source": "IMG_0702", "explanation": "I wish S 過去形「〜だったらいいのに」現在の事実の反対の願望。", "relatedInfo": "I wish I had studied harder.(過去への後悔)", "category": "仮定法"}, {"id": 65, "type": "fill", "question": "She talks _____ she knew everything.", "hint": "彼女はまるで何でも知っているかのように話す", "fullSentence": "She talks as if she knew everything.", "answer": "as if", "source": "IMG_0702", "explanation": "as if[though] S 過去形「まるで〜であるかのように」現在の事実に反する比喩。", "relatedInfo": "as if S had pp なら過去の事実に反する比喩。", "category": "仮定法"}, {"id": 66, "type": "choice", "question": "It is time you _____ to bed.", "hint": "もう寝る時間だ", "fullSentence": "It is time you went to bed.", "answer": "went", "choices": ["went", "go", "have gone", "will go"], "source": "IMG_0702", "explanation": "It is (high/about) time S 過去形「もう〜していい頃だ」仮定法。", "relatedInfo": "It is time to go to bed.(不定詞を使う言い方もある)", "category": "仮定法"}, {"id": 67, "type": "fill", "question": "I would rather you _____ tell anyone about this.", "hint": "このことは誰にも言わないでほしい", "fullSentence": "I would rather you did not tell anyone about this.", "answer": "did not", "source": "IMG_0702", "explanation": "would rather S+過去形「(人に)〜してほしい」。", "relatedInfo": "I would rather you were here now.も同型。", "category": "仮定法"}, {"id": 68, "type": "choice", "question": "_____ I to be rich, I would travel around the world.", "hint": "もし私が金持ちだったら、世界中を旅行するだろう(倒置による仮定法)", "fullSentence": "Were I to be rich, I would travel around the world.", "answer": "Were", "choices": ["Were", "Am", "Was", "Be"], "source": "IMG_0702", "explanation": "If S were to do の倒置形はWere S to do。実現の可能性が低い未来の仮定。", "relatedInfo": "= If I were to be rich, ...", "category": "仮定法"}, {"id": 69, "type": "fill", "question": "_____ it not been for his help, I would have failed.", "hint": "彼の助けがなかったら、私は失敗していただろう(倒置)", "fullSentence": "Had it not been for his help, I would have failed.", "answer": "Had", "source": "IMG_0702", "explanation": "If it had not been for〜の倒置形はHad it not been for〜。ifが省略され倒置が起こる。", "relatedInfo": "仮定法の倒置：Were/Had/Shouldで始める。", "category": "仮定法"}, {"id": 70, "type": "choice", "question": "_____ you change your mind, please let me know.", "hint": "もし気が変わったら教えてください", "fullSentence": "Should you change your mind, please let me know.", "answer": "Should", "choices": ["Should", "Would", "Were", "Had"], "source": "IMG_0702", "explanation": "If you should change your mindの倒置形。未来の起こりそうもないことの仮定。", "relatedInfo": "仮定法未来の倒置形。", "category": "仮定法"}, {"id": 71, "type": "fill", "question": "_____ for him to solve this problem alone.", "hint": "彼がこの問題を一人で解くのは不可能だ", "fullSentence": "It is impossible for him to solve this problem alone.", "answer": "It is impossible", "source": "IMG_0703", "explanation": "It is 形容詞 for A to do「Aが〜するのは…だ」。for Aが意味上の主語。", "relatedInfo": "人の性質を表す形容詞(kind, foolish等)はfor→ofになる。", "category": "不定詞"}, {"id": 72, "type": "choice", "question": "It was very kind _____ you to help me.", "hint": "手伝ってくれてあなたはとても親切だった", "fullSentence": "It was very kind of you to help me.", "answer": "of", "choices": ["of", "for", "to", "with"], "source": "IMG_0703", "explanation": "人の性質・判断を表す形容詞(kind, foolish, careless等)は意味上の主語にofを使う。", "relatedInfo": "It is impossible for there to be any mistake.(forのまま)", "category": "不定詞"}, {"id": 73, "type": "fill", "question": "He seems _____ ill.", "hint": "彼は病気であるらしい", "fullSentence": "He seems to be ill.", "answer": "to be", "source": "IMG_0703", "explanation": "seem to be「〜であるらしい」。", "relatedInfo": "= It seems that he is ill.", "category": "不定詞"}, {"id": 74, "type": "choice", "question": "The news made it difficult _____ to concentrate.", "hint": "その知らせのせいで私は集中するのが難しくなった", "fullSentence": "The news made it difficult for me to concentrate.", "answer": "for me", "choices": ["for me", "of me", "to me", "with me"], "source": "IMG_0703", "explanation": "make it+形容詞+for A to do「Aが〜するのを…にする」形式目的語のit。", "relatedInfo": "I would appreciate it if you could help me.も形式目的語のit。", "category": "不定詞"}, {"id": 75, "type": "fill", "question": "I take _____ for granted that he will come.", "hint": "彼が来ることを当然だと思っている", "fullSentence": "I take it for granted that he will come.", "answer": "it", "source": "IMG_0703", "explanation": "take it for granted that S V「〜を当然のことと思う」itは形式目的語。", "relatedInfo": "= assume that S V", "category": "不定詞"}, {"id": 76, "type": "choice", "question": "This old camera _____ this brain of mine.", "hint": "この古いカメラは私のこの頭脳に頼っている", "fullSentence": "This old camera of mine depends on this brain of mine.", "answer": "depends on", "choices": ["depends on", "depends of", "relies for", "counts of"], "source": "IMG_0703", "explanation": "depend on「〜に頼る、次第である」。二重所有格(this camera of mine)にも注意。", "relatedInfo": "rely on, count onも類義。", "category": "不定詞"}, {"id": 77, "type": "fill", "question": "This car is too expensive _____ me to buy.", "hint": "この車は高すぎて私には買えない", "fullSentence": "This car is too expensive for me to buy.", "answer": "for", "source": "IMG_0699", "explanation": "too 形容詞 for A to do「Aが〜するには…すぎる」。", "relatedInfo": "= This car is so expensive that I cannot buy it.", "category": "助動詞"}, {"id": 78, "type": "choice", "question": "He worked hard _____ he could pass the exam.", "hint": "彼は試験に受かるように一生懸命勉強した", "fullSentence": "He worked hard so that he could pass the exam.", "answer": "so that", "choices": ["so that", "so as to", "in order that", "for fear that"], "source": "IMG_0721", "explanation": "so that S can[could]「〜するために」目的を表す接続詞。", "relatedInfo": "= in order that S may[might]", "category": "接続詞"}, {"id": 79, "type": "fill", "question": "He worked hard _____ he overslept and missed the first train.", "hint": "彼は寝坊して始発電車に乗り遅れるほどぐっすり眠った", "fullSentence": "He overslept so that he missed the first train.", "answer": "so that", "source": "IMG_0721", "explanation": "so that は「その結果〜」という結果を表す用法もある。", "relatedInfo": "文脈により「目的」か「結果」かを判断する。", "category": "接続詞"}, {"id": 80, "type": "choice", "question": "He worked hard _____ he might fail the exam.", "hint": "試験に落ちるといけないので彼は一生懸命勉強した", "fullSentence": "He worked hard for fear that he might fail the exam.", "answer": "for fear that", "choices": ["for fear that", "so that", "in case", "as long as"], "source": "IMG_0721", "explanation": "for fear that S should[might]「〜するといけないので」。", "relatedInfo": "= lest S should do", "category": "接続詞"}, {"id": 81, "type": "fill", "question": "Take an umbrella _____ it should rain.", "hint": "雨が降るといけないので傘を持って行きなさい", "fullSentence": "Take an umbrella in case it should rain.", "answer": "in case", "source": "IMG_0721", "explanation": "in case S V「〜するといけないので、〜する場合に備えて」。", "relatedInfo": "in caseはアメリカ英語で「もし〜なら」の意味でも使われる。", "category": "接続詞"}, {"id": 82, "type": "fill", "question": "This bag is _____ good as any I have ever seen.", "hint": "このバッグは私が今まで見た中でどれにも劣らず良い", "fullSentence": "This bag is as good as any I have ever seen.", "answer": "as", "source": "IMG_0710", "explanation": "as+原級+as any「どの〜にも劣らず」。", "relatedInfo": "This bag is as good as any bag I have ever had.とも表現できる。", "category": "比較(原級as~as)"}, {"id": 83, "type": "choice", "question": "He has _____ books as I have.", "hint": "彼は私が持っているのと同じくらい多くの本を持っている", "fullSentence": "He has as many books as I have.", "answer": "as many", "choices": ["as many", "as much", "as few", "as little"], "source": "IMG_0710", "explanation": "as+many+可算名詞+as「〜と同じくらい多くの…」。不可算名詞ならas much。", "relatedInfo": "as few[little] as「〜ほどしか(少ない)」という否定的含みもある。", "category": "比較(原級as~as)"}, {"id": 84, "type": "fill", "question": "She does not have _____ money as B has.", "hint": "彼女はBほど多くのお金を持っていない", "fullSentence": "She does not have as much money as B has.", "answer": "as much", "source": "IMG_0710", "explanation": "not as[so] 原級 as「〜ほど…ではない」。", "relatedInfo": "= She has less money than B.", "category": "比較(原級as~as)"}, {"id": 85, "type": "choice", "question": "He is not _____ diligent as his brother.", "hint": "彼は兄ほど勤勉ではない", "fullSentence": "He is not so diligent as his brother.", "answer": "so", "choices": ["so", "as", "too", "very"], "source": "IMG_0710", "explanation": "not so 原級 as は否定文で好まれる(as の代わりにsoも可)。", "relatedInfo": "= He is less diligent than his brother.", "category": "比較(原級as~as)"}, {"id": 86, "type": "fill", "question": "This problem is _____ easy as that one.", "hint": "この問題はあの問題ほど簡単ではない", "fullSentence": "This problem is not as easy as that one.", "answer": "not as", "source": "IMG_0710", "explanation": "not as 原級 as「〜ほど…でない」。", "relatedInfo": "= This problem is more difficult than that one.", "category": "比較(原級as~as)"}, {"id": 87, "type": "choice", "question": "He is _____ as diligent as his sister, if not more so.", "hint": "彼は妹に劣らず、いやそれ以上に勤勉かもしれない", "fullSentence": "He is quite as diligent as his sister, if not more so.", "answer": "quite", "choices": ["quite", "very much", "so", "too"], "source": "IMG_0710", "explanation": "quite as〜as「〜に劣らず」強調表現。", "relatedInfo": "if not more so「それ以上かもしれないが」という付け足し表現。", "category": "比較(原級as~as)"}, {"id": 88, "type": "fill", "question": "She is not so much a singer _____ a songwriter.", "hint": "彼女は歌手というよりむしろ作詞家だ", "fullSentence": "She is not so much a singer as a songwriter.", "answer": "as", "source": "IMG_0710", "explanation": "not so much A as B「AというよりむしろB」。", "relatedInfo": "= B rather than A", "category": "比較(原級as~as)"}, {"id": 89, "type": "choice", "question": "He can no more swim than a hammer _____ .", "hint": "彼が泳げないのはハンマーが泳げないのと同じだ(全く泳げない)", "fullSentence": "He can no more swim than a hammer can.", "answer": "can", "choices": ["can", "cannot", "could", "would"], "source": "IMG_0711", "explanation": "A cannot no more do than B「AがBと同様にできない」鯨構文。", "relatedInfo": "= Just as a hammer cannot swim, he cannot swim, either.", "category": "比較(no more/no less)"}, {"id": 90, "type": "fill", "question": "This lake is not so much beautiful _____ mysterious.", "hint": "この湖は美しいというよりむしろ神秘的だ", "fullSentence": "This lake is not so much beautiful as mysterious.", "answer": "as", "source": "IMG_0710", "explanation": "not so much A as B「AというよりむしろB」形容詞にも使える。", "relatedInfo": "without so much as doing「〜さえしないで」との混同に注意。", "category": "比較(原級as~as)"}, {"id": 91, "type": "choice", "question": "He left _____ so much as saying goodbye.", "hint": "彼はさよならさえ言わずに去った", "fullSentence": "He left without so much as saying goodbye.", "answer": "without", "choices": ["without", "not", "never", "hardly"], "source": "IMG_0710", "explanation": "without so much as doing「〜さえしないで」。", "relatedInfo": "= without even doing", "category": "比較(原級as~as)"}, {"id": 92, "type": "fill", "question": "This book is twice _____ long as that one.", "hint": "この本はあの本の2倍長い", "fullSentence": "This book is twice as long as that one.", "answer": "as", "source": "IMG_0710", "explanation": "倍数+as+原級+as「〜の…倍だ」。", "relatedInfo": "half as long as「半分の長さ」、three times as long as「3倍の長さ」", "category": "比較(原級as~as)"}, {"id": 93, "type": "choice", "question": "This bridge is _____ the length of that one.", "hint": "この橋はあの橋の2倍の長さだ", "fullSentence": "This bridge is twice the length of that one.", "answer": "twice the length of", "choices": ["twice the length of", "twice length of", "two times the long of", "twice as long"], "source": "IMG_0710", "explanation": "倍数+the+名詞+of「〜の…倍の(名詞)」。", "relatedInfo": "= twice as long as that one", "category": "比較(原級as~as)"}, {"id": 94, "type": "fill", "question": "She has _____ books as I have.", "hint": "彼女は私が持っている本の2倍の数を持っている", "fullSentence": "She has twice as many books as I have.", "answer": "twice as many", "source": "IMG_0710", "explanation": "倍数+as+many+名詞+as「〜の…倍多くの」。", "relatedInfo": "数えられない名詞ならtwice as much。", "category": "比較(原級as~as)"}, {"id": 95, "type": "choice", "question": "This bag is _____ that one.", "hint": "このバッグはあのバッグより優れている(than不要)", "fullSentence": "This bag is superior to that one.", "answer": "superior to", "choices": ["superior to", "superior than", "more superior to", "superior for"], "source": "IMG_0712", "explanation": "superior to「〜より優れている」ラテン比較級。thanではなくtoを使う。", "relatedInfo": "inferior to, senior to, junior to, prefer A to B も同型。", "category": "比較(比較級・最上級)"}, {"id": 96, "type": "fill", "question": "I prefer coffee _____ tea.", "hint": "私は紅茶よりコーヒーの方が好きだ", "fullSentence": "I prefer coffee to tea.", "answer": "to", "source": "IMG_0712", "explanation": "prefer A to B「BよりAを好む」。thanではなくtoを使う点に注意。", "relatedInfo": "prefer to do rather than do も類義表現。", "category": "比較(比較級・最上級)"}, {"id": 97, "type": "choice", "question": "He is five years _____ than me.", "hint": "彼は私より5歳年上だ", "fullSentence": "He is five years senior to me.", "answer": "senior to", "choices": ["senior to", "senior than", "more senior than", "older than for"], "source": "IMG_0712", "explanation": "senior to「〜より年上・先輩」。差を表す語(five years)は前に置く。", "relatedInfo": "= He is five years older than me.", "category": "比較(比較級・最上級)"}, {"id": 98, "type": "fill", "question": "He _____ better than to trust such a stranger.", "hint": "彼はそんな見知らぬ人を信用するほど愚かではない", "fullSentence": "He knows better than to trust such a stranger.", "answer": "knows", "source": "IMG_0712", "explanation": "know better than to do「〜するほど愚かではない」。", "relatedInfo": "= He is not so foolish as to trust such a stranger.", "category": "比較(比較級・最上級)"}, {"id": 99, "type": "choice", "question": "He has _____ books than I have.", "hint": "彼は私よりずっと多くの本を持っている", "fullSentence": "He has much more books than I have.", "answer": "much more", "choices": ["much more", "very more", "much most", "many more than"], "source": "IMG_0712", "explanation": "比較級の強調はmuch, far, still, even, a lot, by farなど(veryは不可)。", "relatedInfo": "He is by far the best of all.(最上級の強調はby far, muchなど)", "category": "比較(比較級・最上級)"}, {"id": 100, "type": "fill", "question": "This is _____ the most interesting of all.", "hint": "これは全ての中で断然一番面白い", "fullSentence": "This is by far the most interesting of all.", "answer": "by far", "source": "IMG_0712", "explanation": "最上級の強調はby far, muchなど。veryはthe very+最上級の形で使う。", "relatedInfo": "= the very most interesting とは言わず the very+最上級で使う場合はthe very best のように。", "category": "比較(比較級・最上級)"}, {"id": 101, "type": "choice", "question": "The _____ you have, the _____ you want.", "hint": "持てば持つほど、もっと欲しくなる", "fullSentence": "The more you have, the more you want.", "answer": "more / more", "choices": ["more / more", "most / most", "more / most", "much / much"], "source": "IMG_0712", "explanation": "The+比較級〜, the+比較級…「〜すればするほど…だ」。", "relatedInfo": "The sooner, the better.「早ければ早いほど良い」", "category": "比較(比較級・最上級)"}, {"id": 102, "type": "fill", "question": "He is _____ than anyone else in his class.", "hint": "彼はクラスの他の誰よりも背が高い", "fullSentence": "He is taller than anyone else in his class.", "answer": "taller", "source": "IMG_0713", "explanation": "比較級+than anyone else「他の誰よりも〜」最上級相当表現。", "relatedInfo": "= He is the tallest in his class.", "category": "最上級相当表現"}, {"id": 103, "type": "choice", "question": "No other mountain in Japan _____ Mt. Fuji.", "hint": "日本の他のどの山も富士山ほど高くない", "fullSentence": "No other mountain in Japan is as high as Mt. Fuji.", "answer": "is as high as", "choices": ["is as high as", "is higher than", "is high as", "is as high than"], "source": "IMG_0713", "explanation": "No other 名詞...as[so] 原級 as A「Aほど〜な…はない」最上級相当表現。", "relatedInfo": "= Mt. Fuji is higher than any other mountain in Japan.", "category": "最上級相当表現"}, {"id": 104, "type": "fill", "question": "Mt. Fuji is higher than _____ mountain in Japan.", "hint": "富士山は日本の他のどの山よりも高い", "fullSentence": "Mt. Fuji is higher than any other mountain in Japan.", "answer": "any other", "source": "IMG_0713", "explanation": "比較級+than any other+単数名詞「他のどの〜よりも」最上級相当表現。", "relatedInfo": "= No other mountain in Japan is higher than Mt. Fuji.", "category": "最上級相当表現"}, {"id": 105, "type": "choice", "question": "_____ is as precious as time.", "hint": "時間ほど貴重なものはない", "fullSentence": "Nothing is as precious as time.", "answer": "Nothing", "choices": ["Nothing", "Something", "Anything", "Everything"], "source": "IMG_0713", "explanation": "Nothing is as[so]〜as A「Aほど〜なものはない」最上級相当表現。", "relatedInfo": "= Time is the most precious of all.", "category": "最上級相当表現"}, {"id": 106, "type": "fill", "question": "He is second to _____ when it comes to doing business.", "hint": "商売にかけては彼は誰にも劣らない", "fullSentence": "He is second to none when it comes to doing business.", "answer": "none", "source": "IMG_0713", "explanation": "second to none「誰にも劣らない、一番だ」。", "relatedInfo": "when it comes to doing「〜することにかけては」", "category": "最上級相当表現"}, {"id": 107, "type": "choice", "question": "It is _____ not A but B that surprised me.", "hint": "私を驚かせたのはAではなくBだった", "fullSentence": "It is not A but B that surprised me.", "answer": "not A but B", "choices": ["not A but B", "not only A but B", "A but not B", "neither A nor B"], "source": "IMG_0713", "explanation": "not A but B「AではなくB」。it is 〜that強調構文と組み合わさることもある。", "relatedInfo": "not only A but also B「AだけでなくBも」との違いに注意。", "category": "最上級相当表現"}, {"id": 108, "type": "fill", "question": "She is not so much beautiful as _____ .", "hint": "彼女は美しいというよりむしろ知的だ", "fullSentence": "She is not so much beautiful as intelligent.", "answer": "intelligent", "source": "IMG_0713", "explanation": "not so much A as B「AというよりむしろB」の反復練習。", "relatedInfo": "= She is intelligent rather than beautiful.", "category": "最上級相当表現"}, {"id": 109, "type": "choice", "question": "He is not so much a teacher _____ a friend to his students.", "hint": "彼は先生というよりむしろ学生たちの友人だ", "fullSentence": "He is not so much a teacher as a friend to his students.", "answer": "as", "choices": ["as", "than", "but", "for"], "source": "IMG_0713", "explanation": "not so much A as B の定番パターン。", "relatedInfo": "friend to A「Aにとっての友人」", "category": "最上級相当表現"}, {"id": 110, "type": "fill", "question": "Money is no _____ necessary for happy marriage than love is.", "hint": "お金は愛と同様に幸せな結婚に必要である(思っている以上に)", "fullSentence": "Money is no less necessary for happy marriage than love is.", "answer": "less", "source": "IMG_0711", "explanation": "no less A than B「Bと同様にAだ」。Bに劣らずAという肯定的比較。", "relatedInfo": "no more A than B「BでないのとちょうどAでない」の反対の意味。", "category": "比較(no more/no less)"}, {"id": 111, "type": "choice", "question": "A whale is _____ a fish than a horse is.", "hint": "クジラが魚でないのは馬が魚でないのと同じだ", "fullSentence": "A whale is no more a fish than a horse is.", "answer": "no more", "choices": ["no more", "no less", "not more", "not less"], "source": "IMG_0711", "explanation": "A is no more B than C is「AがBでないのはCがBでないのと同じ」鯨構文。", "relatedInfo": "= A whale is not a fish, any more than a horse is.", "category": "比較(no more/no less)"}, {"id": 112, "type": "fill", "question": "This chimpanzee can _____ speak more than a baby can.", "hint": "このチンパンジーは赤ちゃんと同様しゃべれない", "fullSentence": "This chimpanzee can no more speak than a baby can.", "answer": "no more", "source": "IMG_0711", "explanation": "can no more do than「〜できないのは…同様だ」。", "relatedInfo": "than以下は比較対象で「できない」ことが前提。", "category": "比較(no more/no less)"}, {"id": 113, "type": "choice", "question": "You should think it over _____ deciding about marriage.", "hint": "結婚について決める前によく考えるべきだ", "fullSentence": "You should think it over without thinking about your marriage any more than necessary.", "answer": "without thinking about your marriage any more than necessary", "choices": ["without thinking about your marriage any more than necessary", "not more than necessary", "no less than necessary", "without deciding at all"], "source": "IMG_0711", "explanation": "not more than necessary「必要以上には〜ない」の応用。", "relatedInfo": "without thinking about ~ carefully のニュアンス整理に注意。", "category": "比較(no more/no less)"}, {"id": 114, "type": "fill", "question": "Money is no _____ necessary than we expect.", "hint": "お金は私たちが思うより必要でないわけではない", "fullSentence": "Money is no less necessary than we expect.", "answer": "less", "source": "IMG_0711", "explanation": "no less〜than「〜と同じくらい」肯定的な同等比較。", "relatedInfo": "= Money is just as necessary as we expect.", "category": "比較(no more/no less)"}, {"id": 115, "type": "choice", "question": "He gave _____ than $100 for the old car.", "hint": "彼はその古い車に100ドル以上払わなかった(多くても100ドル)", "fullSentence": "He gave not more than $100 for the old car.", "answer": "not more", "choices": ["not more", "not less", "no more", "no less"], "source": "IMG_0711", "explanation": "not more than「多くとも(=at most)」。", "relatedInfo": "not less than「少なくとも(=at least)」", "category": "比較(no more/no less)"}, {"id": 116, "type": "fill", "question": "He has _____ than $1000 in his bank account.", "hint": "彼の銀行口座には少なくとも1000ドルある", "fullSentence": "He has not less than $1000 in his bank account.", "answer": "not less", "source": "IMG_0711", "explanation": "not less than「少なくとも」= at least。", "relatedInfo": "not more than「多くとも」= at most", "category": "比較(no more/no less)"}, {"id": 117, "type": "choice", "question": "Between the two boys, Tom is _____ .", "hint": "2人のうちトムの方が背が高い", "fullSentence": "Between the two boys, Tom is the taller.", "answer": "the taller", "choices": ["the taller", "taller", "the tallest", "tallest"], "source": "IMG_0712", "explanation": "2者間の比較では比較級にtheをつける。", "relatedInfo": "3者以上なら最上級を使う。", "category": "比較(比較級・最上級)"}, {"id": 118, "type": "fill", "question": "This is _____ of the two books.", "hint": "これは2冊のうちより面白い方の本だ", "fullSentence": "This is the more interesting of the two books.", "answer": "the more interesting", "source": "IMG_0712", "explanation": "the+比較級+of the two「2つのうちより〜な方」。", "relatedInfo": "of the twoがつくと比較級にtheが必要。", "category": "比較(比較級・最上級)"}, {"id": 119, "type": "choice", "question": "He is _____ smart as his sister, if not more so.", "hint": "彼は妹に劣らず賢い、それ以上かもしれないが", "fullSentence": "He is as smart as his sister, if not more so.", "answer": "as", "choices": ["as", "so", "too", "very"], "source": "IMG_0710", "explanation": "as 原級 as A, if not more so「Aに劣らず〜、それ以上かもしれないが」。", "relatedInfo": "if not more soは「そうでないにしても、もっとそうかもしれない」という譲歩の付加。", "category": "比較(原級as~as)"}, {"id": 120, "type": "fill", "question": "one/that/those/it の使い分け練習: I don't have a car, but my brother has _____ .", "hint": "私は車を持っていないが、兄は(1台)持っている(不特定・同種)", "fullSentence": "I don't have a car, but my brother has one.", "answer": "one", "source": "IMG_0714", "explanation": "oneは不特定の可算名詞の代用(a+単数名詞)。", "relatedInfo": "itは同一のものを指す/thatは特定・既出の名詞の代用。", "category": "代名詞(one/that/other等)"}, {"id": 121, "type": "choice", "question": "The population of Tokyo is larger than _____ of Osaka.", "hint": "東京の人口は大阪の人口より多い", "fullSentence": "The population of Tokyo is larger than that of Osaka.", "answer": "that", "choices": ["that", "it", "one", "this"], "source": "IMG_0714", "explanation": "thatは前出の単数名詞(the population)の反復を避ける代用。", "relatedInfo": "複数名詞ならthoseを使う。", "category": "代名詞(one/that/other等)"}, {"id": 122, "type": "fill", "question": "The rules of this school are stricter than _____ of that school.", "hint": "この学校の規則はあの学校の規則より厳しい", "fullSentence": "The rules of this school are stricter than those of that school.", "answer": "those", "source": "IMG_0714", "explanation": "thoseは前出の複数名詞(the rules)の反復を避ける代用。", "relatedInfo": "= the rules of that school", "category": "代名詞(one/that/other等)"}, {"id": 123, "type": "choice", "question": "I lost my umbrella, so I bought _____ .", "hint": "傘をなくしたので、(新しく別の)傘を買った", "fullSentence": "I lost my umbrella, so I bought a new one.", "answer": "a new one", "choices": ["a new one", "it", "that", "the one"], "source": "IMG_0714", "explanation": "oneは不特定の名詞の代用。同一の物を指すならitを使う。", "relatedInfo": "I lost my umbrella, so I looked for it.(同一の傘を探す場合)", "category": "代名詞(one/that/other等)"}, {"id": 124, "type": "fill", "question": "Such _____ know him respect him.", "hint": "彼を知っている人はそのような人々は彼を尊敬する", "fullSentence": "Such as know him respect him.", "answer": "as", "source": "IMG_0714", "explanation": "such as「〜のような人々」関係代名詞的用法のas。", "relatedInfo": "such 名詞 as「〜のような…」の形も頻出。", "category": "代名詞(one/that/other等)"}, {"id": 125, "type": "choice", "question": "He is not such a fool _____ to believe that.", "hint": "彼はそれを信じるほど愚かではない", "fullSentence": "He is not such a fool as to believe that.", "answer": "as", "choices": ["as", "that", "so", "than"], "source": "IMG_0714", "explanation": "such 名詞 as to do「〜するほどの…」。", "relatedInfo": "= so foolish as to believe that", "category": "代名詞(one/that/other等)"}, {"id": 126, "type": "fill", "question": "_____ is a matter of great importance to us.", "hint": "それは私たちにとって非常に重要な問題だ", "fullSentence": "It is a matter of great importance to us.", "answer": "It", "source": "IMG_0714", "explanation": "itは前文全体の内容や状況を指す用法もある。", "relatedInfo": "形式主語のit、状況のitなど複数の用法がある。", "category": "代名詞(one/that/other等)"}, {"id": 127, "type": "choice", "question": "Why was it that she was angry?", "hint": "なぜ彼女は怒っていたのか(強調構文)", "fullSentence": "Why was it that she was angry?", "answer": "Why was it that", "choices": ["Why was it that", "Why did it that", "Why it was that", "Why was that"], "source": "IMG_0714", "explanation": "疑問詞+is/was it that〜?の強調構文の疑問文形。", "relatedInfo": "It is because〜thatの答え方と対応。", "category": "代名詞(one/that/other等)"}, {"id": 128, "type": "fill", "question": "I have two dogs; _____ is white and _____ is black.", "hint": "犬を2匹飼っている。一方は白でもう一方は黒だ", "fullSentence": "I have two dogs; one is white and the other is black.", "answer": "one / the other", "source": "IMG_0715", "explanation": "2つのうち「一方はone、もう一方はthe other」。", "relatedInfo": "3つ以上ならone, another, the other(最後の一つ)。", "category": "代名詞(one/that/other等)"}, {"id": 129, "type": "choice", "question": "I have three brothers; one is in Osaka, and _____ are in Tokyo.", "hint": "兄弟が3人いる。一人は大阪に、残りの2人は東京にいる", "fullSentence": "I have three brothers; one is in Osaka, and the others are in Tokyo.", "answer": "the others", "choices": ["the others", "another", "others", "the other"], "source": "IMG_0715", "explanation": "残り全部を指すときはthe others(特定の複数)。", "relatedInfo": "othersは不特定の複数「他のいくつか」。", "category": "代名詞(one/that/other等)"}, {"id": 130, "type": "fill", "question": "Some like coffee, and _____ like tea.", "hint": "コーヒーが好きな人もいれば、紅茶が好きな人もいる", "fullSentence": "Some like coffee, and others like tea.", "answer": "others", "source": "IMG_0715", "explanation": "Some〜, others…「〜する人もいれば…する人もいる」不特定の対比。", "relatedInfo": "Some〜, and the others…なら「残り全員」の意味になる。", "category": "代名詞(one/that/other等)"}, {"id": 131, "type": "choice", "question": "I don't like this tie. Show me _____ .", "hint": "このネクタイは好きではない。別のを見せてください", "fullSentence": "I don't like this tie. Show me another.", "answer": "another", "choices": ["another", "other", "the other", "others"], "source": "IMG_0715", "explanation": "another「(不特定の)もう一つ別のもの」。", "relatedInfo": "one after another「次々に」も頻出表現。", "category": "代名詞(one/that/other等)"}, {"id": 132, "type": "fill", "question": "To know is one thing, and to teach is _____ .", "hint": "知っていることと教えることは別のことだ", "fullSentence": "To know is one thing, and to teach is another.", "answer": "another", "source": "IMG_0715", "explanation": "A is one thing, and B is another「AとBは別のことだ」。", "relatedInfo": "知識と実践は異なるという定番表現。", "category": "代名詞(one/that/other等)"}, {"id": 133, "type": "choice", "question": "They looked at _____ in silence.", "hint": "彼らは黙ってお互いを見つめ合った", "fullSentence": "They looked at each other in silence.", "answer": "each other", "choices": ["each other", "the other", "another", "others"], "source": "IMG_0715", "explanation": "each other「お互い」2者間の相互関係。", "relatedInfo": "one anotherは3者以上でも使われるが、現代英語では区別が薄れている。", "category": "代名詞(one/that/other等)"}, {"id": 134, "type": "fill", "question": "The store is open _____ other day.", "hint": "その店は1日おきに開いている", "fullSentence": "The store is open every other day.", "answer": "every", "source": "IMG_0715", "explanation": "every other day「1日おきに」。", "relatedInfo": "every third day「3日ごとに」のように数詞も入る。", "category": "代名詞(one/that/other等)"}, {"id": 135, "type": "choice", "question": "I have two sisters; _____ is in Osaka, and the other is in Tokyo.", "hint": "姉妹が2人いる。一人は大阪に、もう一人は東京にいる", "fullSentence": "I have two sisters; one is in Osaka, and the other is in Tokyo.", "answer": "one", "choices": ["one", "another", "the one", "others"], "source": "IMG_0715", "explanation": "2者のうち「片方はone、もう片方はthe other」の基本パターン。", "relatedInfo": "one is ~, another is ~, and the other is ~(3者の場合)", "category": "代名詞(one/that/other等)"}, {"id": 136, "type": "fill", "question": "She has a daughter _____ hair is very long.", "hint": "彼女には髪がとても長い娘がいる", "fullSentence": "She has a daughter whose hair is very long.", "answer": "whose", "source": "IMG_0717", "explanation": "所有格の関係代名詞whose。先行詞が人でも物でも使える。", "relatedInfo": "the roof of which is painted yellow = whose roof is painted yellow", "category": "関係詞"}, {"id": 137, "type": "choice", "question": "This is the town _____ I was born.", "hint": "これは私が生まれた町だ", "fullSentence": "This is the town where I was born.", "answer": "where", "choices": ["where", "which", "that", "when"], "source": "IMG_0717", "explanation": "関係副詞where「〜する(場所)」。先行詞が場所を表す名詞のとき使う。", "relatedInfo": "= the town in which I was born", "category": "関係詞"}, {"id": 138, "type": "fill", "question": "That is _____ he became a doctor.", "hint": "そういうわけで彼は医者になった(理由)", "fullSentence": "That is why he became a doctor.", "answer": "why", "source": "IMG_0717", "explanation": "関係副詞why「〜する理由」the reason whyの省略形。", "relatedInfo": "That is because he studied hard.「それは彼が一生懸命勉強したからだ」との違いに注意。", "category": "関係詞"}, {"id": 139, "type": "choice", "question": "This is _____ she made the cake.", "hint": "これが彼女がケーキを作った方法だ", "fullSentence": "This is how she made the cake.", "answer": "how", "choices": ["how", "the way how", "which way", "what way"], "source": "IMG_0717", "explanation": "howとthe wayは同時に使えない。the way (that) や the way in whichは可。", "relatedInfo": "= This is the way she made the cake.", "category": "関係詞"}, {"id": 140, "type": "fill", "question": "She has a clever whom, _____ she is proud of.", "hint": "彼女には賢い息子がいて、その息子を誇りに思っている", "fullSentence": "She has a clever son, of whom she is proud.", "answer": "of whom", "source": "IMG_0717", "explanation": "前置詞+関係代名詞(of whom)。継続用法(, whom)にも注意。", "relatedInfo": "= She has a clever son, and she is proud of him.", "category": "関係詞"}, {"id": 141, "type": "choice", "question": "He has a roof, the color _____ is painted yellow.", "hint": "彼には屋根があり、その色は黄色に塗られている", "fullSentence": "He has a roof, the color of which is painted yellow.", "answer": "of which", "choices": ["of which", "which", "whose", "that"], "source": "IMG_0717", "explanation": "the+名詞+of which「その〜が…」whoseの言い換え表現。", "relatedInfo": "= whose color is painted yellow", "category": "関係詞"}, {"id": 142, "type": "fill", "question": "There is no one _____ has weaknesses.", "hint": "弱点を持たない人はいない", "fullSentence": "There is no one that has not weaknesses.", "answer": "that", "source": "IMG_0717", "explanation": "no one ... that not「〜しない人はいない」二重否定の関係代名詞。", "relatedInfo": "先行詞がno one, all, everythingなどのときthatが好まれる。", "category": "関係詞"}, {"id": 143, "type": "choice", "question": "She has a car, _____ is the same as mine.", "hint": "彼女は私のと同じ車を持っている", "fullSentence": "She has a car, as is the same as mine.", "answer": "as", "choices": ["as", "which", "that", "what"], "source": "IMG_0717", "explanation": "such/the same+名詞+as「〜と同じ…」asが関係代名詞的に働く。", "relatedInfo": "as I said before,「前に述べたように」のasも関係代名詞的用法。", "category": "関係詞"}, {"id": 144, "type": "fill", "question": "He is not a poet, _____ his father was.", "hint": "彼は父親のようには詩人ではない(比較のas)", "fullSentence": "He is not a poet, as his father was.", "answer": "as", "source": "IMG_0717", "explanation": "as「〜であるように」比較・様態の接続詞的関係詞的用法。", "relatedInfo": "文脈でasは「〜のように」の意味で使われる。", "category": "関係詞"}, {"id": 145, "type": "choice", "question": "He has no money, _____ is often the case with him.", "hint": "よくあることだが、彼はお金を持っていない", "fullSentence": "He has no money, which is often the case with him.", "answer": "which", "choices": ["which", "what", "that", "as"], "source": "IMG_0717", "explanation": ", which is often the case with A「Aにはよくあることだが」。", "relatedInfo": "as is often the case with A も同義で使われる。", "category": "関係詞"}, {"id": 146, "type": "fill", "question": "There is no one _____ money he does not want.", "hint": "お金を欲しがらない人はいない", "fullSentence": "There is no one but wants money.", "answer": "but", "source": "IMG_0717", "explanation": "no one but「〜しない人はいない」butが関係代名詞的にthat...notの意味を持つ。", "relatedInfo": "= There is no one that does not want money.", "category": "関係詞"}, {"id": 147, "type": "choice", "question": "_____ hears the news will be surprised.", "hint": "その知らせを聞く人は誰でも驚くだろう", "fullSentence": "Whoever hears the news will be surprised.", "answer": "Whoever", "choices": ["Whoever", "Whatever", "Whichever", "However"], "source": "IMG_0719", "explanation": "Whoever「〜する人は誰でも」= anyone who。", "relatedInfo": "no matter who「誰が〜しようとも」の譲歩用法もある。", "category": "複合関係詞(whatever等)"}, {"id": 148, "type": "fill", "question": "_____ you may say, I will not change my mind.", "hint": "あなたが何を言おうとも、私は考えを変えない", "fullSentence": "Whatever you may say, I will not change my mind.", "answer": "Whatever", "source": "IMG_0719", "explanation": "Whatever S may V「たとえ何を〜しようとも」譲歩用法。= no matter what。", "relatedInfo": "mayは省略されることも多い。", "category": "複合関係詞(whatever等)"}, {"id": 149, "type": "choice", "question": "_____ way you choose, you will succeed.", "hint": "どちらの方法を選んでも、あなたは成功するだろう", "fullSentence": "Whichever way you choose, you will succeed.", "answer": "Whichever", "choices": ["Whichever", "Whatever", "Whoever", "Wherever"], "source": "IMG_0719", "explanation": "Whichever+名詞「どちらの〜を…しようとも」譲歩用法。", "relatedInfo": "= No matter which way you choose", "category": "複合関係詞(whatever等)"}, {"id": 150, "type": "fill", "question": "_____ tired he was, he kept working.", "hint": "どんなに疲れていても、彼は働き続けた", "fullSentence": "However tired he was, he kept working.", "answer": "However", "source": "IMG_0719", "explanation": "However+形容詞/副詞+S+V「どんなに〜でも」譲歩用法。", "relatedInfo": "= No matter how tired he was", "category": "複合関係詞(whatever等)"}, {"id": 151, "type": "choice", "question": "_____ you go, I will follow you.", "hint": "あなたがどこへ行こうとも、私はついていく", "fullSentence": "Wherever you go, I will follow you.", "answer": "Wherever", "choices": ["Wherever", "Whenever", "However", "Whoever"], "source": "IMG_0719", "explanation": "Wherever S V「どこへ〜しようとも」譲歩用法。", "relatedInfo": "= No matter where you go", "category": "複合関係詞(whatever等)"}, {"id": 152, "type": "fill", "question": "_____ you come, you are welcome.", "hint": "いつあなたが来ても、歓迎します", "fullSentence": "Whenever you come, you are welcome.", "answer": "Whenever", "source": "IMG_0719", "explanation": "Whenever S V「いつ〜しようとも」譲歩用法。", "relatedInfo": "= No matter when you come", "category": "複合関係詞(whatever等)"}, {"id": 153, "type": "choice", "question": "We got stuck in traffic jam, _____ made us forty minutes late for the meeting.", "hint": "渋滞に巻き込まれ、そのせいで会議に40分遅刻した", "fullSentence": "We got stuck in traffic jam, which made us forty minutes late for the meeting.", "answer": "which", "choices": ["which", "what", "that", "it"], "source": "IMG_0719", "explanation": "継続用法のwhichは前の文全体を先行詞にできる。", "relatedInfo": "非制限用法(, which)はコンマの後ろに補足説明を加える。", "category": "複合関係詞(whatever等)"}, {"id": 154, "type": "fill", "question": "I was told advice, _____ I followed.", "hint": "私は助言をされ、それに私は従った", "fullSentence": "I was told advice, which I followed.", "answer": "which", "source": "IMG_0719", "explanation": "継続用法のwhichで前出の名詞を受ける。", "relatedInfo": "関係代名詞の非制限用法は「そしてそれを」と訳すと分かりやすい。", "category": "複合関係詞(whatever等)"}, {"id": 155, "type": "choice", "question": "As is usual with him, he came late.", "hint": "彼にはよくあることだが、彼は遅刻した", "fullSentence": "As is usual with him, he came late.", "answer": "As is usual with him", "choices": ["As is usual with him", "Which is usual with him", "That is usual with him", "It is usual with him"], "source": "IMG_0719", "explanation": "As is usual with A「Aにはよくあることだが」文頭で使われる慣用表現。", "relatedInfo": "= As is often the case with him", "category": "複合関係詞(whatever等)"}, {"id": 156, "type": "fill", "question": "_____ which, with A does; whether _____ do so was the question.", "hint": "AがそうするかどうかがCの問題だった(whether)", "fullSentence": "Whether A does so was the question.", "answer": "Whether", "source": "IMG_0719", "explanation": "Whether S V「〜かどうか」名詞節を導く接続詞。", "relatedInfo": "ifも同義だが主語の位置では使えない。", "category": "複合関係詞(whatever等)"}, {"id": 157, "type": "choice", "question": "Do what you think is right, _____ who says what.", "hint": "誰が何を言おうと、あなたが正しいと思うことをしなさい", "fullSentence": "Do what you think is right, no matter who says what.", "answer": "no matter who says what", "choices": ["no matter who says what", "whoever says what", "however who says", "whatever says who"], "source": "IMG_0719", "explanation": "no matter+疑問詞「たとえ〜だとしても」= 疑問詞+ever。", "relatedInfo": "no matter what「たとえ何でも」= whatever", "category": "複合関係詞(whatever等)"}, {"id": 158, "type": "fill", "question": "When _____ , where you like.", "hint": "いつでも好きな時に、好きな場所で", "fullSentence": "Whenever you like, wherever you like.", "answer": "you like", "source": "IMG_0719", "explanation": "whenever/whereverの並列表現。時と場所を両方自由に選べることを表す。", "relatedInfo": "口語表現として定型化しやすいフレーズ。", "category": "複合関係詞(whatever等)"}, {"id": 159, "type": "fill", "question": "_____ soon as he arrived, the meeting began.", "hint": "彼が到着するとすぐに会議が始まった", "fullSentence": "As soon as he arrived, the meeting began.", "answer": "As", "source": "IMG_0720", "explanation": "as soon as「〜するとすぐに」= no sooner had S pp than。", "relatedInfo": "= No sooner had he arrived than the meeting began.", "category": "接続詞"}, {"id": 160, "type": "choice", "question": "_____ he arrived than the meeting began.", "hint": "彼が到着するやいなや会議が始まった", "fullSentence": "No sooner had he arrived than the meeting began.", "answer": "No sooner had", "choices": ["No sooner had", "No sooner did", "No sooner has", "No sooner was"], "source": "IMG_0720", "explanation": "No sooner had S pp than S V「〜するやいなや…した」倒置構文。", "relatedInfo": "= Hardly had he arrived when the meeting began.", "category": "接続詞"}, {"id": 161, "type": "fill", "question": "_____ he says, I will not believe him.", "hint": "彼が何を言おうとも、私は彼を信じない", "fullSentence": "Whatever he says, I will not believe him.", "answer": "Whatever", "source": "IMG_0720", "explanation": "譲歩の複合関係代名詞。", "relatedInfo": "= No matter what he says", "category": "接続詞"}, {"id": 162, "type": "choice", "question": "_____ you don't work hard, you will fail.", "hint": "一生懸命働かない限り、失敗するだろう", "fullSentence": "Unless you work hard, you will fail.", "answer": "Unless", "choices": ["Unless", "If", "Although", "Since"], "source": "IMG_0720", "explanation": "Unless S V「〜しない限り」= If S do not V。", "relatedInfo": "unlessの節の中では否定を重ねないよう注意。", "category": "接続詞"}, {"id": 163, "type": "fill", "question": "_____ (that) you finish your homework, you can go out.", "hint": "宿題を終えるという条件で外出してもよい", "fullSentence": "Provided that you finish your homework, you can go out.", "answer": "Provided", "source": "IMG_0720", "explanation": "provided[providing] (that) S V「〜という条件で」= on condition that。", "relatedInfo": "= on condition that you finish your homework", "category": "接続詞"}, {"id": 164, "type": "choice", "question": "_____ if it rains, we will go on a picnic.", "hint": "たとえ雨が降っても、私たちはピクニックに行く", "fullSentence": "Even if it rains, we will go on a picnic.", "answer": "Even", "choices": ["Even", "Although", "Even though", "Unless"], "source": "IMG_0720", "explanation": "even if「たとえ〜でも」不確実な仮定の譲歩。", "relatedInfo": "even though「〜だけれども」既知の事実への譲歩と使い分ける。", "category": "接続詞"}, {"id": 165, "type": "fill", "question": "_____ he is rich, he is not happy.", "hint": "彼は金持ちだけれども、幸せではない", "fullSentence": "Even though he is rich, he is not happy.", "answer": "Even though", "source": "IMG_0720", "explanation": "even though「〜だけれども」既に事実であることへの譲歩。", "relatedInfo": "even ifとの違い：ifは不確実、thoughは確実な事実。", "category": "接続詞"}, {"id": 166, "type": "choice", "question": "_____ he is poor or rich, he is always kind.", "hint": "貧しかろうと金持ちだろうと、彼はいつも親切だ", "fullSentence": "Whether he is poor or rich, he is always kind.", "answer": "Whether", "choices": ["Whether", "If", "Unless", "Although"], "source": "IMG_0720", "explanation": "whether A or B「AだろうとBだろうと」譲歩用法。", "relatedInfo": "whether or not S V の形も可能。", "category": "接続詞"}, {"id": 167, "type": "fill", "question": "_____ (=directly) he arrived, he called me.", "hint": "彼は到着するとすぐに私に電話した", "fullSentence": "The moment he arrived, he called me.", "answer": "The moment", "source": "IMG_0720", "explanation": "the moment (that) S V「〜するとすぐに」= as soon as。", "relatedInfo": "directly, immediatelyも接続詞的に「〜するとすぐに」の意味で使われる(主にイギリス英語)。", "category": "接続詞"}, {"id": 168, "type": "choice", "question": "He is a man _____ (Kyoto), which I would love to revisit.", "hint": "彼は京都出身で、私はまた訪れたいと思っている(継続用法の関係詞)", "fullSentence": "He is from Kyoto, which I would love to revisit.", "answer": "from Kyoto, which", "choices": ["from Kyoto, which", "from Kyoto, that", "from Kyoto that", "from Kyoto which"], "source": "IMG_0719", "explanation": "継続用法の関係代名詞which(コンマ+which)は先行詞を追加説明する。", "relatedInfo": "制限用法との違い：継続用法はカンマの前で文が完結する。", "category": "複合関係詞(whatever等)"}, {"id": 169, "type": "fill", "question": "As is _____ , the sun rises in the east.", "hint": "周知の通り、太陽は東から昇る", "fullSentence": "As is well known, the sun rises in the east.", "answer": "well known", "source": "IMG_0719", "explanation": "As is well known,「周知のように」慣用的な文頭表現。", "relatedInfo": "as everyone knowsも同義。", "category": "複合関係詞(whatever等)"}, {"id": 170, "type": "choice", "question": "_____ , money cannot buy happiness.", "hint": "私の意見では、お金で幸せは買えない", "fullSentence": "In my opinion, money cannot buy happiness.", "answer": "In my opinion", "choices": ["In my opinion", "As far as I concerned", "As long as I think", "So far as I know that"], "source": "IMG_0721", "explanation": "In my opinion,「私の意見では」= I think that。", "relatedInfo": "as far as I am concerned「私に関する限り」も類似表現。", "category": "接続詞"}, {"id": 171, "type": "fill", "question": "_____ as I am concerned, I have no objection.", "hint": "私に関する限り、異論はない", "fullSentence": "As far as I am concerned, I have no objection.", "answer": "As far", "source": "IMG_0721", "explanation": "as far as S be concerned「〜に関する限り」。", "relatedInfo": "as far as I know「私の知る限り」との違いに注意(knowは知識の範囲)。", "category": "接続詞"}, {"id": 172, "type": "choice", "question": "_____ you keep your promise, I will trust you.", "hint": "約束を守る限り、あなたを信頼する", "fullSentence": "As long as you keep your promise, I will trust you.", "answer": "As long as", "choices": ["As long as", "As far as", "As soon as", "As well as"], "source": "IMG_0721", "explanation": "as long as「〜する限り(条件)」。as far asは範囲、as long asは条件・期間。", "relatedInfo": "as long as = on condition that", "category": "接続詞"}, {"id": 173, "type": "fill", "question": "He worked hard, _____ his sister did not.", "hint": "彼は一生懸命働いたが、一方妹はそうしなかった(対比)", "fullSentence": "He worked hard, while his sister did not.", "answer": "while", "source": "IMG_0722", "explanation": "whileには「〜する間」の他に「〜する一方で」という対比の意味もある。", "relatedInfo": "whereasも同様の対比を表す接続詞。", "category": "前置詞"}, {"id": 174, "type": "choice", "question": "This is the town _____ she was born and grew up.", "hint": "ここは彼女が生まれ育った町だ", "fullSentence": "This is the town where she was born and grew up.", "answer": "where", "choices": ["where", "which", "that", "when"], "source": "IMG_0721", "explanation": "関係副詞whereの復習。先行詞the townを受ける。", "relatedInfo": "= the town in which she was born and grew up", "category": "接続詞"}, {"id": 175, "type": "fill", "question": "_____ overslept so that he missed the first train.", "hint": "彼は寝坊してしまい、始発電車を逃した", "fullSentence": "He overslept so that he missed the first train.", "answer": "He", "source": "IMG_0721", "explanation": "so that の結果用法の復習。", "relatedInfo": "soとthatの間にコンマがあると結果、ないと目的の意味になりやすい。", "category": "接続詞"}, {"id": 176, "type": "choice", "question": "He worked hard, _____ he should fail the exam again.", "hint": "また試験に落ちるといけないので彼は一生懸命勉強した", "fullSentence": "He worked hard, lest he should fail the exam again.", "answer": "lest", "choices": ["lest", "for fear", "so that", "in case that"], "source": "IMG_0721", "explanation": "lest S should do「〜しないように」やや文語的な表現。", "relatedInfo": "= for fear that he should fail", "category": "接続詞"}, {"id": 177, "type": "fill", "question": "In case _____ , here is my phone number.", "hint": "何かの場合に備えて、これが私の電話番号です", "fullSentence": "In case of emergency, here is my phone number.", "answer": "of emergency", "source": "IMG_0721", "explanation": "in case of+名詞「〜の場合に備えて」。", "relatedInfo": "in case (that) S V「〜する場合に備えて」節でも使える。", "category": "接続詞"}, {"id": 178, "type": "fill", "question": "He hung his coat _____ the hook.", "hint": "彼はコートをフックにかけた", "fullSentence": "He hung his coat around the hook.", "answer": "around", "source": "IMG_0723", "explanation": "aroundは「〜の周りに」だが、ここでは掛ける動作。文脈から前置詞の基本イメージを確認。", "relatedInfo": "aboutは「〜について/〜の辺りに」漠然とした周辺を表す。", "category": "前置詞"}, {"id": 179, "type": "choice", "question": "He put A _____ B in the construction.", "hint": "彼はその工事でAをBの管理下に置いた", "fullSentence": "He put A under B in the construction.", "answer": "under", "choices": ["under", "above", "below", "beyond"], "source": "IMG_0723", "explanation": "under「〜の下に、〜の管理下に」put A under B「AをBの下に置く」。", "relatedInfo": "be classified under〜「〜に分類される」も頻出表現。", "category": "前置詞"}, {"id": 180, "type": "fill", "question": "The sun sets _____ the horizon.", "hint": "太陽は地平線の下に沈む", "fullSentence": "The sun sets below the horizon.", "answer": "below", "source": "IMG_0723", "explanation": "belowは「(基準より)下に」。underは真下・
