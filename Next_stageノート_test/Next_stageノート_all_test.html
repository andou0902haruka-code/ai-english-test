ion": "cannot choose but do「〜せざるを得ない」。", "relatedInfo": "= cannot help doing = cannot but do"}, {"id": 18, "type": "reorder", "category": "再帰代名詞", "hint": "Aはどこかおかしい", "tokens": ["There", "is", "something", "wrong", "with", "A."], "fullSentence": "There is something wrong with A.", "source": "IMG_0716", "explanation": "There is something wrong with A「Aはどこか調子が悪い」。", "relatedInfo": "What is the matter with A? も同義の表現。"}, {"id": 19, "type": "reorder", "category": "再帰代名詞", "hint": "私は誰の助けも借りずに独力でその仕事をした", "tokens": ["I", "did", "the", "work", "by", "myself,", "without", "any", "help."], "fullSentence": "I did the work by myself, without any help.", "source": "IMG_0716", "explanation": "by oneself「独力で、ひとりで」。", "relatedInfo": "for oneself「自分のために/自分で」、in itself「それ自体」"}, {"id": 20, "type": "reorder", "category": "否定表現①", "hint": "それはジャックによってその町に送られた(=強調構文的言い換え)", "tokens": ["It", "was", "Jack", "that", "sent", "it", "to", "the", "town."], "fullSentence": "It was Jack that sent it to the town.", "source": "IMG_0728", "explanation": "It is A that ~の強調構文。Aを強調する。", "relatedInfo": "who/whichも用いられる(人ならwhoも可)。"}, {"id": 21, "type": "reorder", "category": "否定表現①", "hint": "病気になって初めて健康の大切さを感じる", "tokens": ["It", "is", "only", "when", "we", "are", "ill", "that", "we", "feel", "how", "important", "health", "is."], "fullSentence": "It is only when we are ill that we feel how important health is.", "source": "IMG_0728", "explanation": "It is only when〜that…「〜して初めて…」強調構文。", "relatedInfo": "It is not until〜that…とほぼ同義。"}, {"id": 22, "type": "reorder", "category": "助動詞", "hint": "私はその試験に合格できた(実際に合格した)", "tokens": ["I", "was", "able", "to", "pass", "the", "exam."], "fullSentence": "I was able to pass the exam.", "source": "IMG_0699", "explanation": "could は「実際に〜できた」という単発の成功にはwas able toを使う。canの過去形couldは能力全般。", "relatedInfo": "could not = was unable to(否定は両方可)。"}, {"id": 23, "type": "reorder", "category": "助動詞", "hint": "君が試験に合格したはずがない(全然勉強しなかったのだから)", "tokens": ["You", "cannot", "have", "passed", "the", "exam;", "you", "didn't", "study", "at", "all."], "fullSentence": "You cannot have passed the exam; you didn't study at all.", "source": "IMG_0699", "explanation": "cannot have pp「〜したはずがない」過去の事柄に対する強い否定的推量。", "relatedInfo": "must have pp「〜したに違いない」/ may have pp「〜したかもしれない」"}, {"id": 24, "type": "reorder", "category": "助動詞", "hint": "出かける前にドアに鍵をかけておくべきだったのに", "tokens": ["You", "should", "have", "locked", "the", "door", "before", "you", "left."], "fullSentence": "You should have locked the door before you left.", "source": "IMG_0699", "explanation": "should have pp「〜すべきだったのに(実際はしなかった)」非難・後悔を表す。", "relatedInfo": "ought to have pp も同義。"}, {"id": 25, "type": "reorder", "category": "助動詞", "hint": "そんなに心配する必要はなかったのに(実際は心配した)", "tokens": ["You", "need", "not", "have", "worried", "so", "much;", "everything", "turned", "out", "fine."], "fullSentence": "You need not have worried so much; everything turned out fine.", "source": "IMG_0699", "explanation": "need not have pp「〜する必要はなかったのに(実際はした)」。didn't need toとの違いに注意。", "relatedInfo": "didn't need to do「する必要がなかった(しなかった)」"}, {"id": 26, "type": "reorder", "category": "助動詞", "hint": "二度とそんなことをするな(強い禁止)", "tokens": ["You", "must", "not", "do", "that", "again!"], "fullSentence": "You must not do that again!", "source": "IMG_0701", "explanation": "must not「〜してはいけない」強い禁止。don't have toとの違いに注意。", "relatedInfo": "don't have to do「〜する必要はない」(禁止ではない)"}, {"id": 27, "type": "reorder", "category": "助動詞", "hint": "彼はどうしても真実を知りたがっている", "tokens": ["He", "will", "know", "the", "truth."], "fullSentence": "He will know the truth.", "source": "IMG_0699", "explanation": "willには「(強い)意志・固執」の意味もある。", "relatedInfo": "He will have his own way.「彼はどうしても自分のやり方を通したがる」"}, {"id": 28, "type": "reorder", "category": "熟語・慣用表現", "hint": "彼は不平を言わずにはいられない性分だ", "tokens": ["He", "cannot", "help", "but", "complain."], "fullSentence": "He cannot help but complain.", "source": "IMG_0709", "explanation": "cannot help but do「〜せずにはいられない」。", "relatedInfo": "= cannot help doing"}, {"id": 29, "type": "reorder", "category": "助動詞", "hint": "よくもまああんなことを彼女に言えたものだ", "tokens": ["How", "dare", "you", "say", "such", "a", "thing", "to", "her?"], "fullSentence": "How dare you say such a thing to her?", "source": "IMG_0699", "explanation": "How dare you〜?「よくも〜できるな」非難の慣用表現。", "relatedInfo": "dare not do「あえて〜しない」"}, {"id": 30, "type": "reorder", "category": "助動詞", "hint": "彼は都会の生活に慣れるだろう", "tokens": ["He", "will", "get", "used", "to", "city", "life."], "fullSentence": "He will get used to city life.", "source": "IMG_0699", "explanation": "get used to doing「〜に慣れる」(変化)。be used to doingは「慣れている」状態。", "relatedInfo": "be used to do「〜するために使われる」との混同に注意。"}, {"id": 31, "type": "reorder", "category": "助動詞", "hint": "すぐに医者に診てもらった方がいい", "tokens": ["You", "had", "better", "see", "a", "doctor", "right", "away."], "fullSentence": "You had better see a doctor right away.", "source": "IMG_0699", "explanation": "had better do「〜した方がいい」。忠告・警告のニュアンスが強い。", "relatedInfo": "had better not do「〜しない方がいい」(notの位置に注意)"}, {"id": 32, "type": "reorder", "category": "仮定法", "hint": "もし私があなたなら、すぐに謝るだろう", "tokens": ["If", "I", "were", "you,", "I", "would", "apologize", "immediately."], "fullSentence": "If I were you, I would apologize immediately.", "source": "IMG_0702", "explanation": "仮定法過去。ifの中はwere(be動詞は人称に関わらずwereが好まれる)。", "relatedInfo": "If I were in your place, ... とも言い換え可能。"}, {"id": 33, "type": "reorder", "category": "仮定法", "hint": "あなたの助言がなかったら、私は失敗していただろう", "tokens": ["But", "for", "your", "advice,", "I", "would", "have", "failed."], "fullSentence": "But for your advice, I would have failed.", "source": "IMG_0702", "explanation": "But for〜「〜がなければ」仮定法の副詞句。", "relatedInfo": "= Without your advice / Had it not been for your advice"}, {"id": 34, "type": "reorder", "category": "仮定法", "hint": "彼女はまるで何でも知っているかのように話す", "tokens": ["She", "talks", "as", "if", "she", "knew", "everything."], "fullSentence": "She talks as if she knew everything.", "source": "IMG_0702", "explanation": "as if[though] S 過去形「まるで〜であるかのように」現在の事実に反する比喩。", "relatedInfo": "as if S had pp なら過去の事実に反する比喩。"}, {"id": 35, "type": "reorder", "category": "仮定法", "hint": "このことは誰にも言わないでほしい", "tokens": ["I", "would", "rather", "you", "did", "not", "tell", "anyone", "about", "this."], "fullSentence": "I would rather you did not tell anyone about this.", "source": "IMG_0702", "explanation": "would rather S+過去形「(人に)〜してほしい」。", "relatedInfo": "I would rather you were here now.も同型。"}, {"id": 36, "type": "reorder", "category": "仮定法", "hint": "彼の助けがなかったら、私は失敗していただろう(倒置)", "tokens": ["Had", "it", "not", "been", "for", "his", "help,", "I", "would", "have", "failed."], "fullSentence": "Had it not been for his help, I would have failed.", "source": "IMG_0702", "explanation": "If it had not been for〜の倒置形はHad it not been for〜。ifが省略され倒置が起こる。", "relatedInfo": "仮定法の倒置：Were/Had/Shouldで始める。"}, {"id": 37, "type": "reorder", "category": "不定詞", "hint": "彼がこの問題を一人で解くのは不可能だ", "tokens": ["It", "is", "impossible", "for", "him", "to", "solve", "this", "problem", "alone."], "fullSentence": "It is impossible for him to solve this problem alone.", "source": "IMG_0703", "explanation": "It is 形容詞 for A to do「Aが〜するのは…だ」。for Aが意味上の主語。", "relatedInfo": "人の性質を表す形容詞(kind, foolish等)はfor→ofになる。"}, {"id": 38, "type": "reorder", "category": "不定詞", "hint": "彼は病気であるらしい", "tokens": ["He", "seems", "to", "be", "ill."], "fullSentence": "He seems to be ill.", "source": "IMG_0703", "explanation": "seem to be「〜であるらしい」。", "relatedInfo": "= It seems that he is ill."}, {"id": 39, "type": "reorder", "category": "不定詞", "hint": "彼が来ることを当然だと思っている", "tokens": ["I", "take", "it", "for", "granted", "that", "he", "will", "come."], "fullSentence": "I take it for granted that he will come.", "source": "IMG_0703", "explanation": "take it for granted that S V「〜を当然のことと思う」itは形式目的語。", "relatedInfo": "= assume that S V"}, {"id": 40, "type": "reorder", "category": "助動詞", "hint": "この車は高すぎて私には買えない", "tokens": ["This", "car", "is", "too", "expensive", "for", "me", "to", "buy."], "fullSentence": "This car is too expensive for me to buy.", "source": "IMG_0699", "explanation": "too 形容詞 for A to do「Aが〜するには…すぎる」。", "relatedInfo": "= This car is so expensive that I cannot buy it."}, {"id": 41, "type": "reorder", "category": "接続詞", "hint": "彼は寝坊して始発電車に乗り遅れるほどぐっすり眠った", "tokens": ["He", "overslept", "so", "that", "he", "missed", "the", "first", "train."], "fullSentence": "He overslept so that he missed the first train.", "source": "IMG_0721", "explanation": "so that は「その結果〜」という結果を表す用法もある。", "relatedInfo": "文脈により「目的」か「結果」かを判断する。"}, {"id": 42, "type": "reorder", "category": "接続詞", "hint": "雨が降るといけないので傘を持って行きなさい", "tokens": ["Take", "an", "umbrella", "in", "case", "it", "should", "rain."], "fullSentence": "Take an umbrella in case it should rain.", "source": "IMG_0721", "explanation": "in case S V「〜するといけないので、〜する場合に備えて」。", "relatedInfo": "in caseはアメリカ英語で「もし〜なら」の意味でも使われる。"}, {"id": 43, "type": "reorder", "category": "比較(原級as~as)", "hint": "このバッグは私が今まで見た中でどれにも劣らず良い", "tokens": ["This", "bag", "is", "as", "good", "as", "any", "I", "have", "ever", "seen."], "fullSentence": "This bag is as good as any I have ever seen.", "source": "IMG_0710", "explanation": "as+原級+as any「どの〜にも劣らず」。", "relatedInfo": "This bag is as good as any bag I have ever had.とも表現できる。"}, {"id": 44, "type": "reorder", "category": "比較(原級as~as)", "hint": "彼女はBほど多くのお金を持っていない", "tokens": ["She", "does", "not", "have", "as", "much", "money", "as", "B", "has."], "fullSentence": "She does not have as much money as B has.", "source": "IMG_0710", "explanation": "not as[so] 原級 as「〜ほど…ではない」。", "relatedInfo": "= She has less money than B."}, {"id": 45, "type": "reorder", "category": "比較(原級as~as)", "hint": "この問題はあの問題ほど簡単ではない", "tokens": ["This", "problem", "is", "not", "as", "easy", "as", "that", "one."], "fullSentence": "This problem is not as easy as that one.", "source": "IMG_0710", "explanation": "not as 原級 as「〜ほど…でない」。", "relatedInfo": "= This problem is more difficult than that one."}, {"id": 46, "type": "reorder", "category": "比較(原級as~as)", "hint": "彼女は歌手というよりむしろ作詞家だ", "tokens": ["She", "is", "not", "so", "much", "a", "singer", "as", "a", "songwriter."], "fullSentence": "She is not so much a singer as a songwriter.", "source": "IMG_0710", "explanation": "not so much A as B「AというよりむしろB」。", "relatedInfo": "= B rather than A"}, {"id": 47, "type": "reorder", "category": "比較(原級as~as)", "hint": "この湖は美しいというよりむしろ神秘的だ", "tokens": ["This", "lake", "is", "not", "so", "much", "beautiful", "as", "mysterious."], "fullSentence": "This lake is not so much beautiful as mysterious.", "source": "IMG_0710", "explanation": "not so much A as B「AというよりむしろB」形容詞にも使える。", "relatedInfo": "without so much as doing「〜さえしないで」との混同に注意。"}, {"id": 48, "type": "reorder", "category": "比較(原級as~as)", "hint": "この本はあの本の2倍長い", "tokens": ["This", "book", "is", "twice", "as", "long", "as", "that", "one."], "fullSentence": "This book is twice as long as that one.", "source": "IMG_0710", "explanation": "倍数+as+原級+as「〜の…倍だ」。", "relatedInfo": "half as long as「半分の長さ」、three times as long as「3倍の長さ」"}, {"id": 49, "type": "reorder", "category": "比較(原級as~as)", "hint": "彼女は私が持っている本の2倍の数を持っている", "tokens": ["She", "has", "twice", "as", "many", "books", "as", "I", "have."], "fullSentence": "She has twice as many books as I have.", "source": "IMG_0710", "explanation": "倍数+as+many+名詞+as「〜の…倍多くの」。", "relatedInfo": "数えられない名詞ならtwice as much。"}, {"id": 50, "type": "reorder", "category": "比較(比較級・最上級)", "hint": "私は紅茶よりコーヒーの方が好きだ", "tokens": ["I", "prefer", "coffee", "to", "tea."], "fullSentence": "I prefer coffee to tea.", "source": "IMG_0712", "explanation": "prefer A to B「BよりAを好む」。thanではなくtoを使う点に注意。", "relatedInfo": "prefer to do rather than do も類義表現。"}, {"id": 51, "type": "reorder", "category": "比較(比較級・最上級)", "hint": "彼はそんな見知らぬ人を信用するほど愚かではない", "tokens": ["He", "knows", "better", "than", "to", "trust", "such", "a", "stranger."], "fullSentence": "He knows better than to trust such a stranger.", "source": "IMG_0712", "explanation": "know better than to do「〜するほど愚かではない」。", "relatedInfo": "= He is not so foolish as to trust such a stranger."}, {"id": 52, "type": "reorder", "category": "比較(比較級・最上級)", "hint": "これは全ての中で断然一番面白い", "tokens": ["This", "is", "by", "far", "the", "most", "interesting", "of", "all."], "fullSentence": "This is by far the most interesting of all.", "source": "IMG_0712", "explanation": "最上級の強調はby far, muchなど。veryはthe very+最上級の形で使う。", "relatedInfo": "= the very most interesting とは言わず the very+最上級で使う場合はthe very best のように。"}, {"id": 53, "type": "reorder", "category": "最上級相当表現", "hint": "彼はクラスの他の誰よりも背が高い", "tokens": ["He", "is", "taller", "than", "anyone", "else", "in", "his", "class."], "fullSentence": "He is taller than anyone else in his class.", "source": "IMG_0713", "explanation": "比較級+than anyone else「他の誰よりも〜」最上級相当表現。", "relatedInfo": "= He is the tallest in his class."}, {"id": 54, "type": "reorder", "category": "最上級相当表現", "hint": "富士山は日本の他のどの山よりも高い", "tokens": ["Mt.", "Fuji", "is", "higher", "than", "any", "other", "mountain", "in", "Japan."], "fullSentence": "Mt. Fuji is higher than any other mountain in Japan.", "source": "IMG_0713", "explanation": "比較級+than any other+単数名詞「他のどの〜よりも」最上級相当表現。", "relatedInfo": "= No other mountain in Japan is higher than Mt. Fuji."}, {"id": 55, "type": "reorder", "category": "最上級相当表現", "hint": "商売にかけては彼は誰にも劣らない", "tokens": ["He", "is", "second", "to", "none", "when", "it", "comes", "to", "doing", "business."], "fullSentence": "He is second to none when it comes to doing business.", "source": "IMG_0713", "explanation": "second to none「誰にも劣らない、一番だ」。", "relatedInfo": "when it comes to doing「〜することにかけては」"}, {"id": 56, "type": "reorder", "category": "最上級相当表現", "hint": "彼女は美しいというよりむしろ知的だ", "tokens": ["She", "is", "not", "so", "much", "beautiful", "as", "intelligent."], "fullSentence": "She is not so much beautiful as intelligent.", "source": "IMG_0713", "explanation": "not so much A as B「AというよりむしろB」の反復練習。", "relatedInfo": "= She is intelligent rather than beautiful."}, {"id": 57, "type": "reorder", "category": "比較(no more/no less)", "hint": "お金は愛と同様に幸せな結婚に必要である(思っている以上に)", "tokens": ["Money", "is", "no", "less", "necessary", "for", "happy", "marriage", "than", "love", "is."], "fullSentence": "Money is no less necessary for happy marriage than love is.", "source": "IMG_0711", "explanation": "no less A than B「Bと同様にAだ」。Bに劣らずAという肯定的比較。", "relatedInfo": "no more A than B「BでないのとちょうどAでない」の反対の意味。"}, {"id": 58, "type": "reorder", "category": "比較(no more/no less)", "hint": "このチンパンジーは赤ちゃんと同様しゃべれない", "tokens": ["This", "chimpanzee", "can", "no", "more", "speak", "than", "a", "baby", "can."], "fullSentence": "This chimpanzee can no more speak than a baby can.", "source": "IMG_0711", "explanation": "can no more do than「〜できないのは…同様だ」。", "relatedInfo": "than以下は比較対象で「できない」ことが前提。"}, {"id": 59, "type": "reorder", "category": "比較(no more/no less)", "hint": "お金は私たちが思うより必要でないわけではない", "tokens": ["Money", "is", "no", "less", "necessary", "than", "we", "expect."], "fullSentence": "Money is no less necessary than we expect.", "source": "IMG_0711", "explanation": "no less〜than「〜と同じくらい」肯定的な同等比較。", "relatedInfo": "= Money is just as necessary as we expect."}, {"id": 60, "type": "reorder", "category": "比較(no more/no less)", "hint": "彼の銀行口座には少なくとも1000ドルある", "tokens": ["He", "has", "not", "less", "than", "$1000", "in", "his", "bank", "account."], "fullSentence": "He has not less than $1000 in his bank account.", "source": "IMG_0711", "explanation": "not less than「少なくとも」= at least。", "relatedInfo": "not more than「多くとも」= at most"}, {"id": 61, "type": "reorder", "category": "比較(比較級・最上級)", "hint": "これは2冊のうちより面白い方の本だ", "tokens": ["This", "is", "the", "more", "interesting", "of", "the", "two", "books."], "fullSentence": "This is the more interesting of the two books.", "source": "IMG_0712", "explanation": "the+比較級+of the two「2つのうちより〜な方」。", "relatedInfo": "of the twoがつくと比較級にtheが必要。"}, {"id": 62, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "私は車を持っていないが、兄は(1台)持っている(不特定・同種)", "tokens": ["I", "don't", "have", "a", "car,", "but", "my", "brother", "has", "one."], "fullSentence": "I don't have a car, but my brother has one.", "source": "IMG_0714", "explanation": "oneは不特定の可算名詞の代用(a+単数名詞)。", "relatedInfo": "itは同一のものを指す/thatは特定・既出の名詞の代用。"}, {"id": 63, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "この学校の規則はあの学校の規則より厳しい", "tokens": ["The", "rules", "of", "this", "school", "are", "stricter", "than", "those", "of", "that", "school."], "fullSentence": "The rules of this school are stricter than those of that school.", "source": "IMG_0714", "explanation": "thoseは前出の複数名詞(the rules)の反復を避ける代用。", "relatedInfo": "= the rules of that school"}, {"id": 64, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "彼を知っている人はそのような人々は彼を尊敬する", "tokens": ["Such", "as", "know", "him", "respect", "him."], "fullSentence": "Such as know him respect him.", "source": "IMG_0714", "explanation": "such as「〜のような人々」関係代名詞的用法のas。", "relatedInfo": "such 名詞 as「〜のような…」の形も頻出。"}, {"id": 65, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "それは私たちにとって非常に重要な問題だ", "tokens": ["It", "is", "a", "matter", "of", "great", "importance", "to", "us."], "fullSentence": "It is a matter of great importance to us.", "source": "IMG_0714", "explanation": "itは前文全体の内容や状況を指す用法もある。", "relatedInfo": "形式主語のit、状況のitなど複数の用法がある。"}, {"id": 66, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "犬を2匹飼っている。一方は白でもう一方は黒だ", "tokens": ["I", "have", "two", "dogs;", "one", "is", "white", "and", "the", "other", "is", "black."], "fullSentence": "I have two dogs; one is white and the other is black.", "source": "IMG_0715", "explanation": "2つのうち「一方はone、もう一方はthe other」。", "relatedInfo": "3つ以上ならone, another, the other(最後の一つ)。"}, {"id": 67, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "コーヒーが好きな人もいれば、紅茶が好きな人もいる", "tokens": ["Some", "like", "coffee,", "and", "others", "like", "tea."], "fullSentence": "Some like coffee, and others like tea.", "source": "IMG_0715", "explanation": "Some〜, others…「〜する人もいれば…する人もいる」不特定の対比。", "relatedInfo": "Some〜, and the others…なら「残り全員」の意味になる。"}, {"id": 68, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "知っていることと教えることは別のことだ", "tokens": ["To", "know", "is", "one", "thing,", "and", "to", "teach", "is", "another."], "fullSentence": "To know is one thing, and to teach is another.", "source": "IMG_0715", "explanation": "A is one thing, and B is another「AとBは別のことだ」。", "relatedInfo": "知識と実践は異なるという定番表現。"}, {"id": 69, "type": "reorder", "category": "代名詞(one/that/other等)", "hint": "その店は1日おきに開いている", "tokens": ["The", "store", "is", "open", "every", "other", "day."], "fullSentence": "The store is open every other day.", "source": "IMG_0715", "explanation": "every other day「1日おきに」。", "relatedInfo": "every third day「3日ごとに」のように数詞も入る。"}, {"id": 70, "type": "reorder", "category": "関係詞", "hint": "彼女には髪がとても長い娘がいる", "tokens": ["She", "has", "a", "daughter", "whose", "hair", "is", "very", "long."], "fullSentence": "She has a daughter whose hair is very long.", "source": "IMG_0717", "explanation": "所有格の関係代名詞whose。先行詞が人でも物でも使える。", "relatedInfo": "the roof of which is painted yellow = whose roof is painted yellow"}, {"id": 71, "type": "reorder", "category": "関係詞", "hint": "そういうわけで彼は医者になった(理由)", "tokens": ["That", "is", "why", "he", "became", "a", "doctor."], "fullSentence": "That is why he became a doctor.", "source": "IMG_0717", "explanation": "関係副詞why「〜する理由」the reason whyの省略形。", "relatedInfo": "That is because he studied hard.「それは彼が一生懸命勉強したからだ」との違いに注意。"}, {"id": 72, "type": "reorder", "category": "関係詞", "hint": "彼女には賢い息子がいて、その息子を誇りに思っている", "tokens": ["She", "has", "a", "clever", "son,", "of", "whom", "she", "is", "proud."], "fullSentence": "She has a clever son, of whom she is proud.", "source": "IMG_0717", "explanation": "前置詞+関係代名詞(of whom)。継続用法(, whom)にも注意。", "relatedInfo": "= She has a clever son, and she is proud of him."}, {"id": 73, "type": "reorder", "category": "関係詞", "hint": "弱点を持たない人はいない", "tokens": ["There", "is", "no", "one", "that", "has", "not", "weaknesses."], "fullSentence": "There is no one that has not weaknesses.", "source": "IMG_0717", "explanation": "no one ... that not「〜しない人はいない」二重否定の関係代名詞。", "relatedInfo": "先行詞がno one, all, everythingなどのときthatが好まれる。"}, {"id": 74, "type": "reorder", "category": "関係詞", "hint": "彼は父親のようには詩人ではない(比較のas)", "tokens": ["He", "is", "not", "a", "poet,", "as", "his", "father", "was."], "fullSentence": "He is not a poet, as his father was.", "source": "IMG_0717", "explanation": "as「〜であるように」比較・様態の接続詞的関係詞的用法。", "relatedInfo": "文脈でasは「〜のように」の意味で使われる。"}, {"id": 75, "type": "reorder", "category": "関係詞", "hint": "お金を欲しがらない人はいない", "tokens": ["There", "is", "no", "one", "but", "wants", "money."], "fullSentence": "There is no one but wants money.", "source": "IMG_0717", "explanation": "no one but「〜しない人はいない」butが関係代名詞的にthat...notの意味を持つ。", "relatedInfo": "= There is no one that does not want money."}, {"id": 76, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "あなたが何を言おうとも、私は考えを変えない", "tokens": ["Whatever", "you", "may", "say,", "I", "will", "not", "change", "my", "mind."], "fullSentence": "Whatever you may say, I will not change my mind.", "source": "IMG_0719", "explanation": "Whatever S may V「たとえ何を〜しようとも」譲歩用法。= no matter what。", "relatedInfo": "mayは省略されることも多い。"}, {"id": 77, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "どんなに疲れていても、彼は働き続けた", "tokens": ["However", "tired", "he", "was,", "he", "kept", "working."], "fullSentence": "However tired he was, he kept working.", "source": "IMG_0719", "explanation": "However+形容詞/副詞+S+V「どんなに〜でも」譲歩用法。", "relatedInfo": "= No matter how tired he was"}, {"id": 78, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "いつあなたが来ても、歓迎します", "tokens": ["Whenever", "you", "come,", "you", "are", "welcome."], "fullSentence": "Whenever you come, you are welcome.", "source": "IMG_0719", "explanation": "Whenever S V「いつ〜しようとも」譲歩用法。", "relatedInfo": "= No matter when you come"}, {"id": 79, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "私は助言をされ、それに私は従った", "tokens": ["I", "was", "told", "advice,", "which", "I", "followed."], "fullSentence": "I was told advice, which I followed.", "source": "IMG_0719", "explanation": "継続用法のwhichで前出の名詞を受ける。", "relatedInfo": "関係代名詞の非制限用法は「そしてそれを」と訳すと分かりやすい。"}, {"id": 80, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "AがそうするかどうかがCの問題だった(whether)", "tokens": ["Whether", "A", "does", "so", "was", "the", "question."], "fullSentence": "Whether A does so was the question.", "source": "IMG_0719", "explanation": "Whether S V「〜かどうか」名詞節を導く接続詞。", "relatedInfo": "ifも同義だが主語の位置では使えない。"}, {"id": 81, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "いつでも好きな時に、好きな場所で", "tokens": ["Whenever", "you", "like,", "wherever", "you", "like."], "fullSentence": "Whenever you like, wherever you like.", "source": "IMG_0719", "explanation": "whenever/whereverの並列表現。時と場所を両方自由に選べることを表す。", "relatedInfo": "口語表現として定型化しやすいフレーズ。"}, {"id": 82, "type": "reorder", "category": "接続詞", "hint": "彼が到着するとすぐに会議が始まった", "tokens": ["As", "soon", "as", "he", "arrived,", "the", "meeting", "began."], "fullSentence": "As soon as he arrived, the meeting began.", "source": "IMG_0720", "explanation": "as soon as「〜するとすぐに」= no sooner had S pp than。", "relatedInfo": "= No sooner had he arrived than the meeting began."}, {"id": 83, "type": "reorder", "category": "接続詞", "hint": "彼が何を言おうとも、私は彼を信じない", "tokens": ["Whatever", "he", "says,", "I", "will", "not", "believe", "him."], "fullSentence": "Whatever he says, I will not believe him.", "source": "IMG_0720", "explanation": "譲歩の複合関係代名詞。", "relatedInfo": "= No matter what he says"}, {"id": 84, "type": "reorder", "category": "接続詞", "hint": "宿題を終えるという条件で外出してもよい", "tokens": ["Provided", "that", "you", "finish", "your", "homework,", "you", "can", "go", "out."], "fullSentence": "Provided that you finish your homework, you can go out.", "source": "IMG_0720", "explanation": "provided[providing] (that) S V「〜という条件で」= on condition that。", "relatedInfo": "= on condition that you finish your homework"}, {"id": 85, "type": "reorder", "category": "接続詞", "hint": "彼は金持ちだけれども、幸せではない", "tokens": ["Even", "though", "he", "is", "rich,", "he", "is", "not", "happy."], "fullSentence": "Even though he is rich, he is not happy.", "source": "IMG_0720", "explanation": "even though「〜だけれども」既に事実であることへの譲歩。", "relatedInfo": "even ifとの違い：ifは不確実、thoughは確実な事実。"}, {"id": 86, "type": "reorder", "category": "接続詞", "hint": "彼は到着するとすぐに私に電話した", "tokens": ["The", "moment", "he", "arrived,", "he", "called", "me."], "fullSentence": "The moment he arrived, he called me.", "source": "IMG_0720", "explanation": "the moment (that) S V「〜するとすぐに」= as soon as。", "relatedInfo": "directly, immediatelyも接続詞的に「〜するとすぐに」の意味で使われる(主にイギリス英語)。"}, {"id": 87, "type": "reorder", "category": "複合関係詞(whatever等)", "hint": "周知の通り、太陽は東から昇る", "tokens": ["As", "is", "well", "known,", "the", "sun", "rises", "in", "the", "east."], "fullSentence": "As is well known, the sun rises in the east.", "source": "IMG_0719", "explanation": "As is well known,「周知のように」慣用的な文頭表現。", "relatedInfo": "as everyone knowsも同義。"}, {"id": 88, "type": "reorder", "category": "接続詞", "hint": "私に関する限り、異論はない", "tokens": ["As", "far", "as", "I", "am", "concerned,", "I", "have", "no", "objection."], "fullSentence": "As far as I am concerned, I have no objection.", "source": "IMG_0721", "explanation": "as far as S be concerned「〜に関する限り」。", "relatedInfo": "as far as I know「私の知る限り」との違いに注意(knowは知識の範囲)。"}, {"id": 89, "type": "reorder", "category": "前置詞", "hint": "彼は一生懸命働いたが、一方妹はそうしなかった(対比)", "tokens": ["He", "worked", "hard,", "while", "his", "sister", "did", "not."], "fullSentence": "He worked hard, while his sister did not.", "source": "IMG_0722", "explanation": "whileには「〜する間」の他に「〜する一方で」という対比の意味もある。", "relatedInfo": "whereasも同様の対比を表す接続詞。"}, {"id": 90, "type": "reorder", "category": "接続詞", "hint": "彼は寝坊してしまい、始発電車を逃した", "tokens": ["He", "overslept", "so", "that", "he", "missed", "the", "first", "train."], "fullSentence": "He overslept so that he missed the first train.", "source": "IMG_0721", "explanation": "so that の結果用法の復習。", "relatedInfo": "soとthatの間にコンマがあると結果、ないと目的の意味になりやすい。"}, {"id": 91, "type": "reorder", "category": "接続詞", "hint": "何かの場合に備えて、これが私の電話番号です", "tokens": ["In", "case", "of", "emergency,", "here", "is", "my", "phone", "number."], "fullSentence": "In case of emergency, here is my phone number.", "source": "IMG_0721", "explanation": "in case of+名詞「〜の場合に備えて」。", "relatedInfo": "in case (that) S V「〜する場合に備えて」節でも使える。"}, {"id": 92, "type": "reorder", "category": "前置詞", "hint": "彼はコートをフックにかけた", "tokens": ["He", "hung", "his", "coat", "around", "the", "hook."], "fullSentence": "He hung his coat around the hook.", "source": "IMG_0723", "explanation": "aroundは「〜の周りに」だが、ここでは掛ける動作。文脈から前置詞の基本イメージを確認。", "relatedInfo": "aboutは「〜について/〜の辺りに」漠然とした周辺を表す。"}, {"id": 93, "type": "reorder", "category": "前置詞", "hint": "太陽は地平線の下に沈む", "tokens": ["The", "sun", "sets", "below", "the", "horizon."], "fullSentence": "The sun sets below the horizon.", "source": "IMG_0723", "explanation": "belowは「(基準より)下に」。underは真下・接触的な下を表すのに対しbelowは水平的な下方を表す。", "relatedInfo": "below average「平均以下」below sea level「海面下」"}, {"id": 94, "type": "reorder", "category": "前置詞", "hint": "彼の希望は言葉では言い表せないほどだ", "tokens": ["His", "hope", "is", "beyond", "description."], "fullSentence": "His hope is beyond description.", "source": "IMG_0723", "explanation": "beyond description「言葉で言い表せないほど」。beyondは「〜を超えて」。", "relatedInfo": "beyond belief「信じられないほど」も類似表現。"}, {"id": 95, "type": "reorder", "category": "前置詞", "hint": "彼は悪い習慣を取り除こうとした", "tokens": ["He", "tried", "to", "get", "rid", "of", "his", "bad", "habit."], "fullSentence": "He tried to get rid of his bad habit.", "source": "IMG_0723", "explanation": "get rid of「〜を取り除く」。ofの後ろに除去対象がくる。", "relatedInfo": "make fun of「〜をからかう」も同じof構文。"}, {"id": 96, "type": "reorder", "category": "前置詞", "hint": "芝生に入らないでください", "tokens": ["Keep", "off", "the", "lawn."], "fullSentence": "Keep off the lawn.", "source": "IMG_0723", "explanation": "keep off「〜に近寄らない、入らない」注意書きの定型表現。", "relatedInfo": "be off「(仕事などが)休みである」との違いに注意。"}, {"id": 97, "type": "reorder", "category": "前置詞", "hint": "彼は跳び上がった", "tokens": ["He", "jumped", "to", "his", "feet."], "fullSentence": "He jumped to his feet.", "source": "IMG_0723", "explanation": "jump to one's feet「跳び上がる、さっと立ち上がる」。", "relatedInfo": "face to face「向かい合って」もtoを使う慣用表現。"}, {"id": 98, "type": "reorder", "category": "前置詞", "hint": "彼のお互いに対する態度は冷たかった", "tokens": ["His", "attitude", "toward", "each", "other", "was", "cold."], "fullSentence": "His attitude toward each other was cold.", "source": "IMG_0723", "explanation": "attitude toward「〜に対する態度」。", "relatedInfo": "walk toward each other「お互いに向かって歩く」"}, {"id": 99, "type": "reorder", "category": "前置詞", "hint": "彼は助けを借りながら町を通り抜けた", "tokens": ["He", "walked", "through", "the", "town,", "though", "his", "help."], "fullSentence": "He walked through the town, though his help.", "source": "IMG_0723", "explanation": "through「〜を通り抜けて」。", "relatedInfo": "go through「〜を経験する、通り抜ける」も頻出。"}, {"id": 100, "type": "reorder", "category": "前置詞", "hint": "日本以外にも多くの国に行ったことがある", "tokens": ["I", "have", "been", "to", "a", "lot", "of", "countries", "besides", "Japan."], "fullSentence": "I have been to a lot of countries besides Japan.", "source": "IMG_0724", "explanation": "besides「〜に加えて」付加の意味。", "relatedInfo": "exceptやsave「〜を除いて」とは意味が逆になる点に注意。"}, {"id": 101, "type": "reorder", "category": "前置詞", "hint": "彼はそのお金を3人の間で分けた", "tokens": ["He", "divided", "the", "money", "among", "the", "three", "of", "them."], "fullSentence": "He divided the money among the three of them.", "source": "IMG_0724", "explanation": "among「(3人以上)の間で」。betweenは2者間に使う。", "relatedInfo": "between A and B「AとBの間で」"}, {"id": 102, "type": "reorder", "category": "前置詞", "hint": "それを除けば、すべて順調だ", "tokens": ["Apart", "from", "that,", "everything", "is", "fine."], "fullSentence": "Apart from that, everything is fine.", "source": "IMG_0724", "explanation": "apart from「〜を除いて、〜は別として」。", "relatedInfo": "= aside from that"}, {"id": 103, "type": "reorder", "category": "前置詞", "hint": "彼は木の後ろに倒れた", "tokens": ["He", "fell", "down", "behind", "the", "tree."], "fullSentence": "He fell down behind the tree.", "source": "IMG_0724", "explanation": "behind「〜の後ろに」。", "relatedInfo": "fall behind「遅れをとる」という熟語にも発展する。"}, {"id": 104, "type": "reorder", "category": "前置詞", "hint": "彼は予定より早く着いた", "tokens": ["He", "arrived", "ahead", "of", "schedule."], "fullSentence": "He arrived ahead of schedule.", "source": "IMG_0724", "explanation": "ahead of schedule「予定より早く」。", "relatedInfo": "ahead of one's time「時代に先駆けて」も頻出。"}, {"id": 105, "type": "reorder", "category": "前置詞", "hint": "銀行は郵便局の真向かいにある", "tokens": ["The", "bank", "is", "across", "from", "the", "post", "office."], "fullSentence": "The bank is across from the post office.", "source": "IMG_0724", "explanation": "across from「〜の真向かいに」。", "relatedInfo": "opposite「〜の向かいに」もほぼ同義で使われる。"}, {"id": 106, "type": "reorder", "category": "疑問文の語法", "hint": "ここから駅までどのくらいの距離ですか", "tokens": ["How", "far", "is", "it", "from", "here", "to", "the", "station?"], "fullSentence": "How far is it from here to the station?", "source": "IMG_0725", "explanation": "How far is it from A to B?「AからBまでどのくらいの距離か」。", "relatedInfo": "距離を尋ねる基本表現。"}, {"id": 107, "type": "reorder", "category": "疑問文の語法", "hint": "何がその事故を引き起こしたと思いますか", "tokens": ["What", "do", "you", "think", "caused", "the", "accident?"], "fullSentence": "What do you think caused the accident?", "source": "IMG_0725", "explanation": "Do you think? を挿入した疑問文はWhat do you think S V?の形になる。", "relatedInfo": "疑問詞が主語のときは疑問詞+do you think+動詞の語順。"}, {"id": 108, "type": "reorder", "category": "疑問文の語法", "hint": "今夜映画に行きませんか(勧誘)", "tokens": ["Shall", "we", "go", "to", "the", "movies", "tonight?"], "fullSentence": "Shall we go to the movies tonight?", "source": "IMG_0725", "explanation": "Shall we ~?「〜しませんか」勧誘表現。", "relatedInfo": "Let's ~, shall we? も付加疑問として使われる。"}, {"id": 109, "type": "reorder", "category": "疑問文の語法", "hint": "今日の天気はどうですか", "tokens": ["What", "is", "the", "weather", "like", "today?"], "fullSentence": "What is the weather like today?", "source": "IMG_0725", "explanation": "What is A like?「Aはどのようなものか」様子を尋ねる。", "relatedInfo": "How is the weather?も類似の意味で使われる。"}, {"id": 110, "type": "reorder", "category": "疑問文・強調構文", "hint": "どうしてこんなに遅いんですか(口語)", "tokens": ["How", "come", "you", "are", "so", "late?"], "fullSentence": "How come you are so late?", "source": "IMG_0727", "explanation": "How come S V?「なぜ〜なのか」口語的な理由を尋ねる表現。倒置しない点に注意。", "relatedInfo": "= Why are you so late?(How comeの後は平叙文の語順)"}, {"id": 111, "type": "reorder", "category": "疑問文・強調構文", "hint": "散歩に行きませんか", "tokens": ["Why", "not", "go", "for", "a", "walk?"], "fullSentence": "Why not go for a walk?", "source": "IMG_0727", "explanation": "Why not do?「〜しませんか」提案。主語を省略した口語表現。", "relatedInfo": "= Why don't we go for a walk?"}, {"id": 112, "type": "reorder", "category": "使役・知覚動詞・SVOC", "hint": "夕食に外出するのはどうですか", "tokens": ["What", "do", "you", "say", "to", "going", "out", "for", "dinner?"], "fullSentence": "What do you say to going out for dinner?", "source": "IMG_0705", "explanation": "What do you say to doing?の復習。提案表現。", "relatedInfo": "toの後は動名詞(前置詞のto)。"}, {"id": 113, "type": "reorder", "category": "疑問文・強調構文", "hint": "AかBのどちらかが正しい(動詞はBに一致)", "tokens": ["Either", "A", "or", "B", "is", "right."], "fullSentence": "Either A or B is right.", "source": "IMG_0727", "explanation": "Either A or B「AかBのどちらか」動詞はBの人称・数に一致させる。", "relatedInfo": "Not only A but also B も同様にBに一致。"}, {"id": 114, "type": "reorder", "category": "数量表現(both/half等)", "hint": "A、B、Cのうち多くが今利用可能だ", "tokens": ["Most", "of", "A,", "B,", "or", "C", "is", "available", "now."], "fullSentence": "Most of A, B, or C is available now.", "source": "IMG_0726", "explanation": "most of〜「〜の大部分」ofの後の名詞に動詞を一致させる。", "relatedInfo": "half of, some of, the rest of なども同様のルール。"}, {"id": 115, "type": "reorder", "category": "数量表現(both/half等)", "hint": "学生の数は増加している(the number of)", "tokens": ["The", "number", "of", "students", "is", "increasing."], "fullSentence": "The number of students is increasing.", "source": "IMG_0726", "explanation": "the number of+複数名詞「〜の数」は単数扱い(is)。", "relatedInfo": "a number of+複数名詞「多くの〜」は複数扱い(are)。"}, {"id": 116, "type": "reorder", "category": "否定表現①", "hint": "彼は誠実からは程遠い", "tokens": ["He", "is", "anything", "but", "honest."], "fullSentence": "He is anything but honest.", "source": "IMG_0728", "explanation": "anything but「決して〜ではない」= far from。", "relatedInfo": "nothing but「〜にすぎない」= only"}, {"id": 117, "type": "reorder", "category": "否定表現①", "hint": "その問題はまだ解決されていない", "tokens": ["The", "problem", "has", "yet", "to", "be", "solved."], "fullSentence": "The problem has yet to be solved.", "source": "IMG_0728", "explanation": "have yet to do「まだ〜していない」。", "relatedInfo": "= have not done yet"}, {"id": 118, "type": "reorder", "category": "否定表現①", "hint": "彼は読みきれないほどたくさん漫画本を持っている", "tokens": ["He", "has", "more", "comic", "books", "than", "he", "can", "read."], "fullSentence": "He has more comic books than he can read.", "source": "IMG_0728", "explanation": "more A than S can do「〜しきれないほど多くのA」。", "relatedInfo": "more A than S can V の慣用パターン。"}, {"id": 119, "type": "reorder", "category": "否定表現①", "hint": "彼は話すたびに必ず故郷のことを口にする", "tokens": ["He", "never", "speaks", "but", "he", "mentions", "his", "hometown."], "fullSentence": "He never speaks but he mentions his hometown.", "source": "IMG_0728", "explanation": "never...but「〜すれば必ず…」= wheneverに近い意味。", "relatedInfo": "= He never speaks without mentioning his hometown."}, {"id": 120, "type": "reorder", "category": "否定表現②", "hint": "彼は嘘をつくような人では決してない", "tokens": ["He", "is", "the", "last", "person", "to", "tell", "a", "lie."], "fullSentence": "He is the last person to tell a lie.", "source": "IMG_0730", "explanation": "the last person to do「決して〜しそうにない人」。", "relatedInfo": "= He is not likely to tell a lie at all."}, {"id": 121, "type": "reorder", "category": "否定表現②", "hint": "それを少しも理解できなかった", "tokens": ["I", "did", "not", "understand", "it", "in", "the", "least."], "fullSentence": "I did not understand it in the least.", "source": "IMG_0730", "explanation": "not...in the least「少しも〜ない」強い否定。", "relatedInfo": "= not at all"}, {"id": 122, "type": "reorder", "category": "否定表現②", "hint": "どんな意味においてもそれは時間の無駄ではない", "tokens": ["In", "no", "sense", "is", "it", "a", "waste", "of", "time."], "fullSentence": "In no sense is it a waste of time.", "source": "IMG_0730", "explanation": "In no sense「どんな意味でも〜ない」否定語句が文頭に来ると倒置が起こる。", "relatedInfo": "倒置：In no sense is it...のようにbe動詞と主語が入れ替わる。"}, {"id": 123, "type": "reorder", "category": "否定表現②", "hint": "彼は自分の行動に対して何の言い訳もない", "tokens": ["He", "has", "no", "excuse", "whatsoever", "for", "his", "actions."], "fullSentence": "He has no excuse whatsoever for his actions.", "source": "IMG_0730", "explanation": "no+名詞+whatsoever「全く〜ない」強調の否定。", "relatedInfo": "whatsoeverはwhateverの強調形。"}, {"id": 124, "type": "reorder", "category": "否定表現①", "hint": "明日何が起こるか誰にも分からない", "tokens": ["Nobody", "knows", "what", "will", "happen", "tomorrow."], "fullSentence": "Nobody knows what will happen tomorrow.", "source": "IMG_0728", "explanation": "Nobody knows〜「誰も知らない」= No one knows〜。", "relatedInfo": "= Who knows what will happen tomorrow?(修辞疑問文)"}, {"id": 125, "type": "reorder", "category": "前置詞", "hint": "何が起ころうと構わない", "tokens": ["It", "doesn't", "matter", "what", "happens."], "fullSentence": "It doesn't matter what happens.", "source": "IMG_0722", "explanation": "It doesn't matter wh-節「〜かは重要ではない」。", "relatedInfo": "It makes no difference wh-節 も同義。"}, {"id": 126, "type": "reorder", "category": "話法・時制の一致", "hint": "彼は翌日そこへ行くつもりだと言った(時制の一致・指示語変化)", "tokens": ["He", "said", "that", "he", "would", "go", "there", "the", "next", "day."], "fullSentence": "He said that he would go there the next day.", "source": "IMG_0729", "explanation": "間接話法では時制の一致でwillはwouldになり、tomorrowはthe next dayに変わる。", "relatedInfo": "today→that day, yesterday→the day before, ago→before"}, {"id": 127, "type": "reorder", "category": "話法・時制の一致", "hint": "彼は翌週彼女を訪ねると言った", "tokens": ["He", "said", "he", "would", "visit", "her", "the", "following", "week."], "fullSentence": "He said he would visit her the following week.", "source": "IMG_0729", "explanation": "間接話法でnext weekはthe following week(the next week)に変わる。", "relatedInfo": "last week→the week before / the previous week"}, {"id": 128, "type": "reorder", "category": "否定表現①", "hint": "彼はどこへ行くのか私に尋ねた(間接疑問)", "tokens": ["He", "asked", "me", "where", "I", "was", "going."], "fullSentence": "He asked me where I was going.", "source": "IMG_0728", "explanation": "ask+人+wh-節「〜かを尋ねる」間接疑問文は平叙文の語順。", "relatedInfo": "疑問詞のない疑問文はif/whetherを使う。"}, {"id": 129, "type": "reorder", "category": "wonder/consist of等の語法", "hint": "彼がパーティーに来るかどうかと思う", "tokens": ["I", "wonder", "if", "he", "will", "come", "to", "the", "party."], "fullSentence": "I wonder if he will come to the party.", "source": "IMG_0738", "explanation": "wonder if S V「〜かどうかと思う」丁寧な疑問表現。", "relatedInfo": "I wonder whether S V も同義。"}, {"id": 130, "type": "reorder", "category": "wonder/consist of等の語法", "hint": "図書館では静かにすることになっている", "tokens": ["You", "are", "supposed", "to", "be", "quiet", "in", "the", "library."], "fullSentence": "You are supposed to be quiet in the library.", "source": "IMG_0738", "explanation": "be supposed to do「〜することになっている」規則・義務。", "relatedInfo": "You are not supposed to do that.「それをしてはいけないことになっている」"}, {"id": 131, "type": "reorder", "category": "wonder/consist of等の語法", "hint": "そのチームは10人の選手から成る(comprise)", "tokens": ["The", "team", "comprises", "ten", "players."], "fullSentence": "The team comprises ten players.", "source": "IMG_0738", "explanation": "comprise「〜から成る」他動詞なので直接目的語をとる。", "relatedInfo": "= is comprised of ten players(受動態も可能)"}, {"id": 132, "type": "reorder", "category": "wonder/consist of等の語法", "hint": "その値段には税金が含まれている", "tokens": ["The", "price", "includes", "tax."], "fullSentence": "The price includes tax.", "source": "IMG_0738", "explanation": "include「〜を含む」直接目的語をとる他動詞。", "relatedInfo": "contain「(中に)〜を含む」も類義だが物理的内包を表すことが多い。"}, {"id": 133, "type": "reorder", "category": "wonder/consist of等の語法", "hint": "彼は私たちの高校にすごい野球チームを作り上げた", "tokens": ["He", "set", "up", "a", "great", "baseball", "team", "on", "our", "high", "school."], "fullSentence": "He set up a great baseball team on our high school.", "source": "IMG_0738", "explanation": "set up「〜を設立する」。", "relatedInfo": "文脈により建てる・確立するの意味で使われる。"}, {"id": 134, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "窓を開けていただけませんか", "tokens": ["Would", "you", "mind", "opening", "the", "window?"], "fullSentence": "Would you mind opening the window?", "source": "IMG_0731", "explanation": "mind doing「〜するのを嫌がる」Would you mind doing?で丁寧な依頼になる。", "relatedInfo": "答え方はNo(構いません)/ I'm afraid I would(困ります)。"}, {"id": 135, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "彼はそのお金を盗んだことを否定した", "tokens": ["He", "denied", "stealing", "the", "money."], "fullSentence": "He denied stealing the money.", "source": "IMG_0731", "explanation": "deny doing「〜したことを否定する」。", "relatedInfo": "admit doing「〜したことを認める」も同型。"}, {"id": 136, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "若い頃パリに住んでいたことを懐かしく思う", "tokens": ["I", "miss", "living", "in", "Paris", "when", "I", "was", "young."], "fullSentence": "I miss living in Paris when I was young.", "source": "IMG_0731", "explanation": "miss doing「〜したことを懐かしく思う、〜し損なう」文脈により意味が変わる。", "relatedInfo": "miss doing「〜しそこなう」の意味もある(miss the train seeing等)。"}, {"id": 137, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "彼は来年海外へ行くことを決めた", "tokens": ["He", "decided", "to", "go", "abroad", "next", "year."], "fullSentence": "He decided to go abroad next year.", "source": "IMG_0731", "explanation": "decide to do「〜することを決める」不定詞のみをとる動詞。", "relatedInfo": "want, hope, promise, expect, wish, refuseなども不定詞のみをとる。"}, {"id": 138, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "MegafepsグループはM(mind)E(enjoy)G(give up)A(avoid)F(finish)E(escape)P(postpone)S(stop/suggest)+動名詞をとる代表動詞群", "tokens": ["He", "suggested", "going", "to", "the", "movies."], "fullSentence": "He suggested going to the movies.", "source": "IMG_0732", "explanation": "Megafeps動詞は動名詞のみを目的語にとる(mind, enjoy, give up, avoid, finish, escape, postpone, stop, suggest等)。", "relatedInfo": "want, expect, decide, hope, promiseなどは不定詞のみをとるグループ。"}, {"id": 139, "type": "reorder", "category": "動名詞・不定詞をとる動詞", "hint": "彼は泣き始めた(begin+to doもdoingも可)", "tokens": ["He", "began", "crying."], "fullSentence": "He began crying.", "source": "IMG_0732", "explanation": "begin, start, continue, ceaseは不定詞・動名詞どちらも目的語にとれる。", "relatedInfo": "意味の違いはほとんどないが、状態動詞の場合は不定詞が好まれる。"}, {"id": 140, "type": "reorder", "category": "使役的SVOC・that S should V", "hint": "彼の両親は彼が海外に行くことを許した", "tokens": ["His", "parents", "allowed", "him", "to", "go", "abroad."], "fullSentence": "His parents allowed him to go abroad.", "source": "IMG_0733", "explanation": "allow+O+to do「Oが〜するのを許す」SVOC不定詞パターン。", "relatedInfo": "enable, cause, encourage, compel, force, expect, invite, oblige, permit, remind, require, wantなども同型。"}, {"id": 141, "type": "reorder", "category": "使役的SVOC・that S should V", "hint": "何が彼の考えを変えさせたのか(原形不定詞)", "tokens": ["What", "made", "him", "change", "his", "mind?"], "fullSentence": "What made him change his mind?", "source": "IMG_0733", "explanation": "make+O+原形「Oに〜させる」使役動詞。", "relatedInfo": "= What caused him to change his mind?"}, {"id": 142, "type": "reorder", "category": "使役的SVOC・that S should V", "hint": "彼は私にドアの鍵を閉めるよう念を押した", "tokens": ["He", "reminded", "me", "to", "lock", "the", "door."], "fullSentence": "He reminded me to lock the door.", "source": "IMG_0733", "explanation": "remind+O+to do「Oに〜するよう念を押す」。", "relatedInfo": "remind A of B「AにBを思い出させる」との違いに注意。"}, {"id": 143, "type": "reorder", "category": "使役的SVOC・that S should V", "hint": "彼は彼女がその会議に出席すべきだと主張した", "tokens": ["He", "insisted", "that", "she", "be", "present", "at", "the", "meeting."], "fullSentence": "He insisted that she be present at the meeting.", "source": "IMG_0733", "explanation": "insist that S (should) V「〜すべきだと主張する」要求・提案系動詞の後は動詞の原形(should省略可)。", "relatedInfo": "propose, demand, suggest, order, require, requestなども同型。"}, {"id": 144, "type": "reorder", "category": "使役的SVOC・that S should V", "hint": "彼はもっと勉強する必要がある", "tokens": ["It", "is", "necessary", "that", "he", "should", "study", "harder."], "fullSentence": "It is necessary that he should study harder.", "source": "IMG_0733", "explanation": "It is necessary that S (should) V「〜する必要がある」。necessary, important, essential, vital, critical, crucialなどの形容詞の後も同型。", "relatedInfo": "= It is necessary for him to study harder."}, {"id": 145, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼女はその知らせを聞いて青ざめた", "tokens": ["She", "turned", "pale", "when", "she", "heard", "the", "news."], "fullSentence": "She turned pale when she heard the news.", "source": "IMG_0734", "explanation": "turn+C「〜になる」変化を表すSVC動詞。", "relatedInfo": "go, become, get, come, growなども変化を表す。"}, {"id": 146, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼はいつか偉大な医者になるだろう", "tokens": ["He", "will", "become", "a", "great", "doctor", "someday."], "fullSentence": "He will become a great doctor someday.", "source": "IMG_0734", "explanation": "become+C「〜になる」。", "relatedInfo": "名詞のCをとるのはbecome, remain, get(getは形容詞が多い)。"}, {"id": 147, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼は外見が母親に似ている", "tokens": ["He", "resembles", "his", "mother", "in", "appearance."], "fullSentence": "He resembles his mother in appearance.", "source": "IMG_0734", "explanation": "resemble「〜に似ている」他動詞で受動態にしにくい状態動詞。", "relatedInfo": "take after A「(性質が)Aに似ている」も類義。"}, {"id": 148, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "この問題については誰にも言及しないでください", "tokens": ["Please", "don't", "mention", "this", "problem", "to", "anyone."], "fullSentence": "Please don't mention this problem to anyone.", "source": "IMG_0734", "explanation": "mention「〜について言及する」他動詞でaboutは不要。", "relatedInfo": "mention A to B「BにAについて話す」"}, {"id": 149, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼は昨日その会議に出席した", "tokens": ["He", "attended", "the", "meeting", "yesterday."], "fullSentence": "He attended the meeting yesterday.", "source": "IMG_0734", "explanation": "attend「〜に出席する」他動詞。attend toは「〜に対応する、世話をする」と別の意味になる。", "relatedInfo": "attend to A「Aの世話をする、Aに注意を払う」"}, {"id": 150, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼は兄の助言に反対した", "tokens": ["He", "argued", "with", "his", "brother's", "advice."], "fullSentence": "He argued with his brother's advice.", "source": "IMG_0734", "explanation": "argue with A about B「AとBについて議論する」動詞パターン確認。", "relatedInfo": "argue against「〜に反対して議論する」"}, {"id": 151, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "彼は彼女を説得して来させることに成功した", "tokens": ["He", "succeeded", "in", "persuading", "her", "to", "come."], "fullSentence": "He succeeded in persuading her to come.", "source": "IMG_0734", "explanation": "succeed in doing「〜することに成功する」。", "relatedInfo": "succeed to「(地位など)を継承する」と混同しないよう注意。"}, {"id": 152, "type": "reorder", "category": "自動詞・他動詞の語法", "hint": "ここから駅にどう行けばいいですか", "tokens": ["How", "can", "I", "get", "to", "the", "station", "from", "here?"], "fullSentence": "How can I get to the station from here?", "source": "IMG_0734", "explanation": "get to「〜に着く」自動詞句。", "relatedInfo": "reach「〜に着く」は他動詞で前置詞不要という違いに注意。"}, {"id": 153, "type": "reorder", "category": "不規則変化・SVOO", "hint": "彼女はその本をテーブルの上に置いた(他動詞lay)", "tokens": ["She", "laid", "the", "book", "on", "the", "table."], "fullSentence": "She laid the book on the table.", "source": "IMG_0735", "explanation": "lay「〜を置く」他動詞(lay-laid-laid)。lie「横たわる」自動詞(lie-lay-lain)と混同しやすい。", "relatedInfo": "He lay on the bed.(自動詞lieの過去形)"}, {"id": 154, "type": "reorder", "category": "不規則変化・SVOO", "hint": "お願いを一つ聞いてもらえますか", "tokens": ["Will", "you", "do", "me", "a", "favor?"], "fullSentence": "Will you do me a favor?", "source": "IMG_0735", "explanation": "do A a favor「Aの頼みを聞く」= do a favor for A。", "relatedInfo": "May I ask a favor of you? も類義表現。"}, {"id": 155, "type": "reorder", "category": "不規則変化・SVOO", "hint": "宿題を終えるのに2時間かかった", "tokens": ["It", "took", "me", "two", "hours", "to", "finish", "the", "homework."], "fullSentence": "It took me two hours to finish the homework.", "source": "IMG_0735", "explanation": "It takes A+時間+to do「Aが〜するのに(時間)がかかる」。", "relatedInfo": "costは金銭、takeは時間・労力に使う。"}, {"id": 156, "type": "reorder", "category": "不規則変化・SVOO", "hint": "それは私たちの多くの手間を省いてくれるだろう", "tokens": ["That", "will", "save", "us", "a", "lot", "of", "trouble."], "fullSentence": "That will save us a lot of trouble.", "source": "IMG_0735", "explanation": "save A B「AのBを省く、AにBを節約させる」。", "relatedInfo": "spare A B も同義で「AにBを割く/省かせる」。"}, {"id": 157, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "泥棒は彼から財布を奪った", "tokens": ["The", "thief", "robbed", "him", "of", "his", "wallet."], "fullSentence": "The thief robbed him of his wallet.", "source": "IMG_0736", "explanation": "rob A of B「AからBを奪う」。steal Bとの語法の違いに注意(steal+物、rob+人)。", "relatedInfo": "= steal his wallet from him"}, {"id": 158, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "この歌は私に子供時代を思い出させる", "tokens": ["This", "song", "reminds", "me", "of", "my", "childhood."], "fullSentence": "This song reminds me of my childhood.", "source": "IMG_0736", "explanation": "remind A of B「AにBを思い出させる」。", "relatedInfo": "remind A to do「Aに〜するよう念を押す」との違いに注意。"}, {"id": 159, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "その規則は生徒が授業中スマホを使うのを禁じている", "tokens": ["The", "rule", "prohibits", "students", "from", "using", "smartphones", "in", "class."], "fullSentence": "The rule prohibits students from using smartphones in class.", "source": "IMG_0736", "explanation": "prohibit A from doing「Aが〜するのを禁止する」。", "relatedInfo": "= forbid A to do(forbidはto不定詞をとる点に注意)"}, {"id": 160, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "その会社は従業員に健康保険を提供している", "tokens": ["The", "company", "provides", "its", "employees", "with", "health", "insurance."], "fullSentence": "The company provides its employees with health insurance.", "source": "IMG_0736", "explanation": "provide A with B「AにBを提供する」SV A with B型動詞。", "relatedInfo": "= provide B for A(順番を入れ替えることも可能)"}, {"id": 161, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "彼はコピーを原本と比較した", "tokens": ["He", "compared", "the", "copy", "with", "the", "original."], "fullSentence": "He compared the copy with the original.", "source": "IMG_0736", "explanation": "compare A with B「AをBと比較する」。", "relatedInfo": "compare A to B「AをBに例える」と意味が異なる点に注意。"}, {"id": 162, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "彼は昼食をクラスメートと分け合った", "tokens": ["He", "shared", "his", "lunch", "with", "his", "classmates."], "fullSentence": "He shared his lunch with his classmates.", "source": "IMG_0736", "explanation": "share A with B「AをBと共有する」。", "relatedInfo": "share the same idea with A も頻出パターン。"}, {"id": 163, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "彼はその男に将来の計画を説明した", "tokens": ["He", "explained", "his", "plans", "for", "the", "future", "to", "the", "man."], "fullSentence": "He explained his plans for the future to the man.", "source": "IMG_0737", "explanation": "explain A to B の語順、explain B Aとは言わない(explainはSVOOをとらない)。", "relatedInfo": "tell, show, give等はSVOOをとるがexplain, describe, suggest, announceはSVOOをとらない。"}, {"id": 164, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "彼は遅刻したことで私を非難した", "tokens": ["He", "blamed", "me", "for", "being", "late."], "fullSentence": "He blamed me for being late.", "source": "IMG_0737", "explanation": "blame A for B「BのことでAを非難する」SV A for B型動詞。", "relatedInfo": "= blame B on A(逆の語順の表現)"}, {"id": 165, "type": "reorder", "category": "動詞+前置詞パターン", "hint": "あなたの親切に感謝します", "tokens": ["I", "thank", "you", "for", "your", "kindness."], "fullSentence": };

function questionsFor(format) {
  if (format === 'fillchoice') return FILLCHOICE_QUESTIONS;
  if (format === 'order') return ORDER_QUESTIONS;
  return WRITE_QUESTIONS;
}
function storageKeyFor(format) {
  if (format === 'fillchoice') return STORAGE_KEY_FILLCHOICE;
  if (format === 'order') return STORAGE_KEY_ORDER;
  return STORAGE_KEY_WRITE;
}
function bookmarkKeyFor(format) {
  if (format === 'fillchoice') return BOOKMARK_KEY_FILLCHOICE;
  if (format === 'order') return BOOKMARK_KEY_ORDER;
  return BOOKMARK_KEY_WRITE;
}
function trashKeyFor(format) {
  if (format === 'fillchoice') return TRASH_KEY_FILLCHOICE;
  if (format === 'order') return TRASH_KEY_ORDER;
  return TRASH_KEY_WRITE;
}
function audioFolderFor(format) {
  if (format === 'fillchoice') return 'audio_fillchoice';
  if (format === 'order') return 'audio_order';
  return 'audio_write';
}

function readList(key) {
  if (!storageAvailable) return [];
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
}
function writeList(key, list) {
  if (!storageAvailable) return;
  try { localStorage.setItem(key, JSON.stringify(list)); } catch(e) {}
}

function getBookmarks(format) { return readList(bookmarkKeyFor(format)); }
function toggleBookmark(format, id) {
  let list = getBookmarks(format);
  list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  writeList(bookmarkKeyFor(format), list);
  return list.includes(id);
}
function getTrash(format) { return readList(trashKeyFor(format)); }
function moveToTrash(format, id) {
  const list = getTrash(format);
  if (!list.includes(id)) { list.push(id); writeList(trashKeyFor(format), list); }
}
function restoreFromTrash(format, id) {
  const list = getTrash(format).filter(x => x !== id);
  writeList(trashKeyFor(format), list);
}
function activeQuestionsFor(format) {
  const trashed = new Set(getTrash(format));
  return questionsFor(format).filter(q => !trashed.has(q.id));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getRandomSessionQuestions(format) {
  const all = activeQuestionsFor(format);
  const seen = new Set(readList(storageKeyFor(format)));
  const seenQuestions = all.filter(q => seen.has(q.id));
  const unseenQuestions = all.filter(q => !seen.has(q.id));
  if (seenQuestions.length > 0) {
    const total = Math.min(20, all.length);
    const fromSeen = Math.round(total * 0.3);
    const fromUnseen = total - fromSeen;
    const pickedSeen = shuffle(seenQuestions).slice(0, fromSeen);
    let pickedUnseen = shuffle(unseenQuestions).slice(0, fromUnseen);
    if (pickedUnseen.length < fromUnseen) {
      const extra = shuffle(seenQuestions.filter(q => !pickedSeen.includes(q))).slice(0, fromUnseen - pickedUnseen.length);
      return shuffle([...pickedSeen, ...pickedUnseen, ...extra]);
    }
    return shuffle([...pickedSeen, ...pickedUnseen]);
  }
  return shuffle(all).slice(0, 20);
}
function getAllSessionQuestions(format) { return shuffle(activeQuestionsFor(format)); }
function getCategorySessionQuestions(format, categoryName) {
  return shuffle(activeQuestionsFor(format).filter(q => q.category === categoryName));
}
function getBookmarkSessionQuestions(format) {
  const bm = new Set(getBookmarks(format));
  return shuffle(activeQuestionsFor(format).filter(q => bm.has(q.id)));
}

function saveSeenQuestions(format, questions) {
  const key = storageKeyFor(format);
  const prev = readList(key);
  const merged = Array.from(new Set([...prev, ...questions.map(q => q.id)]));
  writeList(key, merged);
}

function startTest(format, mode, categoryName) {
  currentFormat = format;
  currentMode = mode;
  currentCategory = categoryName || null;
  if (mode === 'random') sessionQuestions = getRandomSessionQuestions(format);
  else if (mode === 'all') sessionQuestions = getAllSessionQuestions(format);
  else if (mode === 'category') sessionQuestions = getCategorySessionQuestions(format, categoryName);
  else if (mode === 'bookmark') sessionQuestions = getBookmarkSessionQuestions(format);
  sessionQuestions = sessionQuestions.map(q => q.type === 'choice' ? Object.assign({}, q, { shuffledChoices: shuffle(q.choices) }) : q);
  currentIndex = 0;
  score = 0;
  renderQuestionScreen();
}

/* ---------------- Audio ---------------- */
let currentAudio = null;
let currentBtn = null;
function resetPlayBtn(btn) { btn.textContent = '🔊 英文を聞く'; btn.classList.remove('playing'); }
function playAudio(btn, src) {
  const isSameBtn = (currentBtn === btn);
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  if (currentBtn) { resetPlayBtn(currentBtn); currentBtn = null; }
  if (isSameBtn) { currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = '■ 停止'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if (currentBtn === btn) { currentBtn = null; currentAudio = null; } };
  audio.play();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

  currentFormat = format;

  let html = '';

  html += '<div class="card mode-card"><h3>🎲 ランダム20問（おまかせ）</h3><p>前回の復習30%＋未出題70%で自動選出</p>';
  html += storageAvailable
    ? `<button class="btn-primary" onclick="startTest('${format}','random')">このモードで始める</button>`
    : `<button class="btn-primary" onclick="startTest('${format}','random')">このモードで始める（履歴なし）</button>`;
  html += '</div>';

  html += `<div class="card mode-card"><h3>📚 全問題に挑戦</h3><p>全${all.length}問をランダム順で出題</p>`;
  html += storageAvailable ? `<button class="btn-secondary" onclick="startTest('${format}','all')">このモードで始める</button>`
    : `<button class="btn-secondary" disabled>localStorage無効のため利用不可</button>`;
  html += '</div>';

  html += `<div class="card mode-card"><h3>🗂 ジャンル別に挑戦</h3><p>ジャンルを1つ選んで出題</p>`;
  if (storageAvailable) {
    html += '<div class="cat-grid" id="catGrid">';
    cats.forEach(c => {
      html += `<button type="button" class="cat-btn" data-cat="${esc(c)}" onclick="selectCategory(this)">${esc(c)} (${catCounts[c]}問)</button>`;
    });
    html += '</div>';
    html += `<button class="btn-secondary" id="catStartBtn" disabled onclick="startCategoryTest()">選んだジャンルで始める</button>`;
  } else {
    html += `<button class="btn-secondary" disabled>localStorage無効のため利用不可</button>`;
  }
  html += '</div>';

  html += `<div class="card mode-card"><h3>🔖 復習リストから挑戦</h3><p>ブックマーク：${bookmarks.length}件</p>`;
  if (storageAvailable && bookmarks.length > 0) {
    html += `<button class="btn-secondary" onclick="startTest('${format}','bookmark')">復習リストで始める</button>`;
  } else {
    html += `<button class="btn-secondary" disabled>復習リストで始める</button>`;
    html += `<p class="sub" style="margin-top:8px;">問題画面の🔖チェックボックスでブックマークすると、ここに追加されます。</p>`;
  }
  html += '</div>';

  html += `<div class="foot-links"><a class="link trash-link" onclick="showTrashScreen()">🗑 ゴミ箱 (${trash.length}問)</a></div>`;

  app.innerHTML = html;
}

function selectCategory(btn) {
  document.querySelectorAll('#catGrid .cat-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  currentCategory = btn.getAttribute('data-cat');
  document.getElementById('catStartBtn').disabled = false;
}
function startCategoryTest() {
  if (!currentCategory) return;
  startTest(currentFormat, 'category', currentCategory);
}

function showTrashScreen() {
  const trash = getTrash(currentFormat);
  const all = questionsFor(currentFormat);
  const items = all.filter(q => trash.includes(q.id));
  let html = '';
  html += `<a class="link" onclick="showModeSelect(currentFormat)">&larr; モード選択に戻る</a>`;
  html += `<h1 style="margin-top:10px;">🗑 ゴミ箱（${esc(FORMAT_META[currentFormat].label)}）</h1>`;
  if (items.length === 0) {
    html += `<div class="card"><p class="sub" style="margin:0;">ゴミ箱は空です</p></div>`;
  } else {
    items.forEach(q => {
      const text = q.question || q.hint || (q.pairs && q.pairs[0] ? q.pairs[0].japanese : '');
      html += `<div class="trash-item" id="trash-${q.id}">`
           +  `<span class="type-badge">${typeLabel(q.type)}</span><span class="cat-badge">${esc(q.category||'')}</span>`
           +  `<p style="margin:8px 0;font-size:0.92rem;">${esc(stripBrackets(text))}</p>`
           +  `<p class="sub" style="margin:0 0 8px;">📷 出典: ${esc(q.source || (q.sources||[]).join(', '))}</p>`
           +  `<button class="btn-small" onclick="restoreTrashItem(${q.id})">↩️ 元に戻す</button>`
           +  `</div>`;
    });
  }
  app.innerHTML = html;
}
function stripBrackets(s) { return String(s||'').replace(/\[\[(.*?)\]\]/g, '$1'); }
function restoreTrashItem(id) {
  restoreFromTrash(currentFormat, id);
  const el = document.getElementById('trash-' + id);
  if (el) el.remove();
  showTrashScreen();
}
function typeLabel(type) {
  return { fill:'穴埋め', choice:'選択肢', reorder:'並べ替え', correction:'誤り訂正', free:'自由記述', match:'マッチング' }[type] || type;
}

/* ---------------- Question screen ---------------- */
function renderQuestionScreen() {
  currentAnswered = false;
  app.innerHTML = '<div id="qScreen"></div>';
  renderQuestion();
}

function currentQuestion() { return sessionQuestions[currentIndex]; }

function renderQuestion() {
  const q = currentQuestion();
  const meta = FORMAT_META[currentFormat];
  const total = sessionQuestions.length;
  const pct = Math.round((currentIndex) / total * 100);
  const isBookmarked = getBookmarks(currentFormat).includes(q.id);

  let html = '';
  html += `<div class="header-bar">`
       +  `<div><span class="badge">${meta.emoji} ${esc(meta.label)}</span></div>`
       +  `<div><span class="badge">Q ${currentIndex+1}/${total}</span></div>`
       +  `<a class="link" onclick="confirmBackToModeSelect()">スタート画面に戻る</a>`
       +  `</div>`;
  html += `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  html += `<div class="card">`;
  html += `<div class="qmeta">`
       +  `<div><span class="type-badge">${typeLabel(q.type)}</span><span class="cat-badge">${esc(q.category||'')}</span></div>`
       +  `<a class="link trash-link" id="preTrashLink" onclick="confirmTrashBeforeAnswer(${q.id})">🗑 この問題は表示しない</a>`
       +  `</div>`;
  html += `<div class="bookmark-row"><label><input type="checkbox" id="bookmarkChk" ${isBookmarked?'checked':''} onchange="toggleBookmark(currentFormat, ${q.id})"> この問題を復習リストに入れる</label></div>`;

  html += `<div id="qBody">` + renderQBody(q) + `</div>`;
  html += `<div id="feedbackArea"></div>`;
  html += `</div>`;

  app.innerHTML = html;
  initQBody(q);
}

function renderQBody(q) {
  if (q.type === 'fill') {
    return `<div class="hint">${esc(q.hint)}</div>`
      + `<div class="qtext">${esc(q.question)}</div>`
      + `<input type="text" id="fillInput" placeholder="英語で入力" autocomplete="off">`
      + `<button class="btn-primary" onclick="submitAnswer()">回答する</button>`;
  }
  if (q.type === 'choice') {
    let opts = '';
    q.shuffledChoices.forEach((c, i) => {
      opts += `<label><input type="radio" name="choiceOpt" value="${esc(c)}"> ${esc(c)}</label>`;
    });
    return `<div class="hint">${esc(q.hint)}</div>`
      + `<div class="qtext">${esc(q.question)}</div>`
      + `<div class="choice-list">${opts}</div>`
      + `<button class="btn-primary" onclick="submitAnswer()">回答する</button>`;
  }
  if (q.type === 'reorder') {
    return `<div class="hint">${esc(q.hint)}</div>`
      + `<div class="tile-area" id="tileArea"><span class="placeholder">タップして単語を選んでください</span></div>`
      + `<div class="tile-pool" id="tilePool"></div>`
      + `<div class="actions"><button class="btn-secondary" onclick="resetReorder()">リセット</button>`
      + `<button class="btn-primary" id="reorderSubmit" disabled onclick="submitAnswer()">回答する</button></div>`;
  }
  if (q.type === 'correction') {
    const displayed = q.question.replace(/\[\[(.*?)\]\]/g, '<mark>$1</mark>');
    return `<div class="hint">${esc(q.hint)}</div>`
      + `<div class="qtext">${displayed}</div>`
      + `<input type="text" id="correctionInput" placeholder="正しい形に直してください" autocomplete="off">`
      + `<button class="btn-primary" onclick="submitAnswer()">回答する</button>`;
  }
  if (q.type === 'free') {
    return `<div class="hint">${esc(q.hint)}</div>`
      + `<textarea id="freeInput" placeholder="英文を入力してください"></textarea>`
      + `<button class="btn-primary" onclick="submitAnswer()">回答する</button>`;
  }
  if (q.type === 'match') {
    return `<div class="hint">日本語と英語を正しく組み合わせてください</div>`
      + `<div class="match-cols"><div class="match-col" id="matchLeft"></div><div class="match-col" id="matchRight"></div></div>`
      + `<button class="btn-primary" id="matchSubmit" disabled onclick="submitAnswer()">回答する</button>`;
  }
  return '';
}

function initQBody(q) {
  if (q.type === 'reorder') {
    reorderBuilt = [];
    reorderTiles = shuffle(q.tokens.map((t, i) => ({ text: t, key: i, used: false })));
    renderReorderTiles();
  }
  if (q.type === 'match') {
    matchPairsMade = [];
    matchLeftSel = null; matchRightSel = null;
    matchLeftOrder = shuffle(q.pairs.map((p, i) => ({ text: p.japanese, idx: i })));
    matchRightOrder = shuffle(q.pairs.map((p, i) => ({ text: p.english, idx: i })));
    renderMatchCols();
  }
}

function renderReorderTiles() {
  const areaEl = document.getElementById('tileArea');
  const poolEl = document.getElementById('tilePool');
  if (reorderBuilt.length === 0) {
    areaEl.innerHTML = '<span class="placeholder">タップして単語を選んでください</span>';
  } else {
    areaEl.innerHTML = reorderBuilt.map((t, pos) => `<span class="tile" onclick="removeTile(${pos})">${esc(t.text)}</span>`).join('');
  }
  poolEl.innerHTML = reorderTiles.map((t, i) => `<span class="tile ${t.used?'used':''}" ${t.used?'':`onclick="addTile(${i})"`}>${esc(t.text)}</span>`).join('');
  const q = currentQuestion();
  document.getElementById('reorderSubmit').disabled = reorderBuilt.length !== q.tokens.length;
}
function addTile(i) {
  if (reorderTiles[i].used) return;
  reorderTiles[i].used = true;
  reorderBuilt.push(reorderTiles[i]);
  renderReorderTiles();
}
function removeTile(pos) {
  const t = reorderBuilt[pos];
  const orig = reorderTiles.find(x => x.key === t.key);
  if (orig) orig.used = false;
  reorderBuilt.splice(pos, 1);
  renderReorderTiles();
}
function resetReorder() {
  reorderBuilt = [];
  reorderTiles.forEach(t => t.used = false);
  renderReorderTiles();
}

function renderMatchCols() {
  const leftEl = document.getElementById('matchLeft');
  const rightEl = document.getElementById('matchRight');
  const pairColorClass = idx => 'paired-' + ((idx % 4) + 1);
  leftEl.innerHTML = matchLeftOrder.map(item => {
    const madeIdx = matchPairsMade.findIndex(p => p.leftIdx === item.idx);
    let cls = 'match-btn';
    if (madeIdx >= 0) cls += ' paired ' + pairColorClass(madeIdx);
    else if (matchLeftSel === item.idx) cls += ' selected';
    return `<button type="button" class="${cls}" onclick="matchClickLeft(${item.idx})">${esc(item.text)}</button>`;
  }).join('');
  rightEl.innerHTML = matchRightOrder.map(item => {
    const madeIdx = matchPairsMade.findIndex(p => p.rightIdx === item.idx);
    let cls = 'match-btn';
    if (madeIdx >= 0) cls += ' paired ' + pairColorClass(madeIdx);
    else if (matchRightSel === item.idx) cls += ' selected';
    return `<button type="button" class="${cls}" onclick="matchClickRight(${item.idx})">${esc(item.text)}</button>`;
  }).join('');
  const q = currentQuestion();
  document.getElementById('matchSubmit').disabled = matchPairsMade.length !== q.pairs.length;
}
function matchClickLeft(idx) {
  if (matchPairsMade.some(p => p.leftIdx === idx)) return;
  matchLeftSel = idx;
  tryMakePair();
  renderMatchCols();
}
function matchClickRight(idx) {
  if (matchPairsMade.some(p => p.rightIdx === idx)) return;
  matchRightSel = idx;
  tryMakePair();
  renderMatchCols();
}
function tryMakePair() {
  if (matchLeftSel !== null && matchRightSel !== null) {
    matchPairsMade = matchPairsMade.filter(p => p.leftIdx !== matchLeftSel && p.rightIdx !== matchRightSel);
    matchPairsMade.push({ leftIdx: matchLeftSel, rightIdx: matchRightSel });
    matchLeftSel = null; matchRightSel = null;
  }
}

/* ---------------- Submit / Feedback ---------------- */
function confirmBackToModeSelect() {
  if (confirm('テストを中断してスタート画面に戻りますか？（現在の進行状況は保存されません）')) {
    showModeSelect(currentFormat);
  }
}
function confirmTrashBeforeAnswer(id) {
  if (confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) {
    moveToTrash(currentFormat, id);
    const link = document.getElementById('preTrashLink');
    if (link) { link.textContent = '🗑 ゴミ箱に移動しました'; link.onclick = null; link.style.opacity = '0.5'; link.style.pointerEvents = 'none'; }
  }
}

function submitAnswer() {
  if (currentAnswered) return;
  currentAnswered = true;
  const q = currentQuestion();
  let correct = false;
  let extraHtml = '';

  if (q.type === 'fill') {
    const val = (document.getElementById('fillInput').value || '').trim().toLowerCase();
    correct = val === q.answer.trim().toLowerCase();
  } else if (q.type === 'choice') {
    const sel = document.querySelector('input[name="choiceOpt"]:checked');
    correct = !!sel && sel.value === q.answer;
  } else if (q.type === 'reorder') {
    const userSeq = reorderBuilt.map(t => t.text);
    correct = userSeq.length === q.tokens.length && userSeq.every((t, i) => t === q.tokens[i]);
  } else if (q.type === 'correction') {
    const val = (document.getElementById('correctionInput').value || '').trim().toLowerCase();
    correct = val === q.answer.trim().toLowerCase();
  } else if (q.type === 'free') {
    const val = (document.getElementById('freeInput').value || '').trim().toLowerCase();
    const missing = q.keyPhrases.filter(k => !val.includes(k.toLowerCase()));
    correct = missing.length === 0;
    if (!correct) extraHtml = `<div class="answer-line">不足している語句: ${missing.map(esc).join(', ')}</div>`;
  } else if (q.type === 'match') {
    const totalPairs = q.pairs.length;
    let rightCount = 0;
    matchPairsMade.forEach(p => { if (p.leftIdx === p.rightIdx) rightCount++; });
    correct = rightCount === totalPairs;
    extraHtml = renderMatchResultList(q, rightCount, totalPairs);
  }

  if (correct) score++;
  renderFeedback(q, correct, extraHtml);
}

function renderMatchResultList(q, rightCount, totalPairs) {
  let html = `<div class="answer-line">${rightCount} / ${totalPairs} 組 正解</div>`;
  q.pairs.forEach((p, i) => {
    const made = matchPairsMade.find(m => m.leftIdx === i);
    const userRightIdx = made ? made.rightIdx : null;
    const ok = userRightIdx === i;
    html += `<div class="match-pair-list ${ok?'':'bad'}">${ok?'✅':'❌'} ${esc(p.japanese)} → ${esc(p.english)}`
      + ` <button class="play-btn" style="margin-left:8px;" onclick="playAudio(this, audioFolderFor('write')+'/'+${q.id}+'_p'+${i}+'.mp3')">🔊</button></div>`;
  });
  return html;
}

function renderFeedback(q, correct, extraHtml) {
  const fbClass = correct ? 'correct' : 'wrong';
  const resultText = q.type === 'match' ? (correct ? '✅ 全問正解！' : '⚠️ 一部不正解') : (correct ? '✅ 正解！' : '❌ 不正解');
  let answerLine = '';
  let audioBtn = '';

  if (q.type === 'fill' || q.type === 'choice') {
    answerLine = `<div class="answer-line">正解: <b>${esc(q.answer)}</b></div>`;
    audioBtn = `<button class="play-btn" onclick="playAudio(this, audioFolderFor('fillchoice')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>`;
  } else if (q.type === 'reorder') {
    answerLine = `<div class="answer-line">正解の英文: <b>${esc(q.tokens.join(' '))}</b></div>`;
    audioBtn = `<button class="play-btn" onclick="playAudio(this, audioFolderFor('order')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>`;
  } else if (q.type === 'correction') {
    answerLine = `<div class="answer-line">正解の英文: <b>${esc(q.fullSentence)}</b></div>`;
    audioBtn = `<button class="play-btn" onclick="playAudio(this, audioFolderFor('order')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>`;
  } else if (q.type === 'free') {
    answerLine = `<div class="answer-line">模範解答: <b>${esc(q.answer)}</b></div>`;
    audioBtn = `<button class="play-btn" onclick="playAudio(this, audioFolderFor('write')+'/'+${q.id}+'.mp3')">🔊 英文を聞く</button>`;
  }

  let html = `<div class="feedback ${fbClass}">`
    + `<div class="result-line">${resultText}</div>`
    + answerLine + (extraHtml || '')
    + (audioBtn ? `<div style="margin-top:8px;">${audioBtn}</div>` : '')
    + `</div>`;

  const sourceList = q.source ? [q.source] : (q.sources || []);
  html += `<div class="info-block">`
    + `<div>📷 出典: ${esc(sourceList.join(', '))}</div>`;
  if (sourceList.length > 0) {
    html += `<div class="source-images">` + sourceList.map(s =>
      `<img class="source-thumb" src="images/${esc(s)}.jpg" alt="${esc(s)}" loading="lazy" onclick="openImageModal('images/${esc(s)}.jpg')" onerror="this.style.display='none'">`
    ).join('') + `</div>`;
  }
  if (q.relatedInfo) html += `<div style="margin-top:6px;">💡 関連知識: ${esc(q.relatedInfo)}</div>`;
  if (q.explanation) html += `<div style="margin-top:6px;">📝 解説: ${esc(q.explanation)}</div>`;
  html += `<div style="margin-top:10px;"><a class="link trash-link" id="postTrashLink" onclick="confirmTrashAfterAnswer(${q.id})">🗑 この問題は表記ミスなどがあり変です</a></div>`;
  html += `</div>`;

  const isLast = currentIndex === sessionQuestions.length - 1;
  html += `<button class="btn-primary" onclick="nextQuestion()">${isLast ? '結果を見る' : '次の問題 →'}</button>`;

  document.getElementById('feedbackArea').innerHTML = html;
  const preTrashLink = document.getElementById('preTrashLink');
  if (preTrashLink) { preTrashLink.style.opacity = '0.5'; preTrashLink.style.pointerEvents = 'none'; }
}

function confirmTrashAfterAnswer(id) {
  if (confirm('この問題をゴミ箱に移動しますか？（ゴミ箱からいつでも戻せます）')) {
    moveToTrash(currentFormat, id);
    const link = document.getElementById('postTrashLink');
    if (link) { link.textContent = '🗑 ゴミ箱に移動しました'; link.onclick = null; link.style.opacity = '0.5'; link.style.pointerEvents = 'none'; }
  }
}

function nextQuestion() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentBtn) { currentBtn = null; }
  if (currentIndex < sessionQuestions.length - 1) {
    currentIndex++;
    currentAnswered = false;
    renderQuestion();
  } else {
    showResults();
  }
}

/* ---------------- Results ---------------- */
function showResults() {
  if (currentMode === 'random') saveSeenQuestions(currentFormat, sessionQuestions);
  const total = sessionQuestions.length;
  const rate = total > 0 ? Math.round(score / total * 100) : 0;
  let stars = '—'; let msg = 'ノートを見直して再チャレンジ！';
  if (rate >= 90) { stars = '★★★'; msg = 'Excellent! TOEFL満点レベルの実力です'; }
  else if (rate >= 70) { stars = '★★'; msg = 'Good! あと少しで完璧です'; }
  else if (rate >= 50) { stars = '★'; msg = 'Keep going! 復習して再挑戦しましょう'; }

  const meta = FORMAT_META[currentFormat];
  let html = '';
  html += `<div class="card">`;
  html += `<h2>結果発表</h2>`;
  html += `<p class="sub">形式: ${meta.emoji} ${esc(meta.label)}</p>`;
  html += `<div class="result-score">${score} / ${total}</div>`;
  html += `<div class="result-stars">${stars}</div>`;
  html += `<p class="result-msg">正解率 ${rate}%　${esc(msg)}</p>`;
  html += `<button class="btn-primary" onclick="startTest(currentFormat, currentMode, currentCategory)">もう一度同じ形式・モードで挑戦する</button>`;
  html += `<div style="height:10px;"></div>`;
  html += `<button class="btn-secondary" onclick="showFormatSelect()">別の形式に挑戦する</button>`;
  html += `<div style="height:10px;"></div>`;
  html += `<button class="btn-secondary" onclick="showFormatSelect()">🏠 最初から</button>`;
  html += `</div>`;
  app.innerHTML = html;
}

/* ---------------- Image lightbox ---------------- */
function openImageModal(src) {
  document.getElementById('imgModalImg').src = src;
  document.getElementById('imgModal').classList.remove('hidden');
}
function closeImageModal() {
  document.getElementById('imgModal').classList.add('hidden');
  document.getElementById('imgModalImg').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImageModal(); });

/* ---------------- init ---------------- */
showFormatSelect();
</script>
