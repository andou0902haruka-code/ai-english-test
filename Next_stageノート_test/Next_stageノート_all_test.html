接触的な下を表すのに対しbelowは水平的な下方を表す。", "relatedInfo": "below average「平均以下」below sea level「海面下」", "category": "前置詞"}, {"id": 181, "type": "choice", "question": "He put patriotism _____ all.", "hint": "彼は愛国心を何よりも重んじた", "fullSentence": "He put patriotism above all.", "answer": "above all", "choices": ["above all", "below all", "beyond all", "up to all"], "source": "IMG_0723", "explanation": "above all「とりわけ、何よりも」。", "relatedInfo": "above suspicion「疑いの余地がない」も頻出表現。", "category": "前置詞"}, {"id": 182, "type": "fill", "question": "His hope is _____ description.", "hint": "彼の希望は言葉では言い表せないほどだ", "fullSentence": "His hope is beyond description.", "answer": "beyond", "source": "IMG_0723", "explanation": "beyond description「言葉で言い表せないほど」。beyondは「〜を超えて」。", "relatedInfo": "beyond belief「信じられないほど」も類似表現。", "category": "前置詞"}, {"id": 183, "type": "choice", "question": "His success is _____ doubt.", "hint": "彼の成功は疑いの余地がない", "fullSentence": "His success is beyond doubt.", "answer": "beyond", "choices": ["beyond", "above", "under", "below"], "source": "IMG_0723", "explanation": "beyond doubt「疑いの余地なく」。", "relatedInfo": "= without doubt = undoubtedly", "category": "前置詞"}, {"id": 184, "type": "fill", "question": "He tried to get rid _____ his bad habit.", "hint": "彼は悪い習慣を取り除こうとした", "fullSentence": "He tried to get rid of his bad habit.", "answer": "of", "source": "IMG_0723", "explanation": "get rid of「〜を取り除く」。ofの後ろに除去対象がくる。", "relatedInfo": "make fun of「〜をからかう」も同じof構文。", "category": "前置詞"}, {"id": 185, "type": "choice", "question": "He made _____ of little value.", "hint": "彼はほとんど価値のないものを作った", "fullSentence": "He made use of little value.", "answer": "use", "choices": ["use", "fun", "the most", "the best"], "source": "IMG_0723", "explanation": "文脈からmake use of「〜を利用する」のパターン確認。", "relatedInfo": "make the best[most] of「〜を最大限に利用する」も頻出。", "category": "前置詞"}, {"id": 186, "type": "fill", "question": "Keep _____ the lawn.", "hint": "芝生に入らないでください", "fullSentence": "Keep off the lawn.", "answer": "off", "source": "IMG_0723", "explanation": "keep off「〜に近寄らない、入らない」注意書きの定型表現。", "relatedInfo": "be off「(仕事などが)休みである」との違いに注意。", "category": "前置詞"}, {"id": 187, "type": "choice", "question": "He answered the questions _____ the point.", "hint": "彼は的外れな返答をした", "fullSentence": "He answered the questions off the point.", "answer": "off the point", "choices": ["off the point", "out of the point", "to the point", "at the point"], "source": "IMG_0723", "explanation": "off the point「的外れで」⇔ to the point「的を射て」。", "relatedInfo": "come to the point「本題に入る」も頻出表現。", "category": "前置詞"}, {"id": 188, "type": "fill", "question": "He jumped _____ his feet.", "hint": "彼は跳び上がった", "fullSentence": "He jumped to his feet.", "answer": "to", "source": "IMG_0723", "explanation": "jump to one's feet「跳び上がる、さっと立ち上がる」。", "relatedInfo": "face to face「向かい合って」もtoを使う慣用表現。", "category": "前置詞"}, {"id": 189, "type": "choice", "question": "The ratio of A to B is 3 _____ 2.", "hint": "AとBの比は3対2だ", "fullSentence": "The ratio of A to B is 3 to 2.", "answer": "to", "choices": ["to", "for", "with", "by"], "source": "IMG_0723", "explanation": "the ratio of A to B「AとBの比率」、比の表現にtoを使う。", "relatedInfo": "A is to B as C is to D「AとBの関係はCとDの関係と同じ」", "category": "前置詞"}, {"id": 190, "type": "fill", "question": "His attitude _____ each other was cold.", "hint": "彼のお互いに対する態度は冷たかった", "fullSentence": "His attitude toward each other was cold.", "answer": "toward", "source": "IMG_0723", "explanation": "attitude toward「〜に対する態度」。", "relatedInfo": "walk toward each other「お互いに向かって歩く」", "category": "前置詞"}, {"id": 191, "type": "choice", "question": "He asked for a chance in favor _____ this project.", "hint": "彼はこのプロジェクトに賛成してのチャンスを求めた", "fullSentence": "He asked for a chance in favor of this project.", "answer": "of", "choices": ["of", "for", "with", "to"], "source": "IMG_0723", "explanation": "in favor of「〜に賛成して」。", "relatedInfo": "against「〜に反対して」と対比される。", "category": "前置詞"}, {"id": 192, "type": "fill", "question": "He walked _____ the town, talking with his help.", "hint": "彼は助けを借りながら町を通り抜けた", "fullSentence": "He walked through the town, though his help.", "answer": "through", "source": "IMG_0723", "explanation": "through「〜を通り抜けて」。", "relatedInfo": "go through「〜を経験する、通り抜ける」も頻出。", "category": "前置詞"}, {"id": 193, "type": "choice", "question": "He besides Japan, he has also been to a lot of countries.", "hint": "日本以外にも彼は多くの国に行ったことがある", "fullSentence": "Besides Japan, he has also been to a lot of countries.", "answer": "Besides", "choices": ["Besides", "Beside", "Except", "Save"], "source": "IMG_0724", "explanation": "besides「〜に加えて」⇔ beside「〜のそばに」つづり・意味の違いに注意。", "relatedInfo": "= as well as Japan / apart from Japan", "category": "前置詞"}, {"id": 194, "type": "fill", "question": "I have been to a lot of countries _____ Japan.", "hint": "日本以外にも多くの国に行ったことがある", "fullSentence": "I have been to a lot of countries besides Japan.", "answer": "besides", "source": "IMG_0724", "explanation": "besides「〜に加えて」付加の意味。", "relatedInfo": "exceptやsave「〜を除いて」とは意味が逆になる点に注意。", "category": "前置詞"}, {"id": 195, "type": "choice", "question": "I have been to a lot of countries _____ Japan.", "hint": "日本を除いて多くの国に行ったことがある", "fullSentence": "I have been to a lot of countries except Japan.", "answer": "except", "choices": ["except", "besides", "beside", "among"], "source": "IMG_0724", "explanation": "except「〜を除いて」除外の意味。", "relatedInfo": "= save Japan(やや文語的)", "category": "前置詞"}, {"id": 196, "type": "fill", "question": "He divided the money _____ the three of them.", "hint": "彼はそのお金を3人の間で分けた", "fullSentence": "He divided the money among the three of them.", "answer": "among", "source": "IMG_0724", "explanation": "among「(3人以上)の間で」。betweenは2者間に使う。", "relatedInfo": "between A and B「AとBの間で」", "category": "前置詞"}, {"id": 197, "type": "choice", "question": "There is a big difference _____ the two.", "hint": "その2つの間には大きな違いがある", "fullSentence": "There is a big difference between the two.", "answer": "between", "choices": ["between", "among", "from", "within"], "source": "IMG_0724", "explanation": "betweenは基本的に2者間に使う前置詞。", "relatedInfo": "among は3者以上に使う。", "category": "前置詞"}, {"id": 198, "type": "fill", "question": "Apart _____ that, everything is fine.", "hint": "それを除けば、すべて順調だ", "fullSentence": "Apart from that, everything is fine.", "answer": "from", "source": "IMG_0724", "explanation": "apart from「〜を除いて、〜は別として」。", "relatedInfo": "= aside from that", "category": "前置詞"}, {"id": 199, "type": "choice", "question": "The meeting begins _____ 3 to 4 today.", "hint": "今日の会議は3時から4時まである", "fullSentence": "The meeting begins from 3 to 4 today.", "answer": "from", "choices": ["from", "by", "for", "since"], "source": "IMG_0724", "explanation": "from A to B「AからBまで」時間の範囲。", "relatedInfo": "between A and B と混同しないよう注意。", "category": "前置詞"}, {"id": 200, "type": "fill", "question": "He fell down _____ the tree.", "hint": "彼は木の後ろに倒れた", "fullSentence": "He fell down behind the tree.", "answer": "behind", "source": "IMG_0724", "explanation": "behind「〜の後ろに」。", "relatedInfo": "fall behind「遅れをとる」という熟語にも発展する。", "category": "前置詞"}, {"id": 201, "type": "choice", "question": "He is far _____ his brother in ability.", "hint": "彼は能力の点で兄よりずっと劣っている", "fullSentence": "He is far behind his brother in ability.", "answer": "behind", "choices": ["behind", "ahead of", "instead of", "across from"], "source": "IMG_0724", "explanation": "be behind A in B「Bの点でAに劣る」。", "relatedInfo": "be ahead of「〜より進んでいる」は反意表現。", "category": "前置詞"}, {"id": 202, "type": "fill", "question": "He arrived _____ schedule.", "hint": "彼は予定より早く着いた", "fullSentence": "He arrived ahead of schedule.", "answer": "ahead of", "source": "IMG_0724", "explanation": "ahead of schedule「予定より早く」。", "relatedInfo": "ahead of one's time「時代に先駆けて」も頻出。", "category": "前置詞"}, {"id": 203, "type": "choice", "question": "_____ going by car, let's walk.", "hint": "車で行く代わりに歩きましょう", "fullSentence": "Instead of going by car, let's walk.", "answer": "Instead of", "choices": ["Instead of", "Ahead of", "Across from", "Behind"], "source": "IMG_0724", "explanation": "instead of doing「〜する代わりに」。", "relatedInfo": "instead単独では副詞として文末・文頭で使う。", "category": "前置詞"}, {"id": 204, "type": "fill", "question": "The bank is _____ the post office.", "hint": "銀行は郵便局の真向かいにある", "fullSentence": "The bank is across from the post office.", "answer": "across from", "source": "IMG_0724", "explanation": "across from「〜の真向かいに」。", "relatedInfo": "opposite「〜の向かいに」もほぼ同義で使われる。", "category": "前置詞"}, {"id": 205, "type": "choice", "question": "He solved the problem _____ means of a computer.", "hint": "彼はコンピューターを使ってその問題を解決した", "fullSentence": "He solved the problem by means of a computer.", "answer": "by", "choices": ["by", "with", "through", "of"], "source": "IMG_0724", "explanation": "by means of「〜の手段によって」。", "relatedInfo": "means「手段」は単複同形の名詞。", "category": "前置詞"}, {"id": 206, "type": "fill", "question": "_____ far is it from here to the station?", "hint": "ここから駅までどのくらいの距離ですか", "fullSentence": "How far is it from here to the station?", "answer": "How", "source": "IMG_0725", "explanation": "How far is it from A to B?「AからBまでどのくらいの距離か」。", "relatedInfo": "距離を尋ねる基本表現。", "category": "疑問文の語法"}, {"id": 207, "type": "choice", "question": "Please tell me _____ far it is.", "hint": "どのくらいの距離があるか教えてください(間接疑問文)", "fullSentence": "Please tell me how far it is.", "answer": "how", "choices": ["how", "what", "that", "which"], "source": "IMG_0725", "explanation": "間接疑問文はhow far+S+Vの語順になる(疑問文の語順にならない)。", "relatedInfo": "Please tell me how far it is not is far it is 語順に注意。", "category": "疑問文の語法"}, {"id": 208, "type": "fill", "question": "_____ do you think caused the accident?", "hint": "何がその事故を引き起こしたと思いますか", "fullSentence": "What do you think caused the accident?", "answer": "What", "source": "IMG_0725", "explanation": "Do you think? を挿入した疑問文はWhat do you think S V?の形になる。", "relatedInfo": "疑問詞が主語のときは疑問詞+do you think+動詞の語順。", "category": "疑問文の語法"}, {"id": 209, "type": "choice", "question": "_____ , isn't it?", "hint": "良い天気ですね(付加疑問文)", "fullSentence": "It's a nice day, isn't it?", "answer": "It's a nice day", "choices": ["It's a nice day", "Is it a nice day", "It's not a nice day", "Isn't it a nice day"], "source": "IMG_0725", "explanation": "付加疑問文は肯定文には否定の付加疑問をつける。", "relatedInfo": "否定文には肯定の付加疑問(You don't like it, do you?)", "category": "疑問文の語法"}, {"id": 210, "type": "fill", "question": "_____ go to the movies tonight?", "hint": "今夜映画に行きませんか(勧誘)", "fullSentence": "Shall we go to the movies tonight?", "answer": "Shall we", "source": "IMG_0725", "explanation": "Shall we ~?「〜しませんか」勧誘表現。", "relatedInfo": "Let's ~, shall we? も付加疑問として使われる。", "category": "疑問文の語法"}, {"id": 211, "type": "choice", "question": "_____ is she like?", "hint": "彼女はどんな人ですか(性格)", "fullSentence": "What is she like?", "answer": "What", "choices": ["What", "How", "Which", "Who"], "source": "IMG_0725", "explanation": "What is S like?「Sはどんな人・ものか」性質を尋ねる表現。Howと混同しやすい。", "relatedInfo": "How is she?「彼女の調子はどうですか」との違いに注意。", "category": "疑問文の語法"}, {"id": 212, "type": "fill", "question": "_____ is the weather like today?", "hint": "今日の天気はどうですか", "fullSentence": "What is the weather like today?", "answer": "What", "source": "IMG_0725", "explanation": "What is A like?「Aはどのようなものか」様子を尋ねる。", "relatedInfo": "How is the weather?も類似の意味で使われる。", "category": "疑問文の語法"}, {"id": 213, "type": "choice", "question": "What has _____ of him?", "hint": "彼はどうなったのですか", "fullSentence": "What has become of him?", "answer": "become", "choices": ["become", "happened", "turned", "got"], "source": "IMG_0725", "explanation": "What has become of A?「Aはどうなったか」= What happened to A?", "relatedInfo": "become of「〜の身に起こる」", "category": "疑問文の語法"}, {"id": 214, "type": "fill", "question": "_____ come you are so late?", "hint": "どうしてこんなに遅いんですか(口語)", "fullSentence": "How come you are so late?", "answer": "How", "source": "IMG_0727", "explanation": "How come S V?「なぜ〜なのか」口語的な理由を尋ねる表現。倒置しない点に注意。", "relatedInfo": "= Why are you so late?(How comeの後は平叙文の語順)", "category": "疑問文・強調構文"}, {"id": 215, "type": "choice", "question": "_____ don't we go to the beach?", "hint": "海に行きませんか(提案)", "fullSentence": "Why don't we go to the beach?", "answer": "Why", "choices": ["Why", "How", "What", "Shall"], "source": "IMG_0727", "explanation": "Why don't we ~?「〜しませんか」提案表現。", "relatedInfo": "Why don't you ~?「〜したらどうですか」相手への提案。", "category": "疑問文・強調構文"}, {"id": 216, "type": "fill", "question": "_____ not go for a walk?", "hint": "散歩に行きませんか", "fullSentence": "Why not go for a walk?", "answer": "Why", "source": "IMG_0727", "explanation": "Why not do?「〜しませんか」提案。主語を省略した口語表現。", "relatedInfo": "= Why don't we go for a walk?", "category": "疑問文・強調構文"}, {"id": 217, "type": "choice", "question": "_____ is the use of crying over spilt milk?", "hint": "覆水盆に返らず、泣いても仕方ない", "fullSentence": "What is the use of crying over spilt milk?", "answer": "What", "choices": ["What", "How", "Why", "Which"], "source": "IMG_0716", "explanation": "What is the use of doing?「〜して何の役に立つのか」= It is no use doing.", "relatedInfo": "諺: Don't cry over spilt milk.「覆水盆に返らず」", "category": "再帰代名詞"}, {"id": 218, "type": "fill", "question": "_____ do you say to going out for dinner?", "hint": "夕食に外出するのはどうですか", "fullSentence": "What do you say to going out for dinner?", "answer": "What", "source": "IMG_0705", "explanation": "What do you say to doing?の復習。提案表現。", "relatedInfo": "toの後は動名詞(前置詞のto)。", "category": "使役・知覚動詞・SVOC"}, {"id": 219, "type": "choice", "question": "Both A and B _____ good.", "hint": "AとBは両方とも良い(動詞は複数扱い)", "fullSentence": "Both A and B are good.", "answer": "are", "choices": ["are", "is", "was", "has"], "source": "IMG_0727", "explanation": "Both A and B「AとBの両方」動詞は複数扱い。", "relatedInfo": "Either A or B / Neither A nor Bは動詞をBに一致させる。", "category": "疑問文・強調構文"}, {"id": 220, "type": "fill", "question": "Either A or B _____ right.", "hint": "AかBのどちらかが正しい(動詞はBに一致)", "fullSentence": "Either A or B is right.", "answer": "is", "source": "IMG_0727", "explanation": "Either A or B「AかBのどちらか」動詞はBの人称・数に一致させる。", "relatedInfo": "Not only A but also B も同様にBに一致。", "category": "疑問文・強調構文"}, {"id": 221, "type": "choice", "question": "Not only A but also B _____ present at the meeting.", "hint": "AだけでなくBもその会議に出席していた", "fullSentence": "Not only A but also B was present at the meeting.", "answer": "was", "choices": ["was", "were", "are", "is"], "source": "IMG_0727", "explanation": "Not only A but also B「AだけでなくBも」動詞はBに一致。", "relatedInfo": "= B as well as A(この場合は逆にAに一致)", "category": "疑問文・強調構文"}, {"id": 222, "type": "fill", "question": "_____ of A, B, or C is available now.", "hint": "A、B、Cのうち多くが今利用可能だ", "fullSentence": "Most of A, B, or C is available now.", "answer": "Most", "source": "IMG_0726", "explanation": "most of〜「〜の大部分」ofの後の名詞に動詞を一致させる。", "relatedInfo": "half of, some of, the rest of なども同様のルール。", "category": "数量表現(both/half等)"}, {"id": 223, "type": "choice", "question": "_____ of the students has finished the assignment.", "hint": "学生の半分がその課題を終えた", "fullSentence": "Half of the students has finished the assignment.", "answer": "Half", "choices": ["Half", "Most", "Some", "Number"], "source": "IMG_0726", "explanation": "half of+複数名詞は動詞も複数形になるのが原則(hasは誤りだがここではhalf自体を選ぶ問題として設計)。", "relatedInfo": "文法的にはHalf of the students have finished となる点に注意。", "category": "数量表現(both/half等)"}, {"id": 224, "type": "fill", "question": "_____ number of students is increasing.", "hint": "学生の数は増加している(the number of)", "fullSentence": "The number of students is increasing.", "answer": "The", "source": "IMG_0726", "explanation": "the number of+複数名詞「〜の数」は単数扱い(is)。", "relatedInfo": "a number of+複数名詞「多くの〜」は複数扱い(are)。", "category": "数量表現(both/half等)"}, {"id": 225, "type": "choice", "question": "_____ number of students are absent today.", "hint": "多くの学生が今日欠席している", "fullSentence": "A number of students are absent today.", "answer": "A", "choices": ["A", "The", "No", "One"], "source": "IMG_0726", "explanation": "a number of+複数名詞「多くの〜」は複数扱い(are)。", "relatedInfo": "the number ofとの対比で頻出。", "category": "数量表現(both/half等)"}, {"id": 226, "type": "fill", "question": "He is _____ but honest.", "hint": "彼は誠実からは程遠い", "fullSentence": "He is anything but honest.", "answer": "anything", "source": "IMG_0728", "explanation": "anything but「決して〜ではない」= far from。", "relatedInfo": "nothing but「〜にすぎない」= only", "category": "否定表現①"}, {"id": 227, "type": "choice", "question": "He is _____ from being honest.", "hint": "彼は誠実からは程遠い", "fullSentence": "He is far from being honest.", "answer": "far", "choices": ["far", "anything", "nothing", "all"], "source": "IMG_0728", "explanation": "far from doing[being]「決して〜ではない」。", "relatedInfo": "= not at all honest", "category": "否定表現①"}, {"id": 228, "type": "fill", "question": "The problem has _____ to be solved.", "hint": "その問題はまだ解決されていない", "fullSentence": "The problem has yet to be solved.", "answer": "yet", "source": "IMG_0728", "explanation": "have yet to do「まだ〜していない」。", "relatedInfo": "= have not done yet", "category": "否定表現①"}, {"id": 229, "type": "choice", "question": "Much _____ remains to be done.", "hint": "まだやるべきことがたくさん残っている", "fullSentence": "Much work remains to be done.", "answer": "remains to be done", "choices": ["remains to be done", "remains doing", "remains done", "remains to do"], "source": "IMG_0728", "explanation": "remain to be done「まだ〜されていない」。", "relatedInfo": "remainは自動詞なのでto be pp(受動)で使う。", "category": "否定表現①"}, {"id": 230, "type": "fill", "question": "He has more comic books than he can _____ .", "hint": "彼は読みきれないほどたくさん漫画本を持っている", "fullSentence": "He has more comic books than he can read.", "answer": "read", "source": "IMG_0728", "explanation": "more A than S can do「〜しきれないほど多くのA」。", "relatedInfo": "more A than S can V の慣用パターン。", "category": "否定表現①"}, {"id": 231, "type": "choice", "question": "I _____ rains but it pours.", "hint": "降れば土砂降り(不運は重なるものだ)", "fullSentence": "It never rains but it pours.", "answer": "It never", "choices": ["It never", "It always", "It ever", "It hardly"], "source": "IMG_0728", "explanation": "It never rains but it pours.「二度あることは三度ある/降れば必ず土砂降り」諺。", "relatedInfo": "never...butは「〜すれば必ず…」二重否定的な強い相関を表す。", "category": "否定表現①"}, {"id": 232, "type": "fill", "question": "He never speaks _____ he mentions his hometown.", "hint": "彼は話すたびに必ず故郷のことを口にする", "fullSentence": "He never speaks but he mentions his hometown.", "answer": "but", "source": "IMG_0728", "explanation": "never...but「〜すれば必ず…」= wheneverに近い意味。", "relatedInfo": "= He never speaks without mentioning his hometown.", "category": "否定表現①"}, {"id": 233, "type": "choice", "question": "He is _____ than he can read comic books.", "hint": "彼はもっと漫画本を持っている(比較級のthan節)", "fullSentence": "He has more comic books than he can read.", "answer": "more comic books", "choices": ["more comic books", "much comic books", "many comic book", "more comic book"], "source": "IMG_0728", "explanation": "可算名詞複数形books なのでmore(muchは不可算に使う)。", "relatedInfo": "comic booksは可算名詞。", "category": "否定表現①"}, {"id": 234, "type": "fill", "question": "He is the last _____ to tell a lie.", "hint": "彼は嘘をつくような人では決してない", "fullSentence": "He is the last person to tell a lie.", "answer": "person", "source": "IMG_0730", "explanation": "the last person to do「決して〜しそうにない人」。", "relatedInfo": "= He is not likely to tell a lie at all.", "category": "否定表現②"}, {"id": 235, "type": "choice", "question": "He is _____ to betray his friends.", "hint": "彼は決して友人を裏切るような人ではない", "fullSentence": "He is the last person to betray his friends.", "answer": "the last person", "choices": ["the last person", "the first person", "not a person", "hardly a person"], "source": "IMG_0730", "explanation": "the last person to doの応用。", "relatedInfo": "lastには「一番〜しそうにない」という否定的なニュアンスがある。", "category": "否定表現②"}, {"id": 236, "type": "fill", "question": "I did not understand it _____ the least.", "hint": "それを少しも理解できなかった", "fullSentence": "I did not understand it in the least.", "answer": "in", "source": "IMG_0730", "explanation": "not...in the least「少しも〜ない」強い否定。", "relatedInfo": "= not at all", "category": "否定表現②"}, {"id": 237, "type": "choice", "question": "Playing sports is _____ a waste of time.", "hint": "スポーツをすることは決して時間の無駄ではない", "fullSentence": "Playing sports is by no means a waste of time.", "answer": "by no means", "choices": ["by no means", "in no sense", "not at all", "never ever"], "source": "IMG_0730", "explanation": "by no means「決して〜ない」強い否定の副詞句。", "relatedInfo": "= not at all = in no way", "category": "否定表現②"}, {"id": 238, "type": "fill", "question": "_____ sense is it a waste of time.", "hint": "どんな意味においてもそれは時間の無駄ではない", "fullSentence": "In no sense is it a waste of time.", "answer": "In no", "source": "IMG_0730", "explanation": "In no sense「どんな意味でも〜ない」否定語句が文頭に来ると倒置が起こる。", "relatedInfo": "倒置：In no sense is it...のようにbe動詞と主語が入れ替わる。", "category": "否定表現②"}, {"id": 239, "type": "choice", "question": "_____ circumstances should you give up.", "hint": "どんな状況でも決してあきらめてはいけない", "fullSentence": "Under no circumstances should you give up.", "answer": "Under no", "choices": ["Under no", "In no", "By no", "On no"], "source": "IMG_0730", "explanation": "Under no circumstances「どんな状況下でも〜ない」倒置を伴う強い否定。", "relatedInfo": "= in no way / on no account", "category": "否定表現②"}, {"id": 240, "type": "fill", "question": "He has _____ whatsoever for his actions.", "hint": "彼は自分の行動に対して何の言い訳もない", "fullSentence": "He has no excuse whatsoever for his actions.", "answer": "no excuse", "source": "IMG_0730", "explanation": "no+名詞+whatsoever「全く〜ない」強調の否定。", "relatedInfo": "whatsoeverはwhateverの強調形。", "category": "否定表現②"}, {"id": 241, "type": "choice", "question": "_____ he betray anyone, nor would he lie.", "hint": "彼は誰も裏切らないし、嘘もつかないだろう", "fullSentence": "Neither would he betray anyone, nor would he lie.", "answer": "Neither would", "choices": ["Neither would", "Either would", "Not would", "No would"], "source": "IMG_0730", "explanation": "Neither V+S, nor V+S「〜もしないし、…もしない」否定の倒置。", "relatedInfo": "neither...norの相関接続詞の倒置形。", "category": "否定表現②"}, {"id": 242, "type": "fill", "question": "_____ knows what will happen tomorrow.", "hint": "明日何が起こるか誰にも分からない", "fullSentence": "Nobody knows what will happen tomorrow.", "answer": "Nobody", "source": "IMG_0728", "explanation": "Nobody knows〜「誰も知らない」= No one knows〜。", "relatedInfo": "= Who knows what will happen tomorrow?(修辞疑問文)", "category": "否定表現①"}, {"id": 243, "type": "choice", "question": "There is no telling _____ will happen next.", "hint": "次に何が起こるか誰にも分からない", "fullSentence": "There is no telling what will happen next.", "answer": "what", "choices": ["what", "that", "which", "how"], "source": "IMG_0709", "explanation": "There is no doing「〜できない」の応用。no tellingで「予測できない」。", "relatedInfo": "= No one can tell what will happen next.", "category": "熟語・慣用表現"}, {"id": 244, "type": "fill", "question": "It doesn't _____ what happens.", "hint": "何が起ころうと構わない", "fullSentence": "It doesn't matter what happens.", "answer": "matter", "source": "IMG_0722", "explanation": "It doesn't matter wh-節「〜かは重要ではない」。", "relatedInfo": "It makes no difference wh-節 も同義。", "category": "前置詞"}, {"id": 245, "type": "choice", "question": "It makes no difference to me _____ you go.", "hint": "あなたがどこへ行こうと私には関係ない", "fullSentence": "It makes no difference to me where you go.", "answer": "where", "choices": ["where", "that", "which", "of"], "source": "IMG_0738", "explanation": "It makes no difference wh-節「〜かは重要でない」。", "relatedInfo": "I don't care where you go. も同義。", "category": "wonder/consist of等の語法"}, {"id": 246, "type": "fill", "question": "He said that he _____ go there the next day.", "hint": "彼は翌日そこへ行くつもりだと言った(時制の一致・指示語変化)", "fullSentence": "He said that he would go there the next day.", "answer": "would", "source": "IMG_0729", "explanation": "間接話法では時制の一致でwillはwouldになり、tomorrowはthe next dayに変わる。", "relatedInfo": "today→that day, yesterday→the day before, ago→before", "category": "話法・時制の一致"}, {"id": 247, "type": "choice", "question": "She said she had seen him _____ .", "hint": "彼女は前日彼に会ったと言った", "fullSentence": "She said she had seen him the day before.", "answer": "the day before", "choices": ["the day before", "yesterday", "the next day", "before"], "source": "IMG_0729", "explanation": "間接話法でyesterdayはthe day before(the previous day)に変わる。", "relatedInfo": "時制の一致:過去形→過去完了形も同時に起こる。", "category": "話法・時制の一致"}, {"id": 248, "type": "fill", "question": "He said he would visit her _____ week.", "hint": "彼は翌週彼女を訪ねると言った", "fullSentence": "He said he would visit her the following week.", "answer": "the following", "source": "IMG_0729", "explanation": "間接話法でnext weekはthe following week(the next week)に変わる。", "relatedInfo": "last week→the week before / the previous week", "category": "話法・時制の一致"}, {"id": 249, "type": "choice", "question": "He told me he had bought the car five years _____ .", "hint": "彼はその車を5年前に買ったと私に言った", "fullSentence": "He told me he had bought the car five years before.", "answer": "before", "choices": ["before", "ago", "previously", "past"], "source": "IMG_0729", "explanation": "間接話法でagoはbeforeに変わる。", "relatedInfo": "時制の一致で全体が過去にシフトする。", "category": "話法・時制の一致"}, {"id": 250, "type": "fill", "question": "He asked me _____ I was going.", "hint": "彼はどこへ行くのか私に尋ねた(間接疑問)", "fullSentence": "He asked me where I was going.", "answer": "where", "source": "IMG_0728", "explanation": "ask+人+wh-節「〜かを尋ねる」間接疑問文は平叙文の語順。", "relatedInfo": "疑問詞のない疑問文はif/whetherを使う。", "category": "否定表現①"}, {"id": 251, "type": "choice", "question": "He asked me _____ I liked the movie.", "hint": "彼はその映画が気に入ったかどうか私に尋ねた", "fullSentence": "He asked me if I liked the movie.", "answer": "if", "choices": ["if", "that", "what", "which"], "source": "IMG_0738", "explanation": "ask+人+if[whether]「〜かどうかを尋ねる」。", "relatedInfo": "wonder if[whether] S V「〜かどうかと思う」も同型。", "category": "wonder/consist of等の語法"}, {"id": 252, "type": "fill", "question": "I _____ if he will come to the party.", "hint": "彼がパーティーに来るかどうかと思う", "fullSentence": "I wonder if he will come to the party.", "answer": "wonder", "source": "IMG_0738", "explanation": "wonder if S V「〜かどうかと思う」丁寧な疑問表現。", "relatedInfo": "I wonder whether S V も同義。", "category": "wonder/consist of等の語法"}, {"id": 253, "type": "choice", "question": "He _____ to be a doctor, but actually he is an engineer.", "hint": "彼は医者だとされているが、実は技師だ", "fullSentence": "He is supposed to be a doctor, but actually he is an engineer.", "answer": "is supposed", "choices": ["is supposed", "is hoped", "is wondered", "supposes"], "source": "IMG_0738", "explanation": "be supposed to do「〜だとされている、〜することになっている」。", "relatedInfo": "be supposed to do は義務のニュアンスでもよく使われる。", "category": "wonder/consist of等の語法"}, {"id": 254, "type": "fill", "question": "You are _____ to be quiet in the library.", "hint": "図書館では静かにすることになっている", "fullSentence": "You are supposed to be quiet in the library.", "answer": "supposed", "source": "IMG_0738", "explanation": "be supposed to do「〜することになっている」規則・義務。", "relatedInfo": "You are not supposed to do that.「それをしてはいけないことになっている」", "category": "wonder/consist of等の語法"}, {"id": 255, "type": "choice", "question": "The committee _____ of ten members.", "hint": "その委員会は10人のメンバーで構成されている", "fullSentence": "The committee consists of ten members.", "answer": "consists", "choices": ["consists", "comprises", "includes", "is made"], "source": "IMG_0738", "explanation": "consist of「〜から構成される」(受動態にしない)。", "relatedInfo": "comprise「〜を構成する」は他動詞でofを伴わない。", "category": "wonder/consist of等の語法"}, {"id": 256, "type": "fill", "question": "The team _____ ten players.", "hint": "そのチームは10人の選手から成る(comprise)", "fullSentence": "The team comprises ten players.", "answer": "comprises", "source": "IMG_0738", "explanation": "comprise「〜から成る」他動詞なので直接目的語をとる。", "relatedInfo": "= is comprised of ten players(受動態も可能)", "category": "wonder/consist of等の語法"}, {"id": 257, "type": "choice", "question": "The committee _____ of a chairman and ten members.", "hint": "その委員会は議長と10人の委員で構成されている", "fullSentence": "The committee is made up of a chairman and ten members.", "answer": "is made up", "choices": ["is made up", "is comprised", "consists", "includes"], "source": "IMG_0738", "explanation": "be made up of「〜で構成される」= consist of。", "relatedInfo": "comprise ofとは言わない点に注意(comprise自体が他動詞)。", "category": "wonder/consist of等の語法"}, {"id": 258, "type": "fill", "question": "The price _____ tax.", "hint": "その値段には税金が含まれている", "fullSentence": "The price includes tax.", "answer": "includes", "source": "IMG_0738", "explanation": "include「〜を含む」直接目的語をとる他動詞。", "relatedInfo": "contain「(中に)〜を含む」も類義だが物理的内包を表すことが多い。", "category": "wonder/consist of等の語法"}, {"id": 259, "type": "choice", "question": "This plan _____ some risk.", "hint": "この計画にはいくらかリスクが伴う", "fullSentence": "This plan involves some risk.", "answer": "involves", "choices": ["involves", "includes", "consists", "comprises"], "source": "IMG_0738", "explanation": "involve「〜を伴う、含む」。", "relatedInfo": "A involves B「AにはBが伴う」の形で頻出。", "category": "wonder/consist of等の語法"}, {"id": 260, "type": "fill", "question": "He _____ a great baseball team on our high school.", "hint": "彼は私たちの高校にすごい野球チームを作り上げた", "fullSentence": "He set up a great baseball team on our high school.", "answer": "set up", "source": "IMG_0738", "explanation": "set up「〜を設立する」。", "relatedInfo": "文脈により建てる・確立するの意味で使われる。", "category": "wonder/consist of等の語法"}, {"id": 261, "type": "fill", "question": "Would you _____ opening the window?", "hint": "窓を開けていただけませんか", "fullSentence": "Would you mind opening the window?", "answer": "mind", "source": "IMG_0731", "explanation": "mind doing「〜するのを嫌がる」Would you mind doing?で丁寧な依頼になる。", "relatedInfo": "答え方はNo(構いません)/ I'm afraid I would(困ります)。", "category": "動名詞・不定詞をとる動詞"}, {"id": 262, "type": "choice", "question": "He gave up _____ smoking.", "hint": "彼はタバコをやめた", "fullSentence": "He gave up smoking.", "answer": "smoking", "choices": ["smoking", "to smoke", "smoke", "smoked"], "source": "IMG_0731", "explanation": "give up doing「〜するのをやめる」動名詞のみをとる動詞。", "relatedInfo": "stop, finish, avoid, denyなども動名詞のみをとる。", "category": "動名詞・不定詞をとる動詞"}, {"id": 263, "type": "fill", "question": "He denied _____ the money.", "hint": "彼はそのお金を盗んだことを否定した", "fullSentence": "He denied stealing the money.", "answer": "stealing", "source": "IMG_0731", "explanation": "deny doing「〜したことを否定する」。", "relatedInfo": "admit doing「〜したことを認める」も同型。", "category": "動名詞・不定詞をとる動詞"}, {"id": 264, "type": "choice", "question": "I can't help _____ that he is right.", "hint": "彼が正しいと思わざるを得ない", "fullSentence": "I can't help thinking that he is right.", "answer": "thinking", "choices": ["thinking", "to think", "think", "thought"], "source": "IMG_0731", "explanation": "cannot help doing「〜せざるを得ない」の復習。", "relatedInfo": "= cannot help but think", "category": "動名詞・不定詞をとる動詞"}, {"id": 265, "type": "fill", "question": "I miss _____ in Paris when I was young.", "hint": "若い頃パリに住んでいたことを懐かしく思う", "fullSentence": "I miss living in Paris when I was young.", "answer": "living", "source": "IMG_0731", "explanation": "miss doing「〜したことを懐かしく思う、〜し損なう」文脈により意味が変わる。", "relatedInfo": "miss doing「〜しそこなう」の意味もある(miss the train seeing等)。", "category": "動名詞・不定詞をとる動詞"}, {"id": 266, "type": "choice", "question": "He _____ he had finished the report.", "hint": "彼はその報告書を終えたふりをした", "fullSentence": "He pretended he had finished the report.", "answer": "pretended", "choices": ["pretended", "hoped", "desired", "promised"], "source": "IMG_0732", "explanation": "pretend that S V「〜だとふりをする」。pretend to doも可。", "relatedInfo": "pretend to have pp「〜したふりをする」完了不定詞も使える。", "category": "動名詞・不定詞をとる動詞"}, {"id": 267, "type": "fill", "question": "He decided _____ abroad next year.", "hint": "彼は来年海外へ行くことを決めた", "fullSentence": "He decided to go abroad next year.", "answer": "to go", "source": "IMG_0731", "explanation": "decide to do「〜することを決める」不定詞のみをとる動詞。", "relatedInfo": "want, hope, promise, expect, wish, refuseなども不定詞のみをとる。", "category": "動名詞・不定詞をとる動詞"}, {"id": 268, "type": "choice", "question": "He _____ to help me with my homework.", "hint": "彼は宿題を手伝うと約束した", "fullSentence": "He promised to help me with my homework.", "answer": "promised", "choices": ["promised", "enjoyed", "avoided", "finished"], "source": "IMG_0731", "explanation": "promise to do「〜すると約束する」不定詞をとる動詞。", "relatedInfo": "promiseは動名詞は取らない点に注意。", "category": "動名詞・不定詞をとる動詞"}, {"id": 269, "type": "fill", "question": "He begins Megafeps: mind, enjoy, give up, avoid, deny, consider, finish, stop, practice, resist, mind, miss, suggest, recommend, admit +ing / want, expect, decide, hope, promise, desire, seek, wish, agree, choose, manage, hesitate, refuse +to _____ .", "hint": "MegafepsグループはM(mind)E(enjoy)G(give up)A(avoid)F(finish)E(escape)P(postpone)S(stop/suggest)+動名詞をとる代表動詞群", "fullSentence": "He suggested going to the movies.", "answer": "going", "source": "IMG_0732", "explanation": "Megafeps動詞は動名詞のみを目的語にとる(mind, enjoy, give up, avoid, finish, escape, postpone, stop, suggest等)。", "relatedInfo": "want, expect, decide, hope, promiseなどは不定詞のみをとるグループ。", "category": "動名詞・不定詞をとる動詞"}, {"id": 270, "type": "choice", "question": "He is _____ to like music, but he prefers sports.", "hint": "彼は音楽が好きだと思われがちだが、実はスポーツの方が好きだ", "fullSentence": "He is supposed to like music, but he prefers sports.", "answer": "supposed", "choices": ["supposed", "expected", "desired", "hoped"], "source": "IMG_0732", "explanation": "be supposed to do の応用。", "relatedInfo": "prefer A to B「BよりAを好む」の復習も含む。", "category": "動名詞・不定詞をとる動詞"}, {"id": 271, "type": "fill", "question": "He began to cry / began _____ .", "hint": "彼は泣き始めた(begin+to doもdoingも可)", "fullSentence": "He began crying.", "answer": "crying", "source": "IMG_0732", "explanation": "begin, start, continue, ceaseは不定詞・動名詞どちらも目的語にとれる。", "relatedInfo": "意味の違いはほとんどないが、状態動詞の場合は不定詞が好まれる。", "category": "動名詞・不定詞をとる動詞"}, {"id": 272, "type": "choice", "question": "I would _____ stay home than go out.", "hint": "出かけるよりむしろ家にいたい(復習)", "fullSentence": "I would like to stay home rather than go out.", "answer": "like to", "choices": ["like to", "rather to", "prefer", "love"], "source": "IMG_0732", "explanation": "would like to do「〜したい」丁寧な願望表現。", "relatedInfo": "would rather do than doとの違いに注意。", "category": "動名詞・不定詞をとる動詞"}, {"id": 273, "type": "fill", "question": "His parents allowed him _____ abroad.", "hint": "彼の両親は彼が海外に行くことを許した", "fullSentence": "His parents allowed him to go abroad.", "answer": "to go", "source": "IMG_0733", "explanation": "allow+O+to do「Oが〜するのを許す」SVOC不定詞パターン。", "relatedInfo": "enable, cause, encourage, compel, force, expect, invite, oblige, permit, remind, require, wantなども同型。", "category": "使役的SVOC・that S should V"}, {"id": 274, "type": "choice", "question": "The heavy rain _____ the game to be cancelled.", "hint": "大雨のせいで試合は中止になった", "fullSentence": "The heavy rain caused the game to be cancelled.", "answer": "caused", "choices": ["caused", "made", "let", "had"], "source": "IMG_0733", "explanation": "cause+O+to do「Oに〜させる、原因となる」。", "relatedInfo": "makeは原形不定詞をとるがcauseはto doをとる点に注意。", "category": "使役的SVOC・that S should V"}, {"id": 275, "type": "fill", "question": "What _____ him change his mind?", "hint": "何が彼の考えを変えさせたのか(原形不定詞)", "fullSentence": "What made him change his mind?", "answer": "made", "source": "IMG_0733", "explanation": "make+O+原形「Oに〜させる」使役動詞。", "relatedInfo": "= What caused him to change his mind?", "category": "使役的SVOC・that S should V"}, {"id": 276, "type": "choice", "question": "The teacher encouraged the students _____ harder.", "hint": "先生は生徒たちにもっと頑張るよう励ました", "fullSentence": "The teacher encouraged the students to study harder.", "answer": "to study", "choices": ["to study", "study", "studying", "studied"], "source": "IMG_0733", "explanation": "encourage+O+to do「Oが〜するよう励ます」。", "relatedInfo": "compel, force+O+to do「強制的に〜させる」も同型。", "category": "使役的SVOC・that S should V"}, {"id": 277, "type": "fill", "question": "He reminded me _____ lock the door.", "hint": "彼は私にドアの鍵を閉めるよう念を押した", "fullSentence": "He reminded me to lock the door.", "answer": "to", "source": "IMG_0733", "explanation": "remind+O+to do「Oに〜するよう念を押す」。", "relatedInfo": "remind A of B「AにBを思い出させる」との違いに注意。", "category": "使役的SVOC・that S should V"}, {"id": 278, "type": "choice", "question": "The doctor advised him _____ smoking.", "hint": "医者は彼に禁煙するよう忠告した", "fullSentence": "The doctor advised him to stop smoking.", "answer": "to stop", "choices": ["to stop", "stop", "stopping", "stopped"], "source": "IMG_0733", "explanation": "advise+O+to do「Oに〜するよう忠告する」。", "relatedInfo": "persuade, warn+O+to do も同型。", "category": "使役的SVOC・that S should V"}, {"id": 279, "type": "fill", "question": "He insisted that she _____ present at the meeting.", "hint": "彼は彼女がその会議に出席すべきだと主張した", "fullSentence": "He insisted that she be present at the meeting.", "answer": "be", "source": "IMG_0733", "explanation": "insist that S (should) V「〜すべきだと主張する」要求・提案系動詞の後は動詞の原形(should省略可)。", "relatedInfo": "propose, demand, suggest, order, require, requestなども同型。", "category": "使役的SVOC・that S should V"}, {"id": 280, "type": "choice", "question": "The doctor suggested that he _____ more rest.", "hint": "医者は彼がもっと休むべきだと提案した", "fullSentence": "The doctor suggested that he take more rest.", "answer": "take", "choices": ["take", "takes", "took", "taking"], "source": "IMG_0733", "explanation": "suggest that S (should) V「〜すべきだと提案する」原形または should+原形。", "relatedInfo": "suggest to do とは言わない(不定詞は不可)点に注意。", "category": "使役的SVOC・that S should V"}, {"id": 281, "type": "fill", "question": "It is necessary that he _____ study harder.", "hint": "彼はもっと勉強する必要がある", "fullSentence": "It is necessary that he should study harder.", "answer": "should", "source": "IMG_0733", "explanation": "It is necessary that S (should) V「〜する必要がある」。necessary, important, essential, vital, critical, crucialなどの形容詞の後も同型。", "relatedInfo": "= It is necessary for him to study harder.", "category": "使役的SVOC・that S should V"}, {"id": 282, "type": "choice", "question": "It is essential that every student _____ this rule.", "hint": "すべての生徒がこの規則に従うことが不可欠だ", "fullSentence": "It is essential that every student follow this rule.", "answer": "follow", "choices": ["follow", "follows", "followed", "following"], "source": "IMG_0733", "explanation": "It is essential that S (should) V の応用。動詞は原形。", "relatedInfo": "important, vital, crucialも同じパターンで使われる。", "category": "使役的SVOC・that S should V"}, {"id": 283, "type": "fill", "question": "She _____ pale when she heard the news.", "hint": "彼女はその知らせを聞いて青ざめた", "fullSentence": "She turned pale when she heard the news.", "answer": "turned", "source": "IMG_0734", "explanation": "turn+C「〜になる」変化を表すSVC動詞。", "relatedInfo": "go, become, get, come, growなども変化を表す。", "category": "自動詞・他動詞の語法"}, {"id": 284, "type": "choice", "question": "His dream _____ true after years of hard work.", "hint": "何年もの努力の末、彼の夢は実現した", "fullSentence": "His dream came true after years of hard work.", "answer": "came true", "choices": ["came true", "became true", "went true", "got true"], "source": "IMG_0734", "explanation": "come true「(夢などが)実現する」come+Cの慣用表現。", "relatedInfo": "= be realized", "category": "自動詞・他動詞の語法"}, {"id": 285, "type": "fill", "question": "He will _____ a great doctor someday.", "hint": "彼はいつか偉大な医者になるだろう", "fullSentence": "He will become a great doctor someday.", "answer": "become", "source": "IMG_0734", "explanation": "become+C「〜になる」。", "relatedInfo": "名詞のCをとるのはbecome, remain, get(getは形容詞が多い)。", "category": "自動詞・他動詞の語法"}, {"id": 286, "type": "choice", "question": "He _____ married to a famous actress.", "hint": "彼は有名な女優と結婚した", "fullSentence": "He got married to a famous actress.", "answer": "got", "choices": ["got", "became", "turned", "went"], "source": "IMG_0734", "explanation": "get married to A「Aと結婚する」getは変化・動作の受け身的な表現でよく使う。", "relatedInfo": "be married to A「Aと結婚している」状態を表す。", "category": "自動詞・他動詞の語法"}, {"id": 287, "type": "fill", "question": "He _____ his mother in appearance.", "hint": "彼は外見が母親に似ている", "fullSentence": "He resembles his mother in appearance.", "answer": "resembles", "source": "IMG_0734", "explanation": "resemble「〜に似ている」他動詞で受動態にしにくい状態動詞。", "relatedInfo": "take after A「(性質が)Aに似ている」も類義。", "category": "自動詞・他動詞の語法"}, {"id": 288, "type": "choice", "question": "She _____ him about his plans for the future.", "hint": "彼女は彼の将来の計画について尋ねた", "fullSentence": "She discussed his plans for the future with him.", "answer": "discussed his plans for the future with", "choices": ["discussed his plans for the future with", "discussed with him about", "discussed about", "talked his plans"], "source": "IMG_0734", "explanation": "discuss「〜について話し合う」他動詞でaboutは不要。discuss A with B の形で使う。", "relatedInfo": "discuss about とは言わない点に注意(頻出誤り)。", "category": "自動詞・他動詞の語法"}, {"id": 289, "type": "fill", "question": "Please don't _____ this problem to anyone.", "hint": "この問題については誰にも言及しないでください", "fullSentence": "Please don't mention this problem to anyone.", "answer": "mention", "source": "IMG_0734", "explanation": "mention「〜について言及する」他動詞でaboutは不要。", "relatedInfo": "mention A to B「BにAについて話す」", "category": "自動詞・他動詞の語法"}, {"id": 290, "type": "choice", "question": "He _____ the professor after the lecture.", "hint": "彼は講義の後、教授に近づいた", "fullSentence": "He approached the professor after the lecture.", "answer": "approached", "choices": ["approached", "approached to", "approached with", "approached at"], "source": "IMG_0734", "explanation": "approach「〜に近づく」他動詞でtoは不要。", "relatedInfo": "attend, enter, marry, resembleなども他動詞でtoやinをつけない頻出の間違いやすい動詞群。", "category": "自動詞・他動詞の語法"}, {"id": 291, "type": "fill", "question": "He _____ the meeting yesterday.", "hint": "彼は昨日その会議に出席した", "fullSentence": "He attended the meeting yesterday.", "answer": "attended", "source": "IMG_0734", "explanation": "attend「〜に出席する」他動詞。attend toは「〜に対応する、世話をする」と別の意味になる。", "relatedInfo": "attend to A「Aの世話をする、Aに注意を払う」", "category": "自動詞・他動詞の語法"}, {"id": 292, "type": "choice", "question": "She _____ the room quietly.", "hint": "彼女は静かに部屋に入った", "fullSentence": "She entered the room quietly.", "answer": "entered", "choices": ["entered", "entered into", "entered in", "entered to"], "source": "IMG_0734", "explanation": "enter「〜に入る」他動詞でintoは不要(enter into a contract「契約を結ぶ」は別の熟語)。", "relatedInfo": "enter into「(抽象的なもの)を始める、着手する」", "category": "自動詞・他動詞の語法"}, {"id": 293, "type": "fill", "question": "He _____ his brother's advice.", "hint": "彼は兄の助言に反対した", "fullSentence": "He argued with his brother's advice.", "answer": "argued", "source": "IMG_0734", "explanation": "argue with A about B「AとBについて議論する」動詞パターン確認。", "relatedInfo": "argue against「〜に反対して議論する」", "category": "自動詞・他動詞の語法"}, {"id": 294, "type": "choice", "question": "He _____ from the university last spring.", "hint": "彼はこの前の春に大学を卒業した", "fullSentence": "He graduated from the university last spring.", "answer": "graduated", "choices": ["graduated", "graduated at", "graduated in", "was graduated"], "source": "IMG_0734", "explanation": "graduate from「〜を卒業する」。", "relatedInfo": "アメリカ英語ではbe graduated fromの形も使われることがある。", "category": "自動詞・他動詞の語法"}, {"id": 295, "type": "fill", "question": "He _____ in persuading her to come.", "hint": "彼は彼女を説得して来させることに成功した", "fullSentence": "He succeeded in persuading her to come.", "answer": "succeeded", "source": "IMG_0734", "explanation": "succeed in doing「〜することに成功する」。", "relatedInfo": "succeed to「(地位など)を継承する」と混同しないよう注意。", "category": "自動詞・他動詞の語法"}, {"id": 296, "type": "choice", "question": "We finally _____ the airport at midnight.", "hint": "私たちはついに深夜に空港に着いた", "fullSentence": "We finally arrived at the airport at midnight.", "answer": "arrived at", "choices": ["arrived at", "arrived to", "arrived in Osaka city", "reached to"], "source": "IMG_0734", "explanation": "arrive at+狭い場所/arrive in+広い場所「〜に到着する」。", "relatedInfo": "reach「〜に到着する」は他動詞で前置詞不要。", "category": "自動詞・他動詞の語法"}, {"id": 297, "type": "fill", "question": "How can I _____ the station from here?", "hint": "ここから駅にどう行けばいいですか", "fullSentence": "How can I get to the station from here?", "answer": "get", "source": "IMG_0734", "explanation": "get to「〜に着く」自動詞句。", "relatedInfo": "reach「〜に着く」は他動詞で前置詞不要という違いに注意。", "category": "自動詞・他動詞の語法"}, {"id": 298, "type": "choice", "question": "The sun _____ in the east.", "hint": "太陽は東から昇る(自動詞rise)", "fullSentence": "The sun rises in the east.", "answer": "rises", "choices": ["rises", "raises", "rose", "raised"], "source": "IMG_0735", "explanation": "rise「昇る」自動詞(rise-rose-risen)。raise「〜を上げる」他動詞(raise-raised-raised)。", "relatedInfo": "He raised his hand.(他動詞) / Prices rose.(自動詞)", "category": "不規則変化・SVOO"}, {"id": 299, "type": "fill", "question": "She _____ the book on the table.", "hint": "彼女はその本をテーブルの上に置いた(他動詞lay)", "fullSentence": "She laid the book on the table.", "answer": "laid", "source": "IMG_0735", "explanation": "lay「〜を置く」他動詞(lay-laid-laid)。lie「横たわる」自動詞(lie-lay-lain)と混同しやすい。", "relatedInfo": "He lay on the bed.(自動詞lieの過去形)", "category": "不規則変化・SVOO"}, {"id": 300, "type": "choice", "question": "He _____ on the bed for an hour.", "hint": "彼は1時間ベッドに横になっていた(自動詞lie)", "fullSentence": "He lay on the bed for an hour.", "answer": "lay", "choices": ["lay", "laid", "lied", "lain"], "source": "IMG_0735", "explanation": "lie(横たわる)の過去形はlay。lay(〜を置く)の過去形もlaidであり紛らわしい。", "relatedInfo": "lie-lay-lain(自動詞) / lay-laid-laid(他動詞)", "category": "不規則変化・SVOO"}, {"id": 301, "type": "fill", "question": "Will you do me _____ favor?", "hint": "お願いを一つ聞いてもらえますか", "fullSentence": "Will you do me a favor?", "answer": "a", "source": "IMG_0735", "explanation": "do A a favor「Aの頼みを聞く」= do a favor for A。", "relatedInfo": "May I ask a favor of you? も類義表現。", "category": "不規則変化・SVOO"}, {"id": 302, "type": "choice", "question": "It _____ me ten dollars to fix the bike.", "hint": "自転車を直すのに10ドルかかった", "fullSentence": "It cost me ten dollars to fix the bike.", "answer": "cost", "choices": ["cost", "took", "spent", "charged"], "source": "IMG_0735", "explanation": "It costs A+金額+to do「Aが〜するのに(金額)かかる」。", "relatedInfo": "It takes A+時間+to do「Aが〜するのに(時間)かかる」との違いに注意。", "category": "不規則変化・SVOO"}, {"id": 303, "type": "fill", "question": "It _____ me two hours to finish the homework.", "hint": "宿題を終えるのに2時間かかった", "fullSentence": "It took me two hours to finish the homework.", "answer": "took", "source": "IMG_0735", "explanation": "It takes A+時間+to do「Aが〜するのに(時間)がかかる」。", "relatedInfo": "costは金銭、takeは時間・労力に使う。", "category": "不規則変化・SVOO"}, {"id": 304, "type": "choice", "question": "The bookstore _____ me $20 for the book.", "hint": "その本屋は本代として20ドル私に請求した", "fullSentence": "The bookstore charged me $20 for the book.", "answer": "charged", "choices": ["charged", "cost", "spent", "paid"], "source": "IMG_0735", "explanation": "charge A B for C「AにCの代金としてBを請求する」。", "relatedInfo": "chargeの主語は請求する側(店)である点に注意。", "category": "不規則変化・SVOO"}, {"id": 305, "type": "fill", "question": "That will _____ us a lot of trouble.", "hint": "それは私たちの多くの手間を省いてくれるだろう", "fullSentence": "That will save us a lot of trouble.", "answer": "save", "source": "IMG_0735", "explanation": "save A B「AのBを省く、AにBを節約させる」。", "relatedInfo": "spare A B も同義で「AにBを割く/省かせる」。", "category": "不規則変化・SVOO"}, {"id": 306, "type": "choice", "question": "The accident _____ him of his eyesight.", "hint": "その事故は彼から視力を奪った", "fullSentence": "The accident deprived him of his eyesight.", "answer": "deprived", "choices": ["deprived", "robbed", "stole", "informed"], "source": "IMG_0736", "explanation": "deprive A of B「AからBを奪う」SV A of B型動詞。", "relatedInfo": "rob A of B「AからBを奪う(強盗のニュアンス)」も同型。", "category": "動詞+前置詞パターン"}, {"id": 307, "type": "fill", "question": "The thief _____ him of his wallet.", "hint": "泥棒は彼から財布を奪った", "fullSentence": "The thief robbed him of his wallet.", "answer": "robbed", "source": "IMG_0736", "explanation": "rob A of B「AからBを奪う」。steal Bとの語法の違いに注意(steal+物、rob+人)。", "relatedInfo": "= steal his wallet from him", "category": "動詞+前置詞パターン"}, {"id": 308, "type": "choice", "question": "The doctor _____ him of the danger of smoking.", "hint": "医者は彼に喫煙の危険性を知らせた", "fullSentence": "The doctor informed him of the danger of smoking.", "answer": "informed", "choices": ["informed", "convinced", "reminded", "robbed"], "source": "IMG_0736", "explanation": "inform A of B「AにBを知らせる」SV A of B型動詞。", "relatedInfo": "remind A of B「AにBを思い出させる」も同型。", "category": "動詞+前置詞パターン"}, {"id": 309, "type": "fill", "question": "This song _____ me of my childhood.", "hint": "この歌は私に子供時代を思い出させる", "fullSentence": "This song reminds me of my childhood.", "answer": "reminds", "source": "IMG_0736", "explanation": "remind A of B「AにBを思い出させる」。", "relatedInfo": "remind A to do「Aに〜するよう念を押す」との違いに注意。", "category": "動詞+前置詞パターン"}, {"id": 310, "type": "choice", "question": "We could not _____ him from going out in the storm.", "hint": "私たちは彼が嵐の中出かけるのを止められなかった", "fullSentence": "We could not prevent him from going out in the storm.", "answer": "prevent", "choices": ["prevent", "provide", "inform", "remind"], "source": "IMG_0736", "explanation": "prevent A from doing「Aが〜するのを妨げる」SV A from doing型動詞。", "relatedInfo": "stop, prohibit, discourage+A+from doingも同型。", "category": "動詞+前置詞パターン"}, {"id": 311, "type": "fill", "question": "The rule _____ students from using smartphones in class.", "hint": "その規則は生徒が授業中スマホを使うのを禁じている", "fullSentence": "The rule prohibits students from using smartphones in class.", "answer": "prohibits", "source": "IMG_0736", "explanation": "prohibit A from doing「Aが〜するのを禁止する」。", "relatedInfo": "= forbid A to do(forbidはto不定詞をとる点に注意)", "category": "動詞+前置詞パターン"}, {"id": 312, "type": "choice", "question": "His parents _____ him from studying abroad.", "hint": "彼の両親は彼が海外留学するのを思いとどまらせた", "fullSentence": "His parents discouraged him from studying abroad.", "answer": "discouraged", "choices": ["discouraged", "encouraged", "prevented", "provided"], "source": "IMG_0736", "explanation": "discourage A from doing「Aに〜するのを思いとどまらせる」。", "relatedInfo": "encourage A to do「Aに〜するよう励ます」は反意表現。", "category": "動詞+前置詞パターン"}, {"id": 313, "type": "fill", "question": "The company _____ its employees with health insurance.", "hint": "その会社は従業員に健康保険を提供している", "fullSentence": "The company provides its employees with health insurance.", "answer": "provides", "source": "IMG_0736", "explanation": "provide A with B「AにBを提供する」SV A with B型動詞。", "relatedInfo": "= provide B for A(順番を入れ替えることも可能)", "category": "動詞+前置詞パターン"}, {"id": 314, "type": "choice", "question": "She _____ the child with a new toy.", "hint": "彼女はその子供に新しいおもちゃを贈った", "fullSentence": "She presented the child with a new toy.", "answer": "presented", "choices": ["presented", "provided", "supplied", "compared"], "source": "IMG_0736", "explanation": "present A with B「AにBを贈呈する」。", "relatedInfo": "present B to A の語順もある。", "category": "動詞+前置詞パターン"}, {"id": 315, "type": "fill", "question": "He _____ the copy with the original.", "hint": "彼はコピーを原本と比較した", "fullSentence": "He compared the copy with the original.", "answer": "compared", "source": "IMG_0736", "explanation": "compare A with B「AをBと比較する」。", "relatedInfo": "compare A to B「AをBに例える」と意味が異なる点に注意。", "category": "動詞+前置詞パターン"}, {"id": 316, "type": "choice", "question": "The farm _____ the town with fresh vegetables.", "hint": "その農場は町に新鮮な野菜を供給している", "fullSentence": "The farm supplies the town with fresh vegetables.", "answer": "supplies", "choices": ["supplies", "shares", "presents", "provides for"], "source": "IMG_0736", "explanation": "supply A with B「AにBを供給する」。", "relatedInfo": "= supply B to A", "category": "動詞+前置詞パターン"}, {"id": 317, "type": "fill", "question": "He _____ his lunch with his classmates.", "hint": "彼は昼食をクラスメートと分け合った", "fullSentence": "He shared his lunch with his classmates.", "answer": "shared", "source": "IMG_0736", "explanation": "share A with B「AをBと共有する」。", "relatedInfo": "share the same idea with A も頻出パターン。", "category": "動詞+前置詞パターン"}, {"id": 318, "type": "choice", "question": "He _____ the reason for his absence to the teacher.", "hint": "彼は欠席の理由を先生に説明した", "fullSentence": "He explained the reason for his absence to the teacher.", "answer": "explained", "choices": ["explained", "explained to", "described to", "informed"], "source": "IMG_0737", "explanation": "explain A to B「AをBに説明する」他動詞でexplain A Bとは言わない点に注意。", "relatedInfo": "explain to B that S V の形もよく使う。", "category": "動詞+前置詞パターン"}, {"id": 319, "type": "fill", "question": "He _____ the man his plans for the future.", "hint": "彼はその男に将来の計画を説明した", "fullSentence": "He explained his plans for the future to the man.", "answer": "explained his plans for the future to", "source": "IMG_0737", "explanation": "explain A to B の語順、explain B Aとは言わない(explainはSVOOをとらない)。", "relatedInfo": "tell, show, give等はSVOOをとるがexplain, describe, suggest, announceはSVOOをとらない。", "category": "動詞+前置詞パターン"}, {"id": 320, "type": "choice", "question": "He _____ me of his innocence.", "hint": "彼は自分の無実を私に納得させた", "fullSentence": "He convinced me of his innocence.", "answer": "convinced", "choices": ["convinced", "informed", "persuaded to", "explained"], "source": "IMG_0736", "explanation": "convince A of B「AにBを納得させる」。", "relatedInfo": "persuade A of B も類義(convinceの方が確信させる意味合いが強い)。", "category": "動詞+前置詞パターン"}, {"id": 321, "type": "fill", "question": "He _____ me for being late.", "hint": "彼は遅刻したことで私を非難した", "fullSentence": "He blamed me for being late.", "answer": "blamed", "source": "IMG_0737", "explanation": "blame A for B「BのことでAを非難する」SV A for B型動詞。", "relatedInfo": "= blame B on A(逆の語順の表現)", "category": "動詞+前置詞パターン"}, {"id": 322, "type": "choice", "question": "She _____ him of stealing the money.", "hint": "彼女は彼がお金を盗んだと非難した", "fullSentence": "She accused him of stealing the money.", "answer": "accused", "choices": ["accused", "blamed", "criticized", "charged for"], "source": "IMG_0737", "explanation": "accuse A of B「BのことでAを非難する、告訴する」。", "relatedInfo": "= criticize A for B", "category": "動詞+前置詞パターン"}, {"id": 323, "type": "fill", "question": "I _____ you for your kindness.", "hint": "あなたの親切に感謝します", "fullSentence": "I thank you for your kindness.", "answer": "thank", "source": "IMG_0737", "explanation": "thank A for B「BのことでAに感謝する」。", "relatedInfo": "be thankful[grateful] for B も類義。", "category": "動詞+前置詞パターン"}, {"id": 324, "type": "choice", "question": "I really _____ your help.", "hint": "あなたの助けに本当に感謝している", "fullSentence": "I really appreciate your help.", "answer": "appreciate", "choices": ["appreciate", "thank", "obliged", "grateful"], "source": "IMG_0737", "explanation": "appreciate+目的語「〜に感謝する」他動詞でappreciate youとは言わない(物事が目的語)。", "relatedInfo": "be obliged to A for B「BのことでAに感謝している」", "category": "動詞+前置詞パターン"}, {"id": 325, "type": "fill", "question": "Could you _____ me to the station?", "hint": "駅まで連れて行ってもらえますか", "fullSentence": "Could you take me to the station?", "answer": "take", "source": "IMG_0737", "explanation": "take A to B「AをBに連れて行く」SV A to B型動詞。", "relatedInfo": "bring, owe, leave+A+to Bも同型。", "category": "動詞+前置詞パターン"}, {"id": 326, "type": "choice", "question": "I _____ my success to my parents' support.", "hint": "私の成功は両親の支えのおかげだ", "fullSentence": "I owe my success to my parents' support.", "answer": "owe", "choices": ["owe", "bring", "leave", "take"], "source": "IMG_0737", "explanation": "owe A to B「AはBのおかげである」。", "relatedInfo": "= My success is due to my parents' support.", "category": "動詞+前置詞パターン"}, {"id": 327, "type": "fill", "question": "Please _____ it to me to decide.", "hint": "それは私に決めさせてください", "fullSentence": "Please leave it to me to decide.", "answer": "leave", "source": "IMG_0737", "explanation": "leave A to B「AをBに任せる」。", "relatedInfo": "leave it to Aで「Aに任せる」の定番表現。", "category": "動詞+前置詞パターン"}, {"id": 328, "type": "choice", "question": "His room _____ a beautiful view of the sea.", "hint": "彼の部屋からは海の美しい景色が見渡せる", "fullSentence": "His room commands a beautiful view of the sea.", "answer": "commands", "choices": ["commands", "has", "provides", "supplies"], "source": "IMG_0737", "explanation": "command a view of「〜の眺めを見渡す」。", "relatedInfo": "= have a good command of「〜を自由に操る」とは別の意味なので注意。", "category": "動詞+前置詞パターン"}, {"id": 329, "type": "fill", "question": "He has a good _____ of English.", "hint": "彼は英語を自由自在に操る", "fullSentence": "He has a good command of English.", "answer": "command", "source": "IMG_0737", "explanation": "have a good command of「〜を自由に操る」語学力を表す慣用表現。", "relatedInfo": "command a view of「〜の眺めを見渡す」との混同に注意。", "category": "動詞+前置詞パターン"}, {"id": 330, "type": "choice", "question": "_____ people believe that story.", "hint": "その話を信じる人はほとんどいない(否定的)", "fullSentence": "Few people believe that story.", "answer": "Few", "choices": ["Few", "A few", "Little", "A little"], "source": "IMG_0739", "explanation": "few「(可算名詞に対し)ほとんど〜ない」否定的。a few「少しはある」肯定的。", "relatedInfo": "little/a littleは不可算名詞に使う。", "category": "紛らわしい語法・数量形容詞"}, {"id": 331, "type": "fill", "question": "I have _____ money, so I can lend you some.", "hint": "少しはお金があるので、少し貸せます(肯定的)", "fullSentence": "I have a little money, so I can lend you some.", "answer": "a little", "source": "IMG_0739", "explanation": "a little「少しはある」不可算名詞に使う肯定的表現。", "relatedInfo": "little「ほとんどない」否定的表現との違いに注意。", "category": "紛らわしい語法・数量形容詞"}, {"id": 332, "type": "choice", "question": "He is not _____ satisfied with the result.", "hint": "彼はその結果に少しも満足していない", "fullSentence": "He is not a little satisfied with the result.", "answer": "a little", "choices": ["a little", "little", "a few", "few"], "source": "IMG_0739", "explanation": "not a little「少なからず、大いに」実は強い肯定を表す慣用表現(=very much)。", "relatedInfo": "皮肉にも「少しも〜ない」の意味ではない点に注意。", "category": "紛らわしい語法・数量形容詞"}, {"id": 333, "type": "choice", "question": "His explanation is _____ from satisfactory.", "hint": "彼の説明は満足のいくものとはとても言えない", "fullSentence": "His explanation is far from satisfactory.", "answer": "far", "choices": ["far", "not a little", "quite a few", "little"], "source": "IMG_0739", "explanation": "far from「決して〜でない」の復習(be動詞+far from+形容詞)。", "relatedInfo": "= not at all satisfactory", "category": "紛らわしい語法・数量形容詞"}, {"id": 334, "type": "fill", "question": "This information is _____ (=useful) to us.", "hint": "この情報は私たちにとって有益だ", "fullSentence": "This information is useful to us.", "answer": "useful", "source": "IMG_0739", "explanation": "形容詞+to A「Aにとって〜だ」の基本パターン。", "relatedInfo": "be beneficial to Aも類義。", "category": "紛らわしい語法・数量形容詞"}, {"id": 335, "type": "choice", "question": "He is _____ to succeed in his new business.", "hint": "彼は新しい事業で成功しそうだ", "fullSentence": "He is likely to succeed in his new business.", "answer": "likely", "choices": ["likely", "alike", "sensible", "sensitive"], "source": "IMG_0739", "explanation": "be likely to do「〜しそうだ」。alikeは「似ている」(叙述用法のみ)。", "relatedInfo": "It is likely that S V も同義で使える。", "category": "紛らわしい語法・数量形容詞"}, {"id": 336, "type": "fill", "question": "These two paintings look _____ .", "hint": "この2枚の絵はよく似ている", "fullSentence": "These two paintings look alike.", "answer": "alike", "source": "IMG_0739", "explanation": "alike「似ている」叙述用法のみで使う形容詞(名詞の前には置けない)。", "relatedInfo": "a similar painting のように限定用法にはsimilarを使う。", "category": "紛らわしい語法・数量形容詞"}, {"id": 337, "type": "choice", "question": "He is _____ to other people's feelings.", "hint": "彼は他人の感情に敏感だ", "fullSentence": "He is sensitive to other people's feelings.", "answer": "sensitive", "choices": ["sensitive", "sensible", "respectable", "respectful"], "source": "IMG_0739", "explanation": "sensitive「敏感な、傷つきやすい」⇔sensible「分別のある、賢明な」紛らわしい語。", "relatedInfo": "He made a sensible decision.「彼は賢明な決定をした」", "category": "紛らわしい語法・数量形容詞"}, {"id": 338, "type": "fill", "question": "He is always _____ to his elders.", "hint": "彼はいつも年上の人に敬意を払っている", "fullSentence": "He is always respectful to his elders.", "answer": "respectful", "source": "IMG_0739", "explanation": "respectful「敬意を払う」⇔respectable「立派な、尊敬に値する」⇔respective「それぞれの」の3語の区別。", "relatedInfo": "They went to their respective homes.「彼らはそれぞれの家に帰った」", "category": "紛らわしい語法・数量形容詞"}, {"id": 339, "type": "choice", "question": "He comes from an _____ family.", "hint": "彼は立派な家庭の出身だ", "fullSentence": "He comes from a respectable family.", "answer": "respectable", "choices": ["respectable", "respectful", "respective", "respected"], "source": "IMG_0739", "explanation": "respectable「立派な、ちゃんとした」社会的評価を表す形容詞。", "relatedInfo": "respectful「(人に対して)敬意を払う」との違いに注意。", "category": "紛らわしい語法・数量形容詞"}, {"id": 340, "type": "fill", "question": "This city has many _____ facilities.", "hint": "この都市には多くの工業施設がある", "fullSentence": "This city has many industrial facilities.", "answer": "industrial", "source": "IMG_0739", "explanation": "industrial「工業の」⇔industrious「勤勉な」つづりが似ていて紛らわしい語。", "relatedInfo": "He is an industrious student.「彼は勤勉な学生だ」", "category": "紛らわしい語法・数量形容詞"}, {"id": 341, "type": "choice", "question": "He is an _____ worker who never gives up.", "hint": "彼は決してあきらめない勤勉な労働者だ", "fullSentence": "He is an industrious worker who never gives up.", "answer": "industrious", "choices": ["industrious", "industrial", "alive", "living"], "source": "IMG_0739", "explanation": "industrious「勤勉な」人の性質を表す。", "relatedInfo": "industrial「産業の、工業の」とはアクセントも意味も異なる。", "category": "紛らわしい語法・数量形容詞"}, {"id": 342, "type": "fill", "question": "My grandfather is still _____ at ninety.", "hint": "祖父は90歳でまだ生きている(叙述用法)", "fullSentence": "My grandfather is still alive at ninety.", "answer": "alive", "source": "IMG_0739", "explanation": "alive「生きている」叙述用法のみ(名詞の前には置けない)。", "relatedInfo": "a living creature「生きている生物」のように限定用法にはlivingを使う。", "category": "紛らわしい語法・数量形容詞"}, {"id": 343, "type": "choice", "question": "This museum has a _____ collection of ancient art.", "hint": "この博物館には古代美術のかなりの数のコレクションがある", "fullSentence": "This museum has a considerable collection of ancient art.", "answer": "considerable", "choices": ["considerable", "considerate", "cheap", "low"], "source": "IMG_0740", "explanation": "considerable「かなりの(量・数)」⇔considerate「思いやりのある」紛らわしい語。", "relatedInfo": "He is a considerate person.「彼は思いやりのある人だ」", "category": "紛らわしい語法(副詞)"}, {"id": 344, "type": "fill", "question": "He is always _____ of other people's feelings.", "hint": "彼はいつも他人の気持ちに配慮している", "fullSentence": "He is always considerate of other people's feelings.", "answer": "considerate", "source": "IMG_0740", "explanation": "considerate「思いやりのある」= thoughtful。", "relatedInfo": "be considerate of A「Aに対して思いやりがある」", "category": "紛らわしい語法(副詞)"}, {"id": 345, "type": "choice", "question": "London is _____ visiting at least once.", "hint": "ロンドンは少なくとも一度は訪れる価値がある", "fullSentence": "London is worth visiting at least once.", "answer": "worth", "choices": ["worth", "worthy", "worthwhile", "worthless"], "source": "IMG_0740", "explanation": "be worth doing「〜する価値がある」動名詞をとる。worthyはworthy of doingの形。", "relatedInfo": "It is worth while to visit London. も同義(=worthwhile)", "category": "紛らわしい語法(副詞)"}, {"id": 346, "type": "fill", "question": "It is worth _____ to visit the museum.", "hint": "その博物館を訪れる価値がある", "fullSentence": "It is worthwhile to visit the museum.", "answer": "while", "source": "IMG_0740", "explanation": "It is worthwhile to do「〜する価値がある」。", "relatedInfo": "= It is worth visiting the museum.", "category": "紛らわしい語法(副詞)"}, {"id": 347, "type": "choice", "question": "This antique vase is _____ ; it cannot be bought with money.", "hint": "この骨董品の花瓶は値段がつけられないほど貴重だ", "fullSentence": "This antique vase is priceless; it cannot be bought with money.", "answer": "priceless", "choices": ["priceless", "worthless", "priced", "costly"], "source": "IMG_0739", "explanation": "priceless「非常に貴重な(値段がつけられないほど)」= invaluable。", "relatedInfo": "worthless「価値がない」と対照的な意味を持つ。", "category": "紛らわしい語法・数量形容詞"}, {"id": 348, "type": "fill", "question": "His advice turned out to be _____ .", "hint": "彼の助言は無価値だと分かった", "fullSentence": "His advice turned out to be worthless.", "answer": "worthless", "source": "IMG_0739", "explanation": "worthless「無価値な」。", "relatedInfo": "priceless「非常に貴重な」と正反対の意味になる紛らわしい語。", "category": "紛らわしい語法・数量形容詞"}, {"id": 349, "type": "choice", "question": "He is _____ to speak three languages fluently.", "hint": "彼は3つの言語を流暢に話すことができる", "fullSentence": "He is able to speak three languages fluently.", "answer": "able", "choices": ["able", "possible", "capable", "impossible"], "source": "IMG_0739", "explanation": "be able to do「(人が)〜できる」。possibleは人を主語にしない点に注意。", "relatedInfo": "It is possible for him to do it. のように形式主語のitを使う。", "category": "紛らわしい語法・数量形容詞"}, {"id": 350, "type": "fill", "question": "He is _____ of solving this difficult problem.", "hint": "彼はこの難しい問題を解決する能力がある", "fullSentence": "He is capable of solving this difficult problem.", "answer": "capable", "source": "IMG_0739", "explanation": "be capable of doing「〜する能力がある」動名詞をとる。", "relatedInfo": "= be able to do(be able toは不定詞をとる)", "category": "紛らわしい語法・数量形容詞"}, {"id": 351, "type": "choice", "question": "It is _____ for him to finish the work in a day.", "hint": "彼がその仕事を1日で終えるのは不可能だ", "fullSentence": "It is impossible for him to finish the work in a day.", "answer": "impossible", "choices": ["impossible", "unable", "incapable", "disable"], "source": "IMG_0739", "explanation": "It is impossible for A to do「Aが〜するのは不可能だ」。unable/incapableは人を主語にする形容詞。", "relatedInfo": "= He is unable to finish the work in a day.", "category": "紛らわしい語法・数量形容詞"}, {"id": 352, "type": "fill", "question": "He stopped by his parents' house _____ his way home.", "hint": "彼は家に帰る途中、両親の家に立ち寄った", "fullSentence": "He stopped by his parents' house on his way home.", "answer": "on", "source": "IMG_0740", "explanation": "on one's way home「家に帰る途中で」。", "relatedInfo": "on the way to A「Aへ行く途中で」", "category": "紛らわしい語法(副詞)"}, {"id": 353, "type": "choice", "question": "He decided to go _____ to study English.", "hint": "彼は英語を学ぶために海外へ行くことを決めた", "fullSentence": "He decided to go abroad to study English.", "answer": "abroad", "choices": ["abroad", "to abroad", "in abroad", "on abroad"], "source": "IMG_0740", "explanation": "go abroad「海外へ行く」abroadは副詞なので前置詞不要。", "relatedInfo": "live abroad「海外に住む」も同様に前置詞をつけない。", "category": "紛らわしい語法(副詞)"}, {"id": 354, "type": "fill", "question": "The baby was _____ asleep in her arms.", "hint": "赤ちゃんは彼女の腕の中でぐっすり眠っていた", "fullSentence": "The baby was fast asleep in her arms.", "answer": "fast", "source": "IMG_0740", "explanation": "fast asleep「ぐっすり眠って」= sound asleep。", "relatedInfo": "fall fast asleep「ぐっすり眠り込む」", "category": "紛らわしい語法(副詞)"}, {"id": 355, "type": "choice", "question": "He is _____ taller than his younger brother.", "hint": "彼は弟よりずっと背が高い(比較級の強調)", "fullSentence": "He is much taller than his younger brother.", "answer": "much", "choices": ["much", "very", "so", "too"], "source": "IMG_0740", "explanation": "比較級の強調はmuch, far, evenなど(veryは不可)。", "relatedInfo": "He is much too tall.のようにtooの強調にはmuchを使う。", "category": "紛らわしい語法(副詞)"}, {"id": 356, "type": "fill", "question": "I _____ (=want/miss) my family very much while abroad.", "hint": "海外にいる間、家族がとても恋しかった", "fullSentence": "I badly missed my family while abroad.", "answer": "badly", "source": "IMG_0740", "explanation": "badly「ひどく、とても」の意味でmiss, want, needを強める副詞。", "relatedInfo": "= I missed my family very much.", "category": "紛らわしい語法(副詞)"}, {"id": 357, "type": "choice", "question": "He _____ ever visits his hometown these days.", "hint": "最近彼はめったに故郷を訪れない", "fullSentence": "He hardly ever visits his hometown these days.", "answer": "hardly", "choices": ["hardly", "hard", "lately", "recently"], "source": "IMG_0740", "explanation": "hardly ever「めったに〜ない」= scarcely ever。", "relatedInfo": "hard「熱心に」とhardly「ほとんど〜ない」の違いに注意。", "category": "紛らわしい語法(副詞)"}, {"id": 358, "type": "fill", "question": "He worked _____ to pass the exam.", "hint": "彼は試験に合格するために熱心に働いた", "fullSentence": "He worked hard to pass the exam.", "answer": "hard", "source": "IMG_0740", "explanation": "hard「熱心に、一生懸命」⇔hardly「ほとんど〜ない」つづりが似ているが意味が全く異なる。", "relatedInfo": "He hardly worked at all.「彼はほとんど働かなかった」", "category": "紛らわしい語法(副詞)"}, {"id": 359, "type": "choice", "question": "I haven't seen him _____ .", "hint": "最近彼を見ていない", "fullSentence": "I haven't seen him lately.", "answer": "lately", "choices": ["lately", "recently", "nowadays", "these days"], "source": "IMG_0740", "explanation": "lately「最近」現在完了とともに使われることが多い。recentlyも同義だが過去形とも共起する。", "relatedInfo": "nowadays, these daysは現在時制とともに使う。", "category": "紛らわしい語法(副詞)"}, {"id": 360, "type": "fill", "question": "He _____ finished his homework.", "hint": "彼はほとんど宿題を終えていない", "fullSentence": "He has scarcely finished his homework.", "answer": "scarcely", "source": "IMG_0740", "explanation": "scarcely「ほとんど〜ない」= hardly。", "relatedInfo": "scarcely...whenで「〜するとすぐに」の構文にもなる。", "category": "紛らわしい語法(副詞)"}, {"id": 361, "type": "choice", "question": "It is _____ convenient for me to meet you tomorrow.", "hint": "明日あなたに会うのはとても好都合だ", "fullSentence": "It is very convenient for me to meet you tomorrow.", "answer": "very", "choices": ["very", "much", "so much", "too much"], "source": "IMG_0740", "explanation": "be convenient for A「Aにとって都合が良い」形容詞なので普通の強調副詞veryを使う。", "relatedInfo": "convenient の主語は人ではなく物・事にする点に注意(He is convenient.とは言わない)。", "category": "紛らわしい語法(副詞)"}, {"id": 362, "type": "fill", "question": "It is _____ that he will succeed.", "hint": "彼が成功するのはほぼ確実だ", "fullSentence": "It is nearly certain that he will succeed.", "answer": "nearly", "source": "IMG_0740", "explanation": "nearly「ほとんど、ほぼ」= almost。", "relatedInfo": "mostly「主に」とは意味が異なる点に注意。", "category": "紛らわしい語法(副詞)"}, {"id": 363, "type": "choice", "question": "The stadium was _____ empty during the game.", "hint": "試合中スタジアムはほとんど誰もいなかった", "fullSentence": "The stadium was almost empty during the game.", "answer": "almost", "choices": ["almost", "nearly", "mostly", "hardly"], "source": "IMG_0740", "explanation": "almost「ほとんど」nearlyとほぼ同義で使われる。", "relatedInfo": "almost everyoneのように名詞を修飾する用法もある。", "category": "紛らわしい語法(副詞)"}, {"id": 364, "type": "fill", "question": "The students here are _____ from wealthy families.", "hint": "ここの学生は主に裕福な家庭の出身だ", "fullSentence": "The students here are mostly from wealthy families.", "answer": "mostly", "source": "IMG_0740", "explanation": "mostly「主に、大部分は」= for the most part。", "relatedInfo": "almost/nearly「ほとんど」との混同に注意。", "category": "紛らわしい語法(副詞)"}, {"id": 365, "type": "choice", "question": "There is room _____ improvement.", "hint": "改善の余地がある", "fullSentence": "There is room for improvement.", "answer": "for", "choices": ["for", "of", "in", "to"], "source": "IMG_0723", "explanation": "There is room for「〜の余地がある」。", "relatedInfo": "make room for A「Aのために場所を空ける」も頻出。", "category": "前置詞"}, {"id": 366, "type": "fill", "question": "He _____ a lot of baggage for the trip.", "hint": "彼はその旅行のためにたくさんの荷物を持って行った", "fullSentence": "He took up a lot of baggage for the trip.", "answer": "took up", "source": "IMG_0741", "explanation": "take up「(場所・時間)を占める」。", "relatedInfo": "two pieces of baggage「荷物2個」のようにbaggageは不可算名詞なのでpiece(s) ofで数える。", "category": "語彙(職業・数量表現)"}, {"id": 367, "type": "choice", "question": "Passengers must show their tickets to the _____ .", "hint": "乗客は係員に切符を見せなければならない", "fullSentence": "Passengers must show their tickets to the guest.", "answer": "guest", "choices": ["guest", "conductor", "visitor", "client"], "source": "IMG_0741", "explanation": "文脈から人物語彙を整理(client依頼人、audience観客、visitor訪問者、guest客、customer顧客、passenger乗客、spectator観衆)。", "relatedInfo": "passenger「乗客」がこの文の主語なので、確認先はconductor(車掌)などが自然。", "category": "語彙(職業・数量表現)"}, {"id": 368, "type": "fill", "question": "The lawyer met with his _____ to discuss the case.", "hint": "弁護士は事件について話し合うため依頼人と会った", "fullSentence": "The lawyer met with his client to discuss the case.", "answer": "client", "source": "IMG_0741", "explanation": "client「(弁護士などの)依頼人」。", "relatedInfo": "customer「(店の)顧客」、guest「(招待された)客」との違いに注意。", "category": "語彙(職業・数量表現)"}, {"id": 369, "type": "choice", "question": "The _____ applauded at the end of the concert.", "hint": "コンサートの最後に観客は拍手した", "fullSentence": "The audience applauded at the end of the concert.", "answer": "audience", "choices": ["audience", "spectator", "visitor", "passenger"], "source": "IMG_0741", "explanation": "audience「(コンサート・講演などの)聴衆」集合名詞。", "relatedInfo": "spectator「(スポーツなどの)観客」との違いに注意。", "category": "語彙(職業・数量表現)"}, {"id": 370, "type": "fill", "question": "You must pay the bus _____ before boarding.", "hint": "乗車前にバス代を払わなければならない", "fullSentence": "You must pay the bus fare before boarding.", "answer": "fare", "source": "IMG_0741", "explanation": "fare「(乗り物の)運賃」。", "relatedInfo": "fee「(サービスの)料金」、charge「(利用の)料金」、tax「税金」、fine「罰金」との区別。", "category": "語彙(職業・数量表現)"}, {"id": 371, "type": "choice", "question": "You have to pay an entrance _____ to enter the museum.", "hint": "その博物館に入るには入場料を払わなければならない", "fullSentence": "You have to pay an entrance fee to enter the museum.", "answer": "fee", "choices": ["fee", "fare", "fine", "tax"], "source": "IMG_0741", "explanation": "fee「(サービス・入場などの)料金」。", "relatedInfo": "fare「運賃」との使い分けに注意。", "category": "語彙(職業・数量表現)"}, {"id": 372, "type": "fill", "question": "He had to pay a _____ for speeding.", "hint": "彼はスピード違反で罰金を払わなければならなかった", "fullSentence": "He had to pay a fine for speeding.", "answer": "fine", "source": "IMG_0741", "explanation": "fine「罰金」。同じつづりの形容詞fine「元気な、素晴らしい」とは別の意味。", "relatedInfo": "pay a fine「罰金を払う」定型表現。", "category": "語彙(職業・数量表現)"}, {"id": 373, "type": "choice", "question": "What is your _____ ? — I am a doctor.", "hint": "あなたの職業は何ですか。—医者です", "fullSentence": "What is your occupation? — I am a doctor.", "answer": "occupation", "choices": ["occupation", "career", "task", "trade"], "source": "IMG_0741", "explanation": "occupation「職業」。career「経歴、キャリア」、task「業務、任務」、trade「職、貿易」との違い。", "relatedInfo": "What line of work are you in? も職業を尋ねる表現。", "category": "語彙(職業・数量表現)"}, {"id": 374, "type": "fill", "question": "What _____ are you in?", "hint": "どんな職種で働いていますか(慣用表現)", "fullSentence": "What line are you in?", "answer": "line", "source": "IMG_0741", "explanation": "What line are you in?「どんな仕事をしていますか」慣用的な職業を尋ねる表現。", "relatedInfo": "= What is your occupation?", "category": "語彙(職業・数量表現)"}, {"id": 375, "type": "choice", "question": "They _____ hands and became friends.", "hint": "彼らは握手をして友達になった", "fullSentence": "They shook hands and became friends.", "answer": "shook hands", "choices": ["shook hands", "took turns", "made friends", "gave regards"], "source": "IMG_0741", "explanation": "shake hands with A「Aと握手する」。", "relatedInfo": "take turns doing「交代で〜する」も同じページの慣用表現。", "category": "語彙(職業・数量表現)"}, {"id": 376, "type": "fill", "question": "Please give my _____ to your family.", "hint": "ご家族によろしくお伝えください", "fullSentence": "Please give my regards to your family.", "answer": "regards", "source": "IMG_0741", "explanation": "give one's regards to A「Aによろしく伝える」= remember me to A。", "relatedInfo": "= Please remember me to your family.", "category": "語彙(職業・数量表現)"}, {"id": 377, "type": "choice", "question": "He is _____ good terms with his neighbors.", "hint": "彼は近所の人たちと仲が良い", "fullSentence": "He is on good terms with his neighbors.", "answer": "on", "choices": ["on", "in", "at", "with"], "source": "IMG_0741", "explanation": "be on good terms with A「Aと仲が良い」。", "relatedInfo": "be on bad terms with A「Aと仲が悪い」", "category": "語彙(職業・数量表現)"}, {"id": 378, "type": "fill", "question": "I have _____ idea what to do next.", "hint": "次に何をすればいいのか見当もつかない", "fullSentence": "I have no idea what to do next.", "answer": "no", "source": "IMG_0741", "explanation": "have no idea「見当がつかない」= don't have any idea。", "relatedInfo": "疑問詞節を続けて「〜か見当がつかない」の形でよく使う。", "category": "語彙(職業・数量表現)"}, {"id": 379, "type": "choice", "question": "I will _____ you a line when I arrive.", "hint": "着いたら一筆(手紙を)送ります", "fullSentence": "I will drop you a line when I arrive.", "answer": "drop", "choices": ["drop", "give", "send", "write"], "source": "IMG_0741", "explanation": "drop A a line「Aに一筆送る、手紙を書く」口語的表現。", "relatedInfo": "= write a short letter to A", "category": "語彙(職業・数量表現)"}, {"id": 380, "type": "fill", "question": "He is not much _____ a musician.", "hint": "彼はたいしたミュージシャンではない", "fullSentence": "He is not much of a musician.", "answer": "of", "source": "IMG_0741", "explanation": "not much of a A「たいしたAではない」。", "relatedInfo": "something of a A「ちょっとしたA」と対比される表現。", "category": "語彙(職業・数量表現)"}];
